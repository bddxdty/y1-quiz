<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>计算机导论 · 第一单元 初识计算机</title>
<style>/* qb-page.css — 题库页面样式（内核共用，不含任何科目特有内容） */
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e4e8ef; --line2:#eef1f6;
  --text:#1e2330; --muted:#5b6373; --muted2:#6b7383;
  --accent:#2f6fed; --accent-ink:#2557c7; --accent-soft:#eaf1ff;
  --ok:#0b6b48; --ok-soft:#e7f7ef; --ok-line:#b7e6cf;
  --bad:#b42318; --bad-soft:#fdecea; --bad-line:#f6c9c4;
  --warn:#b54708; --warn-soft:#fef3e2;
  --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 72px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:14px}
.top h1{font-size:21px;margin:0;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.top .spacer{flex:1}
.home{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:6px 12px;background:#fff}
.home:hover{color:var(--accent);border-color:#c7dbff;text-decoration:none}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.block{padding:14px 16px;margin-bottom:14px}

/* stats */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;margin-bottom:14px}
.stat-k{font-size:12px;color:var(--muted2);letter-spacing:.3px}
.stat-v{font-size:19px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-bar{height:4px;border-radius:3px;background:#eef1f6;margin-top:7px;overflow:hidden}
.stat-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl+.ctl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.seg{display:inline-flex;background:#f1f4fa;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;color:#48505f}
.seg button:hover{color:var(--accent)}
.seg button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
select,input[type=search]{
  font:inherit;font-size:13.5px;color:var(--text);border:1px solid var(--line);background:#fff;
  border-radius:9px;padding:7px 10px;outline:none
}
select:focus,input[type=search]:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=search]{min-width:170px;flex:1}
.btn{
  border:1px solid var(--line);background:#fff;color:#3c4353;border-radius:9px;padding:7px 14px;
  font:inherit;font-size:13.5px;cursor:pointer;transition:.15s
}
.btn:hover:not(:disabled){border-color:#c7dbff;color:var(--accent);background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2557c7;border-color:#2557c7;color:#fff}
.btn.ghost{background:#fff}
.btn.ghost.on{color:#b54708;border-color:#f5dcb4;background:var(--warn-soft)}
.btn.small{padding:5px 11px;font-size:13px}

/* card */
#card{padding:18px 18px 16px;margin-bottom:14px}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fafbfd;white-space:nowrap}
.tag-type{color:var(--accent-ink);border-color:#c7dbff;background:var(--accent-soft)}
.tag-diff.d-0{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.tag-diff.d-1{color:var(--warn);border-color:#f5dcb4;background:var(--warn-soft)}
.tag-diff.d-2{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.q-topic{font-size:12.5px;color:var(--muted2)}
.q-no{margin-left:auto;font-size:12.5px;color:var(--muted2);font-variant-numeric:tabular-nums}
.q-stem{font-size:16.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.q-img{max-width:100%;margin-top:10px;border-radius:8px;border:1px solid var(--line)}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;
  font:inherit;font-size:15px;line-height:1.6;cursor:pointer;transition:.13s;color:var(--text)
}
.opt:hover:not(:disabled){border-color:#c7dbff;background:#fafcff}
.opt:disabled{cursor:default}
.opt-k{
  flex:0 0 24px;height:24px;border-radius:7px;background:#f1f4fa;color:#48505f;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600
}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .opt-k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.right .opt-k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .opt-k{background:var(--bad);color:#fff}

/* inputs */
.in,.ta{
  width:100%;margin-top:14px;font:inherit;font-size:15px;color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;background:#fff;resize:vertical
}
.in:focus,.ta:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
.in:disabled,.ta:disabled{background:#fafbfd;color:var(--muted)}

/* action bar */
.q-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hint{font-size:12.5px;color:var(--muted2)}
.verdict{font-size:14px;font-weight:650;padding:5px 12px;border-radius:999px}
.verdict.ok{color:var(--ok);background:var(--ok-soft)}
.verdict.bad{color:var(--bad);background:var(--bad-soft)}
.verdict.mid{color:var(--warn);background:var(--warn-soft)}

/* explanation */
.exp{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.exp-h{font-size:12.5px;color:var(--muted2);letter-spacing:.4px;margin-bottom:7px}
.exp-a{font-size:14.5px;margin:0 0 8px;padding:10px 12px;background:#f7f9fd;border-radius:9px;border:1px solid var(--line2)}
.exp-p{font-size:14.5px;color:#333a49;margin:0 0 6px;white-space:pre-wrap}
.exp-src{font-size:12px;color:var(--muted2);margin:6px 0 0}
.self{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}

/* nav */
#nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav-mid{flex:1;text-align:center;font-size:13px;color:var(--muted2);font-variant-numeric:tabular-nums}

/* mastery */
#mastery{padding:14px 16px;margin-bottom:14px}
.mt{width:100%;border-collapse:collapse;font-size:13.5px}
.mt th{text-align:left;font-weight:600;color:var(--muted2);font-size:12px;letter-spacing:.3px;padding:0 0 8px;border-bottom:1px solid var(--line2)}
.mt td{padding:7px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
.mt tr:last-child td{border-bottom:0}
.mt-t{color:#333a49}
.mt-s{font-variant-numeric:tabular-nums;font-weight:650;width:56px}
.mt-n{color:var(--muted2);width:56px;text-align:right}
.lv{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.lv-ok{color:var(--ok);background:var(--ok-soft)}
.lv-mid{color:var(--warn);background:var(--warn-soft)}
.lv-bad{color:var(--bad);background:var(--bad-soft)}

/* transfer */
#transfer{padding:14px 16px;margin-bottom:14px}
#x-code{width:100%;min-height:86px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:10px;resize:vertical;background:#fafbfd;color:#333a49}
#x-info{font-size:12.5px;color:var(--muted2);margin-top:8px;min-height:18px}
.x-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* misc */
.empty{padding:34px 8px;text-align:center}
.empty-t{font-size:15.5px;font-weight:600}
.empty-s{color:var(--muted2);font-size:13.5px;margin:6px 0 0}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:#1e2330;color:#fff;font-size:13.5px;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--muted2);font-size:12px;text-align:center;margin-top:18px;line-height:1.8}

@media (max-width:640px){
  .wrap{padding:14px 12px 64px}
  #stats{grid-template-columns:repeat(2,1fr)}
  .top h1{font-size:18.5px}
  .q-stem{font-size:16px}
  .opt{font-size:14.5px}
  input[type=search]{min-width:100%}
}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;
}
mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */
.q-stem mjx-container[display="true"],
.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;

mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;

/* 行间公式在窄屏可横向滚动，不撑破卡片 */

</style>

    </div>
  </details>

  <details class="panel block">
    <summary style="cursor:pointer;font-size:14px;font-weight:600">导出 / 导入进度码</summary>
    <div id="transfer" style="padding-top:10px">
      <div class="x-row">
        <select id="x-scope"></select>
        <button class="btn" id="x-do">生成</button>
        <button class="btn" id="x-copy">复制</button>
        <button class="btn" id="x-import">导入</button>
        <button class="btn" id="x-undo">撤销导入</button>

初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-003","type":"single","topic":"1.1 计算机的历史与发展","diff":"易","stem":"计算机的发展经历了从电子管到超大规模集成电路等几代的变革，各代的变革主要在于（　）。","exp":"四代计算机的划分依据是所采用的物理器件（电子管→晶体管→中小规模集成电路→大/超大规模集成电路），其核心体现为处理器芯片的变革。","options":["存储器","处理器芯片","操作系统","输入/输出设计"],"answer":[1],"meta":{"origin":{"id":"1-03","no":3,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-004","type":"single","topic":"1.1 计算机的历史与发展","diff":"易","stem":"摩尔定律指出芯片的性能大约每（　）个月翻一番，同时成本下降一半。","exp":"1965 年英特尔创始人之一戈登·摩尔提出：集成在微芯片上的晶体管数量每隔 18～24 个月翻一番，即微处理器性能每隔 18～24 个月提高一倍，价格下降一半。","options":["12～16","18～24","30～36","42～48"],"answer":[1],"meta":{"origin":{"id":"1-04","no":4,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-005","type":"fill","topic":"1.1 计算机的历史与发展","diff":"中","stem":"我国第一台电子计算机是 ____ 机，于 1958 年完成，型号为 DJS-1。","exp":"1958 年我国完成第一台电子管电子计算机 103 机（型号 DJS-1），运算速度达每秒 30 次。ENIAC 是美国的，曙光 I 号是巨型机系列。","answers":["103","103机","103 机"],"meta":{"origin":{"id":"1-05","no":5,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-006","type":"single","topic":"1.1 计算机的历史与发展","diff":"易","stem":"物理器件采用晶体管的计算机被称为第三代计算机。","exp":"错误。第一代（1946～1958）电子管；第二代（1958～1964）晶体管；第三代（1964～1970）中小规模集成电路；第四代（1971～今）大、超大规模集成电路。采用晶体管的应是第二代。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"1-06","no":6,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-007","type":"single","topic":"1.1 计算机的历史与发展","diff":"中","stem":"被后人称为“计算机之父”的科学家是（　）。","exp":"查尔斯·巴贝奇（Charles Babbage）发明差分机和分析机，被称为“计算机之父”；冯·诺依曼被称为“现代计算机之父”。","options":["巴贝奇","冯·诺依曼","图灵","香农"],"answer":[0],"meta":{"origin":{"id":"1-07","no":7,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-008","type":"single","topic":"1.1 计算机的历史与发展","diff":"易","stem":"提出“存储程序”和“程序控制”思想、奠定现代计算机体系结构的科学家是（　）。","exp":"1944～1945 年美籍匈牙利科学家冯·诺依曼提出 EDVAC 设计方案，提出采用二进制和“存储程序”两大设想，确立了现代计算机体系结构。","options":["图灵","摩尔","巴贝奇","冯·诺依曼"],"answer":[3],"meta":{"origin":{"id":"1-08","no":8,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-009","type":"single","topic":"1.1 计算机的历史与发展","diff":"中","stem":"Ada Lovelace 为巴贝奇的分析机设计了程序，被称为“第一位程序员”。","exp":"正确。Ada Lovelace（1815—1852）为巴贝奇的分析机设计了程序，被称为“第一位程序员”。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"1-09","no":9,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-010","type":"fill","topic":"1.1 计算机的历史与发展","diff":"中","stem":"中国第一台巨型计算机“银河-I”于 ____ 年在国防科技大学研制成功。","exp":"1983 年，慈云桂教授带领团队在国防科技大学研制成功“银河-I”，每秒 1 亿次运算，使中国成为继美国、日本之后第三个能独立设计和制造巨型计算机的国家。","answers":["1983","1983年"],"meta":{"origin":{"id":"1-10","no":10,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-011","type":"single","topic":"1.1 计算机的历史与发展","diff":"中","stem":"采用自主研发的“申威 26010”处理器、连续四次蝉联 TOP500 冠军的超级计算机是（　）。","exp":"“神威·太湖之光”由国家并行计算机工程技术研究中心研制，2016 年 6 月登顶，并连续四次蝉联 TOP500 冠军。天河二号则是“六连冠”。","options":["天河一号","神威·太湖之光","天河二号","曙光 5000A"],"answer":[1],"meta":{"origin":{"id":"1-11","no":11,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-012","type":"single","topic":"1.1 计算机的历史与发展","diff":"易","stem":"计算机最主要的工作特点是（　）。","exp":"计算机的核心工作特点是“存储程序与自动控制”：程序和数据存入存储器后，计算机自动、连续地取指并执行，无需人工干预。","options":["有记忆能力","存储程序与自动控制","可靠性与可用性","高速度与高精度"],"answer":[1],"meta":{"origin":{"id":"1-12","no":12,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-013","type":"single","topic":"1.1 计算机的历史与发展","diff":"中","stem":"奠定现代计算机结构理论、被称为“现代计算机之父”的科学家是（　）。","exp":"冯·诺依曼提出了“存储程序”原理与计算机由五部分组成的结构，被称为“现代计算机之父”。","options":["诺贝尔","爱因斯坦","冯·诺依曼","居里"],"answer":[2],"meta":{"origin":{"id":"1-13","no":13,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-014","type":"single","topic":"1.1 计算机的历史与发展","diff":"中","stem":"1938 年发表《继电器和开关电路的符号分析》、被誉为“信息论创始人”的科学家是香农。","exp":"正确。克劳德·香农（Claude Shannon）1938 年首次阐述如何将布尔代数运用于逻辑电路，奠定了现代电子计算机开关电路的理论基础，是信息论的创始人。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"1-14","no":14,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-015","type":"single","topic":"1.1 计算机的历史与发展","diff":"中","stem":"提出“图灵机”模型、奠定可计算理论基础的是（　）。","exp":"1936 年，24 岁的英国数学家图灵发表论文提出“图灵机”模型（理想计算机），奠定了可计算理论的基础；1950 年又提出“图灵测验”。","options":["图灵","冯·诺依曼","香农","巴贝奇"],"answer":[0],"meta":{"origin":{"id":"1-15","no":15,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-016","type":"multi","topic":"1.1 计算机的历史与发展","diff":"中","stem":"下列关于 ENIAC 的描述，正确的有（　）。","exp":"ENIAC 属于第一代计算机，物理器件是电子管（不是晶体管）。它使用了 18800 只电子管、1500 个继电器，占地 170㎡，重 30 吨，功率 150KW，5000 次加法/秒。","options":["1946 年诞生","由美国陆军弹道实验室为解决弹道特性计算问题而设计","物理器件采用了晶体管","使用了 18800 只电子管，重 30 吨"],"answer":[0,1,3],"meta":{"origin":{"id":"1-16","no":16,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-017","type":"multi","topic":"1.1 计算机的历史与发展","diff":"中","stem":"下列人物与其贡献对应正确的有（　）。","exp":"四项均正确。巴贝奇“计算机之父”；图灵建立图灵机模型、奠定可计算理论；冯·诺依曼“现代计算机之父”；香农奠定开关电路理论基础、信息论创始人。","options":["巴贝奇——发明差分机与分析机","图灵——建立图灵机模型","冯·诺依曼——提出存储程序原理","香农——将布尔代数运用于逻辑电路"],"answer":[0,1,2,3],"meta":{"origin":{"id":"1-17","no":17,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-018","type":"multi","topic":"1.1 计算机的历史与发展","diff":"易","stem":"关于摩尔定律，下列说法正确的有（　）。","exp":"四项均为摩尔定律的表述内容。摩尔定律揭示了信息技术进步的速度，被称为“计算机第一定律”。","options":["1965 年由戈登·摩尔提出","集成在微芯片上的晶体管数量每隔 18～24 个月翻一番","微处理器的性能每隔 18～24 个月提高一倍","价格比以前下降一半"],"answer":[0,1,2,3],"meta":{"origin":{"id":"1-18","no":18,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-019","type":"multi","topic":"1.1 计算机的历史与发展","diff":"中","stem":"我国自主研制的超级计算机包括（　）。","exp":"天河、神威、曙光是我国高性能计算赛道上的“三剑客”。天河二号曾获世界超算“六连冠”，神威·太湖之光连续四次蝉联冠军。","options":["天河一号","天河二号","神威·太湖之光","曙光 5000A"],"answer":[0,1,2,3],"meta":{"origin":{"id":"1-19","no":19,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-020","type":"single","topic":"1.1 计算机的历史与发展","diff":"中","stem":"ENIAC 是世界上第一台电子计算机，它采用了“存储程序”原理。","exp":"错误。ENIAC 是第一台电子计算机，但它通过硬件接线来设置程序，并没有采用“存储程序”原理；“存储程序”由冯·诺依曼在 EDVAC 方案中提出。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"1-20","no":20,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-021","type":"single","topic":"1.1 计算机的历史与发展","diff":"易","stem":"计算机的发展经历了四代，划分的依据是所采用的物理器件。","exp":"正确。四代的划分依据就是物理器件：电子管、晶体管、中小规模集成电路、大/超大规模集成电路。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"1-21","no":21,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-022","type":"single","topic":"1.1 计算机的历史与发展","diff":"易","stem":"世界上第一台电子计算机 ENIAC 诞生于英国。","exp":"错误。ENIAC 诞生于美国宾夕法尼亚大学，由美国陆军弹道实验室出资、为解决弹道特性计算问题而设计。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"1-22","no":22,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-023","type":"single","topic":"1.1 计算机的历史与发展","diff":"中","stem":"1971 年发明的 PASCAL 语言是为了纪念发明加法器的法国数学家帕斯卡。","exp":"正确。1642 年法国数学家 Blaise Pascal 发明了 Pascaline 加法器，是人类历史上第一个机械式计算机，PASCAL 语言即为其纪念。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"1-23","no":23,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-024","type":"fill","topic":"1.1 计算机的历史与发展","diff":"中","stem":"世界上第一台电子计算机的名称是 ____，诞生于 ____ 年。","exp":"ENIAC（电子数字积分计算机）于 1946 年 2 月诞生于宾夕法尼亚大学。填空时请依次填写：ENIAC、1946。","answers":["ENIAC 1946","ENIAC1946","ENIAC,1946","ENIAC 1946年","ENIAC和1946"],"meta":{"origin":{"id":"1-24","no":24,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-025","type":"fill","topic":"1.1 计算机的历史与发展","diff":"易","stem":"第一代电子计算机（1946～1958）采用的物理器件是 ____。","exp":"第一代计算机采用电子管，运算速度每秒 5 千～4 万次；第二代晶体管，第三代中小规模集成电路，第四代大/超大规模集成电路。","answers":["电子管","电子真空管","真空电子管"],"meta":{"origin":{"id":"1-25","no":25,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-026","type":"fill","topic":"1.1 计算机的历史与发展","diff":"中","stem":"世界超算史上第一台连续 6 次夺冠的超级计算机的名称是 ____。","exp":"“天河二号”超级计算机在 2013.6—2015.11 连续 6 次蝉联全球第一，获得世界超算“六连冠”，计算速度每秒 5.59 亿亿次。","answers":["天河二号","天河2号","天河二號","天河II","天河二号超级计算机"],"meta":{"origin":{"id":"1-26","no":26,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-027","type":"fill","topic":"1.1 计算机的历史与发展","diff":"易","stem":"摩尔定律指出，集成电路上可容纳的晶体管数目大约每 ____ 个月便会增加一倍。","exp":"戈登·摩尔（Gordon Moore）1965 年提出：晶体管数目大约每 18～24 个月增加一倍，性能提高一倍而价格下降一半。","answers":["18~24","18-24","18到24","18—24","18～24","18至24","18 到 24","18/24"],"meta":{"origin":{"id":"1-27","no":27,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-028","type":"comp","topic":"1.1 计算机的历史与发展","diff":"中","stem":"某超级计算机的峰值性能为 2.198 EFLOPS（1 EFLOPS = 10^18 次浮点运算/秒）。请计算它相当于每秒多少“亿亿次”浮点运算？","exp":"1 亿亿 = 10^8 × 10^8 = 10^16。\n2.198 EFLOPS = 2.198 × 10^18 = 2.198 × 10^18 ÷ 10^16 = 219.8（亿亿次/秒）。\n即：10^18 ÷ 10^16 = 100，故 1 EFLOPS = 100 亿亿次，2.198 × 100 = 219.8 亿亿次。","ref":"219.8 亿亿次/秒","meta":{"origin":{"id":"1-28","no":28,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）","tex":{"stem":"某超级计算机的峰值性能为 2.198 EFLOPS（1 EFLOPS $=10^{18}$ 次浮点运算/秒）。请计算它相当于每秒多少“亿亿次”浮点运算？"}},"_unit":"u1","views":{"stem":"某超级计算机的峰值性能为 2.198 EFLOPS（1 EFLOPS <mjx-container><svg style=\"vertical-align: -0.186ex;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"6.439ex\" height=\"2.14ex\" viewBox=\"0 -864 2845.9 946\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"><g stroke=\"currentColor\" fill=\"currentColor\" stroke-width=\"0\" transform=\"scale(1,-1)\"><g><g><use xlink:href=\"#MJX-TEX-N-3D\"><\/use><\/g><g transform=\"translate(1055.8,0)\"><g><use xlink:href=\"#MJX-TEX-N-31\"><\/use><use xlink:href=\"#MJX-TEX-N-30\" transform=\"translate(500,0)\"><\/use><\/g><g transform=\"translate(1033,393.1) scale(0.707)\" data-mjx-texclass=\"ORD\"><g><use xlink:href=\"#MJX-TEX-N-31\"><\/use><use xlink:href=\"#MJX-TEX-N-38\" transform=\"translate(500,0)\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> 次浮点运算/秒）。请计算它相当于每秒多少“亿亿次”浮点运算？"}},{"qid":"cs.u1-029","type":"comp","topic":"1.1 计算机的历史与发展","diff":"中","stem":"若某微处理器芯片上的晶体管数量按摩尔定律“每 2 年翻一番”增长，2020 年该芯片有 100 亿个晶体管，请估算 2030 年该芯片上的晶体管数量。","exp":"2020 → 2030 共 10 年，每 2 年翻一番，共翻 10 ÷ 2 = 5 番。\n100 亿 × 2^5 = 100 × 32 = 3200 亿个。","ref":"3200 亿个","meta":{"origin":{"id":"1-29","no":29,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-030","type":"short","topic":"1.1 计算机的历史与发展","diff":"中","stem":"简述计算机发展的四个阶段，并说明各阶段所采用的物理器件。","exp":"答题要点：①四代名称与年份；②各代物理器件；③总体趋势——体积变小、耗电量降低、可靠性提高、成本降低、速度提高。","ref":"第一代（1946～1958）：电子管，速度每秒 5 千～4 万次；第二代（1958～1964）：晶体管，每秒几十万～百万次；第三代（1964～1970）：中、小规模集成电路，每秒百万～几百万次；第四代（1971～今）：大、超大规模集成电路，每秒几百万～几亿次。","meta":{"origin":{"id":"1-30","no":30,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-031","type":"short","topic":"1.1 计算机的历史与发展","diff":"中","stem":"什么是摩尔定律？它对计算机的发展有什么影响？","exp":"答题要点：①提出者与时间；②核心内容（18～24 个月翻番、性能翻倍、价格减半）；③被称为“计算机第一定律”，指导了计算机产业的长期发展。","ref":"摩尔定律：1965 年英特尔创始人之一戈登·摩尔提出，集成在微芯片上的晶体管数量每隔 18～24 个月翻一番，即微处理器的性能每隔 18～24 个月提高一倍，而价格比以前下降一半。影响：它揭示了信息技术进步的速度，成为衡量计算机性能提升的规律性描述，推动了集成电路与微处理器的持续高速发展。","meta":{"origin":{"id":"1-31","no":31,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-032","type":"single","topic":"1.2 计算机的特点与分类","diff":"中","stem":"处理连续的物理量（如电压、电流）的计算机属于（　）。","exp":"模拟式计算机处理连续的物理量，所有数据用连续变化的模拟信号表示，精度较低、通用性较差，常用于过程控制和模拟仿真。","options":["数字式电子计算机","通用计算机","混合式电子计算机","模拟式电子计算机"],"answer":[3],"meta":{"origin":{"id":"1-32","no":32,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-033","type":"single","topic":"1.2 计算机的特点与分类","diff":"易","stem":"下列不属于计算机主要特点的是（　）。","exp":"计算机的五大特点为：运算速度快、计算精度高、记忆能力强、高度自动化、可靠性高。“绝对可靠、永不出故障”不是其特点。","options":["运算速度快","绝对可靠、永不出故障","记忆能力强","计算精度高"],"answer":[1],"meta":{"origin":{"id":"1-33","no":33,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-034","type":"single","topic":"1.2 计算机的特点与分类","diff":"易","stem":"为适应某种特殊应用而专门设计的计算机称为（　）。","exp":"按用途分：通用计算机可解决各种问题、通用性强；专用计算机为特定任务设计，功能较为单一，如工业控制计算机、军事制导计算机。","options":["通用计算机","专用计算机","混合计算机","数字计算机"],"answer":[1],"meta":{"origin":{"id":"1-34","no":34,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-035","type":"single","topic":"1.2 计算机的特点与分类","diff":"中","stem":"银行核心交易系统、航空票务管理一般使用（　）。","exp":"大型计算机运算速度次于超级计算机，支持数千用户同时在线处理，擅长结构化数据管理与事务型任务，强调“高可靠 + 多用户协同”。","options":["超级计算机","嵌入式计算机","微型计算机","大型计算机"],"answer":[3],"meta":{"origin":{"id":"1-35","no":35,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-036","type":"multi","topic":"1.2 计算机的特点与分类","diff":"易","stem":"计算机的主要特点包括（　）。","exp":"四项均为计算机的特点。微处理器处理速度可达每秒几十亿次；精度可达十几位甚至几十位有效数字；可存储数据、结果与指令；按“存储程序控制”自动执行。","options":["运算速度快","计算精度高","记忆能力强","高度自动化、可靠性高"],"answer":[0,1,2,3],"meta":{"origin":{"id":"1-36","no":36,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-037","type":"multi","topic":"1.2 计算机的特点与分类","diff":"中","stem":"按照计算机信息处理原理，可将计算机分为（　）。","exp":"按信息处理原理分为数字式、模拟式、混合式三类；通用计算机是按“用途”划分的类别，不属于此分类。","options":["数字式电子计算机","模拟式电子计算机","混合式电子计算机","通用计算机"],"answer":[0,1,2],"meta":{"origin":{"id":"1-37","no":37,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-038","type":"single","topic":"1.2 计算机的特点与分类","diff":"中","stem":"模拟式电子计算机处理的是时间上离散的数字信号。","exp":"错误。处理时间上离散的数字信号、用二进制 0 和 1 表示数据的是“数字式”计算机；模拟式计算机处理的是连续的物理量。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"1-38","no":38,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-039","type":"single","topic":"1.2 计算机的特点与分类","diff":"易","stem":"通用计算机可以通过安装不同的软件来扩展其功能。","exp":"正确。通用计算机功能丰富，用户可通过安装不同软件扩展功能，适用场景多样（办公、娱乐、计算等）。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"1-39","no":39,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-040","type":"fill","topic":"1.2 计算机的特点与分类","diff":"易","stem":"按照计算机信息处理原理，可将计算机分为数字式、____ 和混合式三类。","exp":"数字式处理离散数字信号；模拟式处理连续物理量；混合式结合两者特点，通过转换装置相互连接。","answers":["模拟式","模拟式电子计算机","模拟式计算机","模拟型"],"meta":{"origin":{"id":"1-40","no":40,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-041","type":"fill","topic":"1.2 计算机的特点与分类","diff":"易","stem":"按用途划分，计算机可分为通用计算机和 ____。","exp":"通用计算机可解决各种问题、通用性强；专用计算机为适应某种特殊应用而设计，功能较为单一。","answers":["专用计算机","专用机"],"meta":{"origin":{"id":"1-41","no":41,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-042","type":"short","topic":"1.2 计算机的特点与分类","diff":"易","stem":"简述计算机的五大特点。","exp":"答题要点：五个特点各写一句并简要说明即可。","ref":"①运算速度快：微处理器处理速度可达每秒几十亿次；②计算精度高：具有十几位甚至几十位有效数字，精度可达千分之几至几百万分之几；③记忆能力强：存储容量不断加大，可将数据、结果、计算指令全部存储；④高度自动化：“存储程序控制”，按指令逻辑顺序自动、连续地取指并执行；⑤可靠性高。","meta":{"origin":{"id":"1-42","no":42,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-043","type":"single","topic":"1.3 计算机的工作原理","diff":"易","stem":"根据冯·诺依曼计算机的设计思想，计算机硬件由五个基本部分组成，不属于这五个基本组成部分的是（　）。","exp":"冯·诺依曼计算机的五大部件是：运算器、控制器、存储器、输入设备、输出设备。总线不属于这五个基本组成部分。","options":["输入设备和输出设备","存储器","运算器和控制器","总线"],"answer":[3],"meta":{"origin":{"id":"1-43","no":43,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-044","type":"multi","topic":"1.3 计算机的工作原理","diff":"中","stem":"冯·诺依曼提出的计算机制造三个基本原则包括（　）。","exp":"三个基本原则：二进制逻辑、程序存储执行、计算机由五部分组成（运算器、控制器、存储器、输入设备、输出设备）。","options":["采用二进制逻辑","采用十进制运算","计算机由五个部分组成","程序存储执行"],"answer":[0,2,3],"meta":{"origin":{"id":"1-44","no":44,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-045","type":"multi","topic":"1.3 计算机的工作原理","diff":"中","stem":"冯·诺依曼计算机的五大基本部件包括（　）。","exp":"四项均属于五大基本部件。冯·诺依曼体系构成了绝大多数现代电子计算机的物理形态基础。","options":["运算器","控制器","存储器","输入设备与输出设备"],"answer":[0,1,2,3],"meta":{"origin":{"id":"1-45","no":45,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-046","type":"single","topic":"1.3 计算机的工作原理","diff":"易","stem":"图灵机模型为计算机的逻辑功能奠定了理论基础，是现代计算机的理论源头。","exp":"正确。图灵机用无限长的纸带、读写头、状态寄存器和一套规则表模拟“人按规则做计算”的过程，奠定了可计算理论的基础。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"1-46","no":46,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-047","type":"single","topic":"1.3 计算机的工作原理","diff":"中","stem":"计算机的输出结果只取决于所执行的程序，与输入的数据无关。","exp":"错误。输出结果依赖于“数据”和“程序”两方面的作用：相同的程序配不同数据结果不同，相同数据配不同程序结果也不同。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"1-47","no":47,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-048","type":"fill","topic":"1.3 计算机的工作原理","diff":"中","stem":"计算机最主要的工作特点是 ____ 与 ____。","exp":"即“存储程序与自动控制”（也可表述为“存储程序和程序控制”）：程序和数据一起存入存储器，运行时自动取指并执行。","answers":["存储程序 自动控制","存储程序自动控制","存储程序和自动控制","存储程序,自动控制","存储程序、自动控制","存储程序 程序控制"],"meta":{"origin":{"id":"1-48","no":48,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-049","type":"fill","topic":"1.3 计算机的工作原理","diff":"中","stem":"冯·诺依曼计算机的五大基本部件是运算器、控制器、____、输入设备和输出设备。","exp":"五大部件：运算器、控制器、存储器、输入设备、输出设备。","answers":["存储器","内存","内存条","主存"],"meta":{"origin":{"id":"1-49","no":49,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-050","type":"short","topic":"1.3 计算机的工作原理","diff":"中","stem":"简述“存储程序和程序控制”的基本思想。","exp":"答题要点：①程序与数据一起存入存储器；②运行时自动、顺序取指并执行；③意义——摆脱硬件接线、提高灵活性与通用性。","ref":"把程序（计算机如何进行操作的指令序列）和数据通过输入设备一起输入并存储在计算机的存储器中；计算机运行时自动从存储器中取出指令并送到控制器执行，执行指令规定的操作，实现程序的自动执行，重复直到程序中指令执行完毕。这一思想解决了早期计算机程序需要通过硬件接线来设置的弊端，极大地提高了计算机的灵活性和通用性。","meta":{"origin":{"id":"1-50","no":50,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-051","type":"single","topic":"1.4 计算机的应用","diff":"易","stem":"在下列计算机应用项目中，属于科学计算应用领域的是（　）。","exp":"气象预报属于科学与工程计算（数值计算）应用；数控机床属于过程控制，人机对弈属于人工智能，民航联网订票属于信息管理与数据处理。","options":["数控机床","人机对弈","气象预报","民航联网订票系统"],"answer":[2],"meta":{"origin":{"id":"1-51","no":51,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-052","type":"single","topic":"1.4 计算机的应用","diff":"易","stem":"计算机辅助设计的英文缩写是（　）。","exp":"CAD 计算机辅助设计；CAM 计算机辅助制造；CAI 计算机辅助教学；CBE 计算机辅助教育。","options":["CAI","CAM","CAD","CAE"],"answer":[2],"meta":{"origin":{"id":"1-52","no":52,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-053","type":"multi","topic":"1.4 计算机的应用","diff":"易","stem":"下列属于计算机辅助技术的有（　）。","exp":"四项均属于计算机辅助技术。","options":["计算机辅助设计 CAD","计算机辅助制造 CAM","计算机辅助教育 CBE","计算机辅助教学 CAI"],"answer":[0,1,2,3],"meta":{"origin":{"id":"1-53","no":53,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-054","type":"single","topic":"1.4 计算机的应用","diff":"易","stem":"数控机床控制、电力系统调度属于计算机的过程控制与自动化应用。","exp":"正确。过程控制与自动化指工业生产中通过计算机实时监控和调节生产过程，如机械制造流水线自动化、电力系统调度、数控机床等。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"1-54","no":54,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-055","type":"fill","topic":"1.4 计算机的应用","diff":"易","stem":"计算机辅助制造的英文缩写是 ____。","exp":"CAM = Computer Aided Manufacturing，计算机辅助制造。","answers":["CAM"],"meta":{"origin":{"id":"1-55","no":55,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-056","type":"fill","topic":"1.4 计算机的应用","diff":"中","stem":"天气预报、卫星运行轨迹计算、桥梁结构力学分析属于计算机的 ____ 应用领域。","exp":"即“科学与工程计算”，解决数学、物理、化学等学科及工程中的复杂计算问题。","answers":["科学与工程计算","科学计算","数值计算","科学与工程计算（数值计算）"],"meta":{"origin":{"id":"1-56","no":56,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-057","type":"single","topic":"1.5 计算机的发展趋势","diff":"易","stem":"目前计算机的发展更加趋于巨型化、微型化、网络化和（　）。","exp":"计算机的发展趋势为：巨型化、微型化、网络化、智能化。","options":["集中化","单一化","大型化","智能化"],"answer":[3],"meta":{"origin":{"id":"1-57","no":57,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-058","type":"single","topic":"1.5 计算机的发展趋势","diff":"中","stem":"1975 年问世的世界上第一台超级计算机是（　）。","exp":"1975 年世界上第一台超级计算机“Cray-I”问世。Altair 8800 是微型计算机的代表机型。","options":["Cray-I","Cray-II","ENIAC","Altair 8800"],"answer":[0],"meta":{"origin":{"id":"1-58","no":58,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-059","type":"single","topic":"1.5 计算机的发展趋势","diff":"中","stem":"“机器人三原则”的提出者是（　）。","exp":"机器人三原则由科幻作家阿西莫夫于 1940 年提出：不得伤害人类；必须服从人类命令（除非与第一条矛盾）；必须保护自己（除非与以上两条矛盾）。","options":["冯·诺依曼","笛卡尔","图灵","阿西莫夫"],"answer":[3],"meta":{"origin":{"id":"1-59","no":59,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-060","type":"multi","topic":"1.5 计算机的发展趋势","diff":"易","stem":"计算机的发展趋势包括（　）。","exp":"四项均为计算机的发展趋势。","options":["巨型化","微型化","网络化","智能化"],"answer":[0,1,2,3],"meta":{"origin":{"id":"1-60","no":60,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-061","type":"multi","topic":"1.5 计算机的发展趋势","diff":"中","stem":"下列属于“新一代计算机”设想的有（　）。","exp":"新一代计算机设想包括：光子计算机、DNA 计算机、量子计算机、超导计算机、纳米计算机（碳纳米管）等。","options":["光子计算机","DNA 计算机","量子计算机","超导计算机"],"answer":[0,1,2,3],"meta":{"origin":{"id":"1-61","no":61,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-062","type":"single","topic":"1.5 计算机的发展趋势","diff":"中","stem":"微型化主要以微处理器的发展为特征，每 2～3 年更新一代，性能约 2 年提高 1 倍。","exp":"正确。微型化即体积微型化，以微处理器的发展为特征，发展非常迅速。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"1-62","no":62,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-063","type":"fill","topic":"1.5 计算机的发展趋势","diff":"易","stem":"计算机的发展趋势是巨型化、微型化、____ 和智能化。","exp":"即资源网络化：利用通信技术和计算机技术，将分布在不同地点的计算机互联起来，按网络协议相互通信，达到硬件、软件、数据资源共享的目的。","answers":["网络化"],"meta":{"origin":{"id":"1-63","no":63,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-064","type":"single","topic":"1.6 计算思维","diff":"中","stem":"应用计算思维解决实际问题，通常需要经过的三个步骤是（　）。","exp":"三个步骤：抽象（将问题抽象成数据符号化表示）、理论（寻找或证明与问题相关的理论）、设计（设计并实现算法或系统以解决问题）。","options":["分析、综合、评价","抽象、理论、设计","输入、处理、输出","观察、假设、实验"],"answer":[1],"meta":{"origin":{"id":"1-64","no":64,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-065","type":"fill","topic":"1.6 计算思维","diff":"中","stem":"应用计算思维解决实际问题通常需要经过抽象、____、设计三个步骤。","exp":"抽象 → 理论 → 设计。","answers":["理论"],"meta":{"origin":{"id":"1-65","no":65,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-066","type":"short","topic":"1.2 计算机的特点与分类","diff":"中","stem":"简述计算机的三种常见分类方式及各自的分类型。","exp":"答题要点：三种分类维度 + 各自的分类型与典型特点。","ref":"①按信息处理原理分：数字式电子计算机（处理离散的数字信号，用二进制表示和处理数据，精度高、通用性强）、模拟式电子计算机（处理连续的物理量，精度较低、通用性较差）、混合式电子计算机（结合两者特点，通过转换装置相互连接）。②按用途分：通用计算机（可解决各种问题、通用性强）和专用计算机（为适应某种特殊应用而设计，功能较单一）。③按综合性能指标（字长、运算速度、存储规模、处理任务复杂度）分：超级计算机、大型计算机、微型计算机、嵌入式计算机，以及新兴高性能计算机（量子计算机、生物计算机）。","meta":{"origin":{"id":"1-66","no":66,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-067","type":"short","topic":"1.3 计算机的工作原理","diff":"中","stem":"简述图灵模型与冯·诺依曼模型的关系。","exp":"答题要点：图灵模型解决理论（可计算性），冯·诺依曼模型解决物理实现与运行机制，后者基于前者。","ref":"图灵模型（1937 年由图灵提出）的核心是“图灵机”，用一条无限长的纸带、一个读写头、状态寄存器和一套规则表，模拟“人按规则做计算”的整个过程，为计算机的逻辑功能奠定了理论基础，是现代计算机的理论源头。冯·诺依曼模型基于图灵模型的理论框架，解决了计算机的物理实现和运行机制问题，直接指导了实际计算机的硬件设计，其核心思想是“存储程序和程序控制”。因此，图灵模型解决“可计算性”的理论问题，冯·诺依曼模型解决“如何物理实现”的问题，前者启发并支撑了后者。","meta":{"origin":{"id":"1-67","no":67,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-068","type":"short","topic":"1.4 计算机的应用","diff":"易","stem":"简述计算机的主要应用领域。","exp":"答题要点：至少列出 6～8 个领域并各举一例。","ref":"①科学与工程计算：解决数学、物理、化学等学科及工程中的复杂计算，如天气预报、卫星运行轨迹、桥梁结构力学分析；②信息管理与数据处理：在企业管理、金融、政务等领域处理海量数据，如火车航空票务系统、电子政务、银行账务管理；③过程控制与自动化：工业生产中实时监控和调节生产过程，如机械制造流水线自动化、电力系统调度、数控机床；④计算机辅助技术：CAD、CAM、CBE、CAI；⑤人工智能与智能应用：语音识别、图像分类、自动驾驶、智能推荐、机器人技术、专家系统；⑥计算机通信与网络应用：电子邮件、网页浏览、视频会议、网络购物；⑦多媒体与娱乐：影视制作、游戏开发、虚拟现实与增强现实；⑧军事与国防：军事指挥系统、武器系统控制、情报分析。","meta":{"origin":{"id":"1-68","no":68,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"},{"qid":"cs.u1-069","type":"short","topic":"1.5 计算机的发展趋势","diff":"中","stem":"简述计算机的发展趋势，并列举几种“新一代计算机”的设想。","exp":"答题要点：四大趋势（巨型化、微型化、网络化、智能化）各一句话说明；新一代计算机列举 3 种以上。","ref":"计算机的发展趋势有四个方面：①巨型化——功能巨型化，指高速运算、大存储容量和超强功能，如超级计算机；②微型化——体积微型化，以微处理器的发展为特征，每 2～3 年更新一代，性能约 2 年提高 1 倍；③网络化——资源网络化，利用通信技术和计算机技术将分布在不同地点的计算机互联起来，按网络协议相互通信，达到硬件、软件、数据资源共享的目的；④智能化——处理智能化，使计算机具有人工智能，能进行图像识别、定理证明、语言理解、语音识别等。新一代计算机的设想包括：光子计算机、DNA 计算机、量子计算机、超导计算机、纳米计算机（碳纳米管）等。","meta":{"origin":{"id":"1-69","no":69,"mod":"第 1 章 初识计算机","ch":1},"source":"计算机导论 题库合集（原站）"},"_unit":"u1"}]}],"wrong":{"exitStreak":1},"mastery":{"wAll":0.4,"wRecent":0.6,"recentN":5,"weakBelow":60,"solidAt":85,"solidStreak":4,"passMinQ":4,"passRate":0.9,"dueDays":[1,3,7]},"codec":{"version":10,"gidBits":32,"budgetBytes":6000},"order":["g7b36b9f9","geb76ff8a","g5604cb4e","gbbf40dfe","g53d3c631","gc8006e41","gdde89a21","gffcece9c","gbf4af0af","gf58d538b","g986a45cb","g16fafab6","g390c53cf","gd341e104","g5caa97bb","g63505a11","g262242e2","g53357d53","g15895c5a","gb37205e6","ga8ff66f5","gf78a1598","g2312f909","gd84ac421","g531e9c29","g11a301b7","g9182d1cb","g5ac960f1","g879fc5c7","g7d406c09","ge31b0414","ga0a1269f","gd6d7ba22","g96ce59ac","g1d239cea","g40f44857","g039b0e40","g2f3b78a4","g01c4cc52","g8a075482","g60a43282","gc2a5be02","g429eefc9","g9336931d","g1ca6d6e6","g3929ecd5","g6973d129","g3abb4969","ge0a933a7","gb120c052","g7d8fc4da","g1b380426","g97d834a5","g741c176d","gf4dc7861","g1235df51","g4f107c97","g8fdb65e0","g698ac205","ge61b55d3","g667cadf8","gabc70a0d","g77e9b112","g445ffe28","g16cd76e7","gb3fdad90","gcb5ba655","gd0d46845","g54bc7b55","gf6075fe1","g25a2682d","g057bd0db","g3b63256f","gbfab8367","g03aab32a","gb636e3f9","g3dcab7a9","g614ccd92","g884fb846","ge937909f","g11f716f7","g8ec3308b","g1a5f3cef","g96f701f5","g242e98e4","ge2157664","gf18eec25","g8e96cd21","gf0386650","g09d71ed5","g92ff9098","g064ea04e","gc83c3a94","g4af76b06","g3da490b9","g0808d4bc","ge3203fc6","g6fa225e2","g7c9f9f44","g4a2157b0","g25025c87","g104b192e","ge7adff58","ga387e22f","gfa59440f","g08e3bcf7","ge01cfa65","g6dea2267","g13218d7e","g65e9e0ef","g79d528ac","g599a0546","g2517f4     var tpos = reader.bytesUsed(), texts = {};
    for (var j = 0; j < total; j++) {
      if (!(txtBits[j >> 3] & (1 << (j & 7)))) continue;
      if (tpos >= bin.length) break;
      var ln = bin[tpos++];
      texts[gids[j]] = utf8Decode(bin.slice(tpos, tpos + ln));
      tpos += ln;
    }
    return { kind: 'site', key: '', ans: ans, fav: fav, texts: texts, v: 9 };
  };

  /* ---- 旧版本机记录迁移：csg_*（gid 键）与 csunitN_*（旧题号键） ---- */

  var LEGACY_RE = /^(?:csg|cs(?:unit\d+|exam|terms|calc|midterm))_(ans|wrong|fav)_v1$/;

  function toRecord(r) {
    if (!r || typeof r !== 'object') return null;
    var ok = r.ok === true ? true : (r.ok === false ? false : null);
    var picked = Array.isArray(r.picked) ? r.picked : (Array.isArray(r.p) ? r.p : null);
    var text = r.text != null ? r.text : (r.x != null ? r.x : '');
    var answered = !!picked || !!text || ok !== null || r.done === true;
    if (!answered) return null;
    var rec = { ok: ok, at: typeof r.at === 'number' ? r.at : Date.now() };
    if (picked && picked.length) {
      rec.p = picked.filter(function (k) { return typeof k === 'number' && k >= 0; })
        .sort(function (a, b) { return a - b; });
    }
    if (text) rec.x = cleanText(text).trim();
    if (r.self === true) rec.self = true;
    if (typeof r.c === 'number') rec.c = r.c;
    return rec;
  }

  function eachLegacyEntry(value, fn) {
    if (value == null) return;
    if (Array.isArray(value)) { value.forEach(function (g) { if (typeof g === 'string') fn(g, 1); }); return; }
    if (typeof value !== 'object') return;
    Object.keys(value).forEach(function (g) { fn(g, value[g]); });
  }

  // 幂等：迁移过一次就记标记，不重复覆盖用户此后产生的记录
  Site.prototype.migrateLegacy = function () {
    var store = this.store;
    if (store.get('migrated', null)) return { skipped: true, ans: 0, wrong: 0, fav: 0 };
    if (typeof localStorage === 'undefined' || !localStorage.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    var idMap = this.legacyIdMap || {};
    var ans = store.get('ans', {});
    var wrong = store.get('wrong', {});
    var fav = store.get('fav', {});
    var self = this;
    var counts = { ans: 0, wrong: 0, fav: 0, orphan: 0 };
    var handled = [];

    function resolve(key) {
      if (/^g[0-9a-f]{8}([0-9a-f]{8})?$/.test(key)) return key;
      return idMap[key] || null;
    }

    var names = [];
    for (var i = 0; i < localStorage.length; i++) names.push(localStorage.key(i));

    names.forEach(function (name) {
      var m = LEGACY_RE.exec(name);
      if (!m) return;
      var kind = m[1];
      var raw;
      try { raw = JSON.parse(localStorage.getItem(name) || 'null'); } catch (e) { return; }
      handled.push(name);

      eachLegacyEntry(raw, function (key, val) {
        var gid = resolve(key);
        if (!gid) { counts.orphan++; return; }
        if (kind === 'ans') {
          var rec = toRecord(val);
          if (!rec) return;
          if (!ans[gid]) { ans[gid] = rec; counts.ans++; }
          else if (ans[gid].ok === null && rec.ok !== null) { ans[gid] = rec; counts.ans++; }
        } else if (kind === 'wrong') {
          if (!wrong[gid]) { wrong[gid] = typeof val === 'number' ? val : Date.now(); counts.wrong++; }
        } else if (kind === 'fav') {
          if (!fav[gid]) { fav[gid] = (val && typeof val === 'object' && typeof val.t === 'number') ? val.t : Date.now(); counts.fav++; }
        }
      });
    });

    if (!handled.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    store.set('ans', ans);
    store.set('wrong', wrong);
    store.set('fav', fav);
    store.set('migrated', { at: Date.now(), from: handled, counts: counts });
    // 旧键一律不删：回退到旧页面仍可用（规范 8.2 第 4 条）
    return counts;
  };

  // 导入：只覆盖作用域内，域外原样保留（规范 3.3）
  Site.prototype.importCode = function (code) {
    var snapshot = {
      ans: this.store.get('ans', {}), wrong: this.store.get('wrong', {}), fav: this.store.get('fav', {})
    };
    this.store.set('bak', { at: Date.now(), data: snapshot });

    var got = this.decode(code);
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var self = this;
    var touched = 0;

    Object.keys(got.ans).forEach(function (g) {
      var incoming = got.ans[g];
      if (got.texts[g] != null) incoming.x = cleanText(got.texts[g]);
      ans[g] = mergeRecord(ans[g] || null, incoming);
      if (incoming.ok === false) wrong[g] = Date.now();
      touched++;
    });
    Object.keys(got.fav).forEach(function (g) { fav[g] = fav[g] || Date.now(); });

    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    return { kind: got.kind, key: got.key, count: touched, v: got.v || 10 };
  };

  Site.prototype.undoImport = function () {
    var bak = this.store.get('bak', null);
    if (!bak) return false;
    this.store.set('ans', bak.data.ans || {});
    this.store.set('wrong', bak.data.wrong || {});
    this.store.set('fav', bak.data.fav || {});
    return true;
  };

  /* ---- 统计（三级口径，分母一律 gid 去重） ---- */

  Site.prototype.stats = function (unitKey) {
    var self = this;
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var gids = unitKey ? this.scopeGids('unit', unitKey) : this.order.slice();
    var seen = {}, total = 0, answered = 0, correct = 0, wrongN = 0, favN = 0;
    gids.forEach(function (g) {
      if (seen[g]) return;
      seen[g] = 1;
      total++;
      var r = ans[g];
      if (r) {
        answered++;
        if (r.ok === true) correct++;
      }
      if (wrong[g]) wrongN++;
      if (fav[g]) favN++;
    });
    return {
      total: total, answered: answered, correct: correct,
      rate: answered ? Math.round(100 * correct / answered) : null,
      wrong: wrongN, fav: favN
    };
  };

  var QB = {
    fpNorm: fpNorm, fpHash: fpHash, fingerprint: fingerprint,
    norm: norm, judge: judge, fuzzyEq: fuzzyEq, cleanText: cleanText,
    maskWidth: maskWidth, mergeRecord: mergeRecord,
    Store: Store, Site: Site,
    create: function (def, store) { return new Site(def, store); }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = QB;
  else root.QB = QB;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>/* qb-sync.js — 云端同步（手动上传 / 下载，不做任何自动网络请求）
 *
 * 与线上原方案C 完全同一套契约，保证老页面与新页面读写同一行、同一份数据：
 *   环境      window.QB_SYNC.env
 *   RPC       POST <env>.api.tcloudbasegateway.com/v1/rdb/rest/rpc/quiz_pull | quiz_push
 *   鉴权      Authorization: Bearer <publishable key>
 *   行键      (同步码, 'global')，全站一行
 *   payload   {v:1, quiz:'global', at, ans:{gid:{picked,text,done,ok,self,upd}}, del:{gid:t}, fav:{gid:{on,t}}}
 *   同步码    localStorage['csquiz_sync_code_v1']（与旧页面共用，用户不用重填）
 *
 * 内核内部记录用规范 3.2 的短键（ok/at/p/x/self），payload 用旧站的长键。
 * 转换集中在本文件的 toRemote / fromRemote，两端格式谁都不改，所以新旧页面可以并存。
 */
(function (root) {
  'use strict';

  var QB = root.QB;
  if (!QB) return;

  function Sync(site, cfg) {
    this.site = site;
    this.cfg = cfg || {};
    this.env = this.cfg.env || '';
    this.key = this.cfg.key || '';
    this.code = this.cfg.code || '';
    this.quiz = this.cfg.quiz || 'global';
    this.base = this.cfg.rpc || ('https://' + this.env + '.api.tcloudbasegateway.com/v1/rdb/rest/rpc/');
    this.busy = false;
    this.lastMsg = '';
    this.lastAt = 0;
    this.codeKey = this.cfg.codeKey || 'csquiz_sync_code_v1';
    this.stateKey = 'qb.site.sync.v1';
    var st = this._load();
    if (!this.code && st.code) this.code = st.code;
  }

  Sync.prototype._load = function () {
    try {
      var raw = (typeof localStorage !== 'undefined') ? localStorage.getItem(this.stateKey) : null;
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  };

  Sync.prototype._save = function (patch) {
    var st = this._load();
    for (var k in patch) st[k] = patch[k];
    st.at = Date.now();
    try { if (typeof localStorage !== 'undefined') localStorage.setItem(this.stateKey, JSON.stringify(st)); } catch (e) {}
  };

  Sync.prototype.configured = function () {
    return !!this.env && this.key.length > 20 && this.key.indexOf('__') !== 0;
  };

  Sync.prototype.enabled = function () { return this.configured() && !!this.code; };

  Sync.prototype.setCode = function (v) {
    this.code = QB.cleanText(v).trim().toUpperCase();
    this._save({ code: this.code });
    try { if (typeof localStorage !== 'undefined') localStorage.setItem(this.codeKey, this.code); } catch (e) {}
  };

  Sync.prototype.readSharedCode = function () {
    try {
      var v = (typeof localStorage !== 'undefined') ? localStorage.getItem(this.codeKey) : '';
      if (v && !this.code) { this.code = v; }
      return this.code || '';
    } catch (e) { return this.code || ''; }
  };

  /* ---------- 记录形态转换 ---------- */

  function toRemote(rec) {
    if (!rec) return null;
    var picked = Array.isArray(rec.p) ? rec.p.slice(0, 16) : [];
    var text = rec.x == null ? '' : String(rec.x).slice(0, 2000);
    return {
      picked: picked,
      text: text,
      done: rec.ok !== null || picked.length > 0 || text.length > 0,
      ok: rec.ok === true ? true : (rec.ok === false ? false : null),
      self: rec.self === true ? true : null,
      upd: typeof rec.at === 'number' ? rec.at : 0
    };
  }

  function fromRemote(r) {
    if (!r || typeof r !== 'object') return null;
    var rec = { ok: r.ok === true ? true : (r.ok === false ? false : null), at: typeof r.upd === 'number' ? r.upd : Date.now() };
    if (Array.isArray(r.picked) && r.picked.length) {
      rec.p = r.picked.filter(function (k) { return typeof k === 'number' && k >= 0 && k < 16; })
        .sort(function (a, b) { return a - b; });
    }
    if (typeof r.text === 'string' && r.text) rec.x = QB.cleanText(r.text);
    if (r.self === true) rec.self = true;
    return rec;
  }

  Sync.prototype._localSnap = function () {
    var site = this.site;
    var ans = site.allAns(), wrong = site.allWrong(), fav = site.allFav();
    var known = {};
    site.questions.forEach(function (q) { known[q._gid] = 1; });
    var snap = { ans: {}, del: {}, fav: {} };
    Object.keys(ans).forEach(function (g) {
      if (!known[g]) return;
      var r = toRemote(ans[g]);
      if (r) snap.ans[g] = r;
    });
    Object.keys(fav).forEach(function (g) { if (known[g]) snap.fav[g] = { on: true, t: fav[g] || 0 }; });
    return snap;
  };

  Sync.prototype._remoteSnap = function (payload) {
    var known = {};
    this.site.questions.forEach(function (q) { known[q._gid] = 1; });
    var snap = { ans: {}, del: {}, fav: {} };
    var a = (payload && payload.ans) || {};
    var d = (payload && payload.del) || {};
    var f = (payload && payload.fav) || {};
    Object.keys(a).forEach(function (g) {
      if (!known[g]) return;
      var r = fromRemote(a[g]);
      if (r) snap.ans[g] = toRemote(r);
    });
    Object.keys(d).forEach(function (g) { if (known[g] && typeof d[g] === 'number') snap.del[g] = d[g]; });
    Object.keys(f).forEach(function (g) {
      if (known[g] && f[g] && typeof f[g] === 'object') snap.fav[g] = { on: f[g].on === true, t: typeof f[g].t === 'number' ? f[g].t : 0 };
    });
    return snap;
  };

  /* 合并：并集，同一条取 upd 较新者；墓碑优先 */
  function combine(a, b) {
    var out = { ans: {}, del: {}, fav: {} };
    [b, a].forEach(function (src) {
      Object.keys(src.ans).forEach(function (g) {
        var cur = out.ans[g];
        if (!cur || (src.ans[g].upd || 0) >= (cur.upd || 0)) out.ans[g] = src.ans[g];
      });
    });
    var dels = {};
    [a, b].forEach(function (src) {
      Object.keys(src.del).forEach(function (g) { dels[g] = Math.max(dels[g] || 0, src.del[g]); });
    });
    Object.keys(dels).forEach(function (g) {
      var rec = out.ans[g];
      if (!rec || dels[g] >= (rec.upd || 0)) { delete out.ans[g]; out.del[g] = dels[g]; }
    });
    var keys = {};
    Object.keys(a.fav).forEach(function (k) { keys[k] = 1; });
    Object.keys(b.fav).forEach(function (k) { keys[k] = 1; });
    Object.keys(keys).forEach(function (k) {
      var x = a.fav[k], y = b.fav[k];
      out.fav[k] = (x && y) ? ((x.t || 0) >= (y.t || 0) ? x : y) : (x || y);
    });
    return out;
  }

  Sync.prototype._apply = function (snap) {
    var site = this.site;
    var ans = site.allAns(), fav = site.allFav();
    Object.keys(snap.ans).forEach(function (g) {
      var incoming = fromRemote(snap.ans[g]);
      if (incoming) ans[g] = QB.mergeRecord(ans[g] || null, incoming);
    });
    Object.keys(snap.del).forEach(function (g) { delete ans[g]; });
    Object.keys(snap.fav).forEach(function (g) { if (snap.fav[g].on) fav[g] = snap.fav[g].t || Date.now(); else delete fav[g]; });
    site.store.set('ans', ans);
    site.store.set('fav', fav);
  };

  Sync.prototype._payload = function (snap) {
    var ans = {};
    Object.keys(snap.ans).forEach(function (g) {
      var r = snap.ans[g];
      ans[g] = { picked: r.picked, text: r.text, done: r.done, ok: r.ok, self: r.self, upd: r.upd };
    });
    return { v: 1, quiz: this.quiz, at: Date.now(), ans: ans, del: snap.del, fav: snap.fav };
  };

  /* ---------- 网络 ---------- */

  Sync.prototype._rpc = function (fn, body) {
    var self = this;
    return fetch(this.base + fn, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json; charset=utf-8',
        'Accept': 'application/json',
        'Authorization': 'Bearer ' + this.key
      },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(function (text) {
      // 统一按 UTF-8 文本解析，避免响应头缺 charset 时按 latin-1 解出乱码
      var json;
      try { json = JSON.parse(text); } catch (e) { throw new Error('云端返回非 JSON'); }
      if (json && json.ok === false && json.error === 'conflict') return json;
      if (!json || json.ok === false) throw new Error((json && json.error) || '云端返回异常');
      return json;
    });
  };

  Sync.prototype._guard = function () {
    if (!this.configured()) return '同步未配置（缺少环境或 Key）';
    if (!this.code) return '请先填写并保存同步码';
    if (this.busy) return '正在同步中';
    return null;
  };

  Sync.prototype.upload = function () {
    var self = this, why = this._guard();
    if (why) return Promise.reject(new Error(why));
    this.busy = true;

    function once() {
      return self._rpc('quiz_pull', { p_code: self.code, p_quiz: self.quiz }).then(function (r) {
        var merged = combine(self._localSnap(), self._remoteSnap(r.payload));
        return self._rpc('quiz_push', {
          p_code: self.code, p_quiz: self.quiz,
          p_base_rev: r.rev || 0, p_payload: self._payload(merged)
        }).then(function (res) { return { res: res, merged: merged }; });
      });
    }

    return once().then(function (x) {
      if (x.res && x.res.ok === false && x.res.error === 'conflict') return once();   // 被别的设备抢先，重来一次
      self._apply(x.merged);
      self._save({ rev: x.res.rev || 0, code: self.code });
      self.busy = false;
      return { count: Object.keys(x.merged.ans).length };
    }).catch(function (e) { self.busy = false; throw e; });
  };

  Sync.prototype.download = function () {
    var self = this, why = this._guard();
    if (why) return Promise.reject(new Error(why));
    this.busy = true;
    return this._rpc('quiz_pull', { p_code: this.code, p_quiz: this.quiz }).then(function (r) {
      var merged = combine(self._localSnap(), self._remoteSnap(r.payload));
      self._apply(merged);
      self._save({ rev: r.rev || 0, code: self.code });
      self.busy = false;
      return { count: Object.keys(merged.ans).length };
    }).catch(function (e) { self.busy = false; throw e; });
  };

  Sync.prototype.pending = function () {
    var st = this._load();
    var since = st.at || 0;
    var n = 0;
    var ans = this.site.allAns();
    Object.keys(ans).forEach(function (g) { if ((ans[g].at || 0) > since) n++; });
    return n;
  };

  root.QBSync = { create: function (site, cfg) { return new Sync(site, cfg); }, toRemote: toRemote, fromRemote: fromRemote };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>/* qb-page.js — 练习页渲染层
 * 只读 window.QB_SITE（站点定义 + 本题组题目），所有状态变更走 QB 内核（规范 6.4）。
 */
(function () {
  'use strict';

  var def = window.QB_SITE;
  var meta = window.QB_META || {};
  if (!def) return;

  var site = QB.create(def);
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  var S = {
    mode: 'seq',
    type: '',
    diff: '',
    kw: '',
    list: [],
    idx: 0,
    shown: {},       // qid -> true，已揭晓答案
    redo: {},        // qid -> true，本题正在重做，忽略旧记录
    draft: {}        // qid -> 当前输入
  };

  var DIFF_ORDER = { '易': 0, '中': 1, '难': 2 };
  var TYPE_ORDER = Object.keys(def.types || {});

  /* ------------------------------------------------------------ 路由 */

  function readRoute() {
    var h = location.hash.replace(/^#/, '');
    var p = new URLSearchParams(h);
    S.mode = p.get('mode') || 'seq';
    S.type = p.get('t') || '';
    S.diff = p.get('d') || '';
    S.kw = p.get('kw') || '';
    var qid = p.get('q');
    if (qid) S.pendingQid = qid;
  }

  function writeRoute() {
    var p = new URLSearchParams();
    if (S.mode !== 'seq') p.set('mode', S.mode);
    if (S.type) p.set('t', S.type);
    if (S.diff) p.set('d', S.diff);
    if (S.kw) p.set('kw', S.kw);
    var q = S.list[S.idx];
    if (q) p.set('q', q.qid);
    var url = location.pathname + '#' + p.toString();
    try { history.replaceState(null, '', url); } catch (e) { /* file:// 下可能被拒，忽略 */ }
  }

  /* ------------------------------------------------------------ 组卷 */

  function buildList() {
    var ans = site.allAns(), wrong = site.allWrong(), fav = site.allFav();
    var all = site.questions.slice();

    if (S.type) all = all.filter(function (q) { return q.type === S.type; });
    if (S.diff) all = all.filter(function (q) { return q.diff === S.diff; });
    if (S.kw) {
      var kw = S.kw.toLowerCase();
      all = all.filter(function (q) {
        return (q.stem + ' ' + q.topic + ' ' + (q.exp || '')).toLowerCase().indexOf(kw) >= 0;
      });
    }

    if (S.mode === 'wrong') all = all.filter(function (q) { return wrong[q._gid]; });
    else if (S.mode === 'fav') all = all.filter(function (q) { return fav[q._gid]; });
    else if (S.mode === 'undone') all = all.filter(function (q) { return !ans[q._gid]; });

    if (S.mode === 'random') {
      for (var i = all.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = all[i]; all[i] = all[j]; all[j] = t;
      }
    }
    S.list = all;
    if (S.pendingQid) {
      var k = all.findIndex(function (q) { return q.qid === S.pendingQid; });
      if (k >= 0) S.idx = k;
      S.pendingQid = null;
    }
    if (S.idx >= all.length) S.idx = Math.max(0, all.length - 1);
  }

  /* ------------------------------------------------------------ 渲染 */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // 显示优先用构建期排好版的视图（公式是内联 SVG），没有就转义纯文本
  function view(q, field, fallback) {
    if (q.views && q.views[field] != null) return q.views[field];
    var raw = fallback !== undefined ? fallback : q[field];
    return esc(raw).replace(/\n/g, '<br>');
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function renderStats() {
    var st = site.stats(def.units.length === 1 ? def.units[0].key : null);
    var box = $('#stats');
    box.innerHTML = '';
    var items = [
      ['进度', st.answered + ' / ' + st.total, st.total ? Math.round(100 * st.answered / st.total) : 0],
      ['正确率', st.rate == null ? '—' : st.rate + '%', st.rate || 0],
      ['错题', String(st.wrong), 0],
      ['收藏', String(st.fav), 0]
    ];
    items.forEach(function (it) {
      var c = el('div', 'stat');
      c.appendChild(el('div', 'stat-k', it[0]));
      c.appendChild(el('div', 'stat-v', it[1]));
      if (it[2]) {
        var bar = el('div', 'stat-bar');
        var fill = el('i');
        fill.style.width = it[2] + '%';
        bar.appendChild(fill);
        c.appendChild(bar);
      }
      box.appendChild(c);
    });
    var label = def.units.length === 1 ? '题组口径' : '题库集口径（gid 去重）';
    $('#stats').setAttribute('data-scope', label);
  }

  function renderFilters() {
    var tsel = $('#f-type');
    if (tsel.options.length <= 1) {
      TYPE_ORDER.forEach(function (t) {
        var o = el('option', null, def.types[t].label || t);
        o.value = t;
        tsel.appendChild(o);
      });
    }
    tsel.value = S.type;
    $('#f-diff').value = S.diff;
    $('#f-kw').value = S.kw;
    $$('#modes button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.mode === S.mode);
    });
  }

  function optionMark(q, i) {
    return String.fromCharCode(65 + i);
  }

  function renderCard() {
    var card = $('#card');
    card.innerHTML = '';
    var q = S.list[S.idx];

    if (!q) {
      var empty = el('div', 'empty');
      empty.appendChild(el('div', 'empty-t', S.mode === 'wrong' ? '错题本是空的' : (S.mode === 'fav' ? '还没有收藏' : '没有符合条件的题目')));
      empty.appendChild(el('p', 'empty-s', S.mode === 'wrong'
        ? '答错的题会自动进入这里；在错题本里做对一次才会移出。'
        : '换个筛选条件，或者切回顺序练习。'));
      card.appendChild(empty);
      $('#nav').innerHTML = '';
      return;
    }

    var decl = def.types[q.type] || {};
    var rec = site.get(q._gid);
    // 错题本里默认让人重做：不预置上次的选项、也不提前摊开答案。
    // 点「重做」的题同理；其余模式仍按「做过就显示结果」的老规矩。
    var redoing = !!S.redo[q.qid] || (S.mode === 'wrong' && !S.shown[q.qid]);
    var revealed = !redoing && (!!S.shown[q.qid] || (rec && rec.ok !== null));
    var fav = site.allFav()[q._gid];

    var head = el('div', 'q-head');
    var tag = el('span', 'tag tag-type', decl.label || q.type);
    head.appendChild(tag);
    head.appendChild(el('span', 'tag tag-diff d-' + (DIFF_ORDER[q.diff] != null ? DIFF_ORDER[q.diff] : 1), q.diff));
    head.appendChild(el('span', 'q-topic', q.topic));
    var no = el('span', 'q-no', (S.idx + 1) + ' / ' + S.list.length);
    head.appendChild(no);
    card.appendChild(head);

    var stem = el('div', 'q-stem');
    stem.innerHTML = view(q, 'stem');
    card.appendChild(stem);

    if (q.media && q.media.img) {
      var im = el('img', 'q-img');
      im.src = q.media.img;
      im.alt = '题图';
      card.appendChild(im);
    }

    var area = el('div', 'q-area');

    if (decl.answerShape === 'choice') {
      var opts = el('div', 'opts');
      var picked = redoing ? (S.draft[q.qid] || [])
        : ((rec && rec.p) ? rec.p.slice() : (S.draft[q.qid] || []));
      q.options.forEach(function (text, i) {
        var b = el('button', 'opt');
        b.type = 'button';
        b.dataset.i = String(i);
        if (picked.indexOf(i) >= 0) b.classList.add('picked');
        if (revealed) {
          b.disabled = true;
          if ((q.answer || []).indexOf(i) >= 0) b.classList.add('right');
          else if (picked.indexOf(i) >= 0) b.classList.add('wrong');
        }
        var k = el('span', 'opt-k', optionMark(q, i));
        b.appendChild(k);
        var ot = el('span', 'opt-t');
        ot.innerHTML = (q.views && q.views.opts && q.views.opts[i] != null) ? q.views.opts[i] : esc(text);
        b.appendChild(ot);
        b.addEventListener('click', function () { pick(q, decl, i); });
        opts.appendChild(b);
      });
      area.appendChild(opts);
      if (decl.judge === 'set' && !revealed) {
        var tip = el('p', 'hint', '多选题：选好后点「提交」');
        area.appendChild(tip);
      }
    } else if (decl.answerShape === 'tokenList') {
      var inp = el('input', 'in');
      inp.type = 'text';
      inp.placeholder = '在此填写答案';
      inp.value = redoing ? (S.draft[q.qid] || '') : ((rec && rec.x) || S.draft[q.qid] || '');
      inp.disabled = revealed;
      inp.addEventListener('input', function () { S.draft[q.qid] = inp.value; });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(q, decl); });
      area.appendChild(inp);
    } else {
      var ta = el('textarea', 'ta');
      ta.placeholder = '写出你的答案或关键步骤，提交后与参考答案对照自评';
      ta.value = redoing ? (S.draft[q.qid] || '') : ((rec && rec.x) || S.draft[q.qid] || '');
      ta.disabled = revealed;
      ta.rows = 5;
      ta.addEventListener('input', function () { S.draft[q.qid] = ta.value; });
      area.appendChild(ta);
    }
    card.appendChild(area);

    var bar = el('div', 'q-bar');
    if (!revealed) {
      var sub = el('button', 'btn primary', '提交');
      sub.addEventListener('click', function () { submit(q, decl); });
      bar.appendChild(sub);
      if (decl.judge === 'rubric') {
        bar.appendChild(el('span', 'hint', '主观题：提交后对照参考答案自评'));
      }
      var peek = el('button', 'btn ghost', '看答案');
      peek.addEventListener('click', function () { S.shown[q.qid] = true; render(); });
      bar.appendChild(peek);
    } else {
      // 只点过「看答案」还没作答时 rec 为空，别显示成「待自评」
      var vClass = !rec ? 'mid' : (rec.ok === true ? 'ok' : (rec.ok === false ? 'bad' : 'mid'));
      var vText = !rec ? '未作答 · 仅看答案' : (rec.ok === true ? '✓ 答对' : (rec.ok === false ? '✗ 答错' : '待自评'));
      var verdict = el('div', 'verdict ' + vClass);
      verdict.textContent = vText;
      bar.appendChild(verdict);
      if (rec && rec.c != null && rec.ok === false) bar.appendChild(el('span', 'hint', '得分率 ' + Math.round(rec.c * 100) + '%'));
      var again = el('button', 'btn', '重做本题');
      again.addEventListener('click', function () { redoOne(q); });
      bar.appendChild(again);
    }
    var favBtn = el('button', 'btn ghost' + (fav ? ' on' : ''), fav ? '★ 已收藏' : '☆ 收藏');
    favBtn.addEventListener('click', function () {
      site.toggleFav(q._gid);
      render();
    });
    bar.appendChild(favBtn);
    if (rec && site.allWrong()[q._gid]) {
      var sup = el('button', 'btn ghost', '移出错题本');
      sup.addEventListener('click', function () { site.suppress(q._gid); render(); });
      bar.appendChild(sup);
    }
    card.appendChild(bar);

    if (revealed) {
      var exp = el('div', 'exp');
      exp.appendChild(el('div', 'exp-h', '答案与解析'));
      var ansText = answerText(q, decl);
      if (ansText) {
        var a = el('p', 'exp-a');
        a.innerHTML = '<b>答案：</b>' + ansText;
        exp.appendChild(a);
      }
      if (q.exp) {
        var p = el('p', 'exp-p');
        p.innerHTML = view(q, 'exp');
        exp.appendChild(p);
      }
      if (q.meta && q.meta.source) {
        exp.appendChild(el('p', 'exp-src', '来源：' + q.meta.source + (q.meta.paperNo ? ' 第 ' + q.meta.paperNo + ' 题' : '')));
      }
      if (decl.judge === 'rubric' && rec && rec.ok === null) {
        var self = el('div', 'self');
        self.appendChild(el('span', 'hint', '自评：'));
        [['达标', true, null], ['部分达标', false, 0.5], ['未达标', false, 0]].forEach(function (t) {
          var b = el('button', 'btn small', t[0]);
          b.addEventListener('click', function () { selfJudge(q, t[1], t[2]); });
          self.appendChild(b);
        });
        exp.appendChild(self);
      }
      card.appendChild(exp);
    }

    var nav = $('#nav');
    nav.innerHTML = '';
    var prev = el('button', 'btn', '← 上一题');
    prev.disabled = S.idx === 0;
    prev.addEventListener('click', function () { go(S.idx - 1); });
    var next = el('button', 'btn primary', '下一题 →');
    next.disabled = S.idx >= S.list.length - 1;
    next.addEventListener('click', function () { go(S.idx + 1); });
    nav.appendChild(prev);
    if (S.mode === 'wrong' && S.list.length) {
      var all = el('button', 'btn small', '全部重做');
      all.title = '清空本轮在错题本里的作答状态，从头再做一遍';
      all.addEventListener('click', function () {
        S.list.forEach(function (x) { delete S.shown[x.qid]; delete S.draft[x.qid]; S.redo[x.qid] = true; });
        S.idx = 0;
        render();
        flash('已清空本轮作答，从头开始');
      });
      nav.appendChild(all);
    }
    nav.appendChild(el('span', 'nav-mid', (S.idx + 1) + ' / ' + S.list.length));
    nav.appendChild(next);
  }

  function answerText(q, decl) {
    if (decl.answerShape === 'choice') {
      return (q.answer || []).map(function (i) {
        var t = (q.views && q.views.opts && q.views.opts[i] != null) ? q.views.opts[i] : esc(q.options[i]);
        return optionMark(q, i) + '. ' + t;
      }).join('；');
    }
    if (decl.answerShape === 'tokenList') {
      var list = (q.views && q.views.answers && q.views.answers.length) ? q.views.answers : (q.answers || []).map(esc);
      return list.join(' / ');
    }
    return (q.views && q.views.ref) ? q.views.ref : (q.ref ? esc(String(q.ref)) : '');
  }

  /* ------------------------------------------------------------ 交互 */

  // 重新作答一道题：清掉本次会话的揭晓标记与草稿，回到未作答状态
  function redoOne(q) {
    S.redo[q.qid] = true;
    delete S.shown[q.qid];
    delete S.draft[q.qid];
    render();
    flash('已清空，可以重做了');
  }

  function pick(q, decl, i) {
    var cur = (S.draft[q.qid] || []).slice();
    if (decl.judge === 'set') {
      var k = cur.indexOf(i);
      if (k >= 0) cur.splice(k, 1); else cur.push(i);
      S.draft[q.qid] = cur;
      renderCard();
    } else {
      S.draft[q.qid] = [i];
      submit(q, decl);
    }
  }

  function submit(q, decl) {
    var input = { picked: S.draft[q.qid] || [], text: S.draft[q.qid] || '' };
    if (decl.answerShape === 'choice') input = { picked: S.draft[q.qid] || [] };
    else input = { text: S.draft[q.qid] || '' };

    if (decl.answerShape === 'choice' && (!input.picked || !input.picked.length)) {
      flash('先选一个选项');
      return;
    }
    if (decl.answerShape !== 'choice' && !String(input.text).trim()) {
      flash('先写下答案');
      return;
    }

    var res = QB.judge(q, decl, input);
    var patch = { ok: res.ok, at: Date.now(), m: S.mode };
    if (decl.replay === 'mask' && input.picked) patch.p = input.picked;
    if (decl.replay === 'text' && input.text != null) patch.x = String(input.text);
    if (res.credit != null) patch.c = res.credit;
    if (res.ok === null) patch.self = false;

    site.put(q._gid, patch, S.mode);
    delete S.redo[q.qid];
    S.shown[q.qid] = true;
    if (S.mode === 'wrong' && res.ok === true) flash('答对了，已移出错题本');
    render();
  }

  function selfJudge(q, ok, credit) {
    var patch = { ok: ok, at: Date.now(), m: S.mode, self: true };
    if (credit != null) patch.c = credit;
    var rec = site.get(q._gid);
    if (rec && rec.x != null) patch.x = rec.x;
    site.put(q._gid, patch, S.mode);
    delete S.redo[q.qid];
    S.shown[q.qid] = true;
    if (S.mode === 'wrong' && ok === true) flash('答对了，已移出错题本');
    render();
  }

  /* 翻题后不把页面拉回顶部。
     只在题卡顶部已经滚出视野上方（rect.top < 8）时，把它瞬时拉回视野；
     卡片顶部还在视野里就完全不动。用瞬时滚动、不用 smooth——
     平滑滚动会和滑动翻题的滑出动画叠在一起，观感就是「回弹」。 */
  function keepCardInView() {
    var c = $('#card');
    if (!c) return;
    var top = c.getBoundingClientRect().top;
    if (top >= 8) return;
    var y = (window.scrollY || window.pageYOffset || 0) + top - 8;
    window.scrollTo(0, y > 0 ? y : 0);
  }

  function go(i) {
    if (i < 0 || i >= S.list.length) return;
    S.idx = i;
    render();
    keepCardInView();
  }

  var flashTimer = null;
  function flash(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { t.classList.remove('on'); }, 1600);
  }

  /* ------------------------------------------------------------ 掌握度 */

  function renderMastery() {
    var rows = site.masteryAll().filter(function (r) { return r.n > 0; });
    var box = $('#mastery');
    box.innerHTML = '';
    if (!rows.length) {
      box.appendChild(el('p', 'hint', '还没有作答记录，掌握度会在作答后出现。'));
      return;
    }
    var table = el('table', 'mt');
    var thead = el('thead');
    var tr = el('tr');
    ['知识点', '得分', '状态', '作答数'].forEach(function (h) { tr.appendChild(el('th', null, h)); });
    thead.appendChild(tr);
    table.appendChild(thead);
    var tb = el('tbody');
    rows.forEach(function (r) {
      var tr2 = el('tr');
      tr2.appendChild(el('td', 'mt-t', r.topic));
      tr2.appendChild(el('td', 'mt-s', String(r.score)));
      var lv = el('td');
      lv.appendChild(el('span', 'lv ' + (r.level === '已掌握' ? 'lv-ok' : (r.level === '薄弱' ? 'lv-bad' : 'lv-mid')), r.level));
      tr2.appendChild(lv);
      tr2.appendChild(el('td', 'mt-n', String(r.n)));
      tb.appendChild(tr2);
    });
    table.appendChild(tb);
    box.appendChild(table);
  }

  /* ------------------------------------------------------------ 导出导入 */

  function initTransfer() {
    var sel = $('#x-scope');
    if (def.units.length === 1) {
      sel.innerHTML = '';
      var o = el('option', null, '本题库');
      o.value = 'unit:' + def.units[0].key;
      sel.appendChild(o);
    } else {
      var s1 = el('option', null, '全站');
      s1.value = 'site:';
      sel.appendChild(s1);
      def.units.forEach(function (u) {
        var o2 = el('option', null, u.label + ' ' + u.title);
        o2.value = 'unit:' + u.key;
        sel.appendChild(o2);
      });
    }

    $('#x-do').addEventListener('click', function () {
      var v = sel.value.split(':');
      try {
        var code = site.encode(v[0], v[1]);
        $('#x-code').value = code;
        $('#x-info').textContent = '已生成 ' + code.length + ' 字符（预算 ' + site.budget + '）'
          + (code.length > site.budget ? '，超出预算，建议改用题组作用域' : '');
      } catch (e) {
        $('#x-info').textContent = '生成失败：' + e.message;
      }
    });

    $('#x-copy').addEventListener('click', function () {
      var ta = $('#x-code');
      if (!ta.value) return flash('先生成导出码');
      ta.select();
      try { document.execCommand('copy'); flash('已复制'); } catch (e) { flash('请手动复制'); }
    });

    $('#x-import').addEventListener('click', function () {
      var code = $('#x-code').value.trim();
      if (!code) return flash('请粘贴导出码');
      try {
        var r = site.importCode(code);
        $('#x-info').textContent = '已导入 ' + r.count + ' 条（' + r.kind + ':' + (r.key || '全站') + '），作用域外记录未改动';
        reload();
      } catch (e) {
        $('#x-info').textContent = '导入失败：' + e.message;
      }
    });

    $('#x-undo').addEventListener('click', function () {
      if (site.undoImport()) { $('#x-info').textContent = '已撤销上次导入'; reload(); }
      else $('#x-info').textContent = '没有可撤销的导入';
    });

    $('#reset').addEventListener('click', function () {
      if (!confirm('清空本题库在本机的作答、错题与收藏记录？此操作不可撤销。')) return;
      site.resetScope(def.units.length === 1 ? 'unit' : 'site', def.units.length === 1 ? def.units[0].key : '');
      S.shown = {}; S.redo = {}; S.draft = {};
      reload();
      flash('已清空');
    });
  }

  /* ------------------------------------------------------------ 云同步 */

  function initCloud() {
    var wrap = $('#cloud-wrap');
    if (!wrap) return;
    var cfg = window.QB_SYNC_CFG;
    if (!cfg || !window.QBSync) return;
    wrap.style.display = '';

    var sync = window.QBSync.create(site, cfg);
    var codeInput = $('#s-code');
    var info = $('#s-info');
    var saved = sync.readSharedCode();
    if (saved) codeInput.value = saved;

    function say(msg) { info.textContent = msg; }

    $('#s-save').addEventListener('click', function () {
      var v = codeInput.value.trim();
      if (v.length < 10) return say('同步码至少 10 位（它是唯一凭证）');
      sync.setCode(v);
      codeInput.value = sync.code;
      say('已保存，本机所有题库共用这个同步码');
    });

    function run(fn, label) {
      var why = sync._guard();
      if (why) return say(why);
      say(label + '中…');
      fn().then(function (r) {
        say(label + '完成，云端共 ' + r.count + ' 条记录');
        render();
      }).catch(function (e) {
        say(label + '失败：' + e.message);
      });
    }

    $('#s-up').addEventListener('click', function () { run(function () { return sync.upload(); }, '上传'); });
    $('#s-down').addEventListener('click', function () { run(function () { return sync.download(); }, '下载'); });

    var pend = sync.pending();
    say(pend ? ('有 ' + pend + ' 条本机改动尚未上传') : '同步码与云端一致时即可手动上传 / 下载');
  }

  /* ------------------------------------------------------------ 手势翻题 */

  /* 左滑 → 下一题，右滑 → 上一题。所有题库共用这一份实现，页面不再各自绑定。
     翻页走 go()，与「上一题 / 下一题」按钮同一条路径，不另起一套状态。
     判定：水平位移 ≥ 56px、水平 ≥ 垂直 × 1.2、时长 ≤ 1.2s；
     起手点在输入控件 / 控制区 / 折叠面板 / 可横向滚动的公式块内不触发；
     纵向滑动超过阈值即判定为滚动并让位，全程 passive，不抢页面滚动。 */
  function initSwipe() {
    var MIN_X = 56;      // 触发所需最小水平位移
    var LOCK_X = 12;     // 锁定为横向手势的位移
    var LOCK_Y = 14;     // 纵向位移超过它且大于横向 → 判定为滚动
    var SLOPE = 1.2;
    var MAX_MS = 1200;
    var EDGE = 24;       // 避开 iOS Safari 的边缘侧滑返回
    var FOLLOW = 0.35;   // 拖动时卡片跟手系数
    var ANIM_MS = 150;

    var sx = 0, sy = 0, st = 0, tracking = false, locked = false, animating = false;
    var muteUntil = 0;   // 滑动后短暂屏蔽 click，避免顺带点掉选项

    function card() { return $('#card'); }

    var SKIP = '.top, .ctl, details, .foot, #toast, input, textarea, select, [contenteditable="true"]';

    // 起手点排除：交互控件、控制区，以及自身可横向滚动的容器（长公式、代码块）
    function skip(el) {
      if (!el || !el.closest) return true;
      if (el.closest(SKIP)) return true;
      var c = card();
      for (var n = el; n && n !== c && n.nodeType === 1; n = n.parentNode) {
        if (n.scrollWidth - n.clientWidth <= 2) continue;
        var ox = window.getComputedStyle(n).overflowX;
        if (ox === 'auto' || ox === 'scroll') return true;
      }
      return false;
    }

    function reset() {
      if (animating) return;          // 动画中不打断，否则会停在半路又被 go() 换题
      var c = card();
      if (!c) return;
      c.style.transition = 'transform .18s ease, opacity .18s ease';
      c.style.transform = '';
      c.style.opacity = '';
    }

    function reduced() {
      return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    }

    // dir: 1 = 下一题，-1 = 上一题
    function flip(dir) {
      if (animating || !S.list.length) return;
      var to = S.idx + dir;
      if (to < 0 || to >= S.list.length) { reset(); return; }
      var c = card();
      if (!c) return;
      muteUntil = Date.now() + 300;   // 吞掉滑动末尾那一次 click（选项点选即判分）
      if (reduced()) { go(to); return; }
      animating = true;
      var out = dir > 0 ? -72 : 72;   // 下一题向左滑出，上一题向右滑出
      c.style.transition = 'transform ' + ANIM_MS + 'ms ease, opacity ' + ANIM_MS + 'ms ease';
      void c.offsetWidth;
      c.style.transform = 'translateX(' + out + 'px)';
      c.style.opacity = '0';
      setTimeout(function () {
        go(to);
        c.style.transition = 'none';
        c.style.transform = 'translateX(' + (-out) + 'px)';
        c.style.opacity = '0';
        requestAnimationFrame(function () {
          c.style.transition = 'transform .2s ease, opacity .2s ease';
          c.style.transform = '';
          c.style.opacity = '';
          animating = false;
        });
      }, ANIM_MS);
    }

    document.addEventListener('click', function (e) {
      if (Date.now() >= muteUntil) return;
      e.preventDefault();
      e.stopPropagation();
    }, true);

    document.addEventListener('touchstart', function (e) {
      if (animating || e.touches.length !== 1) return;
      var t = e.touches[0];
      if (t.clientX < EDGE || t.clientX > window.innerWidth - EDGE) return;
      if (skip(e.target)) return;
      sx = t.clientX; sy = t.clientY; st = Date.now();
      tracking = true; locked = false;
    }, { passive: true });

    document.addEventListener('touchmove', function (e) {
      if (!tracking) return;
      if (e.touches.length !== 1) { tracking = false; reset(); return; }
      var t = e.touches[0];
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if (!locked) {
        if (Math.abs(dy) > LOCK_Y && Math.abs(dy) > Math.abs(dx)) { tracking = false; return; }
        if (Math.abs(dx) > LOCK_X) {
          locked = true;
          var c0 = card();
          if (c0) c0.style.transition = 'none';
        }
      }
      if (!locked) return;
      var c = card();
      if (!c) return;
      c.style.transform = 'translateX(' + (dx * FOLLOW) + 'px)';
      c.style.opacity = String(Math.max(0.55, 1 - Math.abs(dx) / 480));
    }, { passive: true });

    document.addEventListener('touchend', function (e) {
      if (!tracking) return;
      tracking = false;
      var was = locked; locked = false;
      if (!was) return;
      var t = e.changedTouches[0];
      var dx = t.clientX - sx, dy = t.clientY - sy, dt = Date.now() - st;
      if (Math.abs(dx) < MIN_X || Math.abs(dx) < Math.abs(dy) * SLOPE || dt > MAX_MS) { reset(); return; }
      flip(dx < 0 ? 1 : -1);   // 左滑 → 下一题；右滑 → 上一题
    }, { passive: true });

    document.addEventListener('touchcancel', function () {
      tracking = false; locked = false;
      reset();
    }, { passive: true });
  }

  /* ------------------------------------------------------------ 入口 */

  // 只重画当前这一屏：题号、列表都保持不变。
  // 在错题本里答对后题目会移出错题集合，若这里重组卷，卡片会当场跳到下一题，
  // 用户看不到自己刚做对的结果。列表只在换模式 / 换筛选 / 导入时重建。
  function render() {
    renderStats();
    renderFilters();
    renderCard();
    renderMastery();
    writeRoute();
  }

  function reload() {
    buildList();
    render();
  }

  function init() {
    readRoute();
    // 旧版记录迁移：csg_* / csunitN_* 等命名空间并进全站三表，幂等，旧键不删
    try {
      var mig = site.migrateLegacy();
      if (mig && !mig.skipped && (mig.ans || mig.wrong || mig.fav)) {
        setTimeout(function () { flash('已迁移旧版记录：作答 ' + mig.ans + '、错题 ' + mig.wrong + '、收藏 ' + mig.fav); }, 400);
      }
    } catch (e) { /* 迁移失败不阻塞作答 */ }
    $('#site-title').textContent = def.title || meta.title || '题库';
    $('#bank-name').textContent = def.units.length === 1
      ? (def.units[0].label + ' · ' + def.units[0].title)
      : (def.subjectName || '');
    if (def.units.length === 1 && def.units[0].desc) $('#bank-desc').textContent = def.units[0].desc;
    if (meta.home) $('#home').href = meta.home;
    else $('#home').style.display = 'none';

    $$('#modes button').forEach(function (b) {
      b.addEventListener('click', function () { S.mode = b.dataset.mode; S.idx = 0; reload(); });
    });
    $('#f-type').addEventListener('change', function (e) { S.type = e.target.value; S.idx = 0; reload(); });
    $('#f-diff').addEventListener('change', function (e) { S.diff = e.target.value; S.idx = 0; reload(); });
    var kwTimer = null;
    $('#f-kw').addEventListener('input', function (e) {
      clearTimeout(kwTimer);
      var v = e.target.value;
      kwTimer = setTimeout(function () { S.kw = v; S.idx = 0; reload(); }, 220);
    });

    document.addEventListener('keydown', function (e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft') go(S.idx - 1);
      if (e.key === 'ArrowRight') go(S.idx + 1);
      if (/^[1-9]$/.test(e.key)) {
        var q = S.list[S.idx];
        if (q && def.types[q.type].answerShape === 'choice' && q.options[Number(e.key) - 1] != null) {
          pick(q, def.types[q.type], Number(e.key) - 1);
        }
      }
    });

    initSwipe();
    initTransfer();
    initCloud();
    reload();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>计算机导论 · 第七单元 软件开发基础与软件工程</title>
<style>/* qb-page.css — 题库页面样式（内核共用，不含任何科目特有内容） */
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e4e8ef; --line2:#eef1f6;
  --text:#1e2330; --muted:#5b6373; --muted2:#6b7383;
  --accent:#2f6fed; --accent-ink:#2557c7; --accent-soft:#eaf1ff;
  --ok:#0b6b48; --ok-soft:#e7f7ef; --ok-line:#b7e6cf;
  --bad:#b42318; --bad-soft:#fdecea; --bad-line:#f6c9c4;
  --warn:#b54708; --warn-soft:#fef3e2;
  --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 72px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:14px}
.top h1{font-size:21px;margin:0;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.top .spacer{flex:1}
.home{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:6px 12px;background:#fff}
.home:hover{color:var(--accent);border-color:#c7dbff;text-decoration:none}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.block{padding:14px 16px;margin-bottom:14px}

/* stats */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;margin-bottom:14px}
.stat-k{font-size:12px;color:var(--muted2);letter-spacing:.3px}
.stat-v{font-size:19px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-bar{height:4px;border-radius:3px;background:#eef1f6;margin-top:7px;overflow:hidden}
.stat-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl+.ctl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.seg{display:inline-flex;background:#f1f4fa;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;color:#48505f}
.seg button:hover{color:var(--accent)}
.seg button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
select,input[type=search]{
  font:inherit;font-size:13.5px;color:var(--text);border:1px solid var(--line);background:#fff;
  border-radius:9px;padding:7px 10px;outline:none
}
select:focus,input[type=search]:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=search]{min-width:170px;flex:1}
.btn{
  border:1px solid var(--line);background:#fff;color:#3c4353;border-radius:9px;padding:7px 14px;
  font:inherit;font-size:13.5px;cursor:pointer;transition:.15s
}
.btn:hover:not(:disabled){border-color:#c7dbff;color:var(--accent);background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2557c7;border-color:#2557c7;color:#fff}
.btn.ghost{background:#fff}
.btn.ghost.on{color:#b54708;border-color:#f5dcb4;background:var(--warn-soft)}
.btn.small{padding:5px 11px;font-size:13px}

/* card */
#card{padding:18px 18px 16px;margin-bottom:14px}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fafbfd;white-space:nowrap}
.tag-type{color:var(--accent-ink);border-color:#c7dbff;background:var(--accent-soft)}
.tag-diff.d-0{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.tag-diff.d-1{color:var(--warn);border-color:#f5dcb4;background:var(--warn-soft)}
.tag-diff.d-2{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.q-topic{font-size:12.5px;color:var(--muted2)}
.q-no{margin-left:auto;font-size:12.5px;color:var(--muted2);font-variant-numeric:tabular-nums}
.q-stem{font-size:16.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.q-img{max-width:100%;margin-top:10px;border-radius:8px;border:1px solid var(--line)}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;
  font:inherit;font-size:15px;line-height:1.6;cursor:pointer;transition:.13s;color:var(--text)
}
.opt:hover:not(:disabled){border-color:#c7dbff;background:#fafcff}
.opt:disabled{cursor:default}
.opt-k{
  flex:0 0 24px;height:24px;border-radius:7px;background:#f1f4fa;color:#48505f;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600
}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .opt-k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.right .opt-k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .opt-k{background:var(--bad);color:#fff}

/* inputs */
.in,.ta{
  width:100%;margin-top:14px;font:inherit;font-size:15px;color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;background:#fff;resize:vertical
}
.in:focus,.ta:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
.in:disabled,.ta:disabled{background:#fafbfd;color:var(--muted)}

/* action bar */
.q-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hint{font-size:12.5px;color:var(--muted2)}
.verdict{font-size:14px;font-weight:650;padding:5px 12px;border-radius:999px}
.verdict.ok{color:var(--ok);background:var(--ok-soft)}
.verdict.bad{color:var(--bad);background:var(--bad-soft)}
.verdict.mid{color:var(--warn);background:var(--warn-soft)}

/* explanation */
.exp{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.exp-h{font-size:12.5px;color:var(--muted2);letter-spacing:.4px;margin-bottom:7px}
.exp-a{font-size:14.5px;margin:0 0 8px;padding:10px 12px;background:#f7f9fd;border-radius:9px;border:1px solid var(--line2)}
.exp-p{font-size:14.5px;color:#333a49;margin:0 0 6px;white-space:pre-wrap}
.exp-src{font-size:12px;color:var(--muted2);margin:6px 0 0}
.self{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}

/* nav */
#nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav-mid{flex:1;text-align:center;font-size:13px;color:var(--muted2);font-variant-numeric:tabular-nums}

/* mastery */
#mastery{padding:14px 16px;margin-bottom:14px}
.mt{width:100%;border-collapse:collapse;font-size:13.5px}
.mt th{text-align:left;font-weight:600;color:var(--muted2);font-size:12px;letter-spacing:.3px;padding:0 0 8px;border-bottom:1px solid var(--line2)}
.mt td{padding:7px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
.mt tr:last-child td{border-bottom:0}
.mt-t{color:#333a49}
.mt-s{font-variant-numeric:tabular-nums;font-weight:650;width:56px}
.mt-n{color:var(--muted2);width:56px;text-align:right}
.lv{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.lv-ok{color:var(--ok);background:var(--ok-soft)}
.lv-mid{color:var(--warn);background:var(--warn-soft)}
.lv-bad{color:var(--bad);background:var(--bad-soft)}

/* transfer */
#transfer{padding:14px 16px;margin-bottom:14px}
#x-code{width:100%;min-height:86px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:10px;resize:vertical;background:#fafbfd;color:#333a49}
#x-info{font-size:12.5px;color:var(--muted2);margin-top:8px;min-height:18px}
.x-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* misc */
.empty{padding:34px 8px;text-align:center}
.empty-t{font-size:15.5px;font-weight:600}
.empty-s{color:var(--muted2);font-size:13.5px;margin:6px 0 0}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:#1e2330;color:#fff;font-size:13.5px;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--muted2);font-size:12px;text-align:center;margin-top:18px;line-height:1.8}

@media (max-width:640px){
  .wrap{padding:14px 12px 64px}
  #stats{grid-template-columns:repeat(2,1fr)}
  .top h1{font-size:18.5px}
  .q-stem{font-size:16px}
  .opt{font-size:14.5px}
  input[type=search]{min-width:100%}
}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;
}
mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */
.q-stem mjx-container[display="true"],
.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;
}
mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */
.q-stem mjx-container[display="true"],
.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>

    </div>
    <div class="spacer"></div>
    <a class="home" id="home" href="../index.html">返回题库集</a>
  </div>

  <div class="panel" id="stats"></div>

  <div class="panel block">
    <div class="ctl">
      <div class="seg" id="modes">
        <button data-mode="seq" class="on">顺序</button>
        <button data-mode="random">随机</button>

        <button data-mode="fav">收藏</button>
        <button data-mode="undone">未做</button>
      </div>
      <select id="f-type"><option value="">全部题型</option></select>
      <select id="f-diff"><option value="">全部难度</option><option>易</option><option>中</option><option>难</option></select>

    </div>
  </div>

  <div class="panel" id="card"></div>
  <div id="nav"></div>

  <details class="panel block">
    <summary style="cursor:pointer;font-size:14px;font-weight:600">掌握度（按知识点）</summary>
    <div id="mastery" style="padding-top:10px"></div>
  </details>

  <details class="panel block" id="cloud-wrap" style="display:none">
    <summary style="cursor:pointer;font-size:14px;font-weight:600">云同步（手动上传 / 下载）</summary>
    <div style="padding-top:10px">
      <div class="x-row">
        <input type="text" id="s-code" class="in" style="flex:1;min-width:180px;margin-top:0"
               placeholder="同步码（≥10 位，与旧页面共用）">
        <button class="btn" id="s-save">保存</button>
        <button class="btn primary" id="s-up">上传</button>
        <button class="btn" id="s-down">下载</button>
      </div>
      <div id="s-info" class="hint" style="margin-top:8px;min-height:18px"></div>
    </div>
  </details>

  <details class="panel block">
    <summary style="cursor:pointer;font-size:14px;font-weight:600">导出 / 导入进度码</summary>
    <div id="transfer" style="padding-top:10px">
      <div class="x-row">
        <select id="x-scope"></select>
        <button class="btn" id="x-do">生成</button>
        <button class="btn" id="x-copy">复制</button>
        <button class="btn" id="x-import">导入</button>
        <button class="btn" id="x-undo">撤销导入</button>
        <button class="btn ghost" id="reset" style="margin-left:auto">清空本机记录</button>
      </div>
      <textarea id="x-code" placeholder="在此粘贴他人分享的进度码，或点「生成」得到自己的"></textarea>
      <div id="x-info"></div>
    </div>
  </details>

  <div class="foot">
    计算机导论 · 第七单元 软件开发基础与软件工程 · 92 题<br>
    进度保存在本机浏览器，不上传；换设备请用进度码迁移。
  </div>
</div>

展的不同阶段。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-003","type":"single","topic":"7.1 程序设计语言与语言层次","diff":"易","stem":"被称为第一代程序设计语言的是（　）。","options":["第四代语言","汇编语言","高级语言","机器语言"],"answer":[3],"exp":"机器语言是计算机发展早期唯一的程序设计语言，由 0 和 1 组成的二进制码构成，被称为第一代语言；汇编语言为第二代，高级语言为第三代。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-004","type":"single","topic":"7.1 程序设计语言与语言层次","diff":"中","stem":"机器语言的主要优点是（　）。","options":["速度快，不需要翻译","可读性好，易于掌握","不依赖具体机器，可移植","开发效率高"],"answer":[0],"exp":"机器语言是 CPU 能直接执行的二进制指令，无需任何翻译，因此运行速度最快。代价是依赖具体机器（换机器就要重写）、可读性差、难以掌握，开发效率极低。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-005","type":"single","topic":"7.1 程序设计语言与语言层次","diff":"中","stem":"汇编语言用（　）代替二进制指令，从而提高了可读性。","options":["流程图","十进制数","助记符","自然语言句子"],"answer":[2],"exp":"汇编语言用带符号的助记符表示指令和地址，替代了纯二进制的机器指令，因此早期被称为符号语言。它仍与具体机器相关，一条汇编指令通常对应一条机器指令。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-006","type":"single","topic":"7.1 程序设计语言与语言层次","diff":"易","stem":"把汇编语言代码翻译成机器语言代码的程序称为（　）。","options":["编译程序","汇编程序","解释程序","连接程序"],"answer":[1],"exp":"汇编程序（assembler）专门把汇编语言源程序翻译成机器语言目标程序。编译程序处理的是高级语言，连接程序负责把目标程序与库组织成可执行文件。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-007","type":"single","topic":"7.1 程序设计语言与语言层次","diff":"中","stem":"下列不属于高级语言特点的是（　）。","options":["可移植到不同的计算机","开发效率高，摆脱了汇编语言繁琐的细节","需要解释或编译才能转化为机器语言","可以直接在 CPU 上执行，无需任何翻译"],"answer":[3],"exp":"高级语言更接近自然语言，可移植、开发效率高，但计算机只认机器指令，必须经编译或解释翻译后才能执行。最后一项描述的是机器语言。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-008","type":"single","topic":"7.1 程序设计语言与语言层次","diff":"中","stem":"从机器语言到高级语言，程序运行效率的变化趋势是（　）。","options":["降低：翻译产生的代码通常不如手写机器指令紧凑","提高：高级语言生成的指令更优","不变：语言层次不影响运行效率","先降低后提高，无规律"],"answer":[0],"exp":"语言层次越高，越远离硬件、越通用，但编译生成的代码往往有冗余，运行效率一般低于精心手写的机器或汇编程序。这是用运行效率换取开发效率与可移植性的典型权衡。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-009","type":"single","topic":"7.1 程序设计语言与语言层次","diff":"中","stem":"高级语言编写的程序必须经过翻译才能运行，根本原因是（　）。","options":["高级语言不能被存储","高级语言语法不严格","计算机硬件只能识别和执行机器指令","操作系统不支持高级语言"],"answer":[2],"exp":"CPU 的指令系统只认二进制机器指令，任何高级语言写的源程序都必须翻译成对应的机器指令序列才能执行。翻译方式有编译与解释两种。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-010","type":"single","topic":"7.1 程序设计语言与语言层次","diff":"易","stem":"下列属于高级语言的是（　）。","options":["机器指令 10110000","Python","MOV AX, 5","汇编伪指令 DW"],"answer":[1],"exp":"Python 是典型的高级语言。二进制机器指令属机器语言，MOV 是汇编助记符，DW 是汇编伪指令，三者都不是高级语言。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-011","type":"multi","topic":"7.1 程序设计语言与语言层次","diff":"中","stem":"高级语言的特点有（　）。","options":["需要解释或编译转化为机器语言","与具体机器的指令系统一一对应","可移植到不同计算机","开发效率高，摆脱汇编语言的繁琐细节"],"answer":[0,2,3],"exp":"高级语言可移植、开发效率高、需要翻译。与具体机器指令一一对应的是汇编语言——这正是它不可移植的原因。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-012","type":"multi","topic":"7.1 程序设计语言与语言层次","diff":"易","stem":"属于高级语言的有（　）。","options":["Fortran","Pascal","C++","汇编伪指令 DW 10"],"answer":[0,1,2],"exp":"前三项都是高级语言。汇编伪指令属于汇编语言，与具体机器的指令系统相关，不是高级语言。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-013","type":"fill","topic":"7.1 程序设计语言与语言层次","diff":"中","stem":"用助记符代替二进制指令和地址的语言称为 ____ 语言。","answers":["汇编","符号","assembly"],"exp":"汇编语言因使用符号，最初被称为符号语言，后来改称汇编语言。它仍需汇编程序翻译成机器语言，且与具体机器相关。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-014","type":"fill","topic":"7.1 程序设计语言与语言层次","diff":"易","stem":"计算机能够直接识别和执行、不需要任何翻译的语言是 ____ 语言。","answers":["机器","机器语言","machine"],"exp":"机器语言由二进制指令构成，是 CPU 唯一能直接执行的语言。汇编语言与高级语言都必须先翻译成机器语言。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-015","type":"short","topic":"7.1 程序设计语言与语言层次","diff":"中","stem":"比较机器语言、汇编语言与高级语言的特点。","ref":"①机器语言：由 0、1 组成的二进制指令，是 CPU 唯一能直接执行的语言；优点是速度快、不需翻译，缺点是依赖机器、可读性差、难以掌握，属第一代语言。②汇编语言：用助记符代替二进制指令，需汇编程序翻译；可读性有所改善，但仍与具体机器相关、每条机器指令都要单独编码，属第二代语言。③高级语言：更接近自然语言，可移植、开发效率高、摆脱了硬件细节，但必须经编译或解释翻译才能执行，运行效率通常低于手写机器指令，属第三代语言。","exp":"采分点：三种语言各给「是否需要翻译、是否依赖机器、可读性与开发效率」三项对比。三者的演进方向是用运行效率换取开发效率与可移植性。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-016","type":"comp","topic":"7.1 程序设计语言与语言层次","diff":"中","stem":"同一个「两整数相加」的功能，用机器语言需要 11 条指令，用汇编语言与高级语言则只需一两行。从开发效率、运行效率、可移植性、可维护性四个方面分析这种差异带来的取舍。","ref":"开发效率：机器语言要逐条写出二进制指令、手工分配地址，汇编次之，高级语言一两行即可表达，开发效率最高。\n运行效率：机器语言无需翻译、代码最紧凑，效率最高；汇编几乎一一对应，效率接近机器语言；高级语言经编译后常有冗余，效率最低。\n可移植性：机器语言与汇编语言依赖具体 CPU 的指令系统，换机器就要重写；高级语言只要目标平台有编译器即可移植。\n可维护性：机器语言几乎无法阅读和修改；汇编可读性差；高级语言结构清晰、有注释与模块，最易维护。\n取舍：语言层次越高，开发效率、可移植性、可维护性越好，运行效率越低。因此系统底层（驱动、内核关键路径）仍用汇编，应用层普遍用高级语言。","exp":"采分点：四个维度各一句对比，最后点出「效率与可维护性之间的权衡」及适用场合。只罗列现象不作取舍分析，最多得一半分。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-017","type":"single","topic":"7.2 程序的编译与解释","diff":"易","stem":"用高级语言编写的程序称为（　）。","options":["目标程序","源程序","可执行程序","汇编程序"],"answer":[1],"exp":"源程序（source code）是程序员用高级语言写成的程序文本；经翻译得到的机器语言程序称为目标程序（object program）；目标程序再经连接才成为可执行程序。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-018","type":"single","topic":"7.2 程序的编译与解释","diff":"易","stem":"源程序经翻译后得到的机器语言程序称为（　）。","options":["连接程序","源程序","汇编程序","目标程序"],"answer":[3],"exp":"目标程序是翻译的产物，还不能直接运行——它需要与程序库及其他目标程序连接，生成可执行程序后才能加载执行。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-019","type":"single","topic":"7.2 程序的编译与解释","diff":"中","stem":"编译方式的特点是（　）。","options":["在执行前把整个源程序翻译成目标程序，再整体执行","逐句翻译、翻译一句执行一句","只翻译源程序的第一行","不需要生成任何中间代码"],"answer":[0],"exp":"编译程序把整个源程序一次性翻译成目标程序并存于外存，再经连接生成可执行程序，运行时不再需要编译器。因此编译型程序执行速度快，但每次修改源程序都要重新编译。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-020","type":"single","topic":"7.2 程序的编译与解释","diff":"中","stem":"解释方式的特点是（　）。","options":["必须先连接才能执行","一次翻译整个程序并保存目标代码","逐语句翻译并立即执行，不生成独立的目标程序","执行时不需要解释器"],"answer":[2],"exp":"解释程序对源程序逐句翻译、翻译一句执行一句，不产生独立的目标程序文件，因此每次运行都要重新解释。优点是改完即可运行、便于调试；缺点是执行速度慢。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-021","type":"single","topic":"7.2 程序的编译与解释","diff":"易","stem":"词法分析的任务是（　）。","options":["分析一组助记符，找出指令","读源代码的符号，创建符号表","检查句子是否含二义性","把指令转化为机器语言"],"answer":[1],"exp":"词法分析逐个读取源程序的字符，识别出关键字、标识符、常量等符号并建立符号表，例如识别出关键字 while。语法分析、语义分析、代码生成依次在后。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-022","type":"single","topic":"7.2 程序的编译与解释","diff":"易","stem":"语法分析的任务是（　）。","options":["生成最终的机器指令","读取字符并建立符号表","检查语义是否有二义性","分析一组助记符，找出指令"],"answer":[3],"exp":"语法分析按语言的语法规则分析符号序列，判断它们能否组成合法的语句或指令，例如把 x、=、0 识别为一条赋值语句。它关心结构是否合法，不关心含义是否合理。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-023","type":"single","topic":"7.2 程序的编译与解释","diff":"易","stem":"语义分析的任务是（　）。","options":["检查语法分析建立的句子，确保不含二义性","识别源程序的字符","把目标程序与库连接","把程序装入内存"],"answer":[0],"exp":"语义分析在语法正确的基础上检查含义：类型是否匹配、变量是否已声明、语句是否存在二义性等。语法正确但语义错误的程序（如把字符串赋给整型变量）会在此阶段被查出。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-024","type":"single","topic":"7.2 程序的编译与解释","diff":"易","stem":"连接程序（链接器）的作用是（　）。","options":["把可执行程序装入内存","把源程序翻译成目标程序","把一个或多个目标程序与相关程序库组织在一起，产生可执行代码","逐句解释执行源程序"],"answer":[2],"exp":"连接程序把编译产生的目标程序与所需的库函数、其他目标程序合并，解析外部引用并重定位，最终生成可执行代码。编译、连接之后才是加载与执行。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-025","type":"single","topic":"7.2 程序的编译与解释","diff":"易","stem":"编译型程序的执行流程是（　）。","options":["加载 → 编译 → 连接 → 执行","编译 → 连接 → 加载 → 执行","编译 → 加载 → 连接 → 执行","解释 → 编译 → 执行 → 连接"],"answer":[1],"exp":"源程序先由编译器翻译成目标程序，再由连接器与库合并成可执行程序并存于外存；执行时操作系统把它从外存载入内存并运行。四步顺序固定。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-026","type":"single","topic":"7.2 程序的编译与解释","diff":"中","stem":"Java 程序能够跨平台运行，其机制是（　）。","options":["不需要任何翻译即可执行","直接用机器语言编写","每次运行前重新编译成该平台的机器码并保存","先编译成中间语言（字节码），再由各平台的 Java 虚拟机解释执行"],"answer":[3],"exp":"Java 采用混合策略：源代码先编译成与平台无关的字节码，发布到不同平台后由各自的 Java 虚拟机（JVM）解释或即时编译执行。因此「一次编译，到处运行」靠的是中间语言加虚拟机。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-027","type":"multi","topic":"7.2 程序的编译与解释","diff":"中","stem":"编译与解释的共同点有（　）。","options":["都在执行前一次性翻译整个源程序","都要经过词法分析、语法分析、语义分析等处理","最终都要产生计算机能执行的机器指令","都由专门的翻译程序完成"],"answer":[1,2,3],"exp":"两者都要做词法、语法、语义分析与代码生成，都由翻译程序完成，最终都归结为机器指令。区别在于时机与粒度：编译是执行前整体翻译，解释是逐句翻译并立即执行。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-028","type":"fill","topic":"7.2 程序的编译与解释","diff":"中","stem":"把一个或多个目标程序与相关的程序库组织在一起、产生可执行代码的程序称为 ____ 程序。","answers":["连接","链接","linker"],"exp":"连接程序（链接器）解析目标程序之间的外部引用，把库函数代码并入，完成地址重定位，生成可执行文件。它位于编译之后、加载之前。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-029","type":"short","topic":"7.2 程序的编译与解释","diff":"中","stem":"比较编译方式与解释方式的区别。","ref":"①翻译时机：编译在执行前一次性翻译整个源程序；解释是逐句翻译、翻译一句执行一句。②产物：编译生成独立的目标程序，再经连接得到可执行文件；解释不生成独立的目标程序文件。③执行效率：编译型程序运行时不再翻译，速度快；解释型程序每次运行都要重新解释，速度慢。④修改调试：编译型修改后必须重新编译连接；解释型改完即可运行，便于调试。⑤代表语言：C、C++ 属编译型，Python、MATLAB、R 属解释型；Java 采用先编译成字节码再由虚拟机执行的混合策略。","exp":"采分点：翻译时机、有无目标程序、执行效率、代表语言四项中答出三项即可。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-030","type":"comp","topic":"7.2 程序的编译与解释","diff":"难","stem":"某团队用 Java 开发的程序，在 Windows 上编译出的文件可以直接拷到 Linux 机器上运行；而用 C 开发的程序这样做往往失败。分析两者差异的原因。","ref":"Java 程序编译得到的是字节码（中间语言），不针对任何具体 CPU 的指令系统；各平台都装有对应的 Java 虚拟机，由虚拟机把字节码解释或即时编译成本机指令执行。因此同一份字节码可在不同平台运行，跨平台能力由虚拟机提供。\nC 程序编译得到的是针对特定 CPU 指令系统与操作系统调用接口的目标代码，其中包含具体的寄存器分配、地址布局和对系统库的引用。换到指令集或系统接口不同的平台，这些内容不再成立，必须用该平台的编译器重新编译。\n结论：跨平台的关键在于「是否把与平台相关的部分推迟到运行期」。Java 把这一步交给虚拟机，C 则把这一步放在编译期。","exp":"采分点：①指出 Java 产物是中间语言/字节码；②指出虚拟机承担平台适配；③指出 C 产物含平台相关的机器指令与库引用；④归纳「平台相关部分放在编译期还是运行期」。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-031","type":"single","topic":"7.3 编程范式","diff":"中","stem":"按解决问题的方法分类，编程范式有四种，即（　）。","options":["过程式、面向对象、函数式、声明式","顺序式、选择式、循环式、递归式","编译式、解释式、混合式、即时式","单机式、网络式、分布式、并行式"],"answer":[0],"exp":"编程范式（Programming Paradigm）是编写程序时所采用的基本方法和规范，按解决问题的方法分为过程式、面向对象、函数式、声明式四种。后三项分别属于程序结构、翻译方式、运行形态，不是范式分类。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-032","type":"single","topic":"7.3 编程范式","diff":"易","stem":"C 语言属于（　）语言。","options":["过程式","面向对象","函数式","声明式"],"answer":[0],"exp":"C 是典型的过程式语言：程序被看成操纵被动数据的主体，通过一个个过程（函数）按步骤处理数据。同类的还有 FORTRAN、Pascal、Ada。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-033","type":"single","topic":"7.3 编程范式","diff":"易","stem":"C++、Java、C# 属于（　）语言。","options":["函数式","过程式","面向对象","声明式"],"answer":[2],"exp":"面向对象语言以对象为中心，把数据和操作数据的方法封装在对象内部，通过消息让对象响应。C++、Java、C# 是代表，Python 也支持面向对象。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-034","type":"single","topic":"7.3 编程范式","diff":"易","stem":"LISP、Scheme 属于（　）语言。","options":["过程式","函数式","面向对象","声明式"],"answer":[1],"exp":"函数式语言把程序看成数学函数的组合：函数是把一组输入映射到输出的黑盒，程序就是把一系列黑盒连起来。LISP、Scheme、Scala 是代表。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-035","type":"single","topic":"7.3 编程范式","diff":"易","stem":"Prolog 属于（　）语言。","options":["面向对象","过程式","函数式","声明式"],"answer":[3],"exp":"声明式语言根据逻辑推理原则响应查询：程序员只描述事实与规则，由系统推导结论。Prolog 是典型代表，SQL 与 HTML 也属声明式。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-036","type":"single","topic":"7.3 编程范式","diff":"中","stem":"面向对象编程强调的是（　）。","options":["数据抽象与封装，以及对象之间的交互","程序执行的先后顺序与操作步骤","函数的组合与无副作用计算","只描述结果、不说明过程"],"answer":[0],"exp":"面向对象以对象为中心，每个对象包含数据与操作数据的方法，强调封装、继承与对象间的消息传递。强调步骤顺序的是过程式，强调函数组合的是函数式，只描述结果的是声明式。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-037","type":"single","topic":"7.3 编程范式","diff":"易","stem":"SQL 与 HTML 属于（　）语言。","options":["面向对象","过程式","声明式","函数式"],"answer":[2],"exp":"声明式语言只需描述想要的结果，不必说明如何达到。SQL 只声明要什么数据，由 DBMS 决定如何取；HTML 只声明页面结构，由浏览器负责渲染。","meta":{"source":"第 7 章课件（陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-038","type":"multi","topic":"7.3 编程范式","diff":"中","stem":"属于面向对象语言的有（　）。","options":["Java","C#","Pascal","C++"],"answer":[0,1,3],"exp":"C++、Java、C# 都是面向对象语言。Pascal 是过程式语言，与 FORTRAN、C、Ada 同类。注意 C 与 C++ 分属两个范式，这是常考的对比点。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-039","type":"fill","topic":"7.3 编程范式","diff":"中","stem":"以对象为中心、把数据和操作数据的方法封装在一起、通过消息让对象响应的编程范式称为 ____ 编程。","answers":["面向对象","OOP","object-oriented"],"exp":"面向对象的四个要素是对象、类、继承、消息通信。它处理的是「活动对象」，对象只需接收合适的外部刺激就能执行相应动作，这与过程式语言处理被动数据形成对比。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-040","type":"short","topic":"7.3 编程范式","diff":"中","stem":"简述四种编程范式及其代表语言。","ref":"①过程式：以流程为核心，关注执行顺序与操作步骤，每个任务由一个函数或过程组织；代表 C、FORTRAN、Pascal、Ada。②面向对象：以对象为中心，把数据与操作数据的方法封装在对象内，强调抽象、封装、继承与消息；代表 C++、Java、C#。③函数式：把程序看成数学函数的组合，函数是输入到输出的黑盒，强调无副作用；代表 LISP、Scheme、Scala。④声明式：只描述想要的结果，不说明如何达到；代表 Prolog、SQL、HTML。","exp":"采分点：四种范式各一句特征 + 至少一个代表语言。把 C 与 C++ 混为一类是常见错误。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-041","type":"short","topic":"7.3 编程范式","diff":"中","stem":"比较过程式编程与面向对象编程的区别。","ref":"①关注点不同：过程式以「流程」为核心，先做什么、再做什么，代码围绕任务步骤展开；面向对象以「对象」为中心，先识别问题域中的对象，再定义对象的属性与行为。②数据与操作的关系：过程式中数据是被动的，由外部过程操纵；面向对象把数据与操作封装在一起，外部只能通过接口访问。③复用方式：过程式靠函数复用；面向对象靠类与继承、组合复用。④适用场合：过程式适合强调过程、强调数据处理的软件（如计算密集的批处理）；面向对象适合大型、复杂、交互性强的系统（如用户界面程序）。","exp":"采分点：关注点、数据与操作的关系、复用方式、适用场合四点中答出三点。核心对比是「数据被动 vs 数据与操作封装在一起」。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-042","type":"comp","topic":"7.3 编程范式","diff":"中","stem":"判断下列描述分别属于哪种编程范式，并说明理由：①先打开文件、再读取内容、再处理数据、最后写入结果；②程序由一系列无副作用的函数组合而成，函数把输入映射为输出；③只写「查询所有成绩大于 90 的学生」而不写如何遍历；④定义「学生」类，包含姓名与成绩属性，以及计算平均分的方法。","ref":"①过程式：以流程为核心，代码围绕任务步骤顺序展开，每步由一个过程实现。\n②函数式：程序是函数的组合，强调无副作用与输入到输出的映射。\n③声明式：只描述想要的结果，不说明如何取得，执行路径由系统决定。\n④面向对象：以对象为中心，把数据（属性）与操作数据的方法封装在类中。","exp":"采分点：四种范式判断全对且理由落在各自的核心特征上。③容易误判为过程式，关键区别是「有没有写怎么做」。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-043","type":"single","topic":"7.4 软件与软件工程","diff":"易","stem":"软件是（　）的完整集合。","options":["程序与硬件","程序、数据及其相关文档","源代码与可执行文件","算法与数据结构"],"answer":[1],"exp":"软件 = 程序 + 数据 + 文档。程序是按事先设计的功能和性能要求执行的指令序列；数据是使程序能正常操纵信息的数据结构；文档是与开发、维护、使用有关的图文材料。只交程序不交文档，交付物是不完整的。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-044","type":"single","topic":"7.4 软件与软件工程","diff":"易","stem":"软件危机是指（　）。","options":["硬件价格大幅上涨","软件被病毒破坏导致无法运行","软件公司经营困难","软件开发和维护过程中所遇到的一系列严重问题"],"answer":[3],"exp":"软件危机的实质是落后的软件生产方式无法满足迅速增长的软件需求，导致开发与维护中出现成本超支、进度延误、质量不可靠、难以维护等一系列严重问题。它是软件工程学科产生的直接背景。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-045","type":"single","topic":"7.4 软件与软件工程","diff":"中","stem":"「软件工程」这一概念最早在（　）上被提出。","options":["1968 年第一届 NATO 会议","1970 年图灵奖颁奖典礼","1991 年 Linux 发布","2001 年敏捷宣言"],"answer":[0],"exp":"1968 年第一届 NATO 会议给出了软件工程的早期定义：「为了经济地获得可靠的且能在实际机器上有效运行的软件，而建立和使用完善的工程原理。」","meta":{"source":"第 7 章课件（陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-046","type":"single","topic":"7.4 软件与软件工程","diff":"中","stem":"1993 年 IEEE 对软件工程的定义强调（　）。","options":["软件必须使用面向对象方法","软件必须开源","把系统的、规范的、可度量的途径应用于软件的开发、运行和维护","软件必须在一年内交付"],"answer":[2],"exp":"IEEE 1993 年的定义包含两层：一是把系统的、规范的、可度量的途径应用于软件开发、运行与维护过程；二是研究这些途径本身。关键词是「系统化、规范化、可度量」，这正是「工程」与「手工作坊」的分界。","meta":{"source":"第 7 章课件（陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-047","type":"single","topic":"7.4 软件与软件工程","diff":"中","stem":"软件工程包含的两方面内容是（　）。","options":["硬件与软件","技术与管理","设计与编码","测试与维护"],"answer":[1],"exp":"软件工程是技术和管理紧密结合形成的工程学科：技术解决「怎么做」，管理解决「如何组织人、进度、成本与质量」。只讲技术不讲管理，项目照样会失控。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-048","type":"single","topic":"7.4 软件与软件工程","diff":"中","stem":"软件文档的作用是（　）。","options":["替代程序代码","提高程序的运行速度","减小可执行文件的体积","记录与程序开发、维护和使用有关的图文材料，供各阶段交接与日后维护使用"],"answer":[3],"exp":"文档是软件的组成部分，记录需求、设计、测试、使用说明等，使开发各阶段有据可查、人员更替时能接手、日后维护有依据。它不能替代程序，也不影响运行性能。","meta":{"source":"第 7 章课件（陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-049","type":"single","topic":"7.4 软件与软件工程","diff":"中","stem":"与硬件相比，软件的突出特点是（　）。","options":["是逻辑产品，不会磨损，但会因反复修改而退化","会像机械零件一样磨损","不需要维护","开发成本低于硬件"],"answer":[0],"exp":"软件是逻辑产品，没有物理磨损，但每次修改都可能引入新问题，使结构逐渐劣化（软件退化），因此维护成本往往高于开发成本。硬件则会物理磨损。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-050","type":"multi","topic":"7.4 软件与软件工程","diff":"中","stem":"软件的组成部分包括（　）。","options":["数据","文档","硬件驱动程序以外的外设","程序"],"answer":[0,1,3],"exp":"软件 = 程序 + 数据 + 文档，三者缺一不可。外设是硬件，不属于软件范畴。这条定义是判断「交付物是否完整」的依据。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-051","type":"fill","topic":"7.4 软件与软件工程","diff":"易","stem":"软件 = 程序 + 数据 + ____。","answers":["文档","相关文档"],"exp":"文档包括需求规格说明、设计说明、测试报告、用户手册等，是软件开发各阶段的产物与交接依据。缺文档的交付物只能算「程序」，不能算完整的软件。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-052","type":"fill","topic":"7.4 软件与软件工程","diff":"中","stem":"在计算机软件的开发和维护过程中所遇到的一系列严重问题，统称为 ____。","answers":["软件危机","software crisis"],"exp":"软件危机的典型表现是：开发成本与进度估计不准、用户需求不明确且频繁变更、质量不可靠、文档缺失导致难以维护。软件工程正是为消除软件危机而建立的工程学科。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-053","type":"short","topic":"7.4 软件与软件工程","diff":"中","stem":"什么是软件危机？它有哪些典型表现？","ref":"软件危机指在计算机软件的开发和维护过程中所遇到的一系列严重问题，其实质是落后的软件生产方式无法满足迅速增长的软件需求。典型表现：①开发成本和进度估计常常严重失准，超支与延期普遍；②用户需求不明确或频繁变更，导致返工；③软件质量不可靠，错误多、难以验证；④缺乏文档，人员变动后无法接手，维护困难；⑤软件规模增大后复杂度失控，生产率提升缓慢。为消除软件危机，20 世纪 60 年代后期开始形成软件工程学科。","exp":"采分点：定义（落后生产方式与迅速增长的需求之间的矛盾）+ 至少三条表现 + 指出软件工程的由来。只答「软件有 bug」不算。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-054","type":"comp","topic":"7.4 软件与软件工程","diff":"中","stem":"某学生课程设计只提交了源代码，没有需求说明、设计文档和使用说明。按软件的定义分析这份交付物是否完整，并说明缺失文档会带来哪些具体后果。","ref":"不完整。软件 = 程序 + 数据 + 文档，只交源代码相当于只交付了「程序」这一部分，数据与文档缺失。\n具体后果：①无法确认程序是否满足原始需求，验收没有依据；②他人（或半年后的自己）读不懂设计意图，修改时只能从代码反推，容易改错；③测试无据可依，无法判断哪些情况已覆盖；④用户不会安装与使用，交付物无法实际使用；⑤无法维护与扩展，软件很快变成「只能运行、不能改动」的黑盒。\n正确做法：交付需求说明、概要设计与详细设计、测试记录、用户手册，并与代码一同归档。","exp":"采分点：①按定义判定不完整；②至少三条具体后果，且落在「验收、维护、使用」上；③给出应有的交付清单。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-055","type":"single","topic":"7.5 软件生命周期","diff":"易","stem":"软件生存期由三个时期组成，它们是（　）。","options":["概要设计、详细设计、程序编写","需求分析、系统设计、编码测试","软件定义、软件开发、运行维护","立项、开发、验收"],"answer":[2],"exp":"软件生命周期（生存期）分为软件定义、软件开发、运行维护三个时期，每个时期再划分为若干阶段。这是软件工程的总体框架。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-056","type":"single","topic":"7.5 软件生命周期","diff":"易","stem":"软件定义时期包括的阶段是（　）。","options":["测试、维护","概要设计、详细设计、编码","问题定义、可行性研究、需求分析","编码、测试、维护"],"answer":[2],"exp":"软件定义时期回答「做什么、值不值得做」：问题定义明确要解决什么问题，可行性研究分析技术、经济与操作上是否可行，需求分析确定系统必须满足的功能与性能要求。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-057","type":"single","topic":"7.5 软件生命周期","diff":"易","stem":"软件开发时期包括的阶段是（　）。","options":["问题定义、可行性研究、需求分析","概要设计、详细设计、编码、测试","运行、维护、废弃","立项、预算、验收"],"answer":[1],"exp":"开发时期回答「怎么做」：概要设计确定软件的总体结构与模块划分，详细设计给出各模块的算法与数据结构，编码把设计转换成程序，测试验证程序是否符合需求。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-058","type":"single","topic":"7.5 软件生命周期","diff":"中","stem":"软件生命周期的八个阶段依次是（　）。","options":["可行性研究、概要设计、详细设计、需求分析、编码、测试、维护、评价","需求分析、问题定义、可行性研究、编码、测试、设计、维护、废弃","问题定义、需求分析、编码、测试、设计、维护、升级、废弃","问题定义、可行性研究、需求分析、概要设计、详细设计、编码、测试、维护"],"answer":[3],"exp":"八阶段顺序固定：问题定义 → 可行性研究 → 需求分析 → 概要设计 → 详细设计 → 编码 → 测试 → 维护。前三阶段属定义时期，中间四阶段属开发时期，维护单独构成维护时期。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-059","type":"single","topic":"7.5 软件生命周期","diff":"中","stem":"需求分析阶段的主要任务是（　）。","options":["确定系统必须做什么，形成需求规格说明","确定系统怎么做，划分模块","把设计转换成程序","发现程序中的错误"],"answer":[0],"exp":"需求分析回答「做什么」：调查用户的信息要求与处理要求，明确功能、性能、接口与约束，产出需求规格说明书。回答「怎么做」是设计阶段的任务。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-060","type":"single","topic":"7.5 软件生命周期","diff":"中","stem":"概要设计与详细设计的区别是（　）。","options":["概要设计在编码之后，详细设计在编码之前","概要设计写代码，详细设计写文档","概要设计确定软件总体结构与模块划分，详细设计给出各模块的算法与数据结构","两者任务完全相同，只是叫法不同"],"answer":[2],"exp":"概要设计（总体设计）解决「分成哪几个模块、模块间如何接口」；详细设计解决「每个模块内部用什么算法和数据结构实现」。前者是结构层面，后者是过程层面。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-061","type":"single","topic":"7.5 软件生命周期","diff":"易","stem":"编码阶段的主要任务是（　）。","options":["确定软件的功能需求","把详细设计的结果转换成某种程序设计语言的程序","划分软件的模块结构","发现并排除程序中的错误"],"answer":[1],"exp":"编码是「把设计翻译成程序」的过程，其质量取决于详细设计的清晰程度与所选语言的特性。发现错误是测试阶段的任务，两者不能混为一谈。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-062","type":"single","topic":"7.5 软件生命周期","diff":"中","stem":"软件测试的目的是（　）。","options":["演示程序的功能","证明程序没有错误","提高程序的运行速度","发现程序中的错误"],"answer":[3],"exp":"测试的目的是发现错误，而不是证明程序正确——穷举所有输入不可能，因此「测试通过」只说明未发现错误，不能说明没有错误。这是软件测试最基本也最容易被误解的一点。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-063","type":"multi","topic":"7.5 软件生命周期","diff":"中","stem":"属于软件定义时期的阶段有（　）。","options":["详细设计","问题定义","可行性研究","需求分析"],"answer":[1,2,3],"exp":"定义时期包含问题定义、可行性研究、需求分析三个阶段，解决「做什么、值不值得做」。详细设计属于开发时期。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-064","type":"multi","topic":"7.5 软件生命周期","diff":"中","stem":"属于软件开发时期的阶段有（　）。","options":["详细设计","编码","可行性研究","概要设计"],"answer":[0,1,3],"exp":"前三项都属于软件开发时期。可行性研究属于软件定义时期，回答的是「值不值得做」，与「怎么做」的开发阶段不同。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-065","type":"fill","topic":"7.5 软件生命周期","diff":"中","stem":"软件生存期由软件定义、软件开发和 ____ 三个时期组成。","answers":["运行维护","软件维护","维护"],"exp":"运行维护时期包含维护一个阶段，其工作量通常占软件总成本的六成以上，是生命周期中耗时最长、花费最多的部分。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-066","type":"short","topic":"7.5 软件生命周期","diff":"中","stem":"简述软件生命周期的三个时期与八个阶段。","ref":"三个时期：软件定义时期、软件开发时期、运行维护时期。\n八个阶段依次为：①问题定义（明确要解决什么问题）；②可行性研究（技术、经济、操作上是否可行）；③需求分析（确定做什么，形成需求规格说明）；④概要设计（确定总体结构与模块划分）；⑤详细设计（给出各模块的算法与数据结构）；⑥编码（把设计转换成程序）；⑦测试（发现并排除错误）；⑧维护（改正、适应、完善、预防）。前三阶段属定义时期，中间四阶段属开发时期，维护构成维护时期。","exp":"采分点：三时期与八阶段的归属正确、顺序不乱。把「维护」算进开发时期是最常见的错误。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-067","type":"short","topic":"7.5 软件生命周期","diff":"中","stem":"为什么说软件维护阶段的工作量和成本往往超过开发阶段？","ref":"原因有四：①软件交付后要长期使用，使用期远长于开发期；②用户需求会随业务变化而变更，需不断修改；③运行环境（操作系统、硬件、依赖库）升级，软件必须适配；④开发阶段遗留的错误在运行中陆续暴露，需逐个修复。此外，若开发阶段文档缺失、结构混乱，维护时只能从代码反推意图，成本进一步放大——这正是强调文档与设计质量的根本原因。","exp":"采分点：使用期长、需求变更、环境变化、遗留错误四条中答出三条，并指出「开发质量差会放大维护成本」。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-068","type":"comp","topic":"7.5 软件生命周期","diff":"中","stem":"指出下列工作分别属于软件生命周期的哪个阶段：①与用户座谈，弄清系统要支持哪些业务；②评估项目在现有技术与预算下能否完成；③画出模块结构图，确定系统分为几个子系统；④写出某模块的流程图与数据结构；⑤用 Java 实现某模块；⑥设计测试用例并执行；⑦上线后修复用户报告的缺陷。","ref":"①需求分析——调查并确定「做什么」。\n②可行性研究——从技术、经济、操作三方面判断是否值得做。\n③概要设计——确定总体结构与模块划分。\n④详细设计——给出模块内部的算法与数据结构。\n⑤编码——把设计转换成程序。\n⑥测试——设计并执行测试用例，发现错误。\n⑦维护——交付后的改正性维护。\n其中①②属定义时期，③④⑤⑥属开发时期，⑦属运行维护时期。","exp":"采分点：七个归属全对，并能正确划分所属时期。③④容易混淆：结构图属概要设计，流程图属详细设计。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-069","type":"single","topic":"7.6 软件开发过程模型","diff":"中","stem":"软件过程是指（　）。","options":["为获得高质量软件所需要完成的一系列任务的框架，它规定了完成各项任务的工作步骤","程序运行的先后顺序","CPU 执行指令的过程","软件的安装步骤"],"answer":[0],"exp":"软件过程描述为了开发出客户需要的软件，什么人（who）、在什么时候（when）、做什么事（what）以及怎样（how）做这些事。它关注的是开发活动的组织方式，不是程序运行过程。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-070","type":"single","topic":"7.6 软件开发过程模型","diff":"中","stem":"瀑布模型的核心思想是（　）。","options":["把开发活动视为一系列固定且连续的阶段，逐级下落、不可逆行","把软件分成多个增量，分批交付","反复迭代、快速原型","只写代码，不写文档"],"answer":[0],"exp":"瀑布模型把软件生命周期划分为制定计划、需求分析、软件设计、程序编写、软件测试、运行维护六个基本活动，规定它们自上而下、相互衔接的固定次序，如同瀑布流水逐级下落，一个阶段完成后才进入下一阶段。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-071","type":"single","topic":"7.6 软件开发过程模型","diff":"中","stem":"瀑布模型最适合的项目是（　）。","options":["边探索边明确需求的项目","需求频繁变更的项目","需求明确且稳定的项目","没有明确交付期限的项目"],"answer":[2],"exp":"瀑布模型以文档为驱动，要求每阶段 100% 完成后才进入下一阶段，因此只适合需求明确、稳定的项目。需求频繁变更时，后期返工代价极大。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-072","type":"single","topic":"7.6 软件开发过程模型","diff":"中","stem":"瀑布模型被称为（　）的模型。","options":["以代码为驱动","以文档为驱动","以测试为驱动","以用户反馈为驱动"],"answer":[1],"exp":"瀑布模型每个阶段都有明确的起点和终点，并产生特定的文档或成果作为下一阶段的输入，因此被称为以文档为驱动的模型。文档驱动的好处是有据可查、便于交接，代价是文档工作量重。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-073","type":"single","topic":"7.6 软件开发过程模型","diff":"中","stem":"增量模型于（　）被提出。","options":["2001 年","1968 年","1991 年","1980 年"],"answer":[3],"exp":"增量模型（渐增模型）于 1980 年提出，把软件产品作为一系列增量构件来设计、编码、集成和测试，每次交付一部分可用功能。1968 年是软件工程概念提出的年份。","meta":{"source":"第 7 章课件（陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-074","type":"single","topic":"7.6 软件开发过程模型","diff":"中","stem":"采用增量模型时，第一个增量构件通常实现（　）。","options":["软件的基本需求，提供最核心的功能","最复杂的功能","最不重要的功能","全部功能的简化版"],"answer":[0],"exp":"第一个增量往往实现基本需求、提供最核心的功能，让用户尽快拿到可用的产品并给出反馈；后续增量在此基础上逐步增加功能。这与「先做骨架、再长血肉」的思路一致。","meta":{"source":"第 7 章课件（陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-075","type":"multi","topic":"7.6 软件开发过程模型","diff":"中","stem":"瀑布模型的优点有（　）。","options":["能快速响应需求变更，返工成本低","阶段划分简明，结构清晰，易于制定计划和控制进度","文档驱动，标准化程度高，有据可查，新成员容易接手","强调需求与设计先行，迫使团队在编码前想清楚做什么和怎么做"],"answer":[1,2,3],"exp":"前三项都是瀑布模型的优点。第四项恰好相反：瀑布模型阶段不可逆，需求变更会导致大量返工，这是它最主要的缺点。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-076","type":"multi","topic":"7.6 软件开发过程模型","diff":"中","stem":"增量模型的优点有（　）。","options":["减少全新软件给客户组织带来的冲击","每个阶段都必须 100% 完成后才能进入下一阶段","能在较短时间内向用户提交可完成部分工作的产品","逐步增加功能，让用户有较充裕时间学习与适应新产品"],"answer":[0,2,3],"exp":"增量模型分批交付，用户能较早用上核心功能，也有时间逐步适应。最后一项是瀑布模型的约束，与增量模型的思路相反。","meta":{"source":"第 7 章课件（陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-077","type":"fill","topic":"7.6 软件开发过程模型","diff":"中","stem":"以文档为驱动、各阶段自上而下逐级下落且不可逆的过程模型称为 ____ 模型。","answers":["瀑布","waterfall"],"exp":"瀑布模型一直是被广泛采用的生命周期模型，至今仍是软件工程中应用最广泛的过程模型。它的核心特征是阶段固定、连续、不可逆。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-078","type":"short","topic":"7.6 软件开发过程模型","diff":"中","stem":"比较瀑布模型与增量模型。","ref":"①交付方式：瀑布模型在所有阶段完成后一次性交付完整产品；增量模型把产品分成若干增量构件，分批设计、编码、集成、测试并交付。②对需求变化的适应：瀑布模型阶段不可逆，需求变更会导致大量返工；增量模型可在后续增量中吸收变化，适应性较好。③用户参与：瀑布模型用户主要在需求分析与验收阶段参与；增量模型用户能在每个增量交付后反馈，参与更持续。④适用场合：瀑布模型适合需求明确稳定的项目；增量模型适合需求逐步明确、希望尽早见到可用产品的项目。⑤共同点：两者都按阶段推进，都需要文档与评审。","exp":"采分点：交付方式、需求适应性、用户参与、适用场合四点中答出三点，并指出共同点。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-079","type":"comp","topic":"7.6 软件开发过程模型","diff":"中","stem":"某单位要开发一套报销审批系统，业务规则由财务制度明确规定、短期内不会变化，且要求留下完整的文档以备审计。另一个团队要开发一款面向学生的校园社交应用，功能方向尚在探索，希望尽快上线收集反馈。分别推荐哪种过程模型，并说明理由。","ref":"报销审批系统推荐瀑布模型：①业务规则明确稳定，需求可以在需求分析阶段一次性确定；②审计要求完整的文档，而瀑布模型以文档为驱动，每个阶段都有明确产物；③系统规模可控、变更少，阶段不可逆带来的返工风险低。\n校园社交应用推荐增量模型：①功能方向尚在探索，需求会随用户反馈调整；②需要尽快上线核心功能（如发帖、关注）收集真实反馈；③后续增量可以逐步加入新功能，用户也有时间适应。\n选择依据可归纳为一条：需求能否在开工前确定。能确定则用瀑布，不能确定则应采用增量或迭代类模型。","exp":"采分点：①两个项目各给出正确模型；②理由落在「需求确定性」与「文档/交付节奏」上；③归纳出选择依据。只写模型名称不得分。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-080","type":"comp","topic":"7.6 软件开发过程模型","diff":"难","stem":"某项目采用瀑布模型，在测试阶段发现需求分析时对一条核心业务规则理解有误。分析这一错误为何代价高昂，并说明可采取的补救与预防措施。","ref":"代价高昂的原因：①瀑布模型阶段不可逆，需求错误在测试阶段才暴露，意味着其后的概要设计、详细设计、编码、测试全部建立在错误前提上，需要整体回退重做；②各阶段都产出了文档与代码，回退要同步修改多处，工作量按阶段数成倍放大；③项目已投入的人力与时间无法收回，进度与预算同时失控。经验上，需求阶段的错误若拖到测试阶段才修复，成本可达需求阶段的数十倍。\n补救：立即冻结后续开发，回到需求分析阶段与用户重新确认规则，更新需求规格说明，再依次修正设计、代码与测试用例；已完成的、与错误规则无关的模块尽量保留。\n预防：①需求阶段增加原型演示与用户评审，让用户在纸上或原型上确认；②关键业务规则逐条签字确认；③在概要设计阶段做需求追踪矩阵，确保每条需求都有对应设计与测试用例；④对需求不确定性高的项目改用增量或迭代模型，把验证提前。","exp":"采分点：①解释「阶段不可逆导致全链返工」；②给出回退到需求分析并同步修正后续产物的补救路径；③至少两条预防措施，其中「把验证提前」是关键。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-081","type":"single","topic":"7.7 软件工程方法学","diff":"中","stem":"目前使用最广泛的两种软件工程方法学是（　）。","options":["瀑布模型与增量模型","结构化方法与面向对象方法","编译方法与解释方法","自顶向下与自底向上"],"answer":[1],"exp":"软件工程方法学（又称范型）是软件开发全过程使用的一整套技术方法的集合，目前最常用的是结构化方法与面向对象方法。瀑布与增量是过程模型，不是方法学。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-082","type":"single","topic":"7.7 软件工程方法学","diff":"中","stem":"结构化方法学包含的三部分是（　）。","options":["结构化分析、结构化设计、结构化程序设计","需求分析、概要设计、详细设计","对象、类、继承","问题定义、可行性研究、编码"],"answer":[0],"exp":"结构化方法学由结构化分析（SA）、结构化设计（SD）、结构化程序设计（SP）三部分组成，分别对应开发中的分析、设计与编码阶段。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-083","type":"single","topic":"7.7 软件工程方法学","diff":"中","stem":"结构化方法的基本思想是（　）。","options":["只描述结果，不说明过程","把数据和操作封装成对象","把问题分解成一系列步骤或过程，每个步骤由一个函数实现，通过调用这些函数完成整个任务","把程序看成数学函数的组合"],"answer":[2],"exp":"结构化方法是一种面向过程的方法：自顶向下、逐步求精，把复杂问题分解成若干步骤，每步用一个函数实现，使用时依次调用。C 语言教学中的「自顶向下，逐步求精」就是它的典型体现。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-084","type":"single","topic":"7.7 软件工程方法学","diff":"难","stem":"结构化方法的主要局限是（　）。","options":["不能分解复杂问题","要么面向行为、要么面向数据，缺乏使两者有机结合的机制","不支持函数调用","无法用于中小型项目"],"answer":[1],"exp":"结构化方法的两条特点是：强调自顶向下顺序完成各阶段任务；要么面向行为、要么面向数据，缺乏把两者有机结合的机制。这一局限在大型、交互性强的系统中表现为耦合度高、重用性低，也正是面向对象方法兴起的原因。","meta":{"source":"第 7 章课件（陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-085","type":"single","topic":"7.7 软件工程方法学","diff":"中","stem":"面向对象方法包括的三部分是（　）。","options":["对象、类、消息","结构化分析、结构化设计、结构化编程","需求分析、概要设计、详细设计","面向对象分析、面向对象设计、面向对象编程"],"answer":[3],"exp":"面向对象方法包括 OOA（面向对象分析）、OOD（面向对象设计）、OOP（面向对象编程）三部分，分别对应分析、设计与编码阶段。对象、类、继承、消息是面向对象的组成要素，不是方法学的三部分。","meta":{"source":"第 7 章课件（陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-086","type":"single","topic":"7.7 软件工程方法学","diff":"中","stem":"Coad 和 Yourdon 用下列方程概括面向对象方法学：面向对象 =（　）。","options":["对象 + 类 + 继承 + 消息通信","程序 + 数据 + 文档","分析 + 设计 + 编程","封装 + 多态 + 重载 + 接口"],"answer":[0],"exp":"面向对象 = 对象 + 类 + 继承 + 消息通信。对象是基本单位，类是对对象的抽象，继承实现复用，消息通信是对象之间协作的方式。","meta":{"source":"第 7 章课件（陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-087","type":"multi","topic":"7.7 软件工程方法学","diff":"中","stem":"结构化方法学包含（　）。","options":["面向对象分析（OOA）","结构化分析（SA）","结构化设计（SD）","结构化程序设计（SP）"],"answer":[1,2,3],"exp":"结构化方法学由 SA、SD、SP 三部分组成。OOA 属面向对象方法学，与结构化方法并列，不能混入。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）","optperm":true},"_unit":"u7"},{"qid":"cs.u7-088","type":"fill","topic":"7.7 软件工程方法学","diff":"中","stem":"结构化方法学包含结构化分析、结构化设计和 ____ 三个方面。","answers":["结构化程序设计","SP"],"exp":"三者分别对应开发中的分析、设计与编码阶段：SA 建立功能模型与数据模型，SD 把分析结果转换为软件结构，SP 用顺序、选择、循环三种基本控制结构编写程序。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-089","type":"fill","topic":"7.7 软件工程方法学","diff":"中","stem":"把数据和对数据的操作紧密结合、以对象为中心的软件开发方法称为 ____ 方法。","answers":["面向对象","OO"],"exp":"面向对象方法强调在软件开发中面向客观世界或问题域中的事物，把数据与操作数据的方法封装在一起，形成相互依存又不可分割的整体。对大型、复杂、交互性强的系统更有优势。","meta":{"source":"第 7 章课件（陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-090","type":"short","topic":"7.7 软件工程方法学","diff":"中","stem":"比较结构化方法与面向对象方法。","ref":"①核心思想：结构化方法把问题分解成一系列步骤或过程，每步由一个函数实现，自顶向下、逐步求精；面向对象方法把数据与操作数据的方法封装成对象，以对象为中心组织程序。②组成：结构化含 SA、SD、SP；面向对象含 OOA、OOD、OOP。③数据与操作的关系：结构化中数据被动，由外部过程操纵，且方法要么面向行为、要么面向数据，缺乏结合机制；面向对象中数据与操作封装在一起，通过消息交互。④适用场合：结构化适合强调过程、强调数据处理的软件（如流水线式的计算与统计）；面向对象适合大型、复杂、交互性强的系统（如用户界面程序），在结构化设计中这类系统会出现重用性低、耦合度高的问题。","exp":"采分点：核心思想、组成、数据与操作的关系、适用场合四点中答出三点。最能体现差异的是「数据被动 vs 数据与操作封装」。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-091","type":"comp","topic":"7.7 软件工程方法学","diff":"中","stem":"某团队要开发一个图形界面的绘图软件，界面上有按钮、滚动条、画布等元素，用户点击不同元素会触发不同动作，且后续还要不断加入新图形与新工具。分析该采用哪种方法学，并说明理由。","ref":"应采用面向对象方法。理由：①系统中存在大量界限清晰的「对象」——按钮、滚动条、画布、各类图形，每个对象都有自己的状态与行为，正合面向对象的建模方式；②新增图形或工具时，只需新增一个类并实现统一接口，不必修改已有代码，扩展性好；③界面元素之间通过事件（消息）协作，与「对象 + 消息通信」的机制吻合。\n若采用结构化方法，界面元素的行为分散在各处函数中，新增一种图形往往要改动多处判断分支，导致重用性低、耦合度高，这正是结构化方法在交互式界面程序上的典型短板。\n结论：以对象为中心、交互性强、需持续扩展的系统优先选面向对象方法；以数据处理流程为主、结构稳定的系统可用结构化方法。","exp":"采分点：①选型正确；②理由落在「对象界限清晰、扩展方式、消息协作」上；③指出结构化方法在此场景的短板；④给出一般化的选择依据。","meta":{"source":"第 7 章课件（陈7 课件 PDF）"},"_unit":"u7"},{"qid":"cs.u7-092","type":"comp","topic":"7.7 软件工程方法学","diff":"中","stem":"用结构化方法把「学生早起上学」分解为若干步骤，并说明这种分解体现了结构化方法的哪些特点。","ref":"分解：起床 → 刷牙 → 吃早餐 → 上学，四个步骤依次执行；每个步骤还可以继续细分（如「吃早餐」可再分为取餐、进食、收拾），直到每一步都简单到可以直接实现。\n体现的特点：①自顶向下——先看整体流程，再逐层细化；②逐步求精——每一层都比上一层更具体，直到可以用一条条语句实现；③面向过程——按「先做什么、再做什么」的顺序组织，每个步骤由一个函数（过程）承担；④模块化——每个步骤是独立可调用的单元。\n这正是 C 语言程序设计中「自顶向下、逐步求精」的典型应用：把复杂任务拆成可管理的步骤，再逐个实现、依次调用。","exp":"采分点：①分解出四个及以上有序步骤；②指出自顶向下、逐步求精、面向过程、模块化四个特点；③能说明「继续细分直到可直接实现」这一层含义。","meta":{"source":"第 7 章课件（7-软件开发基础和软件工程概论.pptx / 陈7 课件 PDF）"},"_unit":"u7"}]}],"wrong":{"exitStreak":1},"mastery":{"wAll":0.4,"wRecent":0.6,"recentN":5,"weakBelow":60,"solidAt":85,"solidStreak":4,"passMinQ":4,"passRate":0.9,"dueDays":[1,3,7]},"codec":{"version":10,"gidBits":32,"budgetBytes":6000},"order":["g7b36b9f9","geb76ff8a","g5604cb4e","gbbf40dfe","g53d3c631","gc8006e41","gdde89a21","gffcece9c","gbf4af0af","gf58d538b     var ans = this.store.get('ans', {});
    var prev = ans[gid] || null;
    var rec = mergeRecord(prev, patch);
    // 本机的一次新作答说了算：重做答错就要记成错，不能被「信息量优先」留住旧的 true。
    // 跨设备 / 导入导出仍走 mergeRecord 的信息量优先，那是合并两处记录，不是同一次作答。
    if (patch.ok !== undefined) rec.ok = patch.ok;
    ans[gid] = rec;
    this.store.set('ans', ans);
    this._applyWrong(gid, rec, mode);
    this._log({ g: gid, t: Date.now(), k: 'attempt', ok: rec.ok, m: mode || rec.m || 'seq',
                c: rec.c, p: rec.p, x: rec.x });
    return rec;
  };

  // 规范 5.8：按信息量合并，不用先到先得
  function mergeRecord(prev, patch) {
    if (!prev) {
      var base = { ok: patch.ok == null ? null : patch.ok, at: patch.at || Date.now() };
      if (patch.p && patch.p.length) base.p = patch.p.slice().sort(function (a, b) { return a - b; });
      if (patch.x != null) base.x = patch.x;
      if (patch.m) base.m = patch.m;
      if (patch.c != null) base.c = patch.c;
      if (patch.self) base.self = true;
      return base;
    }
    var out = { ok: prev.ok, at: prev.at };
    if (prev.p) out.p = prev.p.slice();
    if (prev.x != null) out.x = prev.x;
    if (prev.m) out.m = prev.m;
    if (prev.c != null) out.c = prev.c;
    if (prev.self) out.self = true;

    var rank = { 'true': 3, 'false': 2, 'null': 1 };
    var a = rank[String(prev.ok)], b = rank[String(patch.ok)];
    if (patch.ok !== undefined && b > a) out.ok = patch.ok;
    if (patch.at && patch.at > (out.at || 0)) out.at = patch.at;
    if (patch.p && patch.p.length) out.p = patch.p.slice().sort(function (x, y) { return x - y; });
    if (patch.x != null && String(patch.x).length >= String(out.x || '').length) out.x = patch.x;
    if (patch.c != null && (out.c == null || patch.c > out.c)) out.c = patch.c;
    if (patch.m) out.m = patch.m;
    if (patch.self) out.self = true;
    return out;
  }

  /* ---- 错题状态机（规范 5.2 八条） ---- */

  Site.prototype._applyWrong = function (gid, rec, mode) {
    var wrong = this.store.get('wrong', {});
    var suppressed = this.store.get('suppress', {});
    var inSet = !!wrong[gid];
    var exitStreak = (this.def.wrong && this.def.wrong.exitStreak) || 1;
    var now = Date.now();

    if (rec.ok === false) {                       // #1 / #8
      wrong[gid] = now;
      delete suppressed[gid];
      this.store.set('wrong', wrong);
      this.store.set('suppress', suppressed);
      return;
    }
    if (rec.ok === true && mode === 'wrong' && inSet) {   // #2
      var streak = (this._streak[gid] || 0) + 1;
      this._streak[gid] = streak;
      if (streak >= exitStreak) {
        delete wrong[gid];
        delete this._streak[gid];
        this.store.set('wrong', wrong);
      }
      return;
    }
    // #3 顺序练习答对：不变；#4 ok=null：不变
  };

  Site.prototype._streak = {};
  Site.prototype.suppress = function (gid) {          // #6
    var wrong = this.store.get('wrong', {});
    var sup = this.store.get('suppress', {});
    delete wrong[gid];
    sup[gid] = Date.now();
    this.store.set('wrong', wrong);
    this.store.set('suppress', sup);
    this._log({ g: gid, t: Date.now(), k: 'suppress' });
  };

  Site.prototype.resetScope = function (kind, key) {   // #7
    var gids = this.scopeGids(kind, key);
    var keep = {};
    gids.forEach(function (g) { keep[g] = 1; });
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    gids.forEach(function (g) { delete ans[g]; delete wrong[g]; delete fav[g]; });
    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    this._log({ g: '*', t: Date.now(), k: 'reset', scope: kind + ':' + key });
  };

  Site.prototype.toggleFav = function (gid) {
    var fav = this.store.get('fav', {});
    if (fav[gid]) delete fav[gid]; else fav[gid] = Date.now();
    this.store.set('fav', fav);
    return !!fav[gid];
  };

  /* ---- 事件日志与折叠 ---- */

  Site.prototype._log = function (ev) {
    var diag = this.store.get('diag', { events: [], rounds: {}, mastery: {} });
    diag.events = diag.events || [];
    diag.events.push(ev);
    if (diag.events.length > 2000) {
      // 折叠最旧的一半进快照，再截断（规范 5.1）
      diag.events = diag.events.slice(-1000);
    }
    this.store.set('diag', diag);
  };

  Site.prototype.rebuild = function () {
    var diag = this.store.get('diag', { events: [] });
    var ans = {}, wrong = {};
    (diag.events || []).forEach(function (e) {
      if (e.k === 'reset') return;
      if (e.g === '*') return;
      if (e.k === 'attempt') {
        ans[e.g] = mergeRecord(ans[e.g] || null, { ok: e.ok, at: e.t, p: e.p, x: e.x, m: e.m, c: e.c });
        if (e.ok === false) wrong[e.g] = e.t;
        else if (e.ok === true && e.m === 'wrong' && wrong[e.g]) delete wrong[e.g];
      } else if (e.k === 'suppress') {
        delete wrong[e.g];
      }
    });
    return { ans: ans, wrong: wrong };
  };

  /* ---- 掌握度（规范 5.5） ---- */

  Site.prototype.masteryOf = function (topic) {
    var m = this.def.mastery || {};
    var wAll = m.wAll != null ? m.wAll : 0.4;
    var wRecent = m.wRecent != null ? m.wRecent : 0.6;
    var recentN = m.recentN || 5;
    var ans = this.store.get('ans', {});
    var self = this;
    var records = this.questions.filter(function (q) { return q.topic === topic && ans[q._gid]; })
      .map(function (q) { return ans[q._gid]; })
      .filter(function (r) { return r.ok !== null; });

    if (!records.length) return { topic: topic, score: null, level: null, n: 0 };

    function credit(r) {
      if (r.ok === true) return 1;
      if (r.c != null) return r.c;
      return 0;
    }
    var all = records.reduce(function (s, r) { return s + credit(r); }, 0) / records.length;
    var recent = records.slice(-recentN);
    var rec = recent.reduce(function (s, r) { return s + credit(r); }, 0) / recent.length;
    var score = Math.round(100 * (wAll * all + wRecent * rec));
    var level = score < (m.weakBelow || 60) ? '薄弱'
      : (score >= (m.solidAt || 85) ? '已掌握' : '巩固中');
    return { topic: topic, score: score, level: level, n: records.length, recent: rec, all: all };
  };

  Site.prototype.masteryAll = function () {
    var topics = {}, self = this;
    this.questions.forEach(function (q) { topics[q.topic] = 1; });
    return Object.keys(topics).sort().map(function (t) { return self.masteryOf(t); });
  };

  /* ---- 编码 / 解码 ---- */

  // 规范 3.5：超预算时按 32→24→16→8→4→0 压缩文字段，仍超才报错；单段上限 255 字节
  var TEXT_STEPS = [255, 32, 24, 16, 8, 4, 0];

  Site.prototype.encode = function (kind, key, opts) {
    var steps = (opts && opts.textLimit != null) ? [opts.textLimit] : TEXT_STEPS;
    var last = null;
    for (var i = 0; i < steps.length; i++) {
      last = this._encodeWith(kind, key, steps[i]);
      if (last.length <= this.budget) return last;
    }
    return last;   // 已降到 0 仍超预算：交给调用方提示改用题组作用域
  };

  Site.prototype._encodeWith = function (kind, key, textStep) {
    var self = this;
    var gids = this.scopeGids(kind, key);
    if (!gids.length) throw new Error('作用域 ' + kind + ':' + key + ' 内没有题目');
    var ans = this.store.get('ans', {});
    var fav = this.store.get('fav', {});
    var used = {}, widths = {};
    gids.forEach(function (g) {
      var q = self.byGid[g];
      if (q && !used[q.type]) { used[q.type] = 1; widths[q.type] = maskWidth(self.types[q.type]); }
    });

    var n = gids.length;
    var blen = (n + 7) >> 3;
    var ansBits = new Array(blen).fill(0);
    var favBits = new Array(blen).fill(0);
    var txtBits = new Array(blen).fill(0);

    var bw = new BitWriter();
    var texts = [];

    gids.forEach(function (g, i) {
      var rec = ans[g];
      if (!rec) return;
      ansBits[i >> 3] |= 1 << (i & 7);
      if (fav[g]) favBits[i >> 3] |= 1 << (i & 7);
      bw.put(rec.ok === true ? 1 : (rec.ok === false ? 2 : 0), 2);
      var w = widths[(self.byGid[g] || {}).type] || 0;
      var mask = 0;
      (rec.p || []).forEach(function (k) { if (k >= 0 && k < w) mask |= 1 << k; });
      if (w) bw.put(mask, w);
      if (rec.x != null && rec.x !== '' && textStep > 0) {
        var bytes = utf8Bytes(String(rec.x)).slice(0, 255);
        txtBits[i >> 3] |= 1 << (i & 7);
        texts.push(bytes.slice(0, textStep));
      } else if (rec.x != null && rec.x !== '') {
        // 文字被压到 0 时不写文字段，但已答位仍置 1
      }
    });

    var head = [10];
    var anyWidth = Object.keys(widths).some(function (k) { return widths[k] > 0; });
    head.push((anyWidth ? 1 : 0) | (texts.length ? 2 : 0));
    head.push({ site: 0, subject: 1, unit: 2 }[kind]);
    var kb = kind === 'site' ? [] : utf8Bytes(key);
    head.push(kb.length);
    head = head.concat(kb);
    var typeKeys = Object.keys(widths).sort();   // 与校验门一致：题型表按字典序写
    head.push(typeKeys.length);
    typeKeys.forEach(function (t) {
      var tb = utf8Bytes(t);
      head.push(tb.length);
      head = head.concat(tb);
      head.push(widths[t]);
    });
    head.push((n >> 8) & 0xff, n & 0xff);
    head = head.concat(ansBits, favBits, txtBits, bw.finish());
    texts.forEach(function (blob) { head.push(blob.length); head = head.concat(blob); });

    return '10:' + b64url(head);
  };

  Site.prototype.decode = function (code) {
    code = cleanText(code).trim();
    if (code.indexOf('10:') === 0) return this._decodeV10(code);
    if (code.indexOf('9:') === 0) return this._decodeV9(code);
    if (/^[89]:/.test(code)) throw new Error('该版本编码已不再支持，请用「导入」按钮旁的旧码迁移说明');
    throw new Error('无法识别的进度码：应以 10: 或 9: 开头');
  };

  Site.prototype._decodeV10 = function (code) {
    var data = unb64url(code.slice(3));
    if (data.length < 6 || data[0] !== 10) throw new Error('编码头损坏');
    var pos = 2;
    var kindId = data[pos++];
    var klen = data[pos++];
    var key = utf8Decode(data.slice(pos, pos + klen)); pos += klen;
    var tcount = data[pos++];
    var widths = {};
    for (var i = 0; i < tcount; i++) {
      var kl = data[pos++];
      var name = utf8Decode(data.slice(pos, pos + kl)); pos += kl;
      widths[name] = data[pos++];
    }
    var total = (data[pos] << 8) | data[pos + 1]; pos += 2;
    var blen = (total + 7) >> 3;
    var ansBits = data.slice(pos, pos + blen); pos += blen;
    var favBits = data.slice(pos, pos + blen); pos += blen;
    var txtBits = data.slice(pos, pos + blen); pos += blen;

    var kind = ['site', 'subject', 'unit'][kindId];
    var gids = this.scopeGids(kind, key);
    if (gids.length !== total) throw new Error('编码内 gid 数 ' + total + ' 与本地作用域 ' + gids.length + ' 不一致（题库版本不同？）');

    var reader = new BitReader(data, pos);
    var ans = {}, fav = {}, texts = {};
    for (var j = 0; j < total; j++) {
      var g = gids[j];
      if (favBits[j >> 3] & (1 << (j & 7))) fav[g] = Date.now();
      if (!(ansBits[j >> 3] & (1 << (j & 7)))) continue;
      var okc = reader.read(2);
      var w = widths[(this.byGid[g] || {}).type] || 0;
      var mask = w ? reader.read(w) : 0;
      var picked = [];
      if (w) for (var k = 0; k < w; k++) if (mask & (1 << k)) picked.push(k);
      ans[g] = { ok: okc === 1 ? true : (okc === 2 ? false : null), at: Date.now(), p: picked };
    }
    var tpos = reader.bytesUsed();
    for (var j2 = 0; j2 < total; j2++) {
      if (!(txtBits[j2 >> 3] & (1 << (j2 & 7)))) continue;
      if (tpos >= data.length) throw new Error('文字段提前结束');
      var ln = data[tpos++];
      texts[gids[j2]] = utf8Decode(data.slice(tpos, tpos + ln));
      tpos += ln;
    }
    return { kind: kind, key: key, ans: ans, fav: fav, texts: texts };
  };

  /* ---- v9 旧码：全站快照，按去重后的字典序 gid 排位（兼容线上原方案C） ---- */

  Site.prototype.legacyGids = function () {
    var seen = {}, out = [];
    this.questions.forEach(function (q) {
      if (!seen[q._gid]) { seen[q._gid] = 1; out.push(q._gid); }
    });
    return out.sort();          // 旧版 GID_ALL = 去重后按码元序排列
  };

  Site.prototype._decodeV9 = function (code) {
    var bin = unb64url(code.slice(2));
    if (bin.length < 3 || bin[0] !== 9) throw new Error('v9 编码头损坏');
    var total = (bin[1] << 8) | bin[2];
    var len = (total + 7) >> 3;
    var hdr = 3 + len * 3;
    if (bin.length < hdr) throw new Error('v9 编码不完整，可能复制时漏了字符');
    var gids = this.legacyGids();
    if (gids.length !== total) {
      throw new Error('v9 编码含 ' + total + ' 个 gid，本地题库为 ' + gids.length + ' 个（题库版本不同）');
    }
    var ansBits = bin.slice(3, 3 + len);
    var favBits = bin.slice(3 + len, 3 + 2 * len);
    var txtBits = bin.slice(3 + 2 * len, hdr);
    var reader = new BitReader(bin, hdr);
    var ans = {}, fav = {};
    for (var i = 0; i < total; i++) {
      var g = gids[i];
      if (favBits[i >> 3] & (1 << (i & 7))) fav[g] = Date.now();
      if (!(ansBits[i >> 3] & (1 << (i & 7)))) continue;
      var okc = reader.read(2);
      var mask = reader.read(4);        // v9 固定 4 位掩码
      var picked = [];
      for (var k = 0; k < 4; k++) if (mask & (1 << k)) picked.push(k);
      ans[g] = { ok: okc === 1 ? true : (okc === 2 ? false : null), at: Date.now(), p: picked };
    }
    var tpos = reader.bytesUsed(), texts = {};
    for (var j = 0; j < total; j++) {
      if (!(txtBits[j >> 3] & (1 << (j & 7)))) continue;
      if (tpos >= bin.length) break;
      var ln = bin[tpos++];
      texts[gids[j]] = utf8Decode(bin.slice(tpos, tpos + ln));
      tpos += ln;
    }
    return { kind: 'site', key: '', ans: ans, fav: fav, texts: texts, v: 9 };
  };

  /* ---- 旧版本机记录迁移：csg_*（gid 键）与 csunitN_*（旧题号键） ---- */

  var LEGACY_RE = /^(?:csg|cs(?:unit\d+|exam|terms|calc|midterm))_(ans|wrong|fav)_v1$/;

  function toRecord(r) {
    if (!r || typeof r !== 'object') return null;
    var ok = r.ok === true ? true : (r.ok === false ? false : null);
    var picked = Array.isArray(r.picked) ? r.picked : (Array.isArray(r.p) ? r.p : null);
    var text = r.text != null ? r.text : (r.x != null ? r.x : '');
    var answered = !!picked || !!text || ok !== null || r.done === true;
    if (!answered) return null;
    var rec = { ok: ok, at: typeof r.at === 'number' ? r.at : Date.now() };
    if (picked && picked.length) {
      rec.p = picked.filter(function (k) { return typeof k === 'number' && k >= 0; })
        .sort(function (a, b) { return a - b; });
    }
    if (text) rec.x = cleanText(text).trim();
    if (r.self === true) rec.self = true;
    if (typeof r.c === 'number') rec.c = r.c;
    return rec;
  }

  function eachLegacyEntry(value, fn) {
    if (value == null) return;
    if (Array.isArray(value)) { value.forEach(function (g) { if (typeof g === 'string') fn(g, 1); }); return; }
    if (typeof value !== 'object') return;
    Object.keys(value).forEach(function (g) { fn(g, value[g]); });
  }

  // 幂等：迁移过一次就记标记，不重复覆盖用户此后产生的记录
  Site.prototype.migrateLegacy = function () {
    var store = this.store;
    if (store.get('migrated', null)) return { skipped: true, ans: 0, wrong: 0, fav: 0 };
    if (typeof localStorage === 'undefined' || !localStorage.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    var idMap = this.legacyIdMap || {};
    var ans = store.get('ans', {});
    var wrong = store.get('wrong', {});
    var fav = store.get('fav', {});
    var self = this;
    var counts = { ans: 0, wrong: 0, fav: 0, orphan: 0 };
    var handled = [];

    function resolve(key) {
      if (/^g[0-9a-f]{8}([0-9a-f]{8})?$/.test(key)) return key;
      return idMap[key] || null;
    }

    var names = [];
    for (var i = 0; i < localStorage.length; i++) names.push(localStorage.key(i));

    names.forEach(function (name) {
      var m = LEGACY_RE.exec(name);
      if (!m) return;
      var kind = m[1];
      var raw;
      try { raw = JSON.parse(localStorage.getItem(name) || 'null'); } catch (e) { return; }
      handled.push(name);

      eachLegacyEntry(raw, function (key, val) {
        var gid = resolve(key);
        if (!gid) { counts.orphan++; return; }
        if (kind === 'ans') {
          var rec = toRecord(val);
          if (!rec) return;
          if (!ans[gid]) { ans[gid] = rec; counts.ans++; }
          else if (ans[gid].ok === null && rec.ok !== null) { ans[gid] = rec; counts.ans++; }
        } else if (kind === 'wrong') {
          if (!wrong[gid]) { wrong[gid] = typeof val === 'number' ? val : Date.now(); counts.wrong++; }
        } else if (kind === 'fav') {
          if (!fav[gid]) { fav[gid] = (val && typeof val === 'object' && typeof val.t === 'number') ? val.t : Date.now(); counts.fav++; }
        }
      });
    });

    if (!handled.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    store.set('ans', ans);
    store.set('wrong', wrong);
    store.set('fav', fav);
    store.set('migrated', { at: Date.now(), from: handled, counts: counts });
    // 旧键一律不删：回退到旧页面仍可用（规范 8.2 第 4 条）
    return counts;
  };

  // 导入：只覆盖作用域内，域外原样保留（规范 3.3）
  Site.prototype.importCode = function (code) {
    var snapshot = {
      ans: this.store.get('ans', {}), wrong: this.store.get('wrong', {}), fav: this.store.get('fav', {})
    };
    this.store.set('bak', { at: Date.now(), data: snapshot });

    var got = this.decode(code);
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var self = this;
    var touched = 0;

    Object.keys(got.ans).forEach(function (g) {
      var incoming = got.ans[g];
      if (got.texts[g] != null) incoming.x = cleanText(got.texts[g]);
      ans[g] = mergeRecord(ans[g] || null, incoming);
      if (incoming.ok === false) wrong[g] = Date.now();
      touched++;
    });
    Object.keys(got.fav).forEach(function (g) { fav[g] = fav[g] || Date.now(); });

    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    return { kind: got.kind, key: got.key, count: touched, v: got.v || 10 };
  };

  Site.prototype.undoImport = function () {
    var bak = this.store.get('bak', null);
    if (!bak) return false;
    this.store.set('ans', bak.data.ans || {});
    this.store.set('wrong', bak.data.wrong || {});
    this.store.set('fav', bak.data.fav || {});
    return true;
  };

  /* ---- 统计（三级口径，分母一律 gid 去重） ---- */

  Site.prototype.stats = function (unitKey) {
    var self = this;
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var gids = unitKey ? this.scopeGids('unit', unitKey) : this.order.slice();
    var seen = {}, total = 0, answered = 0, correct = 0, wrongN = 0, favN = 0;
    gids.forEach(function (g) {
      if (seen[g]) return;
      seen[g] = 1;
      total++;
      var r = ans[g];
      if (r) {
        answered++;
        if (r.ok === true) correct++;
      }
      if (wrong[g]) wrongN++;
      if (fav[g]) favN++;
    });
    return {
      total: total, answered: answered, correct: correct,
      rate: answered ? Math.round(100 * correct / answered) : null,
      wrong: wrongN, fav: favN
    };
  };

  var QB = {
    fpNorm: fpNorm, fpHash: fpHash, fingerprint: fingerprint,
    norm: norm, judge: judge, fuzzyEq: fuzzyEq, cleanText: cleanText,
    maskWidth: maskWidth, mergeRecord: mergeRecord,
    Store: Store, Site: Site,
    create: function (def, store) { return new Site(def, store); }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = QB;
  else root.QB = QB;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<script>/* qb-sync.js — 云端同步（手动上传 / 下载，不做任何自动网络请求）
 *

  Sync.prototype._payload = function (snap) {
    var ans = {};

    if (S.kw) p.set('kw', S.kw);

    if (S.diff) all = all.filter(function (q) { return q.diff === S.diff; });
    if (S.kw) {
      var kw = S.kw.toLowerCase();

    if (S.mode === 'wrong') all = all.filter(function (q) { return wrong[q._gid]; });
    else if (S.mode === 'fav') all = all.filter(function (q) { return fav[q._gid]; });
    else if (S.mode === 'undone') all = all.filter(function (q) { return !ans[q._gid]; });

      for (var i = all.length - 1; i > 0; i--) {

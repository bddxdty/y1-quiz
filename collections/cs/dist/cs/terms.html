<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>计算机导论 · 名词解释专题 第 1～4 章术语过关</title>
<style>/* qb-page.css — 题库页面样式（内核共用，不含任何科目特有内容） */
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e4e8ef; --line2:#eef1f6;
  --text:#1e2330; --muted:#5b6373; --muted2:#6b7383;
  --accent:#2f6fed; --accent-ink:#2557c7; --accent-soft:#eaf1ff;
  --ok:#0b6b48; --ok-soft:#e7f7ef; --ok-line:#b7e6cf;
  --bad:#b42318; --bad-soft:#fdecea; --bad-line:#f6c9c4;
  --warn:#b54708; --warn-soft:#fef3e2;
  --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 72px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:14px}
.top h1{font-size:21px;margin:0;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.top .spacer{flex:1}
.home{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:6px 12px;background:#fff}
.home:hover{color:var(--accent);border-color:#c7dbff;text-decoration:none}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.block{padding:14px 16px;margin-bottom:14px}

/* stats */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;margin-bottom:14px}
.stat-k{font-size:12px;color:var(--muted2);letter-spacing:.3px}
.stat-v{font-size:19px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-bar{height:4px;border-radius:3px;background:#eef1f6;margin-top:7px;overflow:hidden}
.stat-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl+.ctl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.seg{display:inline-flex;background:#f1f4fa;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;color:#48505f}
.seg button:hover{color:var(--accent)}
.seg button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
select,input[type=search]{
  font:inherit;font-size:13.5px;color:var(--text);border:1px solid var(--line);background:#fff;
  border-radius:9px;padding:7px 10px;outline:none
}
select:focus,input[type=search]:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=search]{min-width:170px;flex:1}
.btn{
  border:1px solid var(--line);background:#fff;color:#3c4353;border-radius:9px;padding:7px 14px;
  font:inherit;font-size:13.5px;cursor:pointer;transition:.15s
}
.btn:hover:not(:disabled){border-color:#c7dbff;color:var(--accent);background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2557c7;border-color:#2557c7;color:#fff}
.btn.ghost{background:#fff}
.btn.ghost.on{color:#b54708;border-color:#f5dcb4;background:var(--warn-soft)}
.btn.small{padding:5px 11px;font-size:13px}

/* card */
#card{padding:18px 18px 16px;margin-bottom:14px}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fafbfd;white-space:nowrap}
.tag-type{color:var(--accent-ink);border-color:#c7dbff;background:var(--accent-soft)}
.tag-diff.d-0{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.tag-diff.d-1{color:var(--warn);border-color:#f5dcb4;background:var(--warn-soft)}
.tag-diff.d-2{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.q-topic{font-size:12.5px;color:var(--muted2)}
.q-no{margin-left:auto;font-size:12.5px;color:var(--muted2);font-variant-numeric:tabular-nums}
.q-stem{font-size:16.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.q-img{max-width:100%;margin-top:10px;border-radius:8px;border:1px solid var(--line)}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;
  font:inherit;font-size:15px;line-height:1.6;cursor:pointer;transition:.13s;color:var(--text)
}
.opt:hover:not(:disabled){border-color:#c7dbff;background:#fafcff}
.opt:disabled{cursor:default}
.opt-k{
  flex:0 0 24px;height:24px;border-radius:7px;background:#f1f4fa;color:#48505f;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600
}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .opt-k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.right .opt-k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .opt-k{background:var(--bad);color:#fff}

/* inputs */
.in,.ta{
  width:100%;margin-top:14px;font:inherit;font-size:15px;color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;background:#fff;resize:vertical
}
.in:focus,.ta:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
.in:disabled,.ta:disabled{background:#fafbfd;color:var(--muted)}

/* action bar */
.q-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hint{font-size:12.5px;color:var(--muted2)}
.verdict{font-size:14px;font-weight:650;padding:5px 12px;border-radius:999px}
.verdict.ok{color:var(--ok);background:var(--ok-soft)}
.verdict.bad{color:var(--bad);background:var(--bad-soft)}
.verdict.mid{color:var(--warn);background:var(--warn-soft)}

/* explanation */
.exp{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.exp-h{font-size:12.5px;color:var(--muted2);letter-spacing:.4px;margin-bottom:7px}
.exp-a{font-size:14.5px;margin:0 0 8px;padding:10px 12px;background:#f7f9fd;border-radius:9px;border:1px solid var(--line2)}
.exp-p{font-size:14.5px;color:#333a49;margin:0 0 6px;white-space:pre-wrap}
.exp-src{font-size:12px;color:var(--muted2);margin:6px 0 0}
.self{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}

/* nav */
#nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav-mid{flex:1;text-align:center;font-size:13px;color:var(--muted2);font-variant-numeric:tabular-nums}

/* mastery */
#mastery{padding:14px 16px;margin-bottom:14px}
.mt{width:100%;border-collapse:collapse;font-size:13.5px}
.mt th{text-align:left;font-weight:600;color:var(--muted2);font-size:12px;letter-spacing:.3px;padding:0 0 8px;border-bottom:1px solid var(--line2)}
.mt td{padding:7px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
.mt tr:last-child td{border-bottom:0}
.mt-t{color:#333a49}
.mt-s{font-variant-numeric:tabular-nums;font-weight:650;width:56px}
.mt-n{color:var(--muted2);width:56px;text-align:right}
.lv{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.lv-ok{color:var(--ok);background:var(--ok-soft)}
.lv-mid{color:var(--warn);background:var(--warn-soft)}
.lv-bad{color:var(--bad);background:var(--bad-soft)}

/* transfer */
#transfer{padding:14px 16px;margin-bottom:14px}
#x-code{width:100%;min-height:86px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:10px;resize:vertical;background:#fafbfd;color:#333a49}
#x-info{font-size:12.5px;color:var(--muted2);margin-top:8px;min-height:18px}
.x-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* misc */
.empty{padding:34px 8px;text-align:center}
.empty-t{font-size:15.5px;font-weight:600}
.empty-s{color:var(--muted2);font-size:13.5px;margin:6px 0 0}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:#1e2330;color:#fff;font-size:13.5px;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--muted2);font-size:12px;text-align:center;margin-top:18px;line-height:1.8}

@media (max-width:640px){
  .wrap{padding:14px 12px 64px}
  #stats{grid-template-columns:repeat(2,1fr)}
  .top h1{font-size:18.5px}
  .q-stem{font-size:16px}
  .opt{font-size:14.5px}
  input[type=search]{min-width:100%}
}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;
}
mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */
.q-stem mjx-container[display="true"],
.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */

  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;

mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;

/* 行间公式在窄屏可横向滚动，不撑破卡片 */

</style>

）"},"_unit":"terms"},{"qid":"cs.terms-003","type":"term","topic":"1.3 计算机的工作原理","diff":"中","stem":"请解释“图灵机”。","exp":"要点：理论模型、纸带 + 读写头 + 状态、可计算性。可补充“与冯·诺依曼机的关系”。","ref":"1937 年英国数学家图灵提出的一种理论计算模型，由一条无限长的纸带、一个读写头和一个状态寄存器组成，用来刻画“什么可以被计算”。它是现代计算机的理论模型，冯·诺依曼机是其工程实现。","meta":{"origin":{"id":"t-03","no":510,"mod":"第 1 章 初识计算机","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-004","type":"term","topic":"1.1 计算机的历史与发展","diff":"中","stem":"请解释“摩尔定律”。","exp":"要点：18～24 个月、翻一番、成本下降。注意是人（戈登·摩尔）不是冯·诺依曼。","ref":"集成电路上可容纳的晶体管数目大约每 18～24 个月翻一番，同时性能翻倍、成本减半。这是戈登·摩尔提出的经验规律，并非物理定律。","meta":{"origin":{"id":"t-04","no":511,"mod":"第 1 章 初识计算机","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-005","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“位（bit）”。","exp":"要点：最小信息单位、取值 0/1。答成“存储单位”要扣分。","ref":"计算机中最小的信息单位，只有 0 和 1 两种取值。8 个二进制位组成 1 个字节。","meta":{"origin":{"id":"t-05","no":512,"mod":"第 2 章 数的表示与存储","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-006","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“字节（Byte）”。","exp":"要点：8 位、容量基本单位。","ref":"由 8 个二进制位组成的存储单位，是表示存储空间大小的基本容量单位，1B = 8bit。","meta":{"origin":{"id":"t-06","no":513,"mod":"第 2 章 数的表示与存储","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-007","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“字长”。","exp":"要点：一次并行处理的位数、由 CPU 决定、影响精度与能力。","ref":"一个字所包含的二进制位数，由 CPU 的类型决定，是 CPU 一次能并行处理的二进制位数，也是 CPU 的主要技术指标之一。字长越长，运算精度越高、处理能力越强。","meta":{"origin":{"id":"t-07","no":514,"mod":"第 2 章 数的表示与存储","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-008","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“机器数”。","exp":"要点：符号数字化、最高位为符号位、小数点是约定的。","ref":"把数值的符号和数值本身都数字化（编码为二进制）之后在计算机内部的表示形式。特点：位数受字长限制、符号位在最高位（0 正 1 负）、小数点的位置由约定隐含、不占位。","meta":{"origin":{"id":"t-08","no":515,"mod":"第 2 章 数的表示与存储","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-009","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“补码”。","exp":"要点：定义（负数反码加 1）+ 三个好处（统一符号位、减法变加法、0 唯一）。","ref":"正数的补码与原码相同；负数的补码为其反码末位加 1（即符号位为 1，其余位取反加 1）。补码使符号位与数值位统一处理，减法可转为加法，且 0 的表示唯一。","meta":{"origin":{"id":"t-09","no":516,"mod":"第 2 章 数的表示与存储","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-010","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“浮点数”。","exp":"要点：阶码 + 尾数、各自决定什么。常见错误是把两者作用说反。","ref":"用于表示非纯小数的数值表示方法，由阶码（含阶符）和尾数（含数符）两部分组成。阶码决定数值的大小（小数点位置、表示范围），尾数的位数决定数值的精度。","meta":{"origin":{"id":"t-10","no":517,"mod":"第 2 章 数的表示与存储","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-011","type":"term","topic":"3.1 CPU 与基本部件","diff":"中","stem":"请解释“CPU（中央处理单元）”。","exp":"要点：三个组成部分 + 各自职责。","ref":"计算机的核心部件，由运算器（ALU）、控制器和寄存器组组成。运算器完成算术与逻辑运算，控制器负责取指、译码并发出控制信号，寄存器用于暂存数据与地址。","meta":{"origin":{"id":"t-11","no":518,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-012","type":"term","topic":"3.2 存储器与地址空间","diff":"中","stem":"请解释“地址空间”。","exp":"要点：地址单元总数、与地址线位数的换算关系。","ref":"存储器中所有可标识的独立地址单元的总数。N 个单元需要 log₂N 位地址；反过来 n 根地址线可寻址 2ⁿ 个单元。","meta":{"origin":{"id":"t-12","no":519,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-013","type":"term","topic":"3.4 总线","diff":"中","stem":"请解释“总线”。","exp":"要点：公共通路 + 三类总线。可补充：数据总线双向、地址总线单向。","ref":"计算机各部件之间传送数据、地址和控制信息的公共通路。按传送内容分为数据总线、地址总线和控制总线三类。","meta":{"origin":{"id":"t-13","no":520,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-014","type":"term","topic":"3.3 存储类型与层次结构","diff":"中","stem":"请解释“RAM 与 ROM”。","exp":"要点：能否改写 + 是否易失，两者都要答。","ref":"RAM（随机存储器）可随机读写，断电后信息全部丢失，用于存放正在运行的程序和数据；ROM（只读存储器）正常使用时只能读出、不能随意改写，断电后内容不丢失，用于存放固化程序。","meta":{"origin":{"id":"t-14","no":521,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-015","type":"term","topic":"3.6 指令与指令周期","diff":"中","stem":"请解释“指令”。","exp":"要点：操作码 + 地址码、各自含义。","ref":"计算机执行某种操作的命令，由操作码和地址码组成。操作码指出做什么，地址码指出操作数在哪里。程序就是指令的有序序列。","meta":{"origin":{"id":"t-15","no":522,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-016","type":"term","topic":"4.1 数据结构与数组","diff":"中","stem":"请解释“数据结构”。","exp":"要点：逻辑结构 + 存储结构两个层面。只答“数据的组织方式”不够。","ref":"数据元素之间存在的关系，以及它们在计算机中的存储表示。分为逻辑结构（与计算机无关，如线性/非线性）和存储结构（物理结构，如顺序/链式）。","meta":{"origin":{"id":"t-16","no":523,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-017","type":"term","topic":"4.4 栈与队列","diff":"中","stem":"请解释“栈”。","exp":"要点：同一端操作、后进先出。","ref":"只能在栈顶进行插入（push）和删除（pop）的线性表，遵循后进先出（LIFO）原则。可用数组或链表实现。","meta":{"origin":{"id":"t-17","no":524,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-018","type":"term","topic":"4.4 栈与队列","diff":"中","stem":"请解释“队列”。","exp":"要点：尾进头出、先进先出。","ref":"在队尾插入、在队头删除的线性表，遵循先进先出（FIFO）原则。可用数组或链表实现。","meta":{"origin":{"id":"t-18","no":525,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-019","type":"term","topic":"4.2 链表","diff":"中","stem":"请解释“链表”。","exp":"要点：节点 = 数据 + 指针、分散存储、插删快查找慢。","ref":"用指针把分散存储的节点串联起来的线性结构。每个节点包含数据域和指针域，头指针标识首元，空指针表示结束。插入删除只改指针，查找必须顺序遍历。","meta":{"origin":{"id":"t-19","no":526,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-020","type":"term","topic":"4.7 算法概念与表示","diff":"中","stem":"请解释“算法”。","exp":"要点：有限步骤 + 五个特征。注意“程序 ≠ 算法”，程序可以长期运行而算法必须有穷。","ref":"解决特定问题的有限步骤的准确描述，独立于计算机和程序设计语言。具有有穷性、确定性、可行性、输入、输出五个基本特征。","meta":{"origin":{"id":"t-20","no":527,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-021","type":"term","topic":"1.1 计算机的历史与发展","diff":"易","stem":"请解释“ENIAC”。","exp":"要点：1946 年、宾夕法尼亚大学、第一台通用电子数字计算机、未采用存储程序（靠插线编程）。易错：说成“第一台计算机”或说它已采用存储程序原理。","ref":"ENIAC（Electronic Numerical Integrator And Computer，电子数字积分计算机）是 1946 年 2 月在美国宾夕法尼亚大学研制成功的世界上第一台通用电子数字计算机。它由约 1.8 万只电子管组成，体积庞大、耗电惊人，采用十进制运算；没有采用存储程序原理，计算步骤要靠开关和插线来设定。","meta":{"origin":{"id":"tm-01","no":528,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-022","type":"term","topic":"1.3 计算机的工作原理","diff":"中","stem":"请解释“存储程序”。","exp":"要点：程序和数据一起存入存储器、用二进制表示、自动取指执行、无需人工干预。易错：只答“程序存在存储器里”，漏掉“数据同等存放”和“自动执行”。","ref":"把编好的程序和要处理的数据都预先以二进制形式存入计算机的存储器中，机器启动后由控制器自动逐条取出指令并执行，全程不需要人工干预。这一原理由冯·诺依曼提出，又称程序存储原理，是计算机能够自动、高速工作的基础。","meta":{"origin":{"id":"tm-02","no":529,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-023","type":"term","topic":"1.3 计算机的工作原理","diff":"中","stem":"请解释“冯·诺依曼体系结构”。","exp":"要点：五大部分 + 存储程序 + 顺序执行 + 指令与数据同等存储。易错：漏掉“指令与数据同等存储”；把冯·诺依曼与图灵混为一谈。","ref":"由运算器、控制器、存储器、输入设备和输出设备五大部分组成，并遵循“存储程序”和“程序控制（顺序执行）”两大原则的计算机结构。程序与数据以二进制形式同等存放在存储器中，由控制器按地址顺序自动取指、译码、执行。现代通用计算机大多仍采用这一结构，又称普林斯顿结构。","meta":{"origin":{"id":"tm-03","no":530,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-024","type":"term","topic":"1.3 计算机的工作原理","diff":"中","stem":"请解释“图灵机”。","exp":"要点：理论（抽象）模型、纸带 + 读写头 + 状态、刻画可计算性。易错：与冯·诺依曼机混为一谈——前者是理论模型，后者是工程实现。","ref":"1937 年英国数学家图灵提出的一种抽象计算模型，由一条无限长的纸带、一个读写头和一个有限状态控制器组成。读写头在纸带上左右移动并读、写符号，控制器按规则改变状态，用来精确刻画“什么问题可以被机械地计算”。它是可计算性理论的基础，也是现代计算机的理论模型，冯·诺依曼机则是它的工程实现。","meta":{"origin":{"id":"tm-04","no":531,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-025","type":"term","topic":"1.1 计算机的历史与发展","diff":"易","stem":"请解释“摩尔定律”。","exp":"要点：18～24 个月、翻一番、性能升价格降、属经验规律。易错：漏掉“晶体管数目”这个主语；误记为冯·诺依曼提出。","ref":"戈登·摩尔提出的经验规律：集成电路上可容纳的晶体管数目大约每 18～24 个月翻一番，同时性能提升一倍、价格下降一半。它揭示了集成电路集成度与性价比的增长趋势，几十年来一直指导芯片产业的发展，但它只是经验总结，并不是物理定律。","meta":{"origin":{"id":"tm-05","no":532,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-026","type":"term","topic":"1.2 计算机的特点与分类","diff":"易","stem":"请解释“计算机系统”。","exp":"要点：硬件 + 软件两大部分、各自包含什么、缺一不可。易错：只答硬件；把“计算机系统”与“CPU”等同。","ref":"由硬件系统和软件系统两大部分构成的完整系统。硬件是看得见摸得着的物理设备（运算器、控制器、存储器、输入/输出设备）；软件是程序、数据和相关文档的总称。两者缺一不可：没有软件硬件无法工作，没有硬件软件无处运行。","meta":{"origin":{"id":"tm-06","no":533,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-027","type":"term","topic":"1.2 计算机的特点与分类","diff":"易","stem":"请解释“软件”。","exp":"要点：程序 + 数据 + 文档、系统软件与应用软件、逻辑产品。易错：把软件等同于程序，漏掉数据与文档。","ref":"为运行、管理和维护计算机而编制的程序、数据和相关文档的总称。分两类：系统软件（操作系统、语言处理程序、数据库管理系统等）负责管理硬件、支持其他软件运行；应用软件（文字处理、浏览器、游戏等）面向具体应用需求。软件是逻辑产品，没有物理形体。","meta":{"origin":{"id":"tm-07","no":534,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-028","type":"term","topic":"1.2 计算机的特点与分类","diff":"易","stem":"请解释“主机”。","exp":"要点：CPU + 内存（主存）、不含外设。易错：把显示器、键盘算进主机；把硬盘（外存）算进主机。","ref":"计算机硬件中除去输入、输出设备以外的部分，即中央处理器（CPU）与内存储器（主存）的合称，通常装在主机箱内。主机是计算机的运算与控制核心，各种外部设备通过接口与主机相连。","meta":{"origin":{"id":"tm-08","no":535,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-029","type":"term","topic":"1.2 计算机的特点与分类","diff":"易","stem":"请解释“外部设备”。","exp":"要点：主机之外、输入/输出/外存三类齐全、通过接口连接。易错：只答输入输出设备，漏掉外部存储器。","ref":"计算机系统中除主机以外的所有设备的总称，包括输入设备（键盘、鼠标、扫描仪、摄像头）、输出设备（显示器、打印机、绘图仪）和外部存储器（硬盘、U 盘、光盘）。外设通过接口与主机交换信息，扩展了计算机的输入输出与存储能力。","meta":{"origin":{"id":"tm-09","no":536,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-030","type":"term","topic":"1.2 计算机的特点与分类","diff":"中","stem":"请解释“数字计算机”。","exp":"要点：离散（数字）量、二进制、精度高通用性强。易错：把“数字计算机”与“电子计算机”划等号，忽略还有模拟式与混合式。","ref":"在机器内部以数字（二进制）形式表示和处理离散数据的计算机。它由数字逻辑电路构成，精度高、抗干扰、便于存储和通用处理，PC、服务器、手机都属于这一类。按原理分类，与之并列的还有处理连续物理量的模拟计算机，以及两者结合的混合计算机。","meta":{"origin":{"id":"tm-10","no":537,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-031","type":"term","topic":"1.2 计算机的特点与分类","diff":"中","stem":"请解释“巨型计算机”。","exp":"要点：速度快、容量大、功能强；“巨型”指规模性能而非体积；典型应用。易错：只答“体积大”。","ref":"又称超级计算机，指同一时期中运算速度最快、存储容量最大、功能最强、价格最贵的计算机，用于天气预报、石油勘探、航空航天、核能计算等需要海量运算的领域。它是衡量一个国家计算机技术水平的重要标志，我国的银河、天河、神威·太湖之光都属于巨型机。","meta":{"origin":{"id":"tm-11","no":538,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-032","type":"term","topic":"1.4 计算机的应用","diff":"易","stem":"请解释“科学计算”。","exp":"要点：数值计算、计算量大精度高、最早的应用领域。易错：与“数据处理”混淆——后者以非数值数据为主。","ref":"又称数值计算，指利用计算机完成科学研究和工程技术中提出的数值计算问题，如卫星轨道计算、天气预报、结构强度分析。特点是计算工作量大、精度要求高、数学模型复杂，是计算机最早也是最基本的应用领域。","meta":{"origin":{"id":"tm-12","no":539,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-033","type":"term","topic":"1.4 计算机的应用","diff":"易","stem":"请解释“数据处理”。","exp":"要点：非数值数据、数据量大计算简单、增删改查与统计、应用最广。易错：答成“科学计算”。","ref":"又称信息管理或事务处理，指利用计算机对大量数据进行采集、存储、分类、排序、统计、检索和传输，从中提取有用信息的过程。特点是数据量大而计算相对简单，如人事管理、银行账务、图书检索，是目前应用最广泛的领域。","meta":{"origin":{"id":"tm-13","no":540,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-034","type":"term","topic":"1.4 计算机的应用","diff":"中","stem":"请解释“过程控制”。","exp":"要点：实时采集—处理—输出控制信号、闭环反馈、实时性。易错：漏掉“反馈控制”这一核心，只说“用来控制机器”。","ref":"又称实时控制，指用计算机实时采集被控对象的运行数据，按预定算法处理后输出控制信号去调节被控对象，使其保持在最佳工作状态。特点是实时性强、可靠性要求高，属闭环控制，广泛用于冶金、化工、电力、航天等连续生产过程，如炉温控制、数控机床。","meta":{"origin":{"id":"tm-14","no":541,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-035","type":"term","topic":"1.4 计算机的应用","diff":"易","stem":"请解释“计算机辅助技术”。","exp":"要点：CAD 设计、CAM 制造、CAI 教学的含义与缩写对应。易错：CAD 与 CAM 互换；把 CAI 说成辅助制造。","ref":"用计算机辅助人完成各类工作的技术总称：CAD 计算机辅助设计（绘图与建模）、CAM 计算机辅助制造（数控加工）、CAI 计算机辅助教学、CAT 计算机辅助测试；CIMS 则是把设计、制造与管理集成起来的一体化制造系统。","meta":{"origin":{"id":"tm-15","no":542,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-036","type":"term","topic":"1.4 计算机的应用","diff":"中","stem":"请解释“人工智能”。","exp":"要点：模拟人类智能、感知/学习/推理/决策、典型应用。易错：把人工智能写成“自动化”或“过程控制”。","ref":"研究用计算机模拟人类智能行为（感知、学习、推理、决策、自然语言理解）的学科与技术。典型应用有专家系统、机器学习、机器视觉、智能机器人，它是计算机应用的前沿领域，也是新一代计算机（智能计算机）的发展方向。","meta":{"origin":{"id":"tm-16","no":543,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-037","type":"term","topic":"1.6 计算思维","diff":"中","stem":"请解释“计算思维”。","exp":"要点：抽象—理论—设计三步、把问题转化为可计算步骤。易错：与“会编程”等同——计算思维不等于写代码。","ref":"运用计算机科学的基本概念与方法去求解问题、设计系统和理解人类行为的思维活动，核心是把问题抽象化并转化为可由计算机执行的步骤。其过程可概括为抽象（建模）、理论（分析）、设计（实现）三个层面，与读、写、算一样属于基本能力。","meta":{"origin":{"id":"tm-17","no":544,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-038","type":"term","topic":"1.5 计算机的发展趋势","diff":"易","stem":"请解释“计算机的发展趋势”。","exp":"要点：巨型化、微型化、网络化、智能化，四点齐全。易错：用“多媒体化、标准化”等本课程未列的提法替代。","ref":"当前计算机技术发展的四个主要方向：巨型化，追求更高速度与更大容量以满足尖端科研；微型化，体积更小、功耗更低，嵌入各类设备；网络化，互联互通、资源共享与云计算；智能化，模拟人的智能，向新一代智能计算机发展。","meta":{"origin":{"id":"tm-18","no":545,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-039","type":"term","topic":"2.1 进位计数制及其转换","diff":"易","stem":"请解释“进位计数制”。","exp":"要点：固定符号集 + 进位规则、“逢 R 进一、借一当 R”。易错：漏掉“位权”这一构成要素。","ref":"按进位方式计数的数制，即用一组固定的数字符号和统一的进位规则来表示数值的方法。R 进制有 0～R−1 共 R 个数字符号，运算时“逢 R 进一、借一当 R”。常用二进制、八进制、十进制和十六进制。","meta":{"origin":{"id":"tm-19","no":546,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-040","type":"term","topic":"2.1 进位计数制及其转换","diff":"易","stem":"请解释“基数”。","exp":"要点：数字符号的个数、决定进位规则与位权倍数。易错：把基数说成“进位的位数”。","ref":"一种进位计数制中所使用的数字符号的个数，记作 R。它决定进位规则（逢 R 进一）和相邻两位位权之间的倍数关系：二进制基数 2，八进制 8，十进制 10，十六进制 16（符号为 0～9 与 A～F）。","meta":{"origin":{"id":"tm-20","no":547,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-041","type":"term","topic":"2.1 进位计数制及其转换","diff":"易","stem":"请解释“位权”。","exp":"要点：R 的幂、整数右起从 R⁰ 开始、小数部分用负指数。易错：小数部分用正指数。","ref":"在进位计数制中，某一数位所代表的固定倍率，等于基数 R 的该位序号次幂。整数部分从右向左依次为 R⁰、R¹、R²…，小数部分从左向右依次为 R⁻¹、R⁻²…。一个数的值等于各位数字与其位权乘积之和，即按权展开求和。","meta":{"origin":{"id":"tm-21","no":548,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-042","type":"term","topic":"2.2 数据的存储与表示","diff":"易","stem":"请解释“位（bit）”。","exp":"要点：最小信息单位、取值只有 0 和 1。易错：答成“最小存储单位”——存储的基本单位是字节。","ref":"比特，计算机中最小的信息单位，只有 0 和 1 两种状态，对应电路的通/断、电平的高/低。它是二进制的一位，也是存储容量与数据传输速率的最小计量单位（如 bit/s）。","meta":{"origin":{"id":"tm-22","no":549,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-043","type":"term","topic":"2.2 数据的存储与表示","diff":"易","stem":"请解释“字节（Byte）”。","exp":"要点：8 位、容量基本单位、1024 进位。易错：写成 1KB = 1000B。","ref":"由 8 个二进制位组成的存储单位，记作 B，1B = 8bit。它是计算机存储容量的基本计量单位，也是内存编址的基本单元。常用换算按 2¹⁰ = 1024 进位：1KB = 1024B、1MB = 1024KB、1GB = 1024MB。","meta":{"origin":{"id":"tm-23","no":550,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-044","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“字长”。","exp":"要点：一次并行处理的位数、由 CPU 决定、影响精度与寻址。易错：与“字节”混淆——字长不一定等于 8 位。","ref":"CPU 一次能并行处理的二进制位数，由 CPU 型号决定，是 CPU 的主要性能指标之一。字长越长，一次处理的数据越多、运算精度越高、可表示的数值范围越大，常见有 8/16/32/64 位。字长还决定了数据总线宽度，并影响寻址能力。","meta":{"origin":{"id":"tm-24","no":551,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-045","type":"term","topic":"2.2 数据的存储与表示","diff":"易","stem":"请解释“存储容量”。","exp":"要点：以字节为单位、1024 进位、标称与实际有差。易错：按 1000 换算。","ref":"存储器能容纳的二进制信息总量，基本单位是字节（B），常用 KB、MB、GB、TB 表示。换算按 2¹⁰ = 1024 进位：1KB = 1024B、1MB = 1024KB、1GB = 1024MB、1TB = 1024GB。标称容量与格式化后的可用容量常有差异，如 128GB 硬盘实际约 119GB。","meta":{"origin":{"id":"tm-25","no":552,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-046","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“机器数”。","exp":"要点：符号数字化、最高位作符号位、位数受限、小数点是约定的。易错：漏掉“符号位在最高位”。","ref":"把符号也数字化之后，数值在计算机内部的表示形式。特点是：位数受字长限制；最高位为符号位（0 正 1 负）；小数点位置由约定隐含，不占位；运算结果可能溢出。机器数所对应的实际数值称为真值。","meta":{"origin":{"id":"tm-26","no":553,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-047","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“真值”。","exp":"要点：带符号的实际值、与机器数互为表里、需要按编码规则解释。易错：把真值说成“正确的数”而不强调符号。","ref":"机器数所代表的实际数值，即带 +/− 号的真实值。例如 8 位机器数 10000001 若按原码解释，其真值为 −1。真值是逻辑上的数值，机器数是它在机器内的编码形式，两者通过原码、反码、补码规则相互转换。","meta":{"origin":{"id":"tm-27","no":554,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-048","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“原码”。","exp":"要点：符号位 + 绝对值、0 有两种写法、n 位范围。易错：漏掉“0 不唯一”这一缺陷。","ref":"符号位加数值绝对值的表示法：最高位为符号位（0 正 1 负），其余各位为二进制绝对值。0 的原码有两种（+0 = 00000000，−0 = 10000000）；n 位原码的表示范围是 −(2ⁿ⁻¹−1)～+(2ⁿ⁻¹−1)。缺点是加减运算要先判断符号，且 0 不唯一。","meta":{"origin":{"id":"tm-28","no":555,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-049","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“反码”。","exp":"要点：正数同原码、负数数值位取反、0 有两种。易错：把符号位也一起取反。","ref":"正数的反码与原码相同；负数的反码是符号位保持不变、数值位逐位取反。0 的反码同样有两种（00000000 与 11111111）。反码通常只作为求补码的中间形式，很少直接用于运算。","meta":{"origin":{"id":"tm-29","no":556,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-050","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“补码”。","exp":"要点：负数如何求、三个好处（符号位统一、减法变加法、0 唯一）、表示范围。易错：忘了“末位加 1”；把 8 位范围写成 −127～127（应为 −128～127）。","ref":"正数的补码与原码相同；负数的补码等于其反码末位加 1（等价于符号位不变、数值位取反再加 1）。补码使符号位可以和数值位一起参加运算，减法化为加法（a − b = a + (−b)补），只需加法器即可完成加减；0 的补码唯一（00000000）；n 位补码表示范围为 −2ⁿ⁻¹～2ⁿ⁻¹−1。","meta":{"origin":{"id":"tm-30","no":557,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-051","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“定点数”。","exp":"要点：小数点位置固定、分定点整数与定点小数、范围小易溢出。易错：说成“小数点可以移动”——那是浮点数。","ref":"小数点位置固定不变的数。约定小数点在数值位之后为定点整数（纯整数），在符号位与数值位之间为定点小数（纯小数）。定点数表示简单、运算速度快，但表示范围小、容易溢出，适合表示整数或纯小数。","meta":{"origin":{"id":"tm-31","no":558,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-052","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“浮点数”。","exp":"要点：阶码 + 尾数、阶码管范围、尾数管精度。易错：把两者的作用说反，这是最常见的错误。","ref":"小数点位置可以浮动的数的表示方法，由阶码（含阶符）和尾数（含数符）两部分组成。阶码决定小数点的实际位置，即表示范围；尾数的位数决定有效数字的位数，即精度。同样字长下浮点数的表示范围远大于定点数，但运算更复杂。","meta":{"origin":{"id":"tm-32","no":559,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-053","type":"term","topic":"2.2 数据的存储与表示","diff":"难","stem":"请解释“规格化”。","exp":"要点：|M| ∈ [0.5, 1)、目的为唯一性与充分利用有效位。易错：把区间写成 [0.1, 1)，那是十进制说法。","ref":"对浮点数的尾数进行规范化，使尾数绝对值落在 [0.5, 1) 区间内（即二进制 0.1B～0.111…B）的过程。规格化保证浮点数表示的唯一性，并充分利用尾数的有效位，避免 0.0011×2³ 与 0.11×2¹ 这类同一数值的多种写法。","meta":{"origin":{"id":"tm-33","no":560,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-054","type":"term","topic":"2.2 数据的存储与表示","diff":"难","stem":"请解释“溢出”。","exp":"要点：超出表示范围、浮点分上溢与下溢、判断方法。易错：把“下溢当 0 处理”说成程序出错。","ref":"运算结果超出机器数所能表示的范围。定点数超出范围即溢出；浮点数阶码超出上限称上溢（结果过大，按溢出处理），阶码低于下限称下溢（结果过小，一般按 0 处理）。补码加减运算可用“最高位进位与次高位进位是否相同”来判断是否溢出。","meta":{"origin":{"id":"tm-34","no":561,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-055","type":"term","topic":"2.2 数据的存储与表示","diff":"中","stem":"请解释“BCD 码”。","exp":"要点：4 位表示 1 位十进制、8421 权值、与纯二进制要区分。易错：把 28 写成 11100B——那是二进制而不是 BCD。","ref":"用 4 位二进制数表示 1 位十进制数字的编码，最常用的是 8421 码（四位权值依次为 8、4、2、1）。例如十进制 28 的 BCD 码为 0010 1000。BCD 码便于人机交互和十进制运算，但存储效率低（1 字节只能存 2 位十进制数），且直接按二进制规则计算后需要修正。","meta":{"origin":{"id":"tm-35","no":562,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-056","type":"term","topic":"2.3 数据的运算","diff":"中","stem":"请解释“逻辑运算”。","exp":"要点：四种运算的规则、“按位独立、无进位”、异或“相同为 0 不同为 1”。易错：异或规则记反。","ref":"对二进制位按位进行的布尔运算，基本有与（AND，全 1 才为 1）、或（OR，有 1 即 1）、非（NOT，取反）和异或（XOR，相同为 0、不同为 1）。逻辑运算按位独立进行、不产生进位，是计算机进行判断、掩码、条件控制与加密的运算基础。","meta":{"origin":{"id":"tm-36","no":563,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-057","type":"term","topic":"2.4 字符型数据的编码","diff":"易","stem":"请解释“ASCII 码”。","exp":"要点：7 位、128 个字符、占 1 字节、A = 41H、a = 61H、0 = 30H。易错：说成 8 位编码 256 个字符——标准 ASCII 是 7 位。","ref":"美国信息交换标准代码，用 7 位二进制对 128 个字符编码（96 个可打印字符 + 32 个控制字符），存储时占用 1 个字节，最高位通常为 0。常用码值：数字 0～9 为 30H～39H，大写 A 为 41H（65），小写 a 为 61H（97），同类字符的码值连续。","meta":{"origin":{"id":"tm-37","no":564,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-058","type":"term","topic":"2.4 字符型数据的编码","diff":"中","stem":"请解释“汉字输入码”。","exp":"要点：面向输入、面向人、种类多、须转成机内码。易错：与机内码、国标码混为一谈。","ref":"又称外码，是为了把汉字输入计算机而设计的编码，如拼音码、五笔字型码、区位码、手写与语音识别码。输入码面向使用者，随输入方法不同而不同；它经转换程序换成机内码之后，才能在机器内存储和处理。","meta":{"origin":{"id":"tm-38","no":565,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-059","type":"term","topic":"2.4 字符型数据的编码","diff":"中","stem":"请解释“国标码”。","exp":"要点：交换码、两个字节、= 区位码 + 2020H。易错：与机内码的 +8080H 记混。","ref":"国家标准汉字编码 GB2312—80 规定的交换码，用于不同计算机系统之间交换汉字信息。它用两个字节表示一个汉字，由区位码换算而来：国标码 = 区位码 + 2020H，即区号、位号各加 32。","meta":{"origin":{"id":"tm-39","no":566,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-060","type":"term","topic":"2.4 字符型数据的编码","diff":"中","stem":"请解释“机内码”。","exp":"要点：机内存储用、最高位置 1、= 国标码 + 8080H、占 2 字节。易错：写成 +2020H；或误认为机内码与国标码相同。","ref":"汉字在计算机内部存储、处理和传输时使用的编码。为避免与 ASCII 码混淆，把国标码两个字节的最高位都置为 1：机内码 = 国标码 + 8080H = 区位码 + A0A0H。一个汉字的机内码占 2 个字节。","meta":{"origin":{"id":"tm-40","no":567,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-061","type":"term","topic":"2.4 字符型数据的编码","diff":"中","stem":"请解释“字形码”。","exp":"要点：描述字形、点阵或矢量、字节数公式（16×16 = 32B）。易错：把字形码当成汉字在内存中的存储编码。","ref":"又称字模码，是描述汉字字形（点阵或矢量轮廓）的编码，用于显示和打印输出。点阵字形码占用的字节数 = 列数 ÷ 8 × 行数，如 16×16 点阵占 32B、24×24 点阵占 72B。字形码数据量最大，一般以字库形式存放，只在输出时调用。","meta":{"origin":{"id":"tm-41","no":568,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-062","type":"term","topic":"3.1 CPU 与基本部件","diff":"易","stem":"请解释“CPU”。","exp":"要点：三部分（运算器 + 控制器 + 寄存器组）、取指译码执行、性能指标。易错：只答“运算器 + 控制器”，漏掉寄存器组。","ref":"中央处理单元（Central Processing Unit），计算机的运算与控制核心，由运算器（ALU）、控制器（CU）和寄存器组三部分构成。它负责取指令、分析指令并执行指令，完成算术与逻辑运算，控制各部件协调工作。主要性能指标有字长、主频、核心数、Cache 容量。","meta":{"origin":{"id":"tm-42","no":569,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-063","type":"term","topic":"3.1 CPU 与基本部件","diff":"易","stem":"请解释“运算器”。","exp":"要点：算术运算 + 逻辑运算、受控制器指挥、结果暂存寄存器。易错：把 ALU 说成“指挥各部件动作”的部件。","ref":"又称算术逻辑单元（ALU），是完成算术运算（加、减、乘、除）和逻辑运算（与、或、非、异或、比较、移位）的部件。它在控制器给出的控制信号下对操作数进行处理，运算结果一般暂存到寄存器或累加器中。","meta":{"origin":{"id":"tm-43","no":570,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-064","type":"term","topic":"3.1 CPU 与基本部件","diff":"易","stem":"请解释“控制器”。","exp":"要点：取指—译码—发控制信号、主要部件。易错：漏掉“取出指令”这一步，把取指当成存储器的职责。","ref":"计算机的指挥中心，负责从内存取出指令、分析（译码）指令，并按指令要求向各部件发出控制信号，使整机有序协调地工作。主要部件有程序计数器 PC、指令寄存器 IR、指令译码器和时序控制电路。","meta":{"origin":{"id":"tm-44","no":571,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-065","type":"term","topic":"3.1 CPU 与基本部件","diff":"中","stem":"请解释“寄存器”。","exp":"要点：CPU 内部、速度最快容量最小、暂存指令/数据/地址。易错：与 Cache、主存混为一谈。","ref":"CPU 内部用于暂存指令、数据和地址的高速小容量存储部件，由触发器构成，存取速度最快、容量最小（几十到几百字节）。按用途可分为通用寄存器、指令寄存器、程序计数器和状态寄存器等。","meta":{"origin":{"id":"tm-45","no":572,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-066","type":"term","topic":"3.1 CPU 与基本部件","diff":"中","stem":"请解释“程序计数器”。","exp":"要点：存下一条指令的地址、自动递增、转移时被改写。易错：说成“存放当前正在执行的指令”——那是指令寄存器 IR。","ref":"又称指令指针（PC / IP），是 CPU 中存放“下一条要执行指令的地址”的寄存器。每取出一条指令后 PC 自动递增（加上该指令的字节数），从而保证程序顺序执行；执行转移、调用类指令时 PC 被改写为目标地址。","meta":{"origin":{"id":"tm-46","no":573,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-067","type":"term","topic":"3.2 存储器与地址空间","diff":"中","stem":"请解释“地址”。","exp":"要点：存储单元的编号、用位模式表示、地址≠内容。易错：把地址与其中的数据混为一谈。","ref":"存储器中每个存储单元的编号，用位模式（一串二进制数）表示，相当于存储单元的“门牌号”。CPU 通过地址访问存储单元，n 位地址可以区分 2ⁿ 个单元。地址与地址单元中存放的内容是两个不同的概念。","meta":{"origin":{"id":"tm-47","no":574,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-068","type":"term","topic":"3.2 存储器与地址空间","diff":"中","stem":"请解释“地址空间”。","exp":"要点：可寻址单元总数、2ⁿ 与 log₂N 的换算、与实装容量无关。易错：把地址空间等同于内存条容量。","ref":"一个计算机系统中所有可标识（可编址）的存储单元的总数，由地址线位数决定：n 根地址线（n 位地址）可寻址 2ⁿ 个单元；反过来，N 个单元需要 log₂N 位地址。地址空间反映 CPU 的最大寻址能力，与实装内存容量无关。","meta":{"origin":{"id":"tm-48","no":575,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-069","type":"term","topic":"3.3 存储类型与层次结构","diff":"易","stem":"请解释“RAM”。","exp":"要点：可读可写、易失、按地址随机存取、SRAM 与 DRAM。易错：说成“只读”或“断电不丢”。","ref":"随机存储器（Random Access Memory），可随机读写、按地址直接存取，用来存放当前正在运行的程序和数据。它的内容是易失的，断电后信息全部丢失。分 SRAM（速度快、集成度低，用作 Cache）和 DRAM（集成度高、需定时刷新，用作主存）。","meta":{"origin":{"id":"tm-49","no":576,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-070","type":"term","topic":"3.3 存储类型与层次结构","diff":"易","stem":"请解释“ROM”。","exp":"要点：只读、非易失、存放固化程序。易错：认为 ROM 绝对不可写——EEPROM/Flash 可以擦写。","ref":"只读存储器（Read Only Memory），正常使用时只能读出、不能随意改写，断电后内容不丢失，用于存放固化的程序和数据，如 BIOS、引导程序、字库。按可改写性分为掩膜 ROM、PROM、EPROM、EEPROM（闪存）。","meta":{"origin":{"id":"tm-50","no":577,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-071","type":"term","topic":"3.3 存储类型与层次结构","diff":"中","stem":"请解释“Cache”。","exp":"要点：CPU 与主存之间、存副本、先查后用、局部性原理。易错：说 Cache 扩大了主存容量——它不增加逻辑容量，只提高速度。","ref":"高速缓冲存储器，位于 CPU 与主存之间、速度接近 CPU 的小容量存储器，存放主存中当前最活跃的程序和数据的副本。访问时先查 Cache，命中就直接读取，未命中再访问主存并把该块调入。它依据“程序访问的局部性”原理，用来缓解 CPU 与主存之间的速度差。","meta":{"origin":{"id":"tm-51","no":578,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-072","type":"term","topic":"3.3 存储类型与层次结构","diff":"难","stem":"请解释“命中率”。","exp":"要点：命中次数 ÷ 总次数、越高越快、受容量与替换算法影响。易错：与“缺失率”混用——两者互补，和为 1。","ref":"在 Cache（或虚拟存储）访问中，CPU 要访问的信息恰好在高速层中而被直接取到的次数占总访问次数的比例，即命中率 = 命中次数 ÷ 总访问次数。命中率越高，平均访问时间越短、系统性能越好，其高低取决于容量与替换算法。","meta":{"origin":{"id":"tm-52","no":579,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-073","type":"term","topic":"3.4 总线","diff":"易","stem":"请解释“总线”。","exp":"要点：公共通路、分时共享、三类总线。易错：漏掉“分时共享、同一时刻只能一个部件发送”。","ref":"计算机各功能部件之间传送数据、地址和控制信息的公共通路，由一组导线及相应的控制电路组成，具有分时共享的特点——同一时刻只允许一个部件发送信息。按传送的信息分为数据总线、地址总线和控制总线三类。","meta":{"origin":{"id":"tm-53","no":580,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-074","type":"term","topic":"3.4 总线","diff":"中","stem":"请解释“数据总线 / 地址总线 / 控制总线”。","exp":"要点：三类各传什么、数据双向/地址单向、地址线位数决定寻址容量。易错：把地址总线说成双向；把数据总线宽度说成决定容量。","ref":"系统总线按传送内容分为三类：数据总线（DB）传送数据，双向，宽度一般等于字长；地址总线（AB）传送存储单元或 I/O 端口地址，单向（由 CPU 发出），宽度决定最大寻址空间；控制总线（CB）传送控制与状态信号（读/写、中断请求、时钟），一般双向，条数因 CPU 型号而异。","meta":{"origin":{"id":"tm-54","no":581,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-075","type":"term","topic":"3.5 外设与外部存储","diff":"中","stem":"请解释“接口”。","exp":"要点：主机与外设之间、速度匹配 + 格式转换 + 缓冲 + 控制状态。易错：只答“插口”，不提速度匹配与格式转换。","ref":"主机与外部设备之间进行信息交换的衔接部件，由硬件电路和相应软件组成。作用是：实现速度匹配（外设远慢于 CPU）、完成数据格式转换（串/并、数/模）、提供数据缓冲与暂存、传递控制与状态信息。常见的有 USB 接口、显示接口、SATA 接口。","meta":{"origin":{"id":"tm-55","no":582,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-076","type":"term","topic":"3.5 外设与外部存储","diff":"中","stem":"请解释“磁盘（磁道 / 扇区 / 柱面）”。","exp":"要点：磁道、扇区、柱面三者的层次关系、机械寻址、非易失。易错：把磁道与扇区的包含关系说反。","ref":"以磁性材料为存储介质的外存储器。盘面被划分为若干同心圆磁道，每条磁道又分成若干扇区（通常 512B），各盘面上半径相同的磁道组成柱面。存取时磁头沿半径方向寻道、盘片旋转定位扇区，属非易失性存储；容量大、价格低，但机械寻址速度慢于内存。","meta":{"origin":{"id":"tm-56","no":583,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-077","type":"term","topic":"3.6 指令与指令周期","diff":"易","stem":"请解释“指令”。","exp":"要点：操作码 + 地址码、各自含义、指令系统。易错：漏掉地址码；把“程序”当作最小功能单位。","ref":"指挥计算机执行某种操作的命令，是计算机能够识别并执行的最小功能单位。一条指令通常由操作码和地址码组成：操作码指出做什么操作，地址码指出操作数在哪里或结果送到哪里。一台计算机全部指令的集合称为指令系统。","meta":{"origin":{"id":"tm-57","no":584,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-078","type":"term","topic":"3.6 指令与指令周期","diff":"中","stem":"请解释“指令周期”。","exp":"要点：取指—译码—执行三阶段、PC 自增、长度因指令而异。易错：把指令周期与时钟周期（主频的倒数）等同。","ref":"CPU 取出一条指令并执行完毕所需的时间，通常包括取指、译码、执行三个阶段（有的还包括取操作数和写结果）。取指阶段按 PC 从内存读出指令，PC 自动递增；不同指令的指令周期长度可以不同。","meta":{"origin":{"id":"tm-58","no":585,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-079","type":"term","topic":"3.6 指令与指令周期","diff":"难","stem":"请解释“流水线”。","exp":"要点：分阶段 + 重叠执行、提高吞吐率而非缩短单条延迟、需处理相关与冲突。易错：说“流水线使每条指令执行得更快”。","ref":"把指令的执行过程划分为若干阶段（取指、译码、执行、写回等），让不同指令的不同阶段在时间上重叠进行的技术。它并不缩短单条指令的完成时间，但能显著提高单位时间内完成的指令数（吞吐率），是现代 CPU 提高性能的主要手段之一。","meta":{"origin":{"id":"tm-59","no":586,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-080","type":"term","topic":"3.7 冯·诺依曼体系结构","diff":"中","stem":"请解释“哈佛结构”。","exp":"要点：指令与数据分开存、独立总线、可并行取指与取数。易错：与冯·诺依曼结构的特征弄反。","ref":"一种将程序（指令）与数据分开存储、并分别使用独立总线访问的计算机结构，因此可以同时取指令和取数据，速度快、可靠性高，但硬件更复杂。与之相对的是冯·诺依曼（普林斯顿）结构——指令与数据同等存储、共用总线。单片机、DSP 多采用哈佛结构。","meta":{"origin":{"id":"tm-60","no":587,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-081","type":"term","topic":"3.7 冯·诺依曼体系结构","diff":"中","stem":"请解释“并行处理”。","exp":"要点：多个任务同时执行、时间并行与空间并行、多核多机。易错：把并行与“分时轮流使用”混为一谈。","ref":"在同一时刻或同一时间间隔内完成多个处理任务的技术思想。实现方式包括时间并行（流水线）和空间并行（多处理机、多核、阵列处理机），即在系统中设置多个控制器、运算器和存储单元，使多个任务或指令同时执行。它是提高计算机性能的重要途径。","meta":{"origin":{"id":"tm-61","no":588,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-082","type":"term","topic":"4.1 数据结构与数组","diff":"易","stem":"请解释“数据结构”。","exp":"要点：逻辑结构 + 存储结构 + 运算三个层面。易错：只答“数据的组织形式”，漏掉逻辑与存储的区分。","ref":"数据元素之间存在的关系，以及这些关系在计算机中的存储表示。通常从三个层面理解：逻辑结构（元素之间的逻辑关系）、存储结构（在存储器中的表示）和定义在结构上的运算。它决定了数据的组织方式与处理效率。","meta":{"origin":{"id":"tm-62","no":589,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-083","type":"term","topic":"4.1 数据结构与数组","diff":"中","stem":"请解释“逻辑结构”。","exp":"要点：与计算机无关、一对一/一对多/多对多、线性与非线性。易错：把“顺序存储”当成逻辑结构。","ref":"数据元素之间抽象的逻辑关系，与计算机无关，是面向问题的。按元素间关系的不同分为线性结构（一对一，如线性表、栈、队列）和非线性结构（一对多如树、多对多如图），此外还有集合结构。","meta":{"origin":{"id":"tm-63","no":590,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-084","type":"term","topic":"4.1 数据结构与数组","diff":"中","stem":"请解释“存储结构”。","exp":"要点：物理实现、顺序与链式两种基本方式、一个逻辑结构可有多种实现。易错：认为存储结构只有顺序存储一种。","ref":"又称物理结构，是逻辑结构在计算机存储器中的表示与实现，与具体机器相关。基本方式有顺序存储（用连续单元，逻辑相邻即物理相邻）和链式存储（用指针表示逻辑关系，物理上可不连续），另有索引存储和散列存储。同一逻辑结构可以有多种存储结构。","meta":{"origin":{"id":"tm-64","no":591,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-085","type":"term","topic":"4.1 数据结构与数组","diff":"中","stem":"请解释“线性结构”。","exp":"要点：一对一关系、首元素无前驱末元素无后继、栈与队列属线性结构。易错：把二叉树、图说成线性结构。","ref":"数据元素之间为一对一（线性）关系的数据结构：除第一个元素没有前驱、最后一个元素没有后继外，每个元素有且仅有一个直接前驱和一个直接后继。典型的有线性表、栈、队列、串，可用顺序或链式方式存储。","meta":{"origin":{"id":"tm-65","no":592,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-086","type":"term","topic":"4.1 数据结构与数组","diff":"中","stem":"请解释“数据元素与数据项”。","exp":"要点：数据元素是基本单位、数据项是不可再分的最小单位、一对多的组成关系。易错：把两者的层次说反。","ref":"数据元素是数据的基本单位，在程序中作为一个整体被处理（如一条学生记录）；数据项是构成数据元素的、不可再分的最小单位（如学号、姓名），也称字段。一个数据元素可以由若干数据项组成。","meta":{"origin":{"id":"tm-66","no":593,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-087","type":"term","topic":"4.1 数据结构与数组","diff":"易","stem":"请解释“数组”。","exp":"要点：同类型、连续存放、下标随机访问、二维按行优先。易错：说数组插入删除很方便。","ref":"由相同类型的数据元素按一定顺序排列而成的集合，元素存放在连续的存储单元中，通过下标（索引）定位，可以随机访问（O(1)）。一维数组逻辑上是线性结构；二维数组逻辑上是二维的，物理上按行优先或列优先排成一维。在数组中插入、删除元素需要成批移动。","meta":{"origin":{"id":"tm-67","no":594,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-088","type":"term","topic":"4.1 数据结构与数组","diff":"中","stem":"请解释“线性表”。","exp":"要点：有限序列、一对一关系、顺序与链式两种实现、可以是空表。易错：把“线性表”与“数组”等同。","ref":"由 n（n ≥ 0）个相同类型的数据元素组成的有限序列，元素之间是一对一的线性关系，n = 0 时为空表。除首尾元素外，每个元素有唯一的前驱和后继。可用顺序表（数组）或链表实现，基本运算有插入、删除、查找和遍历。","meta":{"origin":{"id":"tm-68","no":595,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-089","type":"term","topic":"4.2 链表","diff":"易","stem":"请解释“链表”。","exp":"要点：结点 = 数据域 + 指针域、物理分散、插删快查找慢。易错：说链表支持随机访问。","ref":"用指针把物理上分散存储的结点链接起来以表示线性关系的存储结构。每个结点含数据域和指针域，头指针标识第一个结点，最后一个结点的指针为空（NULL）。插入、删除只需修改指针（O(1)，不含查找），查找必须从头顺序遍历（O(n)），不需要连续空间。","meta":{"origin":{"id":"tm-69","no":596,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-090","type":"term","topic":"4.2 链表","diff":"中","stem":"请解释“结点”。","exp":"要点：数据域 + 指针域、单链表与双链表指针个数不同。易错：把结点说成“数组中的一个元素”。","ref":"链式存储中数据的基本单位，通常由两部分组成：数据域存放数据元素本身，指针域（链域）存放指向后继（或前驱）结点的地址。单链表的结点只有一个指针域，双链表的结点有两个。","meta":{"origin":{"id":"tm-70","no":597,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-091","type":"term","topic":"4.2 链表","diff":"中","stem":"请解释“头指针”。","exp":"要点：指向首元结点、链表的入口、为空即空表、与头结点的区别。易错：把头指针与头结点混为一谈。","ref":"指向链表第一个结点（首元结点）的指针，是访问整个链表的入口。只要记住头指针，就能沿指针域依次找到每一个结点；头指针为空表示空表。为便于运算，有时在首元结点之前附加一个“头结点”，其数据域不保存有效数据。","meta":{"origin":{"id":"tm-71","no":598,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-092","type":"term","topic":"4.2 链表","diff":"中","stem":"请解释“循环链表”。","exp":"要点：尾结点指针指回头部、成环、可从任一结点遍历、需要终止条件。易错：说循环链表不能为空表。","ref":"首尾相接的链表：最后一个结点的指针域不再为空，而是指向头结点（或首元结点），使整个链表形成一个环。优点是从任一结点出发都能遍历全表，常用于约瑟夫环一类问题；缺点是遍历必须用计数或判等条件终止，否则会死循环。","meta":{"origin":{"id":"tm-72","no":599,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-093","type":"term","topic":"4.2 链表","diff":"中","stem":"请解释“双向链表”。","exp":"要点：两个指针域（前驱 + 后继）、可双向查找、空间开销大。易错：漏掉“删除时不必再找前驱”这一优势。","ref":"每个结点设置两个指针域的链表：一个指向直接后继（next），一个指向直接前驱（prior）。优点是可以从任一结点向前或向后查找，删除结点时不必再从头寻找前驱；缺点是每个结点多用一个指针，空间开销更大，插入删除要修改四个指针。","meta":{"origin":{"id":"tm-73","no":600,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-094","type":"term","topic":"4.3 抽象数据类型","diff":"中","stem":"请解释“抽象数据类型”。","exp":"要点：数据对象 + 操作、只讲接口隐藏实现、与实现无关。易错：把 ADT 与具体存储结构混同。","ref":"简称 ADT，指一个数学模型以及定义在该模型上的一组操作，包括数据对象和操作两部分。它只描述“能做什么”（对外接口与语义），隐藏“怎么做”（内部表示与实现），与具体实现无关。栈、队列、树、图都可以看作抽象数据类型。","meta":{"origin":{"id":"tm-74","no":601,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-095","type":"term","topic":"4.3 抽象数据类型","diff":"中","stem":"请解释“封装”。","exp":"要点：数据与操作打包、隐藏实现、只暴露接口。易错：把封装说成“加密”或“压缩”。","ref":"把数据的表示和定义在其上的操作组合在一起，对外只暴露操作接口、隐藏内部实现细节的机制。使用者只需知道“能做什么”，不必关心“怎么做”，从而降低耦合、便于修改和复用，是抽象数据类型得以实现的关键思想。","meta":{"origin":{"id":"tm-75","no":602,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-096","type":"term","topic":"4.4 栈与队列","diff":"易","stem":"请解释“栈”。","exp":"要点：同一端操作、后进先出、push/pop、典型应用。易错：说成一端插入另一端删除——那是队列。","ref":"只允许在同一端（栈顶）进行插入和删除操作的线性表，遵循后进先出（LIFO）原则。插入称进栈（push），删除称出栈（pop）；栈底固定不动。可用顺序存储（数组）或链式存储实现。典型应用有函数调用、表达式求值、括号匹配、进制转换和递归。","meta":{"origin":{"id":"tm-76","no":603,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-097","type":"term","topic":"4.4 栈与队列","diff":"易","stem":"请解释“队列”。","exp":"要点：队尾进队头出、先进先出、顺序实现需循环队列。易错：与栈的出入规则记混。","ref":"只允许在队尾插入、在队头删除的线性表，遵循先进先出（FIFO）原则。插入称入队，删除称出队；可用顺序存储（需用循环队列避免假溢出）或链式存储实现。典型应用有打印任务排队、进程调度、广度优先搜索和缓冲区。","meta":{"origin":{"id":"tm-77","no":604,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-098","type":"term","topic":"4.4 栈与队列","diff":"难","stem":"请解释“循环队列”。","exp":"要点：取模首尾相接、front/rear 移动规则、队空 front == rear、队满牺牲一个单元。易错：把队满判据写成 rear == front——那是队空。","ref":"把顺序存储的队列在逻辑上首尾相连（用取模运算使队尾指针回到数组开头）的实现方式。通常约定 front 指向队头元素、rear 指向队尾元素的下一个位置，入队 rear = (rear+1) % n，出队 front = (front+1) % n；为区分队空与队满，一般牺牲一个存储单元，队满条件为 (rear+1) % n == front。","meta":{"origin":{"id":"tm-78","no":605,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-099","type":"term","topic":"4.4 栈与队列","diff":"难","stem":"请解释“假溢出”。","exp":"要点：队尾到顶、前面有空位、用循环队列解决。易错：把假溢出说成真溢出——真溢出才是容量确实不够。","ref":"顺序队列经过多次入队、出队后，队尾指针已到达数组末端，而数组前端因元素出队留下大量空闲单元，此时明明还有空位却无法继续入队的现象。解决办法是把数组在逻辑上首尾相连，构成循环队列。","meta":{"origin":{"id":"tm-79","no":606,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-100","type":"term","topic":"4.5 树与二叉树","diff":"中","stem":"请解释“树”。","exp":"要点：层次关系、唯一根结点、一对多、递归定义（子树）。易错：说树是线性结构。","ref":"由 n（n ≥ 0）个结点组成的具有层次关系的有限集合。n = 0 时为空树；非空树有且仅有一个根结点，其余结点分成若干互不相交的子树，每个结点最多有一个前驱（双亲）、可以有多个后继（孩子）。树是一种一对多的非线性结构。","meta":{"origin":{"id":"tm-80","no":607,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-101","type":"term","topic":"4.5 树与二叉树","diff":"中","stem":"请解释“结点的度”。","exp":"要点：孩子个数、度为 0 即叶子、树的度为最大结点度。易错：把“结点的度”与“树的深度”混淆。","ref":"结点所拥有的子树（孩子）个数。度为 0 的结点是叶子结点，度不为 0 的是分支结点；树中所有结点度的最大值称为树的度。二叉树中结点的度只能取 0、1、2。","meta":{"origin":{"id":"tm-81","no":608,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-102","type":"term","topic":"4.5 树与二叉树","diff":"易","stem":"请解释“叶子结点”。","exp":"要点：度为 0、终端结点、n₀ = n₂ + 1。易错：把公式记成 n₀ = n₂ − 1。","ref":"又称终端结点，指度为 0（没有孩子）的结点。二叉树中有重要性质：n₀ = n₂ + 1，即叶子结点数总比度为 2 的结点数多 1，可由结点总数与分支总数的关系推出。","meta":{"origin":{"id":"tm-82","no":609,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-103","type":"term","topic":"4.5 树与二叉树","diff":"易","stem":"请解释“二叉树”。","exp":"要点：至多两棵子树、左右有序、第 i 层 2^(i−1)、k 层最多 2^k − 1。易错：漏掉“左右子树不能颠倒”。","ref":"每个结点至多有两棵子树的树，并且子树有左右之分、次序不能颠倒。第 i 层最多有 2^(i−1) 个结点，深度为 k 的二叉树最多有 2^k − 1 个结点。它是树结构中最常用的一种，便于存储与遍历。","meta":{"origin":{"id":"tm-83","no":610,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-104","type":"term","topic":"4.5 树与二叉树","diff":"中","stem":"请解释“满二叉树”。","exp":"要点：每层都满、共 2^k − 1 个结点、叶子都在最后一层。易错：与完全二叉树混为一谈。","ref":"深度为 k 且含有 2^k − 1 个结点的二叉树，即每一层的结点数都达到最大值。特点是除叶子结点外每个结点都有两棵子树，叶子全部集中在最下一层，结点可按层序从上到下、从左到右连续编号。","meta":{"origin":{"id":"tm-84","no":611,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-105","type":"term","topic":"4.5 树与二叉树","diff":"中","stem":"请解释“完全二叉树”。","exp":"要点：与满二叉树前 n 个编号一一对应、只缺右下角、适合数组存储。易错：把“每层都满”的满二叉树当成完全二叉树的定义。","ref":"深度为 k、有 n 个结点的二叉树，当且仅当它的每个结点都与深度为 k 的满二叉树中编号 1～n 的结点一一对应时，称为完全二叉树。特点是叶子只出现在最下两层、最下层的叶子集中在左侧、除最后一层外每层都满；适合用一维数组顺序存储，父结点下标为 i 时孩子为 2i 和 2i+1。","meta":{"origin":{"id":"tm-85","no":612,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-106","type":"term","topic":"4.5 树与二叉树","diff":"中","stem":"请解释“二叉树的遍历”。","exp":"要点：三种次序中“根”的位置、每结点仅访问一次、层次遍历。易错：先序与中序的次序写反。","ref":"按某条搜索路径访问二叉树中的每个结点，且每个结点仅访问一次的过程。按访问根结点的时机分为先序遍历（根—左—右）、中序遍历（左—根—右）、后序遍历（左—右—根），此外还有按层访问的层次遍历。遍历是查找、统计、复制等运算的基础。","meta":{"origin":{"id":"tm-86","no":613,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-107","type":"term","topic":"4.6 图","diff":"易","stem":"请解释“图”。","exp":"要点：V + E、多对多网状关系、有向/无向、可带权。易错：说图是线性结构或树形结构。","ref":"由非空的顶点集合 V 和描述顶点之间关系的边集合 E 组成的数据结构，记作 G = (V, E)。图中元素之间是多对多的网状关系，属非线性结构；边可以有方向（有向图）或无方向（无向图），也可以带权（网）。","meta":{"origin":{"id":"tm-87","no":614,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-108","type":"term","topic":"4.6 图","diff":"中","stem":"请解释“有向图与无向图”。","exp":"要点：有序对与无序对、两个边数上限公式。易错：把 n(n−1)/2 与 n(n−1) 用反。","ref":"边有方向的图称有向图，边称弧，用有序对 <vi, vj> 表示，vi→vj 与 vj→vi 是两条不同的弧；边无方向的图称无向图，边用无序对 (vi, vj) 表示，表示 vi 与 vj 互通。n 个顶点的无向图边数最多 n(n−1)/2，有向图最多 n(n−1)。","meta":{"origin":{"id":"tm-88","no":615,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-109","type":"term","topic":"4.6 图","diff":"中","stem":"请解释“顶点的度”。","exp":"要点：关联边数、有向图分入度与出度、度数之和为边数的 2 倍。易错：漏掉“2 倍”。","ref":"与该顶点相关联的边的数目。无向图中顶点 v 的度记作 TD(v)；有向图中分为出度（以 v 为起点的弧数）与入度（以 v 为终点的弧数），度 = 出度 + 入度。无向图所有顶点的度数之和等于边数的 2 倍；有向图所有顶点的入度之和等于出度之和，都等于弧数。","meta":{"origin":{"id":"tm-89","no":616,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-110","type":"term","topic":"4.6 图","diff":"中","stem":"请解释“邻接矩阵”。","exp":"要点：n×n 二维数组、1/0 或权值、无向图对称、O(n²) 空间。易错：把 0 解释成“有边”。","ref":"用二维数组表示图的存储结构：n 个顶点对应一个 n×n 矩阵，A[i][j] = 1（或边的权值）表示顶点 i 到 j 有边（弧），为 0 表示不邻接。无向图的邻接矩阵是对称矩阵。优点是判断两点是否邻接快、便于矩阵运算；缺点是稀疏图浪费空间，空间复杂度 O(n²)。","meta":{"origin":{"id":"tm-90","no":617,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"},{"qid":"cs.terms-111","type":"term","topic":"4.6 图","diff":"难","stem":"请解释“邻接表”。","exp":"要点：顶点数组 + 单链表、O(n+e)、适合稀疏图、求入度不便。易错：说邻接表适合稠密图。","ref":"图的一种链式存储结构：为每个顶点建立一个单链表，链表中的结点存放与该顶点相邻的顶点序号（及权值），各链表的头指针组成一个数组。空间复杂度 O(n+e)，适合稀疏图；缺点是判断两顶点是否邻接需遍历链表，表示有向图时求入度不便，可另建逆邻接表。","meta":{"origin":{"id":"tm-91","no":618,"mod":"名词解释","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"terms"}]}],"wrong":{"exitStreak":1},"mastery":{"wAll":0.4,"wRecent":0.6,"recentN":5,"weakBelow":60,"solidAt":85,"solidStreak":4,"passMinQ":4,"passRate":0.9,"dueDays":[1,3,7]},"codec":{"version":10,"gidBits":32,"       return { ok: Math.abs(got - want) <= tol, credit: null };

  /* ---------------------------------------------------------------- 编码 v10 */

  function unb64url(text) {

  /* ---------------------------------------------------------------- 站点实例 */

    } catch (e) { raw = null; }
    if (raw == null) {
      if (this.mem && this.mem[name] != null) return JSON.parse(JSON.stringify(this.mem[name]));

    try { return JSON.parse(raw); } catch (e) { return fallback; }

  Store.prototype.set = function (name, value) {

    } catch (e) { /* 配额满：保留内存态，不中断作答 */ }
  };

  Store.prototype.remove = function (name) {

  function Site(def, store) {

    this.retired = {};
    (def.retired || []).forEach(function (g) { this.retired[g] = 1; }, this);
    this.bits = (def.codec && def.codec.gidBits) || 32;
    this.budget = (def.codec && def.codec.budgetBytes) || 6000;
    this.questions = [];
    this.byGid = {};
    this.byQid = {};

  }

  Site.prototype._index = function (units) {
    var self = this;

    this.scopeSubject = [];

      var list = [], seen = {};
      (unit.questions || []).forEach(function (q) {
        q._gid = fingerprint(q, self.bits);
        q._unit = unit.key;
        q._unitLabel = unit.label;
        q._unitTitle = unit.title;
        self.questions.push(q);
        if (!self.byGid[q._gid]) self.byGid[q._gid] = q;
        self.byQid[q.qid] = q;
        if (!seen[q._gid]) { seen[q._gid] = 1; list.push(q._gid); }
        if (!seenSubj[q._gid]) { seenSubj[q._gid] = 1; self.scopeSubject.push(q._gid); }
        if (q.meta && q.meta.origin && q.meta.origin.id) {
          self.legacyIdMap[String(q.meta.origin.id)] = q._gid;
        }
      });
      self.scopeUnit[unit.key] = list;
    });

    var known = {};
    this.order.forEach(function (g) { known[g] = 1; });
    this.questions.forEach(function (q) {

  };

  Site.prototype.gidOf = function (q) { return q._gid || fingerprint(q, this.bits); };

  // 同一道题同时出现在两个题组时，题组作用域各自保留一份——否则含副本的题组
  // 会与独立部署包算出不同的序，导致进度码对不上。

  };

  /* ---- 状态读取（投影视图） ---- */

  Site.prototype.get = function (gid) {
    var ans = this.store.get('ans', {});
    return ans[gid] || null;
  };

  Site.prototype.allAns = function () { return this.store.get('ans', {}); };
  Site.prototype.allWrong = function () { return this.store.get('wrong', {}); };
  Site.prototype.allFav = function () { return this.store.get('fav', {}); };

  Site.prototype.put = function (gid, patch, mode) {
    var ans = this.store.get('ans', {});
    var prev = ans[gid] || null;
    var rec = mergeRecord(prev, patch);
    // 本机的一次新作答说了算：重做答错就要记成错，不能被「信息量优先」留住旧的 true。
    // 跨设备 / 导入导出仍走 mergeRecord 的信息量优先，那是合并两处记录，不是同一次作答。
    if (patch.ok !== undefined) rec.ok = patch.ok;
    ans[gid] = rec;
    this.store.set('ans', ans);
    this._applyWrong(gid, rec, mode);
    this._log({ g: gid, t: Date.now(), k: 'attempt', ok: rec.ok, m: mode || rec.m || 'seq',

    return rec;
  };

  // 规范 5.8：按信息量合并，不用先到先得
  function mergeRecord(prev, patch) {
    if (!prev) {
      var base = { ok: patch.ok == null ? null : patch.ok, at: patch.at || Date.now() };
      if (patch.p && patch.p.length) base.p = patch.p.slice().sort(function (a, b) { return a - b; });
      if (patch.x != null) base.x = patch.x;
      if (patch.m) base.m = patch.m;
      if (patch.c != null) base.c = patch.c;
      if (patch.self) base.self = true;
      return base;
    }
    var out = { ok: prev.ok, at: prev.at };
    if (prev.p) out.p = prev.p.slice();
    if (prev.x != null) out.x = prev.x;
    if (prev.m) out.m = prev.m;
    if (prev.c != null) out.c = prev.c;
    if (prev.self) out.self = true;

    var a = rank[String(prev.ok)], b = rank[String(patch.ok)];

    if (patch.at && patch.at > (out.at || 0)) out.at = patch.at;
    if (patch.p && patch.p.length) out.p = patch.p.slice().sort(function (x, y) { return x - y; });
    if (patch.x != null && String(patch.x).length >= String(out.x || '').length) out.x = patch.x;
    if (patch.c != null && (out.c == null || patch.c > out.c)) out.c = patch.c;
    if (patch.m) out.m = patch.m;
    if (patch.self) out.self = true;

  /* ---- 错题状态机（规范 5.2 八条） ---- */

  Site.prototype._applyWrong = function (gid, rec, mode) {

    var suppressed = this.store.get('suppress', {});

    var exitStreak = (this.def.wrong && this.def.wrong.exitStreak) || 1;
    var now = Date.now();

    if (rec.ok === false) {                       // #1 / #8
      wrong[gid] = now;
      delete suppressed[gid];
      this.store.set('wrong', wrong);
      this.store.set('suppress', suppressed);
      return;
    }
    if (rec.ok === true && mode === 'wrong' && inSet) {   // #2
      var streak = (this._streak[gid] || 0) + 1;
      this._streak[gid] = streak;
      if (streak >= exitStreak) {
        delete wrong[gid];
        delete this._streak[gid];
        this.store.set('wrong', wrong);

      return;
    }

  };

  Site.prototype._streak = {};
  Site.prototype.suppress = function (gid) {          // #6

    var sup = this.store.get('suppress', {});

  Site.prototype.resetScope = function (kind, key) {   // #7

    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    gids.forEach(function (g) { delete ans[g]; delete wrong[g]; delete fav[g]; });
    this.store.set('ans', ans);

  Site.prototype.toggleFav = function (gid) {

  /* ---- 事件日志与折叠 ---- */

  Site.prototype.rebuild = function () {

      if (e.g === '*') return;
      if (e.k === 'attempt') {
        ans[e.g] = mergeRecord(ans[e.g] || null, { ok: e.ok, at: e.t, p: e.p, x: e.x, m: e.m, c: e.c });
        if (e.ok === false) wrong[e.g] = e.t;
        else if (e.ok === true && e.m === 'wrong' && wrong[e.g]) delete wrong[e.g];

  /* ---- 掌握度（规范 5.5） ---- */

  Site.prototype.masteryOf = function (topic) {

    var wRecent = m.wRecent != null ? m.wRecent : 0.6;
    var recentN = m.recentN || 5;
    var ans = this.store.get('ans', {});
    var self = this;
    var records = this.questions.filter(function (q) { return q.topic === topic && ans[q._gid]; })
      .map(function (q) { return ans[q._gid]; })
      .filter(function (r) { return r.ok !== null; });

    if (!records.length) return { topic: topic, score: null, level: null, n: 0 };

    function credit(r) {
      if (r.ok === true) return 1;
      if (r.c != null) return r.c;
      return 0;
    }
    var all = records.reduce(function (s, r) { return s + credit(r); }, 0) / records.length;
    var recent = records.slice(-recentN);
    var rec = recent.reduce(function (s, r) { return s + credit(r); }, 0) / recent.length;
    var score = Math.round(100 * (wAll * all + wRecent * rec));
    var level = score < (m.weakBelow || 60) ? '薄弱'

    return { topic: topic, score: score, level: level, n: records.length, recent: rec, all: all };
  };

  Site.prototype.masteryAll = function () {

  /* ---- 编码 / 解码 ---- */

  // 规范 3.5：超预算时按 32→24→16→8→4→0 压缩文字段，仍超才报错；单段上限 255 字节
  var TEXT_STEPS = [255, 32, 24, 16, 8, 4, 0];

  };

  Site.prototype._encodeWith = function (kind, key, textStep) {
    var self = this;
    var gids = this.scopeGids(kind, key);
    if (!gids.length) throw new Error('作用域 ' + kind + ':' + key + ' 内没有题目');
    var ans = this.store.get('ans', {});
    var fav = this.store.get('fav', {});
    var used = {}, widths = {};

      var mask = 0;
      (rec.p || []).forEach(function (k) { if (k >= 0 && k < w) mask |= 1 << k; });
      if (w) bw.put(mask, w);

      }

    var head = [10];
    var anyWidth = Object.keys(widths).some(function (k) { return widths[k] > 0; });
    head.push((anyWidth ? 1 : 0) | (texts.length ? 2 : 0));

    var kb = kind === 'site' ? [] : utf8Bytes(key);
    head.push(kb.length);
    head = head.concat(kb);
    var typeKeys = Object.keys(widths).sort();   // 与校验门一致：题型表按字典序写
    head.push(typeKeys.length);
    typeKeys.forEach(function (t) {
      var tb = utf8Bytes(t);

      head = head.concat(tb);
      head.push(widths[t]);

  Site.prototype.decode = function (code) {
    code = cleanText(code).trim();

    if (code.indexOf('9:') === 0) return this._decodeV9(code);
    if (/^[89]:/.test(code)) throw new Error('该版本编码已不再支持，请用「导入」按钮旁的旧码迁移说明');

  Site.prototype._decodeV10 = function (code) {

    var kindId = data[pos++];
    var klen = data[pos++];

    for (var i = 0; i < tcount; i++) {

    var favBits = data.slice(pos, pos + blen); pos += blen;
    var txtBits = data.slice(pos, pos + blen); pos += blen;

    var kind = ['site', 'subject', 'unit'][kindId];
    var gids = this.scopeGids(kind, key);
    if (gids.length !== total) throw new Error('编码内 gid 数 ' + total + ' 与本地作用域 ' + gids.length + ' 不一致（题库版本不同？）');

    var reader = new BitReader(data, pos);
    var ans = {}, fav = {}, texts = {};
    for (var j = 0; j < total; j++) {
      var g = gids[j];
      if (favBits[j >> 3] & (1 << (j & 7))) fav[g] = Date.now();
      if (!(ansBits[j >> 3] & (1 << (j & 7)))) continue;
      var okc = reader.read(2);
      var w = widths[(this.byGid[g] || {}).type] || 0;
      var mask = w ? reader.read(w) : 0;
      var picked = [];
      if (w) for (var k = 0; k < w; k++) if (mask & (1 << k)) picked.push(k);

    }
    var tpos = reader.bytesUsed();
    for (var j2 = 0; j2 < total; j2++) {
      if (!(txtBits[j2 >> 3] & (1 << (j2 & 7)))) continue;
      if (tpos >= data.length) throw new Error('文字段提前结束');
      var ln = data[tpos++];
      texts[gids[j2]] = utf8Decode(data.slice(tpos, tpos + ln));
      tpos += ln;
    }
    return { kind: kind, key: key, ans: ans, fav: fav, texts: texts };
  };

  /* ---- v9 旧码：全站快照，按去重后的字典序 gid 排位（兼容线上原方案C） ---- */

  Site.prototype.legacyGids = function () {
    var seen = {}, out = [];
    this.questions.forEach(function (q) {
      if (!seen[q._gid]) { seen[q._gid] = 1; out.push(q._gid); }
    });
    return out.sort();          // 旧版 GID_ALL = 去重后按码元序排列
  };

  Site.prototype._decodeV9 = function (code) {
    var bin = unb64url(code.slice(2));
    if (bin.length < 3 || bin[0] !== 9) throw new Error('v9 编码头损坏');
    var total = (bin[1] << 8) | bin[2];
    var len = (total + 7) >> 3;
    var hdr = 3 + len * 3;
    if (bin.length < hdr) throw new Error('v9 编码不完整，可能复制时漏了字符');
    var gids = this.legacyGids();
    if (gids.length !== total) {
      throw new Error('v9 编码含 ' + total + ' 个 gid，本地题库为 ' + gids.length + ' 个（题库版本不同）');
    }
    var ansBits = bin.slice(3, 3 + len);
    var favBits = bin.slice(3 + len, 3 + 2 * len);
    var txtBits = bin.slice(3 + 2 * len, hdr);
    var reader = new BitReader(bin, hdr);
    var ans = {}, fav = {};
    for (var i = 0; i < total; i++) {
      var g = gids[i];
      if (favBits[i >> 3] & (1 << (i & 7))) fav[g] = Date.now();
      if (!(ansBits[i >> 3] & (1 << (i & 7)))) continue;
      var okc = reader.read(2);
      var mask = reader.read(4);        // v9 固定 4 位掩码
      var picked = [];
      for (var k = 0; k < 4; k++) if (mask & (1 << k)) picked.push(k);
      ans[g] = { ok: okc === 1 ? true : (okc === 2 ? false : null), at: Date.now(), p: picked };
    }
    var tpos = reader.bytesUsed(), texts = {};
    for (var j = 0; j < total; j++) {
      if (!(txtBits[j >> 3] & (1 << (j & 7)))) continue;
      if (tpos >= bin.length) break;
      var ln = bin[tpos++];
      texts[gids[j]] = utf8Decode(bin.slice(tpos, tpos + ln));
      tpos += ln;
    }
    return { kind: 'site', key: '', ans: ans, fav: fav, texts: texts, v: 9 };
  };

  /* ---- 旧版本机记录迁移：csg_*（gid 键）与 csunitN_*（旧题号键） ---- */

  var LEGACY_RE = /^(?:csg|cs(?:unit\d+|exam|terms|calc|midterm))_(ans|wrong|fav)_v1$/;

  function toRecord(r) {
    if (!r || typeof r !== 'object') return null;
    var ok = r.ok === true ? true : (r.ok === false ? false : null);
    var picked = Array.isArray(r.picked) ? r.picked : (Array.isArray(r.p) ? r.p : null);
    var text = r.text != null ? r.text : (r.x != null ? r.x : '');
    var answered = !!picked || !!text || ok !== null || r.done === true;
    if (!answered) return null;
    var rec = { ok: ok, at: typeof r.at === 'number' ? r.at : Date.now() };
    if (picked && picked.length) {
      rec.p = picked.filter(function (k) { return typeof k === 'number' && k >= 0; })
        .sort(function (a, b) { return a - b; });
    }
    if (text) rec.x = cleanText(text).trim();
    if (r.self === true) rec.self = true;
    if (typeof r.c === 'number') rec.c = r.c;
    return rec;
  }

  function eachLegacyEntry(value, fn) {
    if (value == null) return;
    if (Array.isArray(value)) { value.forEach(function (g) { if (typeof g === 'string') fn(g, 1); }); return; }
    if (typeof value !== 'object') return;
    Object.keys(value).forEach(function (g) { fn(g, value[g]); });
  }

  // 幂等：迁移过一次就记标记，不重复覆盖用户此后产生的记录
  Site.prototype.migrateLegacy = function () {
    var store = this.store;
    if (store.get('migrated', null)) return { skipped: true, ans: 0, wrong: 0, fav: 0 };
    if (typeof localStorage === 'undefined' || !localStorage.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    var idMap = this.legacyIdMap || {};
    var ans = store.get('ans', {});
    var wrong = store.get('wrong', {});
    var fav = store.get('fav', {});
    var self = this;
    var counts = { ans: 0, wrong: 0, fav: 0, orphan: 0 };
    var handled = [];

    function resolve(key) {
      if (/^g[0-9a-f]{8}([0-9a-f]{8})?$/.test(key)) return key;
      return idMap[key] || null;
    }

    var names = [];
    for (var i = 0; i < localStorage.length; i++) names.push(localStorage.key(i));

    names.forEach(function (name) {
      var m = LEGACY_RE.exec(name);
      if (!m) return;
      var kind = m[1];
      var raw;
      try { raw = JSON.parse(localStorage.getItem(name) || 'null'); } catch (e) { return; }
      handled.push(name);

      eachLegacyEntry(raw, function (key, val) {
        var gid = resolve(key);
        if (!gid) { counts.orphan++; return; }
        if (kind === 'ans') {
          var rec = toRecord(val);
          if (!rec) return;
          if (!ans[gid]) { ans[gid] = rec; counts.ans++; }
          else if (ans[gid].ok === null && rec.ok !== null) { ans[gid] = rec; counts.ans++; }
        } else if (kind === 'wrong') {
          if (!wrong[gid]) { wrong[gid] = typeof val === 'number' ? val : Date.now(); counts.wrong++; }
        } else if (kind === 'fav') {
          if (!fav[gid]) { fav[gid] = (val && typeof val === 'object' && typeof val.t === 'number') ? val.t : Date.now(); counts.fav++; }
        }
      });
    });

    if (!handled.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    store.set('ans', ans);
    store.set('wrong', wrong);
    store.set('fav', fav);
    store.set('migrated', { at: Date.now(), from: handled, counts: counts });
    // 旧键一律不删：回退到旧页面仍可用（规范 8.2 第 4 条）
    return counts;
  };

  // 导入：只覆盖作用域内，域外原样保留（规范 3.3）
  Site.prototype.importCode = function (code) {
    var snapshot = {
      ans: this.store.get('ans', {}), wrong: this.store.get('wrong', {}), fav: this.store.get('fav', {})
    };
    this.store.set('bak', { at: Date.now(), data: snapshot });

    var got = this.decode(code);
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var self = this;
    var touched = 0;

    Object.keys(got.ans).forEach(function (g) {
      var incoming = got.ans[g];
      if (got.texts[g] != null) incoming.x = cleanText(got.texts[g]);
      ans[g] = mergeRecord(ans[g] || null, incoming);
      if (incoming.ok === false) wrong[g] = Date.now();
      touched++;
    });
    Object.keys(got.fav).forEach(function (g) { fav[g] = fav[g] || Date.now(); });

    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    return { kind: got.kind, key: got.key, count: touched, v: got.v || 10 };
  };

  Site.prototype.undoImport = function () {
    var bak = this.store.get('bak', null);
    if (!bak) return false;
    this.store.set('ans', bak.data.ans || {});
    this.store.set('wrong', bak.data.wrong || {});
    this.store.set('fav', bak.data.fav || {});
    return true;
  };

  /* ---- 统计（三级口径，分母一律 gid 去重） ---- */

  Site.prototype.stats = function (unitKey) {
    var self = this;
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var gids = unitKey ? this.scopeGids('unit', unitKey) : this.order.slice();
    var seen = {}, total = 0, answered = 0, correct = 0, wrongN = 0, favN = 0;
    gids.forEach(function (g) {
      if (seen[g]) return;
      seen[g] = 1;
      total++;
      var r = ans[g];
      if (r) {
        answered++;
        if (r.ok === true) correct++;
      }
      if (wrong[g]) wrongN++;
      if (fav[g]) favN++;
    });
    return {
      total: total, answered: answered, correct: correct,
      rate: answered ? Math.round(100 * correct / answered) : null,
      wrong: wrongN, fav: favN
    };
  };

  var QB = {
    fpNorm: fpNorm, fpHash: fpHash, fingerprint: fingerprint,
    norm: norm, judge: judge, fuzzyEq: fuzzyEq, cleanText: cleanText,
    maskWidth: maskWidth, mergeRecord: mergeRecord,
    Store: Store, Site: Site,
    create: function (def, store) { return new Site(def, store); }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = QB;
  else root.QB = QB;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

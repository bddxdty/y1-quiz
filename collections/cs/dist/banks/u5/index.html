<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>计算机导论 · 第五单元 操作系统</title>
<style>/* qb-page.css — 题库页面样式（内核共用，不含任何科目特有内容） */
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e4e8ef; --line2:#eef1f6;
  --text:#1e2330; --muted:#5b6373; --muted2:#6b7383;
  --accent:#2f6fed; --accent-ink:#2557c7; --accent-soft:#eaf1ff;
  --ok:#0b6b48; --ok-soft:#e7f7ef; --ok-line:#b7e6cf;
  --bad:#b42318; --bad-soft:#fdecea; --bad-line:#f6c9c4;
  --warn:#b54708; --warn-soft:#fef3e2;
  --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 72px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:14px}
.top h1{font-size:21px;margin:0;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.top .spacer{flex:1}
.home{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:6px 12px;background:#fff}
.home:hover{color:var(--accent);border-color:#c7dbff;text-decoration:none}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.block{padding:14px 16px;margin-bottom:14px}

/* stats */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;margin-bottom:14px}
.stat-k{font-size:12px;color:var(--muted2);letter-spacing:.3px}
.stat-v{font-size:19px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-bar{height:4px;border-radius:3px;background:#eef1f6;margin-top:7px;overflow:hidden}
.stat-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl+.ctl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.seg{display:inline-flex;background:#f1f4fa;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;color:#48505f}
.seg button:hover{color:var(--accent)}
.seg button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
select,input[type=search]{
  font:inherit;font-size:13.5px;color:var(--text);border:1px solid var(--line);background:#fff;
  border-radius:9px;padding:7px 10px;outline:none
}
select:focus,input[type=search]:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=search]{min-width:170px;flex:1}
.btn{
  border:1px solid var(--line);background:#fff;color:#3c4353;border-radius:9px;padding:7px 14px;
  font:inherit;font-size:13.5px;cursor:pointer;transition:.15s
}
.btn:hover:not(:disabled){border-color:#c7dbff;color:var(--accent);background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2557c7;border-color:#2557c7;color:#fff}
.btn.ghost{background:#fff}
.btn.ghost.on{color:#b54708;border-color:#f5dcb4;background:var(--warn-soft)}
.btn.small{padding:5px 11px;font-size:13px}

/* card */
#card{padding:18px 18px 16px;margin-bottom:14px}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fafbfd;white-space:nowrap}
.tag-type{color:var(--accent-ink);border-color:#c7dbff;background:var(--accent-soft)}
.tag-diff.d-0{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.tag-diff.d-1{color:var(--warn);border-color:#f5dcb4;background:var(--warn-soft)}
.tag-diff.d-2{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.q-topic{font-size:12.5px;color:var(--muted2)}
.q-no{margin-left:auto;font-size:12.5px;color:var(--muted2);font-variant-numeric:tabular-nums}
.q-stem{font-size:16.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.q-img{max-width:100%;margin-top:10px;border-radius:8px;border:1px solid var(--line)}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;
  font:inherit;font-size:15px;line-height:1.6;cursor:pointer;transition:.13s;color:var(--text)
}
.opt:hover:not(:disabled){border-color:#c7dbff;background:#fafcff}
.opt:disabled{cursor:default}
.opt-k{
  flex:0 0 24px;height:24px;border-radius:7px;background:#f1f4fa;color:#48505f;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600
}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .opt-k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.right .opt-k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .opt-k{background:var(--bad);color:#fff}

/* inputs */
.in,.ta{
  width:100%;margin-top:14px;font:inherit;font-size:15px;color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;background:#fff;resize:vertical
}
.in:focus,.ta:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
.in:disabled,.ta:disabled{background:#fafbfd;color:var(--muted)}

/* action bar */
.q-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hint{font-size:12.5px;color:var(--muted2)}
.verdict{font-size:14px;font-weight:650;padding:5px 12px;border-radius:999px}
.verdict.ok{color:var(--ok);background:var(--ok-soft)}
.verdict.bad{color:var(--bad);background:var(--bad-soft)}
.verdict.mid{color:var(--warn);background:var(--warn-soft)}

/* explanation */
.exp{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.exp-h{font-size:12.5px;color:var(--muted2);letter-spacing:.4px;margin-bottom:7px}
.exp-a{font-size:14.5px;margin:0 0 8px;padding:10px 12px;background:#f7f9fd;border-radius:9px;border:1px solid var(--line2)}
.exp-p{font-size:14.5px;color:#333a49;margin:0 0 6px;white-space:pre-wrap}
.exp-src{font-size:12px;color:var(--muted2);margin:6px 0 0}
.self{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}

/* nav */
#nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav-mid{flex:1;text-align:center;font-size:13px;color:var(--muted2);font-variant-numeric:tabular-nums}

/* mastery */
#mastery{padding:14px 16px;margin-bottom:14px}
.mt{width:100%;border-collapse:collapse;font-size:13.5px}
.mt th{text-align:left;font-weight:600;color:var(--muted2);font-size:12px;letter-spacing:.3px;padding:0 0 8px;border-bottom:1px solid var(--line2)}
.mt td{padding:7px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
.mt tr:last-child td{border-bottom:0}
.mt-t{color:#333a49}
.mt-s{font-variant-numeric:tabular-nums;font-weight:650;width:56px}
.mt-n{color:var(--muted2);width:56px;text-align:right}
.lv{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.lv-ok{color:var(--ok);background:var(--ok-soft)}
.lv-mid{color:var(--warn);background:var(--warn-soft)}
.lv-bad{color:var(--bad);background:var(--bad-soft)}

/* transfer */
#transfer{padding:14px 16px;margin-bottom:14px}
#x-code{width:100%;min-height:86px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:10px;resize:vertical;background:#fafbfd;color:#333a49}
#x-info{font-size:12.5px;color:var(--muted2);margin-top:8px;min-height:18px}
.x-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* misc */
.empty{padding:34px 8px;text-align:center}
.empty-t{font-size:15.5px;font-weight:600}
.empty-s{color:var(--muted2);font-size:13.5px;margin:6px 0 0}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:#1e2330;color:#fff;font-size:13.5px;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--muted2);font-size:12px;text-align:center;margin-top:18px;line-height:1.8}

@media (max-width:640px){
  .wrap{padding:14px 12px 64px}
  #stats{grid-template-columns:repeat(2,1fr)}
  .top h1{font-size:18.5px}
  .q-stem{font-size:16px}
  .opt{font-size:14.5px}
  input[type=search]{min-width:100%}
}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;
}
mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */
.q-stem mjx-container[display="true"],
.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;
}
mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */
.q-stem mjx-container[display="true"],
.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>

    <div>
      <h1 id="site-title">计算机导论 · 第五单元 操作系统</h1>

    </div>
    <div class="spacer"></div>
    <a class="home" id="home" href="../../index.html">返回题库集</a>
  </div>

  <div class="panel" id="stats"></div>

  <div class="panel block">
    <div class="ctl">
      <div class="seg" id="modes">
        <button data-mode="seq" class="on">顺序</button>
        <button data-mode="random">随机</button>
        <button data-mode="wrong">错题</button>
        <button data-mode="fav">收藏</button>
        <button data-mode="undone">未做</button>
      </div>
      <select id="f-type"><option value="">全部题型</option></select>
      <select id="f-diff"><option value="">全部难度</option><option>易</option><option>中</option><option>难</option></select>

  <div class="panel" id="card"></div>
  <div id="nav"></div>

  <details class="panel block">
    <summary style="cursor:pointer;font-size:14px;font-weight:600">掌握度（按知识点）</summary>
    <div id="mastery" style="padding-top:10px"></div>
  </details>

  <details class="panel block" id="cloud-wrap" style="display:none">
    <summary style="cursor:pointer;font-size:14px;font-weight:600">云同步（手动上传 / 下载）</summary>
    <div style="padding-top:10px">
      <div class="x-row">
        <input type="text" id="s-code" class="in" style="flex:1;min-width:180px;margin-top:0"

        <button class="btn" id="s-save">保存</button>
        <button class="btn primary" id="s-up">上传</button>
        <button class="btn" id="s-down">下载</button>
      </div>
      <div id="s-info" class="hint" style="margin-top:8px;min-height:18px"></div>
    </div>
  </details>

  <details class="panel block">
    <summary style="cursor:pointer;font-size:14px;font-weight:600">导出 / 导入进度码</summary>
    <div id="transfer" style="padding-top:10px">
      <div class="x-row">
        <select id="x-scope"></select>
        <button class="btn" id="x-do">生成</button>
        <button class="btn" id="x-copy">复制</button>
        <button class="btn" id="x-import">导入</button>
        <button class="btn" id="x-undo">撤销导入</button>
        <button class="btn ghost" id="reset" style="margin-left:auto">清空本机记录</button>
      </div>
      <textarea id="x-code" placeholder="在此粘贴他人分享的进度码，或点「生成」得到自己的"></textarea>
      <div id="x-info"></div>
    </div>
  </details>

  <div class="foot">
    独立题库 · 计算机导论 · 第五单元 操作系统 · 100 题<br>
    进度保存在本机浏览器，不上传；换设备请用进度码迁移。
  </div>
</div>

ta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-003","type":"single","topic":"5.1 软件分类与操作系统概念","diff":"易","stem":"操作系统在计算机系统中所处的层次是（　）。","options":["与硬件并列，互不依赖","硬件之下","应用软件之上","应用软件之下、硬件之上"],"answer":[3],"exp":"自下而上依次是硬件、操作系统、系统程序与应用程序、用户。操作系统是最贴近硬件的软件层，向下管理硬件，向上为其他软件提供运行环境，因此处于硬件之上、应用软件之下。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-004","type":"single","topic":"5.1 软件分类与操作系统概念","diff":"易","stem":"操作系统的两个主要设计目标是（　）。","options":["有效性和方便性","安全性和兼容性","开放性和可扩展性","实时性和可靠性"],"answer":[0],"exp":"有效性指管理与分配硬件、软件资源，合理组织调度计算机的工作，让资源得到高效利用；方便性指提供良好一致的用户接口，屏蔽下层硬件的复杂与差异。安全、兼容、实时、可靠都是某些操作系统的附加要求，不是两个总目标。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-005","type":"single","topic":"5.1 软件分类与操作系统概念","diff":"中","stem":"应用软件访问计算机硬件必须经过（　）。","options":["编译器","汇编程序","操作系统提供的接口","网络协议"],"answer":[2],"exp":"应用软件不能直接操作硬件，它通过系统调用等操作系统接口提出请求，由操作系统代为完成对磁盘、键盘、显示器等设备的操作。编译器与汇编程序负责把源程序翻译成机器指令，不承担硬件访问的中介。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-006","type":"multi","topic":"5.1 软件分类与操作系统概念","diff":"中","stem":"下列属于应用软件的有（　）。","options":["Linux","WPS Office","微信","Photoshop"],"answer":[1,2,3],"exp":"应用软件是为满足用户不同领域、不同问题的应用需求而提供的软件，WPS Office（办公）、微信（通信）、Photoshop（图像处理）都属此类。Linux 是操作系统，属于系统软件。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-007","type":"multi","topic":"5.1 软件分类与操作系统概念","diff":"中","stem":"关于操作系统的说法，正确的有（　）。","options":["负责管理计算机的硬件和软件资源","属于应用软件","是最重要的系统软件","是用户与计算机硬件之间的桥梁"],"answer":[0,2,3],"exp":"操作系统是最重要的系统软件，是用户（含其他软件）与硬件之间的接口，负责管理并调度全部硬软件资源，出现资源使用冲突时及时处理。把它归入应用软件是错误的，这正是它与 WPS、微信等软件的分界。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-008","type":"fill","topic":"5.1 软件分类与操作系统概念","diff":"易","stem":"计算机软件分为系统软件和 ____ 两大类。","answers":["应用软件","应用"],"exp":"软件按功能分为系统软件与应用软件。系统软件支撑其他软件的开发与运行（操作系统、语言处理程序、数据库管理系统等），应用软件直接面向用户的业务需求。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-009","type":"fill","topic":"5.1 软件分类与操作系统概念","diff":"中","stem":"操作系统是管理计算机硬件与软件资源的系统软件，是用户与计算机硬件之间的 ____。","answers":["桥梁","接口"],"exp":"课件用「桥梁」描述操作系统的位置：向下管理硬件，向上支撑应用，用户与硬件之间的所有交互都要经过它。用「接口」表述同样成立。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-010","type":"short","topic":"5.1 软件分类与操作系统概念","diff":"中","stem":"简述系统软件与应用软件的区别，并各举两例。","ref":"系统软件是控制和协调计算机及外部设备、支持应用软件开发和运行的系统，它面向机器与开发环境，不针对某一具体业务，例如操作系统（Windows、Linux）、语言处理程序（GCC 编译器）、数据库管理系统（MySQL）。应用软件是为满足用户不同领域、不同问题的应用需求而提供的软件，直接面向业务，例如 WPS Office、微信。","exp":"采分点：①两者面向的对象不同（机器/开发环境 vs 具体业务需求）；②系统软件是应用软件的运行基础；③各举两例，类别不能混。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-011","type":"comp","topic":"5.1 软件分类与操作系统概念","diff":"中","stem":"把下列软件分为系统软件与应用软件两类：Windows 11、WPS Office、Linux 内核、微信、GCC 编译器、MySQL 数据库管理系统、Photoshop、显卡驱动程序。","ref":"系统软件（5 个）：Windows 11、Linux 内核、GCC 编译器、MySQL 数据库管理系统、显卡驱动程序。\n应用软件（3 个）：WPS Office、微信、Photoshop。\n分类依据：凡是为其他软件的开发、运行提供支撑，或直接管理硬件的，属系统软件；凡是直接服务于用户具体业务的，属应用软件。","exp":"采分点：①操作系统（Windows 11、Linux 内核）属系统软件；②语言处理程序（GCC）与数据库管理系统（MySQL）属系统软件；③设备驱动程序是操作系统管理硬件的一部分，属系统软件；④办公、通信、图像处理类属应用软件。易错：把 MySQL 当应用软件——它是系统软件层的数据库管理系统，用它开发的学生管理系统才是应用软件。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-012","type":"single","topic":"5.1 软件分类与操作系统概念","diff":"中","stem":"在操作系统出现之前，程序员使用计算机时必须（　）。","options":["通过图形界面拖拽操作","直接面对硬件，自行安排存储位置与输入输出","调用操作系统提供的系统调用","使用高级语言自动完成资源分配"],"answer":[1],"exp":"早期没有操作系统，程序员要自己确定程序装入内存的位置、自己驱动纸带机与打印机，程序与硬件强绑定，换一台机器就得重写。操作系统正是为屏蔽这些细节、提高资源利用率而出现的。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-013","type":"single","topic":"5.1 软件分类与操作系统概念","diff":"难","stem":"「操作系统屏蔽了硬件系统的类型和数量差别」体现的是操作系统的（　）目标。","options":["方便性","有效性","实时性","可靠性"],"answer":[0],"exp":"方便性指提供良好、一致的用户接口，弥补硬件系统的类型和数量差别，把下层复杂的东西屏蔽掉。有效性针对的是资源的合理组织与调度，两者容易混淆：前者面向「好用」，后者面向「用得快、用得省」。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-014","type":"single","topic":"5.2 操作系统的启动与引导","diff":"中","stem":"操作系统的自举（引导）程序一般存放在（　）中。","options":["RAM","ROM","硬盘","CPU 内部的通用寄存器"],"answer":[1],"exp":"自举程序由计算机制造商事先用 ROM 技术写入，断电不丢失，加电即可执行。若放在 RAM 中，断电后内容消失，机器将无法自行启动；硬盘可以存操作系统本体，但读硬盘的代码必须先能运行，所以引导代码只能固化在 ROM。","meta":{"source":"第 5 章课件（5-操作系统.pptx）· 课上真题","optperm":true},"_unit":"u5"},{"qid":"cs.u5-015","type":"single","topic":"5.2 操作系统的启动与引导","diff":"易","stem":"计算机加电后，CPU 首先执行的是（　）。","options":["硬盘上的操作系统代码","用户输入的命令","内存中的应用程序","ROM 中的自举程序"],"answer":[3],"exp":"加电时 CPU 的程序计数器被置为自举程序的第一条指令地址，先执行固化在 ROM 中的自举程序；由它从硬盘读出操作系统并装入内存，最后才把控制权交给操作系统。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-016","type":"fill","topic":"5.2 操作系统的启动与引导","diff":"中","stem":"自举程序从硬盘读出操作系统，把启动所需的部分装入 ____，再把 CPU 控制权交给操作系统。","answers":["内存","RAM","主存","内存储器"],"exp":"程序只有装入内存才能被 CPU 执行，操作系统本身也是程序，所以自举程序要把它的启动部分从硬盘搬到内存，然后交出控制权。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-017","type":"short","topic":"5.2 操作系统的启动与引导","diff":"中","stem":"简述操作系统的启动（自举）过程。","ref":"①自举程序由制造商预先写入 ROM；②计算机加电，CPU 的程序计数器指向自举程序的第一条指令并开始执行；③自举程序从硬盘读出操作系统，把启动计算机所需的那部分装入内存（RAM）；④CPU 转而执行内存中的操作系统代码，完成后把控制权交给操作系统，启动结束。","exp":"采分点：ROM 中固化、加电先执行自举程序、从硬盘读入内存、控制权移交。四步缺一不可，顺序不能颠倒。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-018","type":"multi","topic":"5.2 操作系统的启动与引导","diff":"中","stem":"关于自举（引导）程序，说法正确的有（　）。","options":["本身由操作系统在启动后安装到硬盘","存放在 ROM 中，断电后内容不丢失","由计算机制造商预先写入","负责把操作系统装入内存"],"answer":[1,2,3],"exp":"自举程序是固化在 ROM 中的小程序，由制造商写入，加电后 CPU 首先执行它，由它把操作系统装入内存并移交控制权。它必须在操作系统之前就能运行，因此不可能由操作系统在启动后再安装。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-019","type":"single","topic":"5.2 操作系统的启动与引导","diff":"中","stem":"自举程序放在 ROM 而不是 RAM 中的主要原因是（　）。","options":["ROM 中的内容断电不丢失，加电即可执行","ROM 容量比 RAM 大","ROM 的读写速度比 RAM 快","ROM 可以随时被用户修改"],"answer":[0],"exp":"ROM 是非易失性存储器，写入后断电内容仍在，机器一加电就能执行引导代码。ROM 的速度和容量都不如 RAM，且通常只能读或需特殊方式改写，因此「速度更快」「容量更大」「可随时修改」三种说法均不成立。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-020","type":"comp","topic":"5.2 操作系统的启动与引导","diff":"中","stem":"把下列事件按启动顺序排列，并说明为什么操作系统不能自己把自己装入内存：①CPU 执行 ROM 中的自举程序；②从硬盘读出操作系统；③把启动所需的部分装入内存；④CPU 控制权交给操作系统；⑤计算机加电。","ref":"顺序：⑤ → ① → ② → ③ → ④。\n理由：程序必须先在内存中才能被 CPU 执行，而「把程序装入内存」这件事本身也需要一段已经在内存（或 ROM）中、可直接执行的代码来完成。若由操作系统自己完成装入，则在装入之前它并不在内存里，无法运行，形成循环依赖。因此必须有一段不依赖操作系统的固化代码（ROM 中的自举程序）来打破这个循环。","exp":"采分点：①顺序正确；②指出「程序必须先入内存才能执行」；③点明循环依赖，并说明自举程序的作用正是打破它。只答顺序不答理由只得一半分。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-021","type":"single","topic":"5.3 操作系统的发展与分类","diff":"易","stem":"手工操作阶段计算机使用方式的主要缺点是（　）。","options":["用户独占全机，CPU 大量时间在等待人工操作","多个用户相互干扰","无法运行大型程序","不支持高级语言"],"answer":[0],"exp":"手工操作阶段（20 世纪 40 年代末至 50 年代初）输入输出靠纸带穿孔等外围设备，全程需要人工干预：一台机器的全部资源由上机用户独占，人机速度矛盾突出，资源利用率极低。当时还没有多用户概念，谈不上用户相互干扰。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-022","type":"single","topic":"5.3 操作系统的发展与分类","diff":"易","stem":"单道批处理系统的三个特点是（　）。","options":["交互性、独立性、及时性","多路性、共享性、自动性","自动性、顺序性、单道性","并发性、分布性、透明性"],"answer":[2],"exp":"单道批处理由监督程序控制作业一个接一个地连续处理：自动性（无需人工干预）、顺序性（一个接一个）、单道性（某一时刻内存中只有一道程序）。多路性、共享性是后来多道批处理的特征。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-023","type":"single","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"单道批处理系统资源利用率仍然很低，主要原因是（　）。","options":["作业调度算法太复杂","内存中只能有一道程序，程序等待 I/O 时 CPU 空闲","外部设备速度太快","缺少中断机制导致无法切换"],"answer":[1],"exp":"单道批处理虽然解决了人工干预问题，但内存中始终只有一道程序：当前程序做输入输出时 CPU 无事可做，只能空等，于是 CPU 与 I/O 设备交替空闲。多道批处理正是为填满这段空闲而设计的。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-024","type":"single","topic":"5.3 操作系统的发展与分类","diff":"易","stem":"多道批处理系统的主要特点是（　）。","options":["实时性、可靠性、可预测性","顺序性、单道性、独占性","交互性、独立性、及时性","多路性、共享性、自动性"],"answer":[3],"exp":"多道批处理在内存中同时存放若干道已开始运行尚未结束的程序，交替使用 CPU：多路性指内存中有多道独立程序；共享性指共享 CPU 与各种资源，提高利用率与吞吐量；自动性指作业处理期间用户不得干预。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-025","type":"single","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"分时系统让多个用户通过终端同时使用一台主机，其关键技术是（　）。","options":["时间片轮转","作业后备队列","通道技术","双机热备"],"answer":[0],"exp":"分时系统把处理机的运行时间切成很短的时间片，按时间片轮流分配给各联机作业。因为机器速度极快，用户感觉不到别人的存在，于是每个用户都以为整台机器在为自己服务。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-026","type":"single","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"下列不属于分时系统特点的是（　）。","options":["多路性","交互性","实时性","独立性"],"answer":[2],"exp":"分时系统的特点是多路性、交互性、独立性（以及及时性）。实时性指在严格的时间限制内完成处理，是实时操作系统的核心要求，分时系统只保证响应足够快，不承诺硬性时限。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-027","type":"single","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"交通控制、病人监护、航天设备控制系统一般采用（　）。","options":["批处理操作系统","实时操作系统","分时操作系统","个人操作系统"],"answer":[1],"exp":"这类应用的共同点是对时间有硬性要求：必须在规定的时限内响应并完成处理，否则后果严重。实时操作系统的核心设计目标正是保证任务在严格时间限制内被调度和执行，确保行为的可预测性与确定性。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-028","type":"single","topic":"5.3 操作系统的发展与分类","diff":"易","stem":"实时操作系统最突出的两个特点是（　）。","options":["可移植性和开放性","多路性和交互性","吞吐量和并发度","及时性和可靠性"],"answer":[3],"exp":"实时系统以「在时限内完成」为第一目标，因此强调及时性与可靠性；为了守时，它往往宁可牺牲吞吐量与平均性能。多路性、交互性是分时系统的特征。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-029","type":"single","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"分布式操作系统与网络操作系统的根本区别在于（　）。","options":["分布式系统对用户表现为一台统一的计算机","分布式系统不需要网络","网络系统不能共享文件","网络系统的节点不能独立工作"],"answer":[0],"exp":"网络操作系统让各台计算机互联并共享资源，但每台机器仍是独立自主的实体，用户看得见它们；分布式操作系统通过网络协调多个节点，使用户面对的是一个统一的、连贯的系统，任务可以在多台机器上分布执行。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-030","type":"single","topic":"5.3 操作系统的发展与分类","diff":"易","stem":"DOS（Disk Operating System）属于（　）。","options":["实时操作系统","多用户多任务操作系统","单用户单任务操作系统","分布式操作系统"],"answer":[2],"exp":"DOS 是个人计算机出现后的单用户操作系统，同一时刻只支持一个用户运行一个任务，主要考虑提供方便的使用环境和交互响应速度。多用户多任务要到分时系统与现代操作系统才具备。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-031","type":"multi","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"分时系统的特点有（　）。","options":["多路性：处理机按时间片轮流服务多个作业","交互性：用户可根据响应结果提出新请求","独立性：用户之间相互独立操作、互不干扰","实时性：必须在严格时限内完成处理"],"answer":[0,1,2],"exp":"分时系统的三个基本特点是多路性、交互性、独立性。「实时性」混淆了实时系统：分时追求的是让每个用户都觉得机器在为自己服务，并不承诺硬性时限。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-032","type":"multi","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"属于实时操作系统典型应用场景的有（　）。","options":["交通控制","病人监护","军事控制系统","文字处理与排版"],"answer":[0,1,2],"exp":"实时系统的应用都带有硬性时限：交通信号控制、病人生命体征监护、军事与航天设备控制。文字处理对响应时间没有硬性要求，普通桌面操作系统即可胜任。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-033","type":"fill","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"内存中始终只保持一道作业、作业一个接一个连续处理的批处理系统称为 ____ 批处理系统。","answers":["单道"],"exp":"按内存中同时存放的作业道数，批处理系统分为单道批处理与多道批处理。单道批处理解决了人工干预，但 I/O 期间 CPU 空等；多道批处理让多道程序交替使用 CPU，才真正提高了资源利用率。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-034","type":"fill","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"把处理机的运行时间分成很短的时间片、按时间片轮流分配给各终端用户的系统称为 ____ 操作系统。","answers":["分时","分时系统"],"exp":"分时系统在一台主机上连接多个终端，以时间片为单位轮流为各用户服务，允许多个用户以交互方式共享主机资源，其本质仍是多道程序设计的延伸。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-035","type":"short","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"比较批处理系统与分时系统的区别。","ref":"①目标不同：批处理追求资源利用率与系统吞吐量，分时追求用户交互的响应速度与公平性。②作业方式不同：批处理的作业成批提交，由监督程序或作业调度程序控制，处理期间用户不能干预；分时系统允许用户通过终端与系统交互，随时提出新请求。③内存中程序数不同：单道批处理只有一道，多道批处理有多道但用户不可见；分时系统多道并发且各用户独立。④适用场合不同：批处理适合大批量、无需干预的计算任务；分时适合交互式开发与教学。","exp":"采分点：①目标差异；②能否交互；③多道与调度的差异；④适用场合。答出三点即可，但必须点出「批处理不提供交互」这一条。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-036","type":"short","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"操作系统按应用环境可分为哪几类？各举一例。","ref":"分为四类：①手机操作系统，如 Android、iOS、HarmonyOS；②桌面操作系统，如 Windows、macOS、deepin；③服务器操作系统，如 Windows Server、Linux 发行版（Red Hat、openEuler）；④嵌入式操作系统，如 FreeRTOS、嵌入式 Linux。若按支持的用户数划分，则分为单用户操作系统与多用户操作系统。","exp":"采分点：四类名称齐全、各举一例、并说明另一种划分维度（按用户数）不算错但需标明维度。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-037","type":"comp","topic":"5.3 操作系统的发展与分类","diff":"难","stem":"有两道程序 A、B 都要先计算后输入输出：A 计算 20 s、I/O 30 s；B 计算 25 s、I/O 40 s。分别计算单道批处理与多道批处理（I/O 可与 CPU 并行）下的总完成时间和 CPU 利用率。","ref":"单道批处理：A 先运行 20 s 计算 + 30 s I/O = 50 s，再运行 B 的 25 s + 40 s = 65 s，总时间 115 s；CPU 忙碌时间 20 + 25 = 45 s，利用率 = 45 ÷ 115 ≈ 39.1%。\n多道批处理：0～20 s A 计算；20～45 s A 做 I/O 的同时 B 计算；45～85 s B 做 I/O。总时间 85 s；CPU 忙碌时间仍为 45 s，利用率 = 45 ÷ 85 ≈ 52.9%。\n结论：多道把 A 的 I/O 时间让给 B 计算，总时间由 115 s 降到 85 s，CPU 利用率由 39.1% 提高到 52.9%。","exp":"采分点：①单道时间 = 两道各自时间之和；②多道要画出 CPU 与 I/O 的重叠段；③利用率 = CPU 忙碌时间 ÷ 总时间。易错：多道下把两道程序的 CPU 时间相加成 90 s，忘记两段计算不能并行（只有一道 CPU）。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-038","type":"single","topic":"5.4 操作系统的组成与功能","diff":"易","stem":"现代操作系统至少具有的四个管理功能是（　）。","options":["编译管理、链接管理、加载管理、执行管理","输入管理、输出管理、运算管理、控制管理","用户管理、权限管理、网络管理、打印管理","存储管理、进程管理、设备管理、文件管理"],"answer":[3],"exp":"操作系统必须管理系统中的不同资源，因而至少有四部分：存储管理器（管内存）、进程管理器（管 CPU）、设备管理器（管 I/O 设备）、文件管理器（管外存上的文件），另外通常还有一个用户界面或命令解释程序。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-039","type":"single","topic":"5.4 操作系统的组成与功能","diff":"易","stem":"负责内存空间的分配与回收、地址转换和内存保护的是（　）。","options":["进程管理器","文件管理器","设备管理器","存储管理器"],"answer":[3],"exp":"存储管理器的职责都在内存上：分配与回收内存空间、把逻辑地址转换为物理地址、隔离各进程的地址空间实现保护、用虚拟存储器扩充可用空间。进程管理器管的是 CPU 时间的分配。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-040","type":"single","topic":"5.4 操作系统的组成与功能","diff":"易","stem":"存储管理中的「地址转换」是指（　）。","options":["把十进制地址转换为二进制地址","把逻辑地址转换为物理地址","把虚拟地址写入磁盘","把物理地址映射为文件名"],"answer":[1],"exp":"程序里用的是逻辑地址（相对地址），内存条上真正的位置是物理地址。地址转换就是建立并维护两者的对应关系，通常由硬件（MMU）配合页表完成。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-041","type":"single","topic":"5.4 操作系统的组成与功能","diff":"易","stem":"负责在多个程序之间分配处理器时间、使每个程序都能高效有序执行的是（　）。","options":["存储管理器","文件管理器","设备管理器","进程管理器"],"answer":[3],"exp":"进程管理器管的是 CPU 时间：进程的创建与撤销、状态管理与切换（就绪、运行、阻塞）、CPU 调度、同步互斥、进程间通信与控制。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-042","type":"single","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"设备管理器为每个设备维护一个消息队列，其主要作用是（　）。","options":["进行 I/O 调度，确定各请求的访问次序","记录设备的出厂编号","存放设备驱动程序的目标代码","替代缓冲区完成数据缓存"],"answer":[0],"exp":"多个进程可能同时请求同一台设备（如打印机），设备管理器为每个设备维护请求队列，按调度算法决定谁先用、谁后用，从而提高设备利用率并避免冲突。缓冲区是另一套机制，用于缓解 CPU 与 I/O 的速度差。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-043","type":"single","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"下列不属于文件管理器职责的是（　）。","options":["管理文件的存储空间与目录","控制文件的访问权限","在多个进程之间分配 CPU 时间","负责文件的建立、读写、复制与删除"],"answer":[2],"exp":"分配 CPU 时间是进程管理器的职责。文件管理器统一管理以文件形式保存在外存上的信息：存储空间管理、目录管理、读写管理、共享与保护、文件操作管理。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-044","type":"single","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"虚拟存储器技术使得（　）。","options":["程序必须全部装入内存才能运行","程序的一部分装入内存即可开始运行","内存容量可以无限扩大","外存可以当作 CPU 的寄存器使用"],"answer":[1],"exp":"虚拟存储把内存与外存结合起来统一编址，允许一个程序只有一部分在内存时也运行，其余部分留在硬盘上，需要时再换入。物理内存并没有变大，只是「看起来」变大了。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-045","type":"single","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"设备管理中设置缓冲区的主要目的是（　）。","options":["减少进程的数量","扩大外存的存储容量","提高 CPU 的主频","缓解 CPU 与 I/O 设备之间的速度不匹配"],"answer":[3],"exp":"CPU 的速度远高于打印机、磁盘等设备，若直接对接，CPU 会长时间空等。设置缓冲区后，CPU 把数据交给缓冲区即可继续工作，设备慢慢从缓冲区取走，两者速度差被吸收。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-046","type":"single","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"存储管理中「内存保护」的主要目的是（　）。","options":["防止一个进程访问另一个进程的地址空间","防止内存条被物理损坏","防止硬盘上的文件被删除","防止 CPU 过热"],"answer":[0],"exp":"多个进程同时驻留内存，若不加限制，一个进程的错误指针就可能改写别人的数据甚至操作系统本身。内存保护通过界限寄存器、页表权限位等手段把各进程的地址空间隔离开。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-047","type":"multi","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"存储管理器的功能包括（　）。","options":["内存空间的分配与回收","逻辑地址到物理地址的转换","各进程地址空间的隔离与保护","CPU 时间的分配与调度"],"answer":[0,1,2],"exp":"四项中前三项都是存储管理器的职责。「CPU 时间的分配与调度」属于进程管理器——它管的是处理器时间这一资源，与内存无关。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-048","type":"multi","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"文件管理器的功能包括（　）。","options":["为进程分配 CPU 时间","文件存储空间的管理","目录的建立与维护","文件访问权限的控制"],"answer":[1,2,3],"exp":"文件管理器管外存上的信息：存储空间分配与回收、目录管理、读写管理、共享与保护、文件操作管理。为进程分配 CPU 时间是进程管理器的事。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-049","type":"multi","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"设备管理器的功能包括（　）。","options":["缓冲管理","I/O 调度与 I/O 控制","为文件命名并维护目录","设备的分配与回收"],"answer":[0,1,3],"exp":"设备管理器统一管理外设并负责外设与主机之间的信息交换：设备分配与回收、缓冲管理、I/O 调度、I/O 控制、故障处理与驱动支撑。为文件命名、维护目录属于文件管理器。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-050","type":"fill","topic":"5.4 操作系统的组成与功能","diff":"易","stem":"操作系统的四大管理功能是存储管理、进程管理、设备管理和 ____ 管理。","answers":["文件"],"exp":"四者分别对应内存、CPU、I/O 设备和外存上的文件，加上用户界面，构成现代操作系统的基本组成。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-051","type":"fill","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"UNIX 中接收并解释用户输入命令的用户界面称为 ____。","answers":["Shell","shell","命令解释程序"],"exp":"用户界面用来接收用户输入并向操作系统解释这些请求。UNIX 中这一层叫命令解释程序 Shell；其他系统里可能表现为窗口，即菜单驱动、带图形用户界面（GUI）的部件。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-052","type":"short","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"简述操作系统存储管理的主要功能。","ref":"①内存空间的分配与回收：为进程分配内存，进程结束后回收；②地址转换：把程序中的逻辑地址转换为内存的物理地址；③内存保护：隔离各进程的地址空间，防止越界访问；④虚拟存储器的扩充：把内存与外存统一管理，允许程序部分装入即可运行。","exp":"采分点：四点齐全。若只答「管理内存」不给分，必须落到具体功能上。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-053","type":"short","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"简述文件管理的主要功能。","ref":"①文件存储空间的管理：为文件分配磁盘块，删除时回收，记录空闲块；②目录管理：建立与维护文件目录，支持删除、重命名等；③文件的读写管理：按用户请求定位文件位置并完成数据读写；④文件共享与保护：实现共享，设置访问权限，防止非法访问与误修改；⑤文件的操作管理：创建、打开、关闭、删除、修改、重命名与索引。","exp":"采分点：存储空间、目录、读写、共享与保护、操作管理五项中答出四项即可。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-054","type":"short","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"操作系统为什么需要用户界面？常见的有哪两种形式？","ref":"用户界面用来接收用户的输入并向操作系统解释这些请求，是人与系统交互的入口。没有它，用户无法向系统表达意图。常见两种形式：一是命令解释程序（命令行界面），如 UNIX 的 Shell，用户输入命令、系统解释执行；二是图形用户界面（GUI），以窗口、菜单、图标为主，由菜单驱动，如 Windows 的桌面。","exp":"采分点：①用户界面的作用（接收输入、解释请求）；②两种形式及其代表（Shell / GUI）。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-055","type":"comp","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"某程序需要 6 MB 内存才能完整运行，而机器物理内存只有 4 MB（其余空间已被操作系统占用）。在采用虚拟存储器的情况下，该程序能否运行？说明其工作机制。","ref":"能运行。虚拟存储器把内存与外存统一编址，程序不必全部驻留内存：①操作系统把程序划分成若干块（页），只把当前要执行的部分装入内存；②其余部分留在硬盘上；③执行中访问到不在内存的部分时产生缺页中断，由存储管理器把所需块调入内存，必要时把暂时不用的块换出到硬盘；④整个过程由地址转换机构配合完成，程序看到的仍是连续的 6 MB 逻辑空间。代价是频繁换入换出会增加磁盘 I/O，运行速度下降。","exp":"采分点：①结论「能运行」；②部分装入 + 按需调入 + 置换；③地址转换/逻辑空间连续；④指出代价。若答「不能，内存不够」则完全错误——这正是虚拟存储要解决的问题。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-056","type":"comp","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"把下列事件与负责的操作系统部件配对，并说明理由：①为进程分配 2 MB 内存；②决定三个就绪进程谁先上 CPU；③让两台打印机按顺序打印；④拒绝某用户改写只读文件。","ref":"①存储管理器——内存空间的分配与回收；②进程管理器——CPU 调度，在多个程序之间分配处理器时间；③设备管理器——设备的分配与 I/O 调度，为设备维护请求队列；④文件管理器——控制文件访问权限，有权限的进程才能以允许的方式访问。","exp":"采分点：四组配对正确，且每组理由落在该部件的职责上。易错：把③配给文件管理器（打印的是设备，不是文件），把④配给存储管理器（保护的是文件权限，不是地址空间）。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-057","type":"single","topic":"5.4 操作系统的组成与功能","diff":"易","stem":"用户界面（User Interface）的基本作用是（　）。","options":["把源程序翻译成机器语言","直接控制 CPU 的时钟频率","接收用户输入并向操作系统解释这些请求","管理磁盘上的空闲块"],"answer":[2],"exp":"用户界面是人与系统之间的翻译层：把用户的点击、命令转换成操作系统能理解的请求，再把结果呈现给用户。它不直接干预硬件，也不承担编译或磁盘管理。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-058","type":"single","topic":"5.5 程序、作业与进程","diff":"易","stem":"进程（Process）是指（　）。","options":["一个运行中的程序，即程序的运行实例","保存在硬盘上的一组指令","用户提交给系统的一个任务清单","CPU 内部的一个寄存器"],"answer":[0],"exp":"进程是一个驻留在内存中、正在运行的程序，也叫程序的运行实例。它与「程序」的区别在于：程序是静态的指令集合，进程是动态的执行过程，有生命周期和状态变化。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-059","type":"single","topic":"5.5 程序、作业与进程","diff":"易","stem":"由程序员编写的程序，通常以文件形式保存在（　）。","options":["内存中","CPU 的寄存器中","硬盘等外存上","高速缓存中"],"answer":[2],"exp":"程序是静态的指令集合，一般保存在硬盘等外存上；运行时才由操作系统装入内存，成为进程。寄存器与高速缓存容量极小，只临时存放正在执行的指令和数据。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-060","type":"single","topic":"5.5 程序、作业与进程","diff":"易","stem":"作业（Job）是指（　）。","options":["用户在键盘上输入的一条命令","从一个程序开始执行到运行结束这段过程中的该程序","操作系统内核本身","一个可执行文件的文件名"],"answer":[1],"exp":"作业强调「一段执行过程」：程序开始执行到运行结束，这段时间内的该程序称为作业。批处理系统正是以作业为单位成批提交、调度和处理的。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-061","type":"single","topic":"5.5 程序、作业与进程","diff":"易","stem":"进程的三种基本状态是（　）。","options":["空闲、忙碌、挂起","创建、编译、执行","等待、调度、结束","就绪、运行、阻塞"],"answer":[3],"exp":"就绪态指已具备运行条件、只等 CPU；运行态指正占用 CPU 执行；阻塞态指因等待 I/O 或某事件而暂停。三态之间的转换由进程管理器负责。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-062","type":"single","topic":"5.5 程序、作业与进程","diff":"中","stem":"进程从运行态转为阻塞态，通常是因为（　）。","options":["请求 I/O 或等待某个事件发生","时间片用完","被更高优先级的进程抢占","进程执行完毕"],"answer":[0],"exp":"运行中的进程若需要读磁盘、等待用户输入或等待某个信号，就无法继续，主动让出 CPU 进入阻塞态。时间片用完或被抢占是转为就绪态，执行完毕则退出。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-063","type":"single","topic":"5.5 程序、作业与进程","diff":"中","stem":"进程从就绪态转为运行态的条件是（　）。","options":["申请到更多内存","等待的 I/O 操作完成","被调度程序选中，获得 CPU","被创建出来"],"answer":[2],"exp":"就绪态的进程万事俱备，只缺 CPU；一旦被调度程序选中、分到处理器，就进入运行态。等待的 I/O 完成是阻塞态转就绪态的条件。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-064","type":"multi","topic":"5.5 程序、作业与进程","diff":"中","stem":"进程管理器的工作包括（　）。","options":["进程状态管理与切换","CPU 调度","文件的建立与删除","进程的创建与撤销"],"answer":[0,1,3],"exp":"前三项都在进程管理器的职责范围内。「文件的建立与删除」属于文件管理器，管的是外存上的信息而不是 CPU 时间。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-065","type":"fill","topic":"5.5 程序、作业与进程","diff":"易","stem":"进程的三种基本状态是就绪、运行和 ____。","answers":["阻塞","等待","阻塞态"],"exp":"阻塞态（也称等待态）指进程因等待 I/O 完成或某事件发生而暂时无法运行。教材多用「阻塞」，部分教材称「等待」。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-066","type":"short","topic":"5.5 程序、作业与进程","diff":"中","stem":"说明程序、作业、进程三者的区别与联系。","ref":"程序是程序员编写的一组稳定的指令，是静态的，一般以文件形式保存在硬盘上。作业强调执行过程：从一个程序开始执行到运行结束，这段时间内的该程序称为作业，是批处理系统的调度单位。进程是运行中的程序，即程序的运行实例，是动态的，有创建、就绪、运行、阻塞、终止等状态。三者联系：程序是作业与进程的物质基础；作业与进程都是程序的一次执行过程，区别在于作业面向批处理的提交与调度，进程面向内存中的并发执行与 CPU 调度。","exp":"采分点：①程序静态、进程动态；②作业强调提交到结束的过程；③三者以程序为基础。答出「静态 vs 动态」这一对比是关键。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-067","type":"comp","topic":"5.5 程序、作业与进程","diff":"中","stem":"判断下列进程状态转换是否可能，并说明理由：①运行→阻塞；②阻塞→运行；③就绪→阻塞；④阻塞→就绪。","ref":"①可能：运行中的进程请求 I/O 或等待事件，主动让出 CPU。②不可能：阻塞的进程尚未具备运行条件，必须先回到就绪态，再由调度程序选中才能运行。③不可能：就绪态只缺 CPU，不会主动去等待 I/O；要进入阻塞必须先运行并发出请求。④可能：等待的事件（如 I/O 完成）发生后，进程具备运行条件，进入就绪队列排队。","exp":"采分点：四条判断全对，且理由落在「状态转换的触发条件」上。核心规律：阻塞只能由运行态进入，也必须先回到就绪态才能运行。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-068","type":"single","topic":"5.5 程序、作业与进程","diff":"难","stem":"同一个程序可以同时对应多个进程吗？（　）","options":["不可以，一个程序只能有一个进程","可以，每运行一次就产生一个进程","可以，但只在多核机器上成立","不可以，进程与程序是一一对应的"],"answer":[1],"exp":"程序是静态的指令集合，进程是它的运行实例。同一个可执行文件被启动两次就有两个进程，各自有独立的地址空间和状态；即使单核机器上也能有多个进程并存，只是轮流使用 CPU。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-069","type":"single","topic":"5.6 主流操作系统","diff":"易","stem":"UNIX 操作系统由贝尔实验室的（　）于 1969 年首先开发。","options":["Torvalds 和 Stallman","Thompson 和 Ritchie","Codd 和 Codd","Cutler 和 Gates"],"answer":[1],"exp":"UNIX 由贝尔实验室的 Ken Thompson 与 Dennis Ritchie 于 1969 年开发，Ritchie 同时也是 C 语言的创建者。Torvalds 开发的是 Linux，Cutler 领导了 Windows 的研发。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-070","type":"single","topic":"5.6 主流操作系统","diff":"中","stem":"UNIX 主要使用（　）编写，因而具有良好的可移植性。","options":["C 语言","汇编语言","Java","机器语言"],"answer":[0],"exp":"UNIX 用 C 语言重写后，只要目标机器上有 C 编译器，就能把源码移植过去，摆脱了对特定硬件的依赖。这也是 UNIX 能广泛传播的关键原因之一。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-071","type":"single","topic":"5.6 主流操作系统","diff":"易","stem":"UNIX 由四个主要部分构成，它们是（　）。","options":["进程管理器、存储管理器、设备管理器、文件管理器","内核、驱动、库、图形界面","引导程序、内核、文件系统、网络","内核、Shell、工具、应用程序"],"answer":[3],"exp":"UNIX 的四部分是：内核（系统心脏，含操作系统最基本的组成）、命令解释器 Shell（接收并解释用户命令）、工具（几百个标准程序，如编辑器、搜索与排序程序）、应用程序。最后一项是操作系统的通用功能划分，不是 UNIX 的组成划分。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-072","type":"single","topic":"5.6 主流操作系统","diff":"中","stem":"UNIX 内核（Kernel）的地位是（　）。","options":["系统的心脏，包含操作系统最基本的组成","用户输入命令的终端","一组可选的文本处理工具","运行在系统之上的应用软件集合"],"answer":[0],"exp":"内核是 UNIX 系统的心脏，负责进程、存储、设备、文件等最基本的管理功能，直接与硬件打交道。Shell 才是用户面对的终端，工具与应用程序都建立在内核之上。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-073","type":"single","topic":"5.6 主流操作系统","diff":"易","stem":"Linux 由（　）于 1991 年开发。","options":["Richard Stallman","Ken Thompson","Linus Torvalds","David Cutler"],"answer":[2],"exp":"1991 年芬兰赫尔辛基大学的学生 Linus Torvalds 开发了这个操作系统的最初内核，后发展为 Linux；1997 年发布的 Linux 2.0 内核成为商业操作系统，具备传统 UNIX 的所有特性。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-074","type":"single","topic":"5.6 主流操作系统","diff":"易","stem":"Linux 的三个组成部分是（　）。","options":["内核、Shell、应用程序","内核、系统库、系统工具","引导程序、内核、文件系统","内核、桌面环境、办公套件"],"answer":[1],"exp":"Linux 由内核（功能与 UNIX 类似）、系统库（含一组函数，包括 shell）、系统工具三部分组成。办公套件属于应用软件，不属于 Linux 本体。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-075","type":"single","topic":"5.6 主流操作系统","diff":"中","stem":"下列不属于 Windows 设计目标的是（　）。","options":["可扩展","可靠性","兼容性","完全开源"],"answer":[3],"exp":"Windows 的设计目标是可扩展（用 C/C++ 编写）、可靠性（处理包括恶意软件在内的错误条件）、兼容性（可运行其他系统或早期 Windows 的程序）、性能（对上层应用快速响应）。它是商业闭源软件，完全开源的是 Linux。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-076","type":"multi","topic":"5.6 主流操作系统","diff":"中","stem":"关于 UNIX 的说法正确的有（　）。","options":["可移植，主要用 C 语言编写","设备无关，内核中包含设备驱动","由微软公司开发并维护","是多用户、多道程序的操作系统"],"answer":[0,1,3],"exp":"UNIX 是多用户、多道程序、可移植的操作系统，用 C 编写，设备无关且内含设备驱动，被设计来方便编程、文本处理与通信。它由贝尔实验室开发，与微软无关。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-077","type":"multi","topic":"5.6 主流操作系统","diff":"中","stem":"Linux 的特点有（　）。","options":["可移植到多种硬件平台","使用必须向版权方支付授权费","开源，可自由获取与修改","支持多用户、多任务"],"answer":[0,2,3],"exp":"Linux 以开源许可发布，源码可获取、可修改，支持多用户多任务，可移植到服务器、超级计算机、嵌入式设备等多种平台。它不需要支付授权费，这正是它被广泛采用的原因之一。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-078","type":"fill","topic":"5.6 主流操作系统","diff":"中","stem":"1991 年，芬兰赫尔辛基大学的学生 ____ 开发了一个新的操作系统，即后来的 Linux。","answers":["Linus Torvalds","linus torvalds","托沃兹","李纳斯·托沃兹","Linus"],"exp":"Linus Torvalds（李纳斯·托沃兹）1991 年发布最初的内核，1997 年 Linux 2.0 成为商业操作系统。他与开发 GNU 的 Richard Stallman 是两个人，不要混淆。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-079","type":"short","topic":"5.6 主流操作系统","diff":"中","stem":"比较 UNIX、Linux、Windows 三种主流操作系统的特点与适用场合。","ref":"UNIX：1969 年贝尔实验室开发，多用户、多道程序、可移植，用 C 编写，工具丰富，稳定性高，主要用于服务器、工作站与大型机。Linux：1991 年 Torvalds 开发，开源免费、多用户多任务、可移植性强，发行版众多，广泛用于服务器、超级计算机、嵌入式设备与桌面。Windows：微软开发，图形界面友好、兼容性强、应用生态丰富，主要用于个人桌面、办公与游戏，服务器端有 Windows Server。","exp":"采分点：三种系统各自的来源、授权方式（商业/开源）、主要适用场合。只答「Windows 好用、Linux 开源」过于简略。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-080","type":"comp","topic":"5.6 主流操作系统","diff":"中","stem":"某实验室要搭建一台长期运行、供多人远程登录做数值计算的高性能服务器；另一间办公室需要一批机器供行政人员日常办公与视频会议。分别推荐使用哪类操作系统，并从授权成本、生态、运维三方面说明理由。","ref":"服务器推荐 Linux（或 UNIX）：①授权成本低，开源发行版可自由部署多台；②多用户、多任务，适合多人远程登录共享算力，命令行与脚本便于批量运维；③在服务器、超级计算机领域是主流，工具链成熟。办公机推荐 Windows：①图形界面友好，Office、视频会议等商业软件生态完整；②与打印机、投影等外设兼容性好；③行政人员无需学习命令行。补充：若单位有自主可控要求，可考虑国产 Linux 发行版（银河麒麟、统信 UOS、openEuler）。","exp":"采分点：①两类场景的推荐正确；②授权成本、生态、运维三方面都有对应理由；③能提到国产替代方案加分。只写「服务器用 Linux、办公用 Windows」而无理由不得分。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-081","type":"single","topic":"5.6 主流操作系统","diff":"中","stem":"Windows NT 内核的出现，其重要意义在于（　）。","options":["使 Windows 成为开源软件","为后续 Windows 提供了稳定的内核基础","让 Windows 可以在手机上运行","取代了 UNIX 的全部功能"],"answer":[1],"exp":"20 世纪 90 年代内核技术成熟，Windows NT 内核的出现为微软的操作系统提供了稳定基础，Windows 10/11 都源于此。它与开源无关，也未取代 UNIX。","meta":{"source":"第 5 章课件（5-操作系统.pptx）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-082","type":"single","topic":"5.7 国产操作系统与生态","diff":"中","stem":"20 世纪 90 年代，在倪光南、孙玉芳等科学家推动下推出的国产操作系统是（　）。","options":["统信 UOS","鸿蒙 HarmonyOS","银河麒麟","红旗 Linux"],"answer":[3],"exp":"上世纪 90 年代，以中科院院士倪光南、软件研究所副所长孙玉芳为首的一批科学家推出红旗 Linux，2000 年中科红旗成立。鸿蒙发布于 2019 年，银河麒麟与统信 UOS 都是后来的产品。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-083","type":"single","topic":"5.7 国产操作系统与生态","diff":"中","stem":"银河麒麟操作系统采用的（　）内核。","options":["Linux","Windows NT","Darwin","FreeRTOS"],"answer":[0],"exp":"银河麒麟由麒麟软件公司维护，源于国防科大 863 项目，采用 Linux 内核，具有桌面、服务器、嵌入式、工业控制等多条产品线，是国内党政信创的标杆。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-084","type":"single","topic":"5.7 国产操作系统与生态","diff":"中","stem":"统信 UOS 的源头是（　）。","options":["中标麒麟","红旗 Linux","深度（deepin）操作系统","openEuler"],"answer":[2],"exp":"2019 年底武汉深之度、诚迈科技等联合组建统信软件，以深度团队 deepin 为基础打造统一的国产商用操作系统 UOS，走「桌面 + 服务器」双线、个人免费版 + 政企商业版双路线。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-085","type":"single","topic":"5.7 国产操作系统与生态","diff":"中","stem":"华为鸿蒙操作系统（HarmonyOS）正式发布于（　）。","options":["2012 年 9 月 1 日","2019 年 8 月 9 日","2024 年 10 月 22 日","2020 年 6 月 2 日"],"answer":[1],"exp":"鸿蒙于 2019 年 8 月 9 日正式发布，是面向全场景的分布式操作系统。2024 年 10 月发布的是采用自研微内核、不再兼容 Android 的鸿蒙 Next（鸿蒙 5）。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-086","type":"single","topic":"5.7 国产操作系统与生态","diff":"中","stem":"鸿蒙系统的架构特点是（　）。","options":["基于 X86 专用指令集、只用于服务器","宏内核架构、单机运行、一机一版","基于 Windows NT 内核、仅支持手机","微内核架构、分布式、一次开发多端部署"],"answer":[3],"exp":"鸿蒙基于微内核架构设计，支持模块化弹性部署，可实现手机、电脑、智能家居、车载设备等多终端无缝协同，核心特性是「一次开发、多端部署」。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-087","type":"multi","topic":"5.7 国产操作系统与生态","diff":"中","stem":"研制操作系统的主要难点有（　）。","options":["有系统无应用，软件生态难以构筑","研发周期短，投入即可快速见效","代码量巨大，需要长期技术积累","高端技术人才相对匮乏"],"answer":[0,2,3],"exp":"前三项是课件列出的难点。操作系统的研发周期恰恰很长（Windows Vista 的研发费用超过 200 亿美元、历时数年），「投入即可快速见效」与事实相反。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-088","type":"fill","topic":"5.7 国产操作系统与生态","diff":"中","stem":"2024 年 10 月，华为发布采用自研 ____ 架构的鸿蒙 Next，不再兼容 Android 应用。","answers":["微内核"],"exp":"早期 HarmonyOS 1.0～4.0 兼容 Android 应用；2024 年 10 月鸿蒙 Next 改用自研微内核，只运行鸿蒙原生应用，是国产系统在架构自主上的关键一步。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-089","type":"short","topic":"5.7 国产操作系统与生态","diff":"中","stem":"为什么说国产操作系统「难在生态」？请说明「有系统无应用」的困境。","ref":"操作系统只是平台，用户真正使用的是即时通信、网络支付、浏览器、办公软件、游戏等应用。若这些软件没有对应版本，用户即使装了系统也无法聊天、上网、办公，只能对着桌面发呆。而软件厂商是否适配，取决于该系统的市场占有率；市场占有率又取决于有没有可用的软件，于是形成悖论：生态贫乏导致用户少，用户少导致厂商不愿适配。加之用户的使用习惯、外设驱动、专业软件（如设计、工程类）迁移成本高，替换阻力进一步加大。因此国产系统的突破口不只是内核技术，更在于生态建设、兼容层、原生应用迁移与 Web 化。","exp":"采分点：①操作系统的价值依赖应用生态；②厂商适配与市场占有率的循环依赖（悖论）；③用户习惯与驱动、专业软件的迁移成本；④点出突破口。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-090","type":"comp","topic":"5.7 国产操作系统与生态","diff":"难","stem":"结合技术范式转移与供应链安全，分析国产操作系统当前面临的机遇，并给出三条可操作的突破路径。","ref":"机遇：①技术范式转移——移动互联网、万物互联、云计算与云原生兴起，桌面时代的路径依赖被削弱，存在弯道超车的窗口；②供应链安全与自主可控——国家安全、产业安全、数据主权需求构成最强烈的驱动力，信创工程提供市场空间；③市场巨大且独特——用户基数大、垂直行业（电力、金融、交通、政务）需求明确，可提供试错土壤；④政策与资本支持，开源根社区（openEuler、openKylin、OpenHarmony）汇聚产业力量。\n突破路径：①生态建设——以开源社区吸引开发者，先把常用应用补齐；②兼容与迁移——用兼容层或虚拟机运行既有应用，同时推动微信、WPS 等主流软件推出原生版本；③Web 化/云化——让应用通过浏览器或云端交付，降低对本地系统的依赖；④核心技术深耕——真正掌握内核、驱动与安全机制。","exp":"采分点：①机遇至少答出两条并说明逻辑；②路径至少三条且可操作；③能指出「生态优先于内核」这一判断。只罗列名词不作分析最多得一半分。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-091","type":"single","topic":"5.7 国产操作系统与生态","diff":"中","stem":"openEuler（欧拉）主要面向（　）。","options":["服务器、云计算、边缘计算与嵌入式全场景","仅手机等消费终端","仅工业控制设备","仅桌面办公"],"answer":[0],"exp":"openEuler 源于华为 EulerOS，2019 年开源、2021 年捐献给开放原子开源基金会，基于 Linux 内核，面向服务器、云计算、边缘与嵌入式全场景，在运营商、金融、政务云中部署量增长很快。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-092","type":"single","topic":"5.7 国产操作系统与生态","diff":"中","stem":"「有系统无应用」所描述的困境是（　）。","options":["系统与应用都齐全，只是价格太高","应用很多，但没有可运行的系统","系统做出来了，但缺少可用的应用软件，用户不愿换用","系统只能在实验室运行，无法安装"],"answer":[2],"exp":"操作系统只是平台，丰富的软件生态才是它的活力之源。没有即时通信、支付、浏览器、办公、游戏等应用，用户即使装了系统也无法完成日常工作，自然不会迁移。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-093","type":"single","topic":"5.7 国产操作系统与生态","diff":"难","stem":"多数国产操作系统基于 Linux 内核，这样做的主要意义是（　）。","options":["可以完全不受开源许可证约束","复用成熟内核，把有限力量集中到生态建设与用户体验上","可以不再需要设备驱动程序","能够自动兼容 Windows 应用"],"answer":[1],"exp":"从零写一个内核的工作量与风险极高（Linux 内核数千万行代码），基于 Linux 可以把资源投向驱动适配、桌面体验、行业应用与生态建设这些真正决定成败的环节。同时仍须遵守开源许可证，也不能自动兼容 Windows 应用。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-094","type":"multi","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"关于虚拟存储器的说法正确的有（　）。","options":["使物理内存的容量真正变大","把内存与外存结合起来统一管理","允许程序部分装入内存即可运行","运行中程序可在内存与磁盘之间多次交换数据"],"answer":[1,2,3],"exp":"虚拟存储把内存与外存统一编址，程序可以部分装入、按需换入换出，因此运行过程中会多次在内存与磁盘之间交换数据。但它只是逻辑上扩充了地址空间，物理内存的容量并没有改变，「物理内存变大」是常见误解。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-095","type":"single","topic":"5.1 软件分类与操作系统概念","diff":"中","stem":"当多个进程同时申请同一资源而发生冲突时，操作系统的处理方式是（　）。","options":["及时处理，排除冲突","直接终止所有相关进程","忽略冲突，由用户自行协调","关闭该资源所在的设备"],"answer":[0],"exp":"操作系统管理系统中每个部件的活动，确保硬软件资源被有效使用；出现资源使用冲突时能及时处理、排除冲突，例如通过互斥锁、设备队列等机制协调。直接终止进程或关闭设备都过于粗暴。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-096","type":"single","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"网络操作系统的主要功能是（　）。","options":["专门用于实时控制","把多台计算机虚拟成一台统一计算机","只负责单机的文件管理","把网络中各台计算机结合起来，实现数据传送与资源共享"],"answer":[3],"exp":"网络操作系统提供统一、经济而有效的方式使用各台计算机，实现数据相互传送、资源共享与主机间通信。把多台机器虚拟成一台统一计算机是分布式操作系统的特征。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-097","type":"single","topic":"5.5 程序、作业与进程","diff":"中","stem":"一个进程被挂起后，它占用的内存空间（　）。","options":["可能被换出到外存，腾出内存给其他进程","一定被立即释放并销毁","会被转存到 CPU 的寄存器中","容量自动扩大一倍"],"answer":[0],"exp":"挂起是为了腾出内存：进程管理器把被挂起进程的地址空间换出到外存（对换区），需要时再换入。进程本身并未销毁，仍保留在系统中等待唤醒。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-098","type":"fill","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"把内存中的逻辑地址转换为物理地址，是存储管理器的 ____ 功能。","answers":["地址转换","地址映射"],"exp":"程序中使用的是逻辑地址，内存条上的实际位置是物理地址，两者的对应关系由存储管理器维护，具体转换通常由硬件 MMU 配合页表完成。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）"},"_unit":"u5"},{"qid":"cs.u5-099","type":"single","topic":"5.2 操作系统的启动与引导","diff":"易","stem":"BIOS 在操作系统启动过程中的角色是（　）。","options":["操作系统内核的一个模块","硬盘上的一个可执行文件","固化在 ROM 中的基本输入输出系统，兼作引导程序的一部分","CPU 内部的微指令序列"],"answer":[2],"exp":"BIOS 固化在主板 ROM 中，加电后首先运行，完成硬件自检并把控制权交给引导程序，从硬盘读出操作系统装入内存。它不属于操作系统，也不在硬盘上。","meta":{"source":"第 5 章课件（5-操作系统.pptx / 陈5-操作系统.pdf）","optperm":true},"_unit":"u5"},{"qid":"cs.u5-100","type":"comp","topic":"5.5 程序、作业与进程","diff":"难","stem":"四个进程 P1、P2、P3、P4 同时到达，都需要 40 ms 的 CPU 时间，系统采用时间片轮转，时间片为 20 ms。写出执行顺序，计算各进程的完成时间与平均周转时间。","ref":"执行顺序（每次 20 ms）：P1 → P2 → P3 → P4 → P1 → P2 → P3 → P4。\n各进程完成时间：P1 = 140 ms，P2 = 160 ms，P3 = 180 ms，P4 = 200 ms。\n平均周转时间 = (140 + 160 + 180 + 200) ÷ 4 = 680 ÷ 4 = 170 ms。\n说明：第一轮每个进程各得 20 ms，都还差 20 ms；第二轮依次补足，P1 在第 7 个时间片结束（140 ms），其余顺延 20 ms。","exp":"采分点：①执行顺序正确；②完成时间逐个算对；③平均周转时间取平均。易错：把「周转时间」当成「等待时间」——周转时间是提交到完成的全部时间，含等待与服务；本题等待时间分别为 100、120、140、160 ms。","meta":{"source":"第 5 章课件（陈5-操作系统.pdf）"},"_unit":"u5"}]}],"wrong":{"exitStreak":1},"mastery":{"wAll":0.4,"wRecent":0.6,"recentN":5,"weakBelow":60,"solidAt":85,"solidStreak":4,"passMinQ":4,"passRate":0.9,"dueDays":[1,3,7]},"codec":{"version":10,"gidBits":32,"budgetBytes":6000},"order":["g7b36b9f9","geb76ff8a","g5604cb4e","gbbf40dfe","g53d3c631","gc8006e41","gdde89a21","gffcece9c","gbf4af0af","gf58d538b","g986a45cb","g16fafab6","g390c53cf","gd341e104","g5caa97bb","g63505a11","g262242e2","g53357d53","g15895c5a","gb37205e6","ga8ff66f5","gf78a1598","g2312f909","gd84ac421","g531e9c29","g11a301b7","g9182d1cb","g5ac960f1","g879fc5c7","g7d406c09","ge31b0414","ga0a1269f","gd6d7ba22","g96ce59ac","g1d239cea","g40f44857","g039b0e40","g2f3b78a4","g01c4cc52","g8a075482","g60a43282","gc2a5be02","g429eefc9","g9336931d","g1ca6d6e6","g3929ecd5","g6973d129","g3abb4969","ge0a933a7","gb120c052","g7d8fc4da","g1b380426","g97d834a5","g741c176d","gf4dc7861","g1235df51","g4f107c97","g8fdb65e0","g698ac205","ge61b55d3","g667cadf8","gabc70a0d","g77e9b112","g445ffe28","g16cd76e7","gb3fdad90","gcb5ba655","gd0d46845","g54bc7b55","gf6075fe1","g25a2682d","g057bd0db","g3b63256f","gbfab8367","g03aab32a","gb636e3f9","g3dcab7a9","g614ccd92","g884fb846","ge937909f","g11f716f7","g8ec3308b","g1a5f3cef","g96f701f5","g242e98e4","ge2157664","gf18eec25","g8e96cd21","gf0386650","g09d71ed5","g92ff9098","g064ea04e","gc83c3a94","g4af76b06","g3da490b9","g0808d4bc","ge3203fc6","g6fa225e2","g7c9f9f44","g4a2157b0","g25025c87","g104b192e","ge7adff58","ga387e22f","gfa59440f","g08e3bcf7","ge01cfa65","g6dea2267","g13218d7e","g65e9e0ef","g79d528ac","g599a0546","g2517f440","ga595f820","gcf460211","g9f71e789","gb01e3f0c","g1eb06575","gb8113912","g807c5984","gdcf4f1fb","gd2696c88","gfa8310ce","gf2f53cbe","g7b98981e",     var cap = Number(decl.maxOptions || 0);
    if (cap <= 4) return 4;
    if (cap <= 8) return 8;
    if (cap <= 16) return 16;
    return 0;
  }

  function b64url(bytes) {
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    var s = (typeof btoa === 'function')
      ? btoa(bin)
      : (typeof Buffer !== 'undefined' ? Buffer.from(bytes).toString('base64') : '');
    return s.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function unb64url(text) {
    // 容忍：标准 base64 的 +/、被折行或带空格的粘贴、缺省补齐的 =、前后引号
    var s = cleanText(text)
      .replace(/^["'`]+|["'`]+$/g, '')
      .replace(/\s+/g, '')
      .replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = (typeof atob === 'function')
      ? atob(s)
      : (typeof Buffer !== 'undefined' ? Buffer.from(s, 'base64').toString('binary') : '');
    var out = [];
    for (var i = 0; i < bin.length; i++) out.push(bin.charCodeAt(i) & 0xff);
    return out;
  }

  function utf8Bytes(str) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      else if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length) {
        var c2 = str.charCodeAt(++i);
        var cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      } else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return out;
  }

  function utf8Decode(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length;) {
      var c = bytes[i++];
      if (c < 0x80) s += String.fromCharCode(c);
      else if (c < 0xe0) s += String.fromCharCode(((c & 31) << 6) | (bytes[i++] & 63));
      else if (c < 0xf0) s += String.fromCharCode(((c & 15) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63));
      else {
        var cp = ((c & 7) << 18) | ((bytes[i++] & 63) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63);
        cp -= 0x10000;
        s += String.fromCharCode(0xd800 + (cp >> 10), 0xdc00 + (cp & 1023));
      }
    }
    return s;
  }

  /* ---------------------------------------------------------------- 站点实例 */

  function Store(prefix) {
    this.prefix = prefix || 'qb.site';
    this.mem = null;   // Node / 无 localStorage 时的内存兜底
  }

  Store.prototype._key = function (name) { return this.prefix + '.' + name + '.v1'; };

  Store.prototype.get = function (name, fallback) {
    var raw;
    try {
      raw = (typeof localStorage !== 'undefined') ? localStorage.getItem(this._key(name)) : null;
    } catch (e) { raw = null; }
    if (raw == null) {
      if (this.mem && this.mem[name] != null) return JSON.parse(JSON.stringify(this.mem[name]));
      return fallback;
    }
    try { return JSON.parse(raw); } catch (e) { return fallback; }
  };

  Store.prototype.set = function (name, value) {
    if (!this.mem) this.mem = {};
    this.mem[name] = JSON.parse(JSON.stringify(value));
    try {
      if (typeof localStorage !== 'undefined') localStorage.setItem(this._key(name), JSON.stringify(value));
    } catch (e) { /* 配额满：保留内存态，不中断作答 */ }
  };

  Store.prototype.remove = function (name) {
    if (this.mem) delete this.mem[name];
    try { if (typeof localStorage !== 'undefined') localStorage.removeItem(this._key(name)); } catch (e) {}
  };

  function Site(def, store) {
    this.def = def;
    this.store = store || new Store(def.storePrefix || 'qb.site');
    this.types = def.types || {};
    this.order = (def.order || []).slice();
    this.retired = {};
    (def.retired || []).forEach(function (g) { this.retired[g] = 1; }, this);
    this.bits = (def.codec && def.codec.gidBits) || 32;
    this.budget = (def.codec && def.codec.budgetBytes) || 6000;
    this.questions = [];
    this.byGid = {};
    this.byQid = {};
    this.legacyIdMap = {};     // 旧题号（如 1-02）→ gid，用于迁移旧命名空间
    this._streak = {};
    this._index(def.units || []);
  }

  Site.prototype._index = function (units) {
    var self = this;
    this.scopeUnit = {};
    this.scopeSubject = [];
    var seenSubj = {};
    units.forEach(function (unit) {
      var list = [], seen = {};
      (unit.questions || []).forEach(function (q) {
        q._gid = fingerprint(q, self.bits);
        q._unit = unit.key;
        q._unitLabel = unit.label;
        q._unitTitle = unit.title;
        self.questions.push(q);
        if (!self.byGid[q._gid]) self.byGid[q._gid] = q;
        self.byQid[q.qid] = q;
        if (!seen[q._gid]) { seen[q._gid] = 1; list.push(q._gid); }
        if (!seenSubj[q._gid]) { seenSubj[q._gid] = 1; self.scopeSubject.push(q._gid); }
        if (q.meta && q.meta.origin && q.meta.origin.id) {
          self.legacyIdMap[String(q.meta.origin.id)] = q._gid;
        }
      });
      self.scopeUnit[unit.key] = list;
    });
    // 未出现在序列表里的题（首次运行）追加到末尾，保证 seq 可用
    var known = {};
    this.order.forEach(function (g) { known[g] = 1; });
    this.questions.forEach(function (q) {
      if (!known[q._gid]) { self.order.push(q._gid); known[q._gid] = 1; }
    });
  };

  Site.prototype.gidOf = function (q) { return q._gid || fingerprint(q, this.bits); };

  // 作用域 gid 序：题组按题库顺序、科目按题组顺序去重。
  // 同一道题同时出现在两个题组时，题组作用域各自保留一份——否则含副本的题组
  // 会与独立部署包算出不同的序，导致进度码对不上。
  Site.prototype.scopeGids = function (kind, key) {
    if (kind === 'site') return this.order.slice();
    if (kind === 'subject') return this.scopeSubject.slice();
    return (this.scopeUnit[key] || []).slice();
  };

  /* ---- 状态读取（投影视图） ---- */

  Site.prototype.get = function (gid) {
    var ans = this.store.get('ans', {});
    return ans[gid] || null;
  };

  Site.prototype.allAns = function () { return this.store.get('ans', {}); };
  Site.prototype.allWrong = function () { return this.store.get('wrong', {}); };
  Site.prototype.allFav = function () { return this.store.get('fav', {}); };

  Site.prototype.put = function (gid, patch, mode) {
    var ans = this.store.get('ans', {});
    var prev = ans[gid] || null;
    var rec = mergeRecord(prev, patch);
    // 本机的一次新作答说了算：重做答错就要记成错，不能被「信息量优先」留住旧的 true。
    // 跨设备 / 导入导出仍走 mergeRecord 的信息量优先，那是合并两处记录，不是同一次作答。
    if (patch.ok !== undefined) rec.ok = patch.ok;
    ans[gid] = rec;
    this.store.set('ans', ans);
    this._applyWrong(gid, rec, mode);
    this._log({ g: gid, t: Date.now(), k: 'attempt', ok: rec.ok, m: mode || rec.m || 'seq',
                c: rec.c, p: rec.p, x: rec.x });
    return rec;
  };

  // 规范 5.8：按信息量合并，不用先到先得
  function mergeRecord(prev, patch) {
    if (!prev) {
      var base = { ok: patch.ok == null ? null : patch.ok, at: patch.at || Date.now() };
      if (patch.p && patch.p.length) base.p = patch.p.slice().sort(function (a, b) { return a - b; });
      if (patch.x != null) base.x = patch.x;
      if (patch.m) base.m = patch.m;
      if (patch.c != null) base.c = patch.c;
      if (patch.self) base.self = true;
      return base;
    }
    var out = { ok: prev.ok, at: prev.at };
    if (prev.p) out.p = prev.p.slice();
    if (prev.x != null) out.x = prev.x;
    if (prev.m) out.m = prev.m;
    if (prev.c != null) out.c = prev.c;
    if (prev.self) out.self = true;

    var rank = { 'true': 3, 'false': 2, 'null': 1 };
    var a = rank[String(prev.ok)], b = rank[String(patch.ok)];
    if (patch.ok !== undefined && b > a) out.ok = patch.ok;
    if (patch.at && patch.at > (out.at || 0)) out.at = patch.at;
    if (patch.p && patch.p.length) out.p = patch.p.slice().sort(function (x, y) { return x - y; });
    if (patch.x != null && String(patch.x).length >= String(out.x || '').length) out.x = patch.x;
    if (patch.c != null && (out.c == null || patch.c > out.c)) out.c = patch.c;
    if (patch.m) out.m = patch.m;
    if (patch.self) out.self = true;
    return out;
  }

  /* ---- 错题状态机（规范 5.2 八条） ---- */

  Site.prototype._applyWrong = function (gid, rec, mode) {
    var wrong = this.store.get('wrong', {});
    var suppressed = this.store.get('suppress', {});
    var inSet = !!wrong[gid];
    var exitStreak = (this.def.wrong && this.def.wrong.exitStreak) || 1;
    var now = Date.now();

    if (rec.ok === false) {                       // #1 / #8
      wrong[gid] = now;
      delete suppressed[gid];
      this.store.set('wrong', wrong);
      this.store.set('suppress', suppressed);
      return;
    }
    if (rec.ok === true && mode === 'wrong' && inSet) {   // #2
      var streak = (this._streak[gid] || 0) + 1;
      this._streak[gid] = streak;
      if (streak >= exitStreak) {
        delete wrong[gid];
        delete this._streak[gid];
        this.store.set('wrong', wrong);
      }
      return;
    }
    // #3 顺序练习答对：不变；#4 ok=null：不变
  };

  Site.prototype._streak = {};
  Site.prototype.suppress = function (gid) {          // #6
    var wrong = this.store.get('wrong', {});
    var sup = this.store.get('suppress', {});
    delete wrong[gid];
    sup[gid] = Date.now();
    this.store.set('wrong', wrong);
    this.store.set('suppress', sup);
    this._log({ g: gid, t: Date.now(), k: 'suppress' });
  };

  Site.prototype.resetScope = function (kind, key) {   // #7
    var gids = this.scopeGids(kind, key);
    var keep = {};
    gids.forEach(function (g) { keep[g] = 1; });
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    gids.forEach(function (g) { delete ans[g]; delete wrong[g]; delete fav[g]; });
    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    this._log({ g: '*', t: Date.now(), k: 'reset', scope: kind + ':' + key });
  };

  Site.prototype.toggleFav = function (gid) {
    var fav = this.store.get('fav', {});
    if (fav[gid]) delete fav[gid]; else fav[gid] = Date.now();
    this.store.set('fav', fav);
    return !!fav[gid];
  };

  /* ---- 事件日志与折叠 ---- */

  Site.prototype._log = function (ev) {
    var diag = this.store.get('diag', { events: [], rounds: {}, mastery: {} });
    diag.events = diag.events || [];
    diag.events.push(ev);
    if (diag.events.length > 2000) {
      // 折叠最旧的一半进快照，再截断（规范 5.1）
      diag.events = diag.events.slice(-1000);
    }
    this.store.set('diag', diag);
  };

  Site.prototype.rebuild = function () {
    var diag = this.store.get('diag', { events: [] });
    var ans = {}, wrong = {};
    (diag.events || []).forEach(function (e) {
      if (e.k === 'reset') return;
      if (e.g === '*') return;
      if (e.k === 'attempt') {
        ans[e.g] = mergeRecord(ans[e.g] || null, { ok: e.ok, at: e.t, p: e.p, x: e.x, m: e.m, c: e.c });
        if (e.ok === false) wrong[e.g] = e.t;
        else if (e.ok === true && e.m === 'wrong' && wrong[e.g]) delete wrong[e.g];
      } else if (e.k === 'suppress') {
        delete wrong[e.g];
      }
    });
    return { ans: ans, wrong: wrong };
  };

  /* ---- 掌握度（规范 5.5） ---- */

  Site.prototype.masteryOf = function (topic) {
    var m = this.def.mastery || {};
    var wAll = m.wAll != null ? m.wAll : 0.4;
    var wRecent = m.wRecent != null ? m.wRecent : 0.6;
    var recentN = m.recentN || 5;
    var ans = this.store.get('ans', {});
    var self = this;
    var records = this.questions.filter(function (q) { return q.topic === topic && ans[q._gid]; })
      .map(function (q) { return ans[q._gid]; })
      .filter(function (r) { return r.ok !== null; });

    if (!records.length) return { topic: topic, score: null, level: null, n: 0 };

    function credit(r) {
      if (r.ok === true) return 1;
      if (r.c != null) return r.c;
      return 0;
    }
    var all = records.reduce(function (s, r) { return s + credit(r); }, 0) / records.length;
    var recent = records.slice(-recentN);
    var rec = recent.reduce(function (s, r) { return s + credit(r); }, 0) / recent.length;
    var score = Math.round(100 * (wAll * all + wRecent * rec));
    var level = score < (m.weakBelow || 60) ? '薄弱'
      : (score >= (m.solidAt || 85) ? '已掌握' : '巩固中');
    return { topic: topic, score: score, level: level, n: records.length, recent: rec, all: all };
  };

  Site.prototype.masteryAll = function () {
    var topics = {}, self = this;
    this.questions.forEach(function (q) { topics[q.topic] = 1; });
    return Object.keys(topics).sort().map(function (t) { return self.masteryOf(t); });
  };

  /* ---- 编码 / 解码 ---- */

  // 规范 3.5：超预算时按 32→24→16→8→4→0 压缩文字段，仍超才报错；单段上限 255 字节
  var TEXT_STEPS = [255, 32, 24, 16, 8, 4, 0];

  Site.prototype.encode = function (kind, key, opts) {
    var steps = (opts && opts.textLimit != null) ? [opts.textLimit] : TEXT_STEPS;
    var last = null;
    for (var i = 0; i < steps.length; i++) {
      last = this._encodeWith(kind, key, steps[i]);
      if (last.length <= this.budget) return last;
    }
    return last;   // 已降到 0 仍超预算：交给调用方提示改用题组作用域
  };

  Site.prototype._encodeWith = function (kind, key, textStep) {
    var self = this;
    var gids = this.scopeGids(kind, key);
    if (!gids.length) throw new Error('作用域 ' + kind + ':' + key + ' 内没有题目');
    var ans = this.store.get('ans', {});
    var fav = this.store.get('fav', {});
    var used = {}, widths = {};
    gids.forEach(function (g) {
      var q = self.byGid[g];
      if (q && !used[q.type]) { used[q.type] = 1; widths[q.type] = maskWidth(self.types[q.type]); }
    });

    var n = gids.length;
    var blen = (n + 7) >> 3;
    var ansBits = new Array(blen).fill(0);
    var favBits = new Array(blen).fill(0);
    var txtBits = new Array(blen).fill(0);

    var bw = new BitWriter();
    var texts = [];

    gids.forEach(function (g, i) {
      var rec = ans[g];
      if (!rec) return;
      ansBits[i >> 3] |= 1 << (i & 7);
      if (fav[g]) favBits[i >> 3] |= 1 << (i & 7);
      bw.put(rec.ok === true ? 1 : (rec.ok === false ? 2 : 0), 2);
      var w = widths[(self.byGid[g] || {}).type] || 0;
      var mask = 0;
      (rec.p || []).forEach(function (k) { if (k >= 0 && k < w) mask |= 1 << k; });
      if (w) bw.put(mask, w);
      if (rec.x != null && rec.x !== '' && textStep > 0) {
        var bytes = utf8Bytes(String(rec.x)).slice(0, 255);
        txtBits[i >> 3] |= 1 << (i & 7);
        texts.push(bytes.slice(0, textStep));
      } else if (rec.x != null && rec.x !== '') {
        // 文字被压到 0 时不写文字段，但已答位仍置 1
      }
    });

    var head = [10];
    var anyWidth = Object.keys(widths).some(function (k) { return widths[k] > 0; });
    head.push((anyWidth ? 1 : 0) | (texts.length ? 2 : 0));
    head.push({ site: 0, subject: 1, unit: 2 }[kind]);
    var kb = kind === 'site' ? [] : utf8Bytes(key);
    head.push(kb.length);
    head = head.concat(kb);
    var typeKeys = Object.keys(widths).sort();   // 与校验门一致：题型表按字典序写
    head.push(typeKeys.length);
    typeKeys.forEach(function (t) {
      var tb = utf8Bytes(t);
      head.push(tb.length);
      head = head.concat(tb);
      head.push(widths[t]);
    });
    head.push((n >> 8) & 0xff, n & 0xff);
    head = head.concat(ansBits, favBits, txtBits, bw.finish());
    texts.forEach(function (blob) { head.push(blob.length); head = head.concat(blob); });

    return '10:' + b64url(head);
  };

  Site.prototype.decode = function (code) {
    code = cleanText(code).trim();
    if (code.indexOf('10:') === 0) return this._decodeV10(code);
    if (code.indexOf('9:') === 0) return this._decodeV9(code);
    if (/^[89]:/.test(code)) throw new Error('该版本编码已不再支持，请用「导入」按钮旁的旧码迁移说明');
    throw new Error('无法识别的进度码：应以 10: 或 9: 开头');
  };

  Site.prototype._decodeV10 = function (code) {
    var data = unb64url(code.slice(3));
    if (data.length < 6 || data[0] !== 10) throw new Error('编码头损坏');
    var pos = 2;
    var kindId = data[pos++];
    var klen = data[pos++];
    var key = utf8Decode(data.slice(pos, pos + klen)); pos += klen;
    var tcount = data[pos++];
    var widths = {};
    for (var i = 0; i < tcount; i++) {
      var kl = data[pos++];
      var name = utf8Decode(data.slice(pos, pos + kl)); pos += kl;
      widths[name] = data[pos++];
    }
    var total = (data[pos] << 8) | data[pos + 1]; pos += 2;
    var blen = (total + 7) >> 3;
    var ansBits = data.slice(pos, pos + blen); pos += blen;
    var favBits = data.slice(pos, pos + blen); pos += blen;
    var txtBits = data.slice(pos, pos + blen); pos += blen;

    var kind = ['site', 'subject', 'unit'][kindId];
    var gids = this.scopeGids(kind, key);
    if (gids.length !== total) throw new Error('编码内 gid 数 ' + total + ' 与本地作用域 ' + gids.length + ' 不一致（题库版本不同？）');

    var reader = new BitReader(data, pos);
    var ans = {}, fav = {}, texts = {};
    for (var j = 0; j < total; j++) {
      var g = gids[j];
      if (favBits[j >> 3] & (1 << (j & 7))) fav[g] = Date.now();
      if (!(ansBits[j >> 3] & (1 << (j & 7)))) continue;
      var okc = reader.read(2);
      var w = widths[(this.byGid[g] || {}).type] || 0;
      var mask = w ? reader.read(w) : 0;
      var picked = [];
      if (w) for (var k = 0; k < w; k++) if (mask & (1 << k)) picked.push(k);
      ans[g] = { ok: okc === 1 ? true : (okc === 2 ? false : null), at: Date.now(), p: picked };
    }
    var tpos = reader.bytesUsed();
    for (var j2 = 0; j2 < total; j2++) {
      if (!(txtBits[j2 >> 3] & (1 << (j2 & 7)))) continue;
      if (tpos >= data.length) throw new Error('文字段提前结束');
      var ln = data[tpos++];
      texts[gids[j2]] = utf8Decode(data.slice(tpos, tpos + ln));
      tpos += ln;
    }
    return { kind: kind, key: key, ans: ans, fav: fav, texts: texts };
  };

  /* ---- v9 旧码：全站快照，按去重后的字典序 gid 排位（兼容线上原方案C） ---- */

  Site.prototype.legacyGids = function () {
    var seen = {}, out = [];
    this.questions.forEach(function (q) {
      if (!seen[q._gid]) { seen[q._gid] = 1; out.push(q._gid); }
    });
    return out.sort();          // 旧版 GID_ALL = 去重后按码元序排列
  };

  Site.prototype._decodeV9 = function (code) {
    var bin = unb64url(code.slice(2));
    if (bin.length < 3 || bin[0] !== 9) throw new Error('v9 编码头损坏');
    var total = (bin[1] << 8) | bin[2];
    var len = (total + 7) >> 3;
    var hdr = 3 + len * 3;
    if (bin.length < hdr) throw new Error('v9 编码不完整，可能复制时漏了字符');
    var gids = this.legacyGids();
    if (gids.length !== total) {
      throw new Error('v9 编码含 ' + total + ' 个 gid，本地题库为 ' + gids.length + ' 个（题库版本不同）');
    }
    var ansBits = bin.slice(3, 3 + len);
    var favBits = bin.slice(3 + len, 3 + 2 * len);
    var txtBits = bin.slice(3 + 2 * len, hdr);
    var reader = new BitReader(bin, hdr);
    var ans = {}, fav = {};
    for (var i = 0; i < total; i++) {
      var g = gids[i];
      if (favBits[i >> 3] & (1 << (i & 7))) fav[g] = Date.now();
      if (!(ansBits[i >> 3] & (1 << (i & 7)))) continue;
      var okc = reader.read(2);
      var mask = reader.read(4);        // v9 固定 4 位掩码
      var picked = [];
      for (var k = 0; k < 4; k++) if (mask & (1 << k)) picked.push(k);
      ans[g] = { ok: okc === 1 ? true : (okc === 2 ? false : null), at: Date.now(), p: picked };
    }
    var tpos = reader.bytesUsed(), texts = {};
    for (var j = 0; j < total; j++) {
      if (!(txtBits[j >> 3] & (1 << (j & 7)))) continue;
      if (tpos >= bin.length) break;
      var ln = bin[tpos++];
      texts[gids[j]] = utf8Decode(bin.slice(tpos, tpos + ln));
      tpos += ln;
    }
    return { kind: 'site', key: '', ans: ans, fav: fav, texts: texts, v: 9 };
  };

  /* ---- 旧版本机记录迁移：csg_*（gid 键）与 csunitN_*（旧题号键） ---- */

  var LEGACY_RE = /^(?:csg|cs(?:unit\d+|exam|terms|calc|midterm))_(ans|wrong|fav)_v1$/;

  function toRecord(r) {
    if (!r || typeof r !== 'object') return null;
    var ok = r.ok === true ? true : (r.ok === false ? false : null);
    var picked = Array.isArray(r.picked) ? r.picked : (Array.isArray(r.p) ? r.p : null);
    var text = r.text != null ? r.text : (r.x != null ? r.x : '');
    var answered = !!picked || !!text || ok !== null || r.done === true;
    if (!answered) return null;
    var rec = { ok: ok, at: typeof r.at === 'number' ? r.at : Date.now() };
    if (picked && picked.length) {
      rec.p = picked.filter(function (k) { return typeof k === 'number' && k >= 0; })
        .sort(function (a, b) { return a - b; });
    }
    if (text) rec.x = cleanText(text).trim();
    if (r.self === true) rec.self = true;
    if (typeof r.c === 'number') rec.c = r.c;
    return rec;
  }

  function eachLegacyEntry(value, fn) {
    if (value == null) return;
    if (Array.isArray(value)) { value.forEach(function (g) { if (typeof g === 'string') fn(g, 1); }); return; }
    if (typeof value !== 'object') return;
    Object.keys(value).forEach(function (g) { fn(g, value[g]); });
  }

  // 幂等：迁移过一次就记标记，不重复覆盖用户此后产生的记录
  Site.prototype.migrateLegacy = function () {
    var store = this.store;
    if (store.get('migrated', null)) return { skipped: true, ans: 0, wrong: 0, fav: 0 };
    if (typeof localStorage === 'undefined' || !localStorage.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    var idMap = this.legacyIdMap || {};
    var ans = store.get('ans', {});
    var wrong = store.get('wrong', {});
    var fav = store.get('fav', {});
    var self = this;
    var counts = { ans: 0, wrong: 0, fav: 0, orphan: 0 };
    var handled = [];

    function resolve(key) {
      if (/^g[0-9a-f]{8}([0-9a-f]{8})?$/.test(key)) return key;
      return idMap[key] || null;
    }

    var names = [];
    for (var i = 0; i < localStorage.length; i++) names.push(localStorage.key(i));

    names.forEach(function (name) {
      var m = LEGACY_RE.exec(name);
      if (!m) return;
      var kind = m[1];
      var raw;
      try { raw = JSON.parse(localStorage.getItem(name) || 'null'); } catch (e) { return; }
      handled.push(name);

      eachLegacyEntry(raw, function (key, val) {
        var gid = resolve(key);
        if (!gid) { counts.orphan++; return; }
        if (kind === 'ans') {
          var rec = toRecord(val);
          if (!rec) return;
          if (!ans[gid]) { ans[gid] = rec; counts.ans++; }
          else if (ans[gid].ok === null && rec.ok !== null) { ans[gid] = rec; counts.ans++; }
        } else if (kind === 'wrong') {
          if (!wrong[gid]) { wrong[gid] = typeof val === 'number' ? val : Date.now(); counts.wrong++; }
        } else if (kind === 'fav') {
          if (!fav[gid]) { fav[gid] = (val && typeof val === 'object' && typeof val.t === 'number') ? val.t : Date.now(); counts.fav++; }
        }
      });
    });

    if (!handled.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    store.set('ans', ans);
    store.set('wrong', wrong);
    store.set('fav', fav);
    store.set('migrated', { at: Date.now(), from: handled, counts: counts });
    // 旧键一律不删：回退到旧页面仍可用（规范 8.2 第 4 条）
    return counts;
  };

  // 导入：只覆盖作用域内，域外原样保留（规范 3.3）
  Site.prototype.importCode = function (code) {
    var snapshot = {
      ans: this.store.get('ans', {}), wrong: this.store.get('wrong', {}), fav: this.store.get('fav', {})
    };
    this.store.set('bak', { at: Date.now(), data: snapshot });

    var got = this.decode(code);
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var self = this;
    var touched = 0;

    Object.keys(got.ans).forEach(function (g) {
      var incoming = got.ans[g];
      if (got.texts[g] != null) incoming.x = cleanText(got.texts[g]);
      ans[g] = mergeRecord(ans[g] || null, incoming);
      if (incoming.ok === false) wrong[g] = Date.now();
      touched++;
    });
    Object.keys(got.fav).forEach(function (g) { fav[g] = fav[g] || Date.now(); });

    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    return { kind: got.kind, key: got.key, count: touched, v: got.v || 10 };
  };

  Site.prototype.undoImport = function () {
    var bak = this.store.get('bak', null);
    if (!bak) return false;
    this.store.set('ans', bak.data.ans || {});
    this.store.set('wrong', bak.data.wrong || {});
    this.store.set('fav', bak.data.fav || {});
    return true;
  };

  /* ---- 统计（三级口径，分母一律 gid 去重） ---- */

  Site.prototype.stats = function (unitKey) {
    var self = this;
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var gids = unitKey ? this.scopeGids('unit', unitKey) : this.order.slice();
    var seen = {}, total = 0, answered = 0, correct = 0, wrongN = 0, favN = 0;
    gids.forEach(function (g) {
      if (seen[g]) return;
      seen[g] = 1;
      total++;
      var r = ans[g];
      if (r) {
        answered++;
        if (r.ok === true) correct++;
      }
      if (wrong[g]) wrongN++;
      if (fav[g]) favN++;
    });
    return {
      total: total, answered: answered, correct: correct,
      rate: answered ? Math.round(100 * correct / answered) : null,
      wrong: wrongN, fav: favN
    };
  };

  var QB = {
    fpNorm: fpNorm, fpHash: fpHash, fingerprint: fingerprint,
    norm: norm, judge: judge, fuzzyEq: fuzzyEq, cleanText: cleanText,
    maskWidth: maskWidth, mergeRecord: mergeRecord,
    Store: Store, Site: Site,
    create: function (def, store) { return new Site(def, store); }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = QB;
  else root.QB = QB;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

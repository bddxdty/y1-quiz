<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>计算机导论 · 第四单元 数据结构与算法</title>
<style>/* qb-page.css — 题库页面样式（内核共用，不含任何科目特有内容） */
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e4e8ef; --line2:#eef1f6;
  --text:#1e2330; --muted:#5b6373; --muted2:#6b7383;
  --accent:#2f6fed; --accent-ink:#2557c7; --accent-soft:#eaf1ff;
  --ok:#0b6b48; --ok-soft:#e7f7ef; --ok-line:#b7e6cf;
  --bad:#b42318; --bad-soft:#fdecea; --bad-line:#f6c9c4;
  --warn:#b54708; --warn-soft:#fef3e2;
  --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 72px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:14px}
.top h1{font-size:21px;margin:0;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.top .spacer{flex:1}
.home{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:6px 12px;background:#fff}
.home:hover{color:var(--accent);border-color:#c7dbff;text-decoration:none}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.block{padding:14px 16px;margin-bottom:14px}

/* stats */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;margin-bottom:14px}
.stat-k{font-size:12px;color:var(--muted2);letter-spacing:.3px}
.stat-v{font-size:19px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-bar{height:4px;border-radius:3px;background:#eef1f6;margin-top:7px;overflow:hidden}
.stat-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl+.ctl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.seg{display:inline-flex;background:#f1f4fa;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;color:#48505f}
.seg button:hover{color:var(--accent)}
.seg button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
select,input[type=search]{
  font:inherit;font-size:13.5px;color:var(--text);border:1px solid var(--line);background:#fff;
  border-radius:9px;padding:7px 10px;outline:none
}
select:focus,input[type=search]:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=search]{min-width:170px;flex:1}
.btn{
  border:1px solid var(--line);background:#fff;color:#3c4353;border-radius:9px;padding:7px 14px;
  font:inherit;font-size:13.5px;cursor:pointer;transition:.15s
}
.btn:hover:not(:disabled){border-color:#c7dbff;color:var(--accent);background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2557c7;border-color:#2557c7;color:#fff}
.btn.ghost{background:#fff}
.btn.ghost.on{color:#b54708;border-color:#f5dcb4;background:var(--warn-soft)}
.btn.small{padding:5px 11px;font-size:13px}

/* card */
#card{padding:18px 18px 16px;margin-bottom:14px}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fafbfd;white-space:nowrap}
.tag-type{color:var(--accent-ink);border-color:#c7dbff;background:var(--accent-soft)}
.tag-diff.d-0{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.tag-diff.d-1{color:var(--warn);border-color:#f5dcb4;background:var(--warn-soft)}
.tag-diff.d-2{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.q-topic{font-size:12.5px;color:var(--muted2)}
.q-no{margin-left:auto;font-size:12.5px;color:var(--muted2);font-variant-numeric:tabular-nums}
.q-stem{font-size:16.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.q-img{max-width:100%;margin-top:10px;border-radius:8px;border:1px solid var(--line)}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;
  font:inherit;font-size:15px;line-height:1.6;cursor:pointer;transition:.13s;color:var(--text)
}
.opt:hover:not(:disabled){border-color:#c7dbff;background:#fafcff}
.opt:disabled{cursor:default}
.opt-k{
  flex:0 0 24px;height:24px;border-radius:7px;background:#f1f4fa;color:#48505f;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600
}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .opt-k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.right .opt-k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .opt-k{background:var(--bad);color:#fff}

/* inputs */
.in,.ta{
  width:100%;margin-top:14px;font:inherit;font-size:15px;color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;background:#fff;resize:vertical
}
.in:focus,.ta:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
.in:disabled,.ta:disabled{background:#fafbfd;color:var(--muted)}

/* action bar */
.q-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hint{font-size:12.5px;color:var(--muted2)}
.verdict{font-size:14px;font-weight:650;padding:5px 12px;border-radius:999px}
.verdict.ok{color:var(--ok);background:var(--ok-soft)}
.verdict.bad{color:var(--bad);background:var(--bad-soft)}
.verdict.mid{color:var(--warn);background:var(--warn-soft)}

/* explanation */
.exp{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.exp-h{font-size:12.5px;color:var(--muted2);letter-spacing:.4px;margin-bottom:7px}
.exp-a{font-size:14.5px;margin:0 0 8px;padding:10px 12px;background:#f7f9fd;border-radius:9px;border:1px solid var(--line2)}
.exp-p{font-size:14.5px;color:#333a49;margin:0 0 6px;white-space:pre-wrap}
.exp-src{font-size:12px;color:var(--muted2);margin:6px 0 0}
.self{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}

/* nav */
#nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav-mid{flex:1;text-align:center;font-size:13px;color:var(--muted2);font-variant-numeric:tabular-nums}

/* mastery */
#mastery{padding:14px 16px;margin-bottom:14px}
.mt{width:100%;border-collapse:collapse;font-size:13.5px}
.mt th{text-align:left;font-weight:600;color:var(--muted2);font-size:12px;letter-spacing:.3px;padding:0 0 8px;border-bottom:1px solid var(--line2)}
.mt td{padding:7px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
.mt tr:last-child td{border-bottom:0}
.mt-t{color:#333a49}
.mt-s{font-variant-numeric:tabular-nums;font-weight:650;width:56px}
.mt-n{color:var(--muted2);width:56px;text-align:right}
.lv{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.lv-ok{color:var(--ok);background:var(--ok-soft)}
.lv-mid{color:var(--warn);background:var(--warn-soft)}
.lv-bad{color:var(--bad);background:var(--bad-soft)}

/* transfer */
#transfer{padding:14px 16px;margin-bottom:14px}
#x-code{width:100%;min-height:86px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:10px;resize:vertical;background:#fafbfd;color:#333a49}
#x-info{font-size:12.5px;color:var(--muted2);margin-top:8px;min-height:18px}
.x-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* misc */
.empty{padding:34px 8px;text-align:center}
.empty-t{font-size:15.5px;font-weight:600}
.empty-s{color:var(--muted2);font-size:13.5px;margin:6px 0 0}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:#1e2330;color:#fff;font-size:13.5px;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--muted2);font-size:12px;text-align:center;margin-top:18px;line-height:1.8}

@media (max-width:640px){
  .wrap{padding:14px 12px 64px}
  #stats{grid-template-columns:repeat(2,1fr)}
  .top h1{font-size:18.5px}
  .q-stem{font-size:16px}
  .opt{font-size:14.5px}
  input[type=search]{min-width:100%}
}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;
}
mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */
.q-stem mjx-container[display="true"],
.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;

mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;

/* 行间公式在窄屏可横向滚动，不撑破卡片 */

.exp-p mjx-container[display="true"],

.q-stem{line-height:2.05}

.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>

0],"meta":{"origin":{"id":"d-02","no":272,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-003","type":"single","topic":"4.1 数据结构与数组","diff":"易","stem":"数组索引（下标）的作用是（　）。","exp":"中括号里的索引（index，也叫下标）表示元素在数组中的编号，从数组开始处计数。有了索引，元素便有了独立且形式一致的标识，可配合循环批量处理。","options":["表示数组占用的字节数","表示元素在数组中的编号，使每个元素有独立的标识","表示元素的取值大小","表示数组的类型"],"answer":[1],"meta":{"origin":{"id":"d-03","no":273,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-004","type":"single","topic":"4.1 数据结构与数组","diff":"中","stem":"使用数组后，程序员需要编写的语句数量大幅减少，计算机需要执行的语句总数也同步大幅减少。","exp":"错误。使用数组减少的是“程序员的工作量”（程序可重用性提高、代码不必重复编写）；计算机实际执行的语句总数并没有减少，反而因循环的初始化、增量、判断而略有增加。我们关心的是程序员效率与程序可维护性。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"d-04","no":274,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-005","type":"single","topic":"4.1 数据结构与数组","diff":"中","stem":"二维数组只是逻辑上的结构，它在内存中的物理视图仍然是一维连续存放的。","exp":"正确。二维数组按行（或列）优先顺序把元素依次排入一维内存：若第一行首地址为 x，则第二行为 x+1……每一行内部元素地址连续。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"d-05","no":275,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-006","type":"comp","topic":"4.1 数据结构与数组","diff":"中","stem":"内存中有一个二维数组 students，大小为 100 行 × 4 列，每个元素占 1 个存储单元。已知 students[2][3] 的地址为 1000，求 students[5][3] 的地址（下标从 1 开始）。","exp":"不用先求首地址，只比较相对位置更快：\n行差 5−2 = 3 行，每行 4 个元素 → 12 个单元；列相同，不再偏移；\n1000 + 12 = 1012。\n若用通式：y₀ = 1000 − [4×(2−1)+(3−1)] = 994，则 y(5,3) = 994 + 4×4 + 2 = 1012，结果一致。","ref":"1012。\n快速解：两元素相距 4×(5−2) + (3−3) = 12 个单元，故地址为 1000 + 12 = 1012。\n通式：y(i,j) = y₀ + m×(i−1) + (j−1)，m 为列数。","meta":{"origin":{"id":"d-06","no":276,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-007","type":"comp","topic":"4.1 数据结构与数组","diff":"难","stem":"二维数组 a[1..6][1..5] 按行优先连续存放，每个元素占 2 个字节。已知 a[1][1] 的地址为 2000，求 a[4][3] 的地址。","exp":"按行优先：a[4][3] 前面有 3 整行（每行 5 个元素）共 15 个元素，本行内前面还有 2 个元素，合计偏移 17 个元素。每个元素 2 字节，故偏移 34 字节，地址为 2034。\n易错点：忘记乘“每个元素的字节数”。","ref":"2034。\n偏移元素数 = 5×(4−1) + (3−1) = 17 个；\n偏移字节数 = 17×2 = 34；\n地址 = 2000 + 34 = 2034。","meta":{"origin":{"id":"d-07","no":277,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-008","type":"single","topic":"4.1 数据结构与数组","diff":"中","stem":"在数组的中间位置插入一个元素，主要的时间开销来自（　）。","exp":"数组元素在物理上依次排列，中间插入必须把插入位置到末尾的所有元素向后挪一位，腾出空间，元素越多开销越大。尾部插入则只需扩大长度并放到最后，开销很小。","options":["重新申请整块内存","把插入位置之后的元素依次向后移动","把插入位置之前的元素依次向前移动","重新计算数组索引"],"answer":[1],"meta":{"origin":{"id":"d-08","no":278,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-009","type":"single","topic":"4.1 数据结构与数组","diff":"中","stem":"在数组的尾部删除一个元素，正确的操作是（　）。","exp":"尾部删除只需把数组长度减 1（逻辑上舍弃最后一个元素），无需移动元素；而删除开头或中间元素则需要把其后的所有元素依次前移，开销较大。","options":["把第一个元素移到末尾","把数组长度减 1 即可","把被删元素之后的所有元素前移","必须重新创建整个数组"],"answer":[1],"meta":{"origin":{"id":"d-09","no":279,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-010","type":"single","topic":"4.1 数据结构与数组","diff":"中","stem":"数组的插入和删除效率较低，因此数组更适合大量查找和检索的场合。","exp":"正确。数组靠索引支持随机访问，查找/检索很快；但中间插入、删除需要成批移动元素，效率低。所以数组适合“查多改少”的场景。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"d-10","no":280,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-011","type":"single","topic":"4.1 数据结构与数组","diff":"中","stem":"数组遍历指的是（　）。","exp":"遍历（traversal）是按某种顺序访问每个元素且每个只访问一次，通常用循环实现。例：求平均值时用循环累加 sum，最后 sum/n。","options":["随机抽取数组中的一个元素","按某种顺序访问数组中的每一个元素，且每个元素只访问一次","把数组元素重新排序","删除数组中的重复元素"],"answer":[1],"meta":{"origin":{"id":"d-11","no":281,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-012","type":"single","topic":"4.2 链表","diff":"易","stem":"链表的每个节点（元素）通常包含两部分，它们是（　）。","exp":"链表节点 = 数据部分 + 链。数据部分存放实际信息；链（指针）存放后继节点的地址。链表在物理存储上不连续、不按顺序，元素之间的逻辑顺序由指针链接次序实现。","options":["索引和数据","数据和链（指针）","地址和长度","操作码和地址码"],"answer":[1],"meta":{"origin":{"id":"d-12","no":282,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-013","type":"single","topic":"4.2 链表","diff":"易","stem":"链表中“头指针”的作用是（　）。","exp":"头指针是一个特殊的指针变量，指向第一个节点，链表的名字就是该指针变量的名字；最后一个节点的链为空指针（null），用来标记链表结束。","options":["记录链表的长度","存放最后一个元素的数据","标识链表的第一个元素，链表的名字就是该指针变量的名字","标识链表的结束"],"answer":[2],"meta":{"origin":{"id":"d-13","no":283,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-014","type":"fill","topic":"4.2 链表","diff":"易","stem":"链表中最后一个节点的链不指向任何节点，通常用 ____ 来标记链表的结束。","exp":"空指针（null pointer）表示“不指向任何位置”，放在最后一个节点的链域中，标志链表到此结束。","answers":["空指针","null","NULL","空"],"meta":{"origin":{"id":"d-14","no":284,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-015","type":"single","topic":"4.2 链表","diff":"中","stem":"链表支持随机访问，可以直接由下标计算出任意节点的地址。","exp":"错误。链表节点物理位置不连续，第 i 个节点的地址只保存在第 i−1 个节点的链中，因此只能从头指针开始顺序查找（用 walker 游标逐步移动），不支持随机访问。数组才支持随机访问。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"d-15","no":285,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-016","type":"single","topic":"4.2 链表","diff":"易","stem":"在链表中查找某个元素时，通常（　）。","exp":"一个元素的位置只有它的前驱知道（前驱的链保存后继地址），所以链表查找只能顺序进行：用游标指针 walker 从头节点开始，沿链逐个移动、取值比较，直到找到或到达空指针。","options":["用公式直接算出其地址","从中间节点开始向两端查找","从头指针开始，沿链逐个比较","先对链表排序再折半查找"],"answer":[2],"meta":{"origin":{"id":"d-16","no":286,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-017","type":"multi","topic":"4.2 链表","diff":"中","stem":"在链表中插入一个新节点（插在某个前驱之后），需要完成的操作有（　）。","exp":"四步都必需：定位 → 建节点 → 新节点链后继 → 前驱链新节点。整个过程只修改指针，不需要移动其他元素，因此效率高。\n注意顺序：必须先让新节点指向后继，再让前驱指向新节点，否则会丢失后继链。","options":["先查找确定插入位置","创建包含数据和链的新节点","让新节点的链指向原后继节点","让前驱节点的链指向新节点"],"answer":[0,1,2,3],"meta":{"origin":{"id":"d-17","no":287,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-018","type":"single","topic":"4.2 链表","diff":"中","stem":"在链表中删除某个节点，最关键的指针操作是（　）。","exp":"删除只需“绕过”被删节点：前驱的链改为指向被删节点的后继，然后释放该节点。无需移动任何数据元素，这是链表删除效率高的原因。","options":["让被删节点指向头指针","让被删节点的前驱直接指向被删节点的后继","把被删节点之后的所有节点前移一位","把链表长度减 1 即可"],"answer":[1],"meta":{"origin":{"id":"d-18","no":288,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-019","type":"multi","topic":"4.2 链表","diff":"中","stem":"关于数组与链表的比较，下列说法正确的有（　）。","exp":"四项均正确。数组：随机访问快、空间固定、插删慢，适合大量查找检索；链表：空间动态、插删快、只能顺序访问，适合频繁插删的场合。二者唯一区别在于数据项“连接在一起的方式”：数组靠索引，链表靠指针。","options":["数组利用索引支持随机访问，链表只能顺序访问","数组的内存空间较为固定，链表可动态增长或删除节点","数组中间插入删除需移动大量元素，链表只需修改指针","链表查找和遍历通常比数组慢"],"answer":[0,1,2,3],"meta":{"origin":{"id":"d-19","no":289,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-020","type":"fill","topic":"4.2 链表","diff":"难","stem":"内存中存放了一个链表，头指针的值为 44，每个元素用 2 个连续存储单元分别表示数据和链。各单元的“地址,内容”如下：\n(40,N) (41,46) (42,I) (43,40) (44,J) (45,50)\n(46,E) (47,00) (48,M) (49,42) (50,A) (51,40)\n则该链表表示的字符串（名字）是 ____。","exp":"从 44 开始：44 的数据 J，链 50 → 50 的数据 A，链 40 → 40 的数据 N，链 46 → 46 的数据 E，链 00（空指针）结束。\n依次读出 J→A→N→E，即 JANE。\n其余地址（41/42/43、47/48/49、51）是未被该链引用的“游离”数据，是干扰项。","answers":["JANE","jane"],"meta":{"origin":{"id":"d-20","no":290,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-021","type":"single","topic":"4.3 抽象数据类型","diff":"中","stem":"抽象数据类型（ADT）是指（　）。","exp":"ADT 是更高抽象层次的数据类型，代表逻辑结构概念：把数据和对数据的操作封装在一起，对用户隐藏内部实现。数组和链表是物理结构，栈、队列、树、图是典型的 ADT。","options":["数据在内存中的真实物理存储结构","一种只能用数组实现的数据结构","将对某数据类型有意义的操作封装在一起、并隐藏实现细节的数据类型","一种具体的编程语言"],"answer":[2],"meta":{"origin":{"id":"d-21","no":291,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-022","type":"multi","topic":"4.3 抽象数据类型","diff":"中","stem":"一个抽象数据类型通常包括（　）。","exp":"ADT 包括三方面：数据的定义、操作的定义、封装数据与操作并对用户隐藏。具体的内存地址分配属于物理实现细节，由实现者决定，不属于 ADT 的对外定义。","options":["具体的内存地址分配","操作的定义","对数据和操作的封装","数据的定义"],"answer":[1,2,3],"meta":{"origin":{"id":"d-22","no":292,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-023","type":"multi","topic":"4.3 抽象数据类型","diff":"易","stem":"下列属于抽象数据类型的有（　）。","exp":"栈、队列、树、图都是典型的 ADT：它们定义了数据的逻辑组织方式与一组操作（如入栈/出栈、入队/出队），而具体可用数组或链表实现。","options":["栈","队列","树","图"],"answer":[0,1,2,3],"meta":{"origin":{"id":"d-23","no":293,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-024","type":"single","topic":"4.4 栈与队列","diff":"易","stem":"栈的特点是（　）。","exp":"栈（stack）是一种受限线性表，插入和删除只能在“栈顶”一端进行，因此最后入栈的元素最先出栈，即后进先出（Last In First Out，LIFO）。","options":["先进先出（FIFO）","后进先出（LIFO）","随机存取","按优先级取出"],"answer":[1],"meta":{"origin":{"id":"d-24","no":294,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-025","type":"single","topic":"4.4 栈与队列","diff":"易","stem":"栈的基本操作中，push 和 pop 分别指（　）。","exp":"push（入栈、压栈）：在栈顶添加新元素；pop（出栈、弹栈）：把栈顶元素移走。建栈、入栈、出栈是栈的三个基本操作。","options":["在栈顶添加元素、在栈底添加元素","在栈底添加元素、从栈底移走元素","在栈顶添加元素、从栈顶移走元素","读出栈顶元素但不删除、删除整个栈"],"answer":[2],"meta":{"origin":{"id":"d-25","no":295,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-026","type":"single","topic":"4.4 栈与队列","diff":"难","stem":"一个栈的输入序列为 1 2 3 4 5，允许在入栈过程中随时出栈，则下列序列中不可能是栈的输出序列的是（　）。","exp":"逐项验证：\nA：1入→2入→2出→3入→3出→4入→4出→1出→5入→5出，可行；\nC：1入→2入→2出→3入→3出→1出→4入→4出→5入→5出，可行；\nD：1入→1出→2、3、4、5依次入→5、4、3、2依次出，可行；\nB：要 5 先出，必须 1～5 全部入栈；此时 5、4 出栈后栈内为 1、2、3（栈顶 3），下一个只能出 3，不可能出 1。故 B 不可能。","options":["2 3 4 1 5","5 4 1 3 2","2 3 1 4 5","1 5 4 3 2"],"answer":[1],"meta":{"origin":{"id":"d-26","no":296,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-027","type":"single","topic":"4.4 栈与队列","diff":"易","stem":"栈既可以用数组实现，也可以用链表实现。","exp":"正确。用数组实现时，用一个“栈顶下标”指向栈顶元素；用链表实现时，用一个指针指向栈顶节点。两种实现都只需在栈顶一端操作。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"d-27","no":297,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-028","type":"single","topic":"4.4 栈与队列","diff":"易","stem":"队列的特点是（　）。","exp":"队列（queue）也是受限线性表：只能在尾部（rear）插入、在头部（front）删除，因此最先入队的元素最先出队，即先进先出（First In First Out，FIFO）。","options":["后进先出（LIFO）","只能在中间插入删除","先进先出（FIFO）","元素按大小排列"],"answer":[2],"meta":{"origin":{"id":"d-28","no":298,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-029","type":"single","topic":"4.4 栈与队列","diff":"中","stem":"队列的入队（enqueue）和出队（dequeue）操作分别发生在（　）。","exp":"enqueue 在队尾（rear）添加新元素；dequeue 删除队头（front）的元素。这一“尾进头出”的规则保证了先进先出。","options":["头部插入、尾部删除","尾部插入、头部删除","都在头部进行","都在尾部进行"],"answer":[1],"meta":{"origin":{"id":"d-29","no":299,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-030","type":"single","topic":"4.4 栈与队列","diff":"中","stem":"队列可以在头部插入元素、在尾部删除元素。","exp":"错误。队列是“尾部插入、头部删除”；若反过来（头部插入、尾部删除）就变成后进先出，不再是队列。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"d-30","no":300,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-031","type":"short","topic":"4.4 栈与队列","diff":"中","stem":"简述栈与队列的区别，并各举一个生活中的例子。","exp":"对比要点：操作端（栈：同一端；队列：两端）、规则（LIFO / FIFO）、典型应用。","ref":"栈只允许在同一端（栈顶）插入和删除，特点是后进先出（LIFO），如叠放的一摞盘子、浏览器的后退、编辑器的撤销；\n队列只允许在尾部插入、头部删除，特点是先进先出（FIFO），如排队买票、打印任务队列、消息队列。","meta":{"origin":{"id":"d-31","no":301,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-032","type":"single","topic":"4.5 树与二叉树","diff":"易","stem":"树中“根节点”指的是（　）。","exp":"树由节点（顶点）和有向弧组成。若非空，其中有一个节点没有进入的弧，称为根（root）；没有指向子节点的节点称为叶子节点；从一个节点可以直接到达的节点称为其子节点。","options":["出度最大的节点","没有子节点的节点","入度为 1 的节点","没有进入的弧的节点"],"answer":[3],"meta":{"origin":{"id":"d-32","no":302,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-033","type":"single","topic":"4.5 树与二叉树","diff":"易","stem":"树中没有指向子节点的节点称为（　）。","exp":"叶子节点的出度为 0，位于树的末端；根节点入度为 0；中间节点入度为 1、出度 ≥ 1。","options":["叶子节点","中间节点","根节点","子树"],"answer":[0],"meta":{"origin":{"id":"d-33","no":303,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-034","type":"fill","topic":"4.5 树与二叉树","diff":"中","stem":"树的每个节点都可能有子树。其中根节点的入度为 ____，叶子节点的出度为 ____。（两空用空格分隔）","exp":"节点类型与度：\n根节点——入度 0，出度 0 或更多；\n中间节点——入度只能为 1，出度 1 或更多；\n叶子节点——入度只能为 1，出度 0。\n“度”指与节点连接的分支数目，指向节点的称入度，离开节点的称出度。","answers":["0 0","00","0,0","0和0"],"meta":{"origin":{"id":"d-34","no":304,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-035","type":"single","topic":"4.5 树与二叉树","diff":"中","stem":"树中除根节点外，每个中间节点的入度只能为 1。","exp":"正确。树中每个节点（除根）只有一个前驱（父节点），故入度为 1；根节点没有前驱，入度为 0。若某节点入度大于 1，就不再是树而是一般的有向图。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"d-35","no":305,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-036","type":"single","topic":"4.5 树与二叉树","diff":"易","stem":"二叉树是（　）。","exp":"二叉树中任一节点的子树个数不超过 2，分别称为左子树和右子树，且左右有序。递归定义：二叉树是空树，或由一个根节点和两棵互不相交的、分别称为左子树和右子树的二叉树组成。","options":["每个节点只有一个子节点的树","每个节点必须有两棵子树的树","所有叶子在同一层的树","每个节点至多有两棵子树的树"],"answer":[3],"meta":{"origin":{"id":"d-36","no":306,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-037","type":"single","topic":"4.5 树与二叉树","diff":"中","stem":"二叉树的左右子树有次序之分，交换左右子树会得到另一棵不同的二叉树。","exp":"正确。二叉树是有序树，左子树与右子树不能随意互换；即使只有一个子节点，也要区分它是左孩子还是右孩子。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"d-37","no":307,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-038","type":"single","topic":"4.5 树与二叉树","diff":"中","stem":"二叉树可以使用数组或链表实现。对于经常插入和删除的情况，更流行的是（　）。","exp":"数组实现适合完全二叉树（可用下标定位父子），但插入删除需移动元素、空间固定；链表实现通过指针连接子节点，插入删除只需改指针，效率更高，因此更常用。","options":["数组实现，因为下标计算方便","顺序表实现，因为空间连续","链表实现，因为插入删除效率更高","邻接矩阵实现"],"answer":[2],"meta":{"origin":{"id":"d-38","no":308,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-039","type":"short","topic":"4.5 树与二叉树","diff":"中","stem":"请说明树中“度、入度、出度”的含义，并列出根节点、中间节点、叶子节点三者的入度与出度特征。","exp":"记忆线索：入度看“有几个父亲”，出度看“有几个孩子”；根无父、叶无子。","ref":"度：与节点连接的分支数目；其中指向该节点的分支数称入度，离开该节点的分支数称出度。\n根节点：入度 0，出度 0 或更多；\n中间节点：入度只能为 1，出度 1 或更多；\n叶子节点：入度只能为 1，出度 0。","meta":{"origin":{"id":"d-39","no":309,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-040","type":"single","topic":"4.6 图","diff":"易","stem":"图（graph）由（　）构成。","exp":"图由顶点（vertex，图中的数据元素）和边（edge，顶点之间的逻辑关系）构成。边可以带权重，表示距离、成本等。","options":["一组节点和指向子节点的指针","一组数据和一组索引","一组顶点和顶点之间的连线（边）","一组记录和一组字段"],"answer":[2],"meta":{"origin":{"id":"d-40","no":310,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-041","type":"single","topic":"4.6 图","diff":"易","stem":"若图中任意两个顶点之间的边都没有方向，则称为无向图；若都有方向，则称为有向图。","exp":"正确。无向边不区分方向，如“两地之间有公路”；有向边区分方向，如“A 关注 B”并不等于“B 关注 A”。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"d-41","no":311,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-042","type":"single","topic":"4.6 图","diff":"中","stem":"用邻接矩阵存储含 N 个顶点的图时，矩阵的大小为（　）。","exp":"邻接矩阵是 N×N 的二维数组，行、列分别对应 N 个顶点；矩阵元素表示对应两顶点之间是否邻接。带权图把权重存入矩阵元素，用 0 表示不邻接。","options":["N×2","N×N","2×N","N²×N"],"answer":[1],"meta":{"origin":{"id":"d-42","no":312,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-043","type":"fill","topic":"4.6 图","diff":"中","stem":"用邻接矩阵存储一个有 6 个顶点的图，该矩阵共有 ____ 个元素。","exp":"邻接矩阵大小为 N×N = 6×6 = 36 个元素。即使很多位置表示“不邻接”（0），这些位置仍占用存储空间，这是邻接矩阵适合稠密图、不适合稀疏图的原因。","answers":["36"],"meta":{"origin":{"id":"d-43","no":313,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-044","type":"short","topic":"4.6 图","diff":"中","stem":"什么是邻接矩阵？它如何表示顶点之间是否相邻以及边的权重？","exp":"要点：N×N 二维数组；行/列对应顶点；非零（或权重）表示邻接，0 表示不邻接。","ref":"邻接矩阵是用二维数组存储图的方法：矩阵大小为 N×N，行和列分别对应图的 N 个顶点；矩阵元素表示对应顶点之间的邻接信息。若两顶点之间有边，元素置为非零值（带权图存入该边的权重）；若没有边，元素置为 0。","meta":{"origin":{"id":"d-44","no":314,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-045","type":"single","topic":"4.6 图","diff":"中","stem":"图的邻接矩阵中，0 表示两个顶点之间不邻接。","exp":"正确。课件约定：将边的权重存储在矩阵元素中，0 表示不邻接（无权图中通常用 1 表示邻接、0 表示不邻接）。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"d-45","no":315,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-046","type":"single","topic":"4.2 链表","diff":"中","stem":"链表在插入和删除节点时不需要移动其他元素，只需修改相关指针，因此效率比数组高。","exp":"正确。但要注意前提：链表“先要找到位置”，而查找只能顺序进行，所以链表是“插删快、查找慢”；数组则“查找快、插删慢”。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"d-46","no":316,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-047","type":"short","topic":"4.3 抽象数据类型","diff":"中","stem":"什么是逻辑结构与物理结构？请结合二维数组加以说明。","exp":"要点：逻辑结构=抽象关系（表格）；物理结构=内存实际布局（一维连续）；二维是逻辑视图，物理仍是一维。","ref":"逻辑结构是数据元素之间的抽象关系，与具体存储无关；物理结构（存储结构）是数据在内存中的实际存放方式。二维数组在逻辑上是“行×列”的表格，可以按行、列定位元素；但在内存中它仍按行优先排成一维连续序列，第 1 行之后紧接第 2 行，元素地址可用公式计算。可见同一逻辑结构可以有不同物理实现。","meta":{"origin":{"id":"d-47","no":317,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-048","type":"single","topic":"4.7 算法概念与表示","diff":"易","stem":"算法（algorithm）的准确定义是（　）。","exp":"算法是“明确的、可执行的、有限步骤的问题求解过程”。它独立于计算机系统，任何领域解决问题的方法都可称为算法；程序则是算法在某一种语言中的具体实现。","options":["一个明确的、可执行的、有限步骤的问题求解过程","一种编程语言的语法规则","一段用 C 语言写成的程序","计算机硬件的操作说明书"],"answer":[0],"meta":{"origin":{"id":"a-01","no":318,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-049","type":"multi","topic":"4.7 算法概念与表示","diff":"中","stem":"算法应具备的五个特性包括（　）。","exp":"五特性：有穷性（有限步后终止）、确定性（每步定义明确、无歧义）、可行性（每步都能执行）、输入（零个或多个）、输出（一个或多个）。","options":["有穷性","确定性","可行性","输入和输出"],"answer":[0,1,2,3],"meta":{"origin":{"id":"a-02","no":319,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-050","type":"single","topic":"4.7 算法概念与表示","diff":"中","stem":"一个算法至少要有一个输入，否则不合法。","exp":"错误。算法允许有零个或多个输入（例如“输出 1～100 内所有 7 的倍数”不需要输入），但必须有至少一个输出，否则算法没有意义。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"a-03","no":320,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-051","type":"single","topic":"4.7 算法概念与表示","diff":"中","stem":"算法可以有零个或多个输入，但至少应有一个输出。","exp":"正确。这是“输入/输出”特性的准确表述：输入 0～n 个，输出 ≥1 个。若没有任何输出，就无法得到求解结果。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"a-04","no":321,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-052","type":"single","topic":"4.7 算法概念与表示","diff":"中","stem":"“算法必须在有限步骤后终止”描述的是算法的（　）。","exp":"有穷性（finiteness）要求算法执行有限步后必须结束，不能无限循环。确定性要求每步无歧义；可行性要求每步可实现。","options":["有穷性","确定性","可行性","输出性"],"answer":[0],"meta":{"origin":{"id":"a-05","no":322,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-053","type":"multi","topic":"4.7 算法概念与表示","diff":"易","stem":"一般算法实现所定义的三种基本结构是（　）。","exp":"三种基本控制结构：顺序（Sequence）、选择/判断（Decision）、循环（Repetition）。任何复杂算法都可由这三种结构组合而成；递归是一种实现技巧，不属于三种基本结构。","options":["顺序结构","递归结构","循环结构","选择（判断）结构"],"answer":[0,2,3],"meta":{"origin":{"id":"a-06","no":323,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-054","type":"single","topic":"4.7 算法概念与表示","diff":"易","stem":"流程图中，菱形框通常表示（　）。","exp":"常用流程图符号：椭圆——开始/结束；矩形——处理/操作；菱形——判断/分支；平行四边形——输入/输出；带箭头的线——流程方向。","options":["开始或结束","判断或分支","处理或操作","输入或输出"],"answer":[1],"meta":{"origin":{"id":"a-07","no":324,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-055","type":"single","topic":"4.7 算法概念与表示","diff":"易","stem":"流程图中，平行四边形框通常表示（　）。","exp":"平行四边形表示输入/输出（如“输入 n”“输出 sum”）；矩形表示处理（如“sum ← sum + a[i]”）；菱形表示条件判断。","options":["开始或结束","输入或输出","判断或分支","处理或操作"],"answer":[1],"meta":{"origin":{"id":"a-08","no":325,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-056","type":"multi","topic":"4.7 算法概念与表示","diff":"中","stem":"关于伪代码，下列说法正确的有（　）。","exp":"伪代码用类似编程语言的结构表达算法逻辑，但不拘泥语法：不声明变量类型、不做语法检查，用清晰关键字描述控制流程，目的是让人看懂算法思路，不能直接编译运行。","options":["忽略变量声明、数据类型等细节","使用 if、then、else、while、for 等清晰的关键字","就是某一种编程语言的可编译代码","注重逻辑结构，不关注具体语法"],"answer":[0,1,3],"meta":{"origin":{"id":"a-09","no":326,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-057","type":"short","topic":"4.7 算法概念与表示","diff":"中","stem":"用自然语言或伪代码描述“求 n 个整数中最大值”的算法，并指出其中用到了哪种基本结构。","exp":"要点：先把第一个数作为当前最大值，再依次与其余各数比较，遇到更大者就更新；遍历用循环，比较更新用分支。该算法对 n 个数只需一轮扫描。","ref":"算法：MaxValue(A, n)\n输入：数组 A 和元素个数 n\nmax ← A[1]\ni ← 2\nwhile (i ≤ n)\n    if (A[i] > max) then max ← A[i]\n    i ← i + 1\nreturn max\n\n用到了顺序结构（初始化、返回）、选择结构（if 比较）和循环结构（while 遍历）。","meta":{"origin":{"id":"a-10","no":327,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-058","type":"single","topic":"4.8 排序","diff":"易","stem":"排序（sort）是指（　）。","exp":"排序是根据数据的值对它们进行排列，是计算机科学中最普遍的应用之一。课件介绍的三种基本排序：选择排序、冒泡排序、插入排序。","options":["删除重复的数据","把数据随机打乱","根据数据的值对它们进行排列","在数据中查找指定值"],"answer":[2],"meta":{"origin":{"id":"a-11","no":328,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-059","type":"single","topic":"4.8 排序","diff":"中","stem":"选择排序的基本思想是（　）。","exp":"选择排序：每一轮在待排序区间中“选择”最小（或最大）的元素，与区间起始位置交换，然后缩小待排序区间，直到全部排完。外层循环控制轮次，内层循环负责找最小值。","options":["每次比较相邻两个元素，逆序则交换","把序列一分为二分别排序再合并","把每个元素插入到前面已排好序的部分","每一轮从待排序元素中选出最小（或最大）的一个，放到序列的起始位置"],"answer":[3],"meta":{"origin":{"id":"a-12","no":329,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-060","type":"comp","topic":"4.8 排序","diff":"中","stem":"对序列 6, 3, 9, 1, 8 进行选择排序（每轮选最小值放到前面），请写出第一轮结束后的序列。","exp":"第一轮：扫描 6、3、9、1、8，最小值为 1（位于第 4 位），与第 1 位的 6 交换 → 1, 3, 9, 6, 8。\n第二轮在 3、9、6、8 中选最小 3，已在起始位置，不交换；第三轮在 9、6、8 中选 6，与 9 交换 → 1, 3, 6, 9, 8；第四轮 9 与 8 交换 → 1, 3, 6, 8, 9。","ref":"1, 3, 9, 6, 8。\n第一轮在全部 5 个元素中选出最小值 1，与第一个元素 6 交换，得到 1, 3, 9, 6, 8。","meta":{"origin":{"id":"a-13","no":330,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-061","type":"single","topic":"4.8 排序","diff":"中","stem":"冒泡排序的基本思想是（　）。","exp":"冒泡排序按顺序重复遍历数列，一次比较两个相邻元素，若顺序错误就交换。每轮结束，最大（或最小）的元素会像气泡一样“浮”到数列一端，故名“冒泡”。","options":["把元素逐个插入已排序部分","每轮直接选出最小值放到最前面","重复遍历数列，比较相邻两个元素，顺序错误就交换，直到没有需要交换为止","随机交换元素直到有序"],"answer":[2],"meta":{"origin":{"id":"a-14","no":331,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-062","type":"comp","topic":"4.8 排序","diff":"中","stem":"对序列 5, 1, 4, 2, 8 进行冒泡排序（从右到左依次比较相邻两数，小数放左边），请写出第一轮结束后的序列。","exp":"从右往左两两比较，小的往左“冒”：\n(2,8) 不换 → (4,2) 交换 → (1,2) 不换 → (5,1) 交换；\n第一轮把最小值 1 送到最左端，结果为 1, 5, 2, 4, 8。","ref":"1, 5, 2, 4, 8。\n过程：比较 2 与 8 不换；比较 4 与 2 交换 → 5,1,2,4,8；比较 1 与 2 不换；比较 5 与 1 交换 → 1,5,2,4,8。","meta":{"origin":{"id":"a-15","no":332,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-063","type":"single","topic":"4.8 排序","diff":"中","stem":"插入排序的基本操作是（　）。","exp":"插入排序把数组分为“已排序部分”和“待插入元素”：每次取出一个元素，在已排序部分中找到合适位置插入，使有序部分长度加 1，直到全部插入完成。类似整理扑克牌。","options":["把一个数据插入到已经排好序的有序数据中，得到一个新的、个数加一的有序序列","把最小的元素选出来放到最前面","反复比较相邻元素并交换","把序列分成两半分别排序"],"answer":[0],"meta":{"origin":{"id":"a-16","no":333,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-064","type":"comp","topic":"4.8 排序","diff":"中","stem":"对序列 7, 2, 9, 4 进行插入排序，请写出每一轮插入后的序列，以及最终结果。","exp":"插入排序过程：\n① 第一个元素 7 视为已排序；\n② 取 2，比 7 小，插到 7 前 → 2, 7；\n③ 取 9，比 7 大，插到末尾 → 2, 7, 9；\n④ 取 4，在 2、7、9 中找到位置（7 之前）→ 2, 4, 7, 9。","ref":"初始：[7]\n插入 2 → [2, 7]\n插入 9 → [2, 7, 9]\n插入 4 → [2, 4, 7, 9]\n最终结果：2, 4, 7, 9。","meta":{"origin":{"id":"a-17","no":334,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-065","type":"single","topic":"4.8 排序","diff":"中","stem":"选择排序每一轮最多只交换一次元素，而冒泡排序每一轮可能交换多次。","exp":"正确。选择排序每轮先“找”最小值，最后与区间首元素交换一次；冒泡排序每轮在相邻比较中可能反复交换。两者的外层循环都控制“轮次”，内层循环分别负责“找最小值”和“两两比较”。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"a-18","no":335,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-066","type":"single","topic":"4.9 查找","diff":"易","stem":"顺序查找的基本过程是（　）。","exp":"顺序查找（Sequential search）从起始位置开始依次比较，找到目标即成功；扫到末尾仍未找到，则确信目标不存在。它对数据是否有序没有要求，但平均比较次数多。","options":["直接由公式算出目标位置","先排序再折半比较","从数据元素的起始位置开始逐个比较，找到目标或确信目标不存在时结束","随机抽取元素比较"],"answer":[2],"meta":{"origin":{"id":"a-19","no":336,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-067","type":"single","topic":"4.9 查找","diff":"中","stem":"折半查找（二分查找）要求待查找的数据必须有序。","exp":"正确。折半查找每次都拿中间元素与目标比较，根据大小关系排除一半区间；若数据无序，“目标在前半/后半”的判断就不成立，算法失效。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"a-20","no":337,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-068","type":"fill","topic":"4.9 查找","diff":"难","stem":"在已排序的列表中查找 46，数据依次为：\n5、7、20、33、44、46、78、98、101、102、105（下标 0～10）\n顺序查找需要 ____ 次比较，折半查找需要 ____ 次比较。（两空用空格分隔）","exp":"顺序查找：依次比较 5、7、20、33、44、46，共 6 次。\n折半查找：区间 [0,10]，中间下标 (0+10)/2 = 5，对应元素正好是 46，第 1 次比较即命中。\n注意：折半查找并非一定更快，但通常能大幅减少比较次数。","answers":["6 1","61","6,1","6次1次"],"meta":{"origin":{"id":"a-21","no":338,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-069","type":"comp","topic":"4.9 查找","diff":"难","stem":"对有序表 12, 20, 25, 34, 41, 56, 63, 74, 82, 90 进行折半查找，查找目标 25 需要多少次比较？请写出每次比较的中间元素。","exp":"折半过程（下标从 0 开始）：\n区间 [0,9] → mid=4，元素 41，25<41 → 区间 [0,3]；\nmid=(0+3)/2=1，元素 20，25>20 → 区间 [2,3]；\nmid=(2+3)/2=2，元素 25，命中。共 3 次比较。","ref":"3 次。\n第 1 次：中间元素 41（下标 4），25 < 41，查左半区；\n第 2 次：左半区中间元素 20（下标 1），25 > 20，查右半区；\n第 3 次：中间元素 25（下标 2），命中。","meta":{"origin":{"id":"a-22","no":339,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-070","type":"single","topic":"4.9 查找","diff":"中","stem":"折半查找每比较一次后，下一步会（　）。","exp":"折半查找将目标与中间元素比较：若相等则成功；若目标较小，只在左半部分继续；若较大，只在右半部分继续。每次排除一半元素，因此效率高（时间复杂度 O(log n)）。","options":["随机选择一个新的区间","从头开始重新查找","把区间扩大一倍","只在前半部分或后半部分继续查找，范围缩小约一半"],"answer":[3],"meta":{"origin":{"id":"a-23","no":340,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-071","type":"single","topic":"4.10 迭代与递归","diff":"易","stem":"迭代（Iteration）指的是（　）。","exp":"迭代用循环（while/for）重复执行同一段代码，靠循环变量的推进逐步逼近结果；递归则是算法直接或间接调用自身，把复杂问题分解为相似的子问题。","options":["通过循环结构重复执行一段代码，每次循环都更接近最终结果","算法直接或间接调用自身","把问题分解为互不相关的子问题","只执行一次的语句序列"],"answer":[0],"meta":{"origin":{"id":"a-24","no":341,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-072","type":"single","topic":"4.10 迭代与递归","diff":"易","stem":"递归（Recursion）的核心特征是（　）。","exp":"递归在定义中调用自身，把大问题化为同类的更小问题，因此必须包含：① 递归关系（递推式）；② 终止条件（基准情形），否则会无限递归。","options":["只能处理数值问题","必须使用数组","必须使用两层以上循环","算法直接或间接调用自身"],"answer":[3],"meta":{"origin":{"id":"a-25","no":342,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-073","type":"single","topic":"4.10 迭代与递归","diff":"中","stem":"递归算法必须有终止条件，否则会无限调用自身导致栈溢出。","exp":"正确。以阶乘为例，递归定义为 n! = n × (n−1)!，同时规定 0! = 1 作为终止条件。缺少终止条件时调用不会停止，最终耗尽调用栈空间。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"a-26","no":343,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-074","type":"fill","topic":"4.10 迭代与递归","diff":"中","stem":"阶乘的递归定义中，当 n 等于 0 时返回 ____，作为递归的终止条件。","exp":"0! = 1 是递归的基准情形（base case）。递归式：n! = n × (n−1)!（n ≥ 1）；终止条件：0! = 1。","answers":["1","1.0"],"meta":{"origin":{"id":"a-27","no":344,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-075","type":"comp","topic":"4.10 迭代与递归","diff":"中","stem":"用递归方式计算 Factorial(4)，请写出结果，并说明一共调用了多少次 Factorial 函数。","exp":"调用链：F(4) → F(3) → F(2) → F(1) → F(0)。\nF(0)=1 返回后：F(1)=1×1=1，F(2)=2×1=2，F(3)=3×2=6，F(4)=4×6=24。\n共 5 次函数调用（含 F(0)），体现了“递推下去、回归上来”的过程。","ref":"结果 24；共调用 5 次。\nFactorial(4) → 4×Factorial(3) → 3×Factorial(2) → 2×Factorial(1) → 1×Factorial(0) = 1，逐层返回得 24。","meta":{"origin":{"id":"a-28","no":345,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-076","type":"single","topic":"4.10 迭代与递归","diff":"中","stem":"关于迭代与递归的比较，下列说法正确的是（　）。","exp":"迭代用循环变量推进，空间开销小、效率高；递归把问题分解为同类子问题，代码简洁、贴近数学定义，但每层调用都要占用栈空间，层数过深可能栈溢出。二者可互相转换。","options":["两者完全等价，任何情况下都只能选递归","迭代一定比递归慢","递归不需要终止条件","迭代靠循环推进，递归靠函数自我调用；递归代码通常更简洁，但占用调用栈空间"],"answer":[3],"meta":{"origin":{"id":"a-29","no":346,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-077","type":"single","topic":"4.10 迭代与递归","diff":"中","stem":"1974 年图灵奖获得者、著有《计算机程序设计的艺术》系列、开创数据结构课程体系的科学家是（　）。","exp":"高德纳（Donald Ervin Knuth）于 1974 年获图灵奖，其《计算机程序设计的艺术》系列（《基本算法》《半数值算法》《排序与搜索》《组合算法》）开创了数据结构课程体系。","options":["艾伦·图灵","唐纳德·克努特（Donald E. Knuth）","冯·诺依曼","克劳德·香农"],"answer":[1],"meta":{"origin":{"id":"a-30","no":347,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-078","type":"short","topic":"4.10 迭代与递归","diff":"中","stem":"算法与数据结构有什么关系？请结合一个例子说明。","exp":"要点：① 数据结构提供“原料与组织方式”，算法提供“处理步骤”；② 结构决定算法能否实施及效率；③ 举例（数组折半查找 vs 链表顺序查找）。","ref":"二者密不可分：数据结构是数据的组织与存储方式，算法是解决问题的步骤；算法必须作用于某种数据结构之上，数据结构的选择又直接决定算法的效率。例如在一个有序数组中查找某数，可用顺序查找（逐个比较，O(n)），也可用折半查找（每次排除一半，O(log n)）；若把数据组织成链表，则无法随机访问，折半查找难以实施，只能顺序查找。因此“程序 = 数据结构 + 算法”。","meta":{"origin":{"id":"a-31","no":348,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-079","type":"single","topic":"4.7 算法概念与表示","diff":"易","stem":"流程图中，椭圆（圆角矩形）框通常表示（　）。","exp":"椭圆表示算法的起点和终点（开始/结束），一个完整流程图通常只有一个开始和一个结束。","options":["判断或分支","处理或操作","开始或结束","输入或输出"],"answer":[2],"meta":{"origin":{"id":"a-32","no":349,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-080","type":"single","topic":"4.7 算法概念与表示","diff":"中","stem":"算法可以没有输出，只要过程能够结束就是合法算法。","exp":"错误。算法必须有至少一个输出，否则无法体现求解结果，失去意义。可以有零个输入，但不能没有输出。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"a-33","no":350,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-081","type":"single","topic":"4.8 排序","diff":"中","stem":"选择排序、冒泡排序和插入排序都包含外层循环与内层循环，属于典型的双重循环算法。","exp":"正确。三者都用外层循环控制“轮次”，内层循环完成具体工作：选择排序内层找最小值、冒泡排序内层两两比较交换、插入排序内层寻找插入位置。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"a-34","no":351,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-082","type":"single","topic":"4.9 查找","diff":"易","stem":"顺序查找既可用于有序数据，也可用于无序数据。","exp":"正确。顺序查找逐个比较，不依赖数据有序；折半查找则必须以有序为前提。这也是顺序查找虽然慢但适用面更广的原因。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"a-35","no":352,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-083","type":"short","topic":"4.10 迭代与递归","diff":"难","stem":"分别用迭代和递归两种思路描述求 n! 的算法（可用伪代码），并比较二者的特点。","exp":"要点：① 迭代用循环与累乘变量；② 递归用 n! = n×(n−1)! 加终止条件 0!=1；③ 比较空间开销、代码简洁度、溢出风险。","ref":"迭代：\nFact ← 1；i ← 1\nwhile (i ≤ n) { Fact ← Fact × i；i ← i + 1 }\nreturn Fact\n\n递归：\nif (n = 0) then return 1\nelse return n × Factorial(n − 1)\n\n比较：迭代用循环推进，只需常数级额外空间，效率高、不易栈溢出；递归代码简洁、贴合 n! = n×(n−1)! 的数学定义，但每层调用占用栈空间，n 很大时可能溢出，且函数调用有额外开销。","meta":{"origin":{"id":"a-36","no":353,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-084","type":"multi","topic":"4.1 数据结构与数组","diff":"易","stem":"数组的常用操作包括（　）。","exp":"课件的表述是“查找、插入、删除、检索和遍历”。插入分尾部插入与中间插入，删除分尾部删除与中间删除；遍历是按某种顺序访问每个元素且只访问一次。","options":["查找","插入","删除","遍历"],"answer":[0,1,2,3],"meta":{"origin":{"id":"d-48","no":354,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-085","type":"fill","topic":"4.1 数据结构与数组","diff":"中","stem":"二维数组 a[1..5][1..4] 按行优先连续存放，每个元素占 1 个存储单元，a[1][1] 的地址为 1000，则 a[4][2] 的地址为 ____。","exp":"按行优先，地址公式 y(i,j) = y₀ + m×(i−1) + (j−1)，m 为列数 4。\n代入：1000 + 4×(4−1) + (2−1) = 1000 + 12 + 1 = 1013。\n快速验算：从第 1 行第 1 列走到第 4 行第 2 列，需跨 3 整行（12 个元素）再右移 1 格，共 13 个单元。","answers":["1013"],"meta":{"origin":{"id":"d-49","no":355,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-086","type":"short","topic":"4.1 数据结构与数组","diff":"中","stem":"为什么数组适合大量查找检索、却不适合频繁插入删除？请结合其存储方式说明。","exp":"要点：① 连续存放 + 等长 → 下标可直接计算地址 → 随机访问快；② 连续紧邻 → 中间插删要成批移动元素 → 效率低；③ 结论：查多改少用数组，频繁插删用链表。","ref":"数组元素类型相同、长度相等、在内存中依次连续存放，因此只要知道首地址和下标，就能用公式直接算出任一元素的地址，实现随机访问，查找/检索很快。\n但也正因为元素连续紧邻，在中间插入时必须把插入位置之后的元素全部向后移动一位腾出空位；删除时必须把其后的元素全部向前移动一位填补空位，移动量随元素个数线性增长，开销很大。所以数组适合“查多改少”的场合。","meta":{"origin":{"id":"d-50","no":356,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-087","type":"single","topic":"4.1 数据结构与数组","diff":"中","stem":"用循环处理数组元素，最主要的好处是（　）。","exp":"引入数组与循环后，100 个分数只需少数几条语句（读入、处理、打印各一个循环），而不必写 300 条。但计算机实际执行的语句总数并未减少，反而因循环的初始化、增量、判断略有增加——我们关心的是程序员工作量与程序可维护性。","options":["程序员编写的语句数量大幅减少，程序的可重用性提高","计算机需要执行的语句总数也大幅减少","数组占用的内存空间更少","数组元素会自动排序"],"answer":[0],"meta":{"origin":{"id":"d-51","no":357,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-088","type":"single","topic":"4.1 数据结构与数组","diff":"中","stem":"数组元素在内存中依次连续存放且长度相等，因此可以由首地址和下标直接算出任一元素的地址。","exp":"正确。这正是数组支持随机访问（random access）的物理基础：地址 = 首地址 + 下标 × 元素长度。二维数组按行优先存放时，公式为 y₀ + m×(i−1) + (j−1)。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"d-52","no":358,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-089","type":"comp","topic":"4.2 链表","diff":"中","stem":"一个长度为 n 的链表，用顺序方式查找某个元素。若各元素被查找的概率相同，平均需要比较多少个节点？请写出推导过程。","exp":"链表只能从头指针沿链顺序查找，找不到时还要扫到空指针。\n等概率假设下：平均比较次数 = (1+2+…+n)/n = (n+1)/2，即约一半节点。\nn = 1000 时平均约 500 次，这就是链表“查找慢”的定量体现。","ref":"平均 (n+1)/2 个。\n第 1 个元素比较 1 次，第 2 个比较 2 次……第 n 个比较 n 次；\n总次数 = 1+2+…+n = n(n+1)/2；\n平均 = [n(n+1)/2] ÷ n = (n+1)/2。","meta":{"origin":{"id":"d-53","no":359,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-090","type":"short","topic":"4.2 链表","diff":"中","stem":"从存储方式、访问方式、插入删除效率三方面比较数组与链表。","exp":"一句话概括：数组“查快改慢、空间固定”，链表“查慢改快、空间灵活”。二者唯一区别在于数据项连接在一起的方式——索引 vs 指针。","ref":"存储方式：数组元素在内存中连续存放、长度固定，靠索引联系；链表节点物理上非连续、非顺序，靠指针（链）联系，空间可动态增减。\n访问方式：数组可由下标直接算出地址，支持随机访问；链表只能从头指针沿链顺序访问。\n插入删除：数组需成批移动元素，效率低；链表只需修改相关指针，效率高。\n结论：数组适合大量查找检索，链表适合频繁插入删除。","meta":{"origin":{"id":"d-54","no":360,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-091","type":"single","topic":"4.2 链表","diff":"易","stem":"链表节点在内存中的物理位置必须连续，否则无法通过指针访问。","exp":"错误。链表的存储特点恰恰是物理上非连续、非顺序：节点可以分散在内存各处，靠每个节点中保存的后继地址（指针）串起来。若物理上必须连续，那就是数组了。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"d-55","no":361,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-092","type":"single","topic":"4.2 链表","diff":"中","stem":"在链表中插入新节点时，必须先让新节点的链指向原后继节点，再让前驱节点的链指向新节点。这样规定顺序的原因是（　）。","exp":"若先把前驱的链改成指向新节点，前驱中原来的后继地址就被覆盖了，新节点便无从知道该指向谁，链表从插入点断开。\n正确顺序：新节点链后继 → 前驱链新节点。","options":["顺序无关，两种做法完全等价","否则新节点会被系统自动删除","否则头指针会失效","否则前驱中保存的原后继地址会被覆盖，导致链表断裂、后半段丢失"],"answer":[3],"meta":{"origin":{"id":"d-56","no":362,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-093","type":"single","topic":"4.3 抽象数据类型","diff":"中","stem":"抽象数据类型把数据和操作封装在一起并对用户隐藏实现细节，使用者只需了解操作的含义即可使用。","exp":"正确。ADT 处于比数组、链表更高的抽象层，只规定“能做什么”（操作语义），不规定“怎么实现”。例如栈只说明有 push/pop 及后进先出规则，至于用数组还是链表实现，使用者无需关心。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"d-57","no":363,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-094","type":"fill","topic":"4.3 抽象数据类型","diff":"中","stem":"抽象数据类型包括数据的定义、操作的定义和 ____ 三个方面。","exp":"ADT 三方面：① 数据（data structure）的定义；② 操作（operation）的定义；③ 封装数据与操作并对用户隐藏实现。典型 ADT：栈、队列、树、图。","answers":["封装","对数据和操作的封装","封装数据和操作","封装性"],"meta":{"origin":{"id":"d-58","no":364,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-095","type":"comp","topic":"4.3 抽象数据类型","diff":"中","stem":"一个 4 行 3 列的二维表格按行优先存入下标从 0 开始的一维数组，表格中第 2 行第 2 列（行、列均从 1 开始计）的元素，在一维数组中的下标是多少？","exp":"这是“逻辑结构 → 物理结构”的映射：逻辑上是二维表格，物理上是一维数组。\n通用公式（下标从 0 开始）：index = 列数×(i−1) + (j−1) = 3×1 + 1 = 4。\n核对：第 1 行占下标 0、1、2；第 2 行第 1 列是 3，第 2 列是 4。","ref":"4。\n前面有 1 整行（3 个元素），本行内前面有 1 个元素，故下标 = 3×(2−1) + (2−1) = 3 + 1 = 4。","meta":{"origin":{"id":"d-59","no":365,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-096","type":"single","topic":"4.3 抽象数据类型","diff":"中","stem":"关于逻辑结构与物理结构，下列说法正确的是（　）。","exp":"逻辑结构描述元素之间的抽象关系（如二维表格的行列关系），与具体存储无关；物理结构（存储结构）描述数据在内存中如何摆放（如按行优先的一维连续序列）。同一种逻辑结构可有多种物理实现——栈既可用数组也可用链表实现。","options":["逻辑结构和物理结构是同一个概念","逻辑结构是数据元素之间的抽象关系，物理结构是数据在内存中的实际存放方式","逻辑结构由内存地址的分配方式决定","同一种逻辑结构只能有一种物理实现"],"answer":[1],"meta":{"origin":{"id":"d-60","no":366,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-097","type":"multi","topic":"4.4 栈与队列","diff":"中","stem":"关于栈，下列说法正确的有（　）。","exp":"四项均正确。栈是受限线性表，只允许在同一端（栈顶）插入和删除，故后进先出；基本操作有建栈、入栈（push/压栈）、出栈（pop/弹栈）；数组实现用栈顶下标，链表实现用指向栈顶的指针。","options":["插入和删除只能在栈顶一端进行","特点是后进先出（LIFO）","既可以用数组实现，也可以用链表实现","入栈称 push，出栈称 pop"],"answer":[0,1,2,3],"meta":{"origin":{"id":"d-61","no":367,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-098","type":"fill","topic":"4.4 栈与队列","diff":"易","stem":"队列只能在 ____ 插入元素，在 ____ 删除元素。（两空用空格分隔）","exp":"队列（queue）在尾部（rear）插入（enqueue），在头部（front）删除（dequeue），即“尾进头出”，因此先进先出（FIFO）。","answers":["尾部 头部","队尾 队头","尾 头","rear front"],"meta":{"origin":{"id":"d-62","no":368,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-099","type":"comp","topic":"4.4 栈与队列","diff":"中","stem":"初始为空的栈 S，依次执行 push(1)、push(2)、pop、push(3)、pop、pop。请写出每次出栈的元素，并说明最终栈的状态。","exp":"按“后进先出”逐步模拟：\n① push 1：栈底→顶 = 1\n② push 2：1, 2\n③ pop：弹出 2，剩 1\n④ push 3：1, 3\n⑤ pop：弹出 3，剩 1\n⑥ pop：弹出 1，栈空\n故出栈序列为 2, 3, 1。","ref":"出栈顺序为 2、3、1；最终栈为空。\n过程：push(1) → 栈 [1]；push(2) → [1,2]；pop → 弹出 2，栈 [1]；push(3) → [1,3]；pop → 弹出 3，栈 [1]；pop → 弹出 1，栈空。","meta":{"origin":{"id":"d-63","no":369,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-100","type":"single","topic":"4.4 栈与队列","diff":"易","stem":"队列既可以用数组实现，也可以用链表实现。","exp":"正确。数组实现时用“首位元素下标”记录队头位置；链表实现时用指针指向队头与队尾节点。两种实现都保持“尾进头出”的规则。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"d-64","no":370,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-101","type":"single","topic":"4.4 栈与队列","diff":"易","stem":"栈的插入和删除操作都只能在（　）进行。","exp":"栈是“限制线性表”，只允许在栈顶一端插入（push）和删除（pop）。正因为只开一个口，才形成后进先出（LIFO）的特性。","options":["栈底","中间位置","任意位置","栈顶"],"answer":[3],"meta":{"origin":{"id":"d-65","no":371,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-102","type":"multi","topic":"4.5 树与二叉树","diff":"中","stem":"关于树的基本概念，下列说法正确的有（　）。","exp":"四项均正确。树包含有限个节点（顶点）和有限条有向弧；根入度 0、出度 0 或更多；中间节点入度 1、出度 1 或更多；叶子节点入度 1、出度 0。","options":["树由一组节点和一组连接节点的有向弧组成","根节点没有进入的弧，入度为 0","叶子节点没有指向子节点的弧，出度为 0","除根节点外，中间节点的入度只能为 1"],"answer":[0,1,2,3],"meta":{"origin":{"id":"d-66","no":372,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-103","type":"comp","topic":"4.5 树与二叉树","diff":"难","stem":"在二叉树中，叶子节点数 n₀ 与度为 2 的节点数 n₂ 满足 n₀ = n₂ + 1。若一棵二叉树有 4 个叶子节点，则度为 2 的节点有多少个？","exp":"推导思路：设节点总数 n = n₀ + n₁ + n₂。除根外每个节点都恰有一条弧指向它，故弧数 = n − 1；又弧数 = 0×n₀ + 1×n₁ + 2×n₂。\n于是 n₀+n₁+n₂−1 = n₁+2n₂ → n₀ = n₂ + 1。\n本题 n₂ = 4 − 1 = 3。","ref":"3 个。\n由 n₀ = n₂ + 1 得 n₂ = n₀ − 1 = 4 − 1 = 3。\n验证：3 个度为 2 的节点共发出 6 条弧，其中 2 条指向度为 2 的节点、4 条指向叶子，弧数与节点数关系自洽。","meta":{"origin":{"id":"d-67","no":373,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-104","type":"fill","topic":"4.5 树与二叉树","diff":"易","stem":"二叉树中任一节点所含子树的个数不超过 ____ 个，分别称为左子树和右子树。","exp":"二叉树的定义：每个节点至多有两棵子树，且左右子树有次序之分，不能随意互换。递归定义：二叉树是空树，或由一个根节点和两棵互不相交的、分别称为左子树和右子树的二叉树组成。","answers":["2","两","二","2个"],"meta":{"origin":{"id":"d-68","no":374,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-105","type":"single","topic":"4.5 树与二叉树","diff":"难","stem":"只有一个节点的树，其根节点的出度为 0。","exp":"正确。根节点的出度是“0 或更多”：通常根有子树，出度 ≥1；但当树只有一个节点时，它既是根又是叶子，出度为 0、入度为 0。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"d-69","no":375,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-106","type":"multi","topic":"4.6 图","diff":"中","stem":"关于图，下列说法正确的有（　）。","exp":"四项均正确。顶点是图中的数据元素，边表示顶点之间的逻辑关系；带权的边可表示距离、成本；邻接矩阵为 N×N，把边的权重存入元素，0 表示不邻接。","options":["图由一组顶点和顶点之间的边构成","边可以带权重，表示距离、成本等","任意两个顶点之间的边都没有方向的图称为无向图","用邻接矩阵存储 N 个顶点的图时，0 表示两个顶点不邻接"],"answer":[0,1,2,3],"meta":{"origin":{"id":"d-70","no":376,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-107","type":"comp","topic":"4.6 图","diff":"中","stem":"用邻接矩阵存储一个有 100 个顶点的图，每个矩阵元素占 1 个字节。该矩阵共占多少字节？约合多少 KB？","exp":"邻接矩阵大小恒为 N×N，与边数多少无关：\n100 × 100 = 10000 个元素 → 10000 B ≈ 9.77KB。\n这解释了邻接矩阵“空间开销固定”的特点：图很稀疏（边很少）时仍要占满 N² 个位置，浪费严重；因此稀疏图更适合用邻接表。","ref":"10000 字节，约 9.77KB。\n矩阵元素个数 = 100×100 = 10000；每个元素 1 字节 → 10000 B；\n10000 ÷ 1024 ≈ 9.77KB。","meta":{"origin":{"id":"d-71","no":377,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-108","type":"single","topic":"4.6 图","diff":"易","stem":"图中的边所带的权重，通常用来表示（　）。","exp":"边可以带权重（weight），用来表示两点之间的距离、运输成本、时间等实际含义；无权图只关心“是否相邻”，带权图则进一步刻画“相邻的代价”。","options":["顶点之间的距离、成本等代价","顶点的编号","图中顶点的个数","邻接矩阵的行数"],"answer":[0],"meta":{"origin":{"id":"d-72","no":378,"mod":"数据结构","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-109","type":"fill","topic":"4.7 算法概念与表示","diff":"易","stem":"算法的五个特性是有穷性、确定性、可行性、输入和 ____。","exp":"五特性：有穷性（有限步骤后终止）、确定性（每步定义明确无歧义）、可行性（每步都能执行）、输入（零个或多个）、输出（一个或多个）。","answers":["输出"],"meta":{"origin":{"id":"a-37","no":379,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-110","type":"comp","topic":"4.7 算法概念与表示","diff":"中","stem":"用流程图表示“输出 1～100 内所有 7 的倍数”的算法。请写出这些数共有多少个，并指出最后一个数。","exp":"算法思路：i ← 1，当 i ≤ 100 时，若 i 能被 7 整除则输出 i，然后 i ← i+1。\n计数：⌊100/7⌋ = 14 个，即 7 到 98。\n该算法没有输入，但有一个（多个）输出，正好说明“输入可以为零个”。","ref":"共 14 个，最后一个是 98。\n7 的倍数依次为 7、14、21、…、98；\n个数 = ⌊100 ÷ 7⌋ = 14，最大者 = 7 × 14 = 98。","meta":{"origin":{"id":"a-38","no":380,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-111","type":"single","topic":"4.7 算法概念与表示","diff":"中","stem":"关于算法与程序的关系，下列说法正确的是（　）。","exp":"算法是“明确的、可执行的、有限步骤的问题求解过程”，可以脱离计算机存在（如菜谱、手工计算步骤）；程序是算法在某种程序设计语言中的具体实现，受语法、数据类型等约束。同一个算法可以有多种程序实现。","options":["算法必须用某一种高级语言书写","算法就是程序，二者完全等同","程序一定比算法更简洁","算法独立于计算机系统，程序是算法在某种语言中的具体实现"],"answer":[3],"meta":{"origin":{"id":"a-39","no":381,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-112","type":"single","topic":"4.7 算法概念与表示","diff":"易","stem":"同一个算法可以用自然语言、流程图、伪代码等不同方式描述。","exp":"正确。自然语言通俗但易生歧义；流程图用图形符号直观展示控制流程；伪代码介于两者之间，用 if/then/else/while 等关键字突出逻辑结构。三者描述的是同一个算法的不同“表示”。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"a-40","no":382,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-113","type":"short","topic":"4.7 算法概念与表示","diff":"中","stem":"用伪代码写出求数组 A 中 n 个元素之和的算法，并指出其中用到了哪些基本结构。","exp":"要点：累加器初值为 0（求积则初值为 1）；用循环变量 i 从 1 走到 n；循环体做“累加 + 推进”。这是数组遍历的典型写法，与求平均值只差最后一步除法。","ref":"Sum(A, n)\n输入：数组 A 和元素个数 n\n输出：所有元素之和\n{\n    sum ← 0\n    i ← 1\n    while (i ≤ n)\n    {\n        sum ← sum + A[i]\n        i ← i + 1\n    }\n    return sum\n}\n用到了顺序结构（初始化、返回）、循环结构（while 遍历）；若加入“n 是否为 0”的判断，还会用到选择结构。","meta":{"origin":{"id":"a-41","no":383,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-114","type":"multi","topic":"4.8 排序","diff":"中","stem":"关于三种基本排序算法，下列说法正确的有（　）。","exp":"四项均正确。三者都是双重循环：选择排序内层“找最小值”、冒泡排序内层“两两比较交换”、插入排序内层“寻找插入位置”；外层循环都控制“轮次”。","options":["选择排序每轮选出最小（或最大）元素，放到待排序区间的起始位置","冒泡排序每次比较相邻两个元素，顺序错误就交换","插入排序把待插入元素放入已排序部分的合适位置","三者都用外层循环控制轮次、内层循环完成一轮的具体工作"],"answer":[0,1,2,3],"meta":{"origin":{"id":"a-42","no":384,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-115","type":"fill","topic":"4.8 排序","diff":"中","stem":"对 6 个元素进行选择排序，共需要进行 ____ 轮选择。","exp":"选择排序每轮确定一个元素的最终位置，n 个元素只需 n−1 轮（最后一轮剩下的元素自然就位）。\n6 个元素 → 5 轮。","answers":["5","5轮"],"meta":{"origin":{"id":"a-43","no":385,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-116","type":"short","topic":"4.8 排序","diff":"中","stem":"分别说明选择排序、冒泡排序、插入排序的基本思想，并指出三者共同的双重循环结构。","exp":"要点：三种排序都靠“比较 + 移动（交换）”完成，都是双重循环，时间复杂度均为 O(n²)；差别在于“每轮做什么”。","ref":"选择排序：每一轮从待排序元素中选出最小（或最大）的一个，与区间起始位置交换，然后缩小待排序区间，直到全部排完。\n冒泡排序：重复遍历数列，一次比较两个相邻元素，顺序错误就交换；每轮结束会有一个元素“浮”到它最终的位置，直到某轮没有发生交换为止。\n插入排序：把数组分为已排序部分与待插入元素，每次取出一个元素插入到有序部分的合适位置，使有序部分长度加 1。\n共同结构：外层循环控制轮次，内层循环完成一轮的具体工作（找最小值 / 两两比较 / 找插入位置）。","meta":{"origin":{"id":"a-44","no":386,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-117","type":"single","topic":"4.8 排序","diff":"中","stem":"冒泡排序每完成一轮，就会有一个元素“浮”到它最终应在的位置上。","exp":"正确。每轮遍历结束时，当前区间内最大（或最小）的元素被推到区间一端，位置即已确定，下一轮无需再比较它。因此 n 个元素最多 n−1 轮即可完成；若某轮没有发生交换，说明已有序，可提前结束。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"a-45","no":387,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-118","type":"fill","topic":"4.8 排序","diff":"中","stem":"对 5 个元素进行插入排序，共需要把 ____ 个元素插入到已排序部分。","exp":"插入排序把第一个元素视为已排序，其余元素逐个插入，因此 n 个元素需插入 n−1 个。\n5 个元素 → 4 次插入（第一次插入第 2 个元素）。","answers":["4"],"meta":{"origin":{"id":"a-46","no":388,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-119","type":"multi","topic":"4.9 查找","diff":"中","stem":"关于顺序查找与折半查找，下列说法正确的有（　）。","exp":"四项均正确。顺序查找逐个比较，找到目标或确信不存在时结束，适用面广但平均比较次数多（约 n/2）；折半查找必须先有序，每次用中间元素比较并排除一半区间，效率高但依赖有序性。","options":["顺序查找对数据是否有序没有要求","折半查找要求数据必须有序","折半查找每比较一次就排除约一半元素","数据无序时不能直接使用折半查找"],"answer":[0,1,2,3],"meta":{"origin":{"id":"a-47","no":389,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-120","type":"short","topic":"4.9 查找","diff":"中","stem":"说明折半查找的过程与适用条件，并解释它为什么比顺序查找快。","exp":"要点：① 中间元素比较、三选一缩半；② 前提是“有序”；③ 效率对比 n/2 与 log₂n。","ref":"过程：在有序数组中，先取中间元素与目标比较；若相等则查找成功；若目标较小，则只在前半部分继续；若目标较大，则只在后半部分继续；重复上述过程，直到找到或区间为空。\n适用条件：数据必须有序（且通常是顺序存储的数组，能按下标随机访问）。\n更快的原因：每比较一次就把待查区间缩小约一半，比较次数约为 log₂n 量级；而顺序查找逐个比较，平均需 n/2 次。n 越大差距越明显。","meta":{"origin":{"id":"a-48","no":390,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-121","type":"comp","topic":"4.9 查找","diff":"难","stem":"在 1000 个有序元素中用折半查找，最多需要比较多少次？","exp":"每次比较把区间缩小一半，k 次比较最多可覆盖 2ᵏ 个元素。\n要求 2ᵏ ≥ 1000：2⁹ = 512 不够，2¹⁰ = 1024 够，故最多 10 次。\n对比：顺序查找最坏要 1000 次。","ref":"10 次。\n折半查找最多比较次数 = ⌈log₂n⌉；2⁹ = 512 < 1000 ≤ 1024 = 2¹⁰，故为 10 次。","meta":{"origin":{"id":"a-49","no":391,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-122","type":"fill","topic":"4.9 查找","diff":"中","stem":"折半查找每比较一次，待查区间就缩小约 ____。","exp":"折半查找把目标与中间元素比较后，只保留左半区或右半区，区间长度约减半，因此 k 次比较后可覆盖 2ᵏ 个元素，效率为 O(log n)。","answers":["一半","1/2","二分之一","50%"],"meta":{"origin":{"id":"a-50","no":392,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-123","type":"multi","topic":"4.10 迭代与递归","diff":"中","stem":"关于迭代与递归，下列说法正确的有（　）。","exp":"四项均正确。迭代靠循环变量推进，额外空间为常数级；递归把问题分解为同类的更小问题，必须同时具备“递归关系”和“终止条件”，每层调用占用栈空间，过深会溢出。","options":["迭代通过循环结构重复执行一段代码，每次循环都更接近结果","递归是算法直接或间接调用自身","递归必须有终止条件","递归层数过深可能造成栈溢出"],"answer":[0,1,2,3],"meta":{"origin":{"id":"a-51","no":393,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-124","type":"single","topic":"4.10 迭代与递归","diff":"中","stem":"同一个问题既可以用迭代解决，也可以用递归解决，二者可以相互转换。","exp":"正确。以阶乘为例：迭代用 while 循环累乘，递归用 n! = n×(n−1)! 加终止条件 0!=1。理论上递归都可用“显式栈 + 循环”改写为迭代，反之亦然；实际选择取决于可读性、效率与栈深度的权衡。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"a-52","no":394,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-125","type":"comp","topic":"4.10 迭代与递归","diff":"中","stem":"用迭代方式计算 5!，请写出累乘过程中 Fact 的变化，并说明循环执行了多少次。","exp":"逐轮计算：\n初始 Fact = 1，i = 1；\n① i=1：Fact = 1×1 = 1\n② i=2：Fact = 1×2 = 2\n③ i=3：Fact = 2×3 = 6\n④ i=4：Fact = 6×4 = 24\n⑤ i=5：Fact = 24×5 = 120\n循环共 5 次，结果为 120。注意累乘的初值必须是 1，若为 0 则结果永远为 0。","ref":"Fact 变化：1 → 1 → 2 → 6 → 24 → 120；循环执行 5 次。\n伪代码：Fact ← 1；i ← 1；while (i ≤ 5) { Fact ← Fact × i；i ← i + 1 }","meta":{"origin":{"id":"a-53","no":395,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"},{"qid":"cs.u4-126","type":"single","topic":"4.10 迭代与递归","diff":"中","stem":"递归调用过程中，系统通常用（　）保存每一层的返回地址和局部变量。","exp":"递归调用遵循“后进先出”：最后进入的那一层最先返回，因此系统用栈（调用栈）保存每层的返回地址、参数与局部变量。这也解释了“递归层数过深会栈溢出”的原因——栈空间被耗尽。","options":["队列","栈","数组","链表"],"answer":[1],"meta":{"origin":{"id":"a-54","no":396,"mod":"算法","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u4"}]}],"wrong":{"exitStreak":1},"mastery":{"wAll":0.4,"wRecent":0.6,"recentN":5,"weakBelow":60,"solidAt":85,"solidStreak":4,"passMinQ":4,"passRate":0.9,"dueDays":[1,3,7]},"codec":{"version":10,"gidBits":32,"budgetBytes":6000},"order":["g7b36b9f9","geb76ff8a","g5604cb4e","gbbf40dfe","g53d3c631","gc8006e41","gdde89a21","gffcece9c","gbf4af0af","gf58d538b","g986a45cb","g16fafab6","g390c53cf","gd341e104","g5caa97bb","g63505a11","g262242e2","g53357d53","g15895c5a","gb37205e6","ga8ff66f5","gf78a1598","g2312f909","gd84ac421","g531e9c29","g11a301b7","g9182d1cb","g5ac960f1","g879fc5c7","g7d406c09","ge31b0414","ga0a1269f","gd6d7ba22","g96ce59ac","g1d239cea","g40f44857","g039b0e40","g2f3b78a4","g01c4cc52","g8a075482","g60a43282","gc2a5be02","g429eefc9","g9336931d","g1ca6d6e6","g3929ecd5","g6973d129","g3abb4969","ge0a933a7","gb120c052","g7d8fc4da","g1b380426","g97d8       if (patch.p && patch.p.length) base.p = patch.p.slice().sort(function (a, b) { return a - b; });

    if (prev.p) out.p = prev.p.slice();

  Site.prototype._encodeWith = function (kind, key, textStep) {

      }

    if (typeof localStorage === 'undefined' || !localStorage.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    var wrong = store.get('wrong', {});

    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    return { kind: got.kind, key: got.key, count: touched, v: got.v || 10 };
  };

  Site.prototype.undoImport = function () {
    var bak = this.store.get('bak', null);
    if (!bak) return false;
    this.store.set('ans', bak.data.ans || {});
    this.store.set('wrong', bak.data.wrong || {});
    this.store.set('fav', bak.data.fav || {});
    return true;
  };

  /* ---- 统计（三级口径，分母一律 gid 去重） ---- */

  Site.prototype.stats = function (unitKey) {
    var self = this;
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var gids = unitKey ? this.scopeGids('unit', unitKey) : this.order.slice();
    var seen = {}, total = 0, answered = 0, correct = 0, wrongN = 0, favN = 0;
    gids.forEach(function (g) {
      if (seen[g]) return;
      seen[g] = 1;
      total++;
      var r = ans[g];
      if (r) {
        answered++;
        if (r.ok === true) correct++;
      }
      if (wrong[g]) wrongN++;
      if (fav[g]) favN++;
    });
    return {
      total: total, answered: answered, correct: correct,
      rate: answered ? Math.round(100 * correct / answered) : null,
      wrong: wrongN, fav: favN
    };
  };

  var QB = {
    fpNorm: fpNorm, fpHash: fpHash, fingerprint: fingerprint,
    norm: norm, judge: judge, fuzzyEq: fuzzyEq, cleanText: cleanText,
    maskWidth: maskWidth, mergeRecord: mergeRecord,
    Store: Store, Site: Site,
    create: function (def, store) { return new Site(def, store); }

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>计算机导论 · 第六单元 数据库技术</title>
<style>/* qb-page.css — 题库页面样式（内核共用，不含任何科目特有内容） */
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e4e8ef; --line2:#eef1f6;
  --text:#1e2330; --muted:#5b6373; --muted2:#6b7383;
  --accent:#2f6fed; --accent-ink:#2557c7; --accent-soft:#eaf1ff;
  --ok:#0b6b48; --ok-soft:#e7f7ef; --ok-line:#b7e6cf;
  --bad:#b42318; --bad-soft:#fdecea; --bad-line:#f6c9c4;
  --warn:#b54708; --warn-soft:#fef3e2;
  --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 72px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:14px}
.top h1{font-size:21px;margin:0;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.top .spacer{flex:1}
.home{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:6px 12px;background:#fff}
.home:hover{color:var(--accent);border-color:#c7dbff;text-decoration:none}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.block{padding:14px 16px;margin-bottom:14px}

/* stats */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;margin-bottom:14px}
.stat-k{font-size:12px;color:var(--muted2);letter-spacing:.3px}
.stat-v{font-size:19px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-bar{height:4px;border-radius:3px;background:#eef1f6;margin-top:7px;overflow:hidden}
.stat-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl+.ctl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.seg{display:inline-flex;background:#f1f4fa;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;color:#48505f}
.seg button:hover{color:var(--accent)}
.seg button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
select,input[type=search]{
  font:inherit;font-size:13.5px;color:var(--text);border:1px solid var(--line);background:#fff;
  border-radius:9px;padding:7px 10px;outline:none
}
select:focus,input[type=search]:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=search]{min-width:170px;flex:1}
.btn{
  border:1px solid var(--line);background:#fff;color:#3c4353;border-radius:9px;padding:7px 14px;
  font:inherit;font-size:13.5px;cursor:pointer;transition:.15s
}
.btn:hover:not(:disabled){border-color:#c7dbff;color:var(--accent);background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2557c7;border-color:#2557c7;color:#fff}
.btn.ghost{background:#fff}
.btn.ghost.on{color:#b54708;border-color:#f5dcb4;background:var(--warn-soft)}
.btn.small{padding:5px 11px;font-size:13px}

/* card */
#card{padding:18px 18px 16px;margin-bottom:14px}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fafbfd;white-space:nowrap}
.tag-type{color:var(--accent-ink);border-color:#c7dbff;background:var(--accent-soft)}
.tag-diff.d-0{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.tag-diff.d-1{color:var(--warn);border-color:#f5dcb4;background:var(--warn-soft)}
.tag-diff.d-2{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.q-topic{font-size:12.5px;color:var(--muted2)}
.q-no{margin-left:auto;font-size:12.5px;color:var(--muted2);font-variant-numeric:tabular-nums}
.q-stem{font-size:16.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.q-img{max-width:100%;margin-top:10px;border-radius:8px;border:1px solid var(--line)}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;
  font:inherit;font-size:15px;line-height:1.6;cursor:pointer;transition:.13s;color:var(--text)
}
.opt:hover:not(:disabled){border-color:#c7dbff;background:#fafcff}
.opt:disabled{cursor:default}
.opt-k{
  flex:0 0 24px;height:24px;border-radius:7px;background:#f1f4fa;color:#48505f;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600
}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .opt-k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.right .opt-k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .opt-k{background:var(--bad);color:#fff}

/* inputs */
.in,.ta{
  width:100%;margin-top:14px;font:inherit;font-size:15px;color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;background:#fff;resize:vertical
}
.in:focus,.ta:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
.in:disabled,.ta:disabled{background:#fafbfd;color:var(--muted)}

/* action bar */
.q-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hint{font-size:12.5px;color:var(--muted2)}
.verdict{font-size:14px;font-weight:650;padding:5px 12px;border-radius:999px}
.verdict.ok{color:var(--ok);background:var(--ok-soft)}
.verdict.bad{color:var(--bad);background:var(--bad-soft)}
.verdict.mid{color:var(--warn);background:var(--warn-soft)}

/* explanation */
.exp{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.exp-h{font-size:12.5px;color:var(--muted2);letter-spacing:.4px;margin-bottom:7px}
.exp-a{font-size:14.5px;margin:0 0 8px;padding:10px 12px;background:#f7f9fd;border-radius:9px;border:1px solid var(--line2)}
.exp-p{font-size:14.5px;color:#333a49;margin:0 0 6px;white-space:pre-wrap}
.exp-src{font-size:12px;color:var(--muted2);margin:6px 0 0}
.self{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}

/* nav */
#nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav-mid{flex:1;text-align:center;font-size:13px;color:var(--muted2);font-variant-numeric:tabular-nums}

/* mastery */
#mastery{padding:14px 16px;margin-bottom:14px}
.mt{width:100%;border-collapse:collapse;font-size:13.5px}
.mt th{text-align:left;font-weight:600;color:var(--muted2);font-size:12px;letter-spacing:.3px;padding:0 0 8px;border-bottom:1px solid var(--line2)}
.mt td{padding:7px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
.mt tr:last-child td{border-bottom:0}
.mt-t{color:#333a49}
.mt-s{font-variant-numeric:tabular-nums;font-weight:650;width:56px}
.mt-n{color:var(--muted2);width:56px;text-align:right}
.lv{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.lv-ok{color:var(--ok);background:var(--ok-soft)}
.lv-mid{color:var(--warn);background:var(--warn-soft)}
.lv-bad{color:var(--bad);background:var(--bad-soft)}

/* transfer */
#transfer{padding:14px 16px;margin-bottom:14px}
#x-code{width:100%;min-height:86px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:10px;resize:vertical;background:#fafbfd;color:#333a49}
#x-info{font-size:12.5px;color:var(--muted2);margin-top:8px;min-height:18px}
.x-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* misc */
.empty{padding:34px 8px;text-align:center}
.empty-t{font-size:15.5px;font-weight:600}
.empty-s{color:var(--muted2);font-size:13.5px;margin:6px 0 0}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:#1e2330;color:#fff;font-size:13.5px;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--muted2);font-size:12px;text-align:center;margin-top:18px;line-height:1.8}

@media (max-width:640px){
  .wrap{padding:14px 12px 64px}
  #stats{grid-template-columns:repeat(2,1fr)}
  .top h1{font-size:18.5px}
  .q-stem{font-size:16px}
  .opt{font-size:14.5px}
  input[type=search]{min-width:100%}
}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;
}
mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */
.q-stem mjx-container[display="true"],
.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;
}
mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */
.q-stem mjx-container[display="true"],
.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>

  <div class="panel" id="stats"></div>

  <div class="panel block">

        <button data-mode="fav">收藏</button>

  <div class="panel" id="card"></div>
  <div id="nav"></div>

  <details class="panel block">
    <summary style="cursor:pointer;font-size:14px;font-weight:600">掌握度（按知识点）</summary>
    <div id="mastery" style="padding-top:10px"></div>
  </details>

  <details class="panel block" id="cloud-wrap" style="display:none">

        <button class="btn" id="s-save">保存</button>
        <button class="btn primary" id="s-up">上传</button>
        <button class="btn" id="s-down">下载</button>
      </div>
      <div id="s-info" class="hint" style="margin-top:8px;min-height:18px"></div>
    </div>
  </details>

  <details class="panel block">
    <summary style="cursor:pointer;font-size:14px;font-weight:600">导出 / 导入进度码</summary>
    <div id="transfer" style="padding-top:10px">
      <div class="x-row">
        <select id="x-scope"></select>
        <button class="btn" id="x-do">生成</button>
        <button class="btn" id="x-copy">复制</button>
        <button class="btn" id="x-import">导入</button>
        <button class="btn" id="x-undo">撤销导入</button>
        <button class="btn ghost" id="reset" style="margin-left:auto">清空本机记录</button>
      </div>
      <textarea id="x-code" placeholder="在此粘贴他人分享的进度码，或点「生成」得到自己的"></textarea>
      <div id="x-info"></div>
    </div>
  </details>

  <div class="foot">

  </div>
</div>

程序相互独立。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-003","type":"multi","topic":"6.1 数据库的定义与特点","diff":"中","stem":"数据库的特点有（　）。","options":["数据按一定的数据模型组织、描述和存储","较低的数据冗余度","较高的数据独立性","数据只能被单个用户使用"],"answer":[0,1,2],"exp":"前三项是数据库的特点。数据库的重要特点之一正是「可以为多个用户共享」，「只能被单个用户使用」恰好说反了。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-004","type":"fill","topic":"6.1 数据库的定义与特点","diff":"易","stem":"长期存储在计算机内的、有组织的、可共享的、统一管理的相关数据的集合称为 ____。","answers":["数据库","DB","database"],"exp":"这就是数据库的定义。注意它与「数据库系统」的区别：数据库系统 = 数据库 + 数据库管理系统 + 应用程序 + 数据库管理员 + 用户。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-005","type":"single","topic":"6.1 数据库的定义与特点","diff":"中","stem":"用文件系统管理数据时，最主要的问题是（　）。","options":["数据必须以二进制形式存放","文件无法保存在磁盘上","不能对数据进行排序","数据冗余大，同一数据多处存放，容易产生不一致"],"answer":[3],"exp":"文件系统下各部门各自建文件，学生姓名、专业等信息在教务处、宿管科、财务处各存一份：既浪费空间，又会在某处修改后造成数据不一致，且难以保证「一处变、处处变」。数据库正是为集中统一管理而出现的。","meta":{"source":"第 6 章课件（6-数据库技术.pptx）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-006","type":"short","topic":"6.1 数据库的定义与特点","diff":"中","stem":"与文件系统相比，数据库管理数据有哪些优点？","ref":"①数据集中统一管理，按统一的数据模型组织，减少重复存放，降低数据冗余；②冗余降低后，同一数据只有一处，修改一次即可全局生效，避免了数据不一致；③数据具有较高的独立性，数据的逻辑结构改变时应用程序不必随之大改；④数据可为多个用户、多个应用共享，并支持并发访问与权限控制；⑤由数据库管理系统提供完整性、安全性控制与故障恢复能力。","exp":"采分点：低冗余、一致性、数据独立性、可共享、统一控制（安全与恢复）五项中答出四项即可。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-007","type":"single","topic":"6.1 数据库的定义与特点","diff":"易","stem":"数据独立性是指（　）。","options":["数据的逻辑结构与应用程序相互独立，一方改变尽量不影响另一方","数据与磁盘物理位置完全无关","数据可以独立于数据库存在","每个用户都可以独立定义自己的数据"],"answer":[0],"exp":"数据独立性分两级：逻辑独立性指数据库的逻辑结构改变时应用程序不变；物理独立性指存储结构改变时逻辑结构不变。它的价值在于降低维护成本——改数据结构不必重写全部程序。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-008","type":"single","topic":"6.1 数据库的定义与特点","diff":"易","stem":"数据库管理系统（DBMS）是（　）。","options":["存放数据的磁盘阵列","一种应用软件","位于用户与操作系统之间、用于管理数据库的系统软件","数据库中的一张表"],"answer":[2],"exp":"DBMS 是系统软件，位于用户与操作系统之间，负责数据的定义、操纵、控制与维护。SQL Server、MySQL、Oracle、Access 都是 DBMS 产品；用它开发的学生管理系统才是应用软件。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-009","type":"comp","topic":"6.1 数据库的定义与特点","diff":"中","stem":"某校教务处、宿管科、班主任、财务处各自维护一份学生名单，都记录了学号、姓名、性别、专业，此外还分别记录成绩、宿舍号、排名与学分、学费。分析这种做法的弊端，并说明改用数据库后如何解决。","ref":"弊端：①数据大量重复——学号、姓名、性别、专业在四份名单里各存一遍，冗余度高；②数据不一致——某学生转专业后只在教务处修改，其余三处仍是旧专业，同一事实出现矛盾；③更新异常——新生入学要在四处分别录入，漏一处就出错；④无法统一约束——学号在四份表中可能重复或格式不一。\n改用数据库：建立以学号为主码的学生表，集中存放学号、姓名、性别、专业等公共属性；成绩、宿舍、学费等分别建表，通过学号关联。于是公共数据只存一处，修改一次全局生效，冗余与不一致同时消除，并可由 DBMS 统一做完整性、安全性与并发控制。","exp":"采分点：①指出冗余；②指出不一致与更新异常；③给出「公共属性集中 + 按主码关联」的解决方案。只写「数据库更好」不得分。","meta":{"source":"第 6 章课件（6-数据库技术.pptx）"},"_unit":"u6"},{"qid":"cs.u6-010","type":"single","topic":"6.2 数据模型","diff":"易","stem":"常见的数据模型包括（　）。","options":["线性模型、树形模型、图形模型","层次模型、网状模型、关系模型","概念模型、逻辑模型、物理模型","顺序模型、索引模型、散列模型"],"answer":[1],"exp":"数据模型定义数据的逻辑设计并描述数据之间的联系，常见三种：层次模型（树形）、网状模型（图）、关系模型（二维表）。概念/逻辑/物理是数据库设计的三个层次，不是数据模型的分类。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-011","type":"single","topic":"6.2 数据模型","diff":"中","stem":"层次模型用（　）来表示实体及其之间的联系。","options":["线性表","二维表","网状图","树形结构"],"answer":[3],"exp":"层次模型用树形结构：每个节点代表一个实体型，节点间的有向边表示联系；除根节点外每个节点仅有一个父节点，父子之间是一对多联系。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-012","type":"single","topic":"6.2 数据模型","diff":"易","stem":"支持层次模型的典型数据库系统是（　）。","options":["IBM 公司的 IMS","CODASYL","System R","MySQL"],"answer":[0],"exp":"层次模型的典型系统是诞生于 1970 年左右的 IBM 公司 IMS（Information Management System）。CODASYL 是网状模型的代表，System R 是 IBM 研制的关系数据库代表，MySQL 是现代关系数据库产品。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-013","type":"single","topic":"6.2 数据模型","diff":"中","stem":"网状模型是层次模型的拓展，其特点是（　）。","options":["只能有一个根节点且不能有回路","必须严格保持一对多联系","节点之间的联系不受层次限制，节点之间可以有多个联系","用二维表表示实体与联系"],"answer":[2],"exp":"网状模型用图（网络结构）表示实体间的联系，突破了层次模型「每个节点只有一个父节点」的限制，节点之间可以有多个联系。用二维表表示是关系模型的做法。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-014","type":"single","topic":"6.2 数据模型","diff":"易","stem":"网状数据模型的典型代表是（　）。","options":["IMS","CODASYL","System R","SQL Server"],"answer":[1],"exp":"CODASYL（Conference On DAta SYstem Languages）是网状模型的典型代表。IMS 属层次模型，System R 与 SQL Server 属关系模型。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-015","type":"single","topic":"6.2 数据模型","diff":"易","stem":"关系模型用（　）来表示实体及实体之间的联系。","options":["链表结构","树形结构","网状结构","二维表格结构"],"answer":[3],"exp":"关系模型的逻辑结构就是一张二维表，由行和列组成；每个二维表称为一个关系，因此关系模型是「关系框架」组成的集合。它是目前使用最广泛的数据模型。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-016","type":"single","topic":"6.2 数据模型","diff":"中","stem":"下列不属于关系模型优点的是（　）。","options":["存取数据时必须说明索引与路径","非过程化的数据请求，不必指明存取路径","有坚实的理论基础——关系代数","表的概念直观、单一，用户易理解"],"answer":[0],"exp":"关系模型的优点恰恰在于「非过程化」：用户只说明要什么，不必指明怎么取。需要说明存取路径的是早期的层次与网状模型。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-017","type":"multi","topic":"6.2 数据模型","diff":"中","stem":"关系模型的优点有（　）。","options":["天然适合表示多对多的网状联系","结构简单，表的概念直观、单一","非过程化的数据请求","以关系代数作为理论基础"],"answer":[1,2,3],"exp":"关系模型的三大优点是简单直观、非过程化、有坚实的数学基础。多对多联系在关系模型中要靠「联系表」间接表达，谈不上天然适合，这反而是网状模型的强项。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-018","type":"fill","topic":"6.2 数据模型","diff":"中","stem":"用树形结构表示实体及其之间联系的模型称为 ____ 模型。","answers":["层次"],"exp":"层次模型的特点是严密的层次关系：除根节点外每个节点仅有一个父节点，节点之间是单线联系，父子之间为一对多。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-019","type":"short","topic":"6.2 数据模型","diff":"中","stem":"比较层次模型、网状模型与关系模型。","ref":"①层次模型：用树形结构表示实体与联系，除根节点外每个节点仅有一个父节点，父子之间为一对多；结构简单、查询效率高，但难以表示多对多联系，典型系统是 IBM 的 IMS。②网状模型：用图表示联系，节点之间可有多个联系，是层次模型的拓展，能表示复杂联系，但结构复杂、使用不便，典型代表是 CODASYL。③关系模型：用二维表表示实体与联系，概念单一直观，数据请求非过程化，以关系代数为基础，是目前最广泛使用的模型。","exp":"采分点：三种模型的结构（树 / 图 / 二维表）、联系表达能力、优缺点、典型代表。三者对比的落点是「结构复杂度与使用难度的权衡」。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-020","type":"comp","topic":"6.2 数据模型","diff":"中","stem":"某教学数据库包含系、教研室、教师、学生四类实体：一个系有多个教研室、多名学生，一个教研室有多名教师，教师只属于一个教研室，学生只属于一个系。判断该场景最适合用哪种数据模型表示，并说明理由。","ref":"适合用层次模型。理由：四类实体恰好构成一棵树——系为根，教研室与学生为其子节点，教师为教研室的子节点；每个节点只有一个父节点（教师属于一个教研室，教研室与学生属于一个系），父子联系均为 1:n，与层次模型「除根外单父节点、父子一对多」的结构完全吻合。\n若改用关系模型，则需建四张表并在子表中加入父表的主码（教研室表加系编号、教师表加教研室编号、学生表加系编号），同样可行且更灵活，只是要多做连接。选择依据是：联系严格呈树状时层次模型最直接；一旦出现多对多或跨层联系，就应改用关系模型。","exp":"采分点：①判断为层次模型；②指出「树状、单父节点、一对多」与场景吻合；③能补充关系模型的等价做法与选择依据。只答「层次模型」不给满分。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-021","type":"single","topic":"6.2 数据模型","diff":"易","stem":"层次模型中，父子节点之间的联系是（　）。","options":["一对多联系","一对一联系","多对多联系","无联系"],"answer":[0],"exp":"层次模型规定每个节点（除根）只有一个父节点，而一个父节点可以有多个子节点，因此父子之间是一对多联系。这正是它难以表达多对多联系的根源。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-022","type":"single","topic":"6.3 关系数据库基本术语","diff":"易","stem":"关系数据库中的表，其每一列通常称为（　）。","options":["元组","记录","字段（属性）","分量"],"answer":[2],"exp":"表中的列称为字段，也叫属性；表中的行称为记录或元组；行与列交叉处的一个取值称为分量。三者是关系数据库最基本的三个术语。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-023","type":"single","topic":"6.3 关系数据库基本术语","diff":"易","stem":"关系数据库中的表，其每一行称为（　）。","options":["字段或属性","记录或元组","域","关键字"],"answer":[1],"exp":"表中的行称为记录，在关系模型中叫元组。记录是字段的集合，表是记录的集合，三者构成「表 → 记录 → 分量」的层次。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-024","type":"single","topic":"6.3 关系数据库基本术语","diff":"易","stem":"字段的取值范围称为（　）。","options":["关系模式","分量","元组","域"],"answer":[3],"exp":"域是字段的取值范围，例如「性别」字段的域是「男、女」。一列中各分量必须取自同一个域，这是关系模型的基本性质之一。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-025","type":"single","topic":"6.3 关系数据库基本术语","diff":"易","stem":"元组中某一个属性的取值称为（　）。","options":["分量","域","字段名","关系"],"answer":[0],"exp":"分量是行与列交叉处的一个具体值，如学生表中「S1」这一行、「姓名」这一列交叉处的「张建军」就是一个分量。域是取值范围，分量是具体取值。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-026","type":"single","topic":"6.3 关系数据库基本术语","diff":"易","stem":"能唯一标识一个元组的字段或字段集合称为（　）。","options":["分量","主属性","候选码（关键字）","关系模式"],"answer":[2],"exp":"候选码（关键字）能唯一确定一条记录，具有唯一性、最小性和非空三个特点。学生关系中的学号就是候选码。主属性是包含在所有候选码中的属性，与候选码本身不是一回事。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-027","type":"single","topic":"6.3 关系数据库基本术语","diff":"中","stem":"候选码应具备的三个特点是（　）。","options":["唯一性、有序性、可索引","唯一性、最小性、非空","非空、可计算、可排序","最小性、可修改、可重复"],"answer":[1],"exp":"唯一性指能唯一区分每个元组；最小性指去掉其中任一属性后就不能唯一标识；非空指取值不能为空。三者缺一不可，例如（学号，姓名）虽能唯一标识，但去掉姓名仍可标识，不满足最小性。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-028","type":"single","topic":"6.3 关系数据库基本术语","diff":"易","stem":"一个表有多个候选码时，从中选定一个作为操作依据，这个候选码称为（　）。","options":["超码","外码","主属性","主码"],"answer":[3],"exp":"主码（主关键字）是从多个候选码中选定、实际用于标识记录的那一个；其余候选码仍存在，只是不作操作依据。主属性则指包含在所有候选码中的属性。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-029","type":"single","topic":"6.3 关系数据库基本术语","diff":"易","stem":"关系模式「学生（学号，姓名，性别，年龄，院系）」所描述的是（　）。","options":["关系的「型」，即表结构","表中的一行数据","表中的某一条记录","某个字段的具体取值"],"answer":[0],"exp":"关系模式是对关系的描述，是关系模型的「型」，相当于表结构；表中具体的行才是「值」。可以理解为：关系模式是表头，关系是整张表（表头 + 表体）。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-030","type":"multi","topic":"6.3 关系数据库基本术语","diff":"中","stem":"关系数据库的基本术语包括（　）。","options":["字段（属性）","记录（元组）","进程与线程","表（关系）"],"answer":[0,1,3],"exp":"前三项都是关系数据库的基本术语（此外还有域、关键字、分量、关系模式）。进程与线程是操作系统的概念，与关系数据库的术语体系无关。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-031","type":"fill","topic":"6.3 关系数据库基本术语","diff":"易","stem":"关系数据库中的一行称为记录，在关系模型中又称为 ____。","answers":["元组","tuple"],"exp":"记录、元组、行是同一个对象的三种叫法，分别来自文件系统、关系模型与日常表格的说法。对应地，字段、属性、列也是同一个对象的三种叫法。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-032","type":"fill","topic":"6.3 关系数据库基本术语","diff":"中","stem":"某个字段的取值范围称为该字段的 ____。","answers":["域","值域"],"exp":"例如「性别」字段的域是「男、女」，「年龄」字段的域可以限定为 15～60 的整数。关系模型要求同一列的各分量取自同一个域。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-033","type":"short","topic":"6.3 关系数据库基本术语","diff":"中","stem":"说明字段、记录、域、关键字、关系模式五个术语的含义。","ref":"字段：表中的列，也叫属性，表示实体的一方面特征；记录：表中的行，也叫元组，表示一个具体实体；域：字段的取值范围，如同一列取值必须同域；关键字（候选码）：能唯一标识一个元组（记录）的字段或字段集合，具有唯一性、最小性、非空；关系模式：对关系的描述，是关系的「型」，即表结构，一般写作「关系名（属性 1，属性 2，…）」。","exp":"采分点：五个术语各一句准确表述。易错：把「关系模式」说成「一张表」——表是型与值的合体，关系模式只是型。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-034","type":"comp","topic":"6.3 关系数据库基本术语","diff":"中","stem":"已知学生表 S（学号，姓名，性别，年龄，院系），其中一行是（S1，张建军，男，20，计算机）。指出该表中的字段、记录、域、分量、候选码，并写出关系模式。","ref":"字段：学号、姓名、性别、年龄、院系（共 5 个）。\n记录：表中的每一行，如（S1，张建军，男，20，计算机）即为一条记录。\n域：「性别」的域是「男、女」，「年龄」的域可设为整数区间，学号的域为全体合法学号。\n分量：如 S1、张建军、男、20、计算机分别是该记录在各字段上的分量。\n候选码：学号（能唯一标识一个学生）。\n关系模式：学生（学号，姓名，性别，年龄，院系）。","exp":"采分点：五个术语都要落到这张具体的表上举例，不能只背定义。特别注意「关系模式」要写成「表名（字段列表）」的形式，只写「学生表」不算。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-035","type":"single","topic":"6.3 关系数据库基本术语","diff":"易","stem":"字段类型 AutoNumber（自动编号）的作用是（　）。","options":["把文本转换为数字","自动计算数值字段的合计","为每条新记录自动分配一个唯一编号","自动建立索引"],"answer":[2],"exp":"AutoNumber 为每条新增记录自动生成唯一编号，常用作主码，避免手工编号重复。它与文本、数字、货币、日期、是/否、超链接、对象等一样，是 Access 等系统提供的字段类型。","meta":{"source":"第 6 章课件（6-数据库技术.pptx）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-036","type":"multi","topic":"6.3 关系数据库基本术语","diff":"中","stem":"关于字段类型的说法正确的有（　）。","options":["备注（Memo）型用于存放较长的文本","是/否型只能取「是」或「否」两个值","货币型用于存放图像与音频","文本型可存放字母、数字与特殊字符"],"answer":[0,1,3],"exp":"文本型存字母数字特殊字符，备注型存长文本，是/否型即布尔型只取真假两值。图像、音频、视频等应由对象（OLE）型存放，货币型专用于金额。","meta":{"source":"第 6 章课件（6-数据库技术.pptx）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-037","type":"single","topic":"6.4 关系模型的性质与关键字","diff":"中","stem":"下列不属于关系模型性质的是（　）。","options":["属性值不可再分（列不可再分）","不允许存在两个完全相同的元组","元组的顺序至关重要，交换两行会改变关系的含义","列的次序可以任意交换"],"answer":[2],"exp":"关系是元组的集合，集合中元素无序，因此元组的顺序无关紧要，交换两行不改变关系意义。其余三项都是关系模型的性质：无重复元组、列不可再分、列序无关但不能重名。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-038","type":"single","topic":"6.4 关系模型的性质与关键字","diff":"中","stem":"关系中不允许存在两个完全相同的元组，原因是（　）。","options":["相同的元组会占用过多磁盘空间","每个元组代表一个实体，两个相同元组意味着同一实体被重复记录","数据库无法为相同元组建立索引","元组必须按主码排序"],"answer":[1],"exp":"关系是元组的集合，集合中不允许重复元素；语义上每个元组代表一个实体，重复即意味着同一实体被记了两遍，会造成计数与统计错误。这也正是需要关键字来唯一标识元组的原因。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-039","type":"single","topic":"6.4 关系模型的性质与关键字","diff":"中","stem":"「属性值不可再分」的含义是（　）。","options":["字段的数据类型不能改变","字段的取值不能为空","字段名不能重复","每个字段只能存放一个原子值，不能再拆成多个字段"],"answer":[3],"exp":"列不可再分，即每个分量必须是原子的。若把「地址」存成「北京市海淀区清华东路 35 号」又想按城市统计，就违反了这一性质，应拆成省、市、详细地址三列。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-040","type":"multi","topic":"6.4 关系模型的性质与关键字","diff":"中","stem":"关系模型的性质（规则）包括（　）。","options":["属性值不可再分","元组必须按主码升序排列","不允许存在两个完全相同的元组","元组的顺序无关紧要"],"answer":[0,2,3],"exp":"前三项都是关系模型的性质。关系是元组的集合，集合中元素无序，因此不存在「必须按主码升序排列」这种要求——元组的物理存储顺序与关系的含义无关。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-041","type":"fill","topic":"6.4 关系模型的性质与关键字","diff":"中","stem":"关系模型中每个属性值必须是不可再分的，这一性质称为属性的 ____。","answers":["原子性","不可再分性"],"exp":"原子性要求每个分量是单一值，不能是「集合」或「结构」。它是一范式（1NF）的核心要求，也是关系模型规范化的起点。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-042","type":"short","topic":"6.4 关系模型的性质与关键字","diff":"中","stem":"关系模型有哪些性质（规则）？","ref":"①关系中每个元组代表一个实体，不允许存在两个完全相同的元组；②元组的顺序无关紧要，可以任意交换，不改变关系意义；③每个属性值不可再分，即列不可再分；④列的次序可以任意交换，不改变关系的实际意义，但不能有重名列；⑤同一列的各分量取自同一个域，具有相同性质。","exp":"采分点：五条齐全。若只答「无重复行、列不可分」两条，说明只记住了最表面的部分。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-043","type":"single","topic":"6.4 关系模型的性质与关键字","diff":"难","stem":"某表把「联系方式」作为一个字段，取值形如「手机 138xxxx；邮箱 a@b.com」。按关系模型的性质，这属于（　）。","options":["违反属性不可再分，应拆成手机号与邮箱两列","违反元组不可重复","违反列名不能重复","符合关系模型，无需修改"],"answer":[0],"exp":"该字段的一个取值里包含两类信息，还可以再分，违反「属性值不可再分」。正确做法是拆成「手机号」「邮箱」两个字段，这样才便于按手机号检索、校验格式。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-044","type":"single","topic":"6.4 关系模型的性质与关键字","diff":"中","stem":"同一列中各分量必须具有相同性质，其原因是（　）。","options":["该列必须建有索引","该列必须是主码","该列各属性值取自同一个域","该列不能为空"],"answer":[2],"exp":"列的定义包含域，一列的所有取值都来自这个域，因此性质相同、可以比较和运算。若一列里既放年龄又放姓名，就既无法比较大小，也无法做统计。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-045","type":"comp","topic":"6.4 关系模型的性质与关键字","diff":"中","stem":"某学生表的一行记录为：（S1，张建军，男，20，北京市海淀区清华东路 35 号，13800001111）。指出它违反了哪条关系模型性质，给出修改后的表结构。","ref":"违反「属性值不可再分（列不可再分）」：地址字段的一个取值里包含了省、市、区、街道门牌多个层次，电话与地址又混在同一行记录的不同列中尚可，但地址本身可再分。\n修改后：学生（学号，姓名，性别，年龄，省，市，区，详细地址，手机号）。\n若不需要按行政区划统计，也可保留「详细地址」一个字段；是否拆分取决于是否会按该部分检索或汇总——这就是「不可再分」在实际设计中的判断依据。","exp":"采分点：①指出违反属性不可再分；②给出拆分后的字段；③说明拆分与否取决于是否按该部分查询统计。只答「地址要拆开」而不说依据，得一半分。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-046","type":"single","topic":"6.4 关系模型的性质与关键字","diff":"中","stem":"下列不属于关系数据库产品的是（　）。","options":["SQL Server","CODASYL","MySQL","Oracle"],"answer":[1],"exp":"CODASYL 是网状数据模型的典型代表，不是关系数据库产品。关系数据库的代表有 SQL Server、MySQL、Access、Oracle，1977 年 IBM 研制的 System R 是早期代表。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-047","type":"multi","topic":"6.4 关系模型的性质与关键字","diff":"中","stem":"属于关系数据库产品的有（　）。","options":["IMS","SQL Server","MySQL","Oracle"],"answer":[1,2,3],"exp":"前三项都是关系数据库产品。IMS 是 IBM 的层次模型数据库系统，属于层次数据库，不是关系数据库。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-048","type":"single","topic":"6.4 关系模型的性质与关键字","diff":"中","stem":"提出关系数据理论、并因此获得 1981 年 ACM 图灵奖的是（　）。","options":["Donald Knuth","Linus Torvalds","Dennis Ritchie","E. F. Codd"],"answer":[3],"exp":"美国 IBM 公司的研究员 E. F. Codd 于 20 世纪 70 年代初提出关系数据理论，奠定了关系数据库的理论基础，并获 1981 年 ACM 图灵奖。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-049","type":"single","topic":"6.5 关系操作与 SQL","diff":"易","stem":"关系操作包括（　）。","options":["插入、删除、更新、选择、投影、连接、并、交、差","编译、链接、加载、执行","排序、查找、递归、迭代","编码、解码、压缩、加密"],"answer":[0],"exp":"关系操作分两类：数据更新（插入、删除、更新）与数据查询（选择、投影、连接、并、交、差）。其中选择、投影、并、交、差是关系代数的基本运算。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-050","type":"single","topic":"6.5 关系操作与 SQL","diff":"中","stem":"选择（Select）运算是从（　）的角度对关系进行的操作。","options":["表","列","行","库"],"answer":[2],"exp":"选择是从行的角度：按给定条件挑出满足条件的记录，结果的行数变少、列数不变。投影才是从列的角度。两者常被混淆，记住「选行投列」即可。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-051","type":"single","topic":"6.5 关系操作与 SQL","diff":"中","stem":"投影（Project）运算是从（　）的角度对关系进行的操作。","options":["行","列","记录","元组"],"answer":[1],"exp":"投影从列的角度选出若干指定字段的值，结果通常比原关系列数少，或列的排列顺序不同。投影后要去掉重复行，因为关系是元组的集合。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-052","type":"single","topic":"6.5 关系操作与 SQL","diff":"易","stem":"SQL 的中文全称是（　）。","options":["共享队列语言","标准数据语言","系统查询逻辑","结构化查询语言"],"answer":[3],"exp":"SQL = Structured Query Language，结构化查询语言，是用于关系数据库的标准化语言。它既是查询语言，也是数据库查询和程序设计语言。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-053","type":"single","topic":"6.5 关系操作与 SQL","diff":"中","stem":"SQL 最突出的特点是（　）。","options":["非过程化，只需说明「做什么」，不必说明「怎么做」","必须逐条指明存取路径","只能嵌入高级语言使用","区分大小写且语法复杂"],"answer":[0],"exp":"SQL 是描述性语言：用户声明所需信息，由 DBMS 决定如何执行。它语言简洁、语法接近英语口语，既可独立使用，也可嵌入高级语言，且关键字通常不区分大小写。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-054","type":"single","topic":"6.5 关系操作与 SQL","diff":"中","stem":"向表中插入一条记录应使用（　）语句。","options":["DELETE FROM","UPDATE","INSERT INTO","SELECT"],"answer":[2],"exp":"插入用 INSERT INTO 表名 [(列名…)] VALUES (值…)。UPDATE 用于修改已有记录，DELETE FROM 用于删除，SELECT 用于查询。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-055","type":"single","topic":"6.5 关系操作与 SQL","diff":"中","stem":"删除表中满足条件的记录应使用（　）语句。","options":["DROP TABLE","DELETE FROM","UPDATE","INSERT INTO"],"answer":[1],"exp":"DELETE FROM 表名 [WHERE 条件] 删除记录（行）。DROP TABLE 删除的是整张表（结构一并消失），两者性质完全不同，考试中常被混用。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-056","type":"single","topic":"6.5 关系操作与 SQL","diff":"中","stem":"修改表中已有记录的字段值应使用（　）语句。","options":["SELECT … FROM","ALTER TABLE","INSERT INTO","UPDATE … SET … WHERE"],"answer":[3],"exp":"UPDATE 表名 SET 列名=表达式 [, …] [WHERE 条件]。ALTER TABLE 修改的是表结构（增删列、改类型），不是数据内容。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-057","type":"single","topic":"6.5 关系操作与 SQL","diff":"易","stem":"SQL 查询语句的基本结构是（　）。","options":["SELECT … FROM … WHERE","FROM … SELECT … WHERE","WHERE … SELECT … FROM","SELECT … WHERE … FROM"],"answer":[0],"exp":"顺序固定为：SELECT 列名 FROM 表名 [WHERE 条件]。书写时先写要哪些列，再写从哪张表取，最后写筛选条件；DBMS 内部执行顺序与书写顺序并不相同。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-058","type":"multi","topic":"6.5 关系操作与 SQL","diff":"中","stem":"SQL 语言的特点有（　）。","options":["非过程化，只说明做什么","既可独立使用，也可嵌入高级语言","必须指明数据的存取路径","语言简洁，语法接近英语口语"],"answer":[0,1,3],"exp":"前三项都是 SQL 的特点。SQL 的核心优势正是「非过程化」——不必指明存取路径，由 DBMS 决定如何执行；要求指明路径的是早期的层次与网状模型。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-059","type":"fill","topic":"6.5 关系操作与 SQL","diff":"中","stem":"从一个关系中选出满足给定条件的记录的操作称为 ____。","answers":["选择","筛选","selection"],"exp":"选择（Selection）按条件筛选行，是从行的角度运算。SQL 中由 WHERE 子句实现。它与「投影」相对：选择选行，投影选列。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-060","type":"fill","topic":"6.5 关系操作与 SQL","diff":"中","stem":"从一个关系中选出若干指定字段的值、去掉重复行后形成新关系的操作称为 ____。","answers":["投影","projection"],"exp":"投影（Projection）从列的角度运算，SQL 中由 SELECT 后列出的字段名实现。投影后字段数通常减少，且必须去掉重复行——因为结果是关系，而关系不允许重复元组。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-061","type":"short","topic":"6.5 关系操作与 SQL","diff":"中","stem":"说明选择运算与投影运算的区别，并各举一条 SQL 语句。","ref":"选择是从行的角度，按条件挑出满足条件的记录，结果行数减少、列数不变，SQL 中由 WHERE 子句完成，如 SELECT * FROM COURSES WHERE Unit=5；投影是从列的角度，选出若干指定字段并去掉重复行，结果列数减少、行数可能减少，SQL 中由 SELECT 后列出的字段实现，如 SELECT No, Unit FROM COURSES。两者可以组合，如 SELECT No FROM COURSES WHERE Unit=5 既选择又投影。","exp":"采分点：①方向（行 / 列）；②结果变化（行数 / 列数）；③各给一条正确的 SQL。把投影说成「筛选符合条件的列」是常见错误——投影不筛条件。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-062","type":"comp","topic":"6.5 关系操作与 SQL","diff":"中","stem":"已知选课关系 SC（Sno，Cno，Grade）。写出 SQL 语句：查询选修课程号为 K2 的学生的学号和成绩。","ref":"SELECT Sno, Grade\nFROM SC\nWHERE Cno = 'K2';\n结果取 Sno 与 Grade 两列（投影），并用 Cno='K2' 筛选行（选择）。字符串常量按 SQL 规范用单引号括起。","exp":"采分点：①SELECT 后只写 Sno, Grade（不能写 *）；②FROM SC；③WHERE Cno='K2'。写成 SELECT * 会多出 Cno 列，与题意不符。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）· 例 6-2"},"_unit":"u6"},{"qid":"cs.u6-063","type":"comp","topic":"6.5 关系操作与 SQL","diff":"难","stem":"已知 S（Sno，Sname，Age，Sex）、C（Cno，Cname，Teacher）、SC（Sno，Cno，Grade）。写出 SQL 语句：查询所有选课学生的学号、姓名、课程名和成绩。","ref":"SELECT S.Sno, S.Sname, C.Cname, SC.Grade\nFROM S, C, SC\nWHERE S.Sno = SC.Sno AND SC.Cno = C.Cno;\n三张表通过两个连接条件关联：S 与 SC 按 Sno 连接，SC 与 C 按 Cno 连接。由于 S 表中没有学号 5 的学生，而 SC 中有 5 号选课记录，内连接会自动把该记录排除——若要求连无姓名的选课记录也列出，须改用外连接（LEFT JOIN）。","exp":"采分点：①三表出现在 FROM 中；②两个连接条件缺一不可，漏掉一个会得到笛卡儿积；③所选列来自正确的表。易错：只写一个连接条件，结果行数暴增且数据错乱。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）· 例 6-2"},"_unit":"u6"},{"qid":"cs.u6-064","type":"comp","topic":"6.5 关系操作与 SQL","diff":"中","stem":"已知课程关系 COURSES（No，Title，Unit）。写出三条 SQL 语句：①插入课程（CIS52，TCP/IP Protocols，6）；②把课程 CIS51 的学时改为 6；③删除课程号为 CIS19 的记录。","ref":"① INSERT INTO COURSES VALUES ('CIS52', 'TCP/IP Protocols', 6);\n② UPDATE COURSES SET Unit = 6 WHERE No = 'CIS51';\n③ DELETE FROM COURSES WHERE No = 'CIS19';\n三条语句分别对应插入、更新、删除三种更新操作。②③若漏写 WHERE，会改动或删除整张表的所有记录。","exp":"采分点：①INSERT INTO … VALUES；②UPDATE … SET … WHERE；③DELETE FROM … WHERE。特别提醒：漏 WHERE 是初学者最危险的错误。","meta":{"source":"第 6 章课件（6-数据库技术.pptx）"},"_unit":"u6"},{"qid":"cs.u6-065","type":"single","topic":"6.5 关系操作与 SQL","diff":"中","stem":"SQL 语句 SELECT * FROM COURSES 中的「*」表示（　）。","options":["所有表","所有记录","所有字段","所有满足条件的记录"],"answer":[2],"exp":"「*」是通配符，位于 SELECT 之后表示选取全部字段（列）。它不影响取哪些行——行的筛选由 WHERE 决定，没有 WHERE 则取全部记录。","meta":{"source":"第 6 章课件（6-数据库技术.pptx）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-066","type":"single","topic":"6.5 关系操作与 SQL","diff":"中","stem":"关系操作中的并、交、差属于（　）。","options":["专门的算术运算","传统的集合运算","字符串处理运算","文件管理操作"],"answer":[1],"exp":"并、交、差是传统的集合运算，要求参与运算的两个关系具有相同的属性个数且对应属性同域（并相容）。选择、投影、连接、除则是专门的关系运算。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-067","type":"single","topic":"6.5 关系操作与 SQL","diff":"难","stem":"对一个关系先做选择再做投影，与先做投影再做选择，结果是否总是相同？（　）","options":["只有单表查询时相同","总是相同，两种次序等价","总是不相同","不一定相同：先投影可能把筛选要用的列去掉，导致无法筛选"],"answer":[3],"exp":"若先投影把 WHERE 要用的字段去掉，后续就无法按该字段筛选，结果自然不同；反之先选择后投影总不会出错。因此优化时可以「先选择后投影」以减少中间结果，反过来则要谨慎。","meta":{"source":"第 6 章课件（6-数据库技术.pptx）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-068","type":"comp","topic":"6.5 关系操作与 SQL","diff":"中","stem":"已知关系 X（U，V，W）的取值为：（A，Z，5）、（B，D，3）、（C，Q，5）。分别写出下列操作的结果：①从 X 中投影 W；②从 X 中选择 W=5 的记录。","ref":"①投影 W：结果为 {5, 3}。注意投影后要去掉重复行——原关系有两行的 W 都是 5，投影后只保留一个 5，故结果只有 2 行 1 列。\n②选择 W=5：结果为（A，Z，5）与（C，Q，5），2 行 3 列，列结构不变。\n对比：投影使列变少并去重，选择使行变少但不改变列。","exp":"采分点：①投影结果去重（只留 2 行），这是最容易漏的一步；②选择结果保留全部列；③能用一句话说清两者的差别。","meta":{"source":"第 6 章课件（6-数据库技术.pptx）· 例 6-1"},"_unit":"u6"},{"qid":"cs.u6-069","type":"single","topic":"6.6 数据库设计","diff":"易","stem":"数据库设计的第一个阶段是（　）。","options":["需求分析","概念结构设计","逻辑结构设计","物理结构设计"],"answer":[0],"exp":"六阶段依次为：需求分析 → 概念结构设计 → 逻辑结构设计 → 物理结构设计 → 数据库实施 → 运行与维护。需求分析没做好，后面所有设计都会返工。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-070","type":"single","topic":"6.6 数据库设计","diff":"中","stem":"数据库设计中，概念结构设计通常用（　）表示。","options":["数据字典","关系模式","E-R 图","二维表"],"answer":[2],"exp":"概念结构设计用 E-R 图（实体-联系图）描述信息世界，它不依赖具体的数据库管理系统。关系模式是逻辑结构设计的产物，数据字典是需求分析的成果。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-071","type":"single","topic":"6.6 数据库设计","diff":"易","stem":"E-R 图中，矩形表示（　）。","options":["属性","实体集","联系","主码"],"answer":[1],"exp":"E-R 图三种基本图形：矩形表示实体集，框内写实体名；椭圆形表示属性，实体的码加下划线；菱形表示联系，框内写联系名，连线两端标注 1:1、1:N 或 M:N。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-072","type":"single","topic":"6.6 数据库设计","diff":"易","stem":"E-R 图中，椭圆形表示（　）。","options":["联系类型","实体集","联系","属性"],"answer":[3],"exp":"椭圆形表示属性，属性名写在框内，用无向边与对应实体相连；若该属性是实体的码，要在属性名下加下划线。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-073","type":"single","topic":"6.6 数据库设计","diff":"易","stem":"E-R 图中，菱形表示（　）。","options":["联系","属性","实体集","字段"],"answer":[0],"exp":"菱形表示联系，框内写联系名，用无向边连接有关的实体集，两端标注联系的类型（1:1、1:N、M:N）。联系本身若有属性（如「选修」的成绩），也用椭圆表示并连到菱形上。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-074","type":"single","topic":"6.6 数据库设计","diff":"易","stem":"从现实世界到计算机中可存储的数据，需要经过的三个世界依次是（　）。","options":["用户世界、设计世界、实现世界","概念世界、逻辑世界、物理世界","现实世界、信息世界、计算机世界","需求世界、模型世界、代码世界"],"answer":[2],"exp":"先把现实世界的事物及其联系抽象成信息世界的概念模型（E-R 图），再转换成计算机世界的数据模型（如关系模型），经历两级抽象与转换。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-075","type":"single","topic":"6.6 数据库设计","diff":"中","stem":"概念模型是现实世界到信息世界的（　）。","options":["第二层抽象","第一层抽象","物理实现","最终形态"],"answer":[1],"exp":"概念模型（信息模型）是现实世界到信息世界的第一层抽象，按用户观点建模，不依赖具体计算机系统；从信息世界到计算机世界的数据模型是第二层抽象。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-076","type":"single","topic":"6.6 数据库设计","diff":"中","stem":"下列关于实体与属性的说法正确的是（　）。","options":["属性可以脱离实体单独存在","实体是字段，属性是记录","实体必须是具体的人或物，不能是抽象事件","实体是客观存在并可相互区别的事物，属性是对实体的描述性特征"],"answer":[3],"exp":"实体是客观存在并且可以相互区别的「事物」，既可以是具体的人、事、物，也可以是抽象的事件（如一次选课）；属性是实体所具有的若干特征，如学生的学号、姓名、性别。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-077","type":"multi","topic":"6.6 数据库设计","diff":"中","stem":"E-R 图的三要素是（　）。","options":["实体集","属性","联系","索引"],"answer":[0,1,2],"exp":"E-R 图由实体集（矩形）、属性（椭圆）、联系（菱形）三要素构成。索引是物理设计阶段为提高查询速度而建立的存储结构，不属于概念模型的要素。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-078","type":"multi","topic":"6.6 数据库设计","diff":"中","stem":"两个实体型之间的联系可分为（　）。","options":["一对多联系（1:n）","多对多联系（m:n）","零对零联系（0:0）","一对一联系（1:1）"],"answer":[0,1,3],"exp":"联系分三类：1:1（如班级与班长）、1:n（如部门与员工、班级与学生）、m:n（如学生与课程、教师与学生）。不存在「零对零」这种联系类型。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-079","type":"fill","topic":"6.6 数据库设计","diff":"易","stem":"E-R 图中用 ____ 表示实体集。","answers":["矩形","矩形框"],"exp":"E-R 图三种图形各司其职：矩形表实体集、椭圆表属性、菱形表联系。记混这三个图形是选择题的常见失分点。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-080","type":"fill","topic":"6.6 数据库设计","diff":"中","stem":"数据库设计的六个阶段依次为：____、概念结构设计、逻辑结构设计、物理结构设计、数据库实施、运行与维护。","answers":["需求分析","需求分析阶段"],"exp":"需求分析要弄清用户的信息管理要求与数据操作要求，产出数据字典与数据流图。它是整个设计的输入，做不实就会在后面反复返工。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-081","type":"short","topic":"6.6 数据库设计","diff":"中","stem":"简述数据库设计的六个阶段及各阶段的主要任务。","ref":"①需求分析：调查用户的信息要求与处理要求，形成数据字典、数据流图；②概念结构设计：把需求抽象成独立于具体 DBMS 的概念模型，通常画 E-R 图；③逻辑结构设计：把 E-R 图转换为关系模式，并进行规范化处理；④物理结构设计：确定存储结构、索引与存取方法；⑤数据库实施：建库建表、录入数据、编写应用程序；⑥数据库运行与维护：监控性能、备份恢复、调整优化。","exp":"采分点：六阶段名称与顺序、各阶段一项核心任务。把「概念设计」与「逻辑设计」的产物写反（E-R 图 / 关系模式）是最常见的错误。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-082","type":"short","topic":"6.6 数据库设计","diff":"中","stem":"说明 E-R 图中矩形、椭圆形、菱形三种图形各表示什么，并说明联系类型标注在哪里。","ref":"矩形表示实体集，框内写实体名；椭圆形表示属性，属性名写在框内，用无向边连到所属实体，实体的码在属性名下加下划线；菱形表示联系，框内写联系名，用无向边连接有关的实体集。联系的类型（1:1、1:N、M:N）标注在菱形与实体集之间的连线上。联系本身若有属性（如「选修」的成绩），用椭圆连到菱形上。","exp":"采分点：三种图形对应正确、码加下划线、联系类型标在连线上、联系也可带属性。最后一点常被忽略。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-083","type":"comp","topic":"6.6 数据库设计","diff":"难","stem":"某学校有若干系，每个系有若干名教师和学生，教师和学生不能跨系；每个教师可讲授多门课程，每门课程可由多名教师讲授；每个学生可选修多门课程，选课后有成绩。已知系属性为系编号、系名、电话；教师属性为教师号、姓名、性别、职称；学生属性为学号、姓名、性别、年龄；课程属性为课程号、课程名、学分。画出 E-R 图要点并转换为关系模式。","ref":"E-R 图要点：实体集四个——系、教师、学生、课程。联系：系与教师 1:n（属于）、系与学生 1:n（拥有）、教师与课程 m:n（讲授）、学生与课程 m:n（选修，带属性「成绩」）。\n转换为关系模式（按规则：实体各转一张表；1:n 在 n 端加 1 端的码；m:n 单独建表，键为两端键的组合）：\n系（系编号，系名，电话）\n教师（教师号，姓名，性别，职称，系编号）\n学生（学号，姓名，性别，年龄，系编号）\n课程（课程号，课程名，学分）\n讲授（教师号，课程号）\n选修（学号，课程号，成绩）\n共 6 个关系模式，其中「系编号」「教师号」「课程号」「学号」为各表主码，讲授与选修的主码是两端主码的组合。","exp":"采分点：①四个实体、四个联系及类型正确；②1:n 在 n 端加外码；③m:n 单独建表并带联系属性「成绩」；④共 6 张表。漏掉「讲授」表或把成绩放进学生表都是典型错误。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）· 例 6-3"},"_unit":"u6"},{"qid":"cs.u6-084","type":"comp","topic":"6.6 数据库设计","diff":"中","stem":"分别说明 1:1、1:n、m:n 三种联系转换为关系模式的规则。","ref":"①1:1 联系：在任意一个实体的关系模式中加入另一个实体的码和联系本身的属性（两端任选其一即可）。\n②1:n 联系：在 n 端实体的关系模式中加入 1 端实体的码和联系属性（即「多方加」）。例如系与教师是 1:n，就在教师表中加入系编号。\n③m:n 联系：把联系单独转换为一个关系模式，其属性为两端实体的码加上联系本身的属性，主码为两端实体码的组合。例如学生与课程的选修联系单独建表（学号，课程号，成绩）。","exp":"采分点：三条规则各一句，且能举出对应例子。「1:n 在 n 端加码」与「m:n 单独建表」是必须记住的两条。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-085","type":"single","topic":"6.6 数据库设计","diff":"易","stem":"一间宿舍可住多个学生，则实体「宿舍」与实体「学生」之间的联系是（　）。","options":["多对多联系","一对一联系","一对多联系","多对一联系"],"answer":[2],"exp":"一间宿舍对应多个学生，而一个学生只住一间宿舍，因此宿舍对学生是一对多（1:n）。注意方向的表述：从宿舍看是一对多，从学生看是多对一，标准写法以 1 端在前。","meta":{"source":"第 6 章课件（6-数据库技术.pptx）· 课上真题","optperm":true},"_unit":"u6"},{"qid":"cs.u6-086","type":"single","topic":"6.6 数据库设计","diff":"中","stem":"若实体 A 与实体 B 是 m:n 联系，转换时应（　）。","options":["把两个实体合并为一个关系模式","在 A 的关系模式中加入 B 的码","在 B 的关系模式中加入 A 的码","把联系单独转换为一个关系模式，主码为两端实体码的组合"],"answer":[3],"exp":"m:n 联系无法靠在某端加码表达（两端都会出现重复组），必须单独建表，属性为两端实体的码加联系自身的属性，主码是两端码的组合。学生与课程的「选修」表就是典型例子。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-087","type":"single","topic":"6.6 数据库设计","diff":"中","stem":"若实体 A 与实体 B 是 1:n 联系，转换时应（　）。","options":["在 n 端实体的关系模式中加入 1 端实体的码","在 1 端实体的关系模式中加入 n 端实体的码","单独建立一个联系表","把两个实体合并"],"answer":[0],"exp":"1:n 联系在 n 端加 1 端的码：一名教师可以讲多门课（若课程只由一位教师任课），就在课程表中加入教师号。若在 1 端加码，则 1 端的每条记录要存多个 n 端码，违反属性不可再分。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-088","type":"single","topic":"6.6 数据库设计","diff":"中","stem":"数据库设计中，把 E-R 图转换为关系模式属于（　）。","options":["物理结构设计","概念结构设计","逻辑结构设计","需求分析"],"answer":[2],"exp":"逻辑结构设计的任务是把概念模型（E-R 图）转换为具体 DBMS 支持的数据模型（关系模式），并做规范化。概念设计产出 E-R 图，物理设计确定存储与索引。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-089","type":"single","topic":"6.7 数据库技术发展趋势","diff":"中","stem":"分布式数据库的主要特点是（　）。","options":["数据全部集中在一台服务器上","物理上分散在网络的各结点上，逻辑上属于同一系统","各结点之间不能通信","只支持单用户访问"],"answer":[1],"exp":"分布式数据库是物理分散、逻辑统一的数据集合：各地计算机由数据通信网络相连，位置对用户透明，局部故障不影响其他部分，同时降低了数据传输代价。代价是协调全局事务的开销较大。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-090","type":"single","topic":"6.7 数据库技术发展趋势","diff":"中","stem":"时序数据库最适用的数据是（　）。","options":["图像与音频等多媒体数据","结构固定的二维表数据","XML 格式的半结构化文档","带时间戳、随时间持续产生的数据"],"answer":[3],"exp":"传感器采集、股票交易、汇率、DevOps 监控等数据都按时间顺序产生，时序数据库对时间属性建立特殊索引，实现快速查询与更高压缩比。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-091","type":"single","topic":"6.7 数据库技术发展趋势","diff":"中","stem":"大数据的「4V」特性是指（　）。","options":["Volume、Variety、Velocity、Value","Volume、Version、View、Value","Virtual、Variety、Velocity、Verify","Volume、Variety、Validity、Vector"],"answer":[0],"exp":"4V 指体量大（Volume）、类型多样（Variety）、速度快（Velocity）、价值密度低（Value）。大数据尚无统一定义，普遍用这四条特征描述。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-092","type":"single","topic":"6.7 数据库技术发展趋势","diff":"中","stem":"主动数据库通常在传统数据库中嵌入（　）规则，以提供对紧急情况的及时反应能力。","options":["HTML","SQL","ECA（事件-条件-动作）","TCP/IP"],"answer":[2],"exp":"主动数据库把人工智能技术与数据库技术结合，在库中嵌入 ECA（Event-Condition-Action）规则：事件触发后检查条件，满足则自动执行动作，使数据库从「被动等命令」变为「主动响应」。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-093","type":"multi","topic":"6.7 数据库技术发展趋势","diff":"中","stem":"属于数据库技术发展方向的有（　）。","options":["单机集中式数据库","面向对象数据库","分布式数据库","多媒体数据库与时序数据库"],"answer":[1,2,3],"exp":"前三项都是数据库技术的发展方向。「单机集中式」是早期形态，发展趋势恰恰是分布式、多样化与智能化，不是回到单机集中。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-094","type":"fill","topic":"6.7 数据库技术发展趋势","diff":"中","stem":"大数据普遍采用 ____ 特性来描述，即 Volume、Variety、Velocity 和 Value。","answers":["4V","四V","4v"],"exp":"4V 分别对应体量大、类型多样、速度快、价值密度低。答题时若只写「4V」而说不出四个词，通常只能得一半分。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-095","type":"short","topic":"6.7 数据库技术发展趋势","diff":"中","stem":"什么是分布式数据库？它有哪些特点？","ref":"分布式数据库是物理上分散在计算机网络各结点上、但在逻辑上属于同一系统的数据集合，是分布式计算技术与数据库技术结合的产物。特点：①各地计算机由数据通信网络相联系；②克服了中心数据库的弱点，降低了数据传输代价；③提高了系统的可靠性，局部系统发生故障时其他部分仍可继续工作；④各数据库的位置对用户透明，便于系统扩充；⑤协调全局事务的开销较大，事务管理性能花费高。按数据分布方式可分为分割式与复制式两类。","exp":"采分点：①定义中的「物理分散、逻辑统一」；②至少三条特点，其中可靠性与透明性最关键；③能指出代价（全局事务开销）。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-096","type":"comp","topic":"6.7 数据库技术发展趋势","diff":"中","stem":"某风电场要存储 5000 台风机每秒上报的温度、转速、功率数据，用于趋势分析与告警；另有一个电商系统需要存储订单、用户、商品等业务数据，要求事务一致。分别推荐哪种数据库，并说明理由。","ref":"风电场数据推荐时序数据库：数据带时间戳、按时间顺序持续高速写入、量大且几乎不改不删，查询以时间区间聚合为主；时序数据库对时间属性建特殊索引，压缩率高、写入吞吐大，适合趋势分析与告警。\n电商业务数据推荐关系数据库（如 MySQL、PostgreSQL）：订单、用户、商品之间有明确的结构与关联，需要多表连接与事务的 ACID 保证（下单要同时扣库存、写订单、记流水，不能只成功一半）；关系模型与 SQL 也便于报表与统计。\n补充：两类数据可以并存，用关系库存业务主数据，用时序库存监控指标，通过应用层或数据同步衔接。","exp":"采分点：①两类场景各给出正确选型；②理由落在数据特征（时间戳/写入模式 vs 结构/事务）上；③能提出混合架构加分。只写「用时序库、用关系库」不说理由不得分。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）"},"_unit":"u6"},{"qid":"cs.u6-097","type":"single","topic":"6.7 数据库技术发展趋势","diff":"中","stem":"多媒体数据库从本质上要解决的三个问题不包括（　）。","options":["信息媒体的多样化","关系模式的规范化","多媒体数据与人的交互性","多媒体数据的集成与交叉调用"],"answer":[1],"exp":"多媒体数据库要解决三个问题：媒体多样化、多媒体数据集成（交叉调用与融合）、多媒体数据与人的交互性。关系模式规范化是关系数据库的设计理论，与多媒体数据库的本质问题无关。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-098","type":"single","topic":"6.3 关系数据库基本术语","diff":"中","stem":"主属性是指（　）。","options":["不允许为空的属性","主码中的第一个属性","取值最大的属性","包含在所有候选码中的属性"],"answer":[3],"exp":"主属性是包含在任一候选码中的属性；不包含在任何候选码中的属性叫非主属性。这个概念在范式判断中要用到，与「主码的第一个属性」无关。","meta":{"source":"第 6 章课件（陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-099","type":"single","topic":"6.2 数据模型","diff":"中","stem":"数据模型的作用是（　）。","options":["定义数据的逻辑设计，并描述数据之间的联系","规定磁盘的物理扇区大小","决定程序的编译方式","描述 CPU 的指令格式"],"answer":[0],"exp":"数据模型定义数据的逻辑设计，同时描述数据之间的联系，是数据库组织数据的依据。物理存储细节属于物理设计，与数据模型的层次不同。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"},{"qid":"cs.u6-100","type":"single","topic":"6.1 数据库的定义与特点","diff":"中","stem":"下列软件中，属于数据库管理系统的是（　）。","options":["WPS 文字","Excel","MySQL","Photoshop"],"answer":[2],"exp":"MySQL 是关系数据库管理系统，负责数据的定义、操纵、控制与维护。Excel 是电子表格软件，虽然能存数据，但不具备并发控制、事务、权限等 DBMS 能力。","meta":{"source":"第 6 章课件（6-数据库技术.pptx / 陈6 数据库技术.pdf）","optperm":true},"_unit":"u6"}]}],"wrong":{"exitStreak":1},"mastery":{"wAll":0.4,"wRecent":0.6,"recentN":5,"weakBelow":60,"solidAt":85,"solidStreak":4,"passMinQ":4,"passRate":0.9,"dueDays":[1,3,7]},"codec":{"version":10,"gidBits":32,"budgetBytes":6000},"order":["g7b36b9f9","geb76ff8a","g5604cb4e","gbbf40dfe","g53d3c631","gc8006e41","gdde89a21","gffcece9c","gbf4af0af","gf58d538b","g986a45cb","g16fafab6","g390c53cf","gd341e104","g5caa97bb","g63505a11","g262242e2","g53357d53","g15895c5a","gb37205e6","ga8ff66f5","gf78a1598","g2312f909","gd84ac421","g531e9c29","g11a301b7","g9182d1cb","g5ac960f1","g879fc5c7","g7d406c09","ge31b0414","ga0a1269f","gd6d7ba22","g96ce59ac",     if (typeof localStorage === 'undefined' || !localStorage.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    var self = this;
    var touched = 0;

    Object.keys(got.ans).forEach(function (g) {
      var incoming = got.ans[g];
      if (got.texts[g] != null) incoming.x = cleanText(got.texts[g]);
      ans[g] = mergeRecord(ans[g] || null, incoming);
      if (incoming.ok === false) wrong[g] = Date.now();
      touched++;
    });
    Object.keys(got.fav).forEach(function (g) { fav[g] = fav[g] || Date.now(); });

    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    return { kind: got.kind, key: got.key, count: touched, v: got.v || 10 };
  };

  Site.prototype.undoImport = function () {
    var bak = this.store.get('bak', null);
    if (!bak) return false;
    this.store.set('ans', bak.data.ans || {});
    this.store.set('wrong', bak.data.wrong || {});
    this.store.set('fav', bak.data.fav || {});
    return true;
  };

  /* ---- 统计（三级口径，分母一律 gid 去重） ---- */

  Site.prototype.stats = function (unitKey) {
    var self = this;
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var gids = unitKey ? this.scopeGids('unit', unitKey) : this.order.slice();
    var seen = {}, total = 0, answered = 0, correct = 0, wrongN = 0, favN = 0;
    gids.forEach(function (g) {
      if (seen[g]) return;
      seen[g] = 1;
      total++;
      var r = ans[g];
      if (r) {
        answered++;
        if (r.ok === true) correct++;
      }
      if (wrong[g]) wrongN++;
      if (fav[g]) favN++;
    });
    return {
      total: total, answered: answered, correct: correct,
      rate: answered ? Math.round(100 * correct / answered) : null,
      wrong: wrongN, fav: favN
    };
  };

  var QB = {
    fpNorm: fpNorm, fpHash: fpHash, fingerprint: fingerprint,
    norm: norm, judge: judge, fuzzyEq: fuzzyEq, cleanText: cleanText,
    maskWidth: maskWidth, mergeRecord: mergeRecord,
    Store: Store, Site: Site,
    create: function (def, store) { return new Site(def, store); }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = QB;
  else root.QB = QB;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>/* qb-sync.js — 云端同步（手动上传 / 下载，不做任何自动网络请求）
 *
 * 与线上原方案C 完全同一套契约，保证老页面与新页面读写同一行、同一份数据：
 *   环境      window.QB_SYNC.env
 *   RPC       POST <env>.api.tcloudbasegateway.com/v1/rdb/rest/rpc/quiz_pull | quiz_push
 *   鉴权      Authorization: Bearer <publishable key>
 *   行键      (同步码, 'global')，全站一行
 *   payload   {v:1, quiz:'global', at, ans:{gid:{picked,text,done,ok,self,upd}}, del:{gid:t}, fav:{gid:{on,t}}}
 *   同步码    localStorage['csquiz_sync_code_v1']（与旧页面共用，用户不用重填）
 *
 * 内核内部记录用规范 3.2 的短键（ok/at/p/x/self），payload 用旧站的长键。
 * 转换集中在本文件的 toRemote / fromRemote，两端格式谁都不改，所以新旧页面可以并存。
 */
(function (root) {
  'use strict';

  var QB = root.QB;
  if (!QB) return;

  function Sync(site, cfg) {
    this.site = site;
    this.cfg = cfg || {};
    this.env = this.cfg.env || '';
    this.key = this.cfg.key || '';
    this.code = this.cfg.code || '';
    this.quiz = this.cfg.quiz || 'global';
    this.base = this.cfg.rpc || ('https://' + this.env + '.api.tcloudbasegateway.com/v1/rdb/rest/rpc/');
    this.busy = false;
    this.lastMsg = '';
    this.lastAt = 0;
    this.codeKey = this.cfg.codeKey || 'csquiz_sync_code_v1';
    this.stateKey = 'qb.site.sync.v1';
    var st = this._load();
    if (!this.code && st.code) this.code = st.code;
  }

  Sync.prototype._load = function () {
    try {
      var raw = (typeof localStorage !== 'undefined') ? localStorage.getItem(this.stateKey) : null;
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  };

  Sync.prototype._save = function (patch) {
    var st = this._load();
    for (var k in patch) st[k] = patch[k];
    st.at = Date.now();
    try { if (typeof localStorage !== 'undefined') localStorage.setItem(this.stateKey, JSON.stringify(st)); } catch (e) {}
  };

  Sync.prototype.configured = function () {
    return !!this.env && this.key.length > 20 && this.key.indexOf('__') !== 0;
  };

  Sync.prototype.enabled = function () { return this.configured() && !!this.code; };

  Sync.prototype.setCode = function (v) {
    this.code = QB.cleanText(v).trim().toUpperCase();
    this._save({ code: this.code });
    try { if (typeof localStorage !== 'undefined') localStorage.setItem(this.codeKey, this.code); } catch (e) {}
  };

  Sync.prototype.readSharedCode = function () {
    try {
      var v = (typeof localStorage !== 'undefined') ? localStorage.getItem(this.codeKey) : '';
      if (v && !this.code) { this.code = v; }
      return this.code || '';
    } catch (e) { return this.code || ''; }
  };

  /* ---------- 记录形态转换 ---------- */

  function toRemote(rec) {
    if (!rec) return null;
    var picked = Array.isArray(rec.p) ? rec.p.slice(0, 16) : [];
    var text = rec.x == null ? '' : String(rec.x).slice(0, 2000);
    return {
      picked: picked,
      text: text,
      done: rec.ok !== null || picked.length > 0 || text.length > 0,
      ok: rec.ok === true ? true : (rec.ok === false ? false : null),
      self: rec.self === true ? true : null,
      upd: typeof rec.at === 'number' ? rec.at : 0
    };
  }

  function fromRemote(r) {
    if (!r || typeof r !== 'object') return null;
    var rec = { ok: r.ok === true ? true : (r.ok === false ? false : null), at: typeof r.upd === 'number' ? r.upd : Date.now() };
    if (Array.isArray(r.picked) && r.picked.length) {
      rec.p = r.picked.filter(function (k) { return typeof k === 'number' && k >= 0 && k < 16; })
        .sort(function (a, b) { return a - b; });
    }
    if (typeof r.text === 'string' && r.text) rec.x = QB.cleanText(r.text);
    if (r.self === true) rec.self = true;
    return rec;
  }

  Sync.prototype._localSnap = function () {
    var site = this.site;
    var ans = site.allAns(), wrong = site.allWrong(), fav = site.allFav();
    var known = {};
    site.questions.forEach(function (q) { known[q._gid] = 1; });
    var snap = { ans: {}, del: {}, fav: {} };
    Object.keys(ans).forEach(function (g) {
      if (!known[g]) return;
      var r = toRemote(ans[g]);
      if (r) snap.ans[g] = r;
    });
    Object.keys(fav).forEach(function (g) { if (known[g]) snap.fav[g] = { on: true, t: fav[g] || 0 }; });
    return snap;
  };

  Sync.prototype._remoteSnap = function (payload) {
    var known = {};
    this.site.questions.forEach(function (q) { known[q._gid] = 1; });
    var snap = { ans: {}, del: {}, fav: {} };
    var a = (payload && payload.ans) || {};
    var d = (payload && payload.del) || {};
    var f = (payload && payload.fav) || {};
    Object.keys(a).forEach(function (g) {
      if (!known[g]) return;
      var r = fromRemote(a[g]);
      if (r) snap.ans[g] = toRemote(r);
    });
    Object.keys(d).forEach(function (g) { if (known[g] && typeof d[g] === 'number') snap.del[g] = d[g]; });
    Object.keys(f).forEach(function (g) {
      if (known[g] && f[g] && typeof f[g] === 'object') snap.fav[g] = { on: f[g].on === true, t: typeof f[g].t === 'number' ? f[g].t : 0 };
    });
    return snap;
  };

  /* 合并：并集，同一条取 upd 较新者；墓碑优先 */
  function combine(a, b) {
    var out = { ans: {}, del: {}, fav: {} };
    [b, a].forEach(function (src) {
      Object.keys(src.ans).forEach(function (g) {
        var cur = out.ans[g];
        if (!cur || (src.ans[g].upd || 0) >= (cur.upd || 0)) out.ans[g] = src.ans[g];
      });
    });
    var dels = {};
    [a, b].forEach(function (src) {
      Object.keys(src.del).forEach(function (g) { dels[g] = Math.max(dels[g] || 0, src.del[g]); });
    });
    Object.keys(dels).forEach(function (g) {
      var rec = out.ans[g];
      if (!rec || dels[g] >= (rec.upd || 0)) { delete out.ans[g]; out.del[g] = dels[g]; }
    });
    var keys = {};
    Object.keys(a.fav).forEach(function (k) { keys[k] = 1; });
    Object.keys(b.fav).forEach(function (k) { keys[k] = 1; });
    Object.keys(keys).forEach(function (k) {
      var x = a.fav[k], y = b.fav[k];
      out.fav[k] = (x && y) ? ((x.t || 0) >= (y.t || 0) ? x : y) : (x || y);
    });
    return out;
  }

  Sync.prototype._apply = function (snap) {
    var site = this.site;
    var ans = site.allAns(), fav = site.allFav();
    Object.keys(snap.ans).forEach(function (g) {
      var incoming = fromRemote(snap.ans[g]);
      if (incoming) ans[g] = QB.mergeRecord(ans[g] || null, incoming);
    });
    Object.keys(snap.del).forEach(function (g) { delete ans[g]; });
    Object.keys(snap.fav).forEach(function (g) { if (snap.fav[g].on) fav[g] = snap.fav[g].t || Date.now(); else delete fav[g]; });
    site.store.set('ans', ans);
    site.store.set('fav', fav);
  };

  Sync.prototype._payload = function (snap) {
    var ans = {};
    Object.keys(snap.ans).forEach(function (g) {
      var r = snap.ans[g];
      ans[g] = { picked: r.picked, text: r.text, done: r.done, ok: r.ok, self: r.self, upd: r.upd };
    });
    return { v: 1, quiz: this.quiz, at: Date.now(), ans: ans, del: snap.del, fav: snap.fav };
  };

  /* ---------- 网络 ---------- */

  Sync.prototype._rpc = function (fn, body) {
    var self = this;
    return fetch(this.base + fn, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json; charset=utf-8',
        'Accept': 'application/json',
        'Authorization': 'Bearer ' + this.key
      },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    }).then(function (text) {
      // 统一按 UTF-8 文本解析，避免响应头缺 charset 时按 latin-1 解出乱码
      var json;
      try { json = JSON.parse(text); } catch (e) { throw new Error('云端返回非 JSON'); }
      if (json && json.ok === false && json.error === 'conflict') return json;
      if (!json || json.ok === false) throw new Error((json && json.error) || '云端返回异常');
      return json;
    });
  };

  Sync.prototype._guard = function () {
    if (!this.configured()) return '同步未配置（缺少环境或 Key）';
    if (!this.code) return '请先填写并保存同步码';
    if (this.busy) return '正在同步中';
    return null;
  };

  Sync.prototype.upload = function () {
    var self = this, why = this._guard();
    if (why) return Promise.reject(new Error(why));
    this.busy = true;

    function once() {
      return self._rpc('quiz_pull', { p_code: self.code, p_quiz: self.quiz }).then(function (r) {
        var merged = combine(self._localSnap(), self._remoteSnap(r.payload));
        return self._rpc('quiz_push', {
          p_code: self.code, p_quiz: self.quiz,
          p_base_rev: r.rev || 0, p_payload: self._payload(merged)
        }).then(function (res) { return { res: res, merged: merged }; });
      });
    }

    return once().then(function (x) {
      if (x.res && x.res.ok === false && x.res.error === 'conflict') return once();   // 被别的设备抢先，重来一次
      self._apply(x.merged);
      self._save({ rev: x.res.rev || 0, code: self.code });
      self.busy = false;
      return { count: Object.keys(x.merged.ans).length };
    }).catch(function (e) { self.busy = false; throw e; });
  };

  Sync.prototype.download = function () {
    var self = this, why = this._guard();
    if (why) return Promise.reject(new Error(why));
    this.busy = true;
    return this._rpc('quiz_pull', { p_code: this.code, p_quiz: this.quiz }).then(function (r) {
      var merged = combine(self._localSnap(), self._remoteSnap(r.payload));
      self._apply(merged);
      self._save({ rev: r.rev || 0, code: self.code });
      self.busy = false;
      return { count: Object.keys(merged.ans).length };
    }).catch(function (e) { self.busy = false; throw e; });
  };

  Sync.prototype.pending = function () {
    var st = this._load();
    var since = st.at || 0;
    var n = 0;
    var ans = this.site.allAns();
    Object.keys(ans).forEach(function (g) { if ((ans[g].at || 0) > since) n++; });
    return n;
  };

  root.QBSync = { create: function (site, cfg) { return new Sync(site, cfg); }, toRemote: toRemote, fromRemote: fromRemote };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>/* qb-page.js — 练习页渲染层
 * 只读 window.QB_SITE（站点定义 + 本题组题目），所有状态变更走 QB 内核（规范 6.4）。
 */
(function () {
  'use strict';

  var def = window.QB_SITE;
  var meta = window.QB_META || {};
  if (!def) return;

  var site = QB.create(def);
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  var S = {
    mode: 'seq',
    type: '',
    diff: '',
    kw: '',
    list: [],
    idx: 0,
    shown: {},       // qid -> true，已揭晓答案
    redo: {},        // qid -> true，本题正在重做，忽略旧记录
    draft: {}        // qid -> 当前输入
  };

  var DIFF_ORDER = { '易': 0, '中': 1, '难': 2 };
  var TYPE_ORDER = Object.keys(def.types || {});

  /* ------------------------------------------------------------ 路由 */

  function readRoute() {
    var h = location.hash.replace(/^#/, '');
    var p = new URLSearchParams(h);
    S.mode = p.get('mode') || 'seq';
    S.type = p.get('t') || '';
    S.diff = p.get('d') || '';
    S.kw = p.get('kw') || '';
    var qid = p.get('q');
    if (qid) S.pendingQid = qid;
  }

  function writeRoute() {
    var p = new URLSearchParams();
    if (S.mode !== 'seq') p.set('mode', S.mode);
    if (S.type) p.set('t', S.type);
    if (S.diff) p.set('d', S.diff);
    if (S.kw) p.set('kw', S.kw);
    var q = S.list[S.idx];
    if (q) p.set('q', q.qid);
    var url = location.pathname + '#' + p.toString();
    try { history.replaceState(null, '', url); } catch (e) { /* file:// 下可能被拒，忽略 */ }
  }

  /* ------------------------------------------------------------ 组卷 */

  function buildList() {
    var ans = site.allAns(), wrong = site.allWrong(), fav = site.allFav();
    var all = site.questions.slice();

    if (S.type) all = all.filter(function (q) { return q.type === S.type; });
    if (S.diff) all = all.filter(function (q) { return q.diff === S.diff; });
    if (S.kw) {
      var kw = S.kw.toLowerCase();
      all = all.filter(function (q) {
        return (q.stem + ' ' + q.topic + ' ' + (q.exp || '')).toLowerCase().indexOf(kw) >= 0;
      });
    }

    if (S.mode === 'wrong') all = all.filter(function (q) { return wrong[q._gid]; });
    else if (S.mode === 'fav') all = all.filter(function (q) { return fav[q._gid]; });
    else if (S.mode === 'undone') all = all.filter(function (q) { return !ans[q._gid]; });

    if (S.mode === 'random') {
      for (var i = all.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = all[i]; all[i] = all[j]; all[j] = t;
      }
    }
    S.list = all;
    if (S.pendingQid) {
      var k = all.findIndex(function (q) { return q.qid === S.pendingQid; });
      if (k >= 0) S.idx = k;
      S.pendingQid = null;
    }
    if (S.idx >= all.length) S.idx = Math.max(0, all.length - 1);
  }

  /* ------------------------------------------------------------ 渲染 */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  // 显示优先用构建期排好版的视图（公式是内联 SVG），没有就转义纯文本
  function view(q, field, fallback) {
    if (q.views && q.views[field] != null) return q.views[field];
    var raw = fallback !== undefined ? fallback : q[field];
    return esc(raw).replace(/\n/g, '<br>');
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function renderStats() {
    var st = site.stats(def.units.length === 1 ? def.units[0].key : null);
    var box = $('#stats');
    box.innerHTML = '';
    var items = [
      ['进度', st.answered + ' / ' + st.total, st.total ? Math.round(100 * st.answered / st.total) : 0],
      ['正确率', st.rate == null ? '—' : st.rate + '%', st.rate || 0],
      ['错题', String(st.wrong), 0],
      ['收藏', String(st.fav), 0]
    ];
    items.forEach(function (it) {
      var c = el('div', 'stat');
      c.appendChild(el('div', 'stat-k', it[0]));
      c.appendChild(el('div', 'stat-v', it[1]));
      if (it[2]) {
        var bar = el('div', 'stat-bar');
        var fill = el('i');
        fill.style.width = it[2] + '%';
        bar.appendChild(fill);
        c.appendChild(bar);
      }
      box.appendChild(c);
    });
    var label = def.units.length === 1 ? '题组口径' : '题库集口径（gid 去重）';
    $('#stats').setAttribute('data-scope', label);
  }

  function renderFilters() {
    var tsel = $('#f-type');
    if (tsel.options.length <= 1) {
      TYPE_ORDER.forEach(function (t) {
        var o = el('option', null, def.types[t].label || t);
        o.value = t;
        tsel.appendChild(o);
      });
    }
    tsel.value = S.type;
    $('#f-diff').value = S.diff;
    $('#f-kw').value = S.kw;
    $$('#modes button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.mode === S.mode);
    });
  }

  function optionMark(q, i) {
    return String.fromCharCode(65 + i);
  }

  function renderCard() {
    var card = $('#card');
    card.innerHTML = '';
    var q = S.list[S.idx];

    if (!q) {
      var empty = el('div', 'empty');
      empty.appendChild(el('div', 'empty-t', S.mode === 'wrong' ? '错题本是空的' : (S.mode === 'fav' ? '还没有收藏' : '没有符合条件的题目')));
      empty.appendChild(el('p', 'empty-s', S.mode === 'wrong'
        ? '答错的题会自动进入这里；在错题本里做对一次才会移出。'
        : '换个筛选条件，或者切回顺序练习。'));
      card.appendChild(empty);
      $('#nav').innerHTML = '';
      return;
    }

    var decl = def.types[q.type] || {};
    var rec = site.get(q._gid);
    // 错题本里默认让人重做：不预置上次的选项、也不提前摊开答案。
    // 点「重做」的题同理；其余模式仍按「做过就显示结果」的老规矩。
    var redoing = !!S.redo[q.qid] || (S.mode === 'wrong' && !S.shown[q.qid]);
    var revealed = !redoing && (!!S.shown[q.qid] || (rec && rec.ok !== null));
    var fav = site.allFav()[q._gid];

    var head = el('div', 'q-head');
    var tag = el('span', 'tag tag-type', decl.label || q.type);
    head.appendChild(tag);
    head.appendChild(el('span', 'tag tag-diff d-' + (DIFF_ORDER[q.diff] != null ? DIFF_ORDER[q.diff] : 1), q.diff));
    head.appendChild(el('span', 'q-topic', q.topic));
    var no = el('span', 'q-no', (S.idx + 1) + ' / ' + S.list.length);
    head.appendChild(no);
    card.appendChild(head);

    var stem = el('div', 'q-stem');
    stem.innerHTML = view(q, 'stem');
    card.appendChild(stem);

    if (q.media && q.media.img) {
      var im = el('img', 'q-img');
      im.src = q.media.img;
      im.alt = '题图';
      card.appendChild(im);
    }

    var area = el('div', 'q-area');

    if (decl.answerShape === 'choice') {
      var opts = el('div', 'opts');
      var picked = redoing ? (S.draft[q.qid] || [])
        : ((rec && rec.p) ? rec.p.slice() : (S.draft[q.qid] || []));
      q.options.forEach(function (text, i) {
        var b = el('button', 'opt');
        b.type = 'button';
        b.dataset.i = String(i);
        if (picked.indexOf(i) >= 0) b.classList.add('picked');
        if (revealed) {
          b.disabled = true;
          if ((q.answer || []).indexOf(i) >= 0) b.classList.add('right');
          else if (picked.indexOf(i) >= 0) b.classList.add('wrong');
        }
        var k = el('span', 'opt-k', optionMark(q, i));
        b.appendChild(k);
        var ot = el('span', 'opt-t');
        ot.innerHTML = (q.views && q.views.opts && q.views.opts[i] != null) ? q.views.opts[i] : esc(text);
        b.appendChild(ot);
        b.addEventListener('click', function () { pick(q, decl, i); });
        opts.appendChild(b);
      });
      area.appendChild(opts);
      if (decl.judge === 'set' && !revealed) {
        var tip = el('p', 'hint', '多选题：选好后点「提交」');
        area.appendChild(tip);
      }
    } else if (decl.answerShape === 'tokenList') {
      var inp = el('input', 'in');
      inp.type = 'text';
      inp.placeholder = '在此填写答案';
      inp.value = redoing ? (S.draft[q.qid] || '') : ((rec && rec.x) || S.draft[q.qid] || '');
      inp.disabled = revealed;
      inp.addEventListener('input', function () { S.draft[q.qid] = inp.value; });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(q, decl); });
      area.appendChild(inp);
    } else {
      var ta = el('textarea', 'ta');
      ta.placeholder = '写出你的答案或关键步骤，提交后与参考答案对照自评';
      ta.value = redoing ? (S.draft[q.qid] || '') : ((rec && rec.x) || S.draft[q.qid] || '');
      ta.disabled = revealed;
      ta.rows = 5;
      ta.addEventListener('input', function () { S.draft[q.qid] = ta.value; });
      area.appendChild(ta);
    }
    card.appendChild(area);

    var bar = el('div', 'q-bar');
    if (!revealed) {
      var sub = el('button', 'btn primary', '提交');
      sub.addEventListener('click', function () { submit(q, decl); });
      bar.appendChild(sub);
      if (decl.judge === 'rubric') {
        bar.appendChild(el('span', 'hint', '主观题：提交后对照参考答案自评'));
      }
      var peek = el('button', 'btn ghost', '看答案');
      peek.addEventListener('click', function () { S.shown[q.qid] = true; render(); });
      bar.appendChild(peek);
    } else {
      // 只点过「看答案」还没作答时 rec 为空，别显示成「待自评」
      var vClass = !rec ? 'mid' : (rec.ok === true ? 'ok' : (rec.ok === false ? 'bad' : 'mid'));
      var vText = !rec ? '未作答 · 仅看答案' : (rec.ok === true ? '✓ 答对' : (rec.ok === false ? '✗ 答错' : '待自评'));
      var verdict = el('div', 'verdict ' + vClass);
      verdict.textContent = vText;
      bar.appendChild(verdict);
      if (rec && rec.c != null && rec.ok === false) bar.appendChild(el('span', 'hint', '得分率 ' + Math.round(rec.c * 100) + '%'));
      var again = el('button', 'btn', '重做本题');
      again.addEventListener('click', function () { redoOne(q); });
      bar.appendChild(again);
    }
    var favBtn = el('button', 'btn ghost' + (fav ? ' on' : ''), fav ? '★ 已收藏' : '☆ 收藏');
    favBtn.addEventListener('click', function () {
      site.toggleFav(q._gid);
      render();
    });
    bar.appendChild(favBtn);
    if (rec && site.allWrong()[q._gid]) {
      var sup = el('button', 'btn ghost', '移出错题本');
      sup.addEventListener('click', function () { site.suppress(q._gid); render(); });
      bar.appendChild(sup);
    }
    card.appendChild(bar);

    if (revealed) {
      var exp = el('div', 'exp');
      exp.appendChild(el('div', 'exp-h', '答案与解析'));
      var ansText = answerText(q, decl);
      if (ansText) {
        var a = el('p', 'exp-a');
        a.innerHTML = '<b>答案：</b>' + ansText;
        exp.appendChild(a);
      }
      if (q.exp) {
        var p = el('p', 'exp-p');
        p.innerHTML = view(q, 'exp');
        exp.appendChild(p);
      }
      if (q.meta && q.meta.source) {
        exp.appendChild(el('p', 'exp-src', '来源：' + q.meta.source + (q.meta.paperNo ? ' 第 ' + q.meta.paperNo + ' 题' : '')));
      }
      if (decl.judge === 'rubric' && rec && rec.ok === null) {
        var self = el('div', 'self');
        self.appendChild(el('span', 'hint', '自评：'));
        [['达标', true, null], ['部分达标', false, 0.5], ['未达标', false, 0]].forEach(function (t) {
          var b = el('button', 'btn small', t[0]);
          b.addEventListener('click', function () { selfJudge(q, t[1], t[2]); });
          self.appendChild(b);
        });
        exp.appendChild(self);
      }
      card.appendChild(exp);
    }

    var nav = $('#nav');
    nav.innerHTML = '';
    var prev = el('button', 'btn', '← 上一题');
    prev.disabled = S.idx === 0;
    prev.addEventListener('click', function () { go(S.idx - 1); });
    var next = el('button', 'btn primary', '下一题 →');
    next.disabled = S.idx >= S.list.length - 1;
    next.addEventListener('click', function () { go(S.idx + 1); });
    nav.appendChild(prev);
    if (S.mode === 'wrong' && S.list.length) {
      var all = el('button', 'btn small', '全部重做');
      all.title = '清空本轮在错题本里的作答状态，从头再做一遍';
      all.addEventListener('click', function () {
        S.list.forEach(function (x) { delete S.shown[x.qid]; delete S.draft[x.qid]; S.redo[x.qid] = true; });
        S.idx = 0;
        render();
        flash('已清空本轮作答，从头开始');
      });
      nav.appendChild(all);
    }
    nav.appendChild(el('span', 'nav-mid', (S.idx + 1) + ' / ' + S.list.length));
    nav.appendChild(next);
  }

  function answerText(q, decl) {
    if (decl.answerShape === 'choice') {
      return (q.answer || []).map(function (i) {
        var t = (q.views && q.views.opts && q.views.opts[i] != null) ? q.views.opts[i] : esc(q.options[i]);
        return optionMark(q, i) + '. ' + t;
      }).join('；');
    }
    if (decl.answerShape === 'tokenList') {
      var list = (q.views && q.views.answers && q.views.answers.length) ? q.views.answers : (q.answers || []).map(esc);
      return list.join(' / ');
    }
    return (q.views && q.views.ref) ? q.views.ref : (q.ref ? esc(String(q.ref)) : '');
  }

  /* ------------------------------------------------------------ 交互 */

  // 重新作答一道题：清掉本次会话的揭晓标记与草稿，回到未作答状态
  function redoOne(q) {
    S.redo[q.qid] = true;
    delete S.shown[q.qid];
    delete S.draft[q.qid];
    render();
    flash('已清空，可以重做了');
  }

  function pick(q, decl, i) {
    var cur = (S.draft[q.qid] || []).slice();
    if (decl.judge === 'set') {
      var k = cur.indexOf(i);
      if (k >= 0) cur.splice(k, 1); else cur.push(i);
      S.draft[q.qid] = cur;
      renderCard();
    } else {
      S.draft[q.qid] = [i];
      submit(q, decl);
    }
  }

  function submit(q, decl) {
    var input = { picked: S.draft[q.qid] || [], text: S.draft[q.qid] || '' };
    if (decl.answerShape === 'choice') input = { picked: S.draft[q.qid] || [] };
    else input = { text: S.draft[q.qid] || '' };

    if (decl.answerShape === 'choice' && (!input.picked || !input.picked.length)) {
      flash('先选一个选项');
      return;
    }
    if (decl.answerShape !== 'choice' && !String(input.text).trim()) {
      flash('先写下答案');
      return;
    }

    var res = QB.judge(q, decl, input);
    var patch = { ok: res.ok, at: Date.now(), m: S.mode };
    if (decl.replay === 'mask' && input.picked) patch.p = input.picked;
    if (decl.replay === 'text' && input.text != null) patch.x = String(input.text);
    if (res.credit != null) patch.c = res.credit;
    if (res.ok === null) patch.self = false;

    site.put(q._gid, patch, S.mode);
    delete S.redo[q.qid];
    S.shown[q.qid] = true;
    if (S.mode === 'wrong' && res.ok === true) flash('答对了，已移出错题本');
    render();
  }

  function selfJudge(q, ok, credit) {
    var patch = { ok: ok, at: Date.now(), m: S.mode, self: true };
    if (credit != null) patch.c = credit;
    var rec = site.get(q._gid);
    if (rec && rec.x != null) patch.x = rec.x;
    site.put(q._gid, patch, S.mode);
    delete S.redo[q.qid];
    S.shown[q.qid] = true;
    if (S.mode === 'wrong' && ok === true) flash('答对了，已移出错题本');
    render();
  }

  /* 翻题后不把页面拉回顶部。
     只在题卡顶部已经滚出视野上方（rect.top < 8）时，把它瞬时拉回视野；
     卡片顶部还在视野里就完全不动。用瞬时滚动、不用 smooth——
     平滑滚动会和滑动翻题的滑出动画叠在一起，观感就是「回弹」。 */
  function keepCardInView() {
    var c = $('#card');
    if (!c) return;
    var top = c.getBoundingClientRect().top;
    if (top >= 8) return;
    var y = (window.scrollY || window.pageYOffset || 0) + top - 8;
    window.scrollTo(0, y > 0 ? y : 0);
  }

  function go(i) {
    if (i < 0 || i >= S.list.length) return;
    S.idx = i;
    render();
    keepCardInView();
  }

  var flashTimer = null;
  function flash(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('on');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { t.classList.remove('on'); }, 1600);
  }

  /* ------------------------------------------------------------ 掌握度 */

  function renderMastery() {
    var rows = site.masteryAll().filter(function (r) { return r.n > 0; });
    var box = $('#mastery');
    box.innerHTML = '';
    if (!rows.length) {
      box.appendChild(el('p', 'hint', '还没有作答记录，掌握度会在作答后出现。'));
      return;
    }
    var table = el('table', 'mt');
    var thead = el('thead');
    var tr = el('tr');
    ['知识点', '得分', '状态', '作答数'].forEach(function (h) { tr.appendChild(el('th', null, h)); });
    thead.appendChild(tr);
    table.appendChild(thead);
    var tb = el('tbody');
    rows.forEach(function (r) {
      var tr2 = el('tr');
      tr2.appendChild(el('td', 'mt-t', r.topic));
      tr2.appendChild(el('td', 'mt-s', String(r.score)));
      var lv = el('td');
      lv.appendChild(el('span', 'lv ' + (r.level === '已掌握' ? 'lv-ok' : (r.level === '薄弱' ? 'lv-bad' : 'lv-mid')), r.level));
      tr2.appendChild(lv);
      tr2.appendChild(el('td', 'mt-n', String(r.n)));
      tb.appendChild(tr2);
    });

      site.resetScope(def.units.length === 1 ? 'unit' : 'site', def.units.length === 1 ? def.units[0].key : '');

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>计算机导论 · 第八单元 计算机网络</title>
<style>/* qb-page.css — 题库页面样式（内核共用，不含任何科目特有内容） */
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e4e8ef; --line2:#eef1f6;
  --text:#1e2330; --muted:#5b6373; --muted2:#6b7383;
  --accent:#2f6fed; --accent-ink:#2557c7; --accent-soft:#eaf1ff;
  --ok:#0b6b48; --ok-soft:#e7f7ef; --ok-line:#b7e6cf;
  --bad:#b42318; --bad-soft:#fdecea; --bad-line:#f6c9c4;
  --warn:#b54708; --warn-soft:#fef3e2;
  --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 72px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:14px}
.top h1{font-size:21px;margin:0;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.top .spacer{flex:1}
.home{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:6px 12px;background:#fff}
.home:hover{color:var(--accent);border-color:#c7dbff;text-decoration:none}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.block{padding:14px 16px;margin-bottom:14px}

/* stats */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;margin-bottom:14px}
.stat-k{font-size:12px;color:var(--muted2);letter-spacing:.3px}
.stat-v{font-size:19px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-bar{height:4px;border-radius:3px;background:#eef1f6;margin-top:7px;overflow:hidden}
.stat-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl+.ctl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.seg{display:inline-flex;background:#f1f4fa;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;color:#48505f}
.seg button:hover{color:var(--accent)}
.seg button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
select,input[type=search]{
  font:inherit;font-size:13.5px;color:var(--text);border:1px solid var(--line);background:#fff;
  border-radius:9px;padding:7px 10px;outline:none
}
select:focus,input[type=search]:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=search]{min-width:170px;flex:1}
.btn{
  border:1px solid var(--line);background:#fff;color:#3c4353;border-radius:9px;padding:7px 14px;
  font:inherit;font-size:13.5px;cursor:pointer;transition:.15s
}
.btn:hover:not(:disabled){border-color:#c7dbff;color:var(--accent);background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2557c7;border-color:#2557c7;color:#fff}
.btn.ghost{background:#fff}
.btn.ghost.on{color:#b54708;border-color:#f5dcb4;background:var(--warn-soft)}
.btn.small{padding:5px 11px;font-size:13px}

/* card */
#card{padding:18px 18px 16px;margin-bottom:14px}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fafbfd;white-space:nowrap}
.tag-type{color:var(--accent-ink);border-color:#c7dbff;background:var(--accent-soft)}
.tag-diff.d-0{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.tag-diff.d-1{color:var(--warn);border-color:#f5dcb4;background:var(--warn-soft)}
.tag-diff.d-2{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.q-topic{font-size:12.5px;color:var(--muted2)}
.q-no{margin-left:auto;font-size:12.5px;color:var(--muted2);font-variant-numeric:tabular-nums}
.q-stem{font-size:16.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.q-img{max-width:100%;margin-top:10px;border-radius:8px;border:1px solid var(--line)}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;
  font:inherit;font-size:15px;line-height:1.6;cursor:pointer;transition:.13s;color:var(--text)
}
.opt:hover:not(:disabled){border-color:#c7dbff;background:#fafcff}
.opt:disabled{cursor:default}
.opt-k{
  flex:0 0 24px;height:24px;border-radius:7px;background:#f1f4fa;color:#48505f;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600
}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .opt-k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.right .opt-k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .opt-k{background:var(--bad);color:#fff}

/* inputs */
.in,.ta{
  width:100%;margin-top:14px;font:inherit;font-size:15px;color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;background:#fff;resize:vertical
}
.in:focus,.ta:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
.in:disabled,.ta:disabled{background:#fafbfd;color:var(--muted)}

/* action bar */
.q-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hint{font-size:12.5px;color:var(--muted2)}
.verdict{font-size:14px;font-weight:650;padding:5px 12px;border-radius:999px}
.verdict.ok{color:var(--ok);background:var(--ok-soft)}
.verdict.bad{color:var(--bad);background:var(--bad-soft)}
.verdict.mid{color:var(--warn);background:var(--warn-soft)}

/* explanation */
.exp{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.exp-h{font-size:12.5px;color:var(--muted2);letter-spacing:.4px;margin-bottom:7px}
.exp-a{font-size:14.5px;margin:0 0 8px;padding:10px 12px;background:#f7f9fd;border-radius:9px;border:1px solid var(--line2)}
.exp-p{font-size:14.5px;color:#333a49;margin:0 0 6px;white-space:pre-wrap}
.exp-src{font-size:12px;color:var(--muted2);margin:6px 0 0}
.self{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}

/* nav */
#nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav-mid{flex:1;text-align:center;font-size:13px;color:var(--muted2);font-variant-numeric:tabular-nums}

/* mastery */
#mastery{padding:14px 16px;margin-bottom:14px}
.mt{width:100%;border-collapse:collapse;font-size:13.5px}
.mt th{text-align:left;font-weight:600;color:var(--muted2);font-size:12px;letter-spacing:.3px;padding:0 0 8px;border-bottom:1px solid var(--line2)}
.mt td{padding:7px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
.mt tr:last-child td{border-bottom:0}
.mt-t{color:#333a49}
.mt-s{font-variant-numeric:tabular-nums;font-weight:650;width:56px}
.mt-n{color:var(--muted2);width:56px;text-align:right}
.lv{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.lv-ok{color:var(--ok);background:var(--ok-soft)}
.lv-mid{color:var(--warn);background:var(--warn-soft)}
.lv-bad{color:var(--bad);background:var(--bad-soft)}

/* transfer */
#transfer{padding:14px 16px;margin-bottom:14px}
#x-code{width:100%;min-height:86px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:10px;resize:vertical;background:#fafbfd;color:#333a49}
#x-info{font-size:12.5px;color:var(--muted2);margin-top:8px;min-height:18px}
.x-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* misc */
.empty{padding:34px 8px;text-align:center}
.empty-t{font-size:15.5px;font-weight:600}
.empty-s{color:var(--muted2);font-size:13.5px;margin:6px 0 0}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:#1e2330;color:#fff;font-size:13.5px;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--muted2);font-size:12px;text-align:center;margin-top:18px;line-height:1.8}

@media (max-width:640px){
  .wrap{padding:14px 12px 64px}
  #stats{grid-template-columns:repeat(2,1fr)}
  .top h1{font-size:18.5px}
  .q-stem{font-size:16px}
  .opt{font-size:14.5px}
  input[type=search]{min-width:100%}
}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;
}
mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */
.q-stem mjx-container[display="true"],
.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */

  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;

mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;

/* 行间公式在窄屏可横向滚动，不撑破卡片 */

</style>
</head>

具吸引力」指的是资源共享。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-003","type":"single","topic":"8.1 计算机网络的定义与功能","diff":"中","stem":"计算机网络能实现的功能主要有（　）。","options":["排序与查找","编译与解释","编码与解码","数据通信与资源共享"],"answer":[3],"exp":"计算机网络的两大功能是数据通信（分散在不同地点甚至不同国家的计算机之间传送数据、交换信息）与资源共享（共享软件、硬件与数据资源）。其余三项分别是语言翻译、字符编码、算法层面的概念。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-004","type":"single","topic":"8.1 计算机网络的定义与功能","diff":"易","stem":"计算机网络中，计算机之间交换数据所遵守的规则、标准或约定称为（　）。","options":["协议","接口","拓扑","带宽"],"answer":[0],"exp":"协议（protocol）是通信双方必须遵守的一组信息交换规则，规定数据的格式、传输顺序以及出错时的处理方式。没有共同协议，两台机器即使物理连通也无法通信。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-005","type":"single","topic":"8.1 计算机网络的定义与功能","diff":"中","stem":"下列不属于计算机网络功能的是（　）。","options":["共享网络中的软件与硬件资源","实现分散计算机之间的数据通信","为计算机提供电源","共享网络中的数据资源"],"answer":[2],"exp":"供电是电源系统的职责，与网络无关。网络的功能集中在数据通信与资源共享（软件、硬件、数据）两方面。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-006","type":"multi","topic":"8.1 计算机网络的定义与功能","diff":"中","stem":"计算机网络的功能包括（　）。","options":["数据通信","软件资源共享","硬件资源共享","提高 CPU 主频"],"answer":[0,1,2],"exp":"前三项都是计算机网络的功能。提高 CPU 主频取决于处理器本身与散热、供电，与网络无关。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-007","type":"multi","topic":"8.1 计算机网络的定义与功能","diff":"中","stem":"关于网络协议，说法正确的有（　）。","options":["没有协议，物理连通也无法通信","协议由用户在使用时临时约定","是通信双方必须遵守的约定","规定数据的格式与传输顺序"],"answer":[0,2,3],"exp":"协议是标准化的约定，规定数据格式、传输顺序与差错处理，必须双方一致才能通信，因此不可能由用户临时约定。Internet 采用的标准协议族是 TCP/IP。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-008","type":"fill","topic":"8.1 计算机网络的定义与功能","diff":"易","stem":"计算机网络的目标是 ____ 和资源共享。","answers":["数据通信","通信"],"exp":"这是课件上的课上填空题：计算机网络的目标是数据通信和资源共享。两者一个解决「能传」，一个解决「能共用」。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）· 课上真题"},"_unit":"u8"},{"qid":"cs.u8-009","type":"short","topic":"8.1 计算机网络的定义与功能","diff":"中","stem":"什么是计算机网络？它有哪些主要功能？","ref":"计算机网络是将地理上分散的计算机（或其他智能设备）和设备用通信线路互联起来，实现互相通信、资源共享的复杂集合。主要功能：①数据通信——使分散在不同部门、不同地区甚至不同国家的计算机相互通信、传送数据、交换信息；②资源共享——用户可共享网络中其他计算机的软件、硬件和数据资源，且不受资源地理位置的限制，这是网络最具吸引力的功能。此外网络还带来高可靠性（资源冗余）与分布处理能力。","exp":"采分点：定义中的「地理分散 + 通信线路互联 + 通信与共享」；两大功能；指出资源共享最具吸引力。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-010","type":"comp","topic":"8.1 计算机网络的定义与功能","diff":"中","stem":"某实验室有 20 台计算机、1 台激光打印机、1 台文件服务器。说明联网后可以共享哪些资源，各举一例并指出共享带来的直接好处。","ref":"硬件共享：20 台机器共用 1 台激光打印机，不必每台配一台打印机，节省采购与维护成本。\n软件共享：共用文件服务器上的正版软件安装包与许可证，避免重复购买。\n数据共享：共用服务器上的实验数据与文档，任何人修改后其他人立即看到最新版本，避免各自保存副本导致版本不一致。\n数据通信：机器之间可直接传送文件、发送消息，不必用移动存储介质拷贝。\n归纳：资源共享的直接好处是降低总成本、提高资源利用率、保证数据一致性；数据通信则提高了协作效率。","exp":"采分点：①区分硬件/软件/数据三类共享并各举一例；②说明成本、利用率、一致性方面的好处；③提到数据通信。只罗列「可以共享打印机」不给满分。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-011","type":"single","topic":"8.2 计算机网络的分类","diff":"易","stem":"按覆盖范围划分，计算机网络可分为（　）。","options":["总线型、环型、星型","局域网、城域网、广域网","有线网、无线网、卫星网","公用网、专用网、虚拟网"],"answer":[1],"exp":"按覆盖范围分为局域网（几公里内）、城域网（城市范围）、广域网（几十到几千公里）。总线型、环型、星型是按拓扑结构分类。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-012","type":"single","topic":"8.2 计算机网络的分类","diff":"易","stem":"局域网的覆盖范围通常是（　）。","options":["一个城市范围","较小的地理范围，如几公里内","一个国家或横跨几个洲","全球范围"],"answer":[1],"exp":"局域网规模较小，局限于较小的地理范围（如几公里），典型例子是校园网、企业网、公司内部网。城域网覆盖城市，广域网覆盖国家甚至跨洲。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-013","type":"single","topic":"8.2 计算机网络的分类","diff":"中","stem":"城域网的主要作用是（　）。","options":["把一个机房内的服务器互联","把全球的计算机互联起来","在几米范围内连接外设","由网络运营商在城市范围内组建高速宽带网络，把大量局域网和个人计算机高速接入 Internet"],"answer":[3],"exp":"城域网（市域网）是网络运营商在城市范围内组建的高速宽带网络，起「汇聚接入」的作用：把城区内大量局域网与个人计算机高速接入 Internet。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-014","type":"single","topic":"8.2 计算机网络的分类","diff":"易","stem":"覆盖范围从几十公里到几千公里、往往覆盖一个国家或横跨几个洲的网络是（　）。","options":["广域网","城域网","局域网","个域网"],"answer":[0],"exp":"广域网覆盖范围从几十公里到几千公里甚至更大，往往覆盖一个国家、地区或横跨几个洲。Internet 就是世界上最大的广域网。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-015","type":"single","topic":"8.2 计算机网络的分类","diff":"易","stem":"Internet 属于（　）。","options":["一个城域网","世界上最大的局域网","世界上最大的广域网","一个个人区域网"],"answer":[2],"exp":"Internet 把全球的计算机网络互联起来，覆盖范围跨越国家与大洲，是世界上最典型的广域网（WAN）。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-016","type":"single","topic":"8.2 计算机网络的分类","diff":"易","stem":"一所大学校园内的网络属于（　）。","options":["城域网","局域网","广域网","国际网"],"answer":[1],"exp":"校园网、企业网、公司内部网都是局域网的典型例子：覆盖范围限于几公里内，由单位自行建设与管理。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-017","type":"multi","topic":"8.2 计算机网络的分类","diff":"中","stem":"按覆盖范围划分，计算机网络包括（　）。","options":["总线网","局域网","城域网","广域网"],"answer":[1,2,3],"exp":"按覆盖范围分为局域网、城域网、广域网三类。总线网是按拓扑结构划分出的一类，与覆盖范围不是同一个分类维度。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-018","type":"multi","topic":"8.2 计算机网络的分类","diff":"中","stem":"关于局域网的说法正确的有（　）。","options":["通常由单位自行建设和管理","Internet 本身就是一个局域网","覆盖范围较小，通常在几公里以内","校园网、企业网属于局域网"],"answer":[0,2,3],"exp":"局域网范围小、由单位自建自管，校园网与企业网是典型代表。Internet 是全球范围的广域网，不是局域网。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-019","type":"fill","topic":"8.2 计算机网络的分类","diff":"中","stem":"覆盖范围从几十公里到几千公里、往往覆盖一个国家或横跨几个洲的网络称为 ____。","answers":["广域网","WAN","wide area network"],"exp":"广域网（WAN）覆盖国家、地区甚至跨洲，Internet 是最大的广域网。与之相对，局域网（LAN）限于几公里，城域网（MAN）覆盖城市范围。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-020","type":"fill","topic":"8.2 计算机网络的分类","diff":"中","stem":"网络运营商在城市范围内组建、用于把大量局域网和个人计算机高速接入 Internet 的高速宽带网络称为 ____。","answers":["城域网","MAN","市域网"],"exp":"城域网（MAN，也称市域网）起城市范围内的汇聚接入作用，是局域网与广域网之间的中间层次。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-021","type":"short","topic":"8.2 计算机网络的分类","diff":"中","stem":"比较局域网、城域网、广域网。","ref":"①覆盖范围：局域网限于几公里内；城域网覆盖一个城市；广域网从几十公里到几千公里，可覆盖国家或跨洲。②典型例子：局域网如校园网、企业网、公司内部网；城域网是运营商在城市内组建的宽带接入网；广域网如 Internet，是世界上最大的广域网。③建设与管理：局域网多由单位自建自管；城域网由网络运营商建设运营；广域网通常由多个运营商与机构共同互联。④传输速率与误码率：一般局域网速率最高、误码率最低，广域网相对较低。","exp":"采分点：范围、例子、建设主体三项中答出两项即可，速率对比是加分项。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-022","type":"comp","topic":"8.2 计算机网络的分类","diff":"中","stem":"判断下列网络属于局域网、城域网还是广域网，并说明理由：①一间实验室内 30 台计算机互联；②某市运营商把全市家庭宽带汇聚后接入 Internet；③一所高校的北京校区与云南校区之间通过专线互联；④Internet。","ref":"①局域网：范围限于一间实验室（几十米），由实验室或学院自建。\n②城域网：由运营商在城市范围内组建，作用是把大量局域网与个人计算机高速接入 Internet。\n③广域网：跨省互联，距离数千公里，通常租用运营商专线实现，属广域网范畴。\n④广域网：覆盖全球、跨越国家与大洲，是世界上最典型的广域网。\n判断依据可归纳为「覆盖范围 + 建设主体」：几公里内自建为局域网，城市内运营商汇聚为城域网，跨城市乃至跨洲为广域网。","exp":"采分点：四个判断全对，理由落在「覆盖范围」与「建设主体」上。③最易错判为局域网（因为是同一所学校），但跨省即超出局域网范围。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-023","type":"single","topic":"8.3 网络拓扑结构","diff":"易","stem":"网络拓扑结构是指（　）。","options":["网络中计算机之间的物理连接方式","网络中传输的数据格式","网络的传输速率","网络中计算机的数量"],"answer":[0],"exp":"网络拓扑（Network Topology）指网络中计算机之间的物理连接方式，常见的有总线型、环型、星型三种。它决定数据如何在节点之间传递，也决定故障的影响范围。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-024","type":"single","topic":"8.3 网络拓扑结构","diff":"中","stem":"总线型拓扑中，所有节点连接到（　）。","options":["一个中央控制器上","一条公共电缆线上","一个闭合的环上","各自独立的线路上"],"answer":[1],"exp":"总线型拓扑把所有节点接到一条公共电缆上，这条电缆称为总线。发出的消息向总线两端传输、广播到整个网络，各节点判断消息是否发给自己。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-025","type":"single","topic":"8.3 网络拓扑结构","diff":"中","stem":"环型拓扑中，数据在环路上的传输方式是（　）。","options":["随机选择方向传输","向两端广播","由中央节点统一转发","按统一方向单向传输，绕环一周"],"answer":[3],"exp":"环型拓扑中所有设备串行连接成回路，数据按统一方向单向传输，绕环一周；节点检测经过的消息，是给自己的就接收，否则传给下一个节点。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-026","type":"single","topic":"8.3 网络拓扑结构","diff":"中","stem":"星型拓扑中，所有节点之间的通信都必须经过（　）。","options":["中央节点（中央控制器）","总线","环上的下一个节点","路由器"],"answer":[0],"exp":"星型拓扑把所有节点连接到中央控制器，各工作站之间的通信由中央控制器统一控制，采用中央集权方式，控制性好、容易查找故障点；但中央控制器故障会导致整个网络瘫痪。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-027","type":"single","topic":"8.3 网络拓扑结构","diff":"中","stem":"当网络中任何一个工作站发生故障时，都有可能导致整个网络停止工作，这种网络的拓扑结构是（　）。","options":["总线型","星型","环型","网状型"],"answer":[2],"exp":"环型拓扑中所有设备串行连接成一个回路，任一段线路中断或任一节点故障都会破坏环路，使整个网络无法正常运作，而且不容易查找故障点。星型是中央节点故障才全网瘫痪，总线型是总线断开才影响全网。","meta":{"source":"第 8 章课件（8-计算机网络.pptx）· 课上真题","optperm":true},"_unit":"u8"},{"qid":"cs.u8-028","type":"single","topic":"8.3 网络拓扑结构","diff":"中","stem":"星型拓扑最主要的优点是（　）。","options":["线路长度最短、成本最低","容易查找故障点，控制性好","不需要中央节点","任一节点故障不影响其他节点通信"],"answer":[1],"exp":"星型采用中央集权方式，各节点通信都经中央节点，因此控制性好、故障定位容易——某节点不通只需查它到中央节点那一段。代价是中央节点一旦故障全网瘫痪。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-029","type":"multi","topic":"8.3 网络拓扑结构","diff":"中","stem":"总线型拓扑的特点有（　）。","options":["任一节点故障都会导致全网瘫痪","所有发出的消息向总线两端传输，广播到整个网络","共享信道，每个时刻只允许一个节点发送数据","线路长度较短，增删节点方便，成本较低"],"answer":[1,2,3],"exp":"总线型采用广播式共享信道，同一时刻只允许一个节点发送，线路短、增删方便、成本低。但单个节点故障通常不影响全网（只是该节点失去通信能力），导致全网瘫痪的是总线本身断开。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-030","type":"fill","topic":"8.3 网络拓扑结构","diff":"中","stem":"所有网络节点连接到一条公共电缆线上、消息向两端广播的拓扑结构称为 ____。","answers":["总线型","总线","bus"],"exp":"总线型拓扑的公共电缆称为总线，采用共享信道、广播传输，多用于早期局域网。优点是线路短、增删方便、成本低。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-031","type":"fill","topic":"8.3 网络拓扑结构","diff":"中","stem":"所有设备彼此串行连接成回路、数据按统一方向单向传输的拓扑结构称为 ____。","answers":["环型","环形","ring"],"exp":"环型拓扑的数据沿环路单向传输，绕环一周。它的致命弱点是任一段线路中断或任一节点故障都会影响整个网络，且故障点不易查找。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-032","type":"short","topic":"8.3 网络拓扑结构","diff":"中","stem":"比较总线型、环型、星型三种拓扑结构的优缺点。","ref":"①总线型：所有节点接在一条公共总线上，消息向两端广播，共享信道、同一时刻只允许一个节点发送。优点：线路长度短、增删节点方便、工作可靠、方法简单、成本低。缺点：总线一旦断开全网瘫痪，节点增多时冲突加剧、性能下降。\n②环型：设备串行连接成回路，数据单向绕环传输。优点：传输方向确定、控制简单，适合光纤。缺点：任一段线路中断或任一节点故障都会影响整个网络，故障点不易查找。\n③星型：所有节点连到中央控制器，通信经中央节点转发。优点：中央集权、控制性好、容易查找故障点。缺点：中央控制器故障将导致整个网络瘫痪，且线路用量大。","exp":"采分点：三种拓扑的结构、优点、缺点各一句。三者共同的比较维度是「故障影响范围」——总线看总线、环型看任一节点、星型看中央节点。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-033","type":"comp","topic":"8.3 网络拓扑结构","diff":"中","stem":"某办公室有 12 台计算机，要求任一台机器出故障时不影响其他机器通信，且故障要容易定位；另一个车间环境恶劣、布线困难，只希望用尽量短的线缆把 8 台设备连起来。分别推荐哪种拓扑，并说明理由。","ref":"办公室推荐星型：所有机器接到一台交换机（中央节点），单台机器故障或网线损坏只影响该机器，其余通信不受影响；且故障定位容易——哪台不通就查它到交换机那一段。代价是交换机故障会全网瘫痪，可通过备用交换机缓解。\n车间推荐总线型：一条公共电缆贯穿各设备，线路总长度最短、布线简单、成本低，增删节点也方便。但要注意总线一旦断开会导致全网瘫痪，因此需做好线缆防护与固定。\n若车间对可靠性要求高，可改用星型并做冗余；拓扑选择本质上是「布线成本」与「故障影响范围」之间的权衡。","exp":"采分点：①两个场景各给出正确拓扑；②理由落在「故障影响范围」「故障定位」「布线成本」上；③指出所选拓扑的代价。只写拓扑名称不得分。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-034","type":"comp","topic":"8.3 网络拓扑结构","diff":"难","stem":"某环型网络有 6 个节点，采用单向传输。若节点 3 与节点 4 之间的线路被挖断，分析网络会发生什么情况，并说明如何改进。","ref":"情况分析：环型拓扑的可靠性依赖环路的完整性。节点 3 与 4 之间断开后，环路被切成一条链，数据无法绕行回到起点。若协议要求令牌绕环一周才能完成一次发送，则令牌无法回到发起节点，全网通信随即停止；即使采用某种单向传递方式，节点 4、5、6 与 1、2、3 之间的通信也全部中断，受影响的是整网而不是个别节点。此外断点位置难以从现象上判断，排障困难。\n改进：①采用双环结构（如 FDDI），主环断开时数据自动绕到备用环，形成自愈；②在关键位置加装旁路开关，故障节点或线段被自动短接；③改用星型或交换式以太网，把故障影响范围限制在单条链路；④增加链路监测与告警，缩短故障定位时间。","exp":"采分点：①指出环型断链导致全网失效（不是局部）；②说明令牌无法绕环的机制；③给出双环/旁路/改星型等改进方案。只答「网络断了」不得分。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-035","type":"single","topic":"8.4 OSI 参考模型","diff":"易","stem":"OSI 参考模型是由（　）制定的。","options":["国际标准化组织 ISO","美国国防部","国际电信联盟 ITU","电气电子工程师学会 IEEE"],"answer":[0],"exp":"OSI/RM（开放系统互联参考模型）由国际标准化组织 ISO（International Organization for Standardization）制定，是用于说明任意两个不同网络系统如何进行通信的理论模型。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-036","type":"single","topic":"8.4 OSI 参考模型","diff":"易","stem":"OSI/RM 协议模型将计算机网络体系结构的通信协议规定为（　）。","options":["3 层","4 层","5 层","7 层"],"answer":[3],"exp":"OSI/RM 分七层，自上而下为应用层、表示层、会话层、传输层、网络层、数据链路层、物理层。四层是 TCP/IP 模型，五层是教学中常用的折中模型。","meta":{"source":"第 8 章课件（8-计算机网络.pptx）· 课上真题","optperm":true},"_unit":"u8"},{"qid":"cs.u8-037","type":"single","topic":"8.4 OSI 参考模型","diff":"易","stem":"OSI 七层模型自上而下的顺序是（　）。","options":["应用层、表示层、会话层、传输层、网络层、数据链路层、物理层","物理层、数据链路层、网络层、传输层、会话层、表示层、应用层","应用层、会话层、表示层、传输层、网络层、数据链路层、物理层","应用层、表示层、传输层、会话层、网络层、物理层、数据链路层"],"answer":[0],"exp":"自上而下：应用、表示、会话、传输、网络、数据链路、物理，口诀「应表会传网数物」。自下而上则是完全相反的顺序。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-038","type":"single","topic":"8.4 OSI 参考模型","diff":"易","stem":"OSI 模型中，负责在物理介质中传输位流的是（　）。","options":["网络层","数据链路层","物理层","传输层"],"answer":[2],"exp":"物理层把 0、1 比特编码成线缆或信道上可传输的电信号、光信号，在物理介质上传输位流。它处理的是「比特」，关心电压、接口、传输介质等物理特性。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-039","type":"single","topic":"8.4 OSI 参考模型","diff":"易","stem":"把位组成帧、并加入物理地址信息的是（　）。","options":["物理层","数据链路层","网络层","传输层"],"answer":[1],"exp":"数据链路层把上层数据加上报头和报尾封装成帧，其中包含相邻站点的网卡物理地址（MAC 地址），负责两个相邻站点之间的点对点传递，并提供检错与重发。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-040","type":"single","topic":"8.4 OSI 参考模型","diff":"易","stem":"OSI 模型中，负责源站点与目的站点之间「包」的传送、并进行路由选择的是（　）。","options":["会话层","数据链路层","传输层","网络层"],"answer":[3],"exp":"网络层给上层信息加上含源、目的 IP 地址（逻辑地址）的报头形成「包」，通过路由选择与逻辑寻址，把包从源站点逐节点转发到目的站点。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-041","type":"single","topic":"8.4 OSI 参考模型","diff":"易","stem":"OSI 模型中，负责整个消息端到端传送的是（　）。","options":["传输层","网络层","会话层","应用层"],"answer":[0],"exp":"传输层把消息看成完整实体，负责整个消息从源到目的地的传送：分段、重组、差错检验与纠正、流量控制。网络层只管各独立包的端到端传送，传输层管整个消息。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-042","type":"single","topic":"8.4 OSI 参考模型","diff":"易","stem":"OSI 模型中，负责建立、保持和同步会话，并设置同步点的是（　）。","options":["传输层","表示层","会话层","应用层"],"answer":[2],"exp":"会话层控制用户间的会话：建立、保持与同步。它设置同步点，把长消息分成较短的部分，重发时只需从最后一个同步点开始，不必从头再来。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-043","type":"single","topic":"8.4 OSI 参考模型","diff":"易","stem":"OSI 模型中，负责解决信息语法与语义问题、并进行压缩与加密的是（　）。","options":["会话层","表示层","应用层","传输层"],"answer":[1],"exp":"表示层解决两个系统间交换信息的语法（格式）和语义（编码）差异，并进行压缩/解压缩、加密/解密，使不同体系的主机能互相理解数据。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-044","type":"single","topic":"8.4 OSI 参考模型","diff":"易","stem":"OSI 模型中，直接为用户的应用进程提供网络服务的是（　）。","options":["传输层","表示层","会话层","应用层"],"answer":[3],"exp":"应用层是七层中的最高层，是「人机交互界面」，为用户提供应用接口，使用户能方便地开发应用、访问网络，产生网络传输的原始数据。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-045","type":"single","topic":"8.4 OSI 参考模型","diff":"中","stem":"OSI 各层处理的数据单元，从下到上依次是（　）。","options":["比特、帧、包、段","帧、比特、段、包","包、帧、比特、段","比特、包、帧、段"],"answer":[0],"exp":"物理层处理比特，数据链路层组成帧，网络层形成包（分组），传输层形成段（报文段）。数据单元的变化正是逐层封装的结果。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-046","type":"single","topic":"8.4 OSI 参考模型","diff":"难","stem":"发送主机与接收主机的数据处理方向分别是（　）。","options":["双方都自下而上","双方都自上而下","发送方自上而下逐层封装，接收方自下而上逐层解封装","发送方自下而上，接收方自上而下"],"answer":[2],"exp":"发送时数据从应用层向下传递，每层加自己的首部（封装）；接收时从物理层向上传递，每层拆掉对应首部（解封装），最后还原成原始数据。对等层之间是逻辑通信，下层为上层提供服务。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-047","type":"multi","topic":"8.4 OSI 参考模型","diff":"中","stem":"关于 OSI 参考模型，说法正确的有（　）。","options":["是说明不同网络系统如何通信的理论模型","是 Internet 实际使用的协议族","由国际标准化组织 ISO 制定","共分七层"],"answer":[0,2,3],"exp":"OSI 由 ISO 制定、共七层，是理论上的参考模型，用于说明任意两个不同网络系统如何通信。Internet 实际使用的是 TCP/IP 协议族，OSI 主要起教学与对照作用。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-048","type":"multi","topic":"8.4 OSI 参考模型","diff":"中","stem":"传输层与网络层的区别有（　）。","options":["传输层使用 MAC 地址，网络层使用 IP 地址","传输层负责整个消息的端到端传送，网络层负责各独立包的端到端传送","传输层保证消息完整正确送达，网络层负责寻址与路由选择","传输层把消息分段后交给网络层，网络层逐包转发"],"answer":[1,2,3],"exp":"传输层面向整个消息（分段、重组、差错与流量控制），网络层面向单个包（逻辑寻址与路由）。使用 MAC 地址的是数据链路层，不是传输层。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-049","type":"fill","topic":"8.4 OSI 参考模型","diff":"中","stem":"OSI 七层模型自下而上依次为：物理层、数据链路层、____、传输层、会话层、表示层、应用层。","answers":["网络层"],"exp":"自下而上：物理、数据链路、网络、传输、会话、表示、应用。口诀「应表会传网数物」是自上而下的顺序，反过来即自下而上。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-050","type":"fill","topic":"8.4 OSI 参考模型","diff":"中","stem":"数据链路层把位组成逻辑单元，这个单元称为 ____。","answers":["帧","frame","数据帧"],"exp":"数据链路层在数据前后加报头和报尾，形成帧，其中含有相邻站点的网卡物理地址与校验信息。帧是链路层处理的数据单元。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-051","type":"fill","topic":"8.4 OSI 参考模型","diff":"易","stem":"物理层传输的数据单位是 ____。","answers":["比特","位","bit","位流"],"exp":"物理层把 0、1 比特编码成电信号或光信号在介质上传输，因此其数据单位就是比特（位）。比特流是最底层的传输形态。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-052","type":"short","topic":"8.4 OSI 参考模型","diff":"中","stem":"简述 OSI 参考模型各层的主要功能。","ref":"①物理层：在物理介质中传输位流，把比特编码成电信号或光信号。②数据链路层：把位组成帧，加入相邻站点的物理地址与校验信息，负责相邻站点间的点对点传递，并提供检错与重发。③网络层：加上含源、目的 IP 地址的报头形成包，通过路由选择把包从源站点转发到目的站点。④传输层：负责整个消息的端到端传送，分段、重组、差错检验与流量控制。⑤会话层：建立、保持和同步会话，设置同步点以便断点续传。⑥表示层：解决信息的语法与语义差异，完成压缩与加解密。⑦应用层：为用户提供应用接口，产生网络传输的原始数据。","exp":"采分点：七层名称与功能一一对应。最易混淆的是传输层与网络层（整个消息 vs 单个包）、表示层与会话层（格式转换 vs 会话管理）。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-053","type":"short","topic":"8.4 OSI 参考模型","diff":"中","stem":"说明数据的封装与解封装过程，以及「对等层通信」的含义。","ref":"封装：发送主机把数据自上而下逐层传递，每经过一层就加上该层的首部（数据链路层还加报尾），形成该层的协议数据单元——应用数据 → 传输层的段 → 网络层的包 → 链路层的帧 → 物理层的比特流。\n解封装：接收主机自下而上逐层处理，每层拆掉对应首部并交给上一层，最后还原出原始数据。\n对等层通信：发送方的第 N 层在逻辑上只与接收方的第 N 层通信（如发送方传输层与接收方传输层对话），实际上数据要逐层下传到物理介质、再逐层上传，中间经过下层的服务。上层的数据对下层而言都只是「数据」。","exp":"采分点：①封装方向与逐层加首部；②解封装方向与逐层去首部；③对等层的「逻辑通信」与实际「逐层传递」的区分。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-054","type":"comp","topic":"8.4 OSI 参考模型","diff":"难","stem":"用户在微信中发送一条消息给好友，消息从本机发出到对方收到，按 OSI 七层模型说明数据在各层的处理过程。","ref":"发送方（自上而下封装）：①应用层——用户在微信中输入消息，产生原始数据；②表示层——对消息编码（如 UTF-8）、必要时压缩与加密；③会话层——建立并维护与对方的会话，必要时设置同步点；④传输层——把消息分段并编号，加上端口号，保证完整有序送达；⑤网络层——为每个段加上源、目的 IP 地址形成包，通过路由选择确定转发路径；⑥数据链路层——加上相邻站点的 MAC 地址与校验信息形成帧；⑦物理层——把帧变成电信号或光信号，通过介质发送出去。\n中间网络：路由器主要在網絡层工作，逐跳转发包，每经过一跳重新封装链路层帧（MAC 地址改变，IP 地址不变）。\n接收方（自下而上解封装）：①物理层收到信号还原为比特；②链路层校验并拆帧；③网络层拆包、检查目的 IP；④传输层按序号重组消息并确认；⑤会话层维持会话；⑥表示层解密、解压、解码；⑦应用层把消息呈现给微信，好友看到内容。","exp":"采分点：①发送方七层自上而下各一句处理；②指出 MAC 逐跳改变、IP 保持不变；③接收方自下而上解封装。只写「分层传输」不得分。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-055","type":"single","topic":"8.5 TCP/IP 体系结构","diff":"中","stem":"TCP/IP 模型分为（　）层。","options":["7","4","5","3"],"answer":[1],"exp":"TCP/IP 模型分四层：应用层、传输层、网络互连层、网络接口层（自下而上为网络接口层、网络互连层、传输层、应用层）。OSI 是七层。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-056","type":"single","topic":"8.5 TCP/IP 体系结构","diff":"易","stem":"TCP/IP 四层模型自上而下的顺序是（　）。","options":["应用层、传输层、网络互连层、网络接口层","应用层、网络互连层、传输层、网络接口层","网络接口层、传输层、网络互连层、应用层","物理层、数据链路层、网络层、应用层"],"answer":[0],"exp":"自上而下：应用层、传输层、网络互连层（网际层）、网络接口层。每一层调用下一层提供的协议来完成自己的需求。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-057","type":"single","topic":"8.5 TCP/IP 体系结构","diff":"中","stem":"TCP/IP 协议族包含的协议数量约为（　）。","options":["2 个","100 多个","10 个以内","1000 多个"],"answer":[1],"exp":"TCP/IP 是一个协议族，包含 100 多个协议，其中 TCP（传输控制协议）和 IP（网际协议）是两个最基本、最重要的协议，协议族也因此得名。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-058","type":"single","topic":"8.5 TCP/IP 体系结构","diff":"中","stem":"TCP/IP 协议族中最基本、最重要的两个协议是（　）。","options":["UDP 和 ARP","HTTP 和 FTP","SMTP 和 DNS","TCP 和 IP"],"answer":[3],"exp":"TCP（传输控制协议）与 IP（网际协议）是协议族中最基本、最重要的两个，分别工作在传输层与网络互连层。TCP/IP 这个名称即由两者组合而来。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-059","type":"single","topic":"8.5 TCP/IP 体系结构","diff":"中","stem":"TCP/IP 模型传输层使用的主要协议是（　）。","options":["TCP 或 UDP","IP","HTTP","以太网"],"answer":[0],"exp":"传输层把数据封装为 TCP 数据段或 UDP 数据报，在两个应用程序之间传送数据：TCP 面向连接、可靠；UDP 无连接、开销小。IP 在网络互连层，HTTP 在应用层。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-060","type":"single","topic":"8.5 TCP/IP 体系结构","diff":"中","stem":"SMTP、HTTP、FTP 属于 TCP/IP 模型的（　）。","options":["网络互连层","传输层","应用层","网络接口层"],"answer":[2],"exp":"SMTP（简单邮件传输）、HTTP（超文本传输）、FTP（文件传输）都是应用程序之间的通信协议，工作在应用层。它们依赖下层的 TCP 或 UDP 提供服务。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-061","type":"multi","topic":"8.5 TCP/IP 体系结构","diff":"中","stem":"关于 TCP/IP 模型各层对应协议，正确的有（　）。","options":["传输层包括 TCP 与 UDP","网络互连层主要是 IP","网络接口层主要是 HTTP","应用层包括 SMTP、HTTP、FTP 等"],"answer":[0,1,3],"exp":"前三项对应关系正确。HTTP 是应用层的超文本传输协议，不在网络接口层——网络接口层对应的是以太网、FDDI、X.25、ATM 等。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-062","type":"fill","topic":"8.5 TCP/IP 体系结构","diff":"中","stem":"TCP/IP 四层模型自下而上依次为：网络接口层、____、传输层、应用层。","answers":["网络互连层","网际层","网络层"],"exp":"TCP/IP 的四层是网络接口层、网络互连层（网际层）、传输层、应用层。网络互连层的主要协议是 IP，负责寻址与路由转发。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-063","type":"fill","topic":"8.5 TCP/IP 体系结构","diff":"中","stem":"TCP/IP 网络互连层的主要协议是 ____，负责把数据报从发送方通过物理网络传送到接收方。","answers":["IP","网际协议","Internet Protocol"],"exp":"网络互连层的核心是 IP 协议：为数据加上源、目的 IP 地址，完成寻址、路由选择与数据转发。TCP/IP 中的 IP 地址即由该层使用。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-064","type":"short","topic":"8.5 TCP/IP 体系结构","diff":"中","stem":"比较 OSI 参考模型与 TCP/IP 模型。","ref":"①层数：OSI 为七层，TCP/IP 为四层。②对应关系：TCP/IP 的应用层大致对应 OSI 的应用层、表示层、会话层三层；传输层对应传输层；网络互连层对应网络层；网络接口层对应数据链路层与物理层。③性质：OSI 是先有模型后有实现的国际标准，偏理论、结构严谨但复杂；TCP/IP 是先有实现（ARPANET）后总结成模型，实用、简洁，是 Internet 实际使用的协议族。④应用：OSI 主要用于教学与对照分析，TCP/IP 是事实上的工业标准。","exp":"采分点：层数、对应关系、理论与实践之分三点。能把「应用层吸收了三层」说清楚是关键。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-065","type":"comp","topic":"8.5 TCP/IP 体系结构","diff":"中","stem":"一封电子邮件从发送方主机经以太网发出，说明数据在 TCP/IP 四层中逐层封装的过程与各层的数据单元名称。","ref":"①应用层：邮件正文与信头作为应用数据（报文），由 SMTP 处理。②传输层：应用数据被封装为 1 个或多个 TCP 数据段（报文段），加上源/目的端口号，保证可靠有序。③网络互连层：TCP 段被封装为 IP 数据报，加上源/目的 IP 地址，由 IP 完成寻址与路由。④网络接口层：IP 数据报被封装成以太网帧（加 MAC 地址与校验），转换为比特流在物理介质上传输。\n接收方反向逐层解封装：以太网帧 → IP 数据报 → TCP 段 → 应用数据，最后交给邮件客户端显示。","exp":"采分点：四层封装顺序、各层数据单元（报文/段/数据报/帧）、端口号与 IP 地址分别在哪层加入。把 IP 地址说成链路层加入是常见错误。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-066","type":"single","topic":"8.6 IP 地址与域名","diff":"易","stem":"IPv4 规定每个 IP 地址使用（　）表示。","options":["8 个字节（64 个二进位）","4 个字节（32 个二进位）","16 个字节（128 个二进位）","2 个字节（16 个二进位）"],"answer":[1],"exp":"IPv4 地址为 32 位二进制数，即 4 个字节，通常写成 4 个用圆点隔开的十进制数（点分十进制）。128 位、16 字节是 IPv6。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-067","type":"single","topic":"8.6 IP 地址与域名","diff":"中","stem":"IP 地址由（　）两部分组成。","options":["协议号与校验号","国家号与地区号","端口号与进程号","网络号与主机号"],"answer":[3],"exp":"IP 地址包含网络号（NET ID）与主机号（HOST ID）：前者标识主机所从属的物理网络，后者标识该网络中的具体主机。同一网络内主机号不同、网络号相同。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-068","type":"single","topic":"8.6 IP 地址与域名","diff":"易","stem":"把 32 位二进制 IP 地址写成 4 个用圆点隔开的十进制数，这种表示法称为（　）。","options":["点分十进制表示法","冒分十六进制表示法","二进制表示法","八进制表示法"],"answer":[0],"exp":"点分十进制便于人读写，32 位二进制便于计算机存储与运算，两者是同一地址的两种表示。IPv6 采用冒分十六进制。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-069","type":"single","topic":"8.6 IP 地址与域名","diff":"易","stem":"A 类 IP 地址的第一个字节范围是（　）。","options":["192～223","128～191","1～126","224～239"],"answer":[2],"exp":"A 类首字节 1～126（0 与 127 保留），网络号 7 位、可用网络 126 个，主机号 24 位、每个网络约 1677 万台主机，适用于大型网络。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-070","type":"single","topic":"8.6 IP 地址与域名","diff":"易","stem":"B 类 IP 地址的第一个字节范围是（　）。","options":["1～126","128～191","192～223","240～255"],"answer":[1],"exp":"B 类首字节 128～191，网络号 14 位、可用网络 16384 个，主机号 16 位、每个网络 65534 台主机，适用于中型网络。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-071","type":"single","topic":"8.6 IP 地址与域名","diff":"中","stem":"C 类 IP 地址的第一个字节范围是（　）。","options":["1～126","128～191","224～239","192～223"],"answer":[3],"exp":"C 类首字节 192～223，网络号 21 位、可用网络 2097152 个，主机号 8 位、每个网络 254 台主机，适用于小型局域网。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-072","type":"single","topic":"8.6 IP 地址与域名","diff":"中","stem":"北京林业大学的 IP 地址 211.71.x.x 属于（　）。","options":["C 类地址","A 类地址","B 类地址","D 类地址"],"answer":[0],"exp":"首字节 211 落在 192～223 区间，属 C 类地址。判断类别只看第一个字节即可：1～126 为 A，128～191 为 B，192～223 为 C，224～239 为 D（组播），240～255 为 E（保留）。","meta":{"source":"第 8 章课件（8-计算机网络.pptx）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-073","type":"single","topic":"8.6 IP 地址与域名","diff":"中","stem":"在 Internet 中，下列 IP 地址中不可能出现的是（　）。","options":["202.96.13.25","176.78.89.67","123.256.36.2","189.76.56.156"],"answer":[2],"exp":"点分十进制中每个十进制数的取值范围是 0～255（对应 8 位二进制）。123.256.36.2 中第二段 256 超出范围，因此不可能是合法 IP 地址。其余三个各段均在 0～255 之间。","meta":{"source":"第 8 章课件（8-计算机网络.pptx）· 课上真题","optperm":true},"_unit":"u8"},{"qid":"cs.u8-074","type":"single","topic":"8.6 IP 地址与域名","diff":"中","stem":"IPv6 规定每个 IP 地址使用（　）表示。","options":["4 个字节（32 个二进位）","16 个字节（128 个二进位）","8 个字节（64 个二进位）","6 个字节（48 个二进位）"],"answer":[1],"exp":"IPv6 地址为 128 位，即 16 个字节，采用冒分十六进制表示，理论上可表示约 3.4×10³⁸ 个地址，彻底解决了 IPv4 地址耗尽的问题。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-075","type":"single","topic":"8.6 IP 地址与域名","diff":"难","stem":"某 IP 地址的主机号部分全为 1，该地址表示（　）。","options":["一个保留地址","该网络本身","某台特定主机","该网络的广播地址"],"answer":[3],"exp":"主机号全 0 表示网络地址（网络本身），主机号全 1 表示该网络的广播地址，两者都不能分配给具体主机。因此每个网络的可用主机数是 2ⁿ−2。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-076","type":"single","topic":"8.6 IP 地址与域名","diff":"中","stem":"Internet 采用域名地址的原因是（　）。","options":["IP 地址不便于记忆","IP 地址不能唯一标识一台主机","一台主机必须同时用 IP 与域名标识","域名比 IP 地址更准确"],"answer":[0],"exp":"IP 地址是一串数字，难以记忆；域名用有意义的字符串标识主机，便于用户使用。域名只是逻辑概念，最终仍要由 DNS 解析成 IP 地址才能通信——一台主机必须至少有一个 IP 地址，域名可以没有。","meta":{"source":"第 8 章课件（8-计算机网络.pptx）· 课上真题","optperm":true},"_unit":"u8"},{"qid":"cs.u8-077","type":"single","topic":"8.6 IP 地址与域名","diff":"中","stem":"域名系统 DNS 的作用是（　）。","options":["为网络中的主机分配域名","把 IP 地址翻译成物理地址","把域名翻译成对应的 IP 地址","加密网络中的传输数据"],"answer":[2],"exp":"DNS（Domain Name System）负责把用户输入的域名解析成对应的 IP 地址，客户端拿到 IP 后才能与服务器建立连接。把 IP 解析成 MAC 地址是 ARP 的任务。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-078","type":"multi","topic":"8.6 IP 地址与域名","diff":"中","stem":"关于 IP 地址，说法正确的有（　）。","options":["IPv4 地址为 32 位二进制数","IP 地址由网络号与主机号组成","IP 地址分为 A、B、C、D、E 五类","同一网络中所有主机的 IP 地址完全相同"],"answer":[0,1,2],"exp":"IPv4 为 32 位，由网络号与主机号构成，分 A～E 五类。同一网络中主机的网络号相同、主机号不同，因此 IP 地址各不相同——相同就会冲突。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-079","type":"multi","topic":"8.6 IP 地址与域名","diff":"中","stem":"关于域名的说法正确的有（　）。","options":["域名采用层次树状结构命名","每一级域名不超过 63 个字符","完整域名总长不超过 255 个字符","域名直接决定主机所在的物理地点"],"answer":[0,1,2],"exp":"域名采用层次树状结构，每级不超过 63 个字符，全长不超过 255 个字符，且不区分大小写。域名只是逻辑概念，并不代表计算机所在的物理地点。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-080","type":"fill","topic":"8.6 IP 地址与域名","diff":"易","stem":"IPv4 规定每个 IP 地址使用 ____ 个字节表示。","answers":["4","四"],"exp":"4 个字节 = 32 位，通常写成 4 个用圆点隔开的十进制数，每段取值 0～255。IPv6 则是 16 个字节、128 位。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-081","type":"fill","topic":"8.6 IP 地址与域名","diff":"中","stem":"负责把域名转换为 IP 地址的系统称为 ____。","answers":["DNS","域名系统","域名服务器","Domain Name System"],"exp":"DNS 是 Internet 的域名解析系统，采用层次树状结构，全球共有 13 组根域名服务器。用户输入域名后，由 DNS 逐级查询得到对应 IP 地址。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-082","type":"fill","topic":"8.6 IP 地址与域名","diff":"中","stem":"C 类地址的主机号为 8 位，每个网络中可分配给主机的地址数为 ____ 个。","answers":["254"],"exp":"主机号 8 位可表示 2⁸ = 256 个编码，其中主机号全 0 是网络地址、全 1 是广播地址，二者不能分配给主机，故可用主机数为 256 − 2 = 254。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-083","type":"short","topic":"8.6 IP 地址与域名","diff":"中","stem":"说明 IPv4 地址的分类及各类的适用范围。","ref":"IPv4 地址按第一个字节的取值分为五类：①A 类，首字节 1～126（0 与 127 保留），网络号 7 位、可用网络 126 个，主机号 24 位、每网约 1677 万台主机，适用于大型网络；②B 类，首字节 128～191，网络号 14 位、16384 个网络，主机号 16 位、每网 65534 台主机，适用于中型网络；③C 类，首字节 192～223，网络号 21 位、约 209 万个网络，主机号 8 位、每网 254 台主机，适用于小型局域网；④D 类，首字节 224～239，为组播（多播）地址，不分配给主机；⑤E 类，首字节 240～255，保留作实验与研究用。","exp":"采分点：五类的首字节范围、主机号位数与每网主机数、适用范围。D 类与 E 类的用途最易漏答。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-084","type":"comp","topic":"8.6 IP 地址与域名","diff":"中","stem":"判断下列 IP 地址各属哪一类，并计算该类每个网络可用的主机数：①10.10.1.5；②172.16.5.20；③202.204.112.57；④224.0.0.5。","ref":"①10.10.1.5：首字节 10，属 A 类。主机号 24 位，可用主机数 2²⁴ − 2 = 16777214 台。\n②172.16.5.20：首字节 172，属 B 类。主机号 16 位，可用主机数 2¹⁶ − 2 = 65534 台。\n③202.204.112.57：首字节 202，属 C 类。主机号 8 位，可用主机数 2⁸ − 2 = 254 台。\n④224.0.0.5：首字节 224，属 D 类（组播地址），不划分网络号与主机号，不能分配给单台主机。\n计算要点：可用主机数 = 2^主机号位数 − 2，减去的是网络地址（主机号全 0）与广播地址（主机号全 1）。","exp":"采分点：四个类别判断正确；三处主机数计算正确；能说明「减 2」的原因。④最易错判为 C 类或 E 类。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-085","type":"comp","topic":"8.6 IP 地址与域名","diff":"难","stem":"某单位分到一个 C 类网络 202.204.112.0/24，需要划分为 4 个大小相同的子网，每个子网要容纳 50 台主机。判断是否可行，写出各子网的网络地址与可用主机数。","ref":"分析：C 类网络主机号 8 位。要划分 4 个子网需借用 2 位主机号作子网号（2² = 4），剩余 6 位作主机号。每个子网可用主机数 = 2⁶ − 2 = 62 台，大于 50 台，可行。子网掩码为 255.255.255.192（/26）。\n各子网（步长 64）：\n①202.204.112.0/26，可用 202.204.112.1～202.204.112.62；\n②202.204.112.64/26，可用 .65～.126；\n③202.204.112.128/26，可用 .129～.190；\n④202.204.112.192/26，可用 .193～.254。\n每个子网的第一个地址是网络地址、最后一个是广播地址，均不可分配给主机。","exp":"采分点：①判断可行并说明理由（62 ≥ 50）；②子网掩码 /26；③四个子网的网络地址与地址范围；④指出网络地址与广播地址不可用。若答「划分 8 个子网」则每个只有 30 台主机，不满足 50 台的要求。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-086","type":"single","topic":"8.6 IP 地址与域名","diff":"中","stem":"下列域名中，写法不符合规范的是（　）。","options":["WWW.tj.net.jp","WWW.163.COM","www.863.org.cn","WWW.Nk.cn.edu"],"answer":[3],"exp":"域名自左向右级别由低到高，最右边必须是顶级域名。WWW.Nk.cn.edu 以 edu 结尾，把通用顶级域名 edu 放在了国家域名 cn 之后，层次颠倒，不符合书写规则。","meta":{"source":"第 8 章课件（8-计算机网络.pptx）· 课上真题","optperm":true},"_unit":"u8"},{"qid":"cs.u8-087","type":"single","topic":"8.6 IP 地址与域名","diff":"中","stem":"在域名 www.bjfu.edu.cn 中，顶级域名是（　）。","options":["edu","www","bjfu","cn"],"answer":[3],"exp":"域名书写从叶子（主机）写到根，最右边是顶级域名。www 是主机名，bjfu 是机构名（二级域名），edu 是类别名，cn 是顶级域名（国家顶级域名）。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-088","type":"single","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"URL 的中文名称是（　）。","options":["通用资源语言","统一资源定位器","统一注册链接","用户资源列表"],"answer":[1],"exp":"URL（Uniform Resource Locators）即统一资源定位器，俗称「网址」，是对互联网上资源位置的标准表示方式。互联网上的所有资源都有一个唯一确定的 URL。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-089","type":"single","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"一个 URL 通常由（　）三部分构成。","options":["IP 地址、子网掩码、网关","协议名称、端口号、密码","用户名、密码、域名","协议名称、Web 服务器域名（主机）、文件名（路径）"],"answer":[3],"exp":"URL 格式为 <协议>://<主机>:<端口>/<路径>，基本三部分是协议名称、Web 服务器域名、文件名（含路径）。协议与主机之间用 :// 隔开，主机与路径之间用 / 隔开。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-090","type":"single","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"HTTP 的默认端口号是（　）。","options":["80","21","25","443"],"answer":[0],"exp":"HTTP 默认端口为 80，端口号在 URL 中可省略。作为对照：FTP 为 21、SMTP 为 25、HTTPS 为 443。","meta":{"source":"第 8 章课件（陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-091","type":"single","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"电子邮件发送使用的协议是（　）。","options":["FTP","HTTP","SMTP","Telnet"],"answer":[2],"exp":"SMTP（Simple Mail Transfer Protocol，简单邮件传输协议）负责邮件的发送与传输。电子邮件地址格式为「用户账号@主机域名」。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-092","type":"single","topic":"8.7 URL 与 Internet 应用","diff":"易","stem":"电子邮件地址的正确格式是（　）。","options":["主机域名@用户账号","用户账号@主机域名","用户账号.主机域名","用户账号#主机域名"],"answer":[1],"exp":"电子邮件地址由用户账号与主机域名两部分组成，中间用 @ 分隔，如 student@bjfu.edu.cn。@ 读作 at，表示「在某个邮件服务器上」。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-093","type":"single","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"FTP 的主要功能是（　）。","options":["发送电子邮件","浏览超文本页面","远程登录到另一台主机","在两台计算机之间传输文件并保证传输的可靠性"],"answer":[3],"exp":"FTP（File Transfer Protocol，文件传输协议）负责把文件从一台计算机传输到另一台计算机并保证可靠性，支持上传与下载，广泛用于数据共享与远程操作。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-094","type":"single","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"在因特网上，一台计算机可以作为另一台主机的远程终端并使用其资源，这种服务称为（　）。","options":["Telnet","FTP","BBS","WWW"],"answer":[0],"exp":"Telnet 是远程登录服务：本地计算机通过 Internet 成为远程主机的一个虚拟终端，从而使用该主机的资源。FTP 传文件，WWW 浏览网页，BBS 是电子公告板。","meta":{"source":"第 8 章课件（8-计算机网络.pptx）· 课上真题","optperm":true},"_unit":"u8"},{"qid":"cs.u8-095","type":"single","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"万维网（WWW）是一种基于（　）的超文本系统。","options":["文件目录","数据库","超链接","电子邮件"],"answer":[2],"exp":"WWW（World Wide Web）把各种类型的信息（静止图像、文本、声音、影像）有机集成起来供用户阅读和查找，是一种基于超链接（Hyperlink）的超文本（Hypertext）系统。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-096","type":"single","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"万维网的网址以 HTTP 为前导，表示遵从（　）协议。","options":["纯文本","超文本传输","文件传输","邮件传输"],"answer":[1],"exp":"HTTP 即 HyperText Transfer Protocol，超文本传输协议，负责在浏览器与 Web 服务器之间传输超文本。它与纯文本、FTP（文件传输）、SMTP（邮件传输）是不同的协议。","meta":{"source":"第 8 章课件（8-计算机网络.pptx）· 课上真题","optperm":true},"_unit":"u8"},{"qid":"cs.u8-097","type":"multi","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"属于 Internet 提供的服务有（　）。","options":["远程登录","编译与链接","电子邮件","文件传输"],"answer":[0,2,3],"exp":"前三项都是 Internet 提供的服务（分别用 SMTP、FTP、Telnet）。编译与链接是本地开发工具链的功能，不是网络服务。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-098","type":"fill","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"万维网（WWW）使用的传输协议是 ____。","answers":["HTTP","超文本传输协议","HyperText Transfer Protocol"],"exp":"HTTP 是超文本传输协议，负责浏览器与 Web 服务器之间超文本的传输。网址以 http:// 开头即表示使用该协议。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-099","type":"fill","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"把本地计算机通过 Internet 变成远程主机虚拟终端的服务称为 ____。","answers":["Telnet","远程登录"],"exp":"Telnet（远程终端访问协议）让用户从本地机器登录到远程主机，像坐在那台机器前一样使用其资源。它传输的是明文，安全性差，现多被 SSH 取代。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-100","type":"short","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"列举 Internet 的主要应用服务，并说明各自使用的协议。","ref":"①电子邮件：以电子信件形式通信，发送使用 SMTP（简单邮件传输协议），地址格式为「用户账号@主机域名」。②文件传输：在两站点之间传送文件并保证可靠性，使用 FTP（文件传输协议）。③远程登录：本地计算机成为远程主机的虚拟终端，使用 Telnet。④万维网：基于超链接的超文本信息系统，使用 HTTP（超文本传输协议）。⑤搜索引擎：主动搜索各 WWW 服务器中的信息并建立索引，供用户查询。⑥即时通信等其他应用。","exp":"采分点：至少四项服务及其协议对应正确。把 HTTP 说成「超文本标记语言」、把 SMTP 与 POP3 混用是常见错误。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-101","type":"comp","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"拆解 URL：http://www.bjfu.edu.cn:8080/news/index.html，指出各部分的名称与作用，并说明端口号 8080 与省略端口时有何不同。","ref":"①http —— 协议名称，表示使用超文本传输协议；②www.bjfu.edu.cn —— Web 服务器的域名，其中 www 为主机名、bjfu 为机构名、edu 为类别名、cn 为顶级域名；③8080 —— 端口号，标识服务器上提供该服务的进程；④/news/index.html —— 路径与文件名，news 为文件夹名，index.html 为文档名与扩展名。\n端口差异：HTTP 的默认端口是 80，若 URL 中省略端口号，浏览器按 80 端口连接；写成 :8080 则明确要求连接服务器的 8080 端口，通常用于开发测试或同一台服务器上部署多个站点。","exp":"采分点：四部分名称与作用、域名各级含义、默认端口 80 与显式端口的区别。只答「协议、域名、路径」三部分得一半分。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-102","type":"comp","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"用户在浏览器地址栏输入 www.bjfu.edu.cn 后看到了学校主页。说明从输入域名到页面显示，DNS、HTTP 与 TCP/IP 各自承担了什么工作。","ref":"①DNS 解析：浏览器先查本地缓存，若无则向 DNS 服务器发起查询，逐级（根、顶级、权威）解析域名，得到该主机的 IP 地址。\n②建立连接：浏览器用该 IP 与服务器的 80 端口建立 TCP 连接（三次握手），保证可靠传输。\n③发送请求：浏览器按 HTTP 协议发出请求报文（如 GET / HTTP/1.1），报文中含请求的资源路径与头部信息。\n④服务器响应：服务器返回 HTTP 响应报文，正文是 HTML 文档。\n⑤传输与解析：HTTP 报文经 TCP 分段、IP 打包、链路层成帧后传输；浏览器收到后解析 HTML，再对页面引用的图片、样式、脚本重复上述过程。\n⑥渲染显示：浏览器按 HTML 与 CSS 渲染页面，呈现给用户。","exp":"采分点：①DNS 的作用是「域名→IP」；②TCP 提供可靠连接；③HTTP 承载请求与响应；④三者分工清楚（DNS 负责找地址、TCP 负责可靠传输、HTTP 负责内容格式）。只说「DNS 解析、HTTP 传输」过于笼统。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-103","type":"single","topic":"8.8 Internet 发展趋势","diff":"中","stem":"下列不属于 Internet 发展趋势的是（　）。","options":["运营产业化","应用商业化","互联全球化与宽带化","终端单一化"],"answer":[3],"exp":"Internet 的发展趋势是：运营产业化、应用商业化、互联全球化、互联宽带化、多业务综合平台化与智能化。终端不是走向单一，而是多样化（手机、平板、车机、物联网设备）。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-104","type":"single","topic":"8.8 Internet 发展趋势","diff":"中","stem":"下列技术中，属于当前 Internet 发展热点的是（　）。","options":["云计算、大数据、人工智能","机械制图、数控加工","印刷排版、图像扫描","光盘刻录、磁带备份"],"answer":[0],"exp":"课件把云计算、大数据、人工智能、互联网+ 列为当前 Internet 发展的热点方向，它们都建立在网络互联与数据汇聚的基础之上。其余三项属于传统制造与办公技术。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-105","type":"single","topic":"8.8 Internet 发展趋势","diff":"中","stem":"「互联宽带化」这一趋势的直接表现是（　）。","options":["网络协议种类减少","网络中的主机数量减少","接入速率不断提高，光纤与移动宽带普及","终端设备体积变大"],"answer":[2],"exp":"互联宽带化指接入带宽持续提升：光纤到户、4G/5G 移动宽带普及，使高清视频、云应用等大流量业务成为常态。它与主机数量、协议种类、终端体积没有直接关系。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-106","type":"multi","topic":"8.8 Internet 发展趋势","diff":"中","stem":"Internet 的发展趋势包括（　）。","options":["终端单一化","运营产业化","应用商业化","互联全球化"],"answer":[1,2,3],"exp":"前三项都是 Internet 的发展趋势（此外还有互联宽带化、多业务综合平台化与智能化）。终端不是走向单一，而是手机、平板、车机、物联网设备多样化并存。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）","optperm":true},"_unit":"u8"},{"qid":"cs.u8-107","type":"fill","topic":"8.8 Internet 发展趋势","diff":"中","stem":"Internet 的发展趋势可概括为：运营产业化、应用商业化、互联全球化、互联 ____、多业务综合平台化与智能化。","answers":["宽带化"],"exp":"互联宽带化指接入带宽持续提升，光纤与移动宽带普及，支撑高清视频、云计算等大流量应用。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"},{"qid":"cs.u8-108","type":"short","topic":"8.8 Internet 发展趋势","diff":"中","stem":"简述 Internet 的发展趋势，并各举一个当前的技术表现。","ref":"①运营产业化：网络运营成为独立的产业，形成运营商、内容提供商、云服务商分工协作的链条。②应用商业化：电子商务、在线教育、移动支付等成为主流商业模式。③互联全球化：跨国互联与全球内容分发，跨境业务依赖网络完成。④互联宽带化：光纤到户与 5G 普及，接入速率大幅提升。⑤多业务综合平台化、智能化：同一网络承载语音、视频、数据等多种业务，并结合云计算、大数据、人工智能提供智能化服务。","exp":"采分点：五条趋势齐全并各有一例。只背五条名词而无具体表现，最多得一半分。","meta":{"source":"第 8 章课件（8-计算机网络.pptx / 陈8 计算机网络.pdf）"},"_unit":"u8"}]}],"wrong":{"exitStreak":1},"mastery":{"wAll":0.4,"wRecent":0.6,"recentN":5,"weakBelow":60,"solidAt":85,"solidStreak":4,"passMinQ":4,"passRate":0.9,"dueDays":[1,3,7]},"codec":{"version":10,"gidBits":32,"budgetBytes":6000},"order":["g7b36b9f9","geb76ff8a","g5604cb4e","gbbf40dfe","g53d3c631","gc8006e41","gdde89a21","gffcece9c","gbf4af0af","gf58d538b","g986a45cb","g16fafab6","g390c53cf","gd341e104","g5caa97bb","g63505a11","g262242e2","g53357d53","g15895c5a","gb37205e6","ga8ff66f5","gf78a1598","g2312f909","gd84ac421","g531e9c29","g11a301b7","g9182d1cb","g5ac960f1","g879fc5c7","g7d406c09","ge31b0414","ga0a1269f","gd6d7ba22","g96ce59ac","g1d239cea","g40f44857","g039b0e40","g2f3b78a4","g01c4cc52","g8a075482","g60a43282","gc2a5be02","g429eefc9","g9336931d","g1ca6d6e6","g3929ecd5","g6973d129","g3abb4969","ge0a933a7","gb120c052","g7d8fc4da","g1b380426","g97d834a5","g741c176d","gf4dc7861","g1235df51","g4f107c97","g8fdb65e0","g698ac205","g     var gids = this.legacyGids();
    if (gids.length !== total) {
      throw new Error('v9 编码含 ' + total + ' 个 gid，本地题库为 ' + gids.length + ' 个（题库版本不同）');
    }
    var ansBits = bin.slice(3, 3 + len);
    var favBits = bin.slice(3 + len, 3 + 2 * len);
    var txtBits = bin.slice(3 + 2 * len, hdr);
    var reader = new BitReader(bin, hdr);
    var ans = {}, fav = {};
    for (var i = 0; i < total; i++) {
      var g = gids[i];
      if (favBits[i >> 3] & (1 << (i & 7))) fav[g] = Date.now();
      if (!(ansBits[i >> 3] & (1 << (i & 7)))) continue;
      var okc = reader.read(2);
      var mask = reader.read(4);        // v9 固定 4 位掩码
      var picked = [];
      for (var k = 0; k < 4; k++) if (mask & (1 << k)) picked.push(k);
      ans[g] = { ok: okc === 1 ? true : (okc === 2 ? false : null), at: Date.now(), p: picked };
    }
    var tpos = reader.bytesUsed(), texts = {};
    for (var j = 0; j < total; j++) {
      if (!(txtBits[j >> 3] & (1 << (j & 7)))) continue;
      if (tpos >= bin.length) break;
      var ln = bin[tpos++];
      texts[gids[j]] = utf8Decode(bin.slice(tpos, tpos + ln));
      tpos += ln;
    }
    return { kind: 'site', key: '', ans: ans, fav: fav, texts: texts, v: 9 };
  };

  /* ---- 旧版本机记录迁移：csg_*（gid 键）与 csunitN_*（旧题号键） ---- */

  var LEGACY_RE = /^(?:csg|cs(?:unit\d+|exam|terms|calc|midterm))_(ans|wrong|fav)_v1$/;

  function toRecord(r) {
    if (!r || typeof r !== 'object') return null;
    var ok = r.ok === true ? true : (r.ok === false ? false : null);
    var picked = Array.isArray(r.picked) ? r.picked : (Array.isArray(r.p) ? r.p : null);
    var text = r.text != null ? r.text : (r.x != null ? r.x : '');
    var answered = !!picked || !!text || ok !== null || r.done === true;
    if (!answered) return null;
    var rec = { ok: ok, at: typeof r.at === 'number' ? r.at : Date.now() };
    if (picked && picked.length) {
      rec.p = picked.filter(function (k) { return typeof k === 'number' && k >= 0; })
        .sort(function (a, b) { return a - b; });
    }
    if (text) rec.x = cleanText(text).trim();
    if (r.self === true) rec.self = true;
    if (typeof r.c === 'number') rec.c = r.c;
    return rec;
  }

  function eachLegacyEntry(value, fn) {
    if (value == null) return;
    if (Array.isArray(value)) { value.forEach(function (g) { if (typeof g === 'string') fn(g, 1); }); return; }
    if (typeof value !== 'object') return;
    Object.keys(value).forEach(function (g) { fn(g, value[g]); });
  }

  // 幂等：迁移过一次就记标记，不重复覆盖用户此后产生的记录
  Site.prototype.migrateLegacy = function () {
    var store = this.store;
    if (store.get('migrated', null)) return { skipped: true, ans: 0, wrong: 0, fav: 0 };
    if (typeof localStorage === 'undefined' || !localStorage.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    var idMap = this.legacyIdMap || {};
    var ans = store.get('ans', {});
    var wrong = store.get('wrong', {});
    var fav = store.get('fav', {});
    var self = this;
    var counts = { ans: 0, wrong: 0, fav: 0, orphan: 0 };
    var handled = [];

    function resolve(key) {
      if (/^g[0-9a-f]{8}([0-9a-f]{8})?$/.test(key)) return key;
      return idMap[key] || null;
    }

    var names = [];
    for (var i = 0; i < localStorage.length; i++) names.push(localStorage.key(i));

    names.forEach(function (name) {
      var m = LEGACY_RE.exec(name);
      if (!m) return;
      var kind = m[1];
      var raw;
      try { raw = JSON.parse(localStorage.getItem(name) || 'null'); } catch (e) { return; }
      handled.push(name);

      eachLegacyEntry(raw, function (key, val) {
        var gid = resolve(key);
        if (!gid) { counts.orphan++; return; }
        if (kind === 'ans') {
          var rec = toRecord(val);
          if (!rec) return;
          if (!ans[gid]) { ans[gid] = rec; counts.ans++; }
          else if (ans[gid].ok === null && rec.ok !== null) { ans[gid] = rec; counts.ans++; }
        } else if (kind === 'wrong') {
          if (!wrong[gid]) { wrong[gid] = typeof val === 'number' ? val : Date.now(); counts.wrong++; }
        } else if (kind === 'fav') {
          if (!fav[gid]) { fav[gid] = (val && typeof val === 'object' && typeof val.t === 'number') ? val.t : Date.now(); counts.fav++; }
        }
      });
    });

    if (!handled.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    store.set('ans', ans);
    store.set('wrong', wrong);
    store.set('fav', fav);
    store.set('migrated', { at: Date.now(), from: handled, counts: counts });
    // 旧键一律不删：回退到旧页面仍可用（规范 8.2 第 4 条）
    return counts;
  };

  // 导入：只覆盖作用域内，域外原样保留（规范 3.3）
  Site.prototype.importCode = function (code) {
    var snapshot = {
      ans: this.store.get('ans', {}), wrong: this.store.get('wrong', {}), fav: this.store.get('fav', {})
    };
    this.store.set('bak', { at: Date.now(), data: snapshot });

    var got = this.decode(code);
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var self = this;
    var touched = 0;

    Object.keys(got.ans).forEach(function (g) {
      var incoming = got.ans[g];
      if (got.texts[g] != null) incoming.x = cleanText(got.texts[g]);
      ans[g] = mergeRecord(ans[g] || null, incoming);
      if (incoming.ok === false) wrong[g] = Date.now();
      touched++;
    });
    Object.keys(got.fav).forEach(function (g) { fav[g] = fav[g] || Date.now(); });

    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    return { kind: got.kind, key: got.key, count: touched, v: got.v || 10 };
  };

  Site.prototype.undoImport = function () {
    var bak = this.store.get('bak', null);
    if (!bak) return false;
    this.store.set('ans', bak.data.ans || {});
    this.store.set('wrong', bak.data.wrong || {});
    this.store.set('fav', bak.data.fav || {});
    return true;
  };

  /* ---- 统计（三级口径，分母一律 gid 去重） ---- */

  Site.prototype.stats = function (unitKey) {
    var self = this;
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var gids = unitKey ? this.scopeGids('unit', unitKey) : this.order.slice();
    var seen = {}, total = 0, answered = 0, correct = 0, wrongN = 0, favN = 0;
    gids.forEach(function (g) {
      if (seen[g]) return;
      seen[g] = 1;
      total++;
      var r = ans[g];
      if (r) {
        answered++;
        if (r.ok === true) correct++;
      }
      if (wrong[g]) wrongN++;
      if (fav[g]) favN++;
    });
    return {
      total: total, answered: answered, correct: correct,
      rate: answered ? Math.round(100 * correct / answered) : null,
      wrong: wrongN, fav: favN
    };
  };

  var QB = {
    fpNorm: fpNorm, fpHash: fpHash, fingerprint: fingerprint,
    norm: norm, judge: judge, fuzzyEq: fuzzyEq, cleanText: cleanText,
    maskWidth: maskWidth, mergeRecord: mergeRecord,
    Store: Store, Site: Site,
    create: function (def, store) { return new Site(def, store); }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = QB;
  else root.QB = QB;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>计算机导论 · 第二单元 计算机中数的表示与存储</title>
<style>/* qb-page.css — 题库页面样式（内核共用，不含任何科目特有内容） */
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e4e8ef; --line2:#eef1f6;
  --text:#1e2330; --muted:#5b6373; --muted2:#6b7383;
  --accent:#2f6fed; --accent-ink:#2557c7; --accent-soft:#eaf1ff;
  --ok:#0b6b48; --ok-soft:#e7f7ef; --ok-line:#b7e6cf;
  --bad:#b42318; --bad-soft:#fdecea; --bad-line:#f6c9c4;
  --warn:#b54708; --warn-soft:#fef3e2;
  --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 72px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:14px}
.top h1{font-size:21px;margin:0;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.top .spacer{flex:1}
.home{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:6px 12px;background:#fff}
.home:hover{color:var(--accent);border-color:#c7dbff;text-decoration:none}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.block{padding:14px 16px;margin-bottom:14px}

/* stats */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;margin-bottom:14px}
.stat-k{font-size:12px;color:var(--muted2);letter-spacing:.3px}
.stat-v{font-size:19px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-bar{height:4px;border-radius:3px;background:#eef1f6;margin-top:7px;overflow:hidden}
.stat-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl+.ctl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.seg{display:inline-flex;background:#f1f4fa;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;color:#48505f}
.seg button:hover{color:var(--accent)}
.seg button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
select,input[type=search]{
  font:inherit;font-size:13.5px;color:var(--text);border:1px solid var(--line);background:#fff;
  border-radius:9px;padding:7px 10px;outline:none
}
select:focus,input[type=search]:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=search]{min-width:170px;flex:1}
.btn{
  border:1px solid var(--line);background:#fff;color:#3c4353;border-radius:9px;padding:7px 14px;
  font:inherit;font-size:13.5px;cursor:pointer;transition:.15s
}
.btn:hover:not(:disabled){border-color:#c7dbff;color:var(--accent);background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2557c7;border-color:#2557c7;color:#fff}
.btn.ghost{background:#fff}
.btn.ghost.on{color:#b54708;border-color:#f5dcb4;background:var(--warn-soft)}
.btn.small{padding:5px 11px;font-size:13px}

/* card */
#card{padding:18px 18px 16px;margin-bottom:14px}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fafbfd;white-space:nowrap}
.tag-type{color:var(--accent-ink);border-color:#c7dbff;background:var(--accent-soft)}
.tag-diff.d-0{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.tag-diff.d-1{color:var(--warn);border-color:#f5dcb4;background:var(--warn-soft)}
.tag-diff.d-2{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.q-topic{font-size:12.5px;color:var(--muted2)}
.q-no{margin-left:auto;font-size:12.5px;color:var(--muted2);font-variant-numeric:tabular-nums}
.q-stem{font-size:16.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.q-img{max-width:100%;margin-top:10px;border-radius:8px;border:1px solid var(--line)}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;
  font:inherit;font-size:15px;line-height:1.6;cursor:pointer;transition:.13s;color:var(--text)
}
.opt:hover:not(:disabled){border-color:#c7dbff;background:#fafcff}
.opt:disabled{cursor:default}
.opt-k{
  flex:0 0 24px;height:24px;border-radius:7px;background:#f1f4fa;color:#48505f;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600
}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .opt-k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.right .opt-k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .opt-k{background:var(--bad);color:#fff}

/* inputs */
.in,.ta{
  width:100%;margin-top:14px;font:inherit;font-size:15px;color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;background:#fff;resize:vertical
}
.in:focus,.ta:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
.in:disabled,.ta:disabled{background:#fafbfd;color:var(--muted)}

/* action bar */
.q-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hint{font-size:12.5px;color:var(--muted2)}
.verdict{font-size:14px;font-weight:650;padding:5px 12px;border-radius:999px}
.verdict.ok{color:var(--ok);background:var(--ok-soft)}
.verdict.bad{color:var(--bad);background:var(--bad-soft)}
.verdict.mid{color:var(--warn);background:var(--warn-soft)}

/* explanation */
.exp{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.exp-h{font-size:12.5px;color:var(--muted2);letter-spacing:.4px;margin-bottom:7px}
.exp-a{font-size:14.5px;margin:0 0 8px;padding:10px 12px;background:#f7f9fd;border-radius:9px;border:1px solid var(--line2)}
.exp-p{font-size:14.5px;color:#333a49;margin:0 0 6px;white-space:pre-wrap}
.exp-src{font-size:12px;color:var(--muted2);margin:6px 0 0}
.self{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}

/* nav */
#nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav-mid{flex:1;text-align:center;font-size:13px;color:var(--muted2);font-variant-numeric:tabular-nums}

/* mastery */
#mastery{padding:14px 16px;margin-bottom:14px}
.mt{width:100%;border-collapse:collapse;font-size:13.5px}
.mt th{text-align:left;font-weight:600;color:var(--muted2);font-size:12px;letter-spacing:.3px;padding:0 0 8px;border-bottom:1px solid var(--line2)}
.mt td{padding:7px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
.mt tr:last-child td{border-bottom:0}
.mt-t{color:#333a49}
.mt-s{font-variant-numeric:tabular-nums;font-weight:650;width:56px}
.mt-n{color:var(--muted2);width:56px;text-align:right}
.lv{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.lv-ok{color:var(--ok);background:var(--ok-soft)}
.lv-mid{color:var(--warn);background:var(--warn-soft)}
.lv-bad{color:var(--bad);background:var(--bad-soft)}

/* transfer */
#transfer{padding:14px 16px;margin-bottom:14px}
#x-code{width:100%;min-height:86px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:10px;resize:vertical;background:#fafbfd;color:#333a49}
#x-info{font-size:12.5px;color:var(--muted2);margin-top:8px;min-height:18px}
.x-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* misc */
.empty{padding:34px 8px;text-align:center}
.empty-t{font-size:15.5px;font-weight:600}
.empty-s{color:var(--muted2);font-size:13.5px;margin:6px 0 0}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:#1e2330;color:#fff;font-size:13.5px;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--muted2);font-size:12px;text-align:center;margin-top:18px;line-height:1.8}

@media (max-width:640px){
  .wrap{padding:14px 12px 64px}
  #stats{grid-template-columns:repeat(2,1fr)}
  .top h1{font-size:18.5px}
  .q-stem{font-size:16px}
  .opt{font-size:14.5px}
  input[type=search]{min-width:100%}
}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{

</style>

1010"],"answer":[2],"meta":{"origin":{"id":"2-08","no":77,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-009","type":"multi","topic":"2.1 进位计数制及其转换","diff":"易","stem":"下列各项中，最后一位字母表示数的进制，那么（　）是合法的数。","exp":"B 表示二进制（数码 0、1，合法）；O 表示八进制（数码 0～7，2851 合法）；D 表示十进制（2536 合法）；H 表示十六进制，但 G、Q 不是十六进制数码，故 D 项不合法。","options":["G0BQ1H","2851O","2536D","101010B"],"answer":[1,2,3],"meta":{"origin":{"id":"2-09","no":78,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-010","type":"multi","topic":"2.1 进位计数制及其转换","diff":"中","stem":"关于进位计数制，下列说法正确的有（　）。","exp":"四项均正确。进制中数码的个数叫“基数”，通用规则是“逢基数进一”。","options":["十进制基数为 10，有 10 个数码","二进制基数为 2，有 2 个数码","八进制基数为 8，有 8 个数码","十六进制基数为 16，有 16 个数码（0～9、A～F）"],"answer":[0,1,2,3],"meta":{"origin":{"id":"2-10","no":79,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-011","type":"single","topic":"2.1 进位计数制及其转换","diff":"易","stem":"进制的不同，只是数值的不同表示方法，其值不变。","exp":"正确。例如十进制 243 与二进制 11110011、十六进制 F3 表示的是同一个数值。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-11","no":80,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-012","type":"single","topic":"2.1 进位计数制及其转换","diff":"易","stem":"八进制数中不会出现数字 8。","exp":"正确。八进制的数码为 0～7，共 8 个，逢八进一，因此不会出现数字 8。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-12","no":81,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-013","type":"single","topic":"2.1 进位计数制及其转换","diff":"中","stem":"十进制小数 0.6 转换为二进制小数时，得到的是有限小数。","exp":"错误。(0.6)10 = (0.100110011001…)2，是循环小数。十进制小数转二进制时可能永远不为 0，此时乘 2 过程由所要求的转换精度确定。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"2-13","no":82,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-014","type":"fill","topic":"2.1 进位计数制及其转换","diff":"中","stem":"(92.125)10 = ( ____ )2","exp":"整数部分：92 = 1011100B（除基取余）；小数部分：0.125×2 = 0.25 取 0，0.25×2 = 0.5 取 0，0.5×2 = 1.0 取 1，得 .001。故为 1011100.001。","answers":["1011100.001","(1011100.001)2","1011100.001B"],"meta":{"origin":{"id":"2-14","no":83,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-015","type":"fill","topic":"2.1 进位计数制及其转换","diff":"中","stem":"(C54.6AB)16 = ( ____ )2","exp":"一位拉四位：C→1100，5→0101，4→0100；6→0110，A→1010，B→1011。得 110001010100.011010101011。","answers":["110001010100.011010101011","(110001010100.011010101011)2"],"meta":{"origin":{"id":"2-15","no":84,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-016","type":"fill","topic":"2.1 进位计数制及其转换","diff":"中","stem":"(11001101.01011)2 = ( ____ )16","exp":"四位并一位：1100→C，1101→D；0101→5，1000→8（末组右补 0）。得 CD.58H。","answers":["CD.58","(CD.58)16","CD.58H"],"meta":{"origin":{"id":"2-16","no":85,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-017","type":"fill","topic":"2.1 进位计数制及其转换","diff":"中","stem":"(123.4)8 = ( ____ )10","exp":"1×8^2 + 2×8^1 + 3×8^0 + 4×8^-1 = 64 + 16 + 3 + 0.5 = 83.5。","answers":["83.5","(83.5)10","83.5D"],"meta":{"origin":{"id":"2-17","no":86,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-018","type":"fill","topic":"2.1 进位计数制及其转换","diff":"中","stem":"(10101.101)2 = ( ____ )10","exp":"1×2^4 + 0 + 1×2^2 + 0 + 1×2^0 + 1×2^-1 + 0 + 1×2^-3 = 16 + 4 + 1 + 0.5 + 0.125 = 21.625。","answers":["21.625","(21.625)10","21.625D"],"meta":{"origin":{"id":"2-18","no":87,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-019","type":"fill","topic":"2.1 进位计数制及其转换","diff":"中","stem":"将十进制数 100 分别转换为二进制、八进制、十六进制：____ 、____ 、____","exp":"100 = 1100100B = 144O = 64H。（100÷2 取余得二进制 1100100；100÷8 = 12 余 4、12÷8 = 1 余 4、1÷8 = 0 余 1 → 144；100÷16 = 6 余 4、6÷16 = 0 余 6 → 64）","answers":["1100100 144 64","1100100,144,64","1100100 144 64H","1100100B 144O 64H"],"meta":{"origin":{"id":"2-19","no":88,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-020","type":"comp","topic":"2.1 进位计数制及其转换","diff":"中","stem":"将十进制数 (43.89)10 转换为二进制数（小数部分保留 4 位）。","exp":"整数部分（除基取余）：43÷2 = 21 余 1；21÷2 = 10 余 1；10÷2 = 5 余 0；5÷2 = 2 余 1；2÷2 = 1 余 0；1÷2 = 0 余 1 → 从后向前读得 101011。\n小数部分（乘基取整）：0.89×2 = 1.78 取 1；0.78×2 = 1.56 取 1；0.56×2 = 1.12 取 1；0.12×2 = 0.24 取 0 → 从前向后读得 .1110。\n故结果为 101011.1110。","ref":"(43.89)10 = (101011.1110)2","meta":{"origin":{"id":"2-20","no":89,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-021","type":"comp","topic":"2.1 进位计数制及其转换","diff":"中","stem":"将十进制数 243 分别转换为二进制数和十六进制数。","exp":"除基取余法：\n转二进制：243÷2 = 121 余 1；121÷2 = 60 余 1；60÷2 = 30 余 0；30÷2 = 15 余 0；15÷2 = 7 余 1；7÷2 = 3 余 1；3÷2 = 1 余 1；1÷2 = 0 余 1 → 11110011。\n转十六进制：243÷16 = 15 余 3；15÷16 = 0 余 15(F) → F3。\n验证：1111 0011 → F3，一致。","ref":"243D = 11110011B = F3H","meta":{"origin":{"id":"2-21","no":90,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-022","type":"comp","topic":"2.1 进位计数制及其转换","diff":"中","stem":"将十六进制数 (2D.4)16 转换为十进制数。","exp":"按权展开求和：(2D.4)16 = 2×16^1 + 13×16^0 + 4×16^-1 = 32 + 13 + 0.25 = 45.25。","ref":"(2D.4)16 = (45.25)10","meta":{"origin":{"id":"2-22","no":91,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-023","type":"short","topic":"2.1 进位计数制及其转换","diff":"中","stem":"简述“除基取余”与“乘基取整”的适用场景与操作步骤。","exp":"答题要点：①整数用除基取余、余数倒序；②小数用乘基取整、整数正序；③说明当乘 2 过程不终止时由转换精度决定结束。","ref":"两者都是把十进制数转换为 P 进制数的方法。整数部分用“除基取余”：对整数部分除以基数 P，记下余数，用所得的商继续除以 P，重复直至商为 0，最后把所得余数从后向前依次排列即为结果。小数部分用“乘基取整”：对小数部分乘以基数 P，拿出并记下积的整数部分，用余下的小数部分继续乘以 P，重复直至积为 0（或达到所要求的精度），最后把所得整数部分从前向后依次排列即为结果。","meta":{"origin":{"id":"2-23","no":92,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-024","type":"single","topic":"2.2 数据的存储与表示","diff":"易","stem":"1KB 等于（　）。","exp":"1KB = 2^10 B = 1024 B。同理 1MB = 1024KB，1GB = 1024MB，1TB = 1024GB。","options":["1000 B","1024 B","1024 bit","8 B"],"answer":[1],"meta":{"origin":{"id":"2-24","no":93,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-025","type":"single","topic":"2.2 数据的存储与表示","diff":"易","stem":"计算机中最小的信息存储单位是（　）。","exp":"位（bit，比特）是计算机中最小的信息存储单位，即二进制数的一位，值为 0 或 1；字节（Byte）是表示存储空间大小的基本容量单位，1B = 8bit。","options":["位","字节","字","KB"],"answer":[0],"meta":{"origin":{"id":"2-25","no":94,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-026","type":"single","topic":"2.2 数据的存储与表示","diff":"易","stem":"一个字节由（　）个二进制位组成。","exp":"把 8 个二进制位（bit）组合在一起称为一个字节（Byte），1Byte = 8bit。","options":["4","8","16","32"],"answer":[1],"meta":{"origin":{"id":"2-26","no":95,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-027","type":"single","topic":"2.2 数据的存储与表示","diff":"中","stem":"计算机内部是以（　）为单位进行处理、存储和传送数据或指令的。","exp":"字是指在计算机中作为一个整体被存取、传送、处理的一组二进制位；计算机内部是以“字”为单位进行处理、存储和传送数据或指令的。字长是 CPU 的主要技术指标之一。","options":["字","字节","位","块"],"answer":[0],"meta":{"origin":{"id":"2-27","no":96,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-028","type":"single","topic":"2.2 数据的存储与表示","diff":"中","stem":"假设用一个字节存储，整数 (-10)10 在计算机中的补码表示为（　）。","exp":"(-10)10 的真值为 -1010，8 位原码为 10001010，反码为 11110101（符号位不变、其余取反），补码为反码加 1 = 11110110。","options":["00001010","10001010","11110101","11110110"],"answer":[3],"meta":{"origin":{"id":"2-28","no":97,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-029","type":"single","topic":"2.2 数据的存储与表示","diff":"中","stem":"8 位有符号定点整数能表示的整数范围是（　）。","exp":"8 位有符号定点整数范围是 -128～127（即 -2^7～2^7-1），共 256 个数；其中正数补码 00000000～01111111（0～127），负数补码 10000000～11111111（-128～-1）。","options":["0～255","-127～127","-128～128","-128～127"],"answer":[3],"meta":{"origin":{"id":"2-29","no":98,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-030","type":"single","topic":"2.2 数据的存储与表示","diff":"中","stem":"8 位无符号定点整数能表示的整数范围是（　）。","exp":"8 位无符号定点整数没有符号位，全部 8 位都是数值位，范围为 00000000～11111111，即 0～255（0～2^8-1）。","options":["1～256","0～127","0～256","0～255"],"answer":[3],"meta":{"origin":{"id":"2-30","no":99,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-031","type":"single","topic":"2.2 数据的存储与表示","diff":"中","stem":"在计算机中，0 的补码表示有（　）种。","exp":"[+0]补 = 00000000，[-0]补 = 00000000，故 0 的补码只有一种表示形式；而 0 的原码（00000000、10000000）和反码（00000000、11111111）各有两种。","options":["4","2","3","1"],"answer":[3],"meta":{"origin":{"id":"2-31","no":100,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-032","type":"single","topic":"2.2 数据的存储与表示","diff":"易","stem":"在计算机系统中，数值通常采用（　）表示。","exp":"计算机系统中数值用补码表示：每个整数只有一个补码；可将符号位和数值位统一处理，加法与减法统一处理；补码与原码相互转换运算过程相同，无需额外电路。","options":["原码","反码","BCD 码","补码"],"answer":[3],"meta":{"origin":{"id":"2-32","no":101,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-033","type":"single","topic":"2.2 数据的存储与表示","diff":"中","stem":"(-26)10 的 8 位机器数（原码）是（　）。","exp":"(-26)10 的真值为 -11010，数值位 11010 只有 5 位，左补 0 凑足 7 位数值位得 0011010，符号位取 1，故 8 位机器数为 10011010。","options":["10011010","00011010","11100101","11100110"],"answer":[0],"meta":{"origin":{"id":"2-33","no":102,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-034","type":"single","topic":"2.2 数据的存储与表示","diff":"中","stem":"8421BCD 码中十进制数 28 表示为（　）。","exp":"BCD 码用 4 位二进制表示 1 位十进制数：2 → 0010，8 → 1000，故 28 → 00101000。","options":["00101010","00101000","0010100","00100010"],"answer":[1],"meta":{"origin":{"id":"2-34","no":103,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-035","type":"multi","topic":"2.2 数据的存储与表示","diff":"中","stem":"关于机器数，下列说法正确的有（　）。","exp":"机器数的位数受机器设备（字长）限制，可为 8 位、16 位、32 位、64 位等，不一定是 8 位，故最后一项错误。","options":["机器数的位数受机器字长的限制，是 8 的倍数","机器数一定是 8 位","小数点在机器数中采用约定的方法表示，不占位数","数的符号位于最高位，用 0 表示正号、1 表示负号"],"answer":[0,2,3],"meta":{"origin":{"id":"2-35","no":104,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-036","type":"multi","topic":"2.2 数据的存储与表示","diff":"中","stem":"关于补码，下列说法正确的有（　）。","exp":"四项均正确。正整数的原码、反码和补码均相同；负整数的补码为其反码加 1。","options":["0 的补码只有一种表示形式","使用补码可将符号位和数值位统一处理","使用补码可将减法运算转换为加法运算","正数的补码与原码相同"],"answer":[0,1,2,3],"meta":{"origin":{"id":"2-36","no":105,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-037","type":"multi","topic":"2.2 数据的存储与表示","diff":"中","stem":"关于浮点数，下列说法正确的有（　）。","exp":"四项均正确。浮点数规格化后，阶符阶码是整数可用定点整数表示，数符尾数是纯小数可用定点小数表示，因此浮点数事实上是定点整数和定点小数的组合。","options":["由阶符、阶码、数符、尾数四部分组成","尾数的位数决定了数的精度","阶码的位数决定了数的大小","浮点数用于表示数值型数据中的非纯小数"],"answer":[0,1,2,3],"meta":{"origin":{"id":"2-37","no":106,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-038","type":"single","topic":"2.2 数据的存储与表示","diff":"易","stem":"机器数中，符号位用 0 表示正号、1 表示负号。","exp":"正确。符号位位于最高位，0 表示正、1 表示负；若为正数符号位填 0，若为负数填 1。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-38","no":107,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-039","type":"single","topic":"2.2 数据的存储与表示","diff":"中","stem":"0 的原码和反码各有两种不同的表示形式，而 0 的补码只有一种表示形式。","exp":"正确。[+0]原 = 00000000、[-0]原 = 10000000；[+0]反 = 00000000、[-0]反 = 11111111；而 [+0]补 = [-0]补 = 00000000。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-39","no":108,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-040","type":"single","topic":"2.2 数据的存储与表示","diff":"中","stem":"BCD 码是一种用 4 位二进制数来表示 1 位十进制数的编码方式。","exp":"正确。BCD（Binary Coded Decimal）码利用 4 个二进制位储存十进制的一位数码，使二进制与十进制之间的转换得以快捷进行，常用的是 8421 码。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-40","no":109,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-041","type":"single","topic":"2.2 数据的存储与表示","diff":"中","stem":"浮点数规格化后，尾数应是绝对值大于等于 0.1 并且小于 1 的数。","exp":"正确。规格化就是把非纯小数形式的尾数转换为纯小数形式，规格化后尾数的绝对值应大于等于 0.1 且小于 1。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-41","no":110,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-042","type":"fill","topic":"2.2 数据的存储与表示","diff":"易","stem":"1KB = ____ B；1MB = ____ KB。","exp":"存储单位换算均以 2^10 = 1024 为进率：1KB = 1024B，1MB = 1024KB，1GB = 1024MB，1TB = 1024GB。","answers":["1024 1024","1024,1024","1024；1024"],"meta":{"origin":{"id":"2-42","no":111,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-043","type":"fill","topic":"2.2 数据的存储与表示","diff":"中","stem":"(-95)10 的 8 位原码是 ____，反码是 ____，补码是 ____。","exp":"(-95)10 的真值为 -1011111。原码：符号位 1 + 1011111 → 11011111；反码：符号位不变、其余按位取反 → 10100000；补码：反码加 1 → 10100001。","answers":["11011111 10100000 10100001","11011111,10100000,10100001"],"meta":{"origin":{"id":"2-43","no":112,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-044","type":"fill","topic":"2.2 数据的存储与表示","diff":"中","stem":"8 位补码能表示的整数范围是 ____。","exp":"8 位补码表示范围：-128～127（即 -2^7～2^7-1），共 256 个数。","answers":["-128~127","-128-127","-128到127","-128～127","-128至127","-128—127"],"meta":{"origin":{"id":"2-44","no":113,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-045","type":"fill","topic":"2.2 数据的存储与表示","diff":"中","stem":"十进制数 13 的 8 位补码是 ____；-19 的 8 位补码是 ____。","exp":"13 为正数，补码 = 原码 = 00001101。\n-19 的真值为 -10011，原码 10010011，反码 11101100，补码 = 反码 + 1 = 11101101。","answers":["00001101 11101101","00001101,11101101"],"meta":{"origin":{"id":"2-45","no":114,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-046","type":"comp","topic":"2.2 数据的存储与表示","diff":"中","stem":"求 (-95)10 的 8 位原码、反码和补码。","exp":"(-95)10 的真值为 (-1011111)2。\n原码：最高位（符号位）取 1，其余位为数值的绝对值 1011111，左补 0 凑足 7 位 → 11011111。\n反码：符号位保持 1，其余各位对原码按位取反 → 10100000。\n补码：反码末位加 1 → 10100001。","ref":"[x]原 = 11011111，[x]反 = 10100000，[x]补 = 10100001","meta":{"origin":{"id":"2-46","no":115,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-047","type":"comp","topic":"2.2 数据的存储与表示","diff":"中","stem":"求 (121)10 的 8 位机器数（定点整数形式，即原码）。","exp":"(121)10 的真值是 (+1111001)2，共 7 位，正好填满数值位。\n符号位：正数填 0；数值位：1111001。\n故 8 位机器数为 0 1111001 = 01111001。","ref":"(121)10 的 8 位机器数为 01111001","meta":{"origin":{"id":"2-47","no":116,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-048","type":"comp","topic":"2.2 数据的存储与表示","diff":"难","stem":"求 (-0.625)10 的 8 位定点小数机器数。","exp":"(-0.625)10 的真值是 (-0.101)2。\n定点小数隐含的小数点在符号位之后、数值位最左边。\n符号位取 1；数值位 101 右补 0 凑足 7 位 → 1010000。\n故机器数为 1 1010000。","ref":"1 1010000（符号位 1，小数点位于符号位之后，数值位 1010000）","meta":{"origin":{"id":"2-48","no":117,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-049","type":"comp","topic":"2.2 数据的存储与表示","diff":"难","stem":"求 (-6.375)10 的 16 位浮点机器数（假设阶符阶码、数符尾数各占 8 位）。","exp":"(-6.375)10 的真值为 (-110.011)2。\n规格化：-110.011 = -0.110011 × 2^+11（尾数化成纯小数，小数点左移 3 位，阶码为 +11）。\n阶符阶码（8 位）：阶符 0（正）+ 阶码 0000011（右对齐补足 7 位）= 00000011。\n数符尾数（8 位）：数符 1（负）+ 尾数 110011 后补 0 凑足 7 位 → 1100110 = 11100110。\n合起来即 00000011 11100110。","ref":"阶符阶码 = 00000011，数符尾数 = 11100110，即 00000011 11100110","meta":{"origin":{"id":"2-49","no":118,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-050","type":"short","topic":"2.2 数据的存储与表示","diff":"中","stem":"什么是机器数？什么是真值？两者有什么区别？","exp":"答题要点：①机器数的定义与三个特点；②真值的定义；③区别在于符号是否被数字化（0/1 与 +/-）。","ref":"机器数：将数值型数据的符号和数值本身进行数字化（编码，转化为二进制码）后在计算机内的表示形式。真值：数的符号还没有数值化的二进制数称为机器数的真值，即与机器数相应的数据的实际值，直接用正号（+）和负号（-）表示其正负。区别：真值用正负号表示符号，机器数则把符号也数字化，用最高位 0 表示正、1 表示负。例如 (+26)10 的真值为 +11010，其 8 位机器数为 00011010。","meta":{"origin":{"id":"2-50","no":119,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-051","type":"short","topic":"2.2 数据的存储与表示","diff":"中","stem":"计算机中为什么采用补码表示数值？请至少说明三条理由。","exp":"答题要点：唯一性、符号位与数值位统一处理、加减法统一、节省硬件（只需加法器）。","ref":"①每个整数只有一个补码，而 0 的原码、反码都有两个（如 0 的原码有 00000000 和 10000000），采用补码可消除这种二义性；②使用补码可以将符号位和数值位统一处理，加法和减法也可以统一处理；③补码与原码相互转换的运算过程相同，不需要额外的电路；④在补码技术基础上，减法运算可以转换为加法运算，从而取缔减法操作器，计算机只要有加法装置即可。","meta":{"origin":{"id":"2-51","no":120,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-052","type":"single","topic":"2.3 数据的运算","diff":"易","stem":"二进制数 10110B + 110B =（　）。","exp":"二进制加法“逢二进一”：10110 + 00110 = 11100。即 22 + 6 = 28 = 11100B。","options":["11000B","11100B","11110B","11010B"],"answer":[1],"meta":{"origin":{"id":"2-52","no":121,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-053","type":"single","topic":"2.3 数据的运算","diff":"易","stem":"二进制数 11010B - 1001B =（　）。","exp":"二进制减法“借一当二”：11010 - 01001 = 10001。即 26 - 9 = 17 = 10001B。","options":["10001B","11001B","10011B","10101B"],"answer":[0],"meta":{"origin":{"id":"2-53","no":122,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-054","type":"single","topic":"2.3 数据的运算","diff":"中","stem":"二进制数 1110B × 1001B =（　）。","exp":"1110 × 1001 = 1110 × (1000 + 1) = 1110000 + 1110 = 1111110。即 14 × 9 = 126 = 1111110B。","options":["1110110B","1111100B","10000000B","1111110B"],"answer":[3],"meta":{"origin":{"id":"2-54","no":123,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-055","type":"single","topic":"2.3 数据的运算","diff":"中","stem":"逻辑运算 111001 XOR 101001 的结果是（　）。","exp":"异或运算“相同为 0，不同为 1”：111001 ⊕ 101001 = 010000。","options":["010000","101001","111001","000110"],"answer":[0],"meta":{"origin":{"id":"2-55","no":124,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-056","type":"single","topic":"2.3 数据的运算","diff":"中","stem":"逻辑运算 111001 AND 101001 的结果是（　）。","exp":"与运算“全 1 才为 1”：111001 ∧ 101001 = 101001。","options":["101001","111001","010000","000110"],"answer":[0],"meta":{"origin":{"id":"2-56","no":125,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-057","type":"single","topic":"2.3 数据的运算","diff":"中","stem":"逻辑运算 111001 OR 101001 的结果是（　）。","exp":"或运算“有 1 即为 1”：111001 ∨ 101001 = 111001。","options":["101001","111001","010000","000110"],"answer":[1],"meta":{"origin":{"id":"2-57","no":126,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-058","type":"single","topic":"2.3 数据的运算","diff":"难","stem":"在 8 位字长下，用补码计算 7 - 9，结果（补码形式）是（　）。","exp":"[7]补 = 00000111，[-9]补 = 11110111（9 = 00001001 → 反码 11110110 → 补码 11110111）。\n00000111 + 11110111 = 11111110，其真值为 -0000010 = -2，正确。","options":["00000010","11111111","11111110","10000010"],"answer":[2],"meta":{"origin":{"id":"2-58","no":127,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-059","type":"multi","topic":"2.3 数据的运算","diff":"中","stem":"最基本的逻辑运算包括（　）。","exp":"四种基本逻辑运算：非、与、或、异或。运算符分别为 ￢（NOT）、∧、∨、⊕。","options":["非（NOT）","与（AND）","或（OR）","异或（XOR）"],"answer":[0,1,2,3],"meta":{"origin":{"id":"2-59","no":128,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-060","type":"multi","topic":"2.3 数据的运算","diff":"中","stem":"关于补码的运算规则，下列说法正确的有（　）。","exp":"补码技术正是把减法转换为加法：[X-Y]补 = [X+(-Y)]补 = [X]补 + [-Y]补，故“补码不能用于减法运算”错误。","options":["[X]补 + [Y]补 = [X+Y]补","[X-Y]补 = [X]补 + [-Y]补","补码不能用于减法运算","[[X]补]补 = X"],"answer":[0,1,3],"meta":{"origin":{"id":"2-60","no":129,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-061","type":"single","topic":"2.3 数据的运算","diff":"易","stem":"二进制加法遵循“逢二进一”，减法遵循“借一当二”。","exp":"正确。二进制加法各位相加结果“逢二进一”，减法中“借一当二”。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-61","no":130,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-062","type":"single","topic":"2.3 数据的运算","diff":"中","stem":"异或运算中，两个位相同结果为 1，不同结果为 0。","exp":"错误。异或运算的规则是“相同为 0，不同为 1”。例如 1⊕1 = 0，1⊕0 = 1。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"2-62","no":131,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-063","type":"single","topic":"2.3 数据的运算","diff":"中","stem":"采用补码技术后，计算机只需要加法装置即可完成加法和减法运算。","exp":"正确。补码技术将减法运算转换为加法运算，从而取缔减法操作器，计算机只要有加法装置即可。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-63","no":132,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-064","type":"fill","topic":"2.3 数据的运算","diff":"易","stem":"逻辑运算中：NOT(1) = ____，0 AND 1 = ____，0 OR 1 = ____，1 XOR 1 = ____。","exp":"非：NOT(1) = 0；与：0∧1 = 0；或：0∨1 = 1；异或：1⊕1 = 0。","answers":["0 0 1 0","0,0,1,0","0；0；1；0"],"meta":{"origin":{"id":"2-64","no":133,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-065","type":"fill","topic":"2.3 数据的运算","diff":"中","stem":"设字长为 8 位，用补码计算 2 - 1 = ____（结果写成补码形式）。","exp":"[2]补 = 00000010，[-1]补 = 11111111。\n00000010 + 11111111 = 00000001（最高位进位舍去）。\n结果 00000001 即十进制 1，正确。","answers":["00000001","00000001B"],"meta":{"origin":{"id":"2-65","no":134,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-066","type":"comp","topic":"2.3 数据的运算","diff":"中","stem":"设字长为 8 位，用补码计算 1001B + 0011B，并写出最终十进制结果。","exp":"[1001]补 = 00001001，[0011]补 = 00000011。\n补码相加：00001001 + 00000011 = 00001100。\n00001100 符号位为 0，是正数，其原码 = 补码 = 00001100，即十进制 12。","ref":"[00001100]补 = 00001100，即 (12)10","meta":{"origin":{"id":"2-66","no":135,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-067","type":"comp","topic":"2.3 数据的运算","diff":"难","stem":"十进制数 X = 5，Y = 11，在单个字节（8 位）上用补码求 X - Y，并还原为十进制。","exp":"[5]补 = 00000101；[11]补 = 00001011，[-11]补 = 11110101（11 = 00001011 → 取反 11110100 → 加 1 = 11110101）。\nX - Y = [00000101 + 11110101]补 = [11111010]补。\n由补码求原码：符号位保持 1，其余取反得 10000101，再加 1 得 10000110，即 -6。","ref":"[X-Y]补 = 11111010，其原码为 10000110，即 ( -6 )10","meta":{"origin":{"id":"2-67","no":136,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-068","type":"comp","topic":"2.3 数据的运算","diff":"难","stem":"字长为 8 位，采用补码计算 x1 - x2，其中 x1 = 1001001，x2 = 10110。请写出结果的补码形式。","exp":"x1 = 1001001B = 73，x2 = 10110B = 22，x1 - x2 = 51。\n[x1]补 = 01001001，[x2]补 = 00010110，[-x2]补 = 11101010（取反 11101001 再加 1）。\n01001001 + 11101010 = 00110011（最高位进位舍去）。\n00110011 符号位为 0，为正数，其值 = 32 + 16 + 2 + 1 = 51，正确。","ref":"[x1 - x2]补 = 00110011","meta":{"origin":{"id":"2-68","no":137,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-069","type":"short","topic":"2.3 数据的运算","diff":"中","stem":"简述计算机仅用加法器完成一次加减运算的完整过程。","exp":"答题要点：五个步骤的顺序；核心在于用补码把减法变成加法，从而只需一个加法装置。","ref":"①把用户输入的十进制数转换为二进制数；②把二进制数转换为补码；③实现补码加法；④把补码形式的运算结果转换为二进制数；⑤把二进制数转换为十进制数输出给用户。即“十进制 → 二进制 → 补码 → 加法 → 二进制 → 十进制”的过程。","meta":{"origin":{"id":"2-69","no":138,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-070","type":"single","topic":"2.4 字符型数据的编码","diff":"易","stem":"标准 ASCII 码用 7 位二进制编码，在计算机内占 1 个字节。","exp":"正确。标准 ASCII 码用 7 位二进制编码，范围 0000000～1111111；为便于存储，每个 ASCII 码前加一个 0 形成 8 位，正好用 1 个字节存储。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-70","no":139,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-071","type":"single","topic":"2.4 字符型数据的编码","diff":"易","stem":"标准 ASCII 码可表示的字符个数是 128 个。","exp":"正确。7 位二进制编码可表示 2^7 = 128 个字符，其中英文字母 52 个、数字字符 10 个、标点与特殊字符 32 个、特殊控制字符 34 个。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-71","no":140,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-072","type":"fill","topic":"2.4 字符型数据的编码","diff":"中","stem":"已知英文字母 m 的 ASCII 码值为 6DH，则 ASCII 码为 71H 的英文字母是 ____。","exp":"71H - 6DH = 4，即在 m 之后第 4 个字母：m→n→o→p→q，故为 q。（也可查表：小写字母 a 为 61H，71H - 61H = 10H = 16，a 后第 16 个字母为 q。）","answers":["q","Q","字母q","小写q"],"meta":{"origin":{"id":"2-72","no":141,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-073","type":"single","topic":"2.4 字符型数据的编码","diff":"中","stem":"下列叙述中，正确的是（　）。","exp":"A 错：大写 A 为 41H，小写 a 为 61H，大写小于小写。B 错：控制字符（如 NUL、BEL）不可显示。C 错：数字字符 0～9 为 30H～39H，小于字母。D 对：标准 ASCII 码最高位（第 8 位）为 0。","options":["大写英文字母的 ASCII 码大于小写英文字母的 ASCII 码","一个字符的标准 ASCII 码占一个字节，其最高位总为 0","英文数字字符的 ASCII 码大于英文字母的 ASCII 码","标准 ASCII 码表的每一个 ASCII 码都能在屏幕显示为一个相应的字符"],"answer":[1],"meta":{"origin":{"id":"2-73","no":142,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-074","type":"single","topic":"2.4 字符型数据的编码","diff":"中","stem":"GB2312-80 国标码下，一个汉字机内码的两个字节的最高二进制位的值均为 1。","exp":"正确。汉字机内码 = 国标码 + 8080H，国标码两个字节最高位均为 0，加 8080H 后两个字节最高位都变为 1。机内码解决了西文 ASCII 码与汉字国标码间的二义性问题。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-74","no":143,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-075","type":"single","topic":"2.4 字符型数据的编码","diff":"中","stem":"一个汉字字形采用 16×16 点阵表示，4 个汉字的字形码占存储器的字节数是（　）。","exp":"16×16 点阵的一个汉字需要 16×16 ÷ 8 = 32 字节；4 个汉字为 32 × 4 = 128 字节。","options":["256","128","72","64"],"answer":[1],"meta":{"origin":{"id":"2-75","no":144,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-076","type":"single","topic":"2.4 字符型数据的编码","diff":"中","stem":"在同一汉字系统中，用拼音、五笔等不同的汉字输入方式输入的同一汉字，则下列说法错误的是（　）。","exp":"输入码（外码）随输入方式不同而不同（拼音码、五笔字形码各异），但输入后都会被转换为统一的机内码，其国标码、机内码、字形码都是相同的。","options":["国标码相同","机内码相同","字形码相同","外码相同"],"answer":[3],"meta":{"origin":{"id":"2-76","no":145,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-077","type":"single","topic":"2.4 字符型数据的编码","diff":"易","stem":"以 JPG 为文件格式扩展名的文件通常是（　）。","exp":"常见图像文件格式有 JPG、JPEG、BMP、GIF 等；音频有 WAV、MP3、WMA 等；视频有 AVI、WMV、MPEG、MP4、MOV 等。","options":["音频文件","文本文件","视频文件","图像文件"],"answer":[3],"meta":{"origin":{"id":"2-77","no":146,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-078","type":"single","topic":"2.4 字符型数据的编码","diff":"易","stem":"对声音波形采样时，采样频率越高，声音文件的数据量越大。","exp":"正确。采样频率越大，描绘出的波形越精确，但数据量也越大。音频数据量 = 采样频率 × 量化位数 × 声道数 × 时长。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-78","no":147,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-079","type":"fill","topic":"2.4 字符型数据的编码","diff":"中","stem":"24×24 点阵的一个汉字字形码占用的字节数是 ____ 字节。","exp":"每个汉字字形码占用字节数 = 点阵列数 ÷ 8 × 行数 = 24 ÷ 8 × 24 = 3 × 24 = 72 字节。","answers":["72","72B","72字节"],"meta":{"origin":{"id":"2-79","no":148,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-080","type":"single","topic":"2.4 字符型数据的编码","diff":"中","stem":"彩色图像中每个像素的颜色用红、绿、蓝各 8 位二进制数表示，共可表示的颜色种数是（　）。","exp":"R、G、B 各 8 位，共 24 位，可表示 2^24 = 16 777 216 种颜色，每个像素占 3 个字节。","options":["2^8","2^24","2^16","2^32"],"answer":[1],"meta":{"origin":{"id":"2-80","no":149,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-081","type":"multi","topic":"2.4 字符型数据的编码","diff":"中","stem":"汉字编码体系包括（　）。","exp":"四项均属于汉字编码：输入码用于把汉字输入计算机；国标码用于不同汉字系统间交换信息；机内码用于计算机内部存储、处理和传输；字形码用于显示和打印输出。","options":["输入码（外码）","交换码（国标码）","机内码","字形码"],"answer":[0,1,2,3],"meta":{"origin":{"id":"2-81","no":150,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-082","type":"multi","topic":"2.4 字符型数据的编码","diff":"中","stem":"关于 ASCII 码，下列说法正确的有（　）。","exp":"四项均正确。字符 0～9 的编码为 30H～39H，大写 A～Z 为 41H～5AH，小写 a～z 为 61H～7AH。","options":["标准 ASCII 码最高位为 0","标准 ASCII 码值范围是 0～127","大写字母 A 的 ASCII 码是 41H","扩展 ASCII 码的最高位是 1，范围为 0～255"],"answer":[0,1,2,3],"meta":{"origin":{"id":"2-82","no":151,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-083","type":"multi","topic":"2.4 字符型数据的编码","diff":"中","stem":"下列属于汉字输入码（外码）的有（　）。","exp":"输入码主要有数字码（区位码）、拼音码、字形码（如五笔字型）、音形码（如自然码）、手写码等。","options":["区位码（数字码）","拼音码","五笔字型（字形码）","手写码"],"answer":[0,1,2,3],"meta":{"origin":{"id":"2-83","no":152,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-084","type":"multi","topic":"2.4 字符型数据的编码","diff":"中","stem":"关于图像信息，下列说法正确的有（　）。","exp":"四项均正确。图像由像素组成，分辨率通常用 PPI（像素/英寸）或水平像素数×垂直像素数表示。","options":["黑白图像每个像素用 1 个二进制位表示","灰度图像可用 8 位表示 256 种灰度","彩色图像每个像素可用 24 位表示","分辨率越高图像越清晰，但数据量越大"],"answer":[0,1,2,3],"meta":{"origin":{"id":"2-84","no":153,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-085","type":"single","topic":"2.4 字符型数据的编码","diff":"中","stem":"一个汉字只有一个国标码，也只有一个机内码。","exp":"正确。GB2312-80 中一个汉字只有一个国标码，也只有一个机内码；而输入码（外码）可以有多种。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-85","no":154,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-086","type":"single","topic":"2.4 字符型数据的编码","diff":"中","stem":"汉字机内码 = 国标码 + 8080H。","exp":"正确。在 GB2312-80 国标码下，机内码由国标码的两个字节最高位置 1 转换形成，即机内码 = 国标码 + 8080H；而国标码 = 区位码 + 2020H。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-86","no":155,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-087","type":"single","topic":"2.4 字符型数据的编码","diff":"中","stem":"汉字字形采用矢量表示方法时，放大或缩小时会失真。","exp":"错误。点阵汉字在放大时会失真；矢量表示方法存储的是汉字字形的轮廓特征，输出时再生成所需大小和形状，放大或缩小都不失真。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"2-87","no":156,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-088","type":"single","topic":"2.4 字符型数据的编码","diff":"易","stem":"采样频率越高、量化位数越多，音频的数据量越大。","exp":"正确。音频数据量 = 采样频率 × 量化位数 × 声道数 × 时长，采样频率越高、量化位数越多，数据量越大。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-88","no":157,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-089","type":"single","topic":"2.4 字符型数据的编码","diff":"中","stem":"扩展 ASCII 码的最高位是 1，其码值范围为 0～255。","exp":"正确。标准 ASCII 码最高位为 0、范围 0～127；扩展 ASCII 码最高位为 1，范围 0～255。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"2-89","no":158,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-090","type":"fill","topic":"2.4 字符型数据的编码","diff":"易","stem":"标准 ASCII 码用 7 位二进制编码，共可表示 ____ 个字符；在计算机内占 ____ 个字节。","exp":"2^7 = 128 个字符；为便于存储，每个 ASCII 码前加一个 0 形成 8 位，正好占 1 个字节。","answers":["128 1","128,1","128；1"],"meta":{"origin":{"id":"2-90","no":159,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-091","type":"fill","topic":"2.4 字符型数据的编码","diff":"中","stem":"大写字母 A 的 ASCII 码是 ____H，小写字母 a 的 ASCII 码是 ____H。","exp":"A 的 ASCII 码为 41H（= 65D），a 为 61H（= 97D）。大写 A～Z 从 41H 顺序递增，小写 a～z 从 61H 顺序递增。","answers":["41 61","41,61","41H 61H","41H,61H"],"meta":{"origin":{"id":"2-91","no":160,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-092","type":"fill","topic":"2.4 字符型数据的编码","diff":"中","stem":"国标码 = 区位码 + ____H；机内码 = 国标码 + ____H。","exp":"国标码 = 区位码 + 2020H；机内码 = 国标码 + 8080H = 区位码 + A0A0H。","answers":["2020 8080","2020,8080","2020H 8080H","2020H,8080H"],"meta":{"origin":{"id":"2-92","no":161,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-093","type":"fill","topic":"2.4 字符型数据的编码","diff":"中","stem":"已知“啊”字的区位码为 16 区 01 位，其国标码为 ____H，机内码为 ____H。","exp":"区位码 16 区 01 位 → 十六进制表示为 1001H（区号 16 = 10H，位号 01 = 01H）。\n国标码 = 区位码 + 2020H = 1001H + 2020H = 3021H。\n机内码 = 国标码 + 8080H = 3021H + 8080H = B0A1H。","answers":["3021 B0A1","3021,B0A1","3021H B0A1H","3021H,B0A1H"],"meta":{"origin":{"id":"2-93","no":162,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-094","type":"fill","topic":"2.4 字符型数据的编码","diff":"中","stem":"一个 16×16 点阵汉字的字形码占 ____ 字节。","exp":"16 × 16 ÷ 8 = 32 字节。（每个汉字字形码占用字节数 = 点阵列数 ÷ 8 × 行数）","answers":["32","32B","32字节"],"meta":{"origin":{"id":"2-94","no":163,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-095","type":"comp","topic":"2.4 字符型数据的编码","diff":"中","stem":"已知“啊”字的区位码为 1601（16 区 01 位），求其国标码与机内码（用十六进制表示）。","exp":"①区位码转十六进制：区号 16 → 10H，位号 01 → 01H，故区位码为 1001H。\n②国标码 = 区位码 + 2020H = 1001H + 2020H = 3021H。\n③机内码 = 国标码 + 8080H = 3021H + 8080H = B0A1H。\n验证：机内码两个字节 B0H、A1H 的最高位均为 1，符合汉字机内码特征。","ref":"国标码 = 3021H，机内码 = B0A1H","meta":{"origin":{"id":"2-95","no":164,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-096","type":"comp","topic":"2.4 字符型数据的编码","diff":"中","stem":"分别计算 16×16 点阵与 24×24 点阵下，一个汉字字形码所需的存储字节数。","exp":"公式：每个汉字字形码占用字节数 = 点阵列数 ÷ 8 × 行数。\n16×16：16 ÷ 8 × 16 = 2 × 16 = 32 字节。\n24×24：24 ÷ 8 × 24 = 3 × 24 = 72 字节。","ref":"16×16 点阵：32 字节；24×24 点阵：72 字节","meta":{"origin":{"id":"2-96","no":165,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-097","type":"comp","topic":"2.4 字符型数据的编码","diff":"难","stem":"计算 44.1kHz 采样率、16 位量化、双声道音频 1 分钟的数据量（结果用 MB 表示，1MB = 1024KB）。","exp":"数据量 = 采样频率 × 量化位数 × 声道数 × 时长 ÷ 8\n= 44100 × 16 × 2 × 60 ÷ 8\n= 84 672 000 ÷ 8 = 10 584 000 字节\n10 584 000 ÷ 1024 ÷ 1024 ≈ 10.09 MB。","ref":"约 10.09 MB","meta":{"origin":{"id":"2-97","no":166,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-098","type":"comp","topic":"2.4 字符型数据的编码","diff":"难","stem":"在内存中，若汉字以 GB2312 的内码表示，已知存储了 6 个字节的字符串，其十六进制内容依次为 6AH、B1H、D2H、53H、C8H、B4H，问这个字符串中有几个汉字？","exp":"汉字机内码占 2 个字节且每个字节的最高位均为 1。\n逐个判断最高位：6AH = 01101010（最高位 0，非汉字）；B1H = 10110001（最高位 1，汉字）；D2H = 11010010（最高位 1，汉字）；53H = 01010011（最高位 0）；C8H = 11001000（最高位 1）；B4H = 10110100（最高位 1）。\n最高位为 1 的字节共 4 个，4 ÷ 2 = 2，故有 2 个汉字。","ref":"2 个汉字","meta":{"origin":{"id":"2-98","no":167,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-099","type":"comp","topic":"2.4 字符型数据的编码","diff":"中","stem":"计算一幅分辨率为 1024×768 的 24 位真彩色图像未经压缩时的数据量（结果用 MB 表示，1MB = 1024KB）。","exp":"每个像素 24 位 = 3 字节。\n数据量 = 1024 × 768 × 3 = 2 359 296 字节。\n2 359 296 ÷ 1024 ÷ 1024 = 2.25 MB。","ref":"2.25 MB","meta":{"origin":{"id":"2-99","no":168,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-100","type":"short","topic":"2.4 字符型数据的编码","diff":"中","stem":"简述汉字的四种编码（输入码、国标码、机内码、字形码）及其作用。","exp":"答题要点：四种编码的名称、作用与相互转换关系（区位码 +2020H → 国标码 +8080H → 机内码）。","ref":"①输入码（外码）：用于给计算机输入汉字的编码，主要有数字码（区位码）、拼音码、字形码（如五笔字型）、音形码（如自然码）、手写码等；②交换码（国标码）：具有不同汉字处理功能的计算机系统间交换汉字信息时使用的代码标准，如 GB2312-80，一个汉字只有一个国标码；③机内码（内码）：计算机内部存储、处理和传输汉字时所用的编码，由国标码两个字节最高位置 1 形成（机内码 = 国标码 + 8080H），解决了西文 ASCII 码与汉字国标码的二义性问题；④字形码（字模）：用于汉字在显示屏或打印机输出，有点阵和矢量两种表示方式。","meta":{"origin":{"id":"2-100","no":169,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-101","type":"short","topic":"2.4 字符型数据的编码","diff":"中","stem":"简述音频信息数字化的过程，并写出音频数据量的计算公式。","exp":"答题要点：采样 → 量化 → 编码三步；采样频率与量化位数对精度和数据量的影响；数据量公式。","ref":"音频本身是模拟信号，是连续的，不适合在计算机中直接存储，需要对其数字化，即对声音进行采样、量化、编码：①采样：对音频模拟信号每隔一个时间点取一个点，每个点对应一个数值，用离散化的点代替连续的波形；单位时间内提取的采样个数称为采样频率，常用 44.1kHz；②量化：将每个采样点的值四舍五入到有限数量的离散值，量化时所采用的二进制位数叫量化位数；③编码：把量化后的结果用二进制编码表示并存储。数据量 = 采样频率 × 量化位数 × 声道数 × 时长（÷8 换算为字节）。","meta":{"origin":{"id":"2-101","no":170,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-102","type":"short","topic":"2.4 字符型数据的编码","diff":"中","stem":"什么是位模式？请说明计算机中数值、文本、图像、音频、视频等数据是如何统一存储的。","exp":"答题要点：位模式定义（0/1 序列、1Byte = 8bit）；不同数据类型都通过“编码 → 存储 → 解码”统一为位模式。","ref":"位模式是由一串 0 和 1 组成的二进制序列（若干个位 bit 组成的位的集合）来表示数据，一般以 8 个位构成一个字节（Byte），即 1Byte = 8bit。计算机中各种类型的数据（文本、数字、图像、音频、视频）都要先经过编码转换成统一的位模式后存入内存，需要使用时再经过译码（解码）还原为原来的信息形式。因此，无论数据的原始形式如何，在计算机内部都以二进制位模式统一存储和处理。","meta":{"origin":{"id":"2-102","no":171,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-103","type":"comp","topic":"2.2 数据的存储与表示","diff":"中","stem":"求 (-128)10 的 8 位补码。","exp":"8 位补码的表示范围是 -128～127，其中 10000000 专门用来表示 -128。\n验证：若按“原码 → 反码 → 补码”推，-128 的绝对值 128 需 8 位表示（10000000），已超出 7 位数值位，故不能用原码表示；补码中 10000000 的权值为 -2^7 = -128，正好对应。\n结论：(-128)10 的 8 位补码为 10000000。","ref":"[x]补 = 10000000","meta":{"origin":{"id":"2-103","no":172,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-104","type":"comp","topic":"2.2 数据的存储与表示","diff":"中","stem":"已知定点整数 x = -10110，求其 8 位原码、反码和补码。","exp":"x 的真值为 -10110，数值位 10110 只有 5 位，左补 0 凑足 7 位数值位得 0010110。\n原码：符号位取 1 + 数值位 0010110 → 10010110。\n反码：符号位保持 1，其余各位对原码按位取反 → 11101001。\n补码：反码末位加 1 → 11101010。\n（验证：11101010 的真值 = -128 + 64 + 32 + 8 + 2 = -22，而 10110B = 22，正确。）","ref":"[x]原 = 10010110，[x]反 = 11101001，[x]补 = 11101010","meta":{"origin":{"id":"2-104","no":173,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-105","type":"comp","topic":"2.3 数据的运算","diff":"难","stem":"设字长为 8 位，用补码计算 25 - 37，并还原为十进制数。","exp":"[25]补 = 00011001。\n[37]补 = 00100101，[-37]补 = 11011011（取反 11011010 再加 1）。\n25 - 37 = [00011001 + 11011011]补 = [11110100]补。\n由补码求原码：符号位保持 1，其余取反得 10001011，再加 1 得 10001100，即 -12。\n验证：25 - 37 = -12，正确。","ref":"[25-37]补 = 11110100，其真值为 -12","meta":{"origin":{"id":"2-105","no":174,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-106","type":"comp","topic":"2.4 字符型数据的编码","diff":"难","stem":"计算 44.1kHz 采样率、16 位量化、单声道音频 30 秒的数据量（结果用 MB 表示，1MB = 1024KB）。","exp":"数据量 = 采样频率 × 量化位数 × 声道数 × 时长 ÷ 8\n= 44100 × 16 × 1 × 30 ÷ 8\n= 21 168 000 ÷ 8 = 2 646 000 字节\n2 646 000 ÷ 1024 ÷ 1024 ≈ 2.52 MB。","ref":"约 2.52 MB","meta":{"origin":{"id":"2-106","no":175,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-107","type":"comp","topic":"2.4 字符型数据的编码","diff":"中","stem":"计算一幅分辨率为 800×600 的 256 级灰度图像未经压缩时的数据量（结果用 KB 表示，1KB = 1024B）。","exp":"256 级灰度需 8 位（1 字节）表示一个像素。\n像素总数 = 800 × 600 = 480 000 个。\n数据量 = 480 000 × 1 = 480 000 字节。\n480 000 ÷ 1024 = 468.75 KB。","ref":"468.75 KB","meta":{"origin":{"id":"2-107","no":176,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-108","type":"comp","topic":"2.1 进位计数制及其转换","diff":"中","stem":"将二进制数 (1101.101)2 分别转换为十进制数和八进制数。","exp":"①转十进制（按权展开求和）：1×2^3 + 1×2^2 + 0×2^1 + 1×2^0 + 1×2^-1 + 0×2^-2 + 1×2^-3 = 8 + 4 + 1 + 0.5 + 0.125 = 13.625。\n②转八进制（以小数点为界三位并一位，不足补 0）：001 101 . 101 → 1 5 . 5，即 15.5。","ref":"(1101.101)2 = (13.625)10 = (15.5)8","meta":{"origin":{"id":"2-108","no":177,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-109","type":"short","topic":"2.2 数据的存储与表示","diff":"中","stem":"什么是字？什么是字长？字长对计算机性能有什么影响？","exp":"答题要点：字的定义、字长的定义、字长由 CPU 决定、字长越长精度越高处理能力越强。","ref":"字是指在计算机中作为一个整体被存取、传送、处理的一组二进制位；计算机内部是以字为单位进行处理、存储和传送数据或指令的。字长是一个字所包含的二进制位数，通常是字节的整数倍，如 16 位、32 位、64 位等。字长由 CPU 的类型决定，是 CPU 的主要技术指标之一，指的是 CPU 一次能并行处理的二进制位数。字长越长，运算精度越高，处理能力越强。CPU 运算器中的加法器、累加器以及其他一些寄存器都选择与字长相同的位数，便于不同部件间的数据传送和处理效率。","meta":{"origin":{"id":"2-109","no":178,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-110","type":"short","topic":"2.2 数据的存储与表示","diff":"中","stem":"简述原码、反码、补码的定义及其相互关系。","exp":"答题要点：三码定义、正负数区别、补码 = 反码 + 1、0 的特殊性。","ref":"原码：如果真值是正数，则最高位为 0，其他位为数值的绝对值；如果真值是负数，则最高位为 1，其他位为数值的绝对值。反码：正数的反码与原码相同；负数的反码是最高位为 1，其他位对原码按位取反（1 变 0、0 变 1）。补码：正数的补码与原码相同；负数的补码是最高位为 1，其他位按位取反后加 1，即负整数的补码为其反码加 1。关系：正整数的原码、反码和补码均相同，符号位为 0、数值位为数的绝对值；负整数的原码、反码和补码均不相同，补码 = 反码 + 1。0 的原码和反码各有两种表示，而 0 的补码只有一种。","meta":{"origin":{"id":"2-110","no":179,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-111","type":"short","topic":"2.2 数据的存储与表示","diff":"中","stem":"简述定点数与浮点数的区别，并说明浮点数的组成与规格化。","exp":"答题要点：定点（小数点固定）vs 浮点（小数点浮动）；浮点数四要素（阶符、阶码、数符、尾数）；规格化的含义与目的。","ref":"定点数的小数点位置是隐含约定、固定不变的，分为定点整数（小数点约定隐含在数的最右边）和定点小数（小数点隐含在符号位之后、数值位最左边），仅适用于特定场景。浮点数用来表示数值型数据中的非纯小数，其小数点位置是浮动的。任何一个二进制非纯小数都可表示成 N = ±D × 2^±p 的指数形式，其中 D 为尾数、其前面的符号为数符，p 为阶码、其前面的符号为阶符。浮点数的规格化：如果一个浮点数的尾数不符合纯小数的形式，则需要将其转换为纯小数的形式，规格化后尾数是绝对值大于等于 0.1 且小于 1 的数。浮点数事实上是定点整数（阶符阶码）和定点小数（数符尾数）的组合；尾数的位数决定数的精度，阶码的位数决定数的大小。","meta":{"origin":{"id":"2-111","no":180,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-112","type":"short","topic":"2.4 字符型数据的编码","diff":"中","stem":"简述黑白图像、灰度图像和彩色图像在计算机中的表示方法。","exp":"答题要点：黑白 1 位、灰度 8 位（256 级）、彩色 RGB 各 8 位共 24 位；分辨率与数据量的关系。","ref":"图像由一个个点（像素）组成。①黑白图像：每个像素用 1 个二进制位表示，如 1 表示黑、0 表示白（或反之）；②灰度图像：每个像素用多个二进制位表示，如 8 个二进制位，从 00000000（纯黑）到 11111111（纯白），中间值为不同深浅的灰度，共可表示 256 种灰度；③彩色图像：每个像素的颜色用红、绿、蓝 3 种颜色混合表示，每种颜色用 8 位二进制数表示颜色层次，因此每个像素需要用 3 个字节（24 位）表示，共可表示 2^24 种颜色。衡量图像质量的指标是分辨率，通常用 PPI（像素/英寸）或水平像素数×垂直像素数表示；分辨率越高图像越清晰，但数据量越大。","meta":{"origin":{"id":"2-112","no":181,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-113","type":"short","topic":"2.4 字符型数据的编码","diff":"中","stem":"简述视频与动画的区别与联系，并说明为什么视频数据量很大。","exp":"答题要点：>24 帧/秒；动画（人工/计算机生成）vs 视频（实时摄取）；本质是图像在时间上的序列；因此数据量大需压缩。","ref":"连续的图像每秒超过 24 帧时，人眼无法辨别出单幅的静态图像画面，这种连续的画面就是视频。二者的区别在于每帧图像的来源：当组成连续动态图像中的每帧图像是人工或计算机加工形成的，则称动画；当每帧图像是通过实时摄取自然影像或活动对象而成的，则称视频。二者的联系在于：动画或视频都是由一系列的单幅图像（帧）在时间上组合而成的，即“视频是图像（帧）在时间上的表示”。正因为一秒钟就需要 24 帧以上的图像，一段视频的数据量非常大，在存储或传输时需要压缩。常见视频格式有 AVI、WMV、MPEG（MPG/DAT/VOB）、MP4、MOV 等。","meta":{"origin":{"id":"2-113","no":182,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-114","type":"short","topic":"2.2 数据的存储与表示","diff":"易","stem":"简述计算机中存储容量的单位及换算关系，并说明为什么采用 1024 而不是 1000。","exp":"答题要点：bit 与 Byte 的定义及 1B = 8bit；KB→YB 的换算链；1024 = 2^10 源于二进制。","ref":"位（bit）是计算机中最小的信息存储单位，即二进制数的一位，其值可为 0 和 1。字节（Byte，简写 B）是把 8 个二进制位组合在一起形成的，是计算机用来表示存储空间大小的基本容量单位，1Byte = 8bit。更大的单位及换算关系为：1KB = 2^10 B = 1024B，1MB = 1024KB，1GB = 1024MB，1TB = 1024GB，1PB = 1024TB，1EB = 1024PB，1ZB = 1024EB，1YB = 1024ZB。采用 1024（即 2^10）而非 1000，是因为计算机内部采用二进制，2 的整数次幂便于地址计算与硬件实现。","meta":{"origin":{"id":"2-114","no":183,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"},{"qid":"cs.u2-115","type":"short","topic":"2.4 字符型数据的编码","diff":"中","stem":"简述汉字国标码与机内码的关系，为什么要设置机内码？","exp":"答题要点：国标码定义（GB2312-80、6763 个汉字）；机内码定义；机内码 = 国标码 + 8080H；目的是解决与 ASCII 码的二义性。","ref":"国标码（交换码）是指具有不同汉字处理功能的计算机系统间在交换汉字信息时所使用的代码标准，如 1980 年制定的 GB2312-80，共包括 6763 个汉字（一级 3755 个按拼音排序、二级 3008 个按部首排序）及标点、字母、图形、数码等 682 个符号。机内码又称“汉字 ASCII 码”，是计算机内部存储、处理和传输汉字时所用的编码。在 GB2312-80 国标码下，机内码由该汉字国标码的两个字节最高位置“1”转换形成，即：机内码 = 国标码 + 8080H（而国标码 = 区位码 + 2020H）。设置机内码的原因是：国标码两个字节的最高位均为 0，与西文 ASCII 码（最高位为 0）无法区分，存在二义性；把两个字节的最高位都置为 1 后，就可以把汉字与西文字符区分开来。","meta":{"origin":{"id":"2-115","no":184,"mod":"第 2 章 数的表示与存储","ch":2},"source":"计算机导论 题库合集（原站）"},"_unit":"u2"}]}],"wrong":{"exitStreak":1},"mastery":{"wAll":0.4,"wRecent":0.6,"recentN":5,"weakBelow":60,"solidAt":85,"solidStreak":4,"passMinQ":4,"passRate":0.9,"dueDays":[1,3,7]},"codec":{"version":10,"gidBits":32,"budgetBytes":60   /* ---------------------------------------------------------------- 站点实例 */

    this.retired = {};

  Site.prototype._index = function (units) {

        q._unitLabel = unit.label;
        q._unitTitle = unit.title;

        self.byQid[q.qid] = q;
        if (!seen[q._gid]) { seen[q._gid] = 1; list.push(q._gid); }
        if (!seenSubj[q._gid]) { seenSubj[q._gid] = 1; self.scopeSubject.push(q._gid); }

  /* ---- 状态读取（投影视图） ---- */

  Site.prototype.get = function (gid) {

  };

  Site.prototype.allFav = function () { return this.store.get('fav', {}); };

    var ans = this.store.get('ans', {});

    // 跨设备 / 导入导出仍走 mergeRecord 的信息量优先，那是合并两处记录，不是同一次作答。
    if (patch.ok !== undefined) rec.ok = patch.ok;
    ans[gid] = rec;
    this.store.set('ans', ans);
    this._applyWrong(gid, rec, mode);

  // 规范 5.8：按信息量合并，不用先到先得
  function mergeRecord(prev, patch) {
    if (!prev) {
      var base = { ok: patch.ok == null ? null : patch.ok, at: patch.at || Date.now() };
      if (patch.p && patch.p.length) base.p = patch.p.slice().sort(function (a, b) { return a - b; });
      if (patch.x != null) base.x = patch.x;
      if (patch.m) base.m = patch.m;
      if (patch.c != null) base.c = patch.c;
      if (patch.self) base.self = true;
      return base;
    }
    var out = { ok: prev.ok, at: prev.at };
    if (prev.p) out.p = prev.p.slice();
    if (prev.x != null) out.x = prev.x;
    if (prev.m) out.m = prev.m;
    if (prev.c != null) out.c = prev.c;
    if (prev.self) out.self = true;

    if (patch.p && patch.p.length) out.p = patch.p.slice().sort(function (x, y) { return x - y; });

    if (patch.c != null && (out.c == null || patch.c > out.c)) out.c = patch.c;

  /* ---- 错题状态机（规范 5.2 八条） ---- */

      this.store.set('suppress', suppressed);
      return;
    }
    if (rec.ok === true && mode === 'wrong' && inSet) {   // #2

      this._streak[gid] = streak;

        delete this._streak[gid];

  };

    var sup = this.store.get('suppress', {});

    var wrong = this.store.get('wrong', {});

    if (!records.length) return { topic: topic, score: null, level: null, n: 0 };

      if (r.c != null) return r.c;
      return 0;

    var ok = r.ok === true ? true : (r.ok === false ? false : null);
    var picked = Array.isArray(r.picked) ? r.picked : (Array.isArray(r.p) ? r.p : null);
    var text = r.text != null ? r.text : (r.x != null ? r.x : '');
    var answered = !!picked || !!text || ok !== null || r.done === true;
    if (!answered) return null;
    var rec = { ok: ok, at: typeof r.at === 'number' ? r.at : Date.now() };
    if (picked && picked.length) {
      rec.p = picked.filter(function (k) { return typeof k === 'number' && k >= 0; })
        .sort(function (a, b) { return a - b; });
    }
    if (text) rec.x = cleanText(text).trim();
    if (r.self === true) rec.self = true;
    if (typeof r.c === 'number') rec.c = r.c;
    return rec;
  }

  function eachLegacyEntry(value, fn) {
    if (value == null) return;
    if (Array.isArray(value)) { value.forEach(function (g) { if (typeof g === 'string') fn(g, 1); }); return; }
    if (typeof value !== 'object') return;
    Object.keys(value).forEach(function (g) { fn(g, value[g]); });
  }

  // 幂等：迁移过一次就记标记，不重复覆盖用户此后产生的记录
  Site.prototype.migrateLegacy = function () {
    var store = this.store;
    if (store.get('migrated', null)) return { skipped: true, ans: 0, wrong: 0, fav: 0 };
    if (typeof localStorage === 'undefined' || !localStorage.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    var idMap = this.legacyIdMap || {};
    var ans = store.get('ans', {});
    var wrong = store.get('wrong', {});
    var fav = store.get('fav', {});
    var self = this;
    var counts = { ans: 0, wrong: 0, fav: 0, orphan: 0 };
    var handled = [];

    function resolve(key) {
      if (/^g[0-9a-f]{8}([0-9a-f]{8})?$/.test(key)) return key;
      return idMap[key] || null;
    }

    var names = [];
    for (var i = 0; i < localStorage.length; i++) names.push(localStorage.key(i));

    names.forEach(function (name) {
      var m = LEGACY_RE.exec(name);
      if (!m) return;
      var kind = m[1];
      var raw;
      try { raw = JSON.parse(localStorage.getItem(name) || 'null'); } catch (e) { return; }
      handled.push(name);

      eachLegacyEntry(raw, function (key, val) {
        var gid = resolve(key);
        if (!gid) { counts.orphan++; return; }
        if (kind === 'ans') {
          var rec = toRecord(val);
          if (!rec) return;
          if (!ans[gid]) { ans[gid] = rec; counts.ans++; }
          else if (ans[gid].ok === null && rec.ok !== null) { ans[gid] = rec; counts.ans++; }
        } else if (kind === 'wrong') {
          if (!wrong[gid]) { wrong[gid] = typeof val === 'number' ? val : Date.now(); counts.wrong++; }
        } else if (kind === 'fav') {
          if (!fav[gid]) { fav[gid] = (val && typeof val === 'object' && typeof val.t === 'number') ? val.t : Date.now(); counts.fav++; }
        }
      });
    });

    if (!handled.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    store.set('ans', ans);
    store.set('wrong', wrong);
    store.set('fav', fav);
    store.set('migrated', { at: Date.now(), from: handled, counts: counts });
    // 旧键一律不删：回退到旧页面仍可用（规范 8.2 第 4 条）
    return counts;
  };

  // 导入：只覆盖作用域内，域外原样保留（规范 3.3）
  Site.prototype.importCode = function (code) {
    var snapshot = {
      ans: this.store.get('ans', {}), wrong: this.store.get('wrong', {}), fav: this.store.get('fav', {})
    };
    this.store.set('bak', { at: Date.now(), data: snapshot });

    var got = this.decode(code);
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var self = this;
    var touched = 0;

    Object.keys(got.ans).forEach(function (g) {
      var incoming = got.ans[g];
      if (got.texts[g] != null) incoming.x = cleanText(got.texts[g]);
      ans[g] = mergeRecord(ans[g] || null, incoming);
      if (incoming.ok === false) wrong[g] = Date.now();
      touched++;
    });
    Object.keys(got.fav).forEach(function (g) { fav[g] = fav[g] || Date.now(); });

    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    return { kind: got.kind, key: got.key, count: touched, v: got.v || 10 };
  };

  Site.prototype.undoImport = function () {
    var bak = this.store.get('bak', null);
    if (!bak) return false;
    this.store.set('ans', bak.data.ans || {});
    this.store.set('wrong', bak.data.wrong || {});
    this.store.set('fav', bak.data.fav || {});
    return true;
  };

  /* ---- 统计（三级口径，分母一律 gid 去重） ---- */

  Site.prototype.stats = function (unitKey) {
    var self = this;
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var gids = unitKey ? this.scopeGids('unit', unitKey) : this.order.slice();
    var seen = {}, total = 0, answered = 0, correct = 0, wrongN = 0, favN = 0;
    gids.forEach(function (g) {
      if (seen[g]) return;
      seen[g] = 1;
      total++;
      var r = ans[g];
      if (r) {
        answered++;
        if (r.ok === true) correct++;
      }
      if (wrong[g]) wrongN++;
      if (fav[g]) favN++;
    });
    return {
      total: total, answered: answered, correct: correct,
      rate: answered ? Math.round(100 * correct / answered) : null,
      wrong: wrongN, fav: favN
    };
  };

  var QB = {
    fpNorm: fpNorm, fpHash: fpHash, fingerprint: fingerprint,
    norm: norm, judge: judge, fuzzyEq: fuzzyEq, cleanText: cleanText,
    maskWidth: maskWidth, mergeRecord: mergeRecord,
    Store: Store, Site: Site,
    create: function (def, store) { return new Site(def, store); }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = QB;
  else root.QB = QB;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>计算机导论 · 第三单元 计算机组成原理</title>
<style>/* qb-page.css — 题库页面样式（内核共用，不含任何科目特有内容） */
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e4e8ef; --line2:#eef1f6;
  --text:#1e2330; --muted:#5b6373; --muted2:#6b7383;
  --accent:#2f6fed; --accent-ink:#2557c7; --accent-soft:#eaf1ff;
  --ok:#0b6b48; --ok-soft:#e7f7ef; --ok-line:#b7e6cf;
  --bad:#b42318; --bad-soft:#fdecea; --bad-line:#f6c9c4;
  --warn:#b54708; --warn-soft:#fef3e2;
  --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 72px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:14px}
.top h1{font-size:21px;margin:0;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.top .spacer{flex:1}
.home{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:6px 12px;background:#fff}
.home:hover{color:var(--accent);border-color:#c7dbff;text-decoration:none}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.block{padding:14px 16px;margin-bottom:14px}

/* stats */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;margin-bottom:14px}
.stat-k{font-size:12px;color:var(--muted2);letter-spacing:.3px}
.stat-v{font-size:19px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-bar{height:4px;border-radius:3px;background:#eef1f6;margin-top:7px;overflow:hidden}
.stat-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl+.ctl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.seg{display:inline-flex;background:#f1f4fa;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;color:#48505f}
.seg button:hover{color:var(--accent)}
.seg button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
select,input[type=search]{
  font:inherit;font-size:13.5px;color:var(--text);border:1px solid var(--line);background:#fff;
  border-radius:9px;padding:7px 10px;outline:none
}
select:focus,input[type=search]:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=search]{min-width:170px;flex:1}
.btn{
  border:1px solid var(--line);background:#fff;color:#3c4353;border-radius:9px;padding:7px 14px;
  font:inherit;font-size:13.5px;cursor:pointer;transition:.15s
}
.btn:hover:not(:disabled){border-color:#c7dbff;color:var(--accent);background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2557c7;border-color:#2557c7;color:#fff}
.btn.ghost{background:#fff}
.btn.ghost.on{color:#b54708;border-color:#f5dcb4;background:var(--warn-soft)}
.btn.small{padding:5px 11px;font-size:13px}

/* card */
#card{padding:18px 18px 16px;margin-bottom:14px}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fafbfd;white-space:nowrap}
.tag-type{color:var(--accent-ink);border-color:#c7dbff;background:var(--accent-soft)}
.tag-diff.d-0{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.tag-diff.d-1{color:var(--warn);border-color:#f5dcb4;background:var(--warn-soft)}
.tag-diff.d-2{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.q-topic{font-size:12.5px;color:var(--muted2)}
.q-no{margin-left:auto;font-size:12.5px;color:var(--muted2);font-variant-numeric:tabular-nums}
.q-stem{font-size:16.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.q-img{max-width:100%;margin-top:10px;border-radius:8px;border:1px solid var(--line)}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;
  font:inherit;font-size:15px;line-height:1.6;cursor:pointer;transition:.13s;color:var(--text)
}
.opt:hover:not(:disabled){border-color:#c7dbff;background:#fafcff}
.opt:disabled{cursor:default}
.opt-k{
  flex:0 0 24px;height:24px;border-radius:7px;background:#f1f4fa;color:#48505f;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600
}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .opt-k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.right .opt-k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .opt-k{background:var(--bad);color:#fff}

/* inputs */
.in,.ta{
  width:100%;margin-top:14px;font:inherit;font-size:15px;color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;background:#fff;resize:vertical
}
.in:focus,.ta:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
.in:disabled,.ta:disabled{background:#fafbfd;color:var(--muted)}

/* action bar */
.q-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hint{font-size:12.5px;color:var(--muted2)}
.verdict{font-size:14px;font-weight:650;padding:5px 12px;border-radius:999px}
.verdict.ok{color:var(--ok);background:var(--ok-soft)}
.verdict.bad{color:var(--bad);background:var(--bad-soft)}
.verdict.mid{color:var(--warn);background:var(--warn-soft)}

/* explanation */
.exp{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.exp-h{font-size:12.5px;color:var(--muted2);letter-spacing:.4px;margin-bottom:7px}
.exp-a{font-size:14.5px;margin:0 0 8px;padding:10px 12px;background:#f7f9fd;border-radius:9px;border:1px solid var(--line2)}
.exp-p{font-size:14.5px;color:#333a49;margin:0 0 6px;white-space:pre-wrap}
.exp-src{font-size:12px;color:var(--muted2);margin:6px 0 0}
.self{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}

/* nav */
#nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav-mid{flex:1;text-align:center;font-size:13px;color:var(--muted2);font-variant-numeric:tabular-nums}

/* mastery */
#mastery{padding:14px 16px;margin-bottom:14px}
.mt{width:100%;border-collapse:collapse;font-size:13.5px}
.mt th{text-align:left;font-weight:600;color:var(--muted2);font-size:12px;letter-spacing:.3px;padding:0 0 8px;border-bottom:1px solid var(--line2)}
.mt td{padding:7px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
.mt tr:last-child td{border-bottom:0}
.mt-t{color:#333a49}
.mt-s{font-variant-numeric:tabular-nums;font-weight:650;width:56px}
.mt-n{color:var(--muted2);width:56px;text-align:right}
.lv{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.lv-ok{color:var(--ok);background:var(--ok-soft)}
.lv-mid{color:var(--warn);background:var(--warn-soft)}
.lv-bad{color:var(--bad);background:var(--bad-soft)}

/* transfer */
#transfer{padding:14px 16px;margin-bottom:14px}
#x-code{width:100%;min-height:86px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:10px;resize:vertical;background:#fafbfd;color:#333a49}
#x-info{font-size:12.5px;color:var(--muted2);margin-top:8px;min-height:18px}
.x-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* misc */
.empty{padding:34px 8px;text-align:center}
.empty-t{font-size:15.5px;font-weight:600}
.empty-s{color:var(--muted2);font-size:13.5px;margin:6px 0 0}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:#1e2330;color:#fff;font-size:13.5px;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--muted2);font-size:12px;text-align:center;margin-top:18px;line-height:1.8}

@media (max-width:640px){
  .wrap{padding:14px 12px 64px}
  #stats{grid-template-columns:repeat(2,1fr)}
  .top h1{font-size:18.5px}
  .q-stem{font-size:16px}
  .opt{font-size:14.5px}
  input[type=search]{min-width:100%}
}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;
}
mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */
.q-stem mjx-container[display="true"],
.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */

  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;

mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */

.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>

  <div class="panel" id="card"></div>

  <details class="panel block" id="cloud-wrap" style="display:none">

  <details class="panel block">

，以及与、或、非、比较等逻辑运算。控制与调度由控制单元 CU 负责。","options":["只完成算术运算","完成算术运算和逻辑运算","只完成逻辑运算","控制和调度其他部件"],"answer":[1],"meta":{"origin":{"id":"c-02","no":186,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-003","type":"single","topic":"3.1 CPU 与基本部件","diff":"易","stem":"控制单元（CU）的主要职责是（　）。","exp":"控制单元是整个计算机的“指挥中心”：它从内存取出指令、对指令译码，再按译码结果向 ALU、存储器、I/O 等部件发出控制信号，使各部件协调工作。","options":["完成加减乘除运算","存放正在执行的程序和数据","永久保存程序和数据","取指令、译码，并向其他部件发出控制命令"],"answer":[3],"meta":{"origin":{"id":"c-03","no":187,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-004","type":"single","topic":"3.1 CPU 与基本部件","diff":"易","stem":"寄存器组位于 CPU 内部，容量很小但速度极快，用来暂存指令、数据和地址。","exp":"正确。寄存器组是 CPU 内部最快的存储部件，容量只有几十到几百字节，用于暂存当前正在处理的指令、操作数和地址，是存储器层次结构中最靠近 CPU 的一层。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"c-04","no":188,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-005","type":"single","topic":"3.1 CPU 与基本部件","diff":"易","stem":"存储器由一组存储单元组成，每个存储单元都有一个唯一的标识符，这个标识符称为（　）。","exp":"每个存储单元的唯一标识符称为地址（address）。地址从 0 开始依次加 1，像“门牌号”；单元中存放的二进制内容像“房间里的物品”，数据以字（word）为单位在存储器之间传输。","options":["地址","字","索引","端口"],"answer":[0],"meta":{"origin":{"id":"c-05","no":189,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-006","type":"single","topic":"3.1 CPU 与基本部件","diff":"易","stem":"存储器中所有可独立标识的地址单元的总数，称为（　）。","exp":"地址空间 = 存储器中可标识的独立地址单元的总数。例如 64KB、字长 1 字节的内存，地址空间是 0～65535，共 65536 个单元。","options":["字长","存储周期","地址空间","寻址方式"],"answer":[2],"meta":{"origin":{"id":"c-06","no":190,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-007","type":"single","topic":"3.1 CPU 与基本部件","diff":"易","stem":"数据在存储器之间传输时，通常以（　）为单位。","exp":"存储器由存储单元组成，每个单元长度相等、位置连续；数据以字（word）为单位在存储器之间传输，字长可以是 8 位、16 位、32 位、64 位等。","options":["字","字节","位","块"],"answer":[0],"meta":{"origin":{"id":"c-07","no":191,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-008","type":"single","topic":"3.1 CPU 与基本部件","diff":"中","stem":"一块主板上的显卡、网卡、声卡，在计算机组成中通常被称为（　）。","exp":"显卡、网卡、声卡等插在主板扩展槽上的电路板统称为适配器（也叫扩展卡、接口卡），它们负责在主机与外部设备之间转换和传递信息。","options":["总线","寄存器","控制器","适配器"],"answer":[3],"meta":{"origin":{"id":"c-08","no":192,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-009","type":"single","topic":"3.1 CPU 与基本部件","diff":"易","stem":"主板（Mainboard）上安装 CPU 及其支持电路、内存条，并提供各种标准接口和扩展槽。","exp":"正确。主板又称主机板、系统板、母板，是计算机各部件的安装基座：CPU 插座、内存插槽、PCIe 显卡接口、M.2 硬盘接口、外设接口、供电接口等都集成在主板。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"c-09","no":193,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-010","type":"fill","topic":"3.2 存储器与地址空间","diff":"中","stem":"一个 64KB、字长为 1 字节的内存，其地址空间的范围是 0～____。","exp":"64KB = 64×1024 B = 65536 个字节，即 65536 个单元。地址从 0 开始编号，因此最后一个地址是 65536−1 = 65535，地址空间为 0～65535，共需 16 位地址（2¹⁶ = 65536）。","answers":["65535","65535.0"],"meta":{"origin":{"id":"c-10","no":194,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-011","type":"comp","topic":"3.2 存储器与地址空间","diff":"中","stem":"一台计算机有 32MB 内存，按字节编址。要寻址内存中的任意一个字节，需要多少位地址？","exp":"解题关键：先统一成“字节数”，再取以 2 为底的对数。\n32MB = 32 × 2²⁰ B = 2⁵ × 2²⁰ = 2²⁵ B；\n地址位数 = log₂(单元数) = 25。","ref":"25 位。\n32MB = 2⁵ × 2²⁰ = 2²⁵ 字节，共有 2²⁵ 个字节单元，需 log₂2²⁵ = 25 位地址。","meta":{"origin":{"id":"c-11","no":195,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-012","type":"comp","topic":"3.2 存储器与地址空间","diff":"难","stem":"一台计算机有 128MB 内存，字长为 8 字节。要寻址内存中的任意一个单字，需要多少位地址？","exp":"先算“字”的个数，再取对数：\n128MB = 2²⁷ B；8 B = 2³ B；\n字数 = 2²⁷ / 2³ = 2²⁴；\n地址位数 = log₂2²⁴ = 24。\n注意与按字节寻址的区别：按字节需要 27 位，按字只需 24 位。","ref":"24 位。\n128MB = 2²⁷ 字节；每个字 8 字节 = 2³ 字节；字数 = 2²⁷ ÷ 2³ = 2²⁴ 个；需 24 位地址。","meta":{"origin":{"id":"c-12","no":196,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-013","type":"single","topic":"3.2 存储器与地址空间","diff":"中","stem":"若计算机有 N 个字的存储空间，则需要 log₂N 位的无符号数才能定位任意一个存储单元。","exp":"正确。N 个单元需要 N 种不同编码，k 位二进制可表示 2ᵏ 种，故 2ᵏ ≥ N，k = ⌈log₂N⌉。当 N 是 2 的整数次幂时，k = log₂N。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"c-13","no":197,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-014","type":"single","topic":"3.2 存储器与地址空间","diff":"中","stem":"某计算机地址总线有 24 根，按字节编址，则它最大能寻址的内存容量是（　）。","exp":"24 根地址线可产生 2²⁴ 个不同地址，按字节编址即 2²⁴ B = 16MB。这正是 80286 的寻址能力（8086 为 20 根 → 1MB，80486 为 32 根 → 4GB）。","options":["1MB","8MB","16MB","64MB"],"answer":[2],"meta":{"origin":{"id":"c-14","no":198,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-015","type":"single","topic":"3.2 存储器与地址空间","diff":"易","stem":"计算机中“内存”与“外存”的划分依据是（　）。","exp":"存储器一般分为内存（主存储器）和外存，划分依据是相对于 CPU 的位置。位于主机内部、CPU 可直接访问的为内存；硬盘、U 盘、光盘等为外存。","options":["相对于 CPU 的位置","是否具有易失性","读写速度的快慢","容量的大小"],"answer":[0],"meta":{"origin":{"id":"c-15","no":199,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-016","type":"single","topic":"3.3 存储类型与层次结构","diff":"易","stem":"关于 RAM（随机存取存储器），下列说法正确的是（　）。","exp":"RAM 是主存的主要组成部分：可随机读写（不必先访问它前面的数据），但具有易失性——系统断电后数据全部丢失。这正是编辑 Word 时要随手保存的原因（未保存的内容只存在于 RAM 中）。","options":["既能读出又能写入，断电后内容丢失","只能读出不能写入，断电后内容不丢失","只能读出不能写入，断电后内容丢失","既能读出又能写入，断电后内容不丢失"],"answer":[0],"meta":{"origin":{"id":"c-16","no":200,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-017","type":"single","topic":"3.3 存储类型与层次结构","diff":"易","stem":"ROM 中存储的内容固定不变，只能读出而不能写入，断电后内容不会丢失。","exp":"正确。ROM（Read Only Memory，只读存储器）出厂时写入固定内容，CPU 只能读取；它属于非易失性存储器，常用于存放 BIOS 等启动程序。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"c-17","no":201,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-018","type":"single","topic":"3.3 存储类型与层次结构","diff":"中","stem":"下列存储器按“存取速度由快到慢”排列，正确的是（　）。","exp":"存储器层次结构自上而下为：寄存器（CPU 内，最快、最贵、容量最小）→ Cache → 主存 → 外存（最慢、最便宜、容量最大）。越靠近 CPU 速度越快、单位价格越高、容量越小。","options":["主存 → Cache → 寄存器 → 外存","Cache → 寄存器 → 主存 → 外存","寄存器 → Cache → 主存 → 外存","寄存器 → 主存 → Cache → 外存"],"answer":[2],"meta":{"origin":{"id":"c-18","no":202,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-019","type":"single","topic":"3.3 存储类型与层次结构","diff":"中","stem":"采用存储器层次结构的主要目的是（　）。","exp":"用户需要“又快又大又便宜”的存储器，但速度快往往价格高、容量小。层次结构用少量高速存储器（寄存器、Cache）配大量低速廉价存储器（主存、外存），以合理成本获得接近高速存储器的整体性能。","options":["彻底消除存储器之间的速度差异","在速度、容量和价格之间取得折中","让外存代替主存工作","减少 CPU 的运算量"],"answer":[1],"meta":{"origin":{"id":"c-19","no":203,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-020","type":"single","topic":"3.3 存储类型与层次结构","diff":"易","stem":"Cache（高速缓冲存储器）通常位于（　）。","exp":"Cache 置于 CPU 和主存之间：存取速度比主存快，但比 CPU 内部寄存器慢；容量较小，存放主存中一部分数据的副本。","options":["CPU 内部，与寄存器同级","主存与外存之间","CPU 与主存之间","主板芯片组与外设之间"],"answer":[2],"meta":{"origin":{"id":"c-20","no":204,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-021","type":"multi","topic":"3.3 存储类型与层次结构","diff":"中","stem":"关于 Cache 的叙述，正确的有（　）。","exp":"Cache 只保存主存中“一部分”数据的副本，不可能保存全部主存内容（否则成本与体积都无法接受），故第 3 项错误。其余三项均正确。CPU 访问时先查 Cache：命中则直接取用，未命中则从主存把该字所在的数据块调入 Cache 覆盖旧内容。","options":["存取速度比主存快，但比 CPU 内部寄存器慢","任何时刻都保存着主存的全部数据副本","容量较小，通常位于 CPU 与主存之间","CPU 访问主存时先检查 Cache，未命中再从主存调入"],"answer":[0,2,3],"meta":{"origin":{"id":"c-21","no":205,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-022","type":"short","topic":"3.3 存储类型与层次结构","diff":"中","stem":"为什么在 CPU 与主存之间设置 Cache 可以提高运算效率？请结合其工作过程简要说明。","exp":"答题要点：① Cache 速度快于主存；② 存放主存数据的副本；③ 访问顺序为“先 Cache，命中直接取，未命中再调主存”；④ 依据是程序访问的局部性，命中率高 → 平均访问时间下降。","ref":"因为程序访问主存具有局部性：近期用过的数据和指令很可能再次被使用。Cache 用较快的器件保存主存中一部分数据副本。CPU 访问时先查 Cache：命中则直接从 Cache 读取，避免等待慢速主存；未命中时才从主存把该字所在的数据块调入 Cache。由于命中率通常很高，整体平均访问时间大大缩短，从而提高运算效率。","meta":{"origin":{"id":"c-22","no":206,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-023","type":"single","topic":"3.3 存储类型与层次结构","diff":"中","stem":"Cache 的容量越大越好，因此可以用 Cache 完全取代主存。","exp":"错误。Cache 由高速器件构成，价格昂贵、容量有限，只能保存主存的一小部分副本；若用 Cache 取代主存，成本将高到无法接受。Cache 的作用是“加速访问”，不是“替代主存”。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"c-23","no":207,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-024","type":"single","topic":"3.4 总线","diff":"易","stem":"按传输信息的种类划分，计算机的总线可分为（　）。","exp":"总线（Bus）是各功能部件之间传送信息的公共通信干线，由导线组成。按传输信息种类分为：数据总线（传数据与指令代码）、地址总线（传地址）、控制总线（传控制、状态和中断信号）。","options":["系统总线、局部总线和扩展总线","数据总线、指令总线和电源总线","地址总线、控制总线和 I/O 总线","数据总线、地址总线和控制总线"],"answer":[3],"meta":{"origin":{"id":"c-24","no":208,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-025","type":"single","topic":"3.4 总线","diff":"中","stem":"数据总线是双向总线，其线数取决于计算机字长；字长 32 位的计算机需要 32 根数据线。","exp":"正确。数据总线每一根线每次传送 1 位，32 位字长需要 32 根线才能一次传送一个完整的字；信息既可由 CPU 送出，也可送入 CPU，因此是双向的。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"c-25","no":209,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-026","type":"single","topic":"3.4 总线","diff":"中","stem":"地址总线是单向总线，其宽度决定了 CPU 所能寻址的最大内存空间。","exp":"正确。地址由 CPU 单向送出，用于选中存储单元或 I/O 端口。N 根地址线可寻址 2ᴺ 个单元：20 根 → 1MB，24 根 → 16MB，32 根 → 4GB。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"c-26","no":210,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-027","type":"single","topic":"3.4 总线","diff":"中","stem":"8086 有 20 根地址线，它最大能寻址的内存容量是（　）。","exp":"2²⁰ B = 1MB。这也是当年“640KB 常规内存”说法的由来（1MB 地址空间中部分留给 ROM 和显存）。","options":["64KB","16MB","1MB","4GB"],"answer":[2],"meta":{"origin":{"id":"c-27","no":211,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-028","type":"single","topic":"3.4 总线","diff":"中","stem":"80486 有 32 根地址线，它最大能寻址的内存容量是（　）。","exp":"2³² B = 2³⁰ × 2² B = 4GB。计算方法：地址线根数 N → 容量 2ᴺ 字节。","options":["40MB","128MB","4GB","1GB"],"answer":[2],"meta":{"origin":{"id":"c-28","no":212,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-029","type":"fill","topic":"3.4 总线","diff":"中","stem":"80286 有 24 根地址线，它能寻址 ____ MB 的内存。","exp":"2²⁴ B = 16 × 2²⁰ B = 16MB。规律：地址线每增加 1 根，可寻址空间翻一番。","answers":["16","16MB"],"meta":{"origin":{"id":"c-29","no":213,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-030","type":"single","topic":"3.4 总线","diff":"中","stem":"关于控制总线，下列说法正确的是（　）。","exp":"控制总线管理总线上的活动：既有 CPU 送往存储器和 I/O 接口的控制信号，也有外设反馈给 CPU 的状态、中断信号，因此一般是双向的。其条数取决于 CPU 型号，不同 CPU 不相同。","options":["只能由 CPU 单向发往外部设备","只能由外部设备单向送往 CPU","只传送数据，不传送状态和中断信号","一般是双向的，传送方向由具体控制信号决定"],"answer":[3],"meta":{"origin":{"id":"c-30","no":214,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-031","type":"single","topic":"3.4 总线","diff":"易","stem":"计算机内部各部件之间的连接方式通常采用（　）。","exp":"现代计算机内部各部件通过系统总线连接：地址总线、数据总线、控制总线共用一组导线，结构简单、便于扩展，是冯·诺依曼结构“五部分协同工作”的物理基础。","options":["全互连结构","环形结构","总线结构","星形结构"],"answer":[2],"meta":{"origin":{"id":"c-31","no":215,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-032","type":"multi","topic":"3.5 外设与外部存储","diff":"易","stem":"下列设备中，属于输入设备的有（　）。","exp":"输入设备负责把程序和数据送入计算机：键盘、鼠标、触屏、摄像头、扫描仪、各种传感器等。显示器、打印机、音箱属于输出设备。","options":["显示器","鼠标","扫描仪","键盘"],"answer":[1,2,3],"meta":{"origin":{"id":"c-32","no":216,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-033","type":"multi","topic":"3.5 外设与外部存储","diff":"易","stem":"下列设备中，属于输出设备的有（　）。","exp":"输出设备把处理结果送出计算机：显示器、打印机、音箱、投影仪等。扫描仪把纸质图像送入计算机，属于输入设备。","options":["显示器","打印机","音箱","扫描仪"],"answer":[0,1,2],"meta":{"origin":{"id":"c-33","no":217,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-034","type":"multi","topic":"3.5 外设与外部存储","diff":"中","stem":"外部设备（外设）通常包括（　）。","exp":"外设指主机以外的设备，对数据起传输、转送和存储作用，一般包括外部存储设备、输入设备、输出设备三类。CPU 属于主机核心部件，不是外设。","options":["外部存储设备，如硬盘、U 盘、光盘","输入设备，如键盘、鼠标、扫描仪","输出设备，如显示器、打印机","中央处理器 CPU"],"answer":[0,1,2],"meta":{"origin":{"id":"c-34","no":218,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-035","type":"single","topic":"3.5 外设与外部存储","diff":"中","stem":"磁介质存储设备（如磁盘）表示二进制位的方式是（　）。","exp":"磁介质存储设备用磁性存储位数据：一个点有磁性表示 1，没有磁性表示 0。光盘则利用激光在凹坑处的反射差异记录信息。","options":["利用磁性材料的有无（磁化方向）","记录凹凸坑的长度","利用光的反射强弱","利用电容的充放电"],"answer":[0],"meta":{"origin":{"id":"c-35","no":219,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-036","type":"short","topic":"3.5 外设与外部存储","diff":"中","stem":"简述机械硬盘（HDD）的基本结构与读写原理。","exp":"要点：① 盘片（表面覆铁磁材料）；② 同轴高速旋转；③ 磁头径向移动寻道；④ 靠磁性记录 0/1 完成读写。","ref":"硬盘由一个或多个铝制或玻璃制的碟片组成，碟片表面覆盖铁磁性材料。多张盘片固定在同一个转轴上，以每分钟数千转甚至更高的速度旋转；磁头在驱动马达带动下沿盘片径向移动寻道定位，通过磁化 / 检测磁介质的状态写入或读出数据。因此硬盘是精密机械与磁存储结合的设备。","meta":{"origin":{"id":"c-36","no":220,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-037","type":"single","topic":"3.5 外设与外部存储","diff":"易","stem":"关于固态硬盘（SSD），下列说法正确的是（　）。","exp":"SSD 用存储芯片保存数据，没有磁头、盘片等机械结构，原理与 U 盘相同（芯片更多）。课件数据：传输速度约为传统硬盘的 2.5 倍，最高可达 500MB/s。","options":["依靠磁头在旋转盘片上读写","不能安装操作系统","容量一定小于机械硬盘","没有机械旋转结构，读写速度比传统硬盘快"],"answer":[3],"meta":{"origin":{"id":"c-37","no":221,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-038","type":"single","topic":"3.5 外设与外部存储","diff":"中","stem":"关于 USB，下列说法正确的是（　）。","exp":"USB = Universal Serial Bus（通用串行总线），特点是速度快、使用方便、支持热插拔、连接灵活、可独立供电，几乎可连接所有外设。速率：USB 1.0/1.1 为 12Mbps；USB 3.0 为 5Gbps 且向下兼容。USB 3.0 接口多为蓝色，USB 2.0 多为白色。","options":["USB 是通用并行总线，不支持热插拔","USB 接口只能连接键盘和鼠标","USB 1.1 的最大传输速率为 5Gbps","USB 是通用串行总线，支持热插拔和独立供电"],"answer":[3],"meta":{"origin":{"id":"c-38","no":222,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-039","type":"fill","topic":"3.5 外设与外部存储","diff":"中","stem":"USB 3.0 的最大传输速率为 ____ Gbps。","exp":"USB 1.0/1.1 为 12Mbps（1996 年推出），USB 3.0 提升到 5Gbps，并向下兼容 USB 1.0/1.1/2.0。","answers":["5","5.0","5Gbps"],"meta":{"origin":{"id":"c-39","no":223,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-040","type":"comp","topic":"3.5 外设与外部存储","diff":"中","stem":"标称容量为 128GB 的 U 盘，在操作系统中显示的实际容量约为多少 GB？请写出计算过程。","exp":"这是“标称容量”与“实际显示容量”不一致的根本原因：存储厂商用 1GB = 1000³ B，操作系统用 1GB = 1024³ B。\n128000000000 / 1073741824 ≈ 119.2，故约 119GB。","ref":"约 119GB。\n厂商按十进制计算：128GB = 128×10⁹ B；\n操作系统按二进制计算：1GB = 2³⁰ B = 1073741824 B；\n128×10⁹ ÷ 2³⁰ ≈ 119.2GB。","meta":{"origin":{"id":"c-40","no":224,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-041","type":"single","topic":"3.5 外设与外部存储","diff":"易","stem":"硬盘属于外存，断电后其中保存的数据不会丢失。","exp":"正确。硬盘、U 盘、光盘都是外存，属于非易失性存储，断电后数据仍保留；内存（RAM）才是易失性的。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"c-41","no":225,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-042","type":"fill","topic":"3.6 指令与指令周期","diff":"中","stem":"一条指令通常用二进制代码表示，一般由 ____ 和 ____ 两部分组成。","exp":"指令格式 = 操作码 + 地址码。\n操作码：规定 CPU 执行什么操作（如加、减、传送）；\n地址码：指出源操作数从哪里取、结果送往哪里、下一条指令从哪里取。","answers":["操作码地址码","操作码和地址码","操作码、地址码"],"meta":{"origin":{"id":"c-42","no":226,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-043","type":"single","topic":"3.6 指令与指令周期","diff":"易","stem":"指令中操作码的作用是（　）。","exp":"操作码指明“做什么”（加、减、传送、跳转等），地址码指明“对谁做、结果放哪”。例如 32 位指令 00000010 00000100 00000001 00000110 中，前 8 位 00000010 为操作码（减法），后三个地址码分别为被减数、减数和目的地址。","options":["指出源操作数的地址","指出下一条指令的地址","指出结果存放的地址","规定 CPU 执行什么操作"],"answer":[3],"meta":{"origin":{"id":"c-43","no":227,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-044","type":"single","topic":"3.6 指令与指令周期","diff":"易","stem":"一个指令周期通常包括的三个步骤是（　）。","exp":"指令周期 = 取指令 + 译码 + 执行。① 取指：控制单元把下一条指令复制到指令寄存器 IR，程序计数器 PC 自动加 1；② 译码：控制单元分析指令，产生可执行的二进制控制代码；③ 执行：控制单元向相应部件发出命令完成任务。","options":["输入、处理、输出","取指令、译码、执行","编辑、编译、运行","取数、运算、存数"],"answer":[1],"meta":{"origin":{"id":"c-44","no":228,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-045","type":"single","topic":"3.6 指令与指令周期","diff":"中","stem":"取指令阶段完成后，程序计数器（PC）会自动加 1，指向内存中的下一条指令。","exp":"正确。PC 存放“下一条将要执行指令”的地址。取指时把 PC 所指指令送入指令寄存器 IR，随后 PC 自动加 1（变长指令则加上指令长度），从而保证程序能顺序执行。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"c-45","no":229,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-046","type":"single","topic":"3.6 指令与指令周期","diff":"中","stem":"指令寄存器（IR）的作用是（　）。","exp":"IR 存放当前正在执行的指令，供译码器分析；PC 存放的是下一条指令的地址；运算结果一般暂存在通用寄存器或累加器中。","options":["存放运算结果","存放下一条指令的地址","存放当前正在执行的指令","存放内存单元的地址"],"answer":[2],"meta":{"origin":{"id":"c-46","no":230,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-047","type":"short","topic":"3.6 指令与指令周期","diff":"中","stem":"以“从内存取两个数相减”为例，说明指令周期三个阶段分别做了什么。","exp":"要点：取指（PC→IR，PC+1）→ 译码（识别操作、解析地址）→ 执行（取操作数、ALU 运算、写回结果）。","ref":"① 取指令：控制单元按程序计数器 PC 的地址，从内存把这条减法指令复制到指令寄存器 IR，PC 自动加 1 指向下一条指令；\n② 译码：控制单元对 IR 中的指令译码，识别出这是减法操作，并解析出两个源操作数地址和一个目的地址；\n③ 执行：按地址从内存取出被减数与减数送入 ALU 完成减法，再把结果写回目的地址。","meta":{"origin":{"id":"c-47","no":231,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-048","type":"single","topic":"3.6 指令与指令周期","diff":"易","stem":"计算机能够识别并执行、规定某一种操作的二进制代码称为（　）。","exp":"指令（instruction）是能被计算机识别并执行的二进制代码，规定一种基本操作；一系列按顺序排列的指令构成程序（program）。","options":["程序","指令","数据","地址"],"answer":[1],"meta":{"origin":{"id":"c-48","no":232,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-049","type":"multi","topic":"3.7 冯·诺依曼体系结构","diff":"易","stem":"冯·诺依曼体系结构把计算机划分为五个基本部分，包括（　）。","exp":"五部分为：运算器、控制器、存储器、输入设备、输出设备，通过系统总线连接协同工作。其中运算器和控制器是核心，构成现代 CPU 的 ALU 与控制单元。","options":["运算器","控制器","存储器","输入设备和输出设备"],"answer":[0,1,2,3],"meta":{"origin":{"id":"c-49","no":233,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-050","type":"single","topic":"3.7 冯·诺依曼体系结构","diff":"易","stem":"冯·诺依曼体系结构的核心思想是（　）。","exp":"核心思想有两条：① 存储程序——程序（指令）和数据一样以二进制形式存放在同一个存储器中，改任务只需改存储器内容，无需重接线路；② 程序顺序执行——控制器按顺序取指、分析、执行。","options":["并行处理","流水线执行","存储程序","虚拟存储"],"answer":[2],"meta":{"origin":{"id":"c-50","no":234,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-051","type":"single","topic":"3.7 冯·诺依曼体系结构","diff":"中","stem":"冯·诺依曼体系结构又称普林斯顿结构，其指令和数据存放在同一个存储器中。","exp":"正确。冯·诺依曼结构把指令存储器和数据存储器合并在一起，统称普林斯顿结构；与之相对的哈佛结构则将指令与数据分开存储。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"c-51","no":235,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-052","type":"single","topic":"3.7 冯·诺依曼体系结构","diff":"中","stem":"在冯·诺依曼结构中，程序和数据必须分别存放在两个物理上独立的存储器中。","exp":"错误。冯·诺依曼结构的特点恰恰是“指令与数据合并存储于同一存储器”，二者以相同形式（二进制）存放，靠地址区分。分开存储的是哈佛结构。","options":["正确","错误"],"answer":[1],"meta":{"origin":{"id":"c-52","no":236,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-053","type":"single","topic":"3.7 冯·诺依曼体系结构","diff":"中","stem":"下列对冯·诺依曼计算机工作过程的描述，最准确的是（　）。","exp":"工作流程：输入设备把程序和数据送入存储器 → 控制器从存储器顺序取指令并译码 → 运算器按控制信号运算 → 结果写回存储器或经输出设备输出。整个过程由存储程序与程序顺序执行思想支撑。","options":["程序和数据由输入设备送入存储器，控制器按顺序取指、译码，运算器执行运算，结果经输出设备输出","各部件独立工作、互不通信","程序通过硬件接线设置，执行时无需从存储器取指令","指令和数据分别存放在两个存储器中，由两条总线并行读取"],"answer":[0],"meta":{"origin":{"id":"c-53","no":237,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-054","type":"single","topic":"3.7 冯·诺依曼体系结构","diff":"中","stem":"下列关于计算机部件的说法中，正确的是（　）。","exp":"逐项辨析：\nA 错：微处理器是 CPU 芯片，主机还包括内存、主板等；\nB 错：并行处理可同时执行多条指令的多个步骤（如流水线）；\nC 对：主板集成 CPU 插座、内存插槽、扩展槽和各接口，是各部件安装与连接的基础；\nD 错：RAM 可读可写。","options":["微处理器就是主机","主板是计算机最基本也是最重要的部件之一","并行处理技术必须完成一条指令的所有步骤后才开始执行下一条指令","RAM 是一种只能读取数据的内存"],"answer":[1],"meta":{"origin":{"id":"c-54","no":238,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-055","type":"single","topic":"3.7 冯·诺依曼体系结构","diff":"中","stem":"今天的个人计算机、手机、服务器虽然形态各异，但基本都采用冯·诺依曼体系结构。","exp":"正确。课件指出：无论外形如何变化，常见的计算机系统无一例外都是冯·诺依曼体系结构——由运算器、控制器、存储器、输入、输出五部分组成，指令与数据统一存储。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"c-55","no":239,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-056","type":"short","topic":"3.7 冯·诺依曼体系结构","diff":"中","stem":"简述冯·诺依曼体系结构五个组成部分的功能，并指出哪两部分构成现代 CPU 的核心。","exp":"五部分功能要与“输入→存储→处理→输出”的流程对应记忆；CPU = 运算器 + 控制器（+ 寄存器组）。","ref":"运算器：完成算术运算和逻辑运算；\n控制器：整个计算机的指挥中心，向其他部件发出控制命令；\n存储器：计算机的记忆部件，存放程序和数据；\n输入设备：把程序和数据送入计算机；\n输出设备：把处理结果送出计算机。\n其中运算器和控制器是核心，对应现代 CPU 中的算术逻辑单元（ALU）和控制单元（CU）。","meta":{"origin":{"id":"c-56","no":240,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-057","type":"short","topic":"3.7 冯·诺依曼体系结构","diff":"难","stem":"“存储程序”思想解决了早期计算机的什么难题？请举例说明它的意义。","exp":"要点：① 旧方式靠硬件接线设置程序；② 新思想把程序存入存储器；③ 换任务只改程序不改线路；④ 实现自动、顺序执行。","ref":"早期计算机（如 ENIAC）通过重新插拔导线、设置开关来“编程”，换一个任务就要重新接线，费时费力且易出错。存储程序思想把指令和数据一样以二进制形式存入同一存储器，改变任务只需修改存储器中的程序，不必改动硬件线路；同时使计算机能自动、顺序地取指并执行，实现了程序控制下的自动计算，成为现代计算机的基础。","meta":{"origin":{"id":"c-57","no":241,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-058","type":"multi","topic":"3.1 CPU 与基本部件","diff":"易","stem":"一台台式计算机的常见组成部件包括（　）。","exp":"课件列出的十类常见部件：显示器、主板、CPU、内存条、适配器（声卡/网卡/显卡）、电源、光驱/软驱、硬盘、键盘、鼠标。其中 CPU、主板、内存、硬盘等主机内部件决定整机性能，显示器与键鼠负责人机交互。","options":["显示器、键盘、鼠标","主板与 CPU","内存条、硬盘","适配器（显卡、网卡、声卡）与电源"],"answer":[0,1,2,3],"meta":{"origin":{"id":"c-58","no":242,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-059","type":"fill","topic":"3.1 CPU 与基本部件","diff":"易","stem":"CPU 由算术逻辑单元（ALU）、控制单元（CU）和 ____ 三部分组成。","exp":"在大多数体系结构中，中央处理单元由三部分组成：算术逻辑单元 ALU（Arithmetic Logical Unit）、控制单元 CU（Control Unit）、寄存器组（Register File）。","answers":["寄存器组","寄存器","register file"],"meta":{"origin":{"id":"c-59","no":243,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-060","type":"multi","topic":"3.1 CPU 与基本部件","diff":"中","stem":"关于 CPU 三个组成部分的功能，下列说法正确的有（　）。","exp":"前三项正确。第四项错误：寄存器组容量只有几十到几百字节，且属于易失性存储，断电即丢失，只用于暂存当前正在处理的信息；长期保存程序和数据是外存（硬盘、U 盘）的职责。","options":["寄存器组用于长期保存程序和数据，断电后内容不丢失","CU 负责取指令、译码，并向其他部件发出控制命令","寄存器组容量很小、速度极快，用来暂存指令、数据和地址","ALU 完成算术运算和逻辑运算"],"answer":[1,2,3],"meta":{"origin":{"id":"c-60","no":244,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-061","type":"comp","topic":"3.1 CPU 与基本部件","diff":"中","stem":"某 CPU 内部有 32 个通用寄存器。若要为每个寄存器分配一个唯一的二进制编号，至少需要多少位？","exp":"与“地址位数”同一套思路：需要区分 N 个对象，就要 k = log₂N 位编码。\n32 = 2⁵，因此 5 位二进制（00000～11111）即可为 32 个寄存器编号。","ref":"5 位。\n编号种类需 ≥ 32，k 位二进制可表示 2ᵏ 种编号，故 2ᵏ ≥ 32 = 2⁵，k = 5。","meta":{"origin":{"id":"c-61","no":245,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-062","type":"short","topic":"3.1 CPU 与基本部件","diff":"中","stem":"简述 CPU 三个组成部分的功能，并说明它们如何协作完成一条指令。","exp":"要点：三部分各司其职（算、控、存），以“取指 → 译码 → 执行”为主线串起来；CU 是指挥者，ALU 是执行者，寄存器组是临时工作台。","ref":"ALU 负责算术与逻辑运算；CU 负责取指令、译码并向各部件发出控制命令；寄存器组暂存指令、数据和地址。\n协作过程：CU 按程序计数器 PC 的地址从内存取出指令送入指令寄存器，PC 自动加 1；CU 译码后识别操作类型并解析地址码；随后发出控制信号，把操作数取入寄存器，由 ALU 完成运算，结果写回寄存器或内存。","meta":{"origin":{"id":"c-62","no":246,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-063","type":"single","topic":"3.1 CPU 与基本部件","diff":"中","stem":"关于微处理器，下列说法正确的是（　）。","exp":"微处理器（microprocessor）是把 CPU 的运算器、控制器、寄存器组等集成到一块芯片上的器件，俗称 CPU 芯片。它不等于主机——主机还包括主板、内存等；也不属于外设。","options":["微处理器是把运算器、控制器和寄存器组等集成在一块芯片上的器件","微处理器就是整台主机","微处理器只包含算术逻辑单元","微处理器属于外部设备"],"answer":[0],"meta":{"origin":{"id":"c-63","no":247,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-064","type":"multi","topic":"3.2 存储器与地址空间","diff":"中","stem":"关于地址与地址空间，下列说法正确的有（　）。","exp":"四项均正确。地址像“门牌号”，单元内容像“房间里的物品”；由于数据都以位模式存储，地址也用位模式表示（如 16 位地址对应 0～65535）。变量名只是高级语言给地址起的“别名”，硬件只认地址。","options":["每个存储单元都有唯一地址，地址从 0 开始依次加 1","地址本身也是用位模式（二进制串）表示的","地址空间是存储器中可独立标识的地址单元总数","程序员使用的变量名，在硬件层次上最终对应为地址"],"answer":[0,1,2,3],"meta":{"origin":{"id":"c-64","no":248,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-065","type":"short","topic":"3.2 存储器与地址空间","diff":"中","stem":"说明“地址”“字”“地址空间”三个概念，并解释为什么 64KB、字长 1 字节的内存需要 16 位地址。","exp":"要点：地址=门牌号，字=传输单位，地址空间=单元总数；位数由“单元个数”取以 2 为底的对数得到。","ref":"地址：每个存储单元的唯一标识符，从 0 开始依次加 1。\n字：存储器中一次传输的数据单位，字长可以是 8、16、32、64 位等。\n地址空间：存储器中所有可独立标识的地址单元的总数。\n64KB = 64×1024 = 65536 个字节单元；1 字节为一个字，故共 65536 个字；需要 k 位满足 2ᵏ ≥ 65536 = 2¹⁶，所以需要 16 位地址（地址范围 0～65535）。","meta":{"origin":{"id":"c-65","no":249,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-066","type":"single","topic":"3.2 存储器与地址空间","diff":"易","stem":"在硬件层次上，存储器地址是以（　）表示的。","exp":"计算机中数据都以位模式存储，地址本身也是位模式。例如 64KB 内存的地址范围是 0～65535，起始地址为 0000000000000000，最后一个地址为 1111111111111111，共 16 位。","options":["十进制整数","字符编码","位模式（二进制串）","浮点数"],"answer":[2],"meta":{"origin":{"id":"c-66","no":250,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-067","type":"comp","topic":"3.2 存储器与地址空间","diff":"中","stem":"一台计算机内存为 16MB，字长为 4 字节，按字编址。寻址内存中任意一个字需要多少位地址？","exp":"先统一单位再取对数：\n16MB = 16 × 2²⁰ = 2²⁴ B；4 B = 2² B；\n字数 = 2²⁴ / 2² = 2²²；地址位数 = 22。\n对比：若按字节编址则需要 24 位。编址单位越大，所需地址位数越少。","ref":"22 位。\n16MB = 2²⁴ 字节；每个字 4 字节 = 2² 字节；字数 = 2²⁴ ÷ 2² = 2²² 个；需 log₂2²² = 22 位。","meta":{"origin":{"id":"c-67","no":251,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-068","type":"fill","topic":"3.3 存储类型与层次结构","diff":"易","stem":"存储器层次结构自上而下依次为：寄存器 → ____ → 主存 → 外存。","exp":"层次结构：寄存器（CPU 内，最快、最贵、最小）→ Cache（CPU 与主存之间）→ 主存（RAM）→ 外存（硬盘、U 盘、光盘，最慢、最便宜、最大）。越往下速度越慢、单位价格越低、容量越大。","answers":["Cache","cache","高速缓冲存储器","高速缓存"],"meta":{"origin":{"id":"c-68","no":252,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-069","type":"comp","topic":"3.3 存储类型与层次结构","diff":"难","stem":"某计算机访问 Cache 一次需 5ns，访问主存一次需 50ns，Cache 命中率为 95%。若只有未命中时才访问主存，求平均访问时间。","exp":"公式：T = h×T_cache + (1−h)×T_mem，h 为命中率。\n= 0.95×5 + 0.05×50 = 4.75 + 2.5 = 7.25ns。\n对比：若没有 Cache，每次都要 50ns。可见命中率越高，平均访问时间越接近 Cache 的速度，这正是层次结构提高效率的原因。","ref":"7.25ns。\n平均时间 = 命中时间 + 未命中率 × 主存时间 = 5 + 5% × 50 = 5 + 2.5 = 7.25ns。\n（等价写法：5×95% + 50×5% = 4.75 + 2.5 = 7.25ns）","meta":{"origin":{"id":"c-69","no":253,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-070","type":"multi","topic":"3.3 存储类型与层次结构","diff":"中","stem":"关于 RAM 与 ROM，下列说法正确的有（　）。","exp":"四项均正确。RAM（random access memory）可读可写但易失，是主存的主要组成；ROM（read only memory）内容固定、只能读出、非易失，用于存放 BIOS 等启动程序。","options":["RAM 既能读出又能写入","RAM 断电后内容全部丢失","ROM 只能读出不能写入，断电后内容不丢失","ROM 常用于存放 BIOS 等固定不变的程序"],"answer":[0,1,2,3],"meta":{"origin":{"id":"c-70","no":254,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-071","type":"single","topic":"3.3 存储类型与层次结构","diff":"中","stem":"RAM 被称为“随机存取存储器”，其中“随机访问”的确切含义是（　）。","exp":"“随机”指的是访问任一单元所需时间与它的位置无关：给出地址即可直接存取，不必像磁带那样顺序走到目标位置。这也是 RAM 比磁带、磁盘（顺序/半顺序访问）快得多的原因之一。","options":["可以按地址直接存取某个数据项，而不必先存取位于它前面的所有数据项","每次存取的位置由随机数决定","存入的内容是随机的","只能随机读写一次"],"answer":[0],"meta":{"origin":{"id":"c-71","no":255,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-072","type":"multi","topic":"3.4 总线","diff":"中","stem":"关于三种总线，下列说法正确的有（　）。","exp":"四项均正确。数据总线宽度取决于字长（32 位字长需 32 根线）；地址总线由 CPU 单向送出，N 根可寻址 2ᴺ 个单元；控制总线的方向由具体信号决定，故一般视为双向，其条数取决于 CPU 型号。","options":["数据总线传送数据和指令代码，是双向的","地址总线传送 CPU 要访问的存储单元或 I/O 端口地址，是单向的","控制总线传送控制、状态和中断信号，一般是双向的","地址总线的宽度决定了 CPU 所能寻址的最大内存空间"],"answer":[0,1,2,3],"meta":{"origin":{"id":"c-72","no":256,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-073","type":"comp","topic":"3.4 总线","diff":"中","stem":"某计算机地址总线有 16 根，字长 4 字节，按字编址。它最大能寻址的存储容量是多少 KB？","exp":"两步走：\n① 地址线 16 根 → 2¹⁶ 个地址，按字编址即 2¹⁶ 个字；\n② 每字 4 字节 → 2¹⁶ × 4 = 2¹⁸ B = 256KB。\n易错点：直接写 2¹⁶ B = 64KB，忽略了“按字编址、每字 4 字节”。","ref":"256KB。\n可寻址字数 = 2¹⁶ 个字；每字 4 字节；容量 = 2¹⁶ × 4 B = 262144 B = 256KB。","meta":{"origin":{"id":"c-73","no":257,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-074","type":"short","topic":"3.4 总线","diff":"中","stem":"简述数据总线、地址总线、控制总线的功能与传输方向，并说明各自的“宽度”由什么决定。","exp":"记忆口诀：数据看字长、地址看容量、控制看型号；方向分别是“双向、单向、一般双向”。","ref":"数据总线：传送数据和指令代码，双向；线数取决于计算机字长，32 位字长需 32 根。\n地址总线：传送 CPU 要访问的存储单元或 I/O 端口地址，单向（由 CPU 送出）；线数取决于存储空间大小，若容量为 2ᴺ 个字则需 N 根，反过来其宽度决定最大寻址空间。\n控制总线：传送控制命令、状态信息和中断信号，方向由具体信号决定，一般视为双向；条数取决于 CPU 型号，不同 CPU 不相同。","meta":{"origin":{"id":"c-74","no":258,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-075","type":"fill","topic":"3.4 总线","diff":"中","stem":"总线按传输信息的种类可分为数据总线、____ 和 ____。（两空用空格分隔）","exp":"总线（Bus）是各功能部件之间传送信息的公共通信干线，由导线组成。按传输信息种类分为数据总线、地址总线、控制总线，分别传送数据（含指令代码）、地址和控制信号。","answers":["地址总线 控制总线","地址总线控制总线","地址总线、控制总线","地址控制"],"meta":{"origin":{"id":"c-75","no":259,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-076","type":"single","topic":"3.5 外设与外部存储","diff":"易","stem":"下列设备中，属于光存储设备的是（　）。","exp":"外存主要有两类：磁介质存储设备（磁盘、磁带）和光存储设备（CD、DVD 等）。光盘用激光在凹坑处的反射差异记录信息；硬盘、磁带靠磁性；U 盘靠闪存芯片。","options":["磁带","机械硬盘","U 盘","CD / DVD 光盘"],"answer":[3],"meta":{"origin":{"id":"c-76","no":260,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-077","type":"single","topic":"3.5 外设与外部存储","diff":"易","stem":"外部设备指主机以外的任何设备，对数据和信息起传输、转送和存储作用，能扩充计算机系统的功能。","exp":"正确。外设（外部设备）是除主机核心部件以外的重要组成部件，一般包括外部存储设备、输入设备、输出设备三类，用于扩展计算机的存储与交互能力。","options":["正确","错误"],"answer":[0],"meta":{"origin":{"id":"c-77","no":261,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-078","type":"multi","topic":"3.5 外设与外部存储","diff":"中","stem":"关于常见存储设备，下列说法正确的有（　）。","exp":"四项均正确。磁盘：盘片覆铁磁性材料，有磁性记 1、无磁性记 0；SSD 与 U 盘原理相同（闪存芯片），只是 SSD 芯片更多、速度约为机械硬盘的 2.5 倍，最高可达 500MB/s；光盘属光存储。","options":["机械硬盘靠磁性材料记录 0/1，磁头沿盘片径向移动寻道","固态硬盘没有机械旋转结构，读写速度高于机械硬盘","光盘利用激光在凹坑处的反射差异记录信息","U 盘与固态硬盘都使用闪存芯片存储数据"],"answer":[0,1,2,3],"meta":{"origin":{"id":"c-78","no":262,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-079","type":"multi","topic":"3.6 指令与指令周期","diff":"中","stem":"关于指令与程序，下列说法正确的有（　）。","exp":"四项均正确。指令规定一种基本操作；程序是完成特定任务的有序指令序列；指令周期是取出一条指令并执行完毕所需的时间总和，含取指（PC→IR，PC 加 1）、译码、执行三步。","options":["指令是能被计算机识别并执行的二进制代码","一条指令由操作码和地址码两部分组成","一系列按顺序排列的指令构成程序","一个指令周期包括取指令、译码和执行三步"],"answer":[0,1,2,3],"meta":{"origin":{"id":"c-79","no":263,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-080","type":"comp","topic":"3.6 指令与指令周期","diff":"中","stem":"某指令系统的操作码占 8 位，则它最多能表示多少种不同的操作？","exp":"操作码位数决定指令系统的“操作种类上限”：n 位操作码 → 2ⁿ 种操作。\n本题 2⁸ = 256。实际系统中常预留部分编码作扩展操作码使用。","ref":"256 种。\n8 位二进制可组合出 2⁸ = 256 种不同的编码，每一种可定义一种操作。","meta":{"origin":{"id":"c-80","no":264,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-081","type":"single","topic":"3.6 指令与指令周期","diff":"易","stem":"CPU 从内存取出一条指令并执行完毕所用的时间总和称为（　）。","exp":"指令周期 = 取指令 + 译码 + 执行三段时间之和。不同指令（如加法与乘法）的指令周期长短可能不同。","options":["时钟周期","机器周期","指令周期","总线周期"],"answer":[2],"meta":{"origin":{"id":"c-81","no":265,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-082","type":"fill","topic":"3.6 指令与指令周期","diff":"易","stem":"计算机处理数据所使用的一系列指令称为 ____。","exp":"程序（program）是完成某一任务的有序指令集合，是编程的结果；指令是程序的基本单位，能被计算机识别并执行的二进制代码。","answers":["程序","program"],"meta":{"origin":{"id":"c-82","no":266,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-083","type":"fill","topic":"3.7 冯·诺依曼体系结构","diff":"中","stem":"冯·诺依曼体系结构又称 ____ 结构，其核心思想是 ____。（两空用空格分隔）","exp":"冯·诺依曼结构也称普林斯顿结构，因为它把指令存储器和数据存储器合并在一起。核心思想两条：① 存储程序——程序和数据都以二进制形式存放在同一存储器中；② 程序顺序执行——控制器按顺序取指、分析、执行。","answers":["普林斯顿 存储程序","普林斯顿存储程序","普林斯顿 存储程序思想","普林斯顿原理"],"meta":{"origin":{"id":"c-83","no":267,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-084","type":"multi","topic":"3.7 冯·诺依曼体系结构","diff":"中","stem":"关于冯·诺依曼体系结构的特点，下列说法正确的有（　）。","exp":"四项均正确，正好对应“存储程序”“程序顺序执行”“五部分划分”“可编程性”四个要点。注意：五部分通过系统总线连接协同工作，其中运算器与控制器构成现代 CPU 的核心。","options":["指令和数据以二进制形式存放在同一个存储器中","程序顺序执行，由控制器指挥取指、分析和执行","计算机划分为运算器、控制器、存储器、输入设备、输出设备五部分","改变任务只需修改存储器中的程序，不必改动硬件线路"],"answer":[0,1,2,3],"meta":{"origin":{"id":"c-84","no":268,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-085","type":"comp","topic":"3.7 冯·诺依曼体系结构","diff":"中","stem":"某冯·诺依曼机内存 64KB，按字节编址，指令字长固定为 2 字节并按字边界存放。若程序计数器 PC 为 16 位，它能寻址多少条指令？","exp":"PC 有 16 位，说明地址空间为 2¹⁶ 个字节单元（64KB）；每条指令占 2 字节，故最多容纳 2¹⁶/2 = 2¹⁵ = 32768 条指令。\n这也解释了“指令与数据共用同一地址空间”的含义：程序和数据都在同一个 64KB 里分地盘。","ref":"32768 条。\n64KB = 2¹⁶ B；每条指令占 2 B = 2¹ B；指令条数 = 2¹⁶ ÷ 2 = 2¹⁵ = 32768 条。","meta":{"origin":{"id":"c-85","no":269,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"},{"qid":"cs.u3-086","type":"single","topic":"3.7 冯·诺依曼体系结构","diff":"中","stem":"将指令和数据分别存放在两个独立存储器中的计算机结构称为（　）。","exp":"哈佛结构把指令存储器与数据存储器分开，可取指与取数并行；冯·诺依曼结构（普林斯顿结构）则把二者合并存放在同一存储器中，靠地址区分。两者都属于“存储程序”思想的实现。","options":["冯·诺依曼结构","普林斯顿结构","总线结构","哈佛结构"],"answer":[3],"meta":{"origin":{"id":"c-86","no":270,"mod":"计算机组成原理","ch":null},"source":"计算机导论 题库合集（原站）"},"_unit":"u3"}]}],"wrong":{"exitStreak":1},"mastery":{"wAll":0.4,"wRecent":0.6,"recentN":5,"weakBelow":60,"solidAt":85,"solidStreak":4,"passMinQ":4,"passRate":0.9,"dueDays":[1,3,7]},"codec":{"version":10,"gidBits":32,"budgetBytes":6000},"order":["g7b36b9f9","geb76ff8a","g5604cb4e","gbbf40dfe","g53d3c631","gc8006e41","gdde89a21","gffcece9c","gbf4af0af","gf58d538b","g986a45cb","g16fafab6","g390c53cf","gd341e104","g5caa97bb","g63505a11","g262242e2","g53357d53","g15895c5a","gb37205e6","ga8ff66f5","gf78a1598","g2312f909","gd84ac421","g531e9c29","g11a301b7","g9182d1cb","g5ac960f1","g879fc5c7","g7d406c09","ge31b0414","ga0a1269f","gd6d7ba22","g96ce59ac","g1d239cea","g40f44857","g039b0e40","g2f3b78a4","g01c4cc52","g8a075482","g60a43282","gc2a5be02","g429eefc9","g9336931d","g1ca6d6e6","g3929ecd5","g6973d129","g3abb4969","ge0a933a7","gb120c052","g7d8fc4da","g1b380426","g97d834a5","g741c176d","gf4dc7861","g1235df51","g4f107c97","g8fdb65e0","g698ac205","ge61b55d3","g667cadf8","gabc70a0d","g77e9b112","g445ffe28","g16cd76e7","gb3fdad90","gcb5ba655","gd0d46845","g54bc7b55","gf6075fe1","g25a2682d","g057bd0db","g3b63256f","gbfab8367","g03aab32a","gb636e3f9","g3dcab7a9","g614ccd92","g884fb846","ge937909f","g11f716f7","g8ec3308b","g1a5f3cef","g96f701f       .replace(/[()（）\[\]【】]/g, '');
  }

  // 三级比较：严格相等 → 数值相等（语义残差一致）→ 等价答案
  function fuzzyEq(input, answer) {
    var a = norm(input), b = norm(answer);
    if (a === b) return true;
    if (!a || !b) return false;
    var da = digitsOf(a), db = digitsOf(b);
    if (da.length && da.length === db.length && da.join('|') === db.join('|')
        && residualOf(a) === residualOf(b)) return true;
    return false;
  }

  function judge(q, decl, input) {
    var kind = decl.judge;
    if (kind === 'none') return { ok: null, credit: null };
    if (kind === 'exact') {
      if (!input || !input.picked || !q.answer) return { ok: null, credit: null };
      var picked = input.picked.slice().sort(function (x, y) { return x - y; });
      var ans = q.answer.slice().sort(function (x, y) { return x - y; });
      return { ok: picked.length === ans.length && picked.every(function (v, i) { return v === ans[i]; }), credit: null };
    }
    if (kind === 'set') {
      if (!input || !input.picked || !q.answer) return { ok: null, credit: null };
      var p = {}, a = {};
      input.picked.forEach(function (v) { p[v] = 1; });
      q.answer.forEach(function (v) { a[v] = 1; });
      var pk = Object.keys(p), ak = Object.keys(a);
      var same = pk.length === ak.length && pk.every(function (k) { return a[k]; });
      // 多选半对：只选中部分正确项 → 记 false，用 c 记得分率
      var hit = pk.filter(function (k) { return a[k]; }).length;
      var credit = ak.length ? hit / ak.length : 0;
      return { ok: same, credit: same ? null : Math.round(credit * 100) / 100 };
    }
    if (kind === 'numeric') {
      if (input == null || input.text == null || input.text === '') return { ok: null, credit: null };
      var tol = decl.tolerance != null ? Number(decl.tolerance) : 0;
      var want = Number((q.answers || [])[0]);
      var got = Number(String(input.text).replace(/[^\d.\-+eE]/g, ''));
      if (!isFinite(want) || !isFinite(got)) return { ok: false, credit: 0 };
      return { ok: Math.abs(got - want) <= tol, credit: null };
    }
    if (kind === 'fuzzy') {
      if (input == null || input.text == null || String(input.text).trim() === '') return { ok: null, credit: null };
      var list = q.answers || [];
      for (var i = 0; i < list.length; i++) if (fuzzyEq(input.text, list[i])) return { ok: true, credit: null };
      return { ok: false, credit: 0 };
    }
    // rubric / external：交给自评兜底（4.7 第 4 条）
    return { ok: null, credit: null };
  }

  /* ---------------------------------------------------------------- 编码 v10 */

  function BitWriter() { this.buf = []; this.cur = 0; this.n = 0; }
  BitWriter.prototype.put = function (value, width) {
    for (var k = width - 1; k >= 0; k--) {
      this.cur = ((this.cur << 1) | ((value >> k) & 1)) & 0xff;
      this.n++;
      if (this.n === 8) { this.buf.push(this.cur); this.cur = 0; this.n = 0; }
    }
  };
  BitWriter.prototype.finish = function () {
    if (this.n) { this.buf.push((this.cur << (8 - this.n)) & 0xff); this.cur = 0; this.n = 0; }
    return this.buf;
  };

  function BitReader(bytes, startByte) { this.b = bytes; this.pos = startByte * 8; }
  BitReader.prototype.read = function (width) {
    var v = 0;
    for (var i = 0; i < width; i++) {
      var idx = this.pos >> 3;
      if (idx >= this.b.length) throw new Error('编码不完整：位流提前结束');
      var bit = 7 - (this.pos & 7);
      v = (v << 1) | ((this.b[idx] >> bit) & 1);
      this.pos++;
    }
    return v;
  };
  BitReader.prototype.bytesUsed = function () { return (this.pos + 7) >> 3; };

  function maskWidth(decl) {
    if (!decl || decl.replay !== 'mask') return 0;
    var cap = Number(decl.maxOptions || 0);
    if (cap <= 4) return 4;
    if (cap <= 8) return 8;
    if (cap <= 16) return 16;
    return 0;
  }

  function b64url(bytes) {
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    var s = (typeof btoa === 'function')
      ? btoa(bin)
      : (typeof Buffer !== 'undefined' ? Buffer.from(bytes).toString('base64') : '');
    return s.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function unb64url(text) {
    // 容忍：标准 base64 的 +/、被折行或带空格的粘贴、缺省补齐的 =、前后引号
    var s = cleanText(text)
      .replace(/^["'`]+|["'`]+$/g, '')
      .replace(/\s+/g, '')
      .replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = (typeof atob === 'function')
      ? atob(s)
      : (typeof Buffer !== 'undefined' ? Buffer.from(s, 'base64').toString('binary') : '');
    var out = [];
    for (var i = 0; i < bin.length; i++) out.push(bin.charCodeAt(i) & 0xff);
    return out;
  }

  function utf8Bytes(str) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
      else if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length) {
        var c2 = str.charCodeAt(++i);
        var cp = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      } else out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return out;
  }

  function utf8Decode(bytes) {
    var s = '';
    for (var i = 0; i < bytes.length;) {
      var c = bytes[i++];
      if (c < 0x80) s += String.fromCharCode(c);
      else if (c < 0xe0) s += String.fromCharCode(((c & 31) << 6) | (bytes[i++] & 63));
      else if (c < 0xf0) s += String.fromCharCode(((c & 15) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63));
      else {
        var cp = ((c & 7) << 18) | ((bytes[i++] & 63) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63);
        cp -= 0x10000;
        s += String.fromCharCode(0xd800 + (cp >> 10), 0xdc00 + (cp & 1023));
      }
    }
    return s;
  }

  /* ---------------------------------------------------------------- 站点实例 */

  function Store(prefix) {
    this.prefix = prefix || 'qb.site';
    this.mem = null;   // Node / 无 localStorage 时的内存兜底
  }

  Store.prototype._key = function (name) { return this.prefix + '.' + name + '.v1'; };

  Store.prototype.get = function (name, fallback) {
    var raw;
    try {
      raw = (typeof localStorage !== 'undefined') ? localStorage.getItem(this._key(name)) : null;
    } catch (e) { raw = null; }
    if (raw == null) {
      if (this.mem && this.mem[name] != null) return JSON.parse(JSON.stringify(this.mem[name]));
      return fallback;
    }
    try { return JSON.parse(raw); } catch (e) { return fallback; }
  };

  Store.prototype.set = function (name, value) {
    if (!this.mem) this.mem = {};
    this.mem[name] = JSON.parse(JSON.stringify(value));
    try {
      if (typeof localStorage !== 'undefined') localStorage.setItem(this._key(name), JSON.stringify(value));
    } catch (e) { /* 配额满：保留内存态，不中断作答 */ }
  };

  Store.prototype.remove = function (name) {
    if (this.mem) delete this.mem[name];
    try { if (typeof localStorage !== 'undefined') localStorage.removeItem(this._key(name)); } catch (e) {}
  };

  function Site(def, store) {
    this.def = def;
    this.store = store || new Store(def.storePrefix || 'qb.site');
    this.types = def.types || {};
    this.order = (def.order || []).slice();
    this.retired = {};
    (def.retired || []).forEach(function (g) { this.retired[g] = 1; }, this);
    this.bits = (def.codec && def.codec.gidBits) || 32;
    this.budget = (def.codec && def.codec.budgetBytes) || 6000;
    this.questions = [];
    this.byGid = {};
    this.byQid = {};
    this.legacyIdMap = {};     // 旧题号（如 1-02）→ gid，用于迁移旧命名空间
    this._streak = {};
    this._index(def.units || []);
  }

  Site.prototype._index = function (units) {
    var self = this;
    this.scopeUnit = {};
    this.scopeSubject = [];
    var seenSubj = {};
    units.forEach(function (unit) {
      var list = [], seen = {};
      (unit.questions || []).forEach(function (q) {
        q._gid = fingerprint(q, self.bits);
        q._unit = unit.key;
        q._unitLabel = unit.label;
        q._unitTitle = unit.title;
        self.questions.push(q);
        if (!self.byGid[q._gid]) self.byGid[q._gid] = q;
        self.byQid[q.qid] = q;
        if (!seen[q._gid]) { seen[q._gid] = 1; list.push(q._gid); }
        if (!seenSubj[q._gid]) { seenSubj[q._gid] = 1; self.scopeSubject.push(q._gid); }
        if (q.meta && q.meta.origin && q.meta.origin.id) {
          self.legacyIdMap[String(q.meta.origin.id)] = q._gid;
        }
      });
      self.scopeUnit[unit.key] = list;
    });
    // 未出现在序列表里的题（首次运行）追加到末尾，保证 seq 可用
    var known = {};
    this.order.forEach(function (g) { known[g] = 1; });
    this.questions.forEach(function (q) {
      if (!known[q._gid]) { self.order.push(q._gid); known[q._gid] = 1; }
    });
  };

  Site.prototype.gidOf = function (q) { return q._gid || fingerprint(q, this.bits); };

  // 作用域 gid 序：题组按题库顺序、科目按题组顺序去重。
  // 同一道题同时出现在两个题组时，题组作用域各自保留一份——否则含副本的题组
  // 会与独立部署包算出不同的序，导致进度码对不上。
  Site.prototype.scopeGids = function (kind, key) {
    if (kind === 'site') return this.order.slice();
    if (kind === 'subject') return this.scopeSubject.slice();
    return (this.scopeUnit[key] || []).slice();
  };

  /* ---- 状态读取（投影视图） ---- */

  Site.prototype.get = function (gid) {
    var ans = this.store.get('ans', {});
    return ans[gid] || null;
  };

  Site.prototype.allAns = function () { return this.store.get('ans', {}); };
  Site.prototype.allWrong = function () { return this.store.get('wrong', {}); };
  Site.prototype.allFav = function () { return this.store.get('fav', {}); };

  Site.prototype.put = function (gid, patch, mode) {
    var ans = this.store.get('ans', {});
    var prev = ans[gid] || null;
    var rec = mergeRecord(prev, patch);
    // 本机的一次新作答说了算：重做答错就要记成错，不能被「信息量优先」留住旧的 true。
    // 跨设备 / 导入导出仍走 mergeRecord 的信息量优先，那是合并两处记录，不是同一次作答。
    if (patch.ok !== undefined) rec.ok = patch.ok;
    ans[gid] = rec;
    this.store.set('ans', ans);
    this._applyWrong(gid, rec, mode);
    this._log({ g: gid, t: Date.now(), k: 'attempt', ok: rec.ok, m: mode || rec.m || 'seq',
                c: rec.c, p: rec.p, x: rec.x });
    return rec;
  };

  // 规范 5.8：按信息量合并，不用先到先得
  function mergeRecord(prev, patch) {
    if (!prev) {
      var base = { ok: patch.ok == null ? null : patch.ok, at: patch.at || Date.now() };
      if (patch.p && patch.p.length) base.p = patch.p.slice().sort(function (a, b) { return a - b; });
      if (patch.x != null) base.x = patch.x;
      if (patch.m) base.m = patch.m;
      if (patch.c != null) base.c = patch.c;
      if (patch.self) base.self = true;
      return base;
    }
    var out = { ok: prev.ok, at: prev.at };
    if (prev.p) out.p = prev.p.slice();
    if (prev.x != null) out.x = prev.x;
    if (prev.m) out.m = prev.m;
    if (prev.c != null) out.c = prev.c;
    if (prev.self) out.self = true;

    var rank = { 'true': 3, 'false': 2, 'null': 1 };
    var a = rank[String(prev.ok)], b = rank[String(patch.ok)];
    if (patch.ok !== undefined && b > a) out.ok = patch.ok;
    if (patch.at && patch.at > (out.at || 0)) out.at = patch.at;
    if (patch.p && patch.p.length) out.p = patch.p.slice().sort(function (x, y) { return x - y; });
    if (patch.x != null && String(patch.x).length >= String(out.x || '').length) out.x = patch.x;
    if (patch.c != null && (out.c == null || patch.c > out.c)) out.c = patch.c;
    if (patch.m) out.m = patch.m;
    if (patch.self) out.self = true;
    return out;
  }

  /* ---- 错题状态机（规范 5.2 八条） ---- */

  Site.prototype._applyWrong = function (gid, rec, mode) {
    var wrong = this.store.get('wrong', {});
    var suppressed = this.store.get('suppress', {});
    var inSet = !!wrong[gid];
    var exitStreak = (this.def.wrong && this.def.wrong.exitStreak) || 1;
    var now = Date.now();

    if (rec.ok === false) {                       // #1 / #8
      wrong[gid] = now;
      delete suppressed[gid];
      this.store.set('wrong', wrong);
      this.store.set('suppress', suppressed);
      return;
    }
    if (rec.ok === true && mode === 'wrong' && inSet) {   // #2
      var streak = (this._streak[gid] || 0) + 1;
      this._streak[gid] = streak;
      if (streak >= exitStreak) {
        delete wrong[gid];
        delete this._streak[gid];
        this.store.set('wrong', wrong);
      }
      return;
    }
    // #3 顺序练习答对：不变；#4 ok=null：不变
  };

  Site.prototype._streak = {};
  Site.prototype.suppress = function (gid) {          // #6
    var wrong = this.store.get('wrong', {});
    var sup = this.store.get('suppress', {});
    delete wrong[gid];
    sup[gid] = Date.now();
    this.store.set('wrong', wrong);
    this.store.set('suppress', sup);
    this._log({ g: gid, t: Date.now(), k: 'suppress' });
  };

  Site.prototype.resetScope = function (kind, key) {   // #7
    var gids = this.scopeGids(kind, key);
    var keep = {};
    gids.forEach(function (g) { keep[g] = 1; });
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    gids.forEach(function (g) { delete ans[g]; delete wrong[g]; delete fav[g]; });
    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    this._log({ g: '*', t: Date.now(), k: 'reset', scope: kind + ':' + key });
  };

  Site.prototype.toggleFav = function (gid) {
    var fav = this.store.get('fav', {});
    if (fav[gid]) delete fav[gid]; else fav[gid] = Date.now();
    this.store.set('fav', fav);
    return !!fav[gid];
  };

  /* ---- 事件日志与折叠 ---- */

  Site.prototype._log = function (ev) {
    var diag = this.store.get('diag', { events: [], rounds: {}, mastery: {} });
    diag.events = diag.events || [];
    diag.events.push(ev);
    if (diag.events.length > 2000) {
      // 折叠最旧的一半进快照，再截断（规范 5.1）
      diag.events = diag.events.slice(-1000);
    }
    this.store.set('diag', diag);
  };

  Site.prototype.rebuild = function () {
    var diag = this.store.get('diag', { events: [] });
    var ans = {}, wrong = {};
    (diag.events || []).forEach(function (e) {
      if (e.k === 'reset') return;
      if (e.g === '*') return;
      if (e.k === 'attempt') {
        ans[e.g] = mergeRecord(ans[e.g] || null, { ok: e.ok, at: e.t, p: e.p, x: e.x, m: e.m, c: e.c });
        if (e.ok === false) wrong[e.g] = e.t;
        else if (e.ok === true && e.m === 'wrong' && wrong[e.g]) delete wrong[e.g];
      } else if (e.k === 'suppress') {
        delete wrong[e.g];
      }
    });
    return { ans: ans, wrong: wrong };
  };

  /* ---- 掌握度（规范 5.5） ---- */

  Site.prototype.masteryOf = function (topic) {
    var m = this.def.mastery || {};
    var wAll = m.wAll != null ? m.wAll : 0.4;
    var wRecent = m.wRecent != null ? m.wRecent : 0.6;
    var recentN = m.recentN || 5;
    var ans = this.store.get('ans', {});
    var self = this;
    var records = this.questions.filter(function (q) { return q.topic === topic && ans[q._gid]; })
      .map(function (q) { return ans[q._gid]; })
      .filter(function (r) { return r.ok !== null; });

    if (!records.length) return { topic: topic, score: null, level: null, n: 0 };

    function credit(r) {
      if (r.ok === true) return 1;
      if (r.c != null) return r.c;
      return 0;
    }
    var all = records.reduce(function (s, r) { return s + credit(r); }, 0) / records.length;
    var recent = records.slice(-recentN);
    var rec = recent.reduce(function (s, r) { return s + credit(r); }, 0) / recent.length;
    var score = Math.round(100 * (wAll * all + wRecent * rec));
    var level = score < (m.weakBelow || 60) ? '薄弱'
      : (score >= (m.solidAt || 85) ? '已掌握' : '巩固中');
    return { topic: topic, score: score, level: level, n: records.length, recent: rec, all: all };
  };

  Site.prototype.masteryAll = function () {
    var topics = {}, self = this;
    this.questions.forEach(function (q) { topics[q.topic] = 1; });
    return Object.keys(topics).sort().map(function (t) { return self.masteryOf(t); });
  };

  /* ---- 编码 / 解码 ---- */

  // 规范 3.5：超预算时按 32→24→16→8→4→0 压缩文字段，仍超才报错；单段上限 255 字节
  var TEXT_STEPS = [255, 32, 24, 16, 8, 4, 0];

  Site.prototype.encode = function (kind, key, opts) {
    var steps = (opts && opts.textLimit != null) ? [opts.textLimit] : TEXT_STEPS;
    var last = null;
    for (var i = 0; i < steps.length; i++) {
      last = this._encodeWith(kind, key, steps[i]);
      if (last.length <= this.budget) return last;
    }
    return last;   // 已降到 0 仍超预算：交给调用方提示改用题组作用域
  };

  Site.prototype._encodeWith = function (kind, key, textStep) {
    var self = this;
    var gids = this.scopeGids(kind, key);
    if (!gids.length) throw new Error('作用域 ' + kind + ':' + key + ' 内没有题目');
    var ans = this.store.get('ans', {});
    var fav = this.store.get('fav', {});
    var used = {}, widths = {};
    gids.forEach(function (g) {
      var q = self.byGid[g];
      if (q && !used[q.type]) { used[q.type] = 1; widths[q.type] = maskWidth(self.types[q.type]); }
    });

    var n = gids.length;
    var blen = (n + 7) >> 3;
    var ansBits = new Array(blen).fill(0);
    var favBits = new Array(blen).fill(0);
    var txtBits = new Array(blen).fill(0);

    var bw = new BitWriter();
    var texts = [];

    gids.forEach(function (g, i) {
      var rec = ans[g];
      if (!rec) return;
      ansBits[i >> 3] |= 1 << (i & 7);
      if (fav[g]) favBits[i >> 3] |= 1 << (i & 7);
      bw.put(rec.ok === true ? 1 : (rec.ok === false ? 2 : 0), 2);
      var w = widths[(self.byGid[g] || {}).type] || 0;
      var mask = 0;
      (rec.p || []).forEach(function (k) { if (k >= 0 && k < w) mask |= 1 << k; });
      if (w) bw.put(mask, w);
      if (rec.x != null && rec.x !== '' && textStep > 0) {
        var bytes = utf8Bytes(String(rec.x)).slice(0, 255);
        txtBits[i >> 3] |= 1 << (i & 7);
        texts.push(bytes.slice(0, textStep));
      } else if (rec.x != null && rec.x !== '') {
        // 文字被压到 0 时不写文字段，但已答位仍置 1
      }
    });

    var head = [10];
    var anyWidth = Object.keys(widths).some(function (k) { return widths[k] > 0; });
    head.push((anyWidth ? 1 : 0) | (texts.length ? 2 : 0));
    head.push({ site: 0, subject: 1, unit: 2 }[kind]);
    var kb = kind === 'site' ? [] : utf8Bytes(key);
    head.push(kb.length);
    head = head.concat(kb);
    var typeKeys = Object.keys(widths).sort();   // 与校验门一致：题型表按字典序写
    head.push(typeKeys.length);
    typeKeys.forEach(function (t) {
      var tb = utf8Bytes(t);
      head.push(tb.length);
      head = head.concat(tb);
      head.push(widths[t]);
    });
    head.push((n >> 8) & 0xff, n & 0xff);
    head = head.concat(ansBits, favBits, txtBits, bw.finish());
    texts.forEach(function (blob) { head.push(blob.length); head = head.concat(blob); });

    return '10:' + b64url(head);
  };

  Site.prototype.decode = function (code) {
    code = cleanText(code).trim();
    if (code.indexOf('10:') === 0) return this._decodeV10(code);
    if (code.indexOf('9:') === 0) return this._decodeV9(code);
    if (/^[89]:/.test(code)) throw new Error('该版本编码已不再支持，请用「导入」按钮旁的旧码迁移说明');
    throw new Error('无法识别的进度码：应以 10: 或 9: 开头');
  };

  Site.prototype._decodeV10 = function (code) {
    var data = unb64url(code.slice(3));
    if (data.length < 6 || data[0] !== 10) throw new Error('编码头损坏');
    var pos = 2;
    var kindId = data[pos++];
    var klen = data[pos++];
    var key = utf8Decode(data.slice(pos, pos + klen)); pos += klen;
    var tcount = data[pos++];
    var widths = {};
    for (var i = 0; i < tcount; i++) {
      var kl = data[pos++];
      var name = utf8Decode(data.slice(pos, pos + kl)); pos += kl;
      widths[name] = data[pos++];
    }
    var total = (data[pos] << 8) | data[pos + 1]; pos += 2;
    var blen = (total + 7) >> 3;
    var ansBits = data.slice(pos, pos + blen); pos += blen;
    var favBits = data.slice(pos, pos + blen); pos += blen;
    var txtBits = data.slice(pos, pos + blen); pos += blen;

    var kind = ['site', 'subject', 'unit'][kindId];
    var gids = this.scopeGids(kind, key);
    if (gids.length !== total) throw new Error('编码内 gid 数 ' + total + ' 与本地作用域 ' + gids.length + ' 不一致（题库版本不同？）');

    var reader = new BitReader(data, pos);
    var ans = {}, fav = {}, texts = {};
    for (var j = 0; j < total; j++) {
      var g = gids[j];
      if (favBits[j >> 3] & (1 << (j & 7))) fav[g] = Date.now();
      if (!(ansBits[j >> 3] & (1 << (j & 7)))) continue;
      var okc = reader.read(2);
      var w = widths[(this.byGid[g] || {}).type] || 0;
      var mask = w ? reader.read(w) : 0;
      var picked = [];
      if (w) for (var k = 0; k < w; k++) if (mask & (1 << k)) picked.push(k);
      ans[g] = { ok: okc === 1 ? true : (okc === 2 ? false : null), at: Date.now(), p: picked };
    }
    var tpos = reader.bytesUsed();
    for (var j2 = 0; j2 < total; j2++) {
      if (!(txtBits[j2 >> 3] & (1 << (j2 & 7)))) continue;
      if (tpos >= data.length) throw new Error('文字段提前结束');
      var ln = data[tpos++];
      texts[gids[j2]] = utf8Decode(data.slice(tpos, tpos + ln));
      tpos += ln;
    }
    return { kind: kind, key: key, ans: ans, fav: fav, texts: texts };
  };

  /* ---- v9 旧码：全站快照，按去重后的字典序 gid 排位（兼容线上原方案C） ---- */

  Site.prototype.legacyGids = function () {
    var seen = {}, out = [];
    this.questions.forEach(function (q) {
      if (!seen[q._gid]) { seen[q._gid] = 1; out.push(q._gid); }
    });
    return out.sort();          // 旧版 GID_ALL = 去重后按码元序排列
  };

  Site.prototype._decodeV9 = function (code) {
    var bin = unb64url(code.slice(2));
    if (bin.length < 3 || bin[0] !== 9) throw new Error('v9 编码头损坏');
    var total = (bin[1] << 8) | bin[2];
    var len = (total + 7) >> 3;
    var hdr = 3 + len * 3;
    if (bin.length < hdr) throw new Error('v9 编码不完整，可能复制时漏了字符');
    var gids = this.legacyGids();
    if (gids.length !== total) {
      throw new Error('v9 编码含 ' + total + ' 个 gid，本地题库为 ' + gids.length + ' 个（题库版本不同）');
    }
    var ansBits = bin.slice(3, 3 + len);
    var favBits = bin.slice(3 + len, 3 + 2 * len);
    var txtBits = bin.slice(3 + 2 * len, hdr);
    var reader = new BitReader(bin, hdr);
    var ans = {}, fav = {};
    for (var i = 0; i < total; i++) {
      var g = gids[i];
      if (favBits[i >> 3] & (1 << (i & 7))) fav[g] = Date.now();
      if (!(ansBits[i >> 3] & (1 << (i & 7)))) continue;
      var okc = reader.read(2);
      var mask = reader.read(4);        // v9 固定 4 位掩码
      var picked = [];
      for (var k = 0; k < 4; k++) if (mask & (1 << k)) picked.push(k);
      ans[g] = { ok: okc === 1 ? true : (okc === 2 ? false : null), at: Date.now(), p: picked };
    }
    var tpos = reader.bytesUsed(), texts = {};
    for (var j = 0; j < total; j++) {
      if (!(txtBits[j >> 3] & (1 << (j & 7)))) continue;
      if (tpos >= bin.length) break;
      var ln = bin[tpos++];
      texts[gids[j]] = utf8Decode(bin.slice(tpos, tpos + ln));
      tpos += ln;
    }
    return { kind: 'site', key: '', ans: ans, fav: fav, texts: texts, v: 9 };
  };

  /* ---- 旧版本机记录迁移：csg_*（gid 键）与 csunitN_*（旧题号键） ---- */

  var LEGACY_RE = /^(?:csg|cs(?:unit\d+|exam|terms|calc|midterm))_(ans|wrong|fav)_v1$/;

  function toRecord(r) {
    if (!r || typeof r !== 'object') return null;
    var ok = r.ok === true ? true : (r.ok === false ? false : null);
    var picked = Array.isArray(r.picked) ? r.picked : (Array.isArray(r.p) ? r.p : null);
    var text = r.text != null ? r.text : (r.x != null ? r.x : '');
    var answered = !!picked || !!text || ok !== null || r.done === true;
    if (!answered) return null;
    var rec = { ok: ok, at: typeof r.at === 'number' ? r.at : Date.now() };
    if (picked && picked.length) {
      rec.p = picked.filter(function (k) { return typeof k === 'number' && k >= 0; })
        .sort(function (a, b) { return a - b; });
    }
    if (text) rec.x = cleanText(text).trim();
    if (r.self === true) rec.self = true;
    if (typeof r.c === 'number') rec.c = r.c;
    return rec;
  }

  function eachLegacyEntry(value, fn) {
    if (value == null) return;
    if (Array.isArray(value)) { value.forEach(function (g) { if (typeof g === 'string') fn(g, 1); }); return; }
    if (typeof value !== 'object') return;
    Object.keys(value).forEach(function (g) { fn(g, value[g]); });
  }

  // 幂等：迁移过一次就记标记，不重复覆盖用户此后产生的记录
  Site.prototype.migrateLegacy = function () {
    var store = this.store;
    if (store.get('migrated', null)) return { skipped: true, ans: 0, wrong: 0, fav: 0 };
    if (typeof localStorage === 'undefined' || !localStorage.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    var idMap = this.legacyIdMap || {};
    var ans = store.get('ans', {});
    var wrong = store.get('wrong', {});
    var fav = store.get('fav', {});
    var self = this;
    var counts = { ans: 0, wrong: 0, fav: 0, orphan: 0 };
    var handled = [];

    function resolve(key) {
      if (/^g[0-9a-f]{8}([0-9a-f]{8})?$/.test(key)) return key;
      return idMap[key] || null;
    }

    var names = [];
    for (var i = 0; i < localStorage.length; i++) names.push(localStorage.key(i));

    names.forEach(function (name) {
      var m = LEGACY_RE.exec(name);
      if (!m) return;
      var kind = m[1];
      var raw;
      try { raw = JSON.parse(localStorage.getItem(name) || 'null'); } catch (e) { return; }
      handled.push(name);

      eachLegacyEntry(raw, function (key, val) {
        var gid = resolve(key);
        if (!gid) { counts.orphan++; return; }
        if (kind === 'ans') {
          var rec = toRecord(val);
          if (!rec) return;
          if (!ans[gid]) { ans[gid] = rec; counts.ans++; }
          else if (ans[gid].ok === null && rec.ok !== null) { ans[gid] = rec; counts.ans++; }
        } else if (kind === 'wrong') {
          if (!wrong[gid]) { wrong[gid] = typeof val === 'number' ? val : Date.now(); counts.wrong++; }
        } else if (kind === 'fav') {
          if (!fav[gid]) { fav[gid] = (val && typeof val === 'object' && typeof val.t === 'number') ? val.t : Date.now(); counts.fav++; }
        }
      });
    });

    if (!handled.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    store.set('ans', ans);
    store.set('wrong', wrong);
    store.set('fav', fav);
    store.set('migrated', { at: Date.now(), from: handled, counts: counts });
    // 旧键一律不删：回退到旧页面仍可用（规范 8.2 第 4 条）
    return counts;
  };

  // 导入：只覆盖作用域内，域外原样保留（规范 3.3）
  Site.prototype.importCode = function (code) {
    var snapshot = {
      ans: this.store.get('ans', {}), wrong: this.store.get('wrong', {}), fav: this.store.get('fav', {})
    };
    this.store.set('bak', { at: Date.now(), data: snapshot });

    var got = this.decode(code);
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var self = this;
    var touched = 0;

    Object.keys(got.ans).forEach(function (g) {
      var incoming = got.ans[g];
      if (got.texts[g] != null) incoming.x = cleanText(got.texts[g]);
      ans[g] = mergeRecord(ans[g] || null, incoming);
      if (incoming.ok === false) wrong[g] = Date.now();
      touched++;
    });
    Object.keys(got.fav).forEach(function (g) { fav[g] = fav[g] || Date.now(); });

    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    return { kind: got.kind, key: got.key, count: touched, v: got.v || 10 };
  };

  Site.prototype.undoImport = function () {
    var bak = this.store.get('bak', null);
    if (!bak) return false;
    this.store.set('ans', bak.data.ans || {});
    this.store.set('wrong', bak.data.wrong || {});
    this.store.set('fav', bak.data.fav || {});
    return true;
  };

  /* ---- 统计（三级口径，分母一律 gid 去重） ---- */

  Site.prototype.stats = function (unitKey) {
    var self = this;
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var gids = unitKey ? this.scopeGids('unit', unitKey) : this.order.slice();
    var seen = {}, total = 0, answered = 0, correct = 0, wrongN = 0, favN = 0;
    gids.forEach(function (g) {
      if (seen[g]) return;
      seen[g] = 1;
      total++;
      var r = ans[g];
      if (r) {
        answered++;
        if (r.ok === true) correct++;
      }
      if (wrong[g]) wrongN++;
      if (fav[g]) favN++;
    });
    return {
      total: total, answered: answered, correct: correct,
      rate: answered ? Math.round(100 * correct / answered) : null,
      wrong: wrongN, fav: favN
    };
  };

  var QB = {
    fpNorm: fpNorm, fpHash: fpHash, fingerprint: fingerprint,
    norm: norm, judge: judge, fuzzyEq: fuzzyEq, cleanText: cleanText,
    maskWidth: maskWidth, mergeRecord: mergeRecord,
    Store: Store, Site: Site,
    create: function (def, store) { return new Site(def, store); }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = QB;
  else root.QB = QB;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

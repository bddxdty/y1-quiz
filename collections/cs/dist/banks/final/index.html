<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>计算机导论 · 期末冲刺 2019 真题全录与八章核心考点</title>
<style>/* qb-page.css — 题库页面样式（内核共用，不含任何科目特有内容） */
:root{
  --bg:#f4f6fa; --card:#fff; --line:#e4e8ef; --line2:#eef1f6;
  --text:#1e2330; --muted:#5b6373; --muted2:#6b7383;
  --accent:#2f6fed; --accent-ink:#2557c7; --accent-soft:#eaf1ff;
  --ok:#0b6b48; --ok-soft:#e7f7ef; --ok-line:#b7e6cf;
  --bad:#b42318; --bad-soft:#fdecea; --bad-line:#f6c9c4;
  --warn:#b54708; --warn-soft:#fef3e2;
  --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.68 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 72px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:14px}
.top h1{font-size:21px;margin:0;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px;margin-top:3px}
.top .spacer{flex:1}
.home{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:9px;padding:6px 12px;background:#fff}
.home:hover{color:var(--accent);border-color:#c7dbff;text-decoration:none}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.block{padding:14px 16px;margin-bottom:14px}

/* stats */
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px;margin-bottom:14px}
.stat-k{font-size:12px;color:var(--muted2);letter-spacing:.3px}
.stat-v{font-size:19px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat-bar{height:4px;border-radius:3px;background:#eef1f6;margin-top:7px;overflow:hidden}
.stat-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}

/* controls */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl+.ctl{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2)}
.seg{display:inline-flex;background:#f1f4fa;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;color:#48505f}
.seg button:hover{color:var(--accent)}
.seg button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(16,24,40,.1)}
select,input[type=search]{
  font:inherit;font-size:13.5px;color:var(--text);border:1px solid var(--line);background:#fff;
  border-radius:9px;padding:7px 10px;outline:none
}
select:focus,input[type=search]:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=search]{min-width:170px;flex:1}
.btn{
  border:1px solid var(--line);background:#fff;color:#3c4353;border-radius:9px;padding:7px 14px;
  font:inherit;font-size:13.5px;cursor:pointer;transition:.15s
}
.btn:hover:not(:disabled){border-color:#c7dbff;color:var(--accent);background:var(--accent-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2557c7;border-color:#2557c7;color:#fff}
.btn.ghost{background:#fff}
.btn.ghost.on{color:#b54708;border-color:#f5dcb4;background:var(--warn-soft)}
.btn.small{padding:5px 11px;font-size:13px}

/* card */
#card{padding:18px 18px 16px;margin-bottom:14px}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fafbfd;white-space:nowrap}
.tag-type{color:var(--accent-ink);border-color:#c7dbff;background:var(--accent-soft)}
.tag-diff.d-0{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.tag-diff.d-1{color:var(--warn);border-color:#f5dcb4;background:var(--warn-soft)}
.tag-diff.d-2{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.q-topic{font-size:12.5px;color:var(--muted2)}
.q-no{margin-left:auto;font-size:12.5px;color:var(--muted2);font-variant-numeric:tabular-nums}
.q-stem{font-size:16.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.q-img{max-width:100%;margin-top:10px;border-radius:8px;border:1px solid var(--line)}

/* options */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 13px;
  font:inherit;font-size:15px;line-height:1.6;cursor:pointer;transition:.13s;color:var(--text)
}
.opt:hover:not(:disabled){border-color:#c7dbff;background:#fafcff}
.opt:disabled{cursor:default}
.opt-k{
  flex:0 0 24px;height:24px;border-radius:7px;background:#f1f4fa;color:#48505f;
  display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600
}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.opt.picked .opt-k{background:var(--accent);color:#fff}
.opt.right{border-color:var(--ok-line);background:var(--ok-soft)}
.opt.right .opt-k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-soft)}
.opt.wrong .opt-k{background:var(--bad);color:#fff}

/* inputs */
.in,.ta{
  width:100%;margin-top:14px;font:inherit;font-size:15px;color:var(--text);
  border:1px solid var(--line);border-radius:11px;padding:11px 13px;outline:none;background:#fff;resize:vertical
}
.in:focus,.ta:focus{border-color:#c7dbff;box-shadow:0 0 0 3px var(--accent-soft)}
.in:disabled,.ta:disabled{background:#fafbfd;color:var(--muted)}

/* action bar */
.q-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hint{font-size:12.5px;color:var(--muted2)}
.verdict{font-size:14px;font-weight:650;padding:5px 12px;border-radius:999px}
.verdict.ok{color:var(--ok);background:var(--ok-soft)}
.verdict.bad{color:var(--bad);background:var(--bad-soft)}
.verdict.mid{color:var(--warn);background:var(--warn-soft)}

/* explanation */
.exp{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.exp-h{font-size:12.5px;color:var(--muted2);letter-spacing:.4px;margin-bottom:7px}
.exp-a{font-size:14.5px;margin:0 0 8px;padding:10px 12px;background:#f7f9fd;border-radius:9px;border:1px solid var(--line2)}
.exp-p{font-size:14.5px;color:#333a49;margin:0 0 6px;white-space:pre-wrap}
.exp-src{font-size:12px;color:var(--muted2);margin:6px 0 0}
.self{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}

/* nav */
#nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav-mid{flex:1;text-align:center;font-size:13px;color:var(--muted2);font-variant-numeric:tabular-nums}

/* mastery */
#mastery{padding:14px 16px;margin-bottom:14px}
.mt{width:100%;border-collapse:collapse;font-size:13.5px}
.mt th{text-align:left;font-weight:600;color:var(--muted2);font-size:12px;letter-spacing:.3px;padding:0 0 8px;border-bottom:1px solid var(--line2)}
.mt td{padding:7px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
.mt tr:last-child td{border-bottom:0}
.mt-t{color:#333a49}
.mt-s{font-variant-numeric:tabular-nums;font-weight:650;width:56px}
.mt-n{color:var(--muted2);width:56px;text-align:right}
.lv{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.lv-ok{color:var(--ok);background:var(--ok-soft)}
.lv-mid{color:var(--warn);background:var(--warn-soft)}
.lv-bad{color:var(--bad);background:var(--bad-soft)}

/* transfer */
#transfer{padding:14px 16px;margin-bottom:14px}
#x-code{width:100%;min-height:86px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:10px;resize:vertical;background:#fafbfd;color:#333a49}
#x-info{font-size:12.5px;color:var(--muted2);margin-top:8px;min-height:18px}
.x-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* misc */
.empty{padding:34px 8px;text-align:center}
.empty-t{font-size:15.5px;font-weight:600}
.empty-s{color:var(--muted2);font-size:13.5px;margin:6px 0 0}
#toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);
  background:#1e2330;color:#fff;font-size:13.5px;padding:9px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99
}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{color:var(--muted2);font-size:12px;text-align:center;margin-top:18px;line-height:1.8}

@media (max-width:640px){
  .wrap{padding:14px 12px 64px}
  #stats{grid-template-columns:repeat(2,1fr)}
  .top h1{font-size:18.5px}
  .q-stem{font-size:16px}
  .opt{font-size:14.5px}
  input[type=search]{min-width:100%}
}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;
}
mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */
.q-stem mjx-container[display="true"],
.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}

/* ---------- 数学排版（MathJax SVG，无字体依赖） ---------- */
mjx-container{
  display:inline-block; max-width:100%; overflow-x:auto; overflow-y:hidden;
  vertical-align:middle;
}
mjx-container[display="true"]{
  display:block; margin:10px 0; text-align:center;
}
/* 行间公式在窄屏可横向滚动，不撑破卡片 */
.q-stem mjx-container[display="true"],
.exp-p mjx-container[display="true"],
.exp-a mjx-container[display="true"]{ padding:2px 0; }
.q-stem{line-height:2.05}
.opt-t mjx-container{vertical-align:-0.35ex}
.exp-p{line-height:1.9}
.math-err{color:var(--bad);font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="site-title">计算机导论 · 期末冲刺 2019 真题全录与八章核心考点</h1>
      <div class="sub"><span id="bank-name"></span> · <span id="bank-desc"></span></div>
    </div>
    <div class="spacer"></div>
    <a class="home" id="home" href="../../index.html">返回题库集</a>
  </div>

  <div class="panel" id="stats"></div>

  <div class="panel block">
    <div class="ctl">
      <div class="seg" id="modes">
        <button data-mode="seq" class="on">顺序</button>
        <button data-mode="random">随机</button>
        <button data-mode="wrong">错题</button>
        <button data-mode="fav">收藏</button>
        <button data-mode="undone">未做</button>
      </div>
      <select id="f-type"><option value="">全部题型</option></select>
      <select id="f-diff"><option value="">全部难度</option><option>易</option><option>中</option><option>难</option></select>
    </div>
    <div class="ctl">
      <input type="search" id="f-kw" placeholder="搜索题干 / 知识点">
      <span class="hint">键盘 ← → 翻题，数字键选项；手机在题目上左右滑动翻题</span>
    </div>
  </div>

  <div class="panel" id="card"></div>
  <div id="nav"></div>

  <details class="panel block">
    <summary style="cursor:pointer;font-size:14px;font-weight:600">掌握度（按知识点）</summary>
    <div id="mastery" style="padding-top:10px"></div>
  </details>

  <details class="panel block" id="cloud-wrap" style="display:none">
    <summary style="cursor:pointer;font-size:14px;font-weight:600">云同步（手动上传 / 下载）</summary>
    <div style="padding-top:10px">
      <div class="x-row">
        <input type="text" id="s-code" class="in" style="flex:1;min-width:180px;margin-top:0"
               placeholder="同步码（≥10 位，与旧页面共用）">
        <button class="btn" id="s-save">保存</button>
        <button class="btn primary" id="s-up">上传</button>
        <button class="btn" id="s-down">下载</button>
      </div>
      <div id="s-info" class="hint" style="margin-top:8px;min-height:18px"></div>
    </div>
  </details>

  <details class="panel block">
    <summary style="cursor:pointer;font-size:14px;font-weight:600">导出 / 导入进度码</summary>
    <div id="transfer" style="padding-top:10px">
      <div class="x-row">
        <select id="x-scope"></select>
        <button class="btn" id="x-do">生成</button>
        <button class="btn" id="x-copy">复制</button>
        <button class="btn" id="x-import">导入</button>
        <button class="btn" id="x-undo">撤销导入</button>
        <button class="btn ghost" id="reset" style="margin-left:auto">清空本机记录</button>
      </div>
      <textarea id="x-code" placeholder="在此粘贴他人分享的进度码，或点「生成」得到自己的"></textarea>
      <div id="x-info"></div>
    </div>
  </details>

  <div class="foot">
    独立题库 · 计算机导论 · 期末冲刺 2019 真题全录与八章核心考点 · 140 题<br>
    进度保存在本机浏览器，不上传；换设备请用进度码迁移。
  </div>
</div>

,{"qid":"cs.final-003","type":"term","topic":"3.6 指令与指令周期","diff":"中","stem":"请解释“机器周期”。","ref":"一条指令的执行过程包括取指令、译码、执行指令和写回等步骤，完成其中一个基本操作所需要的时间称为机器周期。","exp":"采分点（3 分）：①落在指令执行过程的语境里（取指、译码、执行、写回）；②完成一个基本操作所需的时间。只写“执行一条指令的时间”是指令周期，不是机器周期。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"一.3"},"_unit":"final"},{"qid":"cs.final-004","type":"single","topic":"2.1 进位计数制及其转换","diff":"易","stem":"数制中使用的数码个数被称为____。","options":["尾数","基数","阶码","位权"],"answer":[1],"exp":"基数是数制中可用数码的个数，如二进制基数为 2、十进制为 10、十六进制为 16。位权是某一位所代表的数值大小（基数的幂），尾数与阶码是浮点数的两个组成部分。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"二.1","optperm":true},"_unit":"final"},{"qid":"cs.final-005","type":"single","topic":"1.1 计算机的历史与发展","diff":"易","stem":"根据摩尔定律，每隔 18 个月，单位面积内晶体管的数量将增加____。","options":["41%","50%","70%","100%"],"answer":[3],"exp":"摩尔定律：价格不变时，集成电路上可容纳的晶体管数目约每 18～24 个月翻一番，即增加 100%（变为原来的 2 倍），性能也相应提升。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"二.2","optperm":true},"_unit":"final"},{"qid":"cs.final-006","type":"single","topic":"1.1 计算机的历史与发展","diff":"易","stem":"电子计算机主要是以____划分第几代的。","options":["集成电路","物理器件","电子管","晶体管"],"answer":[1],"exp":"划代依据是所采用的物理器件（电子元件）：电子管→晶体管→中小规模集成电路→大规模/超大规模集成电路。电子管、晶体管只是其中某一代的具体器件，集成电路也只是后两代的器件，都不能作为划代标准本身。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"二.3","optperm":true},"_unit":"final"},{"qid":"cs.final-007","type":"single","topic":"2.4 字符型数据的编码","diff":"中","stem":"关于一个汉字从输入到输出处理过程，正确的是（　）。","options":["首先用汉字的外码将汉字输入，其次用汉字的字形码存储并处理，最后用汉字的内码输出","首先用汉字的字形码将汉字输入，其次用汉字的内码存储并处理，最后用汉字的外码输出","首先用汉字的内码将汉字输入，其次用汉字的外码存储并处理，最后用汉字的字形码输出","首先用汉字的外码将汉字输入，其次用汉字的内码存储并处理，最后用汉字的字形码输出"],"answer":[3],"exp":"流程固定为「外码（输入码）输入 → 机内码存储与处理 → 字形码输出显示/打印」。外码随输入法而变（拼音、五笔不同），内码与字形码在同一汉字系统中与输入法无关。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"二.4","optperm":true},"_unit":"final"},{"qid":"cs.final-008","type":"single","topic":"1.1 计算机的历史与发展","diff":"易","stem":"世界上第一台电子计算机叫做____。","options":["ENIAC","ENICA","Pentium","ENAIC"],"answer":[0],"exp":"ENIAC（电子数值积分计算机）1946 年诞生于美国宾夕法尼亚大学。Pentium 是 Intel 的微处理器系列，其余两项为拼写干扰。注意与“我国第一台电子计算机 103 机”区分。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"二.5","optperm":true},"_unit":"final"},{"qid":"cs.final-009","type":"single","topic":"3.1 CPU 与基本部件","diff":"中","stem":"按本课程的基本组成模型，CPU 的组成部件不包括____。","options":["逻辑运算单元","控制单元","高速缓存","寄存器"],"answer":[2],"exp":"本课程模型中 CPU 由算术逻辑单元（ALU）、控制单元（CU）和寄存器组三部分组成，高速缓存（Cache）属于存储层次、不在该三部分之内。实际现代 CPU 多已集成缓存，题干因此限定“按本课程的基本组成模型”。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"二.6","optperm":true},"_unit":"final"},{"qid":"cs.final-010","type":"fill","topic":"3.5 外设与外部存储","diff":"易","stem":"磁盘存储信息时，基本的存储单元是____。","answers":["扇区"],"exp":"磁盘按磁道、扇区组织，扇区是磁盘读写的基本（最小）存储单元，通常每扇区 512 字节。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"三.1"},"_unit":"final"},{"qid":"cs.final-011","type":"fill","topic":"2.3 数据的运算","diff":"中","stem":"十六进制数 A25F 与十进制数 2018 的和是____H。","answers":["AA41","aa41","AA41H"],"exp":"统一成十六进制再相加：2018D = 7E2H，A25FH + 7E2H = AA41H。验算（十进制）：A25FH = 41567，41567 + 2018 = 43585 = AA41H。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"三.2"},"_unit":"final"},{"qid":"cs.final-012","type":"fill","topic":"2.2 数据的存储与表示","diff":"易","stem":"0.5MB = ____KB。","answers":["512","512KB"],"exp":"存储容量按二进制换算：1MB = 1024KB，故 0.5MB = 0.5 × 1024 = 512KB。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"三.3"},"_unit":"final"},{"qid":"cs.final-013","type":"fill","topic":"2.3 数据的运算","diff":"易","stem":"逻辑运算：11001010 ∧ 00001001 的运算结果是____。","answers":["00001000"],"exp":"∧ 是按位与，逐位对齐：11001010 与 00001001 只有从右数第 4 位同为 1，结果为 00001000。前导零要保留，与操作数同为 8 位。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"三.4"},"_unit":"final"},{"qid":"cs.final-014","type":"fill","topic":"2.2 数据的存储与表示","diff":"易","stem":"用浮点数表示任意一个数据时，可通过改变浮点数的____部分的大小，使小数位置产生移动。","answers":["阶码"],"exp":"浮点数由尾数和阶码组成：尾数决定有效数字（精度），阶码决定小数点的位置，改变阶码即可移动小数点。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"三.5"},"_unit":"final"},{"qid":"cs.final-015","type":"fill","topic":"3.4 总线","diff":"易","stem":"计算机的总线可以划分为____、____和控制总线。","answers":["地址总线、数据总线","地址总线 数据总线","地址总线，数据总线","数据总线、地址总线","数据总线 地址总线","数据总线，地址总线"],"exp":"按传输信息种类分为数据总线（传数据，双向）、地址总线（传地址，单向，由 CPU 发出）、控制总线（传控制与状态信号）。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"三.6"},"_unit":"final"},{"qid":"cs.final-016","type":"fill","topic":"3.2 存储器与地址空间","diff":"中","stem":"一个寻址能力为 16G 的 CPU，它的地址总线有____根。","answers":["34","34根","34 根"],"exp":"n 根地址线可寻址 2^n 个单元。16G = 2^4 × 2^30 = 2^34，故需 34 根地址线。注意 16G 是 2 的幂，不需要向上取整的额外处理。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"三.7"},"_unit":"final"},{"qid":"cs.final-017","type":"short","topic":"3.7 冯·诺依曼体系结构","diff":"易","stem":"某硬件结构示意图用 A～E 表示五个空白部件：A 在左侧，负责把程序和原始数据送入计算机；B 在右侧，负责把处理结果送出；C 居中，完成算术运算和逻辑运算；D 在下方，向各部件发出指令流、指挥协调工作；E 在上方，与 C 双向交换数据，保存程序、原始数据和中间结果。请写出 A～E 对应的部件名称。","ref":"A：输入系统（输入设备）。\nB：输出系统（输出设备）。\nC：运算器。\nD：控制器。\nE：存储器。","exp":"原卷为填图题，此处为图形题文本等价改写。采分点（8 分）：五个名称及对应关系，运算器与控制器各约 2 分，其余各约 1～2 分。易错：把 C、D 对调；数据流走 A→C→B，指令流由 D 发出，可用流向来定位。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"四.1"},"_unit":"final"},{"qid":"cs.final-018","type":"short","topic":"4.4 栈与队列","diff":"易","stem":"描述队列和栈的概念，并给出其操作特点。","ref":"栈：一种操作受限的线性表，添加、删除只能在一端（栈顶）实现，特点是后进先出（LIFO）。基本操作为入栈、出栈、判空，通常用数组或链表实现。\n队列：一种线性列表，插入只能在一端（队尾）进行，删除只能在另一端（队头）进行，只能按存入的先后顺序处理，特点是先进先出（FIFO）。基本操作为入列、出列、判空，同样可用数组或链表实现。","exp":"采分点（8 分）：栈的概念与 LIFO（2 分）、栈的操作与实现（2 分）、队列的概念与 FIFO（2 分）、队列的操作与实现（2 分）。答题时把“操作端”说清楚：栈同一端进出，队列一端进另一端出。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"四.2"},"_unit":"final"},{"qid":"cs.final-019","type":"short","topic":"8.1 计算机网络的定义与功能","diff":"易","stem":"为何百兆带宽的下载速度只有 10M（约 10MB/s）？","ref":"带宽的单位是比特每秒（b/s），下载速度的单位是字节每秒（B/s），1B = 8b。\n百兆带宽 = 100Mb/s，理论下载速度 = 100 ÷ 8 = 12.5MB/s。\n实际下载还受协议开销、服务器限速、网络拥塞等影响，所以只有约 10MB/s 属正常现象。","exp":"采分点（8 分）：①指出 b 与 B 两个单位不同（4 分）；②1B = 8b，算出 100Mb/s ÷ 8 = 12.5MB/s（3 分）；③说明实际损耗使速度再低一些（1 分）。注意原卷参考答案写作“100Mb≈12MB”，表述不规范，此处已修正为 12.5MB/s。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"四.3"},"_unit":"final"},{"qid":"cs.final-020","type":"comp","topic":"2.3 数据的运算","diff":"中","stem":"利用补码计算：－101100 ＋ 1001001（两个数均为二进制，字长取 8 位，含 1 位符号位）。要求写出原码、补码、相加过程与最终结果。","ref":"1）原码形式：－101100 → 1 0101100；＋1001001 → 0 1001001。\n2）补码形式：负数符号位不变、数值位取反末位加 1 → 1 1010100；正数补码同原码 → 0 1001001。\n3）补码相加：1 1010100 ＋ 0 1001001 ＝ 10 0011101，最高位进位丢弃，得 0 0011101。\n4）结果符号位为 0，是正数，补码即原码：0 0011101。\n5）最终结果：二进制 11101（十进制 29）。验算：－44 ＋ 73 ＝ 29。","exp":"采分点（6 分）：原码 1 分、补码 2 分、相加并丢弃溢出进位 1 分、结果求补（正数不变）1 分、最终结果 1 分。易错：忘记把 －101100 先补足 8 位；进位到第 9 位时不丢弃。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"五.1"},"_unit":"final"},{"qid":"cs.final-021","type":"comp","topic":"4.7 算法概念与表示","diff":"中","stem":"把“输出 200 以内所有质数”的流程图改写为可逐行执行的伪代码。质数指在大于 1 的整数中，除 1 和自身外不再有其他约数的数。要求：n 从 2 枚举到 200；每个 n 都从 m=2 开始试除；只用顺序、循环、选择三种基本结构；一旦发现 n 能被某个小于 n 的 m 整除即停止内层检查；只有试除到 m=n 时才输出 n。","ref":"开始\nn ← 2\nwhile n ≤ 200：\n    m ← 2\n    while n mod m ≠ 0：\n        m ← m + 1\n    if m = n：\n        输出 n（n 为质数）\n    n ← n + 1\n结束","exp":"原卷为画流程图，此处为图形题文本等价改写。采分点（6 分）：①n=2 起、n≤200 循环且每轮重置 m=2（2 分）；②内层以 n mod m ≠ 0 为继续条件，整除即退出（2 分）；③用 m=n 判定输出（1 分）；④n 自增与循环收尾（1 分）。复核：200 以内共 46 个质数，最大为 199。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"五.2"},"_unit":"final"},{"qid":"cs.final-022","type":"comp","topic":"4.8 排序","diff":"中","stem":"数组中存储了数据：21、30、56、4、43、15、70。按“每趟从右向左相邻比较，把较小值逐步换到前面（向前冒泡）”的冒泡排序，写出前 5 趟的结果及最终排序结果。","ref":"初始：21 30 56 4 43 15 70\n第 1 趟：4 21 30 56 15 43 70\n第 2 趟：4 15 21 30 56 43 70\n第 3 趟：4 15 21 30 43 56 70\n第 4 趟：4 15 21 30 43 56 70（无交换）\n第 5 趟：4 15 21 30 43 56 70（无交换）\n最终：4 15 21 30 43 56 70","exp":"采分点（6 分）：每趟结果各约 1 分，最终有序 1 分。方向是本题关键：第 1 趟把最小值 4 冒到最前，第 2 趟把次小值 15 冒到第二位。若按从左向右把大值往后冒泡，中间过程与本答案不同；第 3 趟后已有序，加“无交换即提前结束”的标志可少做无用趟。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"五.3"},"_unit":"final"},{"qid":"cs.final-023","type":"comp","topic":"4.2 链表","diff":"中","stem":"用数组存储链表，每个结点由数据和指针（下一结点地址）构成。各地址内容如下（格式为 地址：数据/下一地址）：40：D/46，41：I/40，42：43/43，43：44/44，44：J/50，45：46/45，46：Y/00，47：M/42，48：48/48，49：49/49，50：U/40。链表头指针指向地址 44，00 表示空指针。这个链表表示的名字是什么？写出求解过程。","ref":"1）地址 44：数据 J，下一地址 50。\n2）地址 50：数据 U，下一地址 40。\n3）地址 40：数据 D，下一地址 46。\n4）地址 46：数据 Y，下一地址 00，链表结束。\n结果为：JUDY。","exp":"采分点（4 分）：从头指针出发逐跳跟踪（每跳约 1 分），读到空指针停止并拼出 JUDY。地址 41（I）、47（M）等不在链上，是干扰数据；不能按地址顺序读，必须按指针走。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"五.4"},"_unit":"final"},{"qid":"cs.final-024","type":"comp","topic":"2.2 数据的存储与表示","diff":"易","stem":"写出解题步骤：表示 0～512 范围内的无符号整数，需要的二进制数至少是多少位？","ref":"1）0～512 共 513 个整数（含 0 和 512）。\n2）n 位二进制可表示 2^n 个不同取值。\n3）2^9 = 512 < 513，不够；2^10 = 1024 ≥ 513，足够。\n4）所以至少需要 10 位二进制数。","exp":"采分点（5 分）：①取值个数是 513 而不是 512（2 分）；②用 2^n 与取值个数比较（2 分）；③结论 10 位（1 分）。常见错误：因为 2^9 = 512 就答 9 位，那样最大只能表示到 511。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"五.5"},"_unit":"final"},{"qid":"cs.final-025","type":"comp","topic":"2.1 进位计数制及其转换","diff":"易","stem":"将二进制数 11011110 分别转换为十进制数、八进制数和十六进制数，并写出转换过程。","ref":"十进制：按权展开 1×2^7＋1×2^6＋0×2^5＋1×2^4＋1×2^3＋1×2^2＋1×2^1＋0×2^0 = 128＋64＋16＋8＋4＋2 = 222，即 (11011110)₂ = (222)₁₀。\n十六进制：四位并一位，1101 1110 → D E，即 (DE)₁₆。\n八进制：三位并一位（不足补零），011 011 110 → 3 3 6，即 (336)₈。","exp":"采分点（6 分）：三种结果各 1 分，对应过程各 1 分。二进制转八/十六进制不必先过十进制，直接分组最快；验算 336O = 3×64＋3×8＋6 = 222，DEH = 13×16＋14 = 222。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"五.6"},"_unit":"final"},{"qid":"cs.final-026","type":"comp","topic":"2.2 数据的存储与表示","diff":"中","stem":"假设一个数码相机的存储容量是 256MB。如果每个像素需要 3 个字节的存储空间，而且一张照片包括每行 1024 像素及每列 1024 像素，那么这台数码相机可以存多少张照片？","ref":"每张照片像素数：1024 × 1024。\n每张照片占用空间：3 × 1024 × 1024 B = 3MB。\n总容量：256 × 1024 × 1024 B = 256MB。\n可存照片数：256MB ÷ 3MB = 256/3 ≈ 85.33。\n照片必须整张存放，向下取整，所以可存 85 张。","exp":"采分点（5 分）：每张照片 3MB（2 分）、总容量与相除（2 分）、向下取整得 85 张（1 分）。易错：约成 85.3 张或四舍五入成 86 张；1024×1024 与 256×1024×1024 中的 1024² 可约去，直接 256/3 即可。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"五.7"},"_unit":"final"},{"qid":"cs.final-027","type":"comp","topic":"4.6 图","diff":"难","stem":"用数组的方式存储图，写出下列带权无向图对应的邻接矩阵。顶点顺序按 A、B、C、D、E、F，边及权值为：A—B＝523，A—C＝345，B—C＝200，B—D＝548，C—D＝360，C—E＝467，D—E＝245，D—F＝320，E—F＝555。约定：自身到自身记 0，不相邻记 ∞。","ref":"邻接矩阵（行、列均按 A B C D E F）：\nA：0 523 345 ∞ ∞ ∞\nB：523 0 200 548 ∞ ∞\nC：345 200 0 360 467 ∞\nD：∞ 548 360 0 245 320\nE：∞ ∞ 467 245 0 555\nF：∞ ∞ ∞ 320 555 0","exp":"原卷为看图写矩阵，此处把原图的顶点与边转成文字（图形题文本等价改写）。采分点（7 分）：9 条边双向写入、位置正确（5 分），主对角线为 0 且矩阵关于主对角线对称（1 分），不相邻处写 ∞（1 分）。无向图邻接矩阵必对称，可用对称性自查。","meta":{"source":"计算机导论 2019 年期末真题","paper":"final2019","paperNo":"五.8"},"_unit":"final"},{"qid":"cs.final-028","type":"term","topic":"1.1 计算机的历史与发展","diff":"中","stem":"请解释“图灵机”。","ref":"图灵机是艾伦·图灵于 1937 年提出的一种抽象计算模型，由一个控制器、一个读写头和一条无限长的纸带组成，按规则在纸带上读写符号并移动。它为可计算性理论奠定了基础，是现代计算机的理论原型。","exp":"采分点：①图灵提出的抽象计算模型；②控制器＋读写头＋无限长纸带三个组成；③意义（可计算性理论、现代计算机理论原型）。","meta":{"source":"名词解释与简答专项（计导名词解释和简答.docx）"},"_unit":"final"},{"qid":"cs.final-029","type":"single","topic":"1.1 计算机的历史与发展","diff":"易","stem":"我国第一台电子计算机是（　）。","options":["ENIAC","103 机","曙光 I 号","109 机"],"answer":[1],"exp":"1958 年研制成功的 103 机是我国第一台电子计算机；ENIAC 是美国的第一台，109 系列是其后的国产机型，曙光 I 号是 1993 年的国产服务器。","meta":{"source":"2026 版课件与 2020 版习题（第 1 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-030","type":"single","topic":"1.1 计算机的历史与发展","diff":"中","stem":"在我国早期计算机中，被称为“功勋机”的是（　）。","options":["103 机","109 乙机","银河-I","109 丙机"],"answer":[3],"exp":"109 丙机因长期承担重要计算任务而被称为“功勋机”；103 机是我国第一台电子计算机，109 乙机是晶体管机型，银河-I 是 1983 年的亿次巨型机。","meta":{"source":"2026 版课件与 2020 版习题（第 1 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-031","type":"single","topic":"1.2 计算机的特点与分类","diff":"易","stem":"按照工作原理，计算机可分为（　）。","options":["数字式、模拟式和混合式电子计算机","巨型机、大型机、微型机","通用计算机和专用计算机","电子管、晶体管、集成电路计算机"],"answer":[0],"exp":"按工作原理分为数字式、模拟式、混合式三类；按规模分为巨型机到微型机，按用途分为通用与专用，按物理器件才是电子管到集成电路的划代。注意把分类标准与分类结果对应起来。","meta":{"source":"2026 版课件与 2020 版习题（第 1 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-032","type":"multi","topic":"1.2 计算机的特点与分类","diff":"易","stem":"下列属于电子计算机主要特点的有（　）。","options":["记忆（存储）能力强","高度自动化、可靠性高","能完全替代人脑进行创造性思维","计算速度快、计算精度高"],"answer":[0,1,3],"exp":"计算机的特点包括高速、高精度、存储记忆能力强、按程序自动运行、可靠性高；它按人编制的程序工作，不具备完全替代人脑创造性思维的能力。","meta":{"source":"2026 版课件与 2020 版习题（第 1 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-033","type":"fill","topic":"1.1 计算机的历史与发展","diff":"易","stem":"计算机第一定律为摩尔定律，它阐述了每____个月芯片能力增长一倍。","answers":["18","十八","18个月","18 个月"],"exp":"摩尔定律的经典表述为每 18 个月（一说 18～24 个月）芯片上晶体管数量翻一番、能力增长一倍。本空按课件口径填 18。","meta":{"source":"2026 版课件与 2020 版习题（第 1 章）"},"_unit":"final"},{"qid":"cs.final-034","type":"fill","topic":"1.3 计算机的工作原理","diff":"易","stem":"计算机的工作原理是“____”。","answers":["存储程序控制","存储程序与程序控制","存储程序和程序控制","存储程序、程序控制"],"exp":"冯·诺依曼型计算机的两大特征是程序存储与程序控制：程序和数据以二进制形式不加区别地存入存储器，控制器按存储器中的指令序列自动工作。","meta":{"source":"2026 版课件与 2020 版习题（第 1 章）"},"_unit":"final"},{"qid":"cs.final-035","type":"fill","topic":"1.6 计算思维","diff":"中","stem":"应用计算思维解决实际问题，一般要经过抽象、____、设计三个步骤。","answers":["理论","理论分析","证明或寻找相关理论"],"exp":"三个步骤：把问题抽象为符号化的数据表示；证明或寻找可支撑求解的相关理论；设计并实现算法或系统。","meta":{"source":"2026 版课件与 2020 版习题（第 1 章）"},"_unit":"final"},{"qid":"cs.final-036","type":"short","topic":"1.5 计算机的发展趋势","diff":"易","stem":"计算机在各个领域都有广泛应用，请写出五个主要应用领域，并简述计算机的发展趋势。","ref":"应用领域（任写五个）：科学计算（数值计算）、数据处理（信息管理）、过程控制（实时控制）、计算机辅助系统（CAD/CAM/CAI）、人工智能、网络与通信、多媒体应用。\n发展趋势：微型化、巨型化、网络化、智能化、多媒体化。","exp":"采分点：应用领域每个 1 分（满 5 分），发展趋势五项各 1 分。巨型化与微型化并存并不矛盾：一端追求超强算力，一端追求便携普及。","meta":{"source":"2026 版课件与 2020 版习题（第 1 章）"},"_unit":"final"},{"qid":"cs.final-037","type":"term","topic":"2.2 数据的存储与表示","diff":"易","stem":"请解释“补码”。","ref":"补码是计算机中用于表示有符号整数的一种二进制编码方式。正数的补码与其原码相同；负数的补码是符号位不变、其余各位取反后末位加 1 所得。补码能把减法运算转换为加法运算，且 0 的表示唯一，可简化运算器的硬件设计。","exp":"采分点：①有符号数的编码方式；②正数同原码；③负数取反加一；④作用（减法变加法、0 唯一、简化硬件）。","meta":{"source":"名词解释与简答专项（计导名词解释和简答.docx）"},"_unit":"final"},{"qid":"cs.final-038","type":"single","topic":"2.2 数据的存储与表示","diff":"中","stem":"在____中，零的表现形式是唯一的。","options":["原码","反码","补码","以上选项都正确"],"answer":[2],"exp":"原码与反码都有 +0 和 -0 两种表示（如 8 位原码 00000000 与 10000000），补码中 0 只有 00000000 一种形式，这正是采用补码的原因之一。","meta":{"source":"2026 版课件与 2020 版习题（第 2 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-039","type":"single","topic":"2.4 字符型数据的编码","diff":"易","stem":"存储一个 24×24 点阵的汉字字形码需要（　）个字节。","options":["16","48","72","24"],"answer":[2],"exp":"点阵每个点占 1 位，24×24 = 576 位，除以 8 得 72 字节。通用公式：横向点数 × 纵向点数 ÷ 8 × 汉字个数；16×16 点阵单字为 32B。","meta":{"source":"2026 版课件与 2020 版习题（第 2 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-040","type":"single","topic":"2.1 进位计数制及其转换","diff":"易","stem":"将十进制整数转换为 N 进制整数的方法是（　）。","options":["乘 N 取整法","除 N 取整法","除 N 取余法","乘 N 取余法"],"answer":[2],"exp":"整数部分用除 N 取余法，余数按从后向前的次序排列；小数部分用乘 N 取整法，整数按从前向后排列。两条规则常被对调设错，注意“整数除、小数乘”。","meta":{"source":"2026 版课件与 2020 版习题（第 2 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-041","type":"multi","topic":"2.4 字符型数据的编码","diff":"中","stem":"在同一汉字系统中，分别用拼音、五笔等不同输入方式输入同一个汉字，下列说法正确的有（　）。","options":["机内码相同","字形码相同","机内码与 ASCII 码完全相同，无法区分","输入码（外码）一般不同"],"answer":[0,1,3],"exp":"外码随输入法而变，内码与字形码由汉字本身决定、与输入法无关。汉字机内码通常把国标码两个字节的最高位置 1，正是为了与单字节 ASCII 码区分。","meta":{"source":"2026 版课件与 2020 版习题（第 2 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-042","type":"multi","topic":"2.1 进位计数制及其转换","diff":"易","stem":"计算机内部采用二进制的主要原因有（　）。","options":["表示同一个数值时，二进制位数一定比十进制少","只有两种状态，物理上容易用电路实现，抗干扰能力强","算术运算规则简单，易于用数字逻辑电路实现","0 和 1 可对应逻辑假与真，便于逻辑运算"],"answer":[1,2,3],"exp":"三条理由：物理易实现、运算规则简单、便于逻辑运算。「二进制位数一定比十进制少」不成立——表示同一数值时二进制所需位数通常更多。","meta":{"source":"名词解释与简答专项（计导名词解释和简答.docx）","optperm":true},"_unit":"final"},{"qid":"cs.final-043","type":"fill","topic":"2.1 进位计数制及其转换","diff":"中","stem":"十六进制数 3FC3 转换为对应的二进制数是____。","answers":["0011111111000011","11111111000011"],"exp":"十六进制转二进制用“一位拉四位”：3→0011，F→1111，C→1100，3→0011，连起来为 0011111111000011（最高位的 0 可省略）。","meta":{"source":"2026 版课件与 2020 版习题（第 2 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-044","type":"fill","topic":"2.2 数据的存储与表示","diff":"中","stem":"已知最高位为符号位的 8 位机器码是 10111010，当它是原码时，表示的十进制真值是____。","answers":["-58","－58","-58D"],"exp":"原码最高位 1 表示负数，数值部分 0111010 = 32＋16＋8＋2 = 58，故真值为 -58。若同一机器码被当作补码，则真值为 -70，两种解释不要混淆。","meta":{"source":"2026 版课件与 2020 版习题（第 2 章）"},"_unit":"final"},{"qid":"cs.final-045","type":"short","topic":"2.2 数据的存储与表示","diff":"中","stem":"比较原码、反码和补码的表示方法，并说明为何计算机普遍采用补码。","ref":"原码：最高位为符号位，其余位为数值的绝对值，直观，但有 +0 与 -0 两种零，加减运算规则复杂。\n反码：正数同原码，负数符号位不变、数值位取反，仍存在两种零，运算需处理循环进位。\n补码：正数同原码，负数在反码基础上末位加 1；0 的表示唯一，能把减法统一为加法（加上负数的补码），符号位可与数值位一起参与运算。\n因此补码大幅简化运算器设计、提高运算效率，被普遍采用。","exp":"采分点：三种编码的规则各 1 分，补码的两条优势（0 唯一、减法化加法）各 1 分，落到“简化硬件”结论 1 分。","meta":{"source":"名词解释与简答专项（计导名词解释和简答.docx）"},"_unit":"final"},{"qid":"cs.final-046","type":"comp","topic":"2.3 数据的运算","diff":"中","stem":"采用字长 8 位存储（含 1 位符号位），利用补码计算 7－9，结果写成补码形式，并给出对应的十进制真值。","ref":"7 的补码：00000111。\n9 的原码：00001001，－9 的补码：11110111（取反 11110110，加 1 得 11110111）。\n相加：00000111 ＋ 11110111 ＝ 11111110。\n结果符号位为 1，是负数；对其再求补得 00000010，故真值为 －2。\n所以 7－9 的结果补码为 11111110，真值 －2。","exp":"采分点：①把减法写成 7＋(－9) 的补码相加；②－9 补码求法正确；③相加无溢出进位；④结果转回真值 －2。验算：7－9 = －2，与补码 11111110 一致。","meta":{"source":"2026 版课件与 2020 版习题（第 2 章）"},"_unit":"final"},{"qid":"cs.final-047","type":"term","topic":"3.4 总线","diff":"易","stem":"请解释“总线”。","ref":"总线是计算机各功能部件之间传送信息的公共通信干线，由一组导线组成的传输线束。按所传输信息的种类分为数据总线（传送数据，双向）、地址总线（传送存储单元或 I/O 接口地址，单向，由 CPU 发出）和控制总线（传送控制、状态与中断等信号）。","exp":"采分点：①部件间传送信息的公共通信干线；②三类总线名称；③各类总线传什么、方向如何。","meta":{"source":"期末复习提纲（计导期末.docx / 3_计算机导论复习.docx）"},"_unit":"final"},{"qid":"cs.final-048","type":"single","topic":"3.2 存储器与地址空间","diff":"易","stem":"80486 有 32 根地址线，能寻址（　）内存？","options":["4G","40M","128M","1G"],"answer":[0],"exp":"n 根地址线可寻址 2^n 个存储单元，2^32 B = 4GB。与“16G 寻址需 34 根地址线”互为正反两种考法。","meta":{"source":"2026 版课件与 2020 版习题（第 3 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-049","type":"single","topic":"3.5 外设与外部存储","diff":"中","stem":"标称 128GB 的优盘，实际空间约为（　）。","options":["110GB","113GB","119GB","128GB"],"answer":[2],"exp":"厂商按十进制标称：128GB = 128×10^9 B；操作系统按二进制显示：1GB = 2^30 B。128×10^9 ÷ 2^30 ≈ 119.2GB，故约 119GB。","meta":{"source":"2026 版课件与 2020 版习题（第 3 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-050","type":"single","topic":"3.3 存储类型与层次结构","diff":"易","stem":"CPU 不能直接读取和执行存储在____中的指令。","options":["Cache","硬盘","ROM","RAM"],"answer":[1],"exp":"CPU 只能直接访问内存（Cache、RAM、ROM），硬盘属外存，程序须先由操作系统调入内存才能执行。","meta":{"source":"2026 版课件与 2020 版习题（第 3 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-051","type":"single","topic":"3.3 存储类型与层次结构","diff":"易","stem":"正在编辑某个文件时突然断电，则计算机中（　）里的信息全部丢失，再通电后也不能恢复。","options":["ROM","PROM","EPROM","RAM"],"answer":[3],"exp":"RAM 是易失性存储器，断电即丢失；ROM/PROM/EPROM 都是只读存储器，断电后信息保持。正在编辑而尚未保存的内容就在 RAM 中。","meta":{"source":"2026 版课件与 2020 版习题（第 3 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-052","type":"multi","topic":"3.3 存储类型与层次结构","diff":"中","stem":"与外存储器相比，关于内存储器（主存）的说法正确的有（　）。","options":["其中的 RAM 断电后信息丢失","主存只能由 ROM 组成，不能写入","容量相对较小，但存取速度快、单位成本高","存放正在被 CPU 使用的程序和数据，可与 CPU 直接交换信息"],"answer":[0,2,3],"exp":"内存特点是容量小、速度快、成本高，直接服务 CPU；主存由 RAM 与 ROM 共同组成，RAM 可读可写且易失，所以“只能由 ROM 组成”错误。外存则容量大、速度慢、成本低，用于长期保存。","meta":{"source":"2026 版课件与 2020 版习题（第 3 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-053","type":"short","topic":"3.3 存储类型与层次结构","diff":"易","stem":"什么叫 ROM？什么叫 RAM？它们各自有什么特点？","ref":"RAM（随机存取存储器）：可读可写、存取速度快，属易失性存储器，断电后信息丢失；是主存的主要部分，存放正在运行的程序和数据。\nROM（只读存储器）：通常只能读出不能（或不易）写入，属非易失性存储器，断电后信息不丢失；用于存放固定不变的程序与数据，如 BIOS、引导（自举）程序。","exp":"采分点：两者的中文名称与全称、读写特性、易失性、典型用途各成要点。答题时把“RAM 可读可写但怕断电、ROM 只读但不怕断电”这一对比说清楚。","meta":{"source":"2026 版课件与 2020 版习题（第 3 章）"},"_unit":"final"},{"qid":"cs.final-054","type":"comp","topic":"3.2 存储器与地址空间","diff":"难","stem":"某计算机字长 16 位，存储容量 1MB，按字编址。求它的寻址范围（地址从 0 开始，写出最后一个地址的十进制值），并说明若改为按字节编址，寻址范围又如何。","ref":"字长 16 位 = 2B，按字编址时每个地址对应 2B。\n字数 = 1MB ÷ 2B = 1024×1024 ÷ 2 = 524288 = 2^19 个字。\n按字编址寻址范围：0～524287（共 2^19 个地址，需 19 根地址线）。\n按字节编址：1MB = 2^20 B，共 1048576 个地址，范围 0～1048575（需 20 根地址线）。","exp":"采分点：①按字编址先把容量换成“字”数；②2^19 与末地址 524287；③按字节编址 2^20 与末地址 1048575。易错：把末地址写成 524288（个数与最大地址差 1），或漏掉编址单位。","meta":{"source":"2026 版课件与 2020 版习题（第 3 章）"},"_unit":"final"},{"qid":"cs.final-055","type":"comp","topic":"3.6 指令与指令周期","diff":"难","stem":"现代计算机常用流水线技术改善性能。请回答：①流水线的基本思想是什么？②它主要改善的是指令吞吐量还是单条指令的执行时间？③流水线与并行处理有什么区别？","ref":"①把一条指令的执行划分为取指、译码、执行等若干阶段，让多条指令在时间上重叠：控制单元能同时处理不同阶段时，下一条指令可在前一条指令完成之前开始。\n②主要改善吞吐量，即单位时间内完成的指令总数；单条指令仍要经过同样多的阶段，其总执行时间并不因此缩短。\n③并行处理是在计算机中设置多个控制单元、算术逻辑单元或存储单元，靠部件数量上的重复实现同时工作（空间上的并行）；流水线不改变部件数量，靠各阶段时间上的重叠提高效率（时间上的并行）。","exp":"采分点：①阶段划分＋时间重叠；②明确是吞吐量而非单条指令延迟；③并行处理=多部件同时工作，流水线=同一通路分阶段重叠。","meta":{"source":"2026 版课件与 2020 版习题（第 3 章）"},"_unit":"final"},{"qid":"cs.final-056","type":"single","topic":"4.1 数据结构与数组","diff":"中","stem":"长度为 50 的一维数组 data，每个元素占 4 个存储单元，data[0] 的地址为 1000，则 data[12] 的地址为（　）。","options":["1040","1048","1044","1052"],"answer":[1],"exp":"数组元素连续存放，地址 = 基地址 + 下标 × 元素长度 = 1000 + 12×4 = 1048。下标从 0 开始，所以 data[12] 是第 13 个元素，但只需乘 12。","meta":{"source":"2026 版课件与 2020 版习题（第 4 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-057","type":"single","topic":"4.4 栈与队列","diff":"中","stem":"如果进栈顺序为 a1、a2、a3、a4，可能的出栈顺序为（　）。","options":["a2、a4、a3、a1","a3、a1、a4、a2","a3、a4、a1、a2","任意顺序"],"answer":[0],"exp":"栈后进先出。a2 先出说明 a1 已压栈，随后 a3、a4 进栈，再依次弹出 a4、a3，最后弹出栈底的 a1，序列 a2、a4、a3、a1 合法。凡要求“栈底元素比其上元素先出”的序列都不可能，例如 a1 在 a2 之前弹出而 a2 早已入栈的情形。","meta":{"source":"2026 版课件与 2020 版习题（第 4 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-058","type":"single","topic":"4.9 查找","diff":"易","stem":"下列数据结构中能用二分法进行查找的是（　）。","options":["二叉树","线性链表","顺序存储的有序线性表","有序线性链表"],"answer":[2],"exp":"二分查找要求两个条件同时成立：元素有序，且能按序号直接取到中间元素（随机访问）。链表即便有序也只能顺序访问，不能折半定位。","meta":{"source":"2026 版课件与 2020 版习题（第 4 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-059","type":"single","topic":"4.2 链表","diff":"易","stem":"链表不具备的特点是（　）。","options":["不必事先预估存储空间","插入元素不需要移动元素","支持随机访问元素","所需空间与线性表长度成正比"],"answer":[2],"exp":"链表靠指针链接、存储离散，只能从头顺序访问，不能随机存取；其优点是动态分配、插入删除只改指针不必搬移元素，代价是每个结点多一个指针域。","meta":{"source":"2026 版课件与 2020 版习题（第 4 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-060","type":"single","topic":"4.7 算法概念与表示","diff":"易","stem":"算法一般都可以用哪几种控制结构组合而成（　）。","options":["顺序、选择、循环","顺序、循环、嵌套","循环、递归、选择","循环、分支、递归"],"answer":[0],"exp":"结构化程序设计的三种基本控制结构是顺序、选择（分支）、循环，任何算法都可由它们组合表达；递归是一种实现手段，嵌套是结构的书写形式，都不属于基本控制结构的并列项。","meta":{"source":"2026 版课件与 2020 版习题（第 4 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-061","type":"multi","topic":"4.5 树与二叉树","diff":"中","stem":"下列关于树与二叉树的说法正确的有（　）。","options":["二叉树是非线性结构，只能采用链式存储","树的结点包含一个数据元素及若干指向其子树的指针","二叉树每个结点至多有两棵子树","二叉树每个结点的子树是无序的，不区分左右"],"answer":[1,2],"exp":"二叉树每结点至多两棵子树，且分左右、有序；它既可链式存储，也可顺序（数组）存储，例如完全二叉树常用数组。树结点的通用表示是数据元素加指向各子树的指针。","meta":{"source":"2026 版课件与 2020 版习题（第 4 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-062","type":"multi","topic":"4.7 算法概念与表示","diff":"易","stem":"下列关于算法基本特性的说法正确的有（　）。","options":["有穷性：算法必须在执行有限步之后结束","确定性：每一步骤都有确切定义，不产生二义性","输入：一个算法可以有零个或多个输入","输出：一个算法可以没有任何输出"],"answer":[0,1,2],"exp":"算法五特性：有穷性、确定性、能行性（可行性）、输入（零个或多个）、输出（一个或多个）。「可以没有任何输出」错误——没有输出的算法无法向外界给出结果。","meta":{"source":"2026 版课件与 2020 版习题（第 4 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-063","type":"fill","topic":"4.9 查找","diff":"易","stem":"在长度为 64 的有序线性表中进行顺序查找，最坏情况下需要比较的次数为____。","answers":["64","64次","64 次"],"exp":"顺序查找最坏要遍历全表（目标在最后或不存在），比较 64 次；若用二分查找，最坏只需 log₂64 = 6 次，可作对照记忆。","meta":{"source":"2026 版课件与 2020 版习题（第 4 章）"},"_unit":"final"},{"qid":"cs.final-064","type":"fill","topic":"4.5 树与二叉树","diff":"中","stem":"在一棵二叉树上，第五层的结点数最多是____。（根结点为第一层）","answers":["16","16个","16 个"],"exp":"二叉树第 i 层最多 2^(i-1) 个结点，第五层为 2^4 = 16。根为第一层是本题前提，若把根当第 0 层会错算成 32。","meta":{"source":"2026 版课件与 2020 版习题（第 4 章）"},"_unit":"final"},{"qid":"cs.final-065","type":"fill","topic":"4.8 排序","diff":"易","stem":"冒泡排序算法在最好的情况下，元素交换次数为____。","answers":["0","0次","0 次","零"],"exp":"最好情况是初始序列已有序，一趟扫描没有任何交换，交换次数为 0（带“无交换即结束”标志时一趟即可判定完成）。","meta":{"source":"2026 版课件与 2020 版习题（第 4 章）"},"_unit":"final"},{"qid":"cs.final-066","type":"fill","topic":"4.1 数据结构与数组","diff":"易","stem":"数据的逻辑结构分为线性结构和____两大类。","answers":["非线性结构","非线性"],"exp":"逻辑结构分线性结构（线性表、栈、队列）与非线性结构（树、图）；它与存储结构（顺序、链式等）是两个层面，循环队列、线性链表这些说法描述的是存储结构。","meta":{"source":"2026 版课件与 2020 版习题（第 4 章）"},"_unit":"final"},{"qid":"cs.final-067","type":"short","topic":"4.2 链表","diff":"中","stem":"比较数组和链表在存储结构和操作效率上的优缺点。","ref":"存储结构：数组在内存中连续存放，可通过下标直接定位；链表结点离散分布，靠指针链接。\n访问：数组支持随机访问，按下标取元素为 O(1)；链表只能从头顺序访问，为 O(n)。\n插入/删除：数组平均要移动一半元素，为 O(n)；链表在已知位置时只改指针，为 O(1)。\n空间：数组需预先分配连续空间，可能有闲置；链表按需分配，但每个结点额外付出指针域。","exp":"采分点：连续 vs 离散（2 分）、随机访问 vs 顺序访问（2 分）、插入删除的移动代价（2 分）、空间开销（1 分）。","meta":{"source":"名词解释与简答专项（计导名词解释和简答.docx）"},"_unit":"final"},{"qid":"cs.final-068","type":"short","topic":"4.10 迭代与递归","diff":"中","stem":"简述递归和迭代各自的特点，并说明它们分别适用于解决何种问题。","ref":"递归：算法或函数通过调用自身，把复杂问题分解为相似的子问题，代码简洁、符合问题本身的递归结构，适合树遍历、阶乘、斐波那契数列、分治等问题；代价是调用栈开销大，过深可能栈溢出。\n迭代：用循环结构重复执行一段代码，每次都更接近最终结果，时间与空间效率通常更高，适合可用明确重复步骤求解的问题；代码往往不如递归直观。\n凡能写成递归的问题原则上都可改写为迭代（必要时自行维护栈）。","exp":"采分点：递归的“自身调用＋分解子问题”、迭代的“循环重复”、各自适用场景与效率对比。","meta":{"source":"名词解释与简答专项（计导名词解释和简答.docx）"},"_unit":"final"},{"qid":"cs.final-069","type":"comp","topic":"4.8 排序","diff":"中","stem":"对序列 49、38、65、97、76、13、27 进行直接插入排序（每趟把下一个元素插入前面已排好的子序列，升序）。写出每一趟结束后的序列。","ref":"初始：49｜38 65 97 76 13 27\n第 1 趟：38 49｜65 97 76 13 27\n第 2 趟：38 49 65｜97 76 13 27\n第 3 趟：38 49 65 97｜76 13 27\n第 4 趟：38 49 65 76 97｜13 27\n第 5 趟：13 38 49 65 76 97｜27\n第 6 趟：13 27 38 49 65 76 97","exp":"采分点：6 趟各约 1 分。要点是“前段始终有序”：第 4 趟把 76 插到 65 与 97 之间，第 5 趟 13 使整段移动，第 6 趟 27 插到第二位。与冒泡、选择排序的中间过程区分开。","meta":{"source":"期末复习提纲（计导期末.docx / 3_计算机导论复习.docx）"},"_unit":"final"},{"qid":"cs.final-070","type":"comp","topic":"4.9 查找","diff":"中","stem":"在有序表 4、15、21、30、43、56、70（下标 0～6）中，用二分查找查找 43。写出每一次比较时的 low、high、mid 及比较结果，并给出总比较次数。","ref":"第 1 次：low=0，high=6，mid=3，中间元素 30 < 43，故 low 移到 4。\n第 2 次：low=4，high=6，mid=5，中间元素 56 > 43，故 high 移到 4。\n第 3 次：low=4，high=4，mid=4，中间元素 43 = 43，查找成功。\n总比较次数为 3 次。","exp":"采分点：三次 mid 的取值与走向各 1 分，总次数 1 分。mid 取 (low+high) 的整数下整；查找区间缩到单个元素时仍要再比一次，不能提前报“2 次”。","meta":{"source":"2026 版课件与 2020 版习题（第 4 章）"},"_unit":"final"},{"qid":"cs.final-071","type":"comp","topic":"4.5 树与二叉树","diff":"难","stem":"已知某二叉树的前序遍历为 A、B、D、E、C、F，中序遍历为 D、B、E、A、C、F。求该二叉树的后序遍历序列，并写出推导过程。","ref":"①前序第一个元素 A 是根；中序中 A 左侧 D、B、E 为左子树，右侧 C、F 为右子树。\n②左子树前序 B、D、E，根为 B；其中序 D、B、E，故 B 的左孩子为 D、右孩子为 E。\n③右子树前序 C、F，根为 C；其中序 C、F，故 F 是 C 的右孩子。\n④后序 = 左子树后序 + 右子树后序 + 根：D、E、B ＋ F、C ＋ A。\n后序遍历序列：D、E、B、F、C、A。","exp":"采分点：由前序定根、由中序分左右（2 分），递归还原左右子树（2 分），后序正确（2 分）。自检：前序 ABDE CF 与中序 DBE A CF 应与还原出的树一致。","meta":{"source":"2026 版课件与 2020 版习题（第 4 章）"},"_unit":"final"},{"qid":"cs.final-072","type":"term","topic":"5.1 软件分类与操作系统概念","diff":"易","stem":"请解释“操作系统”。","ref":"操作系统是管理和控制计算机硬件与软件资源、合理组织计算机工作流程、为用户和其他软件提供方便接口的系统软件，是用户与计算机硬件之间的接口，任何其他软件都必须在它的支持下才能运行。开机时由 ROM 中的引导程序把它装入内存并启动，关机时终止运行。","exp":"采分点：①管理软硬件资源；②系统软件（不是应用软件）；③用户与硬件之间的接口；④其他软件依赖它运行。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）"},"_unit":"final"},{"qid":"cs.final-073","type":"single","topic":"5.1 软件分类与操作系统概念","diff":"易","stem":"操作系统的引导（自举）程序一般存放在（　）中。","options":["RAM","微处理器","EEPROM","ROM"],"answer":[3],"exp":"引导程序需要在加电后立即可用，且不能被改写丢失，因此固化在 ROM（BIOS）中；RAM 断电即失，微处理器是执行部件而不是存储部件。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-074","type":"single","topic":"5.1 软件分类与操作系统概念","diff":"易","stem":"操作系统是（　）之间的接口。","options":["主机与外设","高级语言与机器语言","系统软件与应用软件","用户与计算机"],"answer":[3],"exp":"操作系统是用户（及应用程序）与计算机硬件之间的接口：向下管理硬件资源，向上提供使用界面与服务。语言与机器语言之间靠编译/解释程序，主机与外设之间靠接口电路。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-075","type":"single","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"下列不属于存储管理器功能的是（　）。","options":["在多个程序之间分配处理器时间","地址转换和内存保护","内存的虚拟存储器扩充","内存空间的分配和回收"],"answer":[0],"exp":"存储管理负责内存分配回收、地址转换与保护、虚拟存储扩充；“在多个程序之间分配处理器时间”属于进程（处理机）管理的调度职能。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-076","type":"single","topic":"5.3 操作系统的发展与分类","diff":"易","stem":"要求在规定的时间内对外界的请求必须给予及时响应的是（　）。","options":["多用户分时系统","实时系统","批处理操作系统","网络操作系统"],"answer":[1],"exp":"实时系统的核心是时限约束，分硬实时与软实时；分时系统追求交互与响应均衡，批处理追求吞吐，网络操作系统侧重网络资源共享。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-077","type":"single","topic":"5.5 程序、作业与进程","diff":"中","stem":"下列关于并发性的叙述，正确的是（　）。","options":["若干事件在同一时刻发生","若干事件在不同时刻发生","若干事件在不同时间间隔内发生","若干事件在同一时间间隔内发生"],"answer":[3],"exp":"并发强调“同一时间间隔内”多个事件都在推进，并行才强调“同一时刻”真正同时发生。单 CPU 上多进程宏观并发、微观串行。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-078","type":"multi","topic":"5.4 操作系统的组成与功能","diff":"易","stem":"下列属于现代操作系统管理功能的有（　）。","options":["高级语言程序的编译翻译","进程（处理机）管理","存储管理","设备管理与文件管理"],"answer":[1,2,3],"exp":"现代操作系统至少具有进程管理、存储管理、设备管理、文件管理四大功能；把高级语言程序翻译成机器语言是编译程序的任务，不是操作系统的功能。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-079","type":"multi","topic":"5.5 程序、作业与进程","diff":"中","stem":"下列关于进程与线程的说法正确的有（　）。","options":["一个进程可以包含多个线程","线程的引入必然增加时空开销，因此一定降低系统效率","进程是资源分配与独立运行的基本单位","引入线程可提高程序并发执行的程度，从而提高系统效率"],"answer":[0,2,3],"exp":"线程是进程内的执行单元，比进程更轻量，可减少切换开销、提高并发度；一个进程可含多个线程。把线程说成“必然增加开销、一定降低效率”与引入线程的目的相反。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-080","type":"fill","topic":"5.3 操作系统的发展与分类","diff":"易","stem":"DOS 是单用户____操作系统。","answers":["单任务","单任务操作系统"],"exp":"DOS（Disk Operating System）是单用户单任务操作系统，同一时刻只能运行一个任务；与之相对的是多用户多任务系统（如 UNIX、Linux）。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）"},"_unit":"final"},{"qid":"cs.final-081","type":"fill","topic":"5.4 操作系统的组成与功能","diff":"易","stem":"现代操作系统至少具有存储管理、____管理、设备管理和文件管理。","answers":["进程","进程管理","处理机","处理器"],"exp":"四大管理：进程（处理机）管理、存储管理、设备管理、文件管理。注意课程用语是“进程管理”而非“程序管理”。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）"},"_unit":"final"},{"qid":"cs.final-082","type":"fill","topic":"5.3 操作系统的发展与分类","diff":"易","stem":"当前三个主流通用操作系统是 Windows、macOS 和____。","answers":["Linux","linux","GNU/Linux"],"exp":"三大主流为 Windows、macOS、Linux；UNIX 是历史上的重要多用户系统，Linux 承袭其设计思想并借开源生态广泛传播。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）"},"_unit":"final"},{"qid":"cs.final-083","type":"fill","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"每个操作系统都有____，用来接收用户的输入并向操作系统解释这些请求。","answers":["用户界面","命令解释程序","用户界面或命令解释程序","用户界面（命令解释程序）"],"exp":"用户界面（命令行下即命令解释程序 Shell）负责接收并解释用户请求，再转交操作系统各管理模块执行。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）"},"_unit":"final"},{"qid":"cs.final-084","type":"short","topic":"5.5 程序、作业与进程","diff":"难","stem":"什么是死锁？什么是饥饿？两者有什么区别？","ref":"死锁：各并发进程互相等待对方所占有的资源，并且在得到对方资源之前不会释放自己已有的资源，结果谁也推进不下去。\n饥饿：由于其他并发激活的进程持久占有所需资源，使某个进程在可预见的时间内不能被激活（长期得不到所需资源或处理机）。\n区别：死锁是进程间循环等待形成的僵持状态，涉及多个进程且必然无法自行解脱；饥饿是单个或部分进程长期得不到资源，系统整体仍可能继续运行，通过调整调度策略（如老化、公平调度）可以缓解。","exp":"采分点：死锁的“互相等待＋不释放已有资源”、饥饿的“长期得不到资源”、两者在影响范围与可否自行解脱上的区别。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）"},"_unit":"final"},{"qid":"cs.final-085","type":"short","topic":"5.4 操作系统的组成与功能","diff":"易","stem":"简述操作系统的主要功能（从资源管理角度回答）。","ref":"①进程（处理机）管理：进程的创建、调度、同步与通信，把处理机时间分配给各任务。\n②存储管理：内存空间的分配与回收、地址转换、内存保护与虚拟存储扩充。\n③设备管理：设备的分配、驱动与 I/O 控制，屏蔽硬件差异。\n④文件管理：文件与目录的建立、读写、复制、删除及存取权限控制。\n此外还提供用户界面（命令解释程序或图形界面），作为用户与硬件之间的接口。","exp":"采分点：四大管理各 1～2 分，答出名称得基本分，补出每类管理的一项具体职责得满分。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）"},"_unit":"final"},{"qid":"cs.final-086","type":"short","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"简述批处理系统、分时系统和实时系统的特点与适用场景。","ref":"批处理系统：用户提交作业后不再干预，系统成批自动执行，追求吞吐量和资源利用率，适合后台大量重复计算。\n分时系统：多个用户通过终端同时使用一台计算机，处理机时间按时间片轮转，强调交互性与响应的均衡，适合多用户交互式开发与查询。\n实时系统：必须在规定时间内响应外部事件并完成任务，强调及时性与可靠性，适合工业控制、航空航天、医疗设备等。","exp":"采分点：每类系统“特点＋场景”各 1～2 分。对照记忆：批处理求吞吐、分时求交互、实时求时限。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）"},"_unit":"final"},{"qid":"cs.final-087","type":"comp","topic":"5.5 程序、作业与进程","diff":"中","stem":"某进程在运行中依次发生以下事件：①时间片用完；②随后重新获得处理机；③运行中发起一次磁盘读请求，数据尚未就绪；④磁盘读完成。请写出每个事件发生时进程状态的变化（运行、就绪、阻塞三态），并说明原因。","ref":"①时间片用完：运行 → 就绪。进程并未等待任何事件，只是暂时让出处理机，进入就绪队列等待下次调度。\n②重新获得处理机：就绪 → 运行。被调度程序选中。\n③发起磁盘读请求且数据未就绪：运行 → 阻塞。进程等待 I/O 事件，即使有空闲处理机也不能继续执行。\n④磁盘读完成：阻塞 → 就绪。等待的事件已发生，转为就绪，等待再次被调度后才能运行。","exp":"采分点：四次转换各 1 分，原因说明 2 分。易错：把阻塞完成后的状态直接写成运行——必须先回到就绪队列，等待调度。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）"},"_unit":"final"},{"qid":"cs.final-088","type":"comp","topic":"5.3 操作系统的发展与分类","diff":"中","stem":"结合课件内容，分析我国发展自主操作系统面临的主要难点，并提出至少三条可行的突破口。","ref":"难点：①研发工作量大，需要长期技术积累，内核与驱动等底层人才不足；②研发资金需求大、回报周期长；③软件生态难以构筑，应用软件与外设驱动不齐全，市场推广困难。\n机遇：政策与资本支持、供应链安全与自主可控需求，云计算、物联网、边缘计算、人工智能带来的技术范式转移，以及开源社区的发展。\n突破口：①以生态建设为核心，完善应用商店与开发工具、扶持原生应用；②通过兼容层或虚拟机兼容既有应用，推动原生应用迁移与 Web/云化；③深耕内核、驱动等核心技术并积极参与开源社区；④面向工业控制、智能终端、车机等细分市场先行落地，同时改善用户体验。","exp":"采分点：难点任三条（3 分）、突破口任三条（3 分）。答题要落到“生态”这个关键瓶颈，而不是只喊技术口号。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）"},"_unit":"final"},{"qid":"cs.final-089","type":"comp","topic":"5.4 操作系统的组成与功能","diff":"中","stem":"围绕文件管理回答：①文件管理器提供哪些基本操作？②什么是文件的共享、保密和保护？③文件的保密和共享是否矛盾，如何兼顾？","ref":"①基本操作：文件（及目录）的建立、读、写、复制、删除，以及重命名、移动和权限设置。\n②共享：允许事先规定的多个用户共同使用某些文件；保密：只允许被核准的用户使用，禁止其他用户窃用；保护：防止硬件偶然故障或人为破坏造成文件信息丢失，常用转储（备份）等手段。\n③共享与保密在目标上确有张力：共享扩大可访问范围，保密限制可访问范围。可通过访问控制表/权限位按用户与操作类型授权，使“授权范围内可共享、授权范围外受保密”，再配合备份实现保护。","exp":"采分点：基本操作 2 分、三个概念各 1 分、矛盾与兼顾方式 2 分。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 5 章）"},"_unit":"final"},{"qid":"cs.final-090","type":"term","topic":"6.1 数据库的定义与特点","diff":"易","stem":"请解释“数据库”。","ref":"数据库是长期储存在计算机内的、有组织的、可共享的、统一管理的相关数据的集合。它按一定的数据模型组织、描述和存储，具有冗余度较低、数据独立性较高、可供多用户共享和统一数据控制等特点。","exp":"采分点：长期存储、有组织、可共享、统一管理四个定语缺一不可；补出数据模型与低冗余、高独立性更完整。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）"},"_unit":"final"},{"qid":"cs.final-091","type":"single","topic":"6.2 数据模型","diff":"易","stem":"层次模型、网状模型和关系模型的划分原则是（　）。","options":["数据之间的联系方式","文件大小","数据多少","记录长度"],"answer":[0],"exp":"三种模型的区别在于如何表示实体间的联系：层次模型用树形结构，网状模型用图（链接）结构，关系模型用二维表。与记录长度、文件大小、数据量无关。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-092","type":"single","topic":"6.6 数据库设计","diff":"易","stem":"一间宿舍可住多个学生，且一名学生只能在一间宿舍入住，则宿舍和学生之间是（　）。","options":["一对一","一对多","多对一","多对多"],"answer":[1],"exp":"以“宿舍”为一端看：一间宿舍对应多名学生，一名学生只对应一间宿舍，即 1:N（一对多）。学生—课程才是 M:N，注意方向的读法。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-093","type":"single","topic":"6.5 关系操作与 SQL","diff":"中","stem":"实现对数据库中数据的查询、插入、修改和删除等操作的数据库语言称为（　）。","options":["数据操纵语言","数据管理语言","数据定义语言","数据控制语言"],"answer":[0],"exp":"查询、插入、修改、删除属数据操纵语言 DML（SELECT/INSERT/UPDATE/DELETE）；数据定义语言 DDL 负责建表改表（CREATE/ALTER/DROP），数据控制语言 DCL 负责授权（GRANT/REVOKE）。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-094","type":"single","topic":"6.5 关系操作与 SQL","diff":"中","stem":"数据库中只存放视图的（　）。","options":["操作","对应的数据","定义","限制"],"answer":[2],"exp":"视图是虚表，数据库只保存它的定义（查询语句），查询时由定义临时导出数据，不单独存放视图对应的数据副本。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-095","type":"single","topic":"6.5 关系操作与 SQL","diff":"中","stem":"进行自然连接运算的两个关系必须具有（　）。","options":["相同的主码","相同的属性组（共同属性）","相同的关系名","相同的属性个数"],"answer":[1],"exp":"自然连接按两个关系的共同属性做等值匹配，再去掉重复列；不要求主码相同、关系名相同或属性个数相同。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-096","type":"multi","topic":"6.1 数据库的定义与特点","diff":"易","stem":"下列属于数据库系统特点的有（　）。","options":["数据冗余度较低","数据独立性较高，有统一的数据控制功能","数据各自孤立存放，不需要任何统一管理","数据共享性高，可供多个用户共享"],"answer":[0,1,3],"exp":"数据库的特点：按数据模型统一组织、共享性高、冗余度低、独立性高、统一数据控制。“各自孤立、无需统一管理”正是文件系统方式的弊端。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-097","type":"multi","topic":"6.5 关系操作与 SQL","diff":"中","stem":"下列关于关系运算的说法正确的有（　）。","options":["投影是从关系中选出满足给定条件的记录","选择是从关系中选出满足条件的记录，从行的角度进行","投影是选出若干指定字段的值，从列的角度进行","连接可把两个关系中的记录横向组合成新关系"],"answer":[1,2,3],"exp":"选择管行、投影管列、连接管多表横向组合；「投影是选出满足给定条件的记录」把选择说成了投影，故错误。集合运算还有并、交、差，要求参与关系结构相容。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-098","type":"fill","topic":"6.3 关系数据库基本术语","diff":"易","stem":"在关系数据库的二维表中，列通常称为____，行称为记录。","answers":["字段","属性","字段（属性）"],"exp":"二维表对应关系：列 = 字段（属性），行 = 记录（元组），字段的取值范围称域，能唯一标识记录的字段称关键字（主码）。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）"},"_unit":"final"},{"qid":"cs.final-099","type":"fill","topic":"6.3 关系数据库基本术语","diff":"易","stem":"在关系数据库中，域是指字段的____。","answers":["取值范围","值域","取值的范围"],"exp":"域（Domain）规定某字段允许取值的集合，例如“性别”字段的域为{男，女}。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）"},"_unit":"final"},{"qid":"cs.final-100","type":"fill","topic":"6.5 关系操作与 SQL","diff":"易","stem":"关系代数中，从两个关系中找出相同元组的运算称为____运算。","answers":["交","交运算","交集"],"exp":"交运算取两关系共有的元组；并运算取两者全部元组，差运算（A－B）取属于 A 而不属于 B 的元组。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）"},"_unit":"final"},{"qid":"cs.final-101","type":"short","topic":"6.6 数据库设计","diff":"中","stem":"试说出数据库设计的基本步骤。","ref":"①需求分析：收集并分析用户的数据与处理需求。\n②概念结构设计：用 E-R 图等建立概念模型，描述实体、属性与联系。\n③逻辑结构设计：把概念模型转换为所选 DBMS 支持的数据模型（如关系模式），并规范化。\n④数据库物理设计：确定存储结构、存取路径与索引等。\n⑤数据库实施：建库建表、装载数据、编写与调试应用程序。\n⑥数据库运行和维护：投入运行后进行监控、备份、优化与调整。","exp":"采分点：六个阶段名称与顺序为主，每个阶段补一句任务说明可拿满分。E-R 图属概念结构设计，关系模式属逻辑结构设计，别串阶段。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）"},"_unit":"final"},{"qid":"cs.final-102","type":"short","topic":"6.2 数据模型","diff":"易","stem":"常用的三种数据模型是什么？各自用什么结构表示实体及其联系？","ref":"层次模型：用一棵“有向树”表示各类实体及实体间联系，每个结点代表一个记录类型，适合一对多联系。\n网状模型：用记录的集合与链接（可看作指针）表示，记录可组织成任意图，能表达多对多联系。\n关系模型：用二维表格结构表示实体及实体间联系，每个二维表称为一个关系，是目前应用最广泛的模型。","exp":"采分点：三种模型名称＋对应结构（树/图/二维表）。关系模型用表中的外键表达联系，不像前两者显式使用指针。","meta":{"source":"期末复习提纲（计导期末.docx / 3_计算机导论复习.docx）"},"_unit":"final"},{"qid":"cs.final-103","type":"short","topic":"6.1 数据库的定义与特点","diff":"难","stem":"什么是数据独立性？逻辑数据独立性与物理数据独立性各指什么？","ref":"数据独立性指应用程序与数据库的结构相互独立，数据组织方式的变化不影响应用程序。\n物理数据独立性：应用程序与存储在磁盘上的数据库物理模式相互独立，改变存储设备、文件组织或索引等物理结构时，应用程序不必修改。\n逻辑数据独立性：当数据库的逻辑结构（模式，如增加字段、调整关系）发生变化时，通过外模式/视图屏蔽，使用户应用程序不必修改。\n数据独立性由数据库的三级模式（用户级/概念级/内部级）与两级映像实现。","exp":"采分点：总定义 1 分，物理独立性与逻辑独立性各 2 分。记忆口径：物理独立性管“存法变了不用改程序”，逻辑独立性管“逻辑结构变了不用改程序”。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）"},"_unit":"final"},{"qid":"cs.final-104","type":"comp","topic":"6.5 关系操作与 SQL","diff":"中","stem":"设学生表 S(Sno, Sname, Age, Sex)，课程表 C(Cno, Cname)，选课表 SC(Sno, Cno, Grade)。写出完成下列操作的 SQL 语句：①把王刚同学的信息插入学生表，学号 100001，年龄 19，性别男；②查询选修课程号为 K2 的学生的学号和成绩；③查询所有选课学生的学号、姓名、所选课程名称和成绩。","ref":"①INSERT INTO S(Sno, Sname, Age, Sex) VALUES ('100001', '王刚', 19, '男');\n②SELECT Sno, Grade FROM SC WHERE Cno = 'K2';\n③SELECT S.Sno, Sname, Cname, Grade FROM S, C, SC WHERE S.Sno = SC.Sno AND SC.Cno = C.Cno;\n（第③句也可用显式连接：SELECT S.Sno, Sname, Cname, Grade FROM S JOIN SC ON S.Sno = SC.Sno JOIN C ON SC.Cno = C.Cno;）","exp":"采分点：①INSERT 的列名与值一一对应、字符串加引号（2 分）；②只需查 SC 表并限定 Cno（2 分）；③三表连接必须写全两个连接条件，否则会产生笛卡尔积（3 分）。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）"},"_unit":"final"},{"qid":"cs.final-105","type":"comp","topic":"6.6 数据库设计","diff":"难","stem":"学生实体包含学号、姓名、性别、年龄，关键字为学号；课程实体包含课程号、课程名、学分数，关键字为课程号。一名学生可选修多门课程，一门课程也可被多名学生选修，学生选课后有成绩。不画图，回答：①指出实体、联系及联系类型；②“成绩”应作为哪个对象的属性？③把该概念模型转换为关系模式，写出各关系的主键与外键。","ref":"①实体：学生、课程；联系：选课；学生与课程之间为多对多（M:N）联系。若画 E-R 图：矩形表实体、椭圆表属性、菱形表联系。\n②成绩属于“选课”这一联系的属性，不应只挂在学生或课程实体上。\n③学生（学号，姓名，性别，年龄），主键：学号。\n课程（课程号，课程名，学分数），主键：课程号。\n选课（学号，课程号，成绩），主键：（学号，课程号）；外键：学号参照学生（学号），课程号参照课程（课程号）。","exp":"采分点（8 分）：M:N 判定 2 分、联系属性 1 分、三个关系模式 3 分、主外键 2 分。M:N 联系必须单独成表，联合主键由两端主键共同组成。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）"},"_unit":"final"},{"qid":"cs.final-106","type":"comp","topic":"6.6 数据库设计","diff":"难","stem":"某系统用一个关系模式保存选课信息：学生选课（学号，姓名，课程号，课程名，成绩），主键为（学号，课程号）。请指出该模式存在的问题（数据冗余、插入异常、删除异常、更新异常），并给出规范化分解后的关系模式。","ref":"问题：\n①数据冗余：同一学生的姓名、同一课程的课程名在每条选课记录中重复存储。\n②插入异常：尚未选课的学生无法录入（主键中的课程号不能为空），暂无人选修的新课程也无法录入。\n③删除异常：删除某学生最后一条选课记录会连带丢失该学生信息，删除某课程最后一条选课记录会丢失该课程信息。\n④更新异常：修改学生姓名或课程名必须同时修改多行，否则造成数据不一致。\n规范化分解：\n学生（学号，姓名），主键学号；\n课程（课程号，课程名），主键课程号；\n选课（学号，课程号，成绩），主键（学号，课程号），学号、课程号分别为外键。\n分解后非主属性完全依赖于各自主键，消除了部分依赖与上述异常。","exp":"采分点：四种问题各 1 分，分解出三个关系并说明主键 2 分。规范化的目标正是克服插入、删除异常与数据不一致（冗余）。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）"},"_unit":"final"},{"qid":"cs.final-107","type":"comp","topic":"6.5 关系操作与 SQL","diff":"中","stem":"执行以下语句建立基本表后，判断四个候选元组能否插入，并说明理由。\nCREATE TABLE Student(Sno INT NOT NULL, Sname CHAR(8) NOT NULL, Sex CHAR(2), Age SMALLINT);\n①(5051, '刘祥', '男', 21)；②('5051', '刘祥', '男', 21)；③(5052, NULL, '女', 20)；④(5053, '王芳', NULL, NULL)。","ref":"①可以插入：各列类型匹配，两个 NOT NULL 列均有值。\n②不能插入：Sno 定义为 INT，却给出字符串 '5051'，类型不符。\n③不能插入：Sname 声明为 NOT NULL，却给出 NULL。\n④可以插入：Sex 与 Age 未加非空约束，允许为 NULL，表示未知或未填。","exp":"采分点：四个判断各 1 分。考点集中在列类型与空值约束：未声明 NOT NULL 的列可以取 NULL，NULL 不等于空串或 0。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 6 章）"},"_unit":"final"},{"qid":"cs.final-108","type":"single","topic":"7.1 程序设计语言与语言层次","diff":"易","stem":"用（　）编写的程序可由计算机直接执行，不需要再翻译。","options":["机器语言","汇编语言","高级语言","伪代码"],"answer":[0],"exp":"机器语言是 CPU 可直接解读执行的二进制指令序列；汇编语言要经汇编程序翻译，高级语言要经编译或解释，伪代码只用于描述算法，不能执行。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-109","type":"single","topic":"7.1 程序设计语言与语言层次","diff":"易","stem":"采用（　）编写程序，可提高程序的移植性。","options":["机器语言","宏指令","高级语言","汇编语言"],"answer":[2],"exp":"高级语言与具体机器指令集无关，换机器只需更换编译器或解释器；机器语言与汇编语言都依赖硬件，移植性差，但执行效率高、可直接控制硬件。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-110","type":"single","topic":"7.2 程序的编译与解释","diff":"中","stem":"汇编程序（Assembler）的作用是（　）。","options":["把高级语言源程序逐句翻译并立即执行","把机器语言反译成高级语言","把多个目标程序与程序库组织成可执行代码","把汇编语言源程序翻译成机器语言目标程序"],"answer":[3],"exp":"语言处理系统分工：汇编程序把汇编语言译成目标程序；编译程序把高级语言整体译成目标程序；链接程序把目标程序与库链接成可执行代码；解释程序逐句翻译并执行。","meta":{"source":"期末复习提纲（计导期末.docx / 3_计算机导论复习.docx）","optperm":true},"_unit":"final"},{"qid":"cs.final-111","type":"single","topic":"7.5 软件生命周期","diff":"易","stem":"软件生存期（生命周期）由三个时期组成，正确的是（　）。","options":["软件定义、软件开发、运行维护","需求分析、编码、测试","计划、生产、销售","分析、设计、报废"],"answer":[0],"exp":"软件生存期 = 软件定义 + 软件开发 + 运行维护三个时期；需求分析、设计、编码、测试是各时期内的阶段。软件孕育、诞生、成长、成熟到衰亡的全过程即生命周期。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-112","type":"single","topic":"7.4 软件与软件工程","diff":"中","stem":"软件危机促使软件工程作为一门学科逐渐形成，其标志性事件是（　）。","options":["1946 年 ENIAC 诞生","1981 年 IBM PC 发布","1968 年第一届 NATO 会议提出软件工程概念","1995 年 Java 语言发布"],"answer":[2],"exp":"20 世纪 60 年代后期软件危机凸显，1968 年第一届 NATO 会议给出软件工程的早期定义：为经济地获得可靠且能在实际机器上有效运行的软件，而建立和使用完善的工程原理。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-113","type":"multi","topic":"7.3 编程范式","diff":"中","stem":"下列属于本课程所讲的编程范式的有（　）。","options":["编译式","过程式","面向对象","函数式与声明式"],"answer":[1,2,3],"exp":"四种编程范式：过程式（强调怎么做，由函数/过程组成）、面向对象（以对象为中心，数据与方法封装）、函数式（把计算看作函数求值，避免状态变化）、声明式（只描述目标是什么）。“编译式”是翻译方式，不是编程范式。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-114","type":"multi","topic":"7.1 程序设计语言与语言层次","diff":"易","stem":"下列属于高级语言特点的有（　）。","options":["开发效率高，接近自然语言表达","摆脱了汇编语言的繁琐细节","不需要编译或解释就能直接变成机器语言执行","可移植到不同计算机"],"answer":[0,1,3],"exp":"高级语言可移植、开发效率高、屏蔽底层细节，但仍必须经编译或解释才能变成机器指令执行，「不需要编译或解释就能直接执行」错误。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-115","type":"fill","topic":"7.2 程序的编译与解释","diff":"易","stem":"把高级语言程序翻译成机器语言的两种基本方式是编译和____。","answers":["解释","解释执行"],"exp":"编译是执行前整体翻译并生成目标程序，之后链接、装入运行；解释是逐句翻译并立即执行，一般不生成独立保存的目标程序。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）"},"_unit":"final"},{"qid":"cs.final-116","type":"fill","topic":"7.6 软件开发过程模型","diff":"中","stem":"面向对象方法学包括面向对象分析、面向对象设计和____。","answers":["面向对象编程","面向对象程序设计","面向对象编程（OOP）","OOP"],"exp":"面向对象方法学由 OOA（分析）、OOD（设计）、OOP（编程）组成，三者以对象模型贯穿，强调数据与操作的封装。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）"},"_unit":"final"},{"qid":"cs.final-117","type":"fill","topic":"7.6 软件开发过程模型","diff":"易","stem":"本课程介绍的两种常见软件开发过程模型是瀑布模型和____模型。","answers":["增量","增量模型"],"exp":"瀑布模型以文档为驱动、阶段严格顺序推进，适合需求明确的项目；增量模型分批交付可用功能，让用户尽早使用并逐步适应。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）"},"_unit":"final"},{"qid":"cs.final-118","type":"short","topic":"7.2 程序的编译与解释","diff":"中","stem":"简述编译与解释的区别。","ref":"编译：在执行前把整个高级语言源程序一次性翻译成对应的汇编语言或机器语言程序（目标程序），再经链接、装入后运行；目标程序可保存，重复运行不必重新翻译，执行效率较高。\n解释：解释器对高级语言源程序逐句翻译，产生对应的机器语言指令序列并立即执行，通常不生成独立保存的目标程序；便于交互调试、跨平台，但重复执行同一段代码要重复翻译，效率相对较低。","exp":"采分点：整体翻译 vs 逐句翻译、是否生成并保存目标程序、执行效率与交互性对比。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）"},"_unit":"final"},{"qid":"cs.final-119","type":"short","topic":"7.1 程序设计语言与语言层次","diff":"中","stem":"自然语言和形式语言有什么区别？","ref":"自然语言不是为特定应用人为设计的，而是在人类社会中自然进化形成的，如汉语、英语；它表达丰富，但存在歧义与冗余。\n形式语言是为了特定应用人为设计的，具有明确而严格的语法和语义规则，如程序设计语言、数学符号系统；它表达精确、无歧义，便于机器处理。","exp":"采分点：形成方式（自然进化 vs 人为设计）、规则明确性、是否有歧义、是否便于机器处理。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）"},"_unit":"final"},{"qid":"cs.final-120","type":"comp","topic":"7.6 软件开发过程模型","diff":"中","stem":"判断下列关于瀑布模型的说法正误，并说明理由：①严格规定每个阶段必须提交文档；②并不要求每个阶段交出的产品都经过质量保证小组仔细验证；③可强迫开发人员采用规范的方法（如结构化技术）；④适合需求在开发前就能明确的项目。","ref":"①正确。瀑布模型以文档为驱动，每个阶段都有明确的起点、终点和应提交的文档。\n②错误。瀑布模型恰恰要求每个阶段的产品都经过严格验证（评审、测试），确认无误后才能进入下一阶段。\n③正确。它强调按规范方法开发，例如结构化分析与设计技术。\n④正确。阶段顺序推进、回溯代价大，因此适合需求明确、变更少的项目；需求频繁变动时不适用。","exp":"采分点：四个判断各 1 分，理由 2 分。原资料第②条带正误标记为“×”，是最容易被忽略的一条。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）"},"_unit":"final"},{"qid":"cs.final-121","type":"comp","topic":"7.6 软件开发过程模型","diff":"中","stem":"某客户希望尽早拿到能完成部分核心工作的版本，后续再逐步增加功能。①应选择哪种开发过程模型？②说明它的两项主要优点。③辨析说法：“增量模型在较长时间内向用户提交可完成部分工作的产品”，这句话是否准确？","ref":"①应选择增量模型：把系统划分为若干增量，分批开发、分批交付。\n②优点：逐步增加产品功能，使用户有充裕时间学习和适应新产品；可减少全新软件一次性交付给客户组织带来的冲击；同时能较早交付可用版本、分散开发风险。\n③不准确。增量模型的要点恰恰是能较早、分阶段地提交可完成部分工作的产品，而不是“较长时间内”才提交；该说法否定了增量模型的早期交付优势，应判为错误。","exp":"采分点：模型选择 1 分、优点两条各 1 分、辨析 2 分。与瀑布模型对照：瀑布一次交付完整产品，增量多次交付可用子集。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）"},"_unit":"final"},{"qid":"cs.final-122","type":"comp","topic":"7.6 软件开发过程模型","diff":"难","stem":"比较结构化方法与面向对象方法：各自的基本思想是什么？分别更适合哪类软件？","ref":"结构化方法：面向过程，包含结构化分析、结构化设计、结构化程序设计，强调自顶向下、逐层分解，按“先做什么后做什么”组织系统。它更适合强调过程、强调数据处理的软件，如报表统计、批处理业务。\n面向对象方法：把数据和对数据的操作紧密结合，封装成对象，系统由相互作用的对象构成，包含面向对象分析、设计与编程。它更适合以功能/对象为特性、交互复杂的软件，便于复用、扩展与维护。\n两者都是使用广泛的软件工程方法学，实际项目可结合使用。","exp":"采分点：结构化=面向过程＋自顶向下（2 分），面向对象=数据与操作封装成对象（2 分），各自适用软件类型（2 分）。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 7 章）"},"_unit":"final"},{"qid":"cs.final-123","type":"comp","topic":"7.4 软件与软件工程","diff":"中","stem":"按程序规划与设计的五个步骤，说明开发一个“学生成绩管理系统”应经历的过程（每步写出该步要做什么）。","ref":"①分析问题并制定概要设计方案：明确输入（学号、课程、成绩等）、期望输出（成绩单、统计报表）、处理规则与约束。\n②详细设计（算法设计）：把功能分解为录入、修改、查询、统计等模块，写出精确的算法步骤并选定实现语言。\n③编写程序代码及文档：按设计编码，写清注释与用户文档，保证别人能看懂、便于协作与维护。\n④测试程序：对每个模块及边界情况（空成绩、满分、重复学号等）反复测试，确保各部分正确。\n⑤验证程序：通过大范围、贴近用户要求的测试整体验证，并根据反馈不断修改调整到用户满意。","exp":"采分点：五步骤各 1 分，是否落到本题系统的具体内容 1 分。注意测试与验证的层次不同：测试针对各部分正确性，验证面向用户需求的整体满足。","meta":{"source":"期末复习提纲（计导期末.docx / 3_计算机导论复习.docx）"},"_unit":"final"},{"qid":"cs.final-124","type":"single","topic":"8.3 网络拓扑结构","diff":"中","stem":"网络中任何一个工作站发生故障时，都有可能导致整个网络停止工作，这种拓扑结构是（　）。","options":["环型","总线型","星型","网状型"],"answer":[0],"exp":"环型中信号沿环逐站传递，某站或某段链路故障可能中断整个环；星型只有中央结点故障才导致全网瘫痪，总线型与网状型的单站故障影响较小。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-125","type":"single","topic":"8.6 IP 地址与域名","diff":"易","stem":"在 Internet 中，以下 IP 地址中不可能的是（　）。","options":["176.78.89.67","202.96.13.25","123.256.36.2","189.76.56.156"],"answer":[2],"exp":"IPv4 地址由 4 段组成，每段为 0～255 的十进制数。123.256.36.2 的第二段 256 超出范围，因此不可能。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-126","type":"single","topic":"8.4 OSI 参考模型","diff":"易","stem":"OSI/RM 将计算机网络体系结构的通信协议规定为（　）。","options":["5 层","7 层","3 层","4 层"],"answer":[1],"exp":"OSI 参考模型为 7 层：物理层、数据链路层、网络层、传输层、会话层、表示层、应用层；TCP/IP 体系结构常对应为 4 层，两者不要混淆。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-127","type":"single","topic":"8.4 OSI 参考模型","diff":"易","stem":"以下属于物理层的设备是（　）。","options":["网关","网桥","路由器","中继器"],"answer":[3],"exp":"中继器工作在物理层，只简单再生和转发信号以延长传输距离；网桥/交换机工作在数据链路层，路由器工作在网络层，网关做高层协议转换。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-128","type":"single","topic":"8.7 URL 与 Internet 应用","diff":"易","stem":"在网上浏览时，浏览器和 Web 服务器之间传输网页使用的协议是（　）。","options":["HTTP","IP","FTP","Telnet"],"answer":[0],"exp":"HTTP 是超文本传输协议，负责浏览器与 Web 服务器之间的网页传输；FTP 用于文件传输，Telnet 用于远程登录，IP 是网络层协议、不直接面向网页应用。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-129","type":"single","topic":"8.6 IP 地址与域名","diff":"中","stem":"IP 地址 200.64.32.65 的主机号是（　）。","options":["200.64","32.65","65","200.64.32"],"answer":[2],"exp":"首字节 200 落在 192～223，属 C 类地址，默认前 3 个字节为网络号（200.64.32），最后 1 个字节为主机号，即 65。A 类首字节 1～126、B 类 128～191。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-130","type":"multi","topic":"8.2 计算机网络的分类","diff":"易","stem":"下列属于按覆盖范围划分的计算机网络类型的有（　）。","options":["星型网","局域网（LAN）","城域网（MAN）","广域网（WAN）"],"answer":[1,2,3],"exp":"按覆盖范围分 LAN/MAN/WAN，覆盖全球的最大广域网是 Internet；星型、环型、总线型等是按拓扑结构分类，不是覆盖范围。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-131","type":"multi","topic":"8.6 IP 地址与域名","diff":"中","stem":"下列关于 IP 地址的说法正确的有（　）。","options":["IP 地址中包含网络号和主机号两部分","IP 地址用于标识 Internet 上的网络设备，使数据能有效到达目的地","主机号用来指明主机所从属的物理网络编号","IPv4 地址长 32 位（4 字节），IPv6 地址长 128 位（16 字节）"],"answer":[0,1,3],"exp":"网络号标识主机所属的物理网络，主机号标识该网络中的具体主机；「主机号用来指明主机所从属的物理网络编号」把两者对调，故错误。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）","optperm":true},"_unit":"final"},{"qid":"cs.final-132","type":"fill","topic":"8.7 URL 与 Internet 应用","diff":"易","stem":"在 Internet 的基本服务中，远程登录所使用的协议（命令）是____。","answers":["Telnet","telnet","TELNET"],"exp":"Telnet 用于远程登录，把本地终端接入远端主机；FTP 传文件，HTTP 传网页，三者功能要分清。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）"},"_unit":"final"},{"qid":"cs.final-133","type":"fill","topic":"8.7 URL 与 Internet 应用","diff":"中","stem":"URL 中，协议名与域名之间用____隔开，域名与后面的路径（文件名）之间用“/”隔开。","answers":["://","：//",":// "," : //"],"exp":"URL 形式为 协议名://域名/路径，如 http://www.bjfu.edu.cn/index.html，其中协议名是 http。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）"},"_unit":"final"},{"qid":"cs.final-134","type":"fill","topic":"8.1 计算机网络的定义与功能","diff":"中","stem":"世界上第一个计算机网络 ARPANET 诞生于____年。","answers":["1969","1969年","1969 年"],"exp":"ARPANET 于 1969 年建成，是 Internet 的前身；1989 年是万维网（WWW）提出的年份，注意区分。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）"},"_unit":"final"},{"qid":"cs.final-135","type":"fill","topic":"8.2 计算机网络的分类","diff":"易","stem":"覆盖全球的最大计算机广域网是____。","answers":["Internet","因特网","互联网","internet"],"exp":"Internet（因特网）是覆盖全球的广域网，采用的标准网络协议是 TCP/IP。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）"},"_unit":"final"},{"qid":"cs.final-136","type":"short","topic":"8.4 OSI 参考模型","diff":"中","stem":"写出 OSI 参考模型各层名称（自下而上），并简述每层的主要功能。","ref":"①物理层：在物理介质中传输比特流。\n②数据链路层：负责两个相邻站点之间点对点的帧传递与差错控制。\n③网络层：负责源站点到目的站点之间分组的传送与路径选择。\n④传输层：负责整个消息端到端的传送，把消息看作完整实体，保证其正确到达目的地的传输层。\n⑤会话层：控制用户间的会话，可设置同步点以便出错后恢复传输。\n⑥表示层：解决两个系统交换信息的语法、语义问题，如格式转换、压缩与解压缩。\n⑦应用层：使用户能方便地利用网络进行软件开发、访问网络应用等。","exp":"采分点：七层名称与顺序 3 分，功能各约 1 分。口诀“物数网传会表应”；数据链路层管相邻结点，网络层管源到目的选路，传输层管端到端。","meta":{"source":"期末复习提纲（计导期末.docx / 3_计算机导论复习.docx）"},"_unit":"final"},{"qid":"cs.final-137","type":"short","topic":"8.4 OSI 参考模型","diff":"难","stem":"说明中继器、网桥（交换机）、路由器、网关的区别（从工作层次与作用回答）。","ref":"中继器：运行在 OSI 第一层（物理层），对信号再生、还原并转发，用于扩大网络传输距离，只能互连完全相同的两类网络。\n网桥：运行在前两层（物理层、数据链路层），根据帧的物理地址（MAC 地址）过滤和转发帧；交换机可看作多端口的网桥，为子网提供更多连接端口。\n路由器：运行在第三层（网络层），连接局域网、城域网和广域网，根据数据包的逻辑地址（IP 地址）选择路径。\n网关：充当协议转换器的连接设备，能理解不同的网络协议，实现不同协议网络之间的连接与翻译；当今网关与路由器常被混用，差异正逐渐消失。","exp":"采分点：四种设备各 1～2 分，关键是“工作层次＋依据什么地址/协议做转发”。","meta":{"source":"期末复习提纲（计导期末.docx / 3_计算机导论复习.docx）"},"_unit":"final"},{"qid":"cs.final-138","type":"comp","topic":"8.5 TCP/IP 体系结构","diff":"难","stem":"①写出 TCP/IP 体系结构的四个层次，并说明它们与 OSI 七层模型的对应关系；②在 TCP/IP 各层各举出一到两个协议实例。","ref":"①TCP/IP 四层（自下而上）：网络接口层、网际层（IP 层）、传输层、应用层。\n对应关系：网络接口层 ≈ OSI 的物理层＋数据链路层；网际层 ≈ 网络层；传输层 ≈ 传输层；应用层 ≈ 会话层＋表示层＋应用层。\n②协议实例：网络接口层如以太网（Ethernet）、Wi-Fi（IEEE 802.11）；网际层如 IP（及 ICMP、ARP）；传输层如 TCP、UDP；应用层如 HTTP、FTP、Telnet、DNS、SMTP。","exp":"采分点：四层名称 2 分、对应关系 2 分、协议实例 2 分。Internet 采用的标准协议族就是 TCP/IP，OSI 是理论参考模型。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）"},"_unit":"final"},{"qid":"cs.final-139","type":"comp","topic":"8.3 网络拓扑结构","diff":"中","stem":"一个网吧要把 30 台计算机连成网络并接入 Internet。①该网络属于局域网、城域网还是广域网？②推荐一种拓扑结构并说明理由；③需要哪些基本网络设备，各起什么作用？④指出所选拓扑的主要缺点。","ref":"①局域网（LAN）：在一个网吧这样方圆几千米以内的区域内，由多台计算机互联而成。\n②推荐星型：各计算机分别连接到中央设备，便于管理与故障定位，单台计算机或其网线故障不影响其他机器，扩展方便。\n③设备：交换机（数据链路层，按 MAC 地址转发帧，为多台计算机提供端口）；路由器（网络层，按 IP 地址选择路径，把局域网接入 Internet）；还需网卡、双绞线等，必要时配光纤与光猫。\n④缺点：依赖中央设备，中央设备故障会导致全网瘫痪；且每个结点都需独立链路，布线成本相对较高。","exp":"采分点：LAN 判定 1 分、拓扑与理由 2 分、设备与作用 2 分、缺点 1 分。与环型对照：环型单站故障可能影响全网，正是不选它的原因。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）"},"_unit":"final"},{"qid":"cs.final-140","type":"comp","topic":"8.1 计算机网络的定义与功能","diff":"中","stem":"某宽带标称带宽 100Mb/s。①理论上下载一个 250MB 的文件最少需要多少秒？②若实际下载速度稳定在 10MB/s，需要多少秒？③说明理论值与实际值存在差别的原因。","ref":"①带宽单位为比特每秒，文件大小单位为字节，先统一单位：250MB = 250 × 8 = 2000Mb。\n理论最短时间 = 2000Mb ÷ 100Mb/s = 20 秒。\n②按实际速度：250MB ÷ 10MB/s = 25 秒。\n③带宽 100Mb/s 对应的理论下载速度上限为 100 ÷ 8 = 12.5MB/s，实际还受协议开销、服务器限速、网络拥塞与丢包重传等影响，因此低于理论值、耗时更长。","exp":"采分点：①单位换算 1B = 8b 与 20 秒（2 分）；②25 秒（1 分）；③理论上限 12.5MB/s 及损耗原因（2 分）。易错：直接用 250 ÷ 100 得 2.5 秒，是比特与字节混用。","meta":{"source":"Notion 课程讲义与 2026 版课件（第 8 章）"},"_unit":"final"}]}],"wrong":{"exitStreak":1},"mastery":{"wAll":0.4,"wRecent":0.6,"recentN":5,"weakBelow":60,"solidAt":85,"solidStreak":4,"passMinQ":4,"passRate":0.9,"dueDays":[1,3,7]},"codec":{"version":10,"gidBits":32,"budgetBytes":6000},"order":["g7b36b9f9","geb76ff8a","g5604cb4e","gbbf40dfe","g53d3c631","gc8006e41","gdde89a21","gffcece9c","gbf4af0af","gf58d538b","g986a45cb","g16fafab6","g390c53cf","gd341e104","g5caa97bb","g63505a11","g262242e2","g53357d53","g15895c5a","gb37205e6","ga8ff66f5","gf78a1598","g2312f909","gd84ac421","g531e9c29","g11a301b7","g9182d1cb","g5ac960f1","g879fc5c7","g7d406c09","ge31b0414","ga0a1269f","gd6d7ba22","g96ce59ac","g1d239cea","g40f44857","g039b0e40","g2f3b78a4","g01c4cc52","g8a075482","g60a43282","gc2a5be02","g429eefc9","g9336931d","g1ca6d6e6","g3929ecd5","g6973d129","g3abb4969","ge0a933a7","gb120c052","g7d8fc4da","g1b380426","g97d834a5","g741c176d","gf4dc7861","g1235df51","g4f107c97","g8fdb65e0","g698ac205","ge61b55d3","g667cadf8","gabc70a0d","g77e9b112","g4       if (patch.p && patch.p.length) base.p = patch.p.slice().sort(function (a, b) { return a - b; });
      if (patch.x != null) base.x = patch.x;
      if (patch.m) base.m = patch.m;
      if (patch.c != null) base.c = patch.c;
      if (patch.self) base.self = true;
      return base;

    var out = { ok: prev.ok, at: prev.at };
    if (prev.p) out.p = prev.p.slice();
    if (prev.x != null) out.x = prev.x;
    if (prev.m) out.m = prev.m;
    if (prev.c != null) out.c = prev.c;

  Site.prototype.migrateLegacy = function () {
    var store = this.store;
    if (store.get('migrated', null)) return { skipped: true, ans: 0, wrong: 0, fav: 0 };
    if (typeof localStorage === 'undefined' || !localStorage.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    var idMap = this.legacyIdMap || {};
    var ans = store.get('ans', {});
    var wrong = store.get('wrong', {});
    var fav = store.get('fav', {});
    var self = this;
    var counts = { ans: 0, wrong: 0, fav: 0, orphan: 0 };
    var handled = [];

    function resolve(key) {
      if (/^g[0-9a-f]{8}([0-9a-f]{8})?$/.test(key)) return key;
      return idMap[key] || null;
    }

    var names = [];
    for (var i = 0; i < localStorage.length; i++) names.push(localStorage.key(i));

    names.forEach(function (name) {
      var m = LEGACY_RE.exec(name);
      if (!m) return;
      var kind = m[1];
      var raw;
      try { raw = JSON.parse(localStorage.getItem(name) || 'null'); } catch (e) { return; }
      handled.push(name);

      eachLegacyEntry(raw, function (key, val) {
        var gid = resolve(key);
        if (!gid) { counts.orphan++; return; }
        if (kind === 'ans') {
          var rec = toRecord(val);
          if (!rec) return;
          if (!ans[gid]) { ans[gid] = rec; counts.ans++; }
          else if (ans[gid].ok === null && rec.ok !== null) { ans[gid] = rec; counts.ans++; }
        } else if (kind === 'wrong') {
          if (!wrong[gid]) { wrong[gid] = typeof val === 'number' ? val : Date.now(); counts.wrong++; }
        } else if (kind === 'fav') {
          if (!fav[gid]) { fav[gid] = (val && typeof val === 'object' && typeof val.t === 'number') ? val.t : Date.now(); counts.fav++; }
        }
      });
    });

    if (!handled.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    store.set('ans', ans);
    store.set('wrong', wrong);
    store.set('fav', fav);
    store.set('migrated', { at: Date.now(), from: handled, counts: counts });
    // 旧键一律不删：回退到旧页面仍可用（规范 8.2 第 4 条）
    return counts;
  };

  // 导入：只覆盖作用域内，域外原样保留（规范 3.3）
  Site.prototype.importCode = function (code) {
    var snapshot = {
      ans: this.store.get('ans', {}), wrong: this.store.get('wrong', {}), fav: this.store.get('fav', {})
    };
    this.store.set('bak', { at: Date.now(), data: snapshot });

    var got = this.decode(code);
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var self = this;
    var touched = 0;

    Object.keys(got.ans).forEach(function (g) {
      var incoming = got.ans[g];
      if (got.texts[g] != null) incoming.x = cleanText(got.texts[g]);
      ans[g] = mergeRecord(ans[g] || null, incoming);
      if (incoming.ok === false) wrong[g] = Date.now();
      touched++;
    });
    Object.keys(got.fav).forEach(function (g) { fav[g] = fav[g] || Date.now(); });

    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    return { kind: got.kind, key: got.key, count: touched, v: got.v || 10 };
  };

  Site.prototype.undoImport = function () {
    var bak = this.store.get('bak', null);
    if (!bak) return false;
    this.store.set('ans', bak.data.ans || {});
    this.store.set('wrong', bak.data.wrong || {});
    this.store.set('fav', bak.data.fav || {});
    return true;
  };

  /* ---- 统计（三级口径，分母一律 gid 去重） ---- */

  Site.prototype.stats = function (unitKey) {
    var self = this;
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var gids = unitKey ? this.scopeGids('unit', unitKey) : this.order.slice();
    var seen = {}, total = 0, answered = 0, correct = 0, wrongN = 0, favN = 0;
    gids.forEach(function (g) {
      if (seen[g]) return;
      seen[g] = 1;
      total++;
      var r = ans[g];
      if (r) {
        answered++;
        if (r.ok === true) correct++;
      }
      if (wrong[g]) wrongN++;
      if (fav[g]) favN++;
    });
    return {
      total: total, answered: answered, correct: correct,
      rate: answered ? Math.round(100 * correct / answered) : null,
      wrong: wrongN, fav: favN
    };
  };

  var QB = {
    fpNorm: fpNorm, fpHash: fpHash, fingerprint: fingerprint,
    norm: norm, judge: judge, fuzzyEq: fuzzyEq, cleanText: cleanText,
    maskWidth: maskWidth, mergeRecord: mergeRecord,
    Store: Store, Site: Site,
    create: function (def, store) { return new Site(def, store); }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = QB;
  else root.QB = QB;
})(typeof globalThis !== 'undefined' ? globalThis : this);

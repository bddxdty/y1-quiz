          if (!wrong[gid]) { wrong[gid] = typeof val === 'number' ? val : Date.now(); counts.wrong++; }
        } else if (kind === 'fav') {
          if (!fav[gid]) { fav[gid] = (val && typeof val === 'object' && typeof val.t === 'number') ? val.t : Date.now(); counts.fav++; }
        }
      });
    });

    if (!handled.length) return { skipped: true, ans: 0, wrong: 0, fav: 0 };

    store.set('ans', ans);
    store.set('wrong', wrong);
    store.set('fav', fav);
    store.set('migrated', { at: Date.now(), from: handled, counts: counts });
    // 旧键一律不删：回退到旧页面仍可用（规范 8.2 第 4 条）
    return counts;
  };

  // 导入：只覆盖作用域内，域外原样保留（规范 3.3）
  Site.prototype.importCode = function (code) {
    var snapshot = {
      ans: this.store.get('ans', {}), wrong: this.store.get('wrong', {}), fav: this.store.get('fav', {})
    };
    this.store.set('bak', { at: Date.now(), data: snapshot });

    var got = this.decode(code);
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var self = this;
    var touched = 0;

    Object.keys(got.ans).forEach(function (g) {
      var incoming = got.ans[g];
      if (got.texts[g] != null) incoming.x = cleanText(got.texts[g]);
      ans[g] = mergeRecord(ans[g] || null, incoming);
      if (incoming.ok === false) wrong[g] = Date.now();
      touched++;
    });
    Object.keys(got.fav).forEach(function (g) { fav[g] = fav[g] || Date.now(); });

    this.store.set('ans', ans);
    this.store.set('wrong', wrong);
    this.store.set('fav', fav);
    return { kind: got.kind, key: got.key, count: touched, v: got.v || 10 };
  };

  Site.prototype.undoImport = function () {
    var bak = this.store.get('bak', null);
    if (!bak) return false;
    this.store.set('ans', bak.data.ans || {});
    this.store.set('wrong', bak.data.wrong || {});
    this.store.set('fav', bak.data.fav || {});
    return true;
  };

  /* ---- 统计（三级口径，分母一律 gid 去重） ---- */

  Site.prototype.stats = function (unitKey) {
    var self = this;
    var ans = this.store.get('ans', {});
    var wrong = this.store.get('wrong', {});
    var fav = this.store.get('fav', {});
    var gids = unitKey ? this.scopeGids('unit', unitKey) : this.order.slice();
    var seen = {}, total = 0, answered = 0, correct = 0, wrongN = 0, favN = 0;
    gids.forEach(function (g) {
      if (seen[g]) return;
      seen[g] = 1;
      total++;
      var r = ans[g];
      if (r) {
        answered++;
        if (r.ok === true) correct++;
      }
      if (wrong[g]) wrongN++;
      if (fav[g]) favN++;
    });
    return {
      total: total, answered: answered, correct: correct,
      rate: answered ? Math.round(100 * correct / answered) : null,
      wrong: wrongN, fav: favN
    };
  };

  var QB = {
    fpNorm: fpNorm, fpHash: fpHash, fingerprint: fingerprint,
    norm: norm, judge: judge, fuzzyEq: fuzzyEq, cleanText: cleanText,
    maskWidth: maskWidth, mergeRecord: mergeRecord,
    Store: Store, Site: Site,
    create: function (def, store) { return new Site(def, store); }
  };

  if (typeof module !== 'undefined' && module.exports) module.exports = QB;
  else root.QB = QB;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>/* qb-index.js — 入口页（题库集首页 / 大一题库首页共用）
 * 只读 window.QB_INDEX，进度直接从状态层读，不依赖各练习页写入的汇总值（规范 6.6）。
 */
(function () {
  'use strict';

  var data = window.QB_INDEX;
  if (!data) return;
  var $ = function (s) { return document.querySelector(s); };

  function readTable(name) {
    try {
      var raw = localStorage.getItem('qb.site.' + name + '.v1');
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function render() {
    var ans = readTable('ans'), wrong = readTable('wrong'), fav = readTable('fav');
    var host = $('#groups');
    host.innerHTML = '';

    var totalAll = 0, seen = {}, doneAll = 0, wrongAll = 0, correctAll = 0;

    data.groups.forEach(function (g) {
      var total = 0, done = 0, correct = 0, bad = 0, f = 0;
      g.gids.forEach(function (gid) {
        if (seen[gid]) return;          // 跨题组副本只算一次（规范 5.7 口径去重）
        seen[gid] = 1;
        total++;
        var r = ans[gid];
        if (r) { done++; if (r.ok === true) correct++; }
        if (wrong[gid]) bad++;
        if (fav[gid]) f++;
      });
      totalAll += total; doneAll += done; wrongAll += bad; correctAll += correct;

      var card = el('a', 'card');
      card.href = g.href;
      var head = el('div', 'card-head');
      head.appendChild(el('span', 'card-kind k-' + (g.kind || 'unit'), g.kindLabel || '题库'));
      head.appendChild(el('span', 'card-title', g.label));
      card.appendChild(head);
      if (g.title) card.appendChild(el('div', 'card-sub', g.title));
      if (g.desc) card.appendChild(el('p', 'card-desc', g.desc));

      var row = el('div', 'card-nums');
      row.appendChild(el('span', null, total + ' 题'));
      row.appendChild(el('span', null, done ? Math.round(100 * done / total) + '% 已答' : '未开始'));
      if (bad) row.appendChild(el('span', 'n-bad', bad + ' 错题'));
      if (f) row.appendChild(el('span', 'n-fav', f + ' 收藏'));
      card.appendChild(row);

      var bar = el('div', 'card-bar');
      var fill = el('i');
      fill.style.width = (total ? Math.round(100 * done / total) : 0) + '%';
      bar.appendChild(fill);
      card.appendChild(bar);

      host.appendChild(card);
    });

    var sum = $('#sum');
    if (sum) {
      sum.innerHTML = '';
      [['题量', totalAll], ['已答', doneAll],
       ['正确率', doneAll ? Math.round(100 * correctAll / doneAll) + '%' : '—'],
       ['错题', wrongAll]].forEach(function (it) {
        var c = el('div', 'stat');
        c.appendChild(el('div', 'stat-k', it[0]));
        c.appendChild(el('div', 'stat-v', String(it[1])));
        sum.appendChild(c);
      });
    }
  }

  function init() {
    $('#site-title').textContent = data.title || '题库';
    if (data.subtitle) $('#site-sub').textContent = data.subtitle;
    var back = $('#back');
    if (data.back) { back.href = data.back.href; back.textContent = data.back.label; }
    else back.style.display = 'none';
    render();
    window.addEventListener('storage', render);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
